        note: ray vs BoundingSphere3D, GetPositionCceFromEcl, GetLatitudeFromCce / GetLongitudeFromCce
      - slug: draw-great-circle-on-planet
        title: Draw a great-circle arc over a planet without drawing through it
        note: Rodrigues rotation; skip samples whose normal faces away from the camera
  - id: mods/ksa-measuretools/features/editor-measuring
