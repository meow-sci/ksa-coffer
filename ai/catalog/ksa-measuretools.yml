    lifecycle: [frame:input, frame:draw-ui]
    hooks: ["harmony-postfix KSA.Program.DrawProgramMenusHook", "harmony-prefix KSA.Program.OnMouseButton", "starmap StarMapAfterGui"]
    game_types: [KSA.VehicleEditor, KSA.VehicleEditingSpace, KSA.PartTree, KSA.Part, KSA.Program, KSA.Camera, KSA.CameraMode]
