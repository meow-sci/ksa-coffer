    howto_topics:
      - slug: vehicle-editor-lifecycle
        title: Vehicle editor lifecycle for mods
        note: created from the menu or OnFrameEditor, OnFrame before StarMapAfterGui, OnDrawUi after, disposed in PrepareFrame
      - slug: access-parts-in-the-editor
        title: Access the craft and in-hand parts in the vehicle editor
        note: EditingSpace.Parts/AllParts and UnattachedPartTrees; part transforms are uncached while the editor is open
      - slug: add-editor-menu-entry
