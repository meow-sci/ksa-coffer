  - id: mods/ksa-measuretools/features/surface-great-circle-tool
    title: Surface tool with body-fixed pins, great-circle distance and an occlusion-aware arc
    category: celestials
    submod: null
    summary: Ray versus mean-radius spheres for surface pins stored as body-fixed lat/lon, haversine distance, chord and initial bearing, and a Rodrigues-sampled great-circle arc that hides far-hemisphere samples.
    novelty: medium
