    game_types: [KSA.Celestial, KSA.Camera, KSA.Ray, KSA.CelestialSystem, KSA.Astronomical]
    key_paths: [MeasureTools/Features/Measure/MapPicker.cs, MeasureTools/Features/Measure/Measurement.cs, MeasureTools/Features/Measure/MeasureOverlay.cs]
    howto_topics:
