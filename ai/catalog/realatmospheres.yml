      moon no longer flickers its planet to a distant render; IL shape and local slots are verified first.
    novelty: high
    techniques: [harmony-transpiler, reflection]
    lifecycle: [startup:starmap-before-main, frame:celestials, frame:render]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-transpiler KSA.CelestialSystem.GetNearbyAstronomical"
    game_types: [KSA.CelestialSystem, KSA.Program, KSA.Camera, KSA.Astronomical]
    key_paths: [NearbyBody.cs]
    howto_topics:
      - slug: harmony-transpiler-call-replacement
        title: Replace an inline comparison with a helper call in a transpiler
        note: pass a local by ref with ldloca.s; nop out the now-redundant store
      - slug: change-which-body-renders-in-detail
