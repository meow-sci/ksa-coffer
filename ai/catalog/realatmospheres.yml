    game_types: [RenderCore.ShaderModuleUtils, KSA.AtmosphereRenderer, KSA.Atmosphere.Rendering.ShaderStructs.AtmosphereData]
    key_paths: [Payloads.cs, AtmosphereTables.Generated.cs, ShadowBuilder.cs]
    howto_topics:
      - slug: custom-atmosphere-density-profile-in-shaders
        title: Use a custom density profile in KSA's atmosphere shaders
        note: rewrite every density site so all LUTs integrate the same function
      - slug: per-body-branches-in-shared-shaders
        title: Branch per body inside shared game shaders
