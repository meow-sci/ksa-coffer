      two-part Pluto haze phase, so new per-body behaviour needs no new uniforms.
    novelty: high
    techniques: [glsl-shader, xml-patch, code-generation]
    lifecycle: [startup:starmap-before-main, render:atmosphere]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-prefix RenderCore.ShaderModuleUtils.FromFile"
    game_types: [KSA.AtmosphereRenderer, KSA.MieScatteringReference]
    key_paths: [Payloads.cs, ShadowBuilder.cs, make_mars_phase_lut.py, mars_dust_mie.py]
    howto_topics:
      - slug: flags-through-existing-xml-values
        title: Pass flags to shaders through out-of-range XML values
        note: sentinel asymmetry values, no new uniforms or C# hooks
      - slug: custom-mie-phase-function
        title: Replace the atmosphere's Mie phase function
        note: cut the stock span between known anchors and insert a dispatcher
  - id: mods/realatmospheres/features/atmosphere-uniform-side-channel
    title: Atmosphere uniform side channel
    category: shaders
    submod: null
    summary: >-
      Around AtmosphereRenderer.FillPlanetAtmosphereData a prefix temporarily sets the ozone extent of
      haze bodies to signed sim seconds (clock plus on/off switch) and a postfix on the boxed returned
      struct writes the spin axis and angle into unused ring slots; the renderer's private
      _planetLutsValid is cleared when the switch changes.
    novelty: high
    techniques: [harmony-prefix, harmony-postfix, reflection, glsl-shader]
    lifecycle: [render:atmosphere]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-prefix KSA.AtmosphereRenderer.FillPlanetAtmosphereData"
      - "harmony-postfix KSA.AtmosphereRenderer.FillPlanetAtmosphereData"
      - "reflection KSA.AtmosphereRenderer._planetLutsValid"
      - "reflection KSA.DistanceReference._value"
      - "reflection KSA.Universe.GetElapsedTime"
      - "reflection KSA.Celestial.GetRotationAxisCce"
    game_types: [KSA.AtmosphereRenderer, KSA.Atmosphere.Rendering.ShaderStructs.AtmosphereData, KSA.AtmosphereReference, KSA.DistanceReference, KSA.Universe, KSA.UniverseTime, KSA.Celestial, KSA.PlanetTransparenciesRenderer]
    key_paths: [ModMain.cs, Payloads.cs]
    howto_topics:
      - slug: pass-time-to-shaders
        title: Pass simulation time to stock shaders
        note: sim clock freezes on pause and scales with warp; wall-clock does not
      - slug: smuggle-data-through-unused-uniform-fields
        title: Send extra per-frame data to stock shaders without new uniforms
        note: temporary value swap during the fill call, or edit the returned struct in a postfix
      - slug: invalidate-atmosphere-luts
        title: Force KSA to regenerate a body's atmosphere LUTs
        note: InvalidatePlanetLuts(body) or clear _planetLutsValid
      - slug: player-time-vs-sim-time
        title: Player time versus simulation time
        note: Universe.GetElapsedTime is the last applied sim step
  - id: mods/realatmospheres/features/haze-band-sky-march
    title: Haze-band sky march
    category: shaders
    submod: null
    summary: >-
      Stratified haze bands baked into LUT density for thin hazes and, for sky pixels, a per-pixel
      raymarch inserted in Atmosphere.comp that mirrors the stock integrator, adds horizontal 3D-noise
      structure and is blended over the azimuth-free sky LUT only where a band can be seen.
    novelty: high
    techniques: [glsl-shader, harmony-prefix]
    lifecycle: [startup:starmap-before-main, render:atmosphere]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-prefix RenderCore.ShaderModuleUtils.FromFile"
      - "harmony-prefix KSA.AtmosphereRenderer.FillPlanetAtmosphereData"
    game_types: [KSA.AtmosphereRenderer, KSA.PlanetTransparenciesRenderer]
    key_paths: [Payloads.cs, ShadowBuilder.cs]
    howto_topics:
      - slug: per-pixel-atmosphere-raymarch-over-luts
        title: Add per-pixel atmosphere detail on top of KSA's sky LUTs
        note: mirror the stock integration, blend by tangent altitude, cull invisible work
  - id: mods/realatmospheres/features/cloud-face-lighting
