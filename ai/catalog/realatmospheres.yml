        title: Keep dense volumetric clouds bright at large step sizes
        note: light at the first optical depth, not the step's far end
  - id: mods/realatmospheres/features/volumetric-cloud-map-flow-and-lift
    title: Volumetric cloud map flow and faint-cloud lift
