    submod: null
    summary: >-
      One injected AtmosphereDensityFalloff replaces six exponential density sites in four atmosphere
      shaders; it looks up generated ln-density tables recognised by body radius plus the exact scale
      height the mod wrote, adds a double-exponential Mars dust layer and an altitude-dependent Titan
      Rayleigh colour.
    novelty: high
    techniques: [glsl-shader, harmony-prefix, code-generation]
    lifecycle: [startup:starmap-before-main, render:atmosphere]
    hooks:
      - "starmap StarMapBeforeMain"
