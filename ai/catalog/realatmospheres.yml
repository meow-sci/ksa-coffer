mod: realatmospheres
repo: RealAtmospheres
ref: 19dc37a55b2e359bd8eec2f5b41722ab11ae0c46
summary: >-
  Real Atmospheres (Brimfyr) is a StarMap mod that rebuilds the Sol system's atmospheres, hazes and
  clouds from composition, particle optics and probe measurements, and replaces the flight
  atmosphere's density and pressure with measured profiles. It modifies no game files: at
  StarMapBeforeMain it copies Content/Core/Shaders and the Core XML (Astronomicals.xml and the Sol
  templates, the latter shared with a sibling mod through a mutex-guarded folder), applies hundreds of
  anchor-checked, fail-soft text edits, and redirects the game into the copies with a Harmony prefix on
  RenderCore.ShaderModuleUtils.FromFile and prefixes on four KSA.Mod loader methods. Flight tables are
  attached in a postfix on AstronomicalTemplate.OnDataLoad and served by prefixes on
  PhysicalAtmosphereReference; a prefix/postfix pair on AtmosphereRenderer.FillPlanetAtmosphereData
  smuggles the sim clock and haze spin into unused uniform fields; a transpiler fixes the nearby-body
  choice. The build references only StarMap.API and Harmony; everything else is reflection, including
  ImGui calls emitted as DynamicMethods. Offline Python generates the tables and textures.
features:
  - id: mods/realatmospheres/features/reflection-only-mod-build
    title: Reflection-only mod build
    category: getting-started
    submod: null
    summary: >-
      Compiles against StarMap.API and 0Harmony only and reaches every KSA, RenderCore and Brutal
      member by name, with parameter-name and field-type checks before each Harmony patch and one
      try/log per subsystem so a game update costs one feature, not the mod.
    novelty: medium
    techniques: [starmap-lifecycle, reflection, harmony-prefix, harmony-postfix, harmony-transpiler, fail-soft-patching]
    lifecycle: [startup:starmap-before-main]
    hooks:
      - "starmap StarMapBeforeMain"
    game_types: [KSA.Mod, RenderCore.ShaderModuleUtils, KSA.AtmosphereRenderer, KSA.Universe, KSA.CelestialSystem, KSA.PhysicalAtmosphereReference]
    key_paths: [RealAtmospheres.csproj, ModMain.cs, FlightAtmospheres.cs]
    howto_topics:
      - slug: reflection-with-visible-breakage
        title: Reach game members by reflection and log what breaks
        note: one consequence sentence per failed lookup; try old and new member names
      - slug: check-harmony-target-shape-before-patching
        title: Check a patch target's parameter names and field types before patching
        note: Harmony binds injected args by name and throws at patch time
      - slug: build-a-mod-without-game-references
        title: Build a KSA mod that references only StarMap.API and Harmony
        note: trades compile-time safety for resilience to game assembly changes
  - id: mods/realatmospheres/features/shader-file-redirect
    title: Shader file redirect into a patched shadow tree
    category: shaders
    submod: null
    summary: >-
      Copies the whole Content/Core/Shaders tree into the mod folder each launch and prefixes
      ShaderModuleUtils.FromFile to rewrite paths into it, so shaderc's requesting-file-relative
      includes also resolve to the patched copies; Planet.Render.Core.dll is preloaded into the game's
      load context so the patched type is the one the game uses.
    novelty: high
    techniques: [harmony-prefix, reflection, glsl-shader, assembly-load-context]
    lifecycle: [startup:starmap-before-main, startup:asset-load]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-prefix RenderCore.ShaderModuleUtils.FromFile"
    game_types: [RenderCore.ShaderModuleUtils, KSA.ShaderReference, RenderCore.Shaders.ShaderCompilerResolve, Brutal.ShaderCApi.ShaderC, KSA.AssetReloader.ShaderReloader, KSA.FileReference, KSA.ModLibrary, RenderCore.Pipelines.SimpleShaderStages, KSA.Mod]
    key_paths: [ModMain.cs, ShadowBuilder.cs]
    howto_topics:
      - slug: replace-stock-shaders-without-editing-game-files
        title: Replace stock shaders without editing game files
        note: redirect FromFile into a full patched copy so includes follow
      - slug: patch-a-lazily-loaded-game-assembly
        title: Patch a type in a game assembly that is not loaded yet
        note: LoadFromAssemblyPath into the KSA assembly's AssemblyLoadContext at BeforeMain
      - slug: patch-code-that-runs-during-game-startup
        title: Patch code that runs during game startup
        note: StarMapBeforeMain is the only hook before ModLibrary.PrepareAll and shader loading
      - slug: patch-code-running-on-threadpool
        title: Write Harmony patches that run on thread-pool threads
        note: stock shaders compile in parallel inside ModLibrary.LoadAll
  - id: mods/realatmospheres/features/shadow-tree-anchor-patching
    title: Anchor-verified text patching of the shadow tree
    category: shaders
    submod: null
    summary: >-
      (stock, corrected, marker) triples and (file, stock, patch, count) sites applied to LF-normalized
      copies, exact-count checks, all-or-nothing per file, idempotent markers, asset-gated insertions and
      invariant-culture numbers; every anchor was verified against build 2026.10.10.5554.
    novelty: high
    techniques: [glsl-shader, xml-patch, fail-soft-patching]
    lifecycle: [startup:starmap-before-main]
    hooks:
      - "starmap StarMapBeforeMain"
    game_types: []
    key_paths: [ShadowBuilder.cs, Payloads.cs]
    howto_topics:
      - slug: text-patch-game-glsl-safely
        title: Text-patch game GLSL so it survives game updates
        note: exact anchor counts, markers, all-or-nothing per file, log and skip on drift
      - slug: patch-game-xml-data
        title: Patch game XML data
        note: anchor-based string edits on a copy as an alternative to XPath patching
      - slug: invariant-culture-in-generated-xml
        title: Format numbers for game XML in invariant culture
        note: a decimal-comma locale once stopped the game from starting
      - slug: test-shader-text-patches-offline
        title: Test shader text patches against a game build without launching it
        note: run the patch engine in a console harness on Content/Core, then compile the output with glslc
  - id: mods/realatmospheres/features/core-xml-entry-redirect
    title: Core XML entry redirect
    category: assets
    submod: null
    summary: >-
      Prefixes on Mod.PrepareSystems, LoadSystems, LoadAssetBundles and LoadEditorTagDefinitions
      rewrite the Core mod's private Assets and public SystemTemplates arrays to absolute shadow paths
      (Path.Combine passes rooted paths through), instead of patching the shared generic
      XmlLoader.Load<T>.
    novelty: high
    techniques: [harmony-prefix, reflection, xml-patch]
    lifecycle: [startup:immediate-load, startup:asset-load]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-prefix KSA.Mod.LoadAssetBundles"
      - "harmony-prefix KSA.Mod.LoadEditorTagDefinitions"
      - "harmony-prefix KSA.Mod.LoadSystems"
      - "harmony-prefix KSA.Mod.PrepareSystems"
      - "reflection KSA.Mod.Assets"
      - "reflection KSA.Mod.SystemTemplates"
    game_types: [KSA.Mod, KSA.ModLibrary, KSA.XmlLoader, KSA.SystemInfo, KSA.SystemLibrary, KSA.ConfigOnStartPopup, Core.Files.Paths.Filepath]
    key_paths: [ModMain.cs]
    howto_topics:
      - slug: redirect-game-xml-loading
        title: Make the game load a different copy of a stock XML file
        note: swap the mod's file list entry; rooted paths escape the mod folder
      - slug: avoid-patching-shared-generic-methods
        title: Avoid Harmony patches on shared generic method instantiations
        note: patching XmlLoader.Load<AssetBundle> hijacked every reference-type instantiation
      - slug: edit-system-templates-and-body-library
        title: Edit the Sol system templates and the body library
        note: library bodies via Astronomicals.xml, inline bodies in each Sol template; XmlName consistency
      - slug: file-redirects-and-xml-patch-loaders
        title: Combine file-path redirects with KittenExtensions' XML patch loader
        note: its document is keyed by the original mod.toml paths, so a swapped entry is looked up and missed
  - id: mods/realatmospheres/features/cross-mod-shared-shadow
    title: Shared shadow for two cooperating mods
    category: assets
    submod: null
    summary: >-
      Two mods that edit the same Core XML write into mods/_RealSharedShadow, guarded by a Global named
      mutex and reset to stock once per process by a launch token (process start time), with
      marker-guarded edits so either order works; one source file is linked into both projects.
    novelty: high
    techniques: [xml-patch, inter-mod-api, named-mutex]
    lifecycle: [startup:starmap-before-main]
    hooks:
      - "starmap StarMapBeforeMain"
    game_types: [KSA.ModLibrary]
    key_paths: [Shared/SharedShadow.cs, ShadowBuilder.cs, RealAtmospheres.csproj]
    howto_topics:
      - slug: coordinate-file-edits-between-mods
        title: Let two mods edit the same generated file without clobbering each other
        note: named mutex, once-per-launch reset token, idempotent marker-guarded edits
      - slug: share-source-between-mod-projects
        title: Share one source file between two mod projects with a fallback copy
        note: conditional Compile Include in the csproj
  - id: mods/realatmospheres/features/measured-flight-atmospheres
    title: Measured flight atmospheres
    category: physics
    submod: null
    summary: >-
      A postfix on AstronomicalTemplate.OnDataLoad registers a generated table per
      PhysicalAtmosphereReference in a ConditionalWeakTable and sets its private _height; prefixes on
      GetAtmosphericDensityAtAltitude/GetAtmosphericPressureAtAltitude return log-interpolated
      measured values, so drag, engine back-pressure, plumes and the atmosphere boundary follow them.
    novelty: high
    techniques: [harmony-prefix, harmony-postfix, reflection, custom-physics]
    lifecycle: [startup:asset-load, physics:vehicle-solver, frame:viewports, frame:pre-render, frame:post-render]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-postfix KSA.AstronomicalTemplate.OnDataLoad"
      - "harmony-prefix KSA.PhysicalAtmosphereReference.GetAtmosphericDensityAtAltitude"
      - "harmony-prefix KSA.PhysicalAtmosphereReference.GetAtmosphericPressureAtAltitude"
      - "reflection KSA.PhysicalAtmosphereReference._height"
    game_types: [KSA.PhysicalAtmosphereReference, KSA.AtmosphereReference, KSA.AstronomicalTemplate, KSA.CelestialTemplate, KSA.DistanceReference, KSA.PhysicsEnvironment, KSA.PhysicsStates, KSA.PhysicsBubble, KSA.VehicleUpdateState, KSA.Rocket, KSA.Vehicle, KSA.AtmosphericBody, KSA.GameViewport, KSA.Program]
    key_paths: [FlightAtmospheres.cs, AtmosphereTables.cs, AtmosphereTables.Generated.cs]
    howto_topics:
      - slug: replace-atmosphere-density-profile
        title: Replace a body's atmosphere density and pressure profile
        note: prefix the two PhysicalAtmosphereReference functions; move the private boundary height
      - slug: patch-physics-environment-on-worker-threads
        title: Patch functions the vehicle solver calls on worker threads
        note: allocation-free prefix, read-only ConditionalWeakTable filled before physics starts
      - slug: attach-mod-data-to-game-objects
        title: Attach mod data to game objects without subclassing
        note: ConditionalWeakTable keyed on the game's reference object
      - slug: read-atmosphere-state
        title: Read atmospheric density and pressure for a vehicle
        note: PhysicsEnvironment fields come from these functions and the boundary height
      - slug: atmosphere-boundary-and-physics-regions
        title: How a body's atmosphere boundary sets its physics regions
        note: Physical.Height feeds AtmosphereRadius (full-physics freefall) and GetNearSurfaceRadius (PhysicsRadius, periapsis tests)
