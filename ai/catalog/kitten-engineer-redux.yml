  - id: mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate
    title: Orbit readouts and Hohmann estimate
    category: flight-and-orbits
    submod: null
    summary: >-
      Apsides, period, apsis and node countdowns (Orbit.GetRemainingTimeTo), eccentricity vector, surface
      velocity split, lat/lon via GetCci2Ccf/GetLlaFromCcf, plus a coplanar Hohmann estimate.
    novelty: low
    techniques: [flight-math]
    lifecycle: [frame:draw-ui]
    hooks: ["harmony-postfix KSA.Vehicle.OnDrawUi"]
    game_types: [KSA.Vehicle, KSA.Orbit, KSA.StateVectors, KSA.IParentBody, KSA.TrueAnomaly, KSA.UniverseTime, KSA.Universe, KSA.Constants]
    key_paths: [OrbitSummary.cs, OrbitPlanner.cs]
    howto_topics:
      - slug: derive-orbit-readouts-from-state-vectors
        title: Derive orbit readouts from a vehicle's state vectors
        note: CCI frame; surface velocity = v - omega x r; time to node via GetRemainingTimeTo(TrueAnomaly); next periapsis of an open orbit can be in the past
      - slug: vehicle-latitude-longitude
        title: Get a vehicle's latitude and longitude
        note: PositionCci.Transform(Parent.GetCci2Ccf()) then GetLlaFromCcf
      - slug: hohmann-transfer-estimate
        title: Estimate a Hohmann transfer to a circular altitude
