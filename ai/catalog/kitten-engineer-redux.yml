  - id: mods/kitten-engineer-redux/features/dist-zip-and-post-build-deploy
    title: Minimal mod.toml, post-build deploy and release zip
    category: getting-started
    submod: null
    summary: >-
      One-line mod.toml relying on StarMap's default EntryAssembly (the manifest id, i.e. the folder
      name), post-build copy of the DLL and ModMenu.Attributes.dll, hand-committed release zip (v0.5.2
      vs v0.5.7 source); StarMapUnload runs after StarMap's id-less UnpatchAll.
    novelty: low
    techniques: [msbuild-post-build-copy, starmap-lifecycle]
    lifecycle: [startup:all-mods-loaded]
    hooks: ["starmap StarMapAllModsLoaded", "starmap StarMapUnload"]
    game_types: [KSA.ModLibrary]
    key_paths: [mod.toml, KittenEngineerRedux.csproj, Mod.cs, dist/KittenEngineerRedux.zip]
    howto_topics:
      - slug: minimal-mod-toml
        title: The smallest mod.toml StarMap accepts
        note: without [StarMap], EntryAssembly defaults to the manifest id (folder name, not the name key); a missing DLL is skipped silently
      - slug: clean-up-on-unload
        title: Clean up when the game shuts down
        note: StarMapUnload runs after StarMapCore.DeInit has removed every Harmony patch; only non-Harmony cleanup matters there
      - slug: ship-third-party-dlls-with-a-mod
        title: Ship a third-party DLL next to your mod
        note: StarMap ModAssemblyLoadContext falls back to AssemblyDependencyResolver in the mod folder
  - id: mods/kitten-engineer-redux/features/live-engine-thrust-and-twr
    title: Live and rated engine thrust with TWR
    category: vehicles-and-parts
    submod: null
    summary: >-
      Actual thrust and flow from applied RocketNozzleState.Performance of active engines; rated thrust
      from Vehicle.ComputeActiveThrust (skips dry engines) or RocketControllerData.ComputeFromCores at a
      pressure; TWR against G*M/r^2 and pressure from PhysicalAtmosphereReference at any altitude.
    novelty: medium
    techniques: [engine-performance-readout, flight-math]
    lifecycle: [frame:draw-ui, editor:draw-ui]
    hooks: ["harmony-postfix KSA.Vehicle.OnDrawUi", "harmony-postfix KSA.VehicleEditor.OnDrawUi"]
    game_types: [KSA.PartTree, KSA.EngineController, KSA.EngineControllerState, KSA.RocketCore, KSA.Rocket, KSA.RocketNozzle, KSA.RocketNozzleState, KSA.RocketPerformance, KSA.RocketControllerData, KSA.SolidMotor, KSA.Vehicle, KSA.PhysicsEnvironment, KSA.IParentBody, KSA.Astronomical, KSA.PhysicalAtmosphereReference, KSA.Constants]
    key_paths: [ActiveEngineThrust.cs, EnvironmentHelpers.cs, FlightHud.cs]
    howto_topics:
      - slug: read-live-engine-thrust
        title: Read live engine thrust and mass flow
        note: PartTree.RocketNozzles.GetModulesAndStates(core.Rocket.Nozzles) -> State.Performance; values applied at frame:apply-solvers
      - slug: engine-thrust-at-ambient-pressure
        title: Compute engine thrust and mass flow at a given ambient pressure
        note: RocketControllerData.ComputeFromCores or EngineController.VacuumData; solid motors depend on current grain
      - slug: thrust-to-weight-ratio
        title: Compute thrust-to-weight ratio against local gravity
        note: Vehicle.ComputeActiveThrust vs live nozzle thrust; g = G*M/(R+h)^2
      - slug: atmospheric-pressure-at-altitude
        title: Get atmospheric pressure at an arbitrary altitude
        note: Astronomical.GetAtmosphereReference().Physical.GetAtmosphericPressureAtAltitude; Height for the top
