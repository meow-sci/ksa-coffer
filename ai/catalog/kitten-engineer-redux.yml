mod: kitten-engineer-redux
repo: Kitten-Engineer-Redux
ref: d5786a0e75203a18a96936fb3537220d44b7a18b
summary: >-
  Kitten Engineer Redux (BarneyTheGod / BarneyCompiler) is a small StarMap mod in the style of Kerbal
  Engineer Redux. A Harmony postfix on VehicleEditor.OnDrawUi adds an editor panel with delta-v, mass,
  part count and a per-stage table read from the game's staging simulator (PartTree.PerformanceSequences,
  recomputed synchronously when dirty) or from a custom rocket-equation estimate at a chosen altitude.
  A postfix on Vehicle.OnDrawUi, filtered to the controlled vehicle in the main viewport, draws a flight
  HUD with configurable stat tiles, threshold alerts, live thrust and TWR, fuel gauges, orbit readouts,
  a suicide-burn calculator, a Hohmann planner and a 0.25 s telemetry history graph with CSV export.
  The UI is a custom draw-list widget kit with pop-out sections and a draw-list chart; settings autosave
  to JSON in Documents; a menu registers with ModMenu or falls back to a postfix on the empty
  Program.DrawProgramMenusHook. mod.toml carries only a name and relies on StarMap's default entry
  assembly; a hand-made release zip under dist/ lags the source.
features:
  - id: mods/kitten-engineer-redux/features/editor-panel-injection
    title: Editor panel injected into the vehicle editor
    category: ui
    submod: null
    summary: >-
      Postfix on VehicleEditor.OnDrawUi draws an analysis window each editor frame from
      EditingSpace.Parts, PartTree mass properties and the home body's gravity and atmosphere.
    novelty: medium
    techniques: [harmony-postfix, imgui-window, imgui-drawlist]
    lifecycle: [frame:draw-ui, editor:draw-ui]
    hooks: ["harmony-postfix KSA.VehicleEditor.OnDrawUi"]
    game_types: [KSA.VehicleEditor, KSA.VehicleEditingSpace, KSA.PartTree, KSA.OffsetMassProperties, KSA.Universe, KSA.CelestialSystem, KSA.IParentBody, KSA.Astronomical, KSA.PhysicalAtmosphereReference, KSA.GameViewport, KSA.Program]
    key_paths: [Patch_EditorPanel.cs, EditorPanel.cs, MassAnalyzer.cs, EnvironmentHelpers.cs]
    howto_topics:
      - slug: add-a-panel-to-the-vehicle-editor
        title: Add a panel to the vehicle editor
        note: postfix VehicleEditor.OnDrawUi; read EditingSpace.Parts; only draws while the editor exists
      - slug: read-craft-mass-in-the-editor
        title: Read dry, propellant and wet mass of the craft being built
        note: PartTree.ComputeInertMassPropertiesAsmb + ComputePropellantMassPropertiesAsmb, as the editor does at launch
  - id: mods/kitten-engineer-redux/features/native-stage-performance-readout
    title: Native stage performance readout
    category: vehicles-and-parts
    submod: null
    summary: >-
      Reads SequencePerformance results (delta-v, thrust, Isp, masses, phases, propellants) and derives
      burn time, TWR against a chosen g and max TWR from phases; falls back to a vacuum estimate while
      the list is dirty (editor recomputes it synchronously; in flight only the game's worker does,
      while the Sequence or EngineControl gauge canvas is enabled, which is the default).
    novelty: high
    techniques: [game-simulator-reuse]
    lifecycle: [frame:draw-ui, editor:draw-ui]
    hooks: ["harmony-postfix KSA.VehicleEditor.OnDrawUi", "harmony-postfix KSA.Vehicle.OnDrawUi"]
    game_types: [KSA.PartTree, KSA.SequencePerformanceList, KSA.SequencePerformance, KSA.SequencePhaseInfo, KSA.SequencePropellantInfo, KSA.SequenceList, KSA.Sequence, KSA.EngineController, KSA.Part, KSA.SequencePerformanceJob, KSA.PhysicsBubble, KSA.ResourceGroups, KSA.GaugeCanvas]
    key_paths: [SequenceAnalyzer.cs, StageListView.cs]
    howto_topics:
      - slug: read-stage-delta-v-from-the-staging-simulator
        title: Read per-stage delta-v from the game's staging simulator
        note: PartTree.PerformanceSequences; pair by index with SequenceList.Sequences; Volatile-published array
      - slug: sequence-performance-cache-freshness
        title: Know when the staging simulator's results are fresh
        note: editor job queued after draw-UI only while dirty; flight recompute on a vehicle-solver worker while the Sequence or EngineControl gauge canvas is enabled (default on); double-buffered publish
  - id: mods/kitten-engineer-redux/features/custom-stage-delta-v-estimator
    title: Custom stage delta-v estimator
    category: vehicles-and-parts
    submod: null
    summary: >-
      Per-stage rocket equation: jettison decoupler subtrees, sum engine thrust/flow via
      RocketControllerData.ComputeFromCores at a pressure, claim reachable tanks once via ConsumptionOrder.
    novelty: medium
    techniques: [stage-model-recompute]
    lifecycle: [frame:draw-ui, editor:draw-ui]
    hooks: ["harmony-postfix KSA.VehicleEditor.OnDrawUi", "harmony-postfix KSA.Vehicle.OnDrawUi"]
    game_types: [KSA.PartTree, KSA.SequenceList, KSA.Sequence, KSA.Part, KSA.ModuleList, KSA.Decoupler, KSA.InertMass, KSA.Tank, KSA.Mole, KSA.Liquid, KSA.Solid, KSA.EngineController, KSA.RocketControllerData, KSA.RocketCore, KSA.PlumbedCore, KSA.ResourceManager, KSA.FlowOrder, KSA.Constants]
    key_paths: [SequenceAnalyzer.cs, MassHelpers.cs, FlowHelpers.cs]
    howto_topics:
      - slug: walk-tanks-an-engine-can-reach
        title: Find the tanks an engine can draw from
        note: PlumbedCore.ResourceManager.ConsumptionOrder (FlowOrder<Tank> levels)
      - slug: estimate-stage-delta-v-yourself
        title: Estimate stage delta-v without the staging simulator
