mod: compendium
repo: Compendium
ref: 62cfbe7aafabc58cf71f7c6d618d0c5ece7c504c
summary: >-
  Compendium (nanonestor) is a StarMap mod that opens an ImGui encyclopedia window for every body of
  the loaded star systems. It joins a cross-mod JSON catalog (any mod folder may contribute files
  tagged CompendiumJson) with the live Universe.Roots body tree, computes statistics from game data,
  draws atmosphere graphs with the window draw list, loads custom fonts into the ImGui atlas, uploads
  a PNG as an ImGui Vulkan texture, overrides orbit-line visibility and color, and draws pointer lines
  from the window to the selected body. Its most technical part makes fixed stars and root
  barycenters, which are not IOrbiter and so cannot be game targets, usable as session-only navigation
  targets: a request queue drained in a prefix on InputEvents.ApplyInputEvents, transpilers that swap
  NavigationTarget.Create in the navball update and rewrite Target null tests, a prefix plus finalizer
  on FlightComputer.ComputeControl that injects a synthesized NavigationTarget on the vehicle solver
  threads (keyed by the BurnPlan the solver's flight-computer copy shares), and an UpdateGauges
  postfix with its own closest-approach search.
