    techniques: [harmony-transpiler, harmony-postfix, il-call-replacement]
    lifecycle: [startup:immediate-load, frame:apply-solvers, frame:draw-ui, frame:render]
    hooks:
      - "harmony-transpiler KSA.Vehicle.UpdateNavBallMarkers"
      - "harmony-transpiler KSA.Vehicle.UpdateNavballData"
      - "harmony-transpiler KSA.GaugeCanvas.IsContextVisible"
      - "harmony-transpiler KSA.GaugeButtonNavBallMode.IsDisabled"
      - "harmony-transpiler KSA.GaugeButtonNavBallMode.OnReleased"
      - "harmony-postfix KSA.Vehicle.IsDisabled(VehicleReferenceFrame)"
    game_types: [KSA.Vehicle, KSA.NavigationTarget, KSA.NavBallData, KSA.GaugeCanvas, KSA.GaugeButtonNavBallMode, KSA.GaugeButtonFlightComputer, KSA.VehicleReferenceFrame, KSA.VehicleReferenceFrameEx, KSA.CelestialSystem, KSA.Universe, KSA.StellarBody, KSA.Barycenter]
    key_paths: [src/RootTargetPatches.cs, src/RootTargetFlightComputerPatches.cs, src/RootNavigationTargets.cs]
    howto_topics:
      - slug: gauge-button-state-timing
        title: "Know when gauge button state is evaluated"
        note: "binding IsDisabled runs on release in the draw and again in PackData during RenderGame's gauge pass"
      - slug: harmony-transpiler-call-site-swap
        title: "Swap one call inside a game method with a Harmony transpiler"
        note: "push an extra ldarg.0 for a wider replacement signature; MoveLabelsFrom/MoveBlocksFrom"
      - slug: transpile-null-tests
        title: "Make a game's null checks see mod state"
        note: "match getter followed by brtrue/brfalse or ldnull+ceq/cgt.un; TargetMethods over several methods"
      - slug: synthesize-navigation-target
        title: "Build a NavigationTarget for an object without an orbit"
        note: "mirror NavigationTarget.Create: ECL difference to the parent, Cce2Cci rotation, GetDock2Cci"
  - id: mods/compendium/features/flight-computer-root-attitude-tracking
    title: "Flight-computer attitude tracking against a root target"
    category: flight-and-orbits
    submod: null
    summary: >-
      Prefix with __state and a restoring finalizer on FlightComputer.ComputeControl inject a
      synthesized NavigationTarget into the solver thread's ref readonly navigation struct only for
      Toward/Away or Dock-frame hold, looked up by the BurnPlan the solver's flight-computer copy
      shares; IsDisabled/Hovered patches enable the native buttons.
    novelty: high
    techniques: [harmony-prefix, harmony-finalizer, harmony-postfix, harmony-state]
    lifecycle: [physics:vehicle-solver, frame:apply-solvers, frame:input, frame:draw-ui, frame:render]
    hooks:
      - "harmony-prefix KSA.FlightComputer.ComputeControl"
      - "harmony-finalizer KSA.FlightComputer.ComputeControl"
      - "harmony-postfix KSA.Vehicle.IsDisabled(FlightComputerAttitudeTrackTarget)"
      - "harmony-prefix KSA.Vehicle.Hovered(FlightComputerAttitudeTrackTarget)"
    game_types: [KSA.FlightComputer, KSA.FlightComputerNavigation, KSA.NavigationTarget, KSA.PhysicsBubble, KSA.VehicleUpdateState, KSA.VehicleUpdateData, KSA.BurnPlan, KSA.Vehicle, KSA.InputEvents, KSA.GaugeButtonFlightComputer, KSA.FlightComputerAttitudeTrackTarget, KSA.FlightComputerAttitudeTrackTargetEx, KSA.VehicleReferenceFrameEx]
    key_paths: [src/RootTargetPatches.cs, src/RootNavigationTargets.cs, src/RootTargetFlightComputerPatches.cs]
    howto_topics:
      - slug: modify-flight-computer-input-on-solver-thread
        title: "Change what the flight computer sees on the vehicle solver threads"
        note: "prefix ComputeControl, edit nav by ref, restore in a finalizer; runs per flight-computer tick"
      - slug: harmony-prefix-finalizer-state
        title: "Undo a prefix change after the original runs, even on exceptions"
        note: "__state from prefix to finalizer"
      - slug: find-solver-copy-of-vehicle-state
        title: "Recognize the solver's copy of a vehicle object"
        note: "FlightComputer.CopyFrom shares the BurnPlan reference"
  - id: mods/compendium/features/root-closest-approach-search
    title: "Closest approach to a root target"
    category: flight-and-orbits
    submod: null
    summary: >-
      Program.UpdateGauges postfix packs TGT distance, speed and closest approach for the side target;
      closest approach samples 511 uniform plus 511 log-spaced interior offsets per coast patch over 10 years,
      golden-section refines local minima, and is cached per vehicle with a one-second, 60-sim-second
      and plan-identity refresh rule.
    novelty: medium
    techniques: [harmony-postfix, numeric-minimization, conditional-weak-table, throttled-cache]
    lifecycle: [frame:gauges]
    hooks:
      - "harmony-postfix KSA.Program.UpdateGauges"
    game_types: [KSA.Program, KSA.DigitRoller, KSA.FlightPlan, KSA.PatchedConic, KSA.Orbit, KSA.Vehicle, KSA.Burn, KSA.Universe, KSA.IOrbiter, KSA.IParentBody]
    key_paths: [src/RootTargetFlightComputerPatches.cs, src/RootClosestApproach.cs]
    howto_topics:
      - slug: override-cockpit-gauge-readouts
        title: "Write your own values into the stock gauge digits"
        note: "postfix Program.UpdateGauges and write Program.*Roller"
      - slug: closest-approach-to-fixed-point
        title: "Estimate closest approach of a trajectory to a fixed point"
        note: "sample patches, refine local minima with golden-section search, include periapsis"
      - slug: throttle-expensive-ui-computation
        title: "Throttle an expensive per-frame computation"
        note: "cache keyed by object identity plus real-time and sim-time limits"
