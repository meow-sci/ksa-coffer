- id: mods/ksa-public-telemetry/features/allocation-free-readout-text
  title: Allocation-free formatted readout text
  category: ui
  submod: null
  summary: >-
    Formats every per-frame readout into a stackalloc'd Span<char> with double.TryFormat (invariant culture, unit
    suffix, hand-rolled HH:MM:SS) and passes the span to AddText/CalcTextSize, whose ImString conversion encodes it into
    ImString.SharedStorage, an arena that ImGuiBackend.NewFrame resets every frame; the same pattern as Program.DrawFps.
  novelty: medium
  techniques:
  - imgui-drawlist
  - span-formatting
  lifecycle:
  - frame:draw-ui
  hooks:
  - starmap StarMapAfterGui
  - harmony-postfix KSA.Program.DrawFps
  game_types:
  - Brutal.ImGuiApi.ImString
  - Brutal.ImGuiApi.ImDrawListExtensions
  - Brutal.ImGuiApi.ImGui
  - Brutal.Strings.ArenaStringBuilder
  - KSA.ImGuiBackend
  - KSA.Program
  key_paths:
  - Rendering/Format.cs
  - Rendering/ReadoutPanel.cs
  - Rendering/MissionClockPanel.cs
  - Rendering/Gfx.cs
  howto_topics:
  - slug: allocation-free-imgui-text
    title: Draw per-frame ImGui text without allocating strings
    note: >-
      stackalloc Span<char> + TryFormat, pass ReadOnlySpan<char> (ImString arena reset in ImGuiBackend.NewFrame), u8
      literals for constant labels, never keep an ImString across frames
