- id: mods/ksa-public-telemetry/features/montserrat-fonts-in-imgui-atlas
  title: Montserrat fonts in the ImGui atlas
  category: ui
  submod: null
  summary: >-
    Adds bundled TTFs to the game ImGui atlas lazily on the first UI frame with the same ImFontConfig fields as
    KSA.FontManager, then renders any size with ImGui 1.92 PushFont(font, size); tabular digits and drop shadows
    on draw lists. FontManager.RegenerateFonts clears the atlas and leaves the cached pointers dangling.
  novelty: medium
  techniques:
  - imgui-font
  - imgui-drawlist
  lifecycle:
  - startup:immediate-load
  - frame:draw-ui
  hooks:
  - starmap StarMapImmediateLoad
  - starmap StarMapAfterGui
  - harmony-postfix KSA.Program.DrawFps
  game_types:
  - Brutal.ImGuiApi.ImGui
  - Brutal.ImGuiApi.ImFontAtlasPtr
  - Brutal.ImGuiApi.ImFontConfig
  - KSA.FontManager
  - KSA.Mod
  key_paths:
  - Rendering/OverlayFonts.cs
  - Rendering/Gfx.cs
  - KSATelemetryOverlay.csproj
  - TelemetryOverlayMod.cs
  howto_topics:
  - slug: load-custom-font-into-imgui
    title: Load a custom TTF font into the KSA ImGui atlas
    note: >-
      Mod.DirectoryPath for the file, AddFontFromFileTTF, dynamic atlas (RendererHasTextures) allows mid-frame adds;
      atlas is cleared by FontManager.RegenerateFonts
  - slug: tabular-digits-in-imgui
    title: Draw fixed-width digits with a proportional font
    note: widest-digit cell, centre each glyph
  - slug: survive-imgui-font-atlas-rebuild
    title: Keep custom ImGui fonts valid across a game font rebuild
    note: >-
      FontManager.RegenerateFonts (after font settings change) calls Fonts.Clear() and only reloads Content/*.ttf;
      detect it (for example FontManager.ConsoleFont changed) and re-add; mod.toml fonts only feed the settings combo
- id: mods/ksa-public-telemetry/features/live-flight-telemetry-sampling
  title: Live flight telemetry sampling
  category: flight-and-orbits
  submod: null
  summary: >-
    Copies controlled-vehicle kinematics (surface/orbital speed, barometric/radar altitude, g-load, q, apsides,
    thrust, T/W, downrange) into a plain snapshot once per frame from StarMapAfterOnFrame for the UI to draw next
    frame.
  novelty: medium
  techniques:
  - starmap-lifecycle
  - snapshot-copy
  lifecycle:
  - frame:after-on-frame
  hooks:
  - starmap StarMapAfterOnFrame
  game_types:
  - KSA.Program
  - KSA.Vehicle
  - KSA.ReadOnlyPhysicsStates
  - KSA.PhysicsEnvironment
  - KSA.SituationEx
  - KSA.EngineController
  - KSA.Universe
  key_paths:
  - Telemetry/TelemetrySampler.cs
  - Telemetry/TelemetrySnapshot.cs
  - TelemetryOverlayMod.cs
  - Rendering/ReadoutPanel.cs
  howto_topics:
  - slug: read-vehicle-flight-telemetry
    title: Read live speed, altitude, g-load and dynamic pressure of the controlled vehicle
    note: >-
      Vehicle.GetSurfaceSpeed/GetBarometricAltitude/AccelerationBody, ReadOnlyPhysicsStates.Environment and ComputeAirVelocityBody
  - slug: sample-after-frame-draw-next-frame
    title: Sample game state after the frame and draw it next frame
    note: StarMapAfterOnFrame into a plain snapshot; one frame latency, no locks
  - slug: compute-current-engine-thrust
    title: Compute current thrust of a vehicle
    note: EngineController.ComputeActivePerformance(...).ThrustMax per active controller
- id: mods/ksa-public-telemetry/features/engine-diagram-from-nozzle-positions
  title: Engine diagram from real nozzle positions
  category: vehicles-and-parts
  submod: null
