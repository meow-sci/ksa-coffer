- id: mods/ksa-public-telemetry/features/draw-while-ui-hidden-drawfps-postfix
  title: Keep drawing while the game UI is hidden
  category: patching
  submod: null
  summary: >-
    Reflection-only Harmony postfix on private static Program.DrawFps, which OnFrame calls (like OnDrawUiConsole right
    after it) outside the DrawUI guard that silences StarMap's UI hooks, to keep the overlay on screen when F2 hides the
    UI; no compile-time Harmony reference. Not run on PrepareFrame Exit frames.
  novelty: high
  techniques:
  - harmony-postfix
  - reflection
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  hooks:
  - starmap StarMapAllModsLoaded
  - harmony-postfix KSA.Program.DrawFps
  - reflection KSA.Program.DrawFps
  game_types:
  - KSA.Program
  key_paths:
  - HiddenUiPatch.cs
  - TelemetryOverlayMod.cs
  howto_topics:
  - slug: draw-ui-while-hud-hidden
    title: Keep drawing a mod UI when the player hides the HUD (F2)
    note: >-
      postfix Program.DrawFps or prefix OnDrawUiConsole, both outside if (DrawUI); return early while DrawUI is true;
      StarMapBeforeGui/AfterGui are inside the guard
  - slug: harmony-patch-via-reflection
    title: Apply a Harmony patch without referencing Harmony at compile time
    note: find HarmonyLib types in the AppDomain, fill Harmony.Patch arguments by parameter name
