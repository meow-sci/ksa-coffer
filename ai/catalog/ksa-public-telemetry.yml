mod: ksa-public-telemetry
repo: KSA-Public-Telemetry
ref: 90608fb465f87d6008208798cc4d20ed8182c9a0
summary: >-
  KSA Broadcast Telemetry Overlay (elevatorctln, Spacedock "Webcast Telemetry Overlay") is a StarMap ImGui mod that
  draws a SpaceX-webcast-style telemetry bar over flight: speed/altitude/g-force gauges, a T+ clock keyed on LaunchGameTime
  with its own liftoff detection, a mission timeline with planned burns from the flight computer, heuristic event
  callouts, and an engine diagram projected from the active stage nozzle positions with a propellant arc. It samples
  the controlled vehicle in StarMapAfterOnFrame, draws on the ImGui foreground draw list in StarMapAfterGui (and
  from a reflection-only Harmony postfix on Program.DrawFps when F2 hides the UI), hides and restores stock GaugeCanvases,
  offers every panel as a KSA.ImGuiWindow, integrates with ModMenu through a vendored attribute with a fallback
  window, and persists a forgiving JSON config in the KSA documents folder.
features:
- id: mods/ksa-public-telemetry/features/foreground-drawlist-broadcast-overlay
  title: Broadcast overlay on the ImGui foreground draw list
  category: ui
  submod: null
  summary: >-
    Draws the whole webcast bar (anchored gauge capsules, gradient band, sloped shelf plates) into ImGui.GetForegroundDrawList
    each frame using a tiny IOverlayPanel/PanelHost layout system; shelf gradients are made by rewriting the alpha
    of freshly emitted ImDrawVerts.
  novelty: high
  techniques:
  - imgui-drawlist
  - starmap-lifecycle
  lifecycle:
  - frame:draw-ui
  hooks:
  - starmap StarMapAfterGui
  - harmony-postfix KSA.Program.DrawFps
  game_types:
  - Brutal.ImGuiApi.ImGui
  - Brutal.ImGuiApi.ImDrawListPtr
  - Brutal.ImGuiApi.Internal.ImGuiWindowPtr
  - KSA.Program
  key_paths:
  - Rendering/OverlayRenderer.cs
  - Rendering/PanelHost.cs
  - Rendering/IOverlayPanel.cs
  - Rendering/Gfx.cs
  - Rendering/ReadoutPanel.cs
  howto_topics:
  - slug: fullscreen-hud-overlay-on-foreground-drawlist
    title: Draw a full-screen HUD overlay on the ImGui foreground draw list
    note: >-
      no window, anchored to GetMainViewport WorkPos/WorkSize, clears the game menu bar via FindWindowByName
  - slug: imgui-gradient-polygon-via-vertex-colors
    title: Fill an ImGui polygon with a gradient by editing emitted vertices
    note: record VtxBuffer.Count around AddConvexPolyFilled and rescale ImDrawVert.col alpha
  - slug: round-gauge-with-arc-fill
    title: Draw a round gauge with a sweeping arc fill in ImGui
    note: PathArcTo + PathStroke, angle origin rotated to 12 o clock, exponential value smoothing
