- id: mods/ksa-public-telemetry/features/freeze-on-signal-loss
  title: Freeze on signal loss
  category: vehicles-and-parts
  submod: null
  summary: >-
    Pure tracking decision (sample/hold/clear) plus a Live/Lost state machine: freezes on loss of IsControllable
    (never on EVA, KittenEva is always controllable), on vehicle destruction (id gone from CelestialSystem.All) or
    when the per-step StructuralLoad g/q fraction reaches a threshold below the 1.0 at which the worker step creates a
    VehicleDestructionEvent that the same ApplyVehicleSolvers call executes.
  novelty: medium
  techniques:
  - starmap-lifecycle
  - state-machine
  lifecycle:
  - frame:after-on-frame
  - frame:draw-ui
  hooks:
  - starmap StarMapAfterOnFrame
  - starmap StarMapAfterGui
  - harmony-postfix KSA.Program.DrawFps
  game_types:
  - KSA.Vehicle
  - KSA.StructuralLoad
  - KSA.VehicleStructuralLimits
  - KSA.Program
  - KSA.CelestialSystem
  - KSA.PhysicsBubble
  - KSA.Universe
  - KSA.KittenEva
  key_paths:
  - Telemetry/TelemetrySampler.cs
  - Telemetry/SignalState.cs
  - Rendering/OverlayRenderer.cs
  howto_topics:
  - slug: predict-structural-failure
    title: Read how close a vehicle is to structural failure
    note: >-
      Vehicle.StructuralLoad GLoadFraction/DynamicPressureFraction; PhysicsBubble.DetectStructuralFailure destroys the
      vehicle at >= 1.0, g limit from VehicleStructuralLimits.EffectiveMaxGLoad, q limit 200 kPa
  - slug: detect-vehicle-destroyed-or-uncontrollable
    title: Detect that the controlled vehicle was destroyed or lost control
    note: IsDisposed, IsControllable, CelestialSystem.All.TryGet(id)
