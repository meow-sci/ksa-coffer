    Enumerates the active stage engine controllers and rocket cores via ModuleStateful StateLists, transforms each
    nozzle LocationAsmb by Part.MatrixAsmb2VehicleAsmb (as RocketNozzle.ResetState does), drops the stack axis and
    normalises into a dot diagram; propellant fraction summed from tank moles.
  novelty: high
  techniques:
