  - frame:draw-ui
  hooks:
  - starmap StarMapAfterOnFrame
  - starmap StarMapAfterGui
  - harmony-postfix KSA.Program.DrawFps
  game_types:
  - KSA.PartTree
  - KSA.EngineController
  - KSA.EngineControllerState
  - KSA.RocketCore
  - KSA.RocketCoreState
  - KSA.Rocket
  - KSA.RocketNozzle
  - KSA.Part
  - KSA.SequenceList
  - KSA.ModuleStateful
  - KSA.Tank
  - KSA.Mole
  - KSA.MoleState
  key_paths:
  - Telemetry/TelemetrySampler.cs
  - Rendering/EngineClusterPanel.cs
  howto_topics:
  - slug: enumerate-engines-of-active-stage
    title: Enumerate the engines of the active stage with their states
    note: >-
      ModuleStateful<EngineController,...>.TryGetFrom(parts.States), SequenceList.ActiveSequence, RocketCores.GetModulesAndStates(controller.Cores)
  - slug: nozzle-positions-in-vehicle-space
    title: Get nozzle positions in vehicle assembly space
    note: nozzle.LocationAsmb.Transform(float4x4.Pack(part.MatrixAsmb2VehicleAsmb))
  - slug: read-propellant-remaining
    title: Read remaining propellant mass and capacity from tanks
    note: Tank.Moles, Moles.States[StatesIdx].Mass, Mole.GetStoredMass(ContainerVolume)
