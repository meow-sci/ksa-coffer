  - id: mods/ksarmory/features/burst-sound-at-blast-arrival
    title: "The burst's bang, played when its blast front reaches the listener"
    category: audio
    submod: null
    summary: "The mod's nuclear explosion preset omits Core's SoundEvent. BurstSound follows each burst's blast front out to the audio camera on the simulated step, using a speed of sound sqrt(gamma P0/rho0) from PhysicalAtmosphereReference and a Sedov-Taylor-then-sonic front. On arrival it plays Core's ExplosionBig MultiSound itself the way ExplosionSoundSystem does, pitched down by yield and as loud as the overpressure at the ear (heard from 50 Pa). Bursts close in time and place merge into one bang, and an air burst gets a second, ground-reflected report."
    novelty: high
    techniques: ["fmod-audio", "xml-asset", "starmap-lifecycle", "harmony-prefix", "ground-anchored-source", "live-front-arrival", "event-deduplication"]
    lifecycle: ["startup:asset-load", "frame:draw-ui", "frame:celestials", "frame:after-on-frame"]
