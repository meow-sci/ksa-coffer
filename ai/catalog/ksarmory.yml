    title: "Analytic sub-frame fuses by closest approach"
    category: physics
    submod: null
    summary: "Proximity, contact, timed, height and ground fuses are solved in closed form inside each sub-step, so fast rounds cannot tunnel through the trigger and the burst instant is known within the frame."
    novelty: high
    techniques: ["custom-physics", "analytic-closest-approach", "sim-boundary"]
    lifecycle: ["frame:draw-ui", "frame:celestials", "frame:after-on-frame"]
    hooks: ["starmap StarMapAfterGui", "harmony-prefix KSA.Program.OnFrameCelestials", "starmap StarMapAfterOnFrame"]
    game_types: ["KSA.Vehicle", "KSA.Universe", "KSA.Program"]
    key_paths: ["src/KSArmory/Sim/Vec.cs", "src/KSArmory/Sim/ContactSweep.cs", "src/KSArmory/Sim/Interceptor.cs", "src/KSArmory/Sim/Slug.cs", "src/KSArmory/Sim/Warhead.cs"]
