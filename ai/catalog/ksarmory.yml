mod: ksarmory
repo: KSArmory
ref: cbd63d6d84da7a48a13641a641d3557bad216435
summary: "KSArmory (LaurensDeV) adds weapon parts, sensors and projectiles to the KSA spacecraft sandbox as reusable machinery: a closest-point-of-approach search sensor, fire control, articulated mounts, rounds the mod integrates itself to sub-frame accuracy with analytic fuses, guided and ballistic guidance, a ballistic computer that flies player-built rockets, per-part blast damage through the engine's failure and dent paths, nine compute-shader effects recorded before bloom, borrowed and secondary-viewport cameras, an ImGui operator panel and data-only weapon packs. It binds to the game through six StarMap hooks and six Harmony patches, keeps all simulation in a game-free Sim/ folder that a headless test suite links, and ships extensive build, scenario and statistics tooling."
features:
