mod: ksastructures
repo: KSAStructures
ref: c24759358381fb10290c61f9a6980b7d832ba3d4
summary: >-
  KSAStructures (LaurensDeV) is a StarMap code mod that stands a walkable office tower on Earth as
  launch-pad landmark static objects, digging a garage, a deep spiral ramp and an optional vault
  into Earth's terrain with decal modifiers added at load. It runs a lift as a moving landmark,
  darkens and lights the underground with invisible shadow casters, per-viewport spot lights and a
  compute pass before bloom, keeps a below-sea-level volume dry, seats a kitten in a chair part
  whose computer flies the nearest craft, and offers a first-person kitten view through a
  replacement fixed camera controller; it ships headless tests, asset validators, a mesh generator
  and an MCP-driven developer bridge.
features:
  - id: mods/ksastructures/features/office-landmarks-static-objects
    title: Launch-pad landmarks that stand a walkable building on Earth
    category: celestials
    submod: null
    summary: Adds IsLaunchPad LandmarkReferences to Earth's CelestialTemplate at StarMapAllModsLoaded so the engine resolves, draws and collides a multi-part XML static object, and redraws it from an UpdateStaticObjectRenderData postfix (inside Program.Render, per visible viewport) when the tangent-plane cull hides it.
    novelty: high
    techniques: [starmap-lifecycle, xml-asset, glb-model, harmony-postfix, reflection]
    lifecycle: [startup:all-mods-loaded, frame:render, physics:bepu]
    hooks: ["starmap StarMapAllModsLoaded", "harmony-postfix KSA.LocationReference.UpdateStaticObjectRenderData"]
    game_types: [KSA.LandmarkReference, KSA.LocationReference, KSA.CelestialTemplate, KSA.StaticObject, KSA.StaticObjectTemplate, KSA.StaticSubObjectTemplate, KSA.ConstraintSim, KSA.Camera, KSA.Celestial, KSA.Program, KSA.ModLibrary]
    key_paths: [src/KSAStructures/Ksa/Office.cs, src/KSAStructures/KSAStructuresOffice.xml]
    howto_topics:
      - slug: place-static-object-on-planet
        title: Place a static building on a planet at a latitude and longitude
        note: add an IsLaunchPad LandmarkReference to CelestialTemplate.Locations before StaticObject.ResolveAll
      - slug: walkable-static-object-colliders
        title: Make a structure kittens can walk on with static-object colliders
        note: nearest launch pad within 300 m is the only static collider per body
      - slug: draw-static-object-manually
        title: Draw a static object yourself when the engine culls it
        note: postfix UpdateStaticObjectRenderData and call StaticObject.UpdateRenderData with your own matrix
