        note: patch the Cce overload; TerrainPatch reads the Ccf one
      - slug: identify-vehicle-in-prepareworker-window
        title: Know which vehicle a callback runs for during PrepareWorker
        note: ThreadStatic set in a Priority.First prefix and cleared in a Priority.Last finalizer
      - slug: spawn-craft-on-top-of-a-structure
