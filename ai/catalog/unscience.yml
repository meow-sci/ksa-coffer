mod: unscience
repo: unscience
ref: 1829b3b298dd0fa5a67342cafff29074c8c29286
summary: >-
  unscience is a meow-sci monorepo "supermod" for Kitten Space Agency: 31 feature sub-mods (vessel welding
  and scaling, celestial welding, decals, parachute and vehicle paint, exhaust plumes, planetary rings, ground
  clutter and GLB statics, part-mounted cameras, kitten spawning, animation and rocket flight, runtime part loading,
  lights, music, themes, auto saves) built as ISubmod libraries and shipped as one StarMap mod with one Harmony
  instance, one ImGui toolbox, a shared ksa-abstractions library (PrepareFrame physics handoff, part render filter,
  hotkey guard, hidden-HUD hook) and a versioned scene-save sidecar beside native saves.
