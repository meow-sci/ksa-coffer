    summary: GitHub Actions publish a framework-dependent win-x64 StarMap folder (zip without pdb/xml), RC builds from dev, StarMap.API to NuGet when it changed, and an Inno Setup installer that writes StarMapConfig.json with the chosen KSA folder.
    novelty: low
    techniques: [github-actions, nuget-package, inno-setup, json-config]
    lifecycle: []
    hooks: []
    game_types: []
    key_paths: [.github/workflows/release.yml, .github/workflows/rc-build.yml, .github/workflows/pr-build.yml, installer/WindowsInstaller.iss, StarMap.Core/StarMap.Core.csproj]
    howto_topics:
      - slug: build-against-ksa-reference-assemblies
        title: Build a mod against KSA reference assemblies or a local install
        note: Private=false references, RocketWerkz.KSA.Ref, Import folder
      - slug: ship-a-windows-installer-for-a-mod-tool
        title: Ship a Windows installer that configures the game path
        note: Inno Setup custom directory page writing a JSON config
