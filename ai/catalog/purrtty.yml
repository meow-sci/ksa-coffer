mod: purrtty
repo: purrtty
ref: 71da9efe9ed7b8ec533cad7a0bb15bea9f59a9a5
summary: "In-game terminal emulator for Kitten Space Agency. Hosts real shells (ConPTY on Windows, fork-free POSIX ptys on Linux and macOS), the KSA developer console, and shells registered by other mods through a shared contract assembly that importers resolve from purrTTY's load context (gatOS), using Ghostty's libghostty-vt engine through a vendored native binding loaded per OS from the mod folder. Terminals render as multi-window, tabbed ImGui windows drawn with draw lists, or into off-screen Vulkan textures shown on world-space quads anchored to parts or the camera, injected after KSA's translucency pass. Harmony prefixes keep game hotkeys and mouse bindings from firing while typing; settings, themes and layouts persist as TOML."
