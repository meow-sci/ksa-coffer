mod: ksacars
repo: KSACars
ref: 1f0a84f623ef7a8edb0792d5c46c0fecfc2abd7f
summary: >-
  KSACars ("Fast & Purrious", LaurensDeV, MIT) adds two driveable cars to KSA, a beach buggy and a
  flying 1976 Cadillac Eldorado, as single parts declared in XML with their own GLB art, PBR
  textures, seats and EVA doors. KSA has no wheels, so a StarMap code mod simulates per-wheel
  spring-dampers, friction-circle tyres, a drive force, a cosmetic gearbox and rocket lift, hover,
  boost and downforce, reading terrain under each hub in the planet-fixed frame and writing one
  linear and one angular impulse into the vehicle's kinematic state from a Harmony prefix on
  Vehicle.PrepareWorker, the main-thread window just before the physics worker snapshots the state.
  Nine Harmony patches add seated crew for unflown cars, spotlights, coloured emissive lenses,
  engineless exhaust plumes, a crash veto, sprint/RCS keys, an engine HUD and an off-rails override;
  an IAnimProcessor solves the driver kitten's arms onto the steering wheel. Tooling covers an API
  surface read from the DLL's metadata, an assembly hash lock, headless tests of a KSA-free Sim
  folder, a file-drop command bridge with an MCP server, and a semantic-release pipeline.
features:
  - id: mods/ksacars/features/mod-folder-content-and-code-mod
    title: One folder as both a content mod and a StarMap code mod
    category: getting-started
    submod: null
    summary: >-
      One mod.toml serves KSA (name, an explicit assets list loaded by Mod.LoadAssetBundles) and
      StarMap ([StarMap] EntryAssembly), with the XML at the folder root beside Meshes, Textures and
      Sounds; XML paths resolve against the mod folder via Mod.GetPath, and the csproj copies content
      and references game DLLs with Private=false.
    novelty: medium
    techniques: [starmap-lifecycle, toml-config, xml-asset, assembly-load-context]
    lifecycle: [startup:asset-load, startup:immediate-load, startup:all-mods-loaded]
    hooks: ["starmap StarMapImmediateLoad", "starmap StarMapAllModsLoaded"]
    game_types: [KSA.Mod, KSA.ModLibrary, KSA.AssetBundle, KSA.FileReference]
    key_paths: [src/KSACars/mod.toml, src/KSACars/KSACars.csproj, src/KSACars/Ksa/KSACarsMod.cs]
    howto_topics:
      - slug: content-and-code-mod-in-one-folder
        title: Ship a content mod and a StarMap code mod from one folder
        note: name, assets and [StarMap] EntryAssembly in one mod.toml; mod id is the folder name
      - slug: list-asset-xml-in-mod-toml
        title: Register asset XML files in mod.toml
        note: no globbing; an unlisted file is silently never loaded
      - slug: mod-relative-asset-paths
        title: How asset paths in XML resolve
        note: Mod.GetPath combines with the mod folder, not the XML file's folder
