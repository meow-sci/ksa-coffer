    key_paths: [src/KSACars/Sim/Lift.cs, src/KSACars/Sim/Hover.cs, src/KSACars/Sim/Boost.cs, src/KSACars/Sim/Downforce.cs, src/KSACars/Sim/Hatch.cs, src/KSACars/Ksa/Buggies.cs]
    howto_topics:
