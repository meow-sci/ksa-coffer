  - id: mods/ksacars/features/frame-step-latch-and-car-registry
    title: Once-per-frame car step from two StarMap hooks, with a registry of the mod's craft
    category: getting-started
    submod: null
    summary: >-
      KSACarsMod.StepOnce runs from StarMapAfterGui (before the render) and falls back to
      StarMapAfterOnFrame when DrawUI is false; a two-method FrameLatch lets the first caller win and
      is released in a finally on the frame postfix, which Harmony runs on every return of OnFrame. The
      step rebuilds a census from Universe.CurrentSystem.All (Program.VehiclesInFrame is cleared in
      PostRender) and syncs a Dictionary<Vehicle, Entry> that the main-thread patches look up.
    novelty: medium
    techniques: [starmap-lifecycle]
    lifecycle: [frame:draw-ui, frame:after-on-frame]
    hooks: ["starmap StarMapAfterGui", "starmap StarMapAfterOnFrame"]
    game_types: [KSA.Program, KSA.Universe, KSA.CelestialSystem, KSA.Vehicle, KSA.Part]
    key_paths: [src/KSACars/Ksa/KSACarsMod.cs, src/KSACars/Sim/FrameLatch.cs, src/KSACars/Ksa/KsaWorld.cs, src/KSACars/Ksa/Buggies.cs]
    howto_topics:
      - slug: per-frame-work-with-hidden-ui
        title: Keep per-frame mod work running when the HUD is hidden
        note: GUI hook preferred, frame postfix fallback, latch released in a finally on the postfix
      - slug: enumerate-vehicles-from-a-hook
        title: Enumerate every vehicle from any StarMap hook
        note: Universe.CurrentSystem.All; Program.VehiclesInFrame is empty after PostRender
      - slug: track-craft-carrying-a-part
        title: Track which craft carry your mod's part
        note: per-frame sync into a Vehicle-keyed dictionary, dropped when disposed or the part leaves
