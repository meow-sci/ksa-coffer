  - id: mods/ksacars/features/scoop-colliders-and-loose-clutter
    title: Switchable scoop colliders and rocks that come loose
    category: physics
    submod: null
    summary: >-
      Moves stowed collider boxes out of the hull at runtime by writing ColliderModule.PositionPartAsmb
      and Collider2PartAsmb and setting NeedsColliderUpdate, hides unused blade subparts at scale
