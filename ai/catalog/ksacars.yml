        title: Simulate wheels and suspension without a wheel module
        note: springs hold the hull above colliders that only touch in a crash
      - slug: friction-circle-tyre
        title: A stable friction-circle tyre for a per-frame impulse model
        note: cancel a share of side slip per step; clamp drive to the remaining circle
      - slug: speed-limited-steering
