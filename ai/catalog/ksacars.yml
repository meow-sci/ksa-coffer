  - id: mods/ksacars/features/prepareworker-impulse-injection
    title: Inject wheel forces from a Vehicle.PrepareWorker prefix
    category: physics
    submod: null
    summary: >-
      A Harmony prefix on Vehicle.PrepareWorker, called on the main thread for every vehicle by
      Universe.PrepareVehicleWorkers just before the worker snapshot, writes velocity and angular
      velocity changes through GetPhysicsStatesMutable (a ref struct over the vehicle's own state),
      wakes railed cars and also performs the unflip righting move; writes from StarMap hooks are
      overwritten by the next ApplyVehicleSolvers.
    novelty: high
    techniques: [harmony-prefix, custom-physics, starmap-lifecycle]
    lifecycle: [startup:all-mods-loaded, frame:dispatch-solvers]
    hooks: ["starmap StarMapAllModsLoaded", "harmony-prefix KSA.Vehicle.PrepareWorker"]
    game_types: [KSA.Vehicle, KSA.PhysicsStates, KSA.KinematicStates, KSA.Universe, KSA.SimStep, KSA.SituationEx, BepuUtilities.Symmetric3x3]
    key_paths: [src/KSACars/Ksa/PhysicsHook.cs, src/KSACars/Ksa/Buggies.cs, src/KSACars/Sim/Righting.cs]
    howto_topics:
      - slug: apply-custom-forces-to-a-vehicle
        title: Apply custom forces or impulses to a vehicle each physics step
        note: prefix Vehicle.PrepareWorker; write Kinematic.VelocityPhys and AngularVelocityPhys
      - slug: why-starmap-hook-writes-are-lost
        title: Why vehicle state written from StarMap hooks does not stick
        note: ApplyVehicleSolvers overwrites _kinematicStates; the worker snapshot is taken before the GUI pass
      - slug: reposition-or-rotate-a-vehicle-in-place
        title: Rotate or lift a vehicle in place (unflip)
        note: write PositionPhys, Body2Phys and zero the velocities in the same window
  - id: mods/ksacars/features/wheel-suspension-tyre-model
    title: Wheel, suspension and tyre model
    category: physics
    submod: null
    summary: >-
      Per-wheel spring-damper sized from each wheel's static weight share with anti-roll bars, roll
      damping and bump stops; a friction-circle tyre that spends grip on side force first; a
      grip-limited steering lock; a linear drive force fading to top speed; air drag; and a cosmetic
      gearbox and RPM for sound, all summed into one impulse per frame in KSA-free code.
    novelty: high
    techniques: [custom-physics, harmony-prefix]
    lifecycle: [frame:dispatch-solvers]
    hooks: ["harmony-prefix KSA.Vehicle.PrepareWorker"]
    game_types: [KSA.Vehicle]
