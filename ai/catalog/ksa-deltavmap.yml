mod: ksa-deltavmap
repo: KSA-DeltaVMap
ref: 0441981a4c59b90e462fd81fc20d3924b356841a
summary: >-
  DeltaVMap is a StarMap mod by Maximilian-Nesslauer that draws an auto-generated, interactive
  KSP-style delta-v subway map for Kitten Space Agency in an ImGui window. It reads every star system
  of the loaded CelestialSystem live, prices routes with closed-form patched conics (Hohmann with
  Oberth-combined ejection and capture, per-body state ladders), roots the map at the vessel's SOI
  body, compares routes with the vessel's staged delta-v from the game's own SequencePerformanceList,
  prices interstellar trips with the game's own InterstellarBurnPlan, and adds transfer windows (list,
  polar phase clock, opt-in 3D map-mode overlay). One Harmony postfix (Program.DrawProgramMenusHook)
  adds the menu; everything else runs from StarMapAfterGui. Ships offline unit tests and
  HeadlessHarness tests that compare against stock private code via reflection.
features:
