    key_paths: [DeltaVMap/Mod.cs, DeltaVMap/Patches/Patch_MenuBar.cs, DeltaVMap/Render/MapWindow.cs, DeltaVMap/Core/LogHelper.cs]
    howto_topics:
      - slug: add-top-level-menu-bar-entry
