batch: flight-and-orbits-2
game_loop_reference: getting-started/game-loop-and-lifecycle
category: flight-and-orbits
category_description: Reading a vehicle's flight state and orbit, working in KSA's coordinate frames and epochs, driving the
  flight computer and burns from a mod, extending the stock Transfer Planner, transfer and encounter math, targets, map-view
  overlays and guided flight (ascent, boostback, landing, ballistic and homing guidance).
groups:
  guidance: 'Guided flight: suicide burns, powered landing, closed-loop ascent, boostback and glide, ballistic prediction,
    homing guidance and running heavy solves off the frame.'
  map-view: 'Map-view interaction: closest approach, points anchored to bodies, and predicted trajectories, markers and orbit
    lines.'
