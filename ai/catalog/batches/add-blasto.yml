  - category: testing-and-tooling
    slug: unit-test-mod-logic-without-game
    title: Unit-test mod logic without launching the game
    kind: howto
    group: offline-tests
    batch: testing-and-tooling-1
    summary: "Choose where the game boundary sits (a folder, an assembly, a shared source file or a compile-gated half) so
      the maths, models, parsers and state machines compile with no KSA assembly, then build a test project that runs on
      any machine and in CI: link the game-free sources, assert physical invariants and edge cases, make clocks and
      threads deterministic, gate slow or platform-specific tests behind an opt-in switch, and wire it to dotnet test or
      a console exit code."
    game_types:
      - Brutal.Numerics.double3
      - KSA.Vehicle
      - KSA.Universe
    engine_pointers:
      - Brutal.Core.Numerics (the only game assembly most pure code needs)
