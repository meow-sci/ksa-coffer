topics:
  - category: physics
    slug: write-worker-thread-safe-solver-patches
    title: Write worker-thread-safe patches inside the vehicle solver
    kind: howto
    group: solver
    batch: physics-1
    summary: Patches inside vehicle workers run at their target method cadence, including module steps and derivative
      substeps, possibly concurrently. Compare allocation-conscious calculations, thread-local state and bounded
      immutable sample handoff to the settled main-thread window; keep UI and rendering out of worker callbacks.
    game_types:
      - KSA.PhysicsStates
      - KSA.PhysicsBubble
      - KSA.VehicleUpdateTask
      - KSA.PhysicsEnvironment
      - KSA.ConstraintSim
      - KSA.KittenLocomotion
      - KSA.FlightComputer
      - KSA.VehicleUpdateState
      - KSA.RocketNozzleState
      - KSA.Universe
    engine_pointers:
      - current/decomp/KSA/VehicleUpdateTask.cs
      - current/decomp/KSA/PhysicsBubble.cs
      - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives
    lifecycle:
      - physics:vehicle-solver
      - physics:bepu
      - frame:dispatch-solvers
      - frame:apply-solvers
    approaches:
      - n: 1
        title: Pure, allocation-free, never-throwing code over the in arguments
        mod: ksaero
        features:
          - mods/ksaero/features/body-of-revolution-aerodynamics
          - mods/ksaero/features/stock-drag-delegate-fallback
        technique: harmony-transpiler
        note: Explain the call chain PrepareFrame -> ExecuteNextVehicleSolvers -> VehicleUpdateTask on JobSystems.VehicleSolver
          -> ComputeDerivatives, what MarkFailed does when the step throws (the bubble step is not applied that frame),
          and why KSAero uses only its arguments and falls back to stock on degenerate geometry.
      - n: 2
        title: Read-only tables filled on the main thread before physics starts
        mod: realatmospheres
        features:
          - mods/realatmospheres/features/measured-flight-atmospheres
          - mods/ksastructures/features/dry-volume-below-sea-level
        technique: reflection
        note: ConditionalWeakTable keyed on the game's reference object, populated in a load-time postfix, read by
          allocation-free prefixes on the worker. Also volatile array swaps for data that changes at runtime.
      - n: 3
        title: Concurrent registries keyed by reference
        mod: unscience
        features:
          - mods/unscience/features/kitchen-sink-g-load-protection
          - mods/unscience/features/the-tick-vessel-indestructibility
        technique: reflection
        note: ConcurrentDictionary with ReferenceEqualityComparer written by the UI and read by workers, an IsDisposed check on
          read and a per-frame prune on the main thread.
      - n: 4
        title: Volatile snapshot handoff from worker patches to the main thread
        mod: ksagolf
        features:
          - mods/ksagolf/features/course-colliders-as-clutter
          - mods/ksastructures/features/first-person-kitten-view
        technique: worker-thread-patch
        note: Worker prefixes on ConstraintSim passes and KittenLocomotion.StepGrounded read an immutable snapshot published by
          the main thread and write results through volatile fields; one sim per prefix call, no shared mutable state.
      - n: 5
        title: Identify the vehicle a callback runs for with a ThreadStatic set in a prefix and cleared in a finalizer
        mod: ksastructures
        features:
          - mods/ksastructures/features/terrain-height-roof-override
        technique: harmony-finalizer
        note: Functions like GetTerrainHeightFromDirCce do not receive the vehicle. A Priority.First prefix on
          Vehicle.PrepareWorker sets a thread-static and a Priority.Last finalizer clears it, so later patches can tell
          vehicle-driven calls from camera and UI calls.
      - n: 6
        title: Immutable commands published before the solver job is queued
        mod: ksa-advancedflightcomputer
        features:
          - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
        technique: harmony-postfix
        note: A single postfix on FlightComputer.ComputeControl runs every mod actuator writer on the worker, each consuming an
          immutable command handed over at PrepareWorker time, with wake and off-rails requests merged into the stock
          output.
      - n: 7
        title: Sample nozzle thrust on the solver and hand exposure to the main thread
        mod: blasto
        features:
          - mods/blasto/features/worker-nozzle-exposure-handoff
        technique: harmony-postfix, background-thread
        note: Explain source-verified timing, ownership and failure paths. Distinguish offline validation from live visual
          confirmation; cover every listed mechanism.
    related:
      - mutate-vehicles-at-a-physics-safe-point
      - replace-the-stock-aerodynamic-force-model
      - mutate-the-shared-bepu-shape-registry
    assigned_approach: 7
    existing_topic: true
  - category: celestials
    slug: query-terrain-height-and-line-of-sight
    title: Query the terrain height field and test line of sight across terrain
    kind: howto
    group: terrain
    batch: celestials-1
    summary: "KSA has no terrain raycast a mod can use; it has Celestial.GetTerrainHeightFromDirCcf/Cce/Cci(direction,
      accurate), returning metres above MeanRadius along a direction from the body centre. This topic covers picking the
      frame entry point, clamping to sea level, what the accurate flag drops (every procedural modifier, including
      levelling decals) and how to keep accurate queries affordable, and builds on it a line-of-sight test: sphere test
      first, then fixed-budget sampling of the band below the terrain ceiling, or a radar-horizon mask. Also covers
      reading the height directly below a craft with the Ccf overload for hover and touchdown."
    game_types:
      - KSA.Celestial
      - KSA.Astronomical
      - KSA.CelestialSystem
      - KSA.Universe
      - KSA.Rendering.Water.Data.OceanReference
      - KSA.TerrainRadiusCache
      - KSA.PhysicsEnvironment
      - KSA.TerrainPatch
      - KSA.TerrainImpactFinder
      - KSA.ProceduralModifiersReference
      - KSA.PhysicsStates
    engine_pointers:
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf / Cce / Cci, GetSurfacePositionEclFromCce
      - current/decomp/KSA/TerrainRadiusCache.cs ComputeRadiusCcf
      - current/decomp/KSA/PhysicsEnvironment.cs RecomputePositionalValues
      - current/decomp/KSA.Rendering.Water.Data/OceanReference.cs
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf (SampleHeightBicubic vs SampleHeightMapBilinear,
        modifier loop gated on accurate)
      - current/decomp/KSA/TerrainRadiusCache.cs
      - current/decomp/KSA/TerrainPatch.cs BaseQuadWidth
      - current/decomp/KSA/TerrainImpactFinder.cs
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCce
      - current/decomp/KSA/Celestial.cs MaxTerrainHeightApprox (_maxTerrainHeightApprox)
      - current/decomp/KSA/Astronomical.cs MaxTerrainRadius
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf, GetTerrainHeightFromDirCce
    lifecycle:
      - frame:draw-ui
      - frame:celestials
      - frame:after-on-frame
      - frame:dispatch-solvers
      - frame:apply-solvers
    approaches:
      - n: 1
        title: Ccf versus Cce entry points, sea clamp, and a no-claim result type; Document what accurate changes and sample
          non-accurate only where drift is harmless; Closed-form band below the terrain ceiling, fixed interior sample
          count
        mod: ksagolf
        features:
          - mods/ksagolf/features/terrain-height-queries
        technique: custom-physics
        note: "Cce direction from position minus centre in Ecl (Cce shares ecliptic axes), Ccf for body-fixed positions; passing
          one to the other rotates by the planet's current phase; sea detected by OceanReference non-null with Density >
          0, never IsValid; ITerrainHeights.TryHeight false means no claim, never zero. Bicubic vs bilinear, modifier
          loop gated, early returns when no heightmap or biome materials, single-precision direction pack giving a third
          of a metre staircase on Earth; physics samples accurate true with a 0.25 m arc reuse; TerrainImpactFinder
          samples false. Sub-step of the height-query topic: what accurate true/false changes and how to cache; give it
          its own section. LineOfSight (segment vs sphere strictly between endpoints, horizon range as the sum of
          tangent lengths) and TerrainMask.TryBandBelow solving the quadratic; no-claim samples treated as unknown, not
          zero. Ceiling bound: MaxTerrainRadius - MeanRadius + 8,000 m, not MaxTerrainHeightApprox. Sub-step: line of
          sight built on the height query; give it its own section."
      - n: 2
        title: Answer as a body centre and surface radius, pick the body by depth below the mean sphere; Radar horizon mask over
          non-accurate height samples
        mod: ksarmory
        features:
          - mods/ksarmory/features/terrain-ground-impact-test
        technique: terrain-query
        note: "IGroundTest.TryGround returns centreEcl and surfaceRadius so a round tests its height every sub-step by
          subtraction; nearest body by depth below MeanRadius with last-body caching; any exception or non-finite
          answers false. TerrainHeights(body) with accurate false via KsaWorld.IsHiddenByTerrain, tens of samples per
          contact per scan. Sub-step: line of sight built on the height query; give it its own section."
      - n: 3
        title: Cache decorator that reuses a sample until near the ground or moved
        mod: ksarmory
        features:
          - mods/ksarmory/features/terrain-ground-impact-test
          - mods/ksagolf/features/terrain-height-queries
        technique: decorator-cache
        note: "CoarseGroundTest re-samples only when within 600 m of the cached surface or 250 m from the sample point; radar
          horizon masks use accurate false because tens of samples per contact per scan. Sub-step of the height-query
          topic: what accurate true/false changes and how to cache; give it its own section."
      - n: 4
        title: "Query terrain height under a point: Height directly below the craft with the Ccf overload for hover or
          touchdown"
        mod: ksa-advancedflightcomputer
        features:
          - mods/ksa-advancedflightcomputer/features/terminal-hover-touchdown
        technique: harmony-prefix
        note: "Sub-step folded from query-terrain-height-under-a-point (give it its own section): Ask a celestial for the ground
          height under a direction vector, choose between the Ccf and Cce overloads and between fast and accurate
          sampling, and use it for hover and touchdown. Rotate the position into the body-fixed frame and use the Ccf
          overload; non-finite results fall back to zero. Also cover the Ccf versus Cce overloads and fast versus
          accurate (bicubic with procedural modifiers) sampling, using the per-wheel Cce accurate call as the contrast."
      - n: 5
        title: Intersect exhaust rays with terrain and classify dry surfaces
        mod: blasto
        features:
          - mods/blasto/features/terrain-plume-intersection
        technique: harmony-postfix, custom-physics
        note: Explain source-verified timing, ownership and failure paths. Distinguish offline validation from live visual
          confirmation; cover every listed mechanism.
