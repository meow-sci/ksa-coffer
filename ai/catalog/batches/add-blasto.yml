  - category: persistence
    slug: save-mod-state-with-the-scene
    title: Save a whole mod's scene state as versioned sidecar records, with reset and replay on load
    kind: howto
    group: saves
    batch: persistence-1
    summary: "For many features with native objects to rebuild, capture each feature as a versioned JSON record at save
      time, validate every record before the world is touched on load, reset old ownership in reverse order, replay
      restores in order after KSA rebuilds the world, and retain records that cannot be restored. The third approach is
      the mechanism underneath: patch GameSave.Populate, UncompressedSave.Write and Load, and Universe.DeserializeSave
      and LoadSystem to publish capture, write, reset and restore callbacks, validate incoming data before anything is
      destroyed, and replay world replacement at the PrepareFrame handoff."
    game_types:
      - KSA.GameSave
      - KSA.UncompressedSave
      - KSA.Universe
      - KSA.UniverseData
      - KSA.GameSaves
      - KSA.JobSystems
      - KSA.Program
      - KSA.PlanetRenderer
    engine_pointers:
      - current/decomp/KSA/GameSave.cs Populate
      - current/decomp/KSA/UncompressedSave.cs Write, Load
      - current/decomp/KSA/Universe.cs DeserializeSave
      - current/decomp/KSA/Universe.cs DeserializeSave, LoadSystem
      - current/decomp/KSA/Program.cs PrepareFrame, OnGameLoaded
    lifecycle:
      - startup:all-mods-loaded
      - event:save
      - event:load
      - frame:prepare
      - frame:draw-ui
      - frame:input
      - frame:apply-solvers
      - event:game-dispose
      - event:starmap-unload
    approaches:
      - n: 1
        title: ISaveParticipant records through a game-independent coordinator
        mod: unscience
        features:
          - mods/unscience/features/lib-scene-save-coordinator
          - mods/unscience/features/camera-controller-override-keyframe-sequences
          - mods/unscience/features/kitten-animations-locomotion-tuning
        technique: save-sidecar
        note: Participant contract (SaveId, SaveVersion, RestoreOrder, CaptureState, ResetState, PrepareRestore), coordinator
          state machine, retention of unknown or newer records so older builds round-trip them, the unscience.json
          document with size limits and a universe.xml SHA-256 binding, and the SaveJson options for Brutal vector
          types.
      - n: 2
        title: Host wiring - pair each capture with its write by object identity
        mod: unscience
        features:
          - mods/unscience/features/unscience-scene-save-sidecar
        technique: save-sidecar
        note: Populate postfix stores the document in a ConditionalWeakTable keyed by the GameSave, the Write postfix publishes
          it only when the native write succeeded, a write without a capture is reported rather than filled with fresh
          state, and a missing sidecar means reset everything, restore nothing.
      - n: 3
        title: Eight static callbacks over five patched methods, loads replayed at the frame handoff
        mod: unscience
        features:
          - mods/unscience/features/lib-native-save-hooks
        technique: harmony-prefix
        note: Exact-signature binding with rollback on failure, the deferral prefix that re-queues the same native call, worker
          joins before reset, preflight validation of incoming UniverseData, finalizers that turn silent native read
          failures into errors, and per-callback try/catch isolation. Includes the call-chain table from console,
          windows and multiplayer.
      - n: 4
        title: Persist body-fixed exposure sites with save-bound sidecar transactions
        mod: blasto
        features:
          - mods/blasto/features/persistent-exposure-site-store
          - mods/blasto/features/save-bound-sidecar-transactions
          - mods/blasto/features/scene-reset-and-native-cleanup
        technique: spatial-index, immutable-snapshot, harmony-postfix, harmony-prefix, harmony-finalizer, save-sidecar,
          json-config, starmap-lifecycle
        note: Explain source-verified timing, ownership and failure paths. Distinguish offline validation from live visual
          confirmation; cover every listed mechanism.
    related:
      - identify-vessels-and-parts-across-saves
      - detect-save-load
      - save-mod-state-with-the-game-save
      - exclude-or-replace-ground-clutter
      - chain-camera-moves-into-keyframe-sequences
      - restore-kitten-customizations-after-a-load
      - mutate-vehicles-at-a-physics-safe-point
      - save-and-load-the-game-from-code
    merged_from:
      - hook-native-save-and-load
