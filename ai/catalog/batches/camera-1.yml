- slug: aim-a-secondary-viewport-camera
  title: Aim a secondary viewport camera, rebuild its matrices and give it its nearby body
  kind: howto
  group: secondary-viewports
  batch: camera-1
  summary: A secondary camera follows nothing unless told to, and its view matrices were built in the viewport pass before
    your hook ran. Write the pose where the matrices are still to be built, or call Camera.OnFrame and refresh the shader
    data yourself. Program.OnFrameCelestials fills the nearby body, distances and altitude only for the frame camera, so the
    article also covers filling the same fields for your camera so sky and ground draw correctly.
  game_types:
  - KSA.Camera
  - KSA.IGameViewport
  - KSA.FixedController
  - KSA.Program
  - KSA.Celestial
  - KSA.StaticCelestialDistanceRendering
  - KSA.StaticObjectRenderer
  engine_pointers:
  - current/decomp/KSA/Camera.cs LookAt, OnFrame, SetFieldOfView
  - current/decomp/KSA/Program.cs UpdateShaderData, SetCameraUbo
  - current/decomp/KSA/Program.cs OnFrameCelestials, FindNearbyCelestial, RenderViewport
  - current/decomp/KSA/Camera.cs NearbyCelestial, DistanceToNearbyCelestialKm, NearbyCelestialTerrainHeight, GetEffectiveNearbyCelestial
  - references/KSArmory/docs/KSA-CAMERAS.md part 2 section A (why a secondary viewport shows stars and a grey ball)
  lifecycle:
  - frame:draw-ui
  - frame:viewports
  - frame:render
  - frame:celestials
  approaches:
  - n: 1
    title: LookAt from the GUI hook, then Camera.OnFrame, UpdateShaderData and SetCameraUbo; SetNearbyContext when aiming
      a window camera
    mod: ksarmory
    features:
    - mods/ksarmory/features/director-camera-window
    technique: direct-camera-write
    note: 'Unfollow(changeControl false) and Fixed first, anchor the eye on the platform as this window''s camera draws it,
      clamp FOV 1 to 120, and rebuild the matrices and per-viewport shader data right away. Sub-step: give this its own section,
      "Give the camera its nearby body". Terrain level of detail and the sky read these fields, so they are set in the same
      step as the pose. Also (merged from camera/work-in-the-cameras-ego-frame approach 2, "Position as this window''s camera
      draws it, not the analytic position"): A camera following a craft draws its physics-bubble neighbours at their physics
      positions; one following nothing draws every craft at its analytic position (Camera.GetPositionEgo). They differ by
      metres, which is shake at high zoom.'
  - n: 2
    title: Pose written in a FixedController.OnFrame prefix before the stock Camera.OnFrame; HotPursuitCelestialState.Synchronize
      inside the pose prefix
    mod: unscience
    features:
    - mods/unscience/features/hot-pursuit-part-mounted-cameras
    technique: harmony-prefix
    note: 'No extra rebuild needed because the write is in phase; the pose is composed in the main camera''s ego space then
      converted once, to avoid subtracting huge ecliptic coordinates. Sub-step: give this its own section, "Give the camera
      its nearby body". FindNearbyCelestial(camera) for the mounted camera, then the public fields; without it the nearby
      body was also drawn by the distant-sphere pass as a dark disc across the feed.'
