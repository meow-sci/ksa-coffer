  - frame:viewports
  - frame:render
  - frame:input
  - physics:vehicle-solver
  approaches:
  - n: 1
    title: EyesPose processor reads Head_M, KittenFrame.ToEcl converts, view posed in the viewport pass; Right-drag HeadLook
      through the controller's Orbit property; StepGrounded prefix swaps CameraForwardCce, postfix writes FacingDirPhys, heading
      via volatile float[]
    mod: ksastructures
    features:
    - mods/ksastructures/features/first-person-kitten-view
    technique: anim-processor
    note: 'Skeleton centimetres to ecliptic by Core.Scale, the -90 degree X then Z turn, minus centre of mass, Body2Cce and
      position; the eye sits 9 cm ahead and 6 cm above the bone; V toggles. Sub-step: give this its own section, "Mouse look".
      Yaw from north toward east and pitch within 85 degrees in an up, north, east frame built from the body centre and its
      spin axis; starts from the kitten''s current facing. Sub-step: give this its own section, "Make the walking kitten follow
      the look". Stock would flatten the camera forward, which degenerates looking straight down. Also (merged from kittens/look-through-a-kittens-eyes
      approach 1, "Head bone from an EyesPose, eye 9 cm ahead and 6 cm up, V toggle, right-drag look"): Look measured in an
      up/north/east frame from the body''s spin axis, pitch clamped to 85 degrees; record and restore camera mode, follow
      target and FOV; re-assert CameraMode.Fixed every step.'
  - n: 2
    title: Eye from the head bone in the golf pose, up tilted with pitch, main view only; Captured cursor at 0.08 degrees
      per pixel, right-drag at the orbit rate, pitch clamp 85 degrees; Same hook, plus drawing the turn on the skeleton for
      a standing kitten
    mod: ksagolf
    features:
    - mods/ksagolf/features/first-person-kitten-view
    - mods/ksagolf/features/level-horizon-camera-controller
    technique: anim-processor
    note: '12 cm ahead along the look and 5 cm up; tilting up with pitch makes looking straight down and turning spin the
      picture instead of rolling it. Sub-step: give this its own section, "Mouse look". Headless-tested HeadLook; the right-drag
      path shares the 0.003 rad per pixel rate and 2 px squared threshold with ChaseOrbit. Sub-step: give this its own section,
      "Make the walking kitten follow the look". A kitten standing still sleeps on the terrain and does not turn, so the turn
      to the look is drawn on the skeleton until it walks. Writes only worker-owned copies. Also (merged from kittens/look-through-a-kittens-eyes
      approach 2, "Captured cursor look, eye built from the head bone and a tilted up vector"): 0.08 degrees per pixel with
      the cursor captured, orbit rate on right drag; eye 12 cm ahead and 5 cm up; up vector tilted with pitch so looking straight
      down and turning spins the picture.'
