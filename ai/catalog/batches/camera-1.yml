- slug: replace-a-viewport-camera-controller
  title: Replace a viewport's camera controller and take input through it
  kind: howto
  group: controllers
  batch: camera-1
  summary: GameViewport.FixedController and IvaController are get-only for mods, so installing a FixedController or IVAController
    subclass needs reflection. Write the auto-property backing field, or call the protected setter once, verify it took, fall
    back safely and restore the stock controller on unload. A replacement controller also receives the camera input callbacks
    (OnKey, OnMouseButton, OnCursorPos, OnScroll, IsMouseDrag), so the article covers right-drag look, orbit drag and wheel
    zoom that feel like stock without opening part windows or reacting to ImGui-owned clicks.
  game_types:
  - KSA.GameViewport
  - KSA.ViewportBase
  - KSA.FixedController
  - KSA.IVAController
  - KSA.Controller
  - KSA.Program
  - Brutal.GlfwApi.GlfwCursorMode
  - Brutal.GlfwApi.GlfwMouseButton
  engine_pointers:
  - current/decomp/KSA/GameViewport.cs FlyController, OrbitController, MapController, IvaController, FixedController (all
    { get; protected set; })
  - current/decomp/KSA/ViewportBase.cs Mode
  - current/decomp/KSA/Controller.cs IsMouseDrag, GetCursorMode, OnMouseButton, OnCursorPos, OnScroll
  - current/decomp/KSA/OrbitController.cs (drag rate, threshold and wheel step)
  - current/decomp/KSA/Program.cs OnMouseButton, OnFrameController
  lifecycle:
  - frame:viewports
  - startup:all-mods-loaded
  - frame:input
  - frame:controller
  approaches:
  - n: 1
    title: Write the FixedController auto-property backing field, check, fall back, restore on unload
    mod: ksagolf
    features:
    - mods/ksagolf/features/level-horizon-camera-controller
    - mods/ksastructures/features/level-horizon-camera-controller
    - mods/ksarmory/features/chase-camera-on-a-round
    technique: reflection
    note: Three mods share the same pattern. The field is <FixedController>k__BackingField, read back after the write to confirm
      it, and the stock controller is put back from StarMapUnload.
  - n: 2
    title: Fetch the protected setters once with GetSetMethod(nonPublic true) and park the viewport in Fixed
    mod: gatos
    features:
    - mods/gatos/features/programmable-camera-director
    technique: reflection
    note: ViewportSeam caches the FixedController and Mode setters, saves the stock controller and releases it afterwards.
      Also the general recipe for a protected-set property.
  - n: 3
    title: Typed open-instance delegate on the IvaController setter; Forward every callback to a private FlyController, blocking
      when another input owner is active
    mod: unscience
    features:
    - mods/unscience/features/kitchen-sink-iva-camera-unlock
    technique: reflection
    note: 'AccessTools.PropertySetter then CreateDelegate gives an Action<GameViewport, IVAController>; failed lookups unpatch
      everything and record the error. Sub-step: give this its own section, "Take input through the controller". Movement
      is released when another viewport has input, a modal window or the console is open, or ImGui wants keyboard or text
      input.'
  - n: 4
    title: Right-drag look with orbit-camera constants, IsMouseDrag to suppress part clicks
    mod: ksastructures
    features:
    - mods/ksastructures/features/level-horizon-camera-controller
    technique: controller-subclass
    note: 'Sub-step: give this its own section, "Take input through the controller". Override OnMouseButton, OnCursorPos,
      IsMouseDrag and GetCursorMode; the controller owns the right button while a look is active.'
  - n: 5
    title: Orbit drag, swing and builder input, with ImGui-captured releases dropped
    mod: ksagolf
    features:
    - mods/ksagolf/features/level-horizon-camera-controller
    technique: controller-subclass
    note: 'Sub-step: give this its own section, "Take input through the controller". Releases that ImGui captured are discarded
      so a drag cannot stick, and the cursor mode is captured for the swing.'
  - n: 6
    title: Match the orbit camera's drag feel (0.003 rad/px, 2 px threshold, x1.1 per wheel notch, ease back)
    mod: ksagolf
    features:
    - mods/ksagolf/features/borrowed-chase-camera
    technique: camera-arbitration
    note: 'Sub-step: give this its own section, "Take input through the controller". ChaseOrbit copies KSA''s orbit-camera
      constants. At the pinned ref only the constants of this class are wired into the game, the rest is headless-tested;
      say so in the article.'
  related:
