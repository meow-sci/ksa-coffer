- slug: follow-a-point-that-is-not-a-vehicle
  title: Make the camera follow a point or mod-simulated object, and change the follow target without a jump
  kind: howto
  group: main-view
  batch: camera-1
  summary: Camera.Following takes any IFollowable. Implement it so it re-resolves its position on every call, answers a stable
    OrbitView and a non-zero MeanRadius, and the stock camera follows a vessel part, a held point or a mod-simulated body
    without registering anything. Camera.SetFollow teleports to 2.5 mean radii, raises an alert and by default swaps the controlled
    vehicle; the article also covers the flags that suppress both and restoring the pose when the view must stay put.
  game_types:
  - KSA.IFollowable
  - KSA.Camera
  - KSA.OrbitView
  - KSA.WreckageMarker
  - KSA.OrbitController
  - KSA.FixedController
  - KSA.CameraReferenceFrame
  - KSA.Program
  - KSA.Vehicle
  engine_pointers:
  - current/decomp/KSA/IFollowable.cs
  - current/decomp/KSA/Camera.cs Following, PositionEcl, PositionCce, SetFollow
  - current/decomp/KSA/WreckageMarker.cs (engine's own non-vehicle IFollowable)
  - references/KSArmory/docs/KSA-CAMERAS.md section 6 (requirements on a mod's IFollowable; a mod follow target does not survive
    a save load)
  - current/decomp/KSA/Camera.cs SetFollow, Unfollow
  - current/decomp/KSA/Program.cs ControlledVehicle
  lifecycle:
  - frame:viewports
  - frame:celestials
  - frame:draw-ui
  approaches:
  - n: 1
    title: Anchor that re-resolves a vessel, part, body or held point on each call
    mod: gatos
    features:
    - mods/gatos/features/synthetic-camera-follow-anchor
    technique: custom-followable
    note: GetBodyFixed2Ecl is identity so offsets do not roll with a vessel, MeanRadius is 1 m because the engine divides
      by it, a vanished anchor keeps its last sample.
  - n: 2
    title: RoundFollowable reporting the drawn position of a mod-simulated round
    mod: ksarmory
    features:
    - mods/ksarmory/features/chase-camera-on-a-round
    technique: custom-followable
    note: Reports the position the round is drawn at this frame, so the camera and the picture agree. Stock controllers dereference
      OrbitView without a null check, so supply one.
  - n: 3
    title: SetFollow with changeControl false and alert false, then write the captured position back
    mod: gatos
    features:
    - mods/gatos/features/programmable-camera-director
    technique: direct-camera-write
    note: 'Sub-step: give this its own section, "Change the follow target without a jump". The director captures the baseline,
      follows its own anchor and restores the position because SetFollow teleports.'
  - n: 4
    title: TryFollowOnMainViewport that follows without taking control
    mod: ksarmory
    features:
    - mods/ksarmory/features/borrow-main-view-camera
    technique: state-record-and-restore
    note: 'Sub-step: give this its own section, "Change the follow target without a jump". Follow and mode are separate halves
      of a borrowed view; following a non-Vehicle with changeControl true would null the controlled vehicle.'
  - n: 5
    title: Re-apply follow after every viewport claim on a secondary camera
    mod: unscience
    features:
    - mods/unscience/features/hot-pursuit-part-mounted-cameras
    technique: viewport-lease
    note: 'Sub-step: give this its own section, "Change the follow target without a jump". A claim resets the viewport to
      defaults so SetFollow(vehicle, tidalLocking true, changeControl false, alert false) is repeated after each claim.'
