- slug: understand-camera-modes-and-controllers
  title: Understand KSA camera modes, controllers, the viewport frame order and which camera is which
  kind: reference
  group: controllers
  batch: camera-1
  summary: Reference for every camera mod. Each GameViewport owns an Orbit, Free, Map, IVA and Fixed controller; OnFrameViewports
    calls controller.OnFrame and then Camera.OnFrame for every viewport, so a write made anywhere else lands one frame late.
    Covers which mode changes are immediate, what Fixed requires, which Camera members the engine reads back, and how to choose
    the right camera object (Program.GetMainCamera is the map camera in Map mode; Camera patches fire for every viewport and
    must be scoped to the main one).
  game_types:
  - KSA.Program
  - KSA.GameViewport
  - KSA.ViewportBase
  - KSA.Controller
  - KSA.Camera
  - KSA.CameraMode
  - KSA.FixedController
  - KSA.OrbitController
  - KSA.FlyController
  - KSA.IVAController
  - KSA.MapController
  - KSA.ViewportRegistry
  - KSA.IGameViewport
  engine_pointers:
  - current/decomp/KSA/Program.cs OnFrameViewports, OnFrameController, GetMainCamera, GetCameraMode, FrameViewport
  - current/decomp/KSA/GameViewport.cs OnFrame, GetActiveController, SetCameraMode, NextCameraMode
  - current/decomp/KSA/Camera.cs OnFrame, ClampCamera, SetFollow, ChangeFieldOfView
  - current/decomp/KSA/FixedController.cs OnFrame
  - references/KSArmory/docs/KSA-CAMERAS.md, references/KSAGolf/docs/KSA-CAMERAS.md and references/KSACars/docs/KSA-CAMERAS.md
    (one analysis, three near-identical copies; its citations predate build 5400 so re-check every line against current/decomp)
  - current/decomp/KSA/Program.cs GetMainCamera, GetHoveredCamera, GetRenderCamera, GetCamera, GetCameraMode, MainViewport,
    FrameViewport
  - current/decomp/KSA/GameViewport.cs GetCamera (map camera in Map mode)
  lifecycle:
  - frame:viewports
  - frame:controller
  - frame:input
  - frame:draw-ui
  - frame:render
  approaches:
  - n: 1
    title: The decompiled frame order, per-mode behaviour and crash inventory in the KSA-CAMERAS analysis
    mod: ksagolf
    features:
    - mods/ksagolf/features/level-horizon-camera-controller
    - mods/ksarmory/features/chase-camera-on-a-round
    technique: starmap-lifecycle
    note: Both feature pages show the rules in use. Cover the one-controller-per-mode layout, the order controller.OnFrame
      then Camera.OnFrame then the StarMap GUI hooks (a hook write is rendered a frame late), that SetCameraMode changes the
      field at once but the pose only moves on the next OnFrame, that the player's mode key cannot leave Fixed, and that a
      bogus Mode value throws every frame. Mark the doc's viewport sections as stale after 5400 (Viewport class replaced by
      IViewport, ViewportBase and ViewportRegistry).
  - n: 2
    title: MainViewport.BaseCamera when the scene camera is wanted even in map mode
    mod: ksarmory
    features:
    - mods/ksarmory/features/burst-flash-and-view-shake
    technique: reflection
    note: 'Sub-step: give this its own section, "Which camera is the main one". Borrowed from the shaders category. GetMainCamera()
      is MainViewport.GetCamera(), which is the map camera in Map mode, so a view effect that needs the scene camera reads
      BaseCamera.'
  - n: 3
    title: Gate Camera patches on the camera being the main viewport's
    mod: unscience
    features:
    - mods/unscience/features/glass-fov-override
    technique: harmony-prefix
    note: 'Sub-step: give this its own section, "Which camera is the main one". The FOV prefixes on Camera.ChangeFieldOfView
      and UpdateProjection run for every viewport''s camera, so they test that the instance is the main one before writing.'
  - n: 4
    title: Run per-frame work from a prefix on the main viewport's GameViewport.OnFrame only
    mod: gatos
    features:
    - mods/gatos/features/programmable-camera-director
    technique: harmony-prefix
    note: 'Sub-step: give this its own section, "Which camera is the main one". The sampler, command drain and camera driver
      hang off a prefix filtered to the main viewport, and a postfix publishes the final clamped transform.'
