  - unlock-the-iva-camera
  - call-private-game-members-through-reflection-and-delegates
  - block-game-hotkeys-while-typing
  - coordinate-imgui-focus-with-game-input
  - first-person-camera-for-a-kitten
  merged_from:
  - take-input-through-a-camera-controller
- slug: write-the-camera-pose-in-phase-with-the-frame
  title: Write the camera pose inside the viewport pass so it has no frame of lag, or pre-empt a stock controller
  kind: howto
  group: controllers
  batch: camera-1
  summary: StarMap's GUI hooks run after OnFrameViewports, so a pose set there is drawn a frame late and jitters against a
    moving target. Solve and write the pose where the engine's own controller writes it, immediately before Camera.OnFrame
    builds the matrices. Includes the variant of prefixing OrbitController.OnFrame and FlyController.OnFrame to skip the stock
    math while a script owns the camera, so the stock controller resumes from the pose left behind.
  game_types:
  - KSA.FixedController
  - KSA.GameViewport
  - KSA.Camera
  - KSA.IViewport
  - KSA.OrbitController
  - KSA.FlyController
  - KSA.Controller
  - KSA.Transform3D
  engine_pointers:
  - current/decomp/KSA/GameViewport.cs OnFrame (controller.OnFrame then Camera.OnFrame)
  - current/decomp/KSA/FixedController.cs OnFrame
  - current/decomp/KSA/Camera.cs OnFrame, ClampCamera
  - current/decomp/KSA/OrbitController.cs OnFrame
  - current/decomp/KSA/FlyController.cs OnFrame
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  approaches:
  - n: 1
    title: FixedController subclass that asks a pose source from inside OnFrame
    mod: ksagolf
    features:
    - mods/ksagolf/features/level-horizon-camera-controller
    - mods/ksastructures/features/level-horizon-camera-controller
    - mods/ksarmory/features/chase-camera-on-a-round
    technique: controller-subclass
    note: The mod calls its pose source (an IViewPose) from the overridden OnFrame, so the aim is computed with this frame's
      follow target and matrices. Hooks that only record intent run earlier from the GUI hook.
  - n: 2
    title: Offset against the followed object sampled in the same call, with sampler and publish on GameViewport.OnFrame
    mod: gatos
    features:
    - mods/gatos/features/programmable-camera-director
    - mods/gatos/features/synthetic-camera-follow-anchor
    technique: controller-subclass
    note: The controller reads following.GetPositionEcl() at that instant and writes PositionEcl and LocalRotation, the same
      two writes as stock; this removes the lag an earlier prefix-write design showed. Offsets from a followed object also
      keep precision at orbital speed.
  - n: 3
    title: Harmony prefix on FixedController.OnFrame scoped to the mod's own viewports
    mod: unscience
    features:
    - mods/unscience/features/hot-pursuit-part-mounted-cameras
    - mods/unscience/features/hot-pursuit-mesh-ray-placement
    technique: harmony-prefix
    note: No controller replacement; the prefix returns false only for viewports the mod leases and lets every other Fixed
      camera (docking, portraits) run stock. Also repeats ClampCamera so the next step sees the final position.
  - n: 4
    title: Shared name-resolved prefix on both controllers' OnFrame
    mod: unscience
    features:
    - mods/unscience/features/camera-controller-override-camera-animations
    technique: harmony-prefix
    note: 'Sub-step: give this its own section, "Pre-empt Orbit or Free instead of swapping controllers". The patch is resolved
      by name so one patch class covers both controllers, only acts while a sequence plays, and returns false to replace that
      frame''s stock camera math. Play, pause and stop come from an ImGui panel.'
  related:
  - replace-a-viewport-camera-controller
  - drive-the-main-camera-in-fixed-mode
  - mount-a-camera-on-a-part
  - understand-camera-modes-and-controllers
  - draw-ui-while-the-hud-is-hidden
  - chain-camera-moves-into-keyframe-sequences
  merged_from:
  - pre-empt-a-stock-camera-controller-for-a-while
- slug: drive-the-main-camera-in-fixed-mode
  title: Drive the main camera through Fixed mode without crashing it, with a stable up vector
  kind: howto
  group: controllers
  batch: camera-1
  summary: Fixed mode is the mod camera mode, but it divides by zero on an unset or axis-aligned CameraRotation, needs a follow
    target (or none) to behave, has no player exit and an alert on entry. Set CameraRotation before the mode, keep it finite
    and park the viewport cleanly. The stock fixed controller also derives up from the followed object and flips with it,
    so the article covers supplying a carried, rate-limited up vector (or the local up to LookAt) to keep the horizon level
    near the poles or on a tumbling body.
  game_types:
  - KSA.FixedController
  - KSA.GameViewport
  - KSA.ViewportBase
  - KSA.Camera
  - KSA.CameraMode
  - KSA.IFollowable
  - KSA.OrbitView
  engine_pointers:
  - current/decomp/KSA/FixedController.cs OnFrame, OnSwitchOn, CameraOffset, CameraRotation
  - current/decomp/KSA/GameViewport.cs SetCameraMode, NextCameraMode
  - references/KSArmory/docs/KSA-CAMERAS.md section 4.5 and section 7 (crash inventory)
  - current/decomp/KSA/Camera.cs LookAt, LookAtRotation
  - current/decomp/KSA/FixedController.cs OnFrame
  lifecycle:
  - frame:viewports
  - frame:controller
  - frame:draw-ui
  approaches:
  - n: 1
    title: Never enter Fixed with a zero or along-axis forward
    mod: ksagolf
    features:
    - mods/ksagolf/features/level-horizon-camera-controller
    technique: reflection
    note: Set CameraRotation first, guard against a zero or along-up forward, and re-assert Fixed each step because the player's
      mode key cannot leave it.
  - n: 2
    title: Set CameraRotation before the mode, restore the previous mode explicitly
    mod: ksarmory
    features:
    - mods/ksarmory/features/borrow-main-view-camera
    technique: state-record-and-restore
    note: Fixed has no player exit, so the borrower records the mode before the first write and is the only thing that can
      put it back.
  - n: 3
    title: Park through the Mode setter, suppress the entry alert, keep CameraRotation coherent
    mod: gatos
    features:
    - mods/gatos/features/programmable-camera-director
    technique: controller-subclass
    note: The controller writes CameraOffset and CameraRotation after each pose so a fallback into base.OnFrame never sees
      a zero rotation; OnSwitchOn silences the Fixed Camera alert for its own park.
  - n: 4
    title: Unfollowed Fixed camera on a secondary viewport, where your LookAt is the pose; LookAt with the platform's local
      up on an unfollowed secondary camera
    mod: ksarmory
    features:
    - mods/ksarmory/features/director-camera-window
    technique: direct-camera-write
    note: 'Unfollow(changeControl false) every frame, then Fixed; with nothing followed FixedController.OnFrame does nothing,
      so the camera pose the mod wrote stands. Sub-step: give this its own section, "Control roll with an up vector". The
      head''s boresight (local up at the platform) is the up argument, so the horizon sits level.'
  - n: 5
    title: Carried, rate-limited StableUp with no switching threshold
    mod: ksagolf
    features:
    - mods/ksagolf/features/level-horizon-camera-controller
    - mods/ksastructures/features/level-horizon-camera-controller
    - mods/ksagolf/features/borrowed-chase-camera
    technique: controller-subclass
    note: 'Sub-step: give this its own section, "Control roll with an up vector". The pure StableUp class (also in the chase
      view) carries the previous up forward and rotates it toward the new one at a bounded rate, so no hard switch happens
      near vertical.'
  - n: 6
    title: Controller adds an up vector the stock FixedController does not have
    mod: ksarmory
    features:
    - mods/ksarmory/features/chase-camera-on-a-round
    technique: controller-subclass
    note: 'Sub-step: give this its own section, "Control roll with an up vector". Stock FixedController takes up from the
      followed object type, which is wrong for a mod-simulated body; the subclass solves up and aim together.'
  related:
  - replace-a-viewport-camera-controller
  - borrow-the-main-camera-and-hand-it-back
  - understand-camera-modes-and-controllers
  - chase-a-fast-body-with-the-main-camera
  - aim-a-secondary-viewport-camera
  merged_from:
  - control-camera-roll-with-an-up-vector
- slug: borrow-the-main-camera-and-hand-it-back
  title: Borrow the main camera, hand it back and arbitrate between camera users
  kind: howto
  group: main-view
  batch: camera-1
  summary: Record the follow target, camera mode and field of view before the first write, drive the view, then restore each
    half only if the player did not change it meanwhile. Covers save loads, hidden-HUD frames and the order the halves go
    back in. When several features or mods want the one main view, use a ranked claim ladder so the loser yields without restoring
    over the winner, and detect a second writer so you stand down rather than fight.
  game_types:
  - KSA.Program
  - KSA.Camera
  - KSA.CameraMode
  - KSA.GameViewport
  - KSA.IFollowable
  - KSA.Vehicle
  - KSA.FixedController
  engine_pointers:
  - current/decomp/KSA/Camera.cs SetFollow, Following, SetFieldOfView, DeserializeSave
  - current/decomp/KSA/GameViewport.cs SetCameraMode
  - current/decomp/KSA/Program.cs OnGameLoaded, OnFrameCelestials
  - current/decomp/KSA/GameViewport.cs FixedController, Mode
  - current/decomp/KSA/Camera.cs Following
  lifecycle:
  - frame:draw-ui
  - frame:celestials
  - frame:viewports
  - event:save
  approaches:
  - n: 1
    title: Record mode, follow and FOV; stand down when the player changes either half; restore halves separately
    mod: ksarmory
    features:
    - mods/ksarmory/features/borrow-main-view-camera
    technique: state-record-and-restore
    note: Record before SetCameraMode or SetFollow, because a recording taken after describes the borrowed state. Stepped
      from the GUI hook, a hidden-HUD OnFrameCelestials prefix and an AfterOnFrame fallback; a save load is consumed from
      an OnGameLoaded postfix.
  - n: 2
    title: Hand-back that always returns FOV first and the follow only if it is still the borrower's; StandDown, Yield, Hold,
      GiveBack and Take decisions
    mod: ksagolf
    features:
    - mods/ksagolf/features/borrowed-chase-camera
    technique: state-record-and-restore
    note: 'KSA-free rules in Sim with a thin KsaWorld adapter; the FOV is returned unconditionally since the mod always changed
      it. Sub-step: give this its own section, "Arbitrate between features and mods". A headless-tested ViewClaim with mode
      and follow halves that decides each frame what to do with the view.'
  - n: 3
    title: Record the main view before the first write when flying another craft or a first-person kitten
    mod: ksastructures
    features:
    - mods/ksastructures/features/computer-flies-nearest-craft
    - mods/ksastructures/features/first-person-kitten-view
    technique: state-record-and-restore
    note: Mode, FOV and follow are restored by Leave; the first-person view re-asserts Fixed every step it holds the view.
  - n: 4
    title: Capture baseline pose, follow, mode and tidal locking; blend back on release; Detect a second writer and stand
      down
    mod: gatos
    features:
    - mods/gatos/features/programmable-camera-director
    technique: controller-subclass
    note: 'Release blends over camera_release_blend_s and then restores everything captured. Sub-step: give this its own section,
      "Arbitrate between features and mods". Each frame checks it still owns the camera; if the controller faulted, another
      mod replaced the fixed controller, the mode changed or the follow changed, the director releases instead of fighting.'
  - n: 5
    title: Pure ViewClaim ladder in the mod core, drivers called in claim order
    mod: ksarmory
    features:
    - mods/ksarmory/features/borrow-main-view-camera
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: view-claim-ladder
    note: 'Sub-step: give this its own section, "Arbitrate between features and mods". A claim loser yields instead of restoring;
      the dev bridge''s held camera pose is just another claimant written in claim order.'
  related:
