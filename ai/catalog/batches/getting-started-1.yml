    features:
    - mods/starmap/features/new-mods-restart-flow
    - mods/starmap/features/startup-modal-popup
    technique: harmony-prefix
    note: '[Absorbed topic relaunch-the-game-from-a-mod - Relaunch the game process from inside a mod] Detects New manifest
