- slug: ship-content-and-code-in-one-mod
  title: Ship assets and code in one mod folder and find it at runtime
  kind: howto
  group: loader
  batch: getting-started-1
  summary: Lay out a single mod folder that is both a KSA content mod (XML, glb, textures, sounds listed in mod.toml) and
    a StarMap code mod, with asset paths resolved against the mod root. Also covers locating the installed mod folder at runtime
    (assembly location first, the game mod library as a fallback) so files shipped beside the DLL are found under instance
    paths and stale copies.
  game_types:
  - KSA.Mod
  - KSA.ModLibrary
  engine_pointers:
  - current/decomp/KSA/Mod.cs LoadAssetBundles
  - GetPath
  - current/decomp/KSA/Mod.cs DirectoryPath
  - current/decomp/KSA/ModLibrary.cs Find
  lifecycle:
  - startup:asset-load
  - startup:immediate-load
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: Flat folder with an explicit assets list
    mod: ksacars
    features:
    - mods/ksacars/features/mod-folder-content-and-code-mod
    technique: toml-config
    note: XML at the folder root beside Meshes, Textures, Sounds; no globbing, so an unlisted file is silently never loaded;
      paths resolve via Mod.GetPath against the mod folder rather than the XML file's folder.
  - n: 2
    title: Mixed assets list with csproj content copy and build stamp
    mod: ksagolf
    features:
    - mods/ksagolf/features/content-and-code-mod-layout
    technique: toml-config
    note: The assets list names XML, glb, png and wav; csproj copies content beside the DLL; the KSA build compiled against
      is stamped from a lock file.
  - n: 3
    title: 'Find your mod''s install folder at runtime: Assembly.Location, then ModLibrary.Find, then Documents'
    mod: ohmystars
    features:
    - mods/ohmystars/features/mod-root-and-packaging
    - mods/starmap/features/per-mod-assembly-load-context
    technique: reflection
    note: 'Sub-step folded from find-your-mod-folder-at-runtime (give it its own section): Locate files shipped beside the
      mod DLL reliably, even under instance paths and stale copies, using the loaded assembly location first and the game''s
      mod library as a fallback. Assembly.Location is correct inside StarMap''s per-mod context; KSA.Mod.DirectoryPath is
      the manifest-driven alternative; the fallbacks cover instance paths and a stale second copy of the mod.'
  related:
  - mod-toml-reference
  - how-starmap-launches-ksa
  - package-and-publish-a-mod-release
  - ship-native-libraries-with-a-mod
  merged_from:
  - find-your-mod-folder-at-runtime
- slug: choose-a-starmap-startup-hook
  title: Choose and use the right StarMap lifecycle hook
  kind: howto
  group: lifecycle
  batch: getting-started-1
  summary: Pick between StarMapBeforeMain, StarMapImmediateLoad and StarMapAllModsLoaded by what must already exist - startup
    patches, data that asset XML must see, or a fully loaded asset set - with a map of what game state is available at each.
    Also covers verifying why a hook is silently skipped (signature and binding rules). Link game-loop-and-lifecycle for the
    engine frame order, and draw-ui-while-the-hud-is-hidden for latching per-frame work across several hooks.
  game_types:
  - KSA.Program
  - KSA.ModLibrary
  - KSA.Mod
  - KSA.Universe
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/Program.cs constructor / startup sequence
  - current/decomp/KSA/ModLibrary.cs PrepareAll, LoadAll, AttachGameData
  - current/decomp/KSA/Mod.cs PrepareSystems
  - StarMap.Core attribute discovery and signature validation (see mods/starmap pages)
  - current/decomp/KSA/Universe.cs GetLastSimStep
  lifecycle:
  - startup:starmap-before-main
  - startup:immediate-load
  - startup:asset-load
  - startup:all-mods-loaded
  - startup:game-loaded
  - frame:draw-ui
  - frame:celestials
  - frame:after-on-frame
  approaches:
  - n: 1
    title: StarMapBeforeMain - patch code that runs during startup
    mod: realatmospheres
    features:
    - mods/starmap/features/startup-lifecycle-hooks
    - mods/realatmospheres/features/reflection-only-mod-build
    - mods/shaderextensions/features/duck-typed-attribute-api
    technique: starmap-lifecycle
    note: Only loader-level work is legal; no game state exists. Install Harmony patches on code that runs before AllModsLoaded
      (Program.Main prefix scans, shader path redirects).
  - n: 2
    title: StarMapImmediateLoad - register data before assets deserialize
    mod: ksa-advancedflightcomputer
    features:
    - mods/starmap/features/startup-lifecycle-hooks
    - mods/ksa-advancedflightcomputer/features/superseded-mod-detection-and-settings-import
    - mods/compendium/features/cross-mod-json-catalog
    technique: starmap-lifecycle
    note: Per-mod prefix on Mod.PrepareSystems inside PrepareAll, before asset bundles load. Use it to register enum values,
      markers or data that XML deserialization must already see; mind the signature trap (see diagnose topic).
  - n: 3
    title: StarMapAllModsLoaded - work that needs the full mod set
    mod: ksarmory
    features:
    - mods/starmap/features/startup-lifecycle-hooks
    - mods/ksarmory/features/starmap-entry-and-fault-containment
    - mods/gatos/features/compile-gated-game-seam
    - mods/ksaero/features/game-version-check
    technique: starmap-lifecycle
    note: Postfix on ModLibrary.LoadAll, before GPU upload, AttachGameData and universe load. Typical for installing the bulk
      of Harmony patches, version checks, logging setup and background warm-ups.
  - n: 4
    title: Signature checklist against StarMap's binding rules
    mod: starmap
    features:
    - mods/starmap/features/attribute-hook-discovery
    - mods/ksarmory/features/starmap-entry-and-fault-containment
    technique: starmap-lifecycle
    note: '[Absorbed topic diagnose-a-starmap-hook-that-never-fires - Diagnose a StarMap hook that never fires] StarMap matches
      attribute types by name, takes the first [StarMapMod] class, requires public methods with exact parameter lists and
      dispatches by MethodInfo.Invoke with no handler. Includes a firing-point table (ksarmory) verified against the 5554
      decomp and logging probes to prove a hook ran.'
  related:
  - game-loop-and-lifecycle
  - measure-and-budget-mod-performance
  - contain-exceptions-in-starmap-hooks
  - how-starmap-launches-ksa
  - share-types-between-mods
  - draw-ui-while-the-hud-is-hidden
  merged_from:
  - diagnose-a-starmap-hook-that-never-fires
  note: 'Approaches merged into other topics: "Latch the step across GUI, celestials and after-on-frame hooks" -> draw-ui-while-the-hud-is-hidden.'
- slug: contain-exceptions-in-starmap-hooks
  title: Keep mod exceptions out of KSA's frame loop
  kind: howto
  group: lifecycle
  batch: getting-started-1
  summary: StarMap invokes hooks without a handler, so an exception in a per-frame hook can take down the frame; wrap every
    hook, count consecutive faults, log the first of a streak, then disable the mod and undo its side effects.
  game_types:
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/Program.cs OnFrame
  - OnDrawUiViewports (no catch)
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - frame:after-on-frame
  - event:shutdown
  approaches:
  - n: 1
    title: Per-hook try/catch feeding a shared fault counter, unpatch at ten
    mod: ksarmory
    features:
    - mods/ksarmory/features/starmap-entry-and-fault-containment
    - mods/ksacars/features/mod-log-file
    - mods/ksastructures/features/frame-step-plumbing
    technique: starmap-lifecycle
    note: Ten faults disable the mod and remove its patches (StandDown); exceptions inside patches are swallowed.
  - n: 2
    title: Consecutive-failure budget that restores the stock HUD
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/error-budget-self-disable
    technique: starmap-lifecycle
    note: Only consecutive failures count; after ten the mod disables itself and undoes visible side effects.
  related:
  - isolate-patch-failures-and-fault-proof-patch-bodies
  - write-a-per-mod-log-file
  - choose-a-starmap-startup-hook
- slug: clean-up-on-game-exit
  title: Clean up on game exit and relaunch the game from a mod
  kind: howto
  group: lifecycle
  batch: getting-started-1
  summary: Release what the mod owns at shutdown with StarMapUnload, know when it does not run (Environment.Exit paths), and
    reset static state so a reload or second init starts clean. Includes relaunching the game process after a startup-only
    change as a closing section.
  game_types:
  - KSA.Program
  - KSA.ModLibrary
  - KSA.ModEntry
  - KSA.Popup
  engine_pointers:
  - current/decomp/KSA/Program.cs Main
  - Dispose
  - current/decomp/KSA/ModLibrary.cs PrepareAll
  - current/decomp/KSA/ConfirmMods.cs
  lifecycle:
  - event:shutdown
  - thread:background
  - startup:asset-load
  approaches:
  - n: 1
    title: StarMapUnload plus ProcessExit for exit paths that skip it
    mod: starmap
    features:
    - mods/starmap/features/unload-and-shutdown
    - mods/ksa-measuretools/features/resilient-patching-and-diagnostics
    technique: starmap-lifecycle
    note: StarMapUnload runs after Main returns, Program.Dispose and StarMap's global UnpatchAll, so GPU, window and audio
