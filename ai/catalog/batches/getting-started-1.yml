batch: getting-started-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: getting-started
category_description: Build, deploy and understand a StarMap code mod end to end - project and mod.toml setup, how KSA and
  StarMap discover and load mods, startup hook choice, dependencies and shared assemblies, logging, version guards, fault
  containment and release packaging.
groups:
  loader: 'How StarMap finds, loads and binds a mod: the minimal project, the launch and discovery sequence, mod.toml and
    the mod folder layout.'
  lifecycle: 'When mod code runs and how it stays well behaved: startup hooks, fault containment, shutdown, logging and version
    checks; the existing game-loop-and-lifecycle reference also lives here.'
  dependencies: 'Depending on other mods and shipping what a mod needs at run time: dependency declarations, shared contracts
    and inter-mod APIs, third-party and native libraries.'
  build: 'Project setup, build, deploy and release: game references, deploy on every build, generated mod.toml, reference-free
    and CI builds, and packaging.'
topics:
- slug: create-a-minimal-starmap-mod
  title: Create a minimal StarMap mod
  kind: howto
  group: loader
  batch: getting-started-1
  summary: Stand up the smallest mod StarMap will load - a mod.toml, one [StarMapMod] entry class with lifecycle methods,
    a csproj that references the game DLLs without copying them, and a Harmony instance - then see it log from the game. Also
    covers growing the skeleton into a feature library that runs either as its own mod or hosted by an aggregating mod.
  game_types:
  - KSA.Mod
  - KSA.ModLibrary
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/Mod.cs (TomlField members, DirectoryPath)
  - current/decomp/KSA/ModLibrary.cs PrepareManifest / PrepareAll / LoadAll
  lifecycle:
  - startup:starmap-before-main
  - startup:all-mods-loaded
  - frame:draw-ui
  approaches:
  - n: 1
    title: Hand-built project from the discovery rules
    mod: starmap
    features:
    - mods/starmap/features/manifest-mod-discovery
    - mods/starmap/features/attribute-hook-discovery
    - mods/kitten-engineer-redux/features/dist-zip-and-post-build-deploy
    technique: starmap-lifecycle
    note: Walk the minimum - mod.toml with only name (EntryAssembly defaults to the folder/manifest id so no [StarMap] table
      is needed), public class with [StarMapMod], StarMap.API and Harmony from NuGet, game DLLs with Private=false. Shows
      what StarMap checks and what it silently ignores.
  - n: 2
    title: 'Copy and rename the repo template with mkmod.ts (plus: ISubmod contract with a supermod host)'
    mod: unscience
    features:
    - mods/unscience/features/fixme-mod-name-standalone-mod-template
    - mods/unscience/features/lib-isubmod-contract
    - mods/unscience/features/unscience-supermod-host
    technique: starmap-lifecycle
    note: The fixme-mod-name project pair is a ready scaffold (entry class with four lifecycle attributes, Harmony patcher
      with hotkey guard, F11 ImGui window, sibling library project) cloned by a TypeScript script. Good starting point for
      a mod that grows into a library plus entry layout. [Absorbed topic host-several-features-in-one-mod-or-standalone -
      Write features that run standalone or inside a supermod] Five-method panel interface, Apply/Remove patch classes, host
      builds every submod at AllModsLoaded and ticks them per frame. Persists only its own window layout.
  related:
  - mod-toml-reference
  - reference-game-assemblies-from-a-mod-project
  - deploy-a-mod-on-every-build
  - choose-a-starmap-startup-hook
  - game-loop-and-lifecycle
  - isolate-patch-failures-and-fault-proof-patch-bodies
  - build-a-mod-without-game-references
  merged_from:
  - host-several-features-in-one-mod-or-standalone
- slug: how-starmap-launches-ksa
  title: How StarMap launches KSA and loads your mod
  kind: reference
  group: loader
  batch: getting-started-1
  summary: 'End-to-end walkthrough of StarMap.exe - StarMapConfig.json, the custom game AssemblyLoadContext and base-directory
    trick, instance path handling, manifest discovery, per-mod load contexts, dependency ordering and attribute binding -
    so a modder can predict what is loaded, in which context and when. Sub-topics that get their own section or approach article:
    KSA mod folder, manifest and enable/ordering rules; redirecting the instance (user-data) folder per game instance; preloading
    a not-yet-loaded game assembly into the game load context before patching it.'
  game_types:
  - KSA.Program
  - KSA.App
  - KSA.ModLibrary
  - KSA.ModManifest
  - KSA.ModEntry
  - KSA.Mod
  - KSA.Constants
  engine_pointers:
  - StarMap/Program.cs, StarMap.Core/StarMapCore.cs (outside the decomp; see mods/starmap pages)
  - current/decomp/KSA/Program.cs Main and CliArgs
  - current/decomp/KSA/ModLibrary.cs CONTENT_MANIFEST, LocalManifestPath, PrepareManifest
  - current/decomp/KSA/Constants.cs DocumentsFolderPath
  - LogsFolderPath
  - Planet.Render.Core.dll loaded lazily by the game
  lifecycle:
  - startup:starmap-before-main
  - startup:immediate-load
  - startup:all-mods-loaded
  - startup:asset-load
  approaches:
  - n: 1
    title: Host process, contexts and hook binding walkthrough
    mod: starmap
    features:
    - mods/starmap/features/host-process-launch
    - mods/starmap/features/manifest-mod-discovery
    - mods/starmap/features/per-mod-assembly-load-context
    - mods/starmap/features/mod-dependency-graph
    - mods/starmap/features/attribute-hook-discovery
    technique: assembly-load-context
    note: A reference narrative with a numbered boot sequence and a context-resolution diagram. Covers why Harmony lives in
      the default context, what resolves where, why the game ignores extra CLI args, and the places a mod can observe all
      this (Assembly.Location, AssemblyLoadContext.GetLoadContext). Absorbs the "host a .NET game inside your own launcher"
      suggestion.
  - n: 2
    title: Folder and manifest rules as StarMap consumes them
    mod: starmap
    features:
    - mods/starmap/features/manifest-mod-discovery
    - mods/starmap/features/new-mods-restart-flow
    - mods/ksagolf/features/content-and-code-mod-layout
    technique: toml-config
    note: '[Absorbed topic ksa-mod-folders-and-manifest - Understand how KSA finds, enables and orders mods] Explains Content
      vs Documents mod roots, where a hand-copied mod must be registered, why a mod can seem to be ignored (disabled or New
      in the manifest), and how enabling a New mod in the popup leads to StarMap''s restart. KSAGolf shows a mod that is both
      a KSA content mod and a code mod.'
  - n: 3
    title: Manual Harmony prefix on Constants.DocumentsFolderPath
    mod: starmap
    features:
    - mods/starmap/features/instance-path-override
    technique: harmony-prefix
    note: '[Absorbed topic separate-game-instances - Run separate KSA instances with different user-data folders] Borrowed
      from persistence. Explains what moves with the folder, why a mod must use Constants paths rather than hard-coded Documents
      locations, and the argument/env precedence.'
  - n: 4
    title: Preload into the core load context from StarMapBeforeMain
    mod: realatmospheres
    features:
    - mods/starmap/features/per-mod-assembly-load-context
    - mods/realatmospheres/features/shader-file-redirect
    technique: assembly-load-context
    note: '[Absorbed topic patch-a-lazily-loaded-game-assembly - Patch code in a game assembly the game has not loaded yet]
      Loading it into your own context yields a second copy that the game never calls.'
  related:
  - declare-a-mod-dependency
  - ship-content-and-code-in-one-mod
  - deploy-a-mod-on-every-build
  - mod-toml-reference
  - clean-up-on-game-exit
  - write-a-per-mod-log-file
  - choose-a-starmap-startup-hook
  merged_from:
