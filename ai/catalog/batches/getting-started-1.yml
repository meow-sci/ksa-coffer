- slug: share-types-between-mods
  title: Share types and design an inter-mod API between StarMap mods
  kind: howto
  group: dependencies
  batch: getting-started-1
  summary: 'Publish a small contract assembly or attribute set that other mods use to talk to yours, without the type-identity
    splits that occur when each mod loads its own copy in its own AssemblyLoadContext. Also covers name-based attribute scanning
    across load contexts and keeping assembly identity stable when forking a library mod. Also covers shaping the surface
    another mod binds to so it survives refactors: small text-only members, results with faults instead of exceptions, validation
    probes, factory registries, staying inert when the host mod is absent, and a committed API-surface record that CI diffs.'
  game_types:
  - KSA.Program
  - KSA.KeyHash
  engine_pointers:
  - System.Runtime.Loader.AssemblyLoadContext; StarMap ModAssemblyLoadContext resolution order (see mods/starmap/features/per-mod-assembly-load-context)
  - System.Reflection.CustomAttributeData
  - System.Runtime.Loader.AssemblyLoadContext.All
  - StarMap.Core ModAssemblyLoadContext (type identity across mods; see share-types-between-mods)
  - StarMap mod.toml StarMap.ModDependencies ImportedAssemblies (see declare-a-mod-dependency)
  - current/decomp/KSA/Program.cs Main (the prefix target)
  lifecycle:
  - startup:starmap-before-main
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: Importer lists the contract assembly in ImportedAssemblies
    mod: purrtty
    features:
    - mods/purrtty/features/custom-shell-contract-via-assembly-imports
    - mods/starmap/features/shared-contract-assemblies
    - mods/gatos/features/purrtty-custom-shell-contract
    - mods/ksarmory/features/armoury-pack-registration-api
    - mods/purrtty/features/custom-shell-registry-and-lifecycle
    technique: inter-mod-api
    note: 'The importer resolves the name from the dependency''s load context so both share one Assembly and static registry.
      Key finding - ExportedAssemblies is parsed but never filled at StarMap 4dc60f8, so only the importer''s ImportedAssemblies
      is effective, and shipping your own copy of the contract produces a second identity. Also (merged from external-io/design-an-inter-mod-registry-contract
      approach 2, "Factory registry with a validation probe, contract assembly import and optional dependency" [purrtty, gatos]):
      ICustomShell contract free of game and UI types; RegisterShell constructs a probe instance to validate before accepting;
      the host presents in-process shells as PTY process managers. Optional = true with Private = true copies in deps.json;
      detection by assembly location so the vendored copy is never mistaken for the real host. Sub-step: the consumer side,
      declaring an optional dependency, vendored fallback copies and registering at StarMapAllModsLoaded while staying inert
      when the host mod is absent.'
  - n: 2
    title: Text-only registration members with fault results, required dependency and a CI-checked API surface
    mod: ksarmory
    features:
    - mods/ksarmory/features/armoury-pack-registration-api
    technique: inter-mod-api
    note: 'Folded from external-io/design-an-inter-mod-registry-contract approach 1: A pack needs only KSArmory.dll; Register(string,
      string) validates and returns faults; registration from the pack''s entry point precedes StarMapAllModsLoaded. Dependent
      mod orders after the host, registers during its own startup hook, and receives a fault result if it registers too late.
      tools/pack-api.py regenerates docs/PACK-API-SURFACE.md from source and checks it in CI; a Schema constant is bumped
      on a real break. Sub-step: the PACK-API-SURFACE record and CI diff (formerly record-and-check-the-api-other-mods-bind-to)
      gets its own section; also cover the consumer side, registering from the pack entry point.'
  - n: 3
    title: 'Duck-typed attributes copied into the consumer (plus: Scan every AssemblyLoadContext with GetCustomAttributesData)'
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/duck-typed-attribute-api
    - mods/mpfx/features/duck-typed-buffer-structs
    - mods/ksa-aircrafthud/features/sx-push-constants-and-buffers
    technique: reflection
    note: 'Consumers copy look-alike attribute classes; the host matches by full name and wires delegates. No assembly reference
      or mod dependency, at the cost of by-name coupling. [Absorbed topic discover-plugins-by-attribute-name - Discover plugins
      by attribute name across load contexts] A Program.Main prefix enumerates all contexts, matches look-alike attributes
      copied into consumer assemblies, closes a generic registration method over the consumer type and fills static delegate
      fields. No assembly reference between mods. Also (merged from external-io/design-an-inter-mod-registry-contract approach
      3, "Duck-typed attributes bound by FullName with MakeGenericMethod and CreateDelegate"): Scan AssemblyLoadContext.All
      after StarMap loaded every mod; unmanaged constraints are not enforced through reflection; no hard dependency, no type
      identity problems. Sub-step: scanning every AssemblyLoadContext with GetCustomAttributesData in a Program.Main prefix
      is the answer to loading across load contexts; give it a section.'
  - n: 4
    title: StarMap's name-based attribute binding
    mod: starmap
    features:
    - mods/starmap/features/attribute-hook-discovery
    technique: reflection
    note: '[Absorbed topic discover-plugins-by-attribute-name - Discover plugins by attribute name across load contexts] Compare
      attribute type names, then validate signatures with the host''s own attribute instances. Shows the host side of the
      contract.'
  - n: 5
    title: New mod id, unchanged assembly identity
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/continued-fork-identity
    technique: toml-config
    note: '[Absorbed topic fork-a-library-mod-compatibly - Fork or rename a library mod without breaking its dependents] The
      folder name KittenExtensionsContinued changes; dependents keep a non-optional dependency whose ImportedAssemblies names
      the KittenExtensions assembly. Both forks installed at once is the failure case to document.'
  related:
  - declare-a-mod-dependency
  - choose-a-starmap-startup-hook
  - host-a-terminal-with-pty-sessions-and-frame-handoff
  - feed-uniform-buffers-to-a-shaderextensions-shader
  merged_from:
  - discover-plugins-by-attribute-name
  - fork-a-library-mod-compatibly
  - design-an-inter-mod-registry-contract
  - design-an-inter-mod-registration-api
  - register-with-another-mods-plugin-registry
  - expose-an-api-to-other-mods-without-a-shared-assembly
  - record-and-check-the-api-other-mods-bind-to
