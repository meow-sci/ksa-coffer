    - mods/purrtty/features/custom-shell-contract-via-assembly-imports
    - mods/starmap/features/mod-dependency-graph
    technique: inter-mod-api
    note: '[Absorbed topic integrate-with-an-optional-mod - Integrate with another mod only when it is installed] The optional
      importer falls back to its own vendored contract copy; optional-missing mods are retried last by the dependency graph.'
  - n: 3
    title: 'Late-bound type lookup with AccessTools.TypeByName (plus: Marker registered at immediate load, or type lookup,
      plus copy-once settings import)'
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/optional-kittenextensions-patches
    - mods/ksa-advancedflightcomputer/features/superseded-mod-detection-and-settings-import
    technique: reflection
    note: '[Absorbed topic integrate-with-an-optional-mod - Integrate with another mod only when it is installed] No mod.toml
      dependency; probe for the other mod''s type at AllModsLoaded and enable the integration only when found. [Absorbed topic
      detect-a-conflicting-or-superseded-mod - Detect a superseded or conflicting mod and stand down] A gauge-enum marker
      registered by the old mod at StarMapImmediateLoad (PrepareAll runs before LoadAll) or AccessTools.TypeByName finds it;
