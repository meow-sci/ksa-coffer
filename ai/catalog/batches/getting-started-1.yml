    features:
    - mods/starmap/features/mod-dependency-graph
    - mods/ksarmory/features/armoury-pack-registration-api
    - mods/shaderextensions/features/generated-mod-toml
    technique: toml-config
    note: ModId is the folder name; ImportedAssemblies are assembly names; Optional defaults to false. Dependencies decide
      hook order across mods.
  - n: 2
