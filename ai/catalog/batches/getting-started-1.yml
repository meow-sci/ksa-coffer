  summary: Add [[StarMap.ModDependencies]] to mod.toml so a mod loads after another, imports its assemblies, and is parked
    until the dependency initializes - with the rules for required versus optional. Also covers optional dependencies with
    safe fallbacks and standing down when a superseded or conflicting mod is present.
