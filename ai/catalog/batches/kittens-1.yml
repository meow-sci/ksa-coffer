  - frame:draw-ui
  - frame:input
  approaches:
  - n: 1
    title: Replicate EVADoor.CreateKittenEva with the public KittenEva constructor, place it relative to a neighbour, and
      track and despawn it
    mod: unscience
    features:
    - mods/unscience/features/doh-kitten-spawning
    technique: reflection
    note: 'Backpack Part looked up by reflection on ModLibrary.AllParts, CreateOwnTree because the Part ctor no longer creates
      a tree, tanks refilled, JobSystems.VehicleSolver.Wait before construction, Teleport, parent.Children.Add and UpdatePerFrameData.
      Include the try/catch cleanup of a vehicle whose constructor throws after registration and the character pick via reflected
      ModLibrary.AllCharacters. Also (from place-a-spawned-vessel-relative-to-another approach 1): Pairing a position with
      a separately read clock shifts the spawn by velocity times the time difference; EVADoor itself uses stateVectors.StateTime.
      NaN body rates become zero. Absolute mode builds a temporary orbit at Universe.GetElapsedTime. Also (from track-select-and-despawn-spawned-kittens
      approach 1): GetDisposed allocates only when something was disposed because it is polled each frame; despawn prefers
      the stored object over an id lookup; a vanished selection is cleared, never replaced by whatever now sits at that index;
      spawned-but-untinted problems are warnings. Also (merged from vehicles-and-parts/spawn-a-vehicle-at-runtime approach
      4, "Spawn an EVA kitten as a vehicle beside another craft"): Replicates EVADoor.CreateKittenEva, backpack part with
      its own tree, orbit from the neighbour''s state vectors.'
  - n: 2
    title: Build a KittenEva from a saved craft that names a Character
    mod: ksarmory
    features:
    - mods/ksarmory/features/spawn-and-teleport-test-craft
    technique: vehicle-spawn
    note: 'A VehicleSave with a Character is created as KittenEva instead of Vehicle.CreateVehicle, matching VehicleTemplate;
      shows the ShapesRegistry lock handling around construction. Also (from place-a-spawned-vessel-relative-to-another approach
      2): Orbit.CreateFromStateCci after rotating an Ecl state into the parent''s CCI frame.'
