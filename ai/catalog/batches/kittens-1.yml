- slug: pose-kitten-bones-with-an-anim-processor
  title: Pose a kitten's bones and aim its limbs with an IAnimProcessor
  kind: howto
  group: animation
  batch: kittens-1
  summary: 'Add your own IAnimProcessor to the kitten''s character model to edit the sampled local pose or the world transforms
    before skinning, with procedural swing, bounce and spin shapes on a simulated-time clock that stops while paused, and
    safe attach and detach timing. (Scope also covers: Aim a kitten''s arm at a point; Convert between a kitten''s model space
    and the world; Draw a kitten stepped, turned or leaning without moving its physics body; Know when a kitten''s animation
    processors are culled by distance.)'
