  - event:load
  - frame:prepare
  approaches:
  - n: 1
    title: Rebind cloned material sets to restored kittens by vehicle id
    mod: unscience
    features:
    - mods/unscience/features/doh-runtime-gpu-materials
    technique: save-sidecar
    note: Reset keeps live sets in a cache and never despawns, restore claims a set per kitten, unclaimed sets are released,
      validation rejects duplicate ids before the world is reset; handles and doh_NNNN names are never identities.
  - n: 2
    title: Identity-checked colour restore by material name
    mod: unscience
    features:
    - mods/unscience/features/humble-arteest-kitten-color
    technique: save-sidecar
    note: Record original colour and the exact asset object before the first write; restore only if the AssetMap entry is
      still that object because slots are reused when renderer-owned materials are disposed.
  - n: 3
    title: Scene-save record with clip label, source and phase
    mod: unscience
    features:
    - mods/unscience/features/kitten-animations-locomotion-tuning
    - mods/unscience/features/kitten-animations-forced-clip-playback
    technique: save-sidecar
    note: Twenty tuning fields, forced clip matched by exact source and label, playback clock restored with SampleCurrentAnimation,
      latched expression re-triggered, ambiguous matches become warnings and targets are never redirected.
