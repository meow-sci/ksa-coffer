  - KSA.CelestialSystem
  - KSA.JobSystems
  - KSA.InputEvents
  - KSA.Vehicle
  - KSA.StateVectors
  - KSA.IParentBody
  - KSA.Universe
  - KSA.LookupCollection
  - KSA.VehicleProvider
  engine_pointers:
  - current/decomp/KSA/EVADoor.cs CreateKittenEva
  - current/decomp/KSA/KittenEva.cs KittenEva(CelestialSystem, string, doubleQuat, double3, IParentBody, string, Part, Orbit)
  - current/decomp/KSA/InputEvents.cs EvaSpawnBuffer EvaSpawnData
  - current/decomp/KSA/ModLibrary.cs AllParts AllCharacters
  - current/decomp/KSA/Orbit.cs CreateFromStateCci StateVectors
  - current/decomp/KSA/Vehicle.cs GetAsmb2Cci Teleport
  - current/decomp/KSA/EVADoor.cs CreateKittenEva (uses stateVectors.StateTime)
  - current/decomp/KSA/CelestialSystem.cs Deregister
  - current/decomp/KSA/LookupCollection.cs Deregister
  - current/decomp/KSA/Vehicle.cs Dispose IsDisposed
