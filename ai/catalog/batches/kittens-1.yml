    title: Own CatExpressionAnim appended after the game's four, pose cache busted on every swap (the later-running-processor
      pattern)
    mod: unscience
    features:
    - mods/unscience/features/kitten-animations-facial-expressions
    technique: anim-processor
    note: 'The game rewrites the reactive expression weight from acceleration every render, so writing to it never shows;
      the mod processor runs last in list order and MixPoseLocal blends over all of them; null the private _expressionPose
