  - frame:render
  - render:prepass
  - render:shadows
  approaches:
  - n: 1
    title: Fold all bones onto the head with zero-scale matrices, then give the shadow pass the full-body pose (shadow swap
      is a sub-step with its own section)
    mod: ksastructures
    features:
    - mods/ksastructures/features/first-person-body-hiding-and-shadow
    - mods/ksagolf/features/first-person-kitten-view
    technique: anim-processor
    note: 'Copy WorldTransforms to BodyWorld before overwriting; the helmet and visor collapse because their matrix comes
      from GetBoneTransform; a try/catch in every hook leaves an unposed kitten, never a thrown frame. Also (from draw-a-different-skinned-pose-into-the-shadow-pass
      approach 1): Read InverseBindPose and ShadowIgnoreIndicies by reflection (NativeList type is in an unreferenced assembly);
      write inverseBind[i] times BodyWorld[i]; camera windows record first so the entries the main view leaves are what the
      shadow cascades read. Also (merged from camera/hide-a-kitten-from-its-own-first-person-view approach 1, "KittenEva.UpdateRenderData
      prefix marks the main viewport, IAnimProcessor collapses the bones; Second skinning of the saved full pose, with the
      bone offset in data.y"): Borrowed from kittens. Every bone collapses to the head while the main view draws; the call
      order is secondary views first, main view last. Sub-step: give this its own section, "Keep the full shadow". Borrowed
      from kittens. Same idea in AnimatedRenderable.Draw and StaticMeshRenderable.Draw postfixes; reflection reads the protected
      MaterialIndices and ShadowIgnoreIndicies.'
  - n: 2
    title: Fold onto the wrist and keep the club-holding paw
    mod: ksagolf
    features:
    - mods/ksagolf/features/first-person-kitten-view
    technique: anim-processor
    note: 'Collapsing onto the chest stretched skin into sheets across the view; the wrist keeps the skin between the kept
      paw and the folded arm short; only the main view, only while carrying. Also (merged from camera/hide-a-kitten-from-its-own-first-person-view
      approach 2, "Collapse onto the wrist so the club paw stays as a viewmodel; Set KittenRenderable.HideHead per view; Draw
      postfix removes what the draw added and appends skinned shadow entries for the saved pose"): Folding onto the chest
      stretched skin into sheets across the view; folding the head also folds the fur and helmet. The simple alternative KSA
      already uses for IVA (IVASeat sets HideHead = IsCameraInThisSeat). The golf page records it but the mod does not use
      it. Sub-step: give this its own section, "Keep the full shadow". BodyWorld copy, InverseBindPose[i] * BodyWorld[i] into
      a new block from AllocateSkinningMatrices, one ShadowRenderable per shadow-casting mesh with the block index in InstanceData.data.Y;
      helmet and visor shadow entries re-targeted too.'
