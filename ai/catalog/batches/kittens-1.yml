  summary: 'Create a real KittenEva with a backpack part, a chosen or random character, an orbit and registration with its
    parent body, by replicating the private EVADoor.CreateKittenEva with the public eight-argument KittenEva constructor,
    and do it without racing the vehicle solver. (Scope also covers: Place a new vessel at a body-frame offset from another
    vessel; Track, select and despawn spawned kittens safely.)'
