    technique: reflection
    note: 'Resolve the socket bone by name, build the mesh once per avatar, add or update the CosmeticAttachment (struct in
      a List, so read, change, write back); the engine does not check Enabled or HasAttachment for cosmetic entries; one frame
      stale against a moving bone. Also (from build-a-static-mesh-renderable-from-mod-assets approach 1): Take the AssetName
      type from LoadedAssetRef.Id''s property type; the StaticMeshRenderable ctor reads Materials[MaterialIndices[i]].Handle
      once; a glb must name a material slot so Materials has a length; glass variant uses GlassRenderer, isOpaque false, CastShadows
      false; Dispose to unregister buckets.'
