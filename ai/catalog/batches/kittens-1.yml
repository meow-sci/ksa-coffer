  title: Restore kitten colours, clips and tuning after a save load
  kind: howto
  group: characters
  batch: kittens-1
  summary: Native KSA saves own the kittens, so a mod's per-kitten state (cloned material sets, colours, a forced clip with
    its playback phase, expression latches, tuning) is captured against native vehicle ids and rebound to the restored KittenEva
    objects after the world is rebuilt, never by spawning replacements or trusting GPU handles.
  game_types:
  - KSA.KittenEva
  - KSA.GpuObjectAssetRef
  - KSA.KittenLocomotionTuning
  - KSA.BoneAnimRuntime
