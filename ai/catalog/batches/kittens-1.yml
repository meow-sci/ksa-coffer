  - frame:after-on-frame
  - frame:render
  - render:prepass
  - render:shadows
  approaches:
  - n: 1
    title: One reflection hop to the private avatar field, bones resolved by name
    mod: ksagolf
    features:
    - mods/ksagolf/features/kitten-pose-processor
    - mods/ksastructures/features/first-person-body-hiding-and-shadow
    technique: reflection
    note: KittenEva.Renderable is public but KittenRenderable._characterAvatar is private. Keep a single AvatarOf helper so
      every feature breaks together; Skeleton.BoneNames.IndexOf gives the pose-span index, unknown names are reported and
      not thrown.
  - n: 2
    title: Cached FieldInfo reads of the private clip and processor fields with a visible unresolved list
    mod: unscience
    features:
    - mods/unscience/features/kitten-animations-clip-catalog
    technique: reflection
    note: 'Thirteen private clip fields, four blend samplers and four anim processors are read by name; any name that no longer
      resolves is recorded and shown in the UI so a game update degrades visibly instead of doing nothing. Also (merged from
      kittens/enumerate-kitten-animation-clips-and-processors approach 1, "Rebuild on bind from reflected fields, report unresolved
      names"): WalkingAnimations is unusable (RunningAnim is never assigned in 5554); drop entries with non-positive LoopPeriod
      because BoneAnimRuntime.SampleCurrentAnimation divides by it; use field names for the two CatExpressionAnim instances.'
  - n: 3
    title: Walk renderable struct fields down to the live MaterialIndices arrays
    mod: unscience
    features:
    - mods/unscience/features/doh-runtime-gpu-materials
    technique: reflection
    note: Core, Fur, Attachments, Helmet and Mmu are structs so each reflected read boxes a copy, but the final int[] is a
      reference to the live renderable array.
  - n: 4
    title: 'Background: the per-viewport kitten draw path and animation order (give it its own section)'
    mod: ksastructures
    features:
    - mods/ksastructures/features/first-person-body-hiding-and-shadow
