  - current/decomp/KSA/IAnimProcessor.cs Priority ShouldUpdate
  lifecycle:
  - frame:after-on-frame
  - frame:draw-ui
  - frame:render
  approaches:
  - n: 1
    title: Edit the local TRS pose in UpdateLocalPose, with the distance cull in mind
    mod: ksagolf
    features:
    - mods/ksagolf/features/kitten-pose-processor
    technique: anim-processor
    note: 'Once per frame on the pose after the clip was copied into the span: pre-multiply a rotation, add to translation,
      scale a bone; rest-pose replacement through Skeleton.SetDefaultPose; Swing, Bounce and Spin shapes with fades and loops;
      dt is simulated time so a paused game freezes the pose; mutate AnimProcessors outside the render (after-on-frame). Also
      (from keep-custom-kitten-animation-running-at-distance approach 1): Stock eye, ear and expression processors use priorities
      0.8, 2 and 1; first-person or far cameras change the distance; fly the kitten (or draw it) before expecting the processor
      to run.'
  - n: 2
    title: Overwrite world transforms in UpdateSkeleton once per view
    mod: ksacars
    features:
    - mods/ksacars/features/driver-hands-steering-ik
    - mods/ksastructures/features/first-person-body-hiding-and-shadow
    technique: anim-processor
    note: Runs after the clip, processors and world transforms and before skinning matrices InverseBindPose times WorldTransform;
      edits go straight into the skin; called per viewport so a view-dependent edit is possible; exceptions switch the processor
      off once.
  - n: 3
    title: One-bone shoulder aim
    mod: ksagolf
    features:
    - mods/ksagolf/features/putting-address-pose
    - mods/ksagolf/features/kitten-pose-processor
    technique: anim-processor
    note: GolfPose.Reach turns each shoulder; there is no elbow solve and the repo notes call two-bone IK recorded but not
      implemented. Good enough when the target is near the reach.
  - n: 4
    title: Two-bone IK with a clamped reach and an outward-and-down elbow, in seat-relative model space
    mod: ksacars
    features:
    - mods/ksacars/features/driver-hands-steering-ik
    technique: two-bone-ik
    note: 'Shoulder, elbow and wrist read from Skeleton.WorldTransforms, wrist aimed 4.5 cm short of the grip, elbow by law
      of cosines, shoulder then elbow rotated and written with SetWorldTransform; the pure maths lives in a KSA-free class
      with tests. Also (from convert-between-kitten-model-space-and-the-world approach 2): Model origin sits 0.63 m below
      the seat eye along UpAxis (SeatedOffset), centimetres, seat forward and left axes; where the car is in the world never
      enters the solve.'
  - n: 5
    title: 'Sub-step: convert a standing kitten''s model space to the ecliptic or a camera ego frame'
    mod: ksagolf
    features:
    - mods/ksagolf/features/putting-address-pose
    - mods/ksastructures/features/first-person-kitten-view
    technique: reflection
    note: A KittenFrame helper repeats the chain so any model-space point converts to the ecliptic or to a given camera's
      ego frame without reading a drawn matrix that belongs to whichever camera drew last.
  - n: 6
    title: Stance matrix on the roots plus a spine lean, eased on player time
    mod: ksagolf
    features:
    - mods/ksagolf/features/putting-address-pose
    technique: anim-processor
    note: Multiply every bone with ParentIndex below zero by the stance; refuse a step beyond 90 cm reach; abort when the
      real body drifts 15 cm; posture is written by the step on the main thread and only read in the render so nothing needs
      locking. Explain why teleport fails.
