- slug: hide-a-kitten-body-from-one-viewport
  title: Hide a kitten's body from the main view only, keeping its shadow
  kind: howto
  group: appearance
  batch: kittens-1
  summary: 'Mark which viewport is being drawn in a KittenEva.UpdateRenderData prefix and collapse every bone to a point in
    an anim processor''s UpdateSkeleton for that view alone; camera windows and crew portraits still show the whole kitten;
    the engine also has KittenRenderable.HideHead for the head. (Scope also covers: Give the shadow pass a different skinned
    pose than the colour pass.)'
  game_types:
  - KSA.KittenEva
  - KSA.KittenRenderable
  - KSA.AnimatedRenderable
  - KSA.IAnimProcessor
  - KSA.Program
  - RenderCore.Animation.Skeleton
