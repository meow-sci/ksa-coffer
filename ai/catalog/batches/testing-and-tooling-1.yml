      (A reflection-targets test that resolves every handle against the running build): ReflectionTargetsTest is the drift
      detector; README rule - the oracle is the game''s own propagation, never a re-derivation of the maths under test. Merged
      from make-time-gated-code-deterministic-in-tests (Swap the guidance clock for simulation time in the test base class):
