- slug: measure-and-budget-mod-performance
  title: Measure what a mod costs per frame, throttle expensive work and warm up hot code
  kind: howto
  group: in-game-testing
  batch: testing-and-tooling-1
  summary: Wrap hot code in zero-cost-when-off scopes with periodic average, minimum and worst-frame reports, read the named
    GPU profiler regions of a mod pass with a pinned camera so runs are comparable, and throttle per-frame computations on
    wall-clock intervals, state versions and identity-keyed caches so cost does not scale with FPS or time warp. Also covers
    pre-compiling hot paths on a background thread at load to avoid a first-use hitch. Identity-keyed caches with real and
    sim time limits for expensive solves live in run-an-expensive-solve-without-stalling-the-frame.
  game_types:
  - KSA.GpuProfiler
  - KSA.Profiler
  - KSA.FixedController
  - KSA.Program
  - KSA.Vehicle
  engine_pointers:
  - System.Diagnostics.Stopwatch.GetTimestamp
  - Brutal.Logging DefaultCategory
  - current/decomp/KSA/GpuProfiler.cs Frames
  - LastCompleteFrameIndex
  - IsActive
  - current/decomp/KSA/Profiler.cs Gpu
  - current/decomp/KSA/Vehicle.cs FlightPlan
  - System.Runtime.CompilerServices.ConditionalWeakTable
  - System.Runtime.CompilerServices.RuntimeHelpers.PrepareMethod
  lifecycle:
  - frame:draw-ui
  - frame:after-on-frame
  - frame:render
  - startup:all-mods-loaded
  - thread:background
  approaches:
  - n: 1
    title: DEBUG-only readonly ref struct scope with a periodic report
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/in-game-validation-dumps-and-perf
    - mods/ksa-measuretools/features/resilient-patching-and-diagnostics
    - mods/ksa-advancedflightcomputer/features/warn-once-logging-and-diagnostics
    technique: logging
    note: 'PerfTracker.Scope stamps GetTimestamp only if the debug flag is on (otherwise -1); Dispose records ticks; every
      5 s the tracker logs avg, min, max and call count per key and clears. Also (merged from getting-started/profile-mod-frame-cost
      approach 1, "DEBUG-only readonly ref struct stopwatch scope" [ksa-measuretools]): Compiled out of release; periodic
      avg/min/max reports.'
  - n: 2
    title: Always-on single-writer counters shown in a status window
    mod: gatos
    features:
    - mods/gatos/features/logging-and-perfstats
    technique: imgui-window
    note: 'Borrowed from getting-started. Volatile single-writer counters with allocation counts, readable live without a
      debug build. Also (merged from getting-started/profile-mod-frame-cost approach 2, "Allocation-free single-writer stats
      shown in a window"): Stopwatch ticks with volatile single-writer counters.'
  - n: 3
    title: Nested budget spans with rate-limited overrun warnings
    mod: ksarmory
    features:
    - mods/ksarmory/features/starmap-entry-and-fault-containment
    technique: logging
    note: 'Top-level totals, worst frame and an OverrunLog that limits spam. Also (merged from getting-started/profile-mod-frame-cost
      approach 3, "Nested budget spans with rate-limited overrun warnings"): FrameBudget spans with top-level totals and worst
      frame; OverrunLog limits spam.'
  - n: 4
    title: CloudPassCost reads complete GPU frames while CloudWatch pins the view
    mod: ksarmory
    features:
    - mods/ksarmory/features/raymarched-mushroom-cloud
    technique: reflection
    note: 'Folded from measure-gpu-cost-of-a-mod-pass (sub-step: give it its own section (GPU cost with a pinned camera)).
      Borrowed from shaders or rendering. Sample the newest complete profiler frame on the next step; the same pinned pose
      is used by the dev bridge camera and by the drop scenario''s linger phase.'
  - n: 5
    title: 45 ms wall-clock throttle plus a state-version check for hover picks
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/overlay-drawlist-rendering
    technique: imgui-drawlist
    note: 'Folded from throttle-expensive-ui-computation (sub-step: give it its own section (throttle rather than measure)).
      A frame-count throttle would scale with the refresh rate; a wall-clock interval does not; the cached pick is reused
      until the state version changes.'
  - n: 6
    title: Task.Run PrepareMethod sweep
    mod: ksarmory
    features:
    - mods/ksarmory/features/jit-warmup-kill-path
    technique: background-thread
    note: 'Folded from getting-started/profile-mod-frame-cost approach 4: [Absorbed topic warm-up-hot-code-at-load - Pre-compile
      hot code paths on a background thread at load] Tens of milliseconds of JIT removed from the first kill; no game state
