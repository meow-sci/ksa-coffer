- slug: pin-the-game-build-with-a-hashed-lock
  title: Pin the KSA build with a hashed assemblies lock and notice new builds
  kind: howto
  group: game-updates
  batch: testing-and-tooling-1
  summary: Commit SHA-256 digests of the referenced game DLLs plus the build number so local builds, a private CI mirror and
    the running game agree on one KSA build, stamp that build into the mod for a runtime comparison, and poll the version
    endpoint from a scheduled job to learn of a new build before players do.
  game_types:
  - KSA.Vehicle
  - KSA.VersionInfo
  engine_pointers:
  - current/decomp/KSA/VersionInfo.cs Current.VersionString
  - current/decomp/KSA/VersionInfo.cs MASTER_URL
  - Master.VersionString
  lifecycle:
  - startup:immediate-load
  approaches:
  - n: 1
    title: ksa-assemblies.lock, check-assemblies.sh and AssemblyMetadata from the lock
    mod: ksarmory
    features:
    - mods/ksarmory/features/ksa-assemblies-lock
    - mods/ksagolf/features/api-surface-and-assembly-lock
    - mods/ksacars/features/api-surface-pinning-and-diff
    - mods/ksastructures/features/headless-tests-and-ci
    technique: msbuild
    note: 'The lock holds only names and digests, safe in a public repo; check-assemblies.sh derives the list from the csproj
      references and has --update and --game modes; Directory.Build.props resolves KsaDllDir first-match-wins with an explicit
      error; CI checks out the private mirror with a read-only deploy key and skips with a notice on forks. Merged from detect-a-new-ksa-build-automatically
      (check-ksa-version.sh in a daily ksa-version.yml workflow): The script asks the same master server the game does and
      compares with the lock; the failing run is the notification. Also (merged from patching/validate-patch-targets-and-detect-game-update-breakage
      approach 4, "SHA-256 assembly lock and a generated external member surface" [ksagolf]): Read member references from
      the compiled DLL''s metadata tables, write the list to a surface document, diff a new decompiled build against just
      that surface. Complementary to approach 1.'
  related:
  - reference-game-assemblies-from-a-mod-project
  - build-in-ci-without-the-game-installed
  - check-the-game-version
  - upgrade-a-mod-to-a-new-ksa-build
  - validate-patch-targets-and-detect-game-update-breakage
