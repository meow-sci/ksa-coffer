- slug: take-screenshots-from-code
  title: Take clean screenshots from code, with a composed camera shot held for the capture
  kind: howto
  group: in-game-testing
  batch: testing-and-tooling-1
  summary: Ask KSA's own ScreenshotCapture for a frame with a UI-free warm-up, collect the file and write a manifest of time,
    speed, field of view and the subject's screen position. Also covers holding the main view at a scripted pose (offset from
    a craft or body, aimed at a target, at a chosen FOV) through the camera-owner machinery until the pose and warm-up frames
    settle, and starting captures from a frame hook rather than inside the UI pass.
  game_types:
  - KSA.ScreenshotCapture
  - KSA.Program
  - KSA.Camera
  - KSA.Constants
  - KSA.FixedController
  engine_pointers:
  - current/decomp/KSA/ScreenshotCapture.cs Request(int scale
  - string flags)
  - current/decomp/KSA/Program.cs _screenshotCapture (private)
  - Constants.DocumentsFolderPath exports/screenshots
  - current/decomp/KSA/ScreenshotCapture.cs Request (scale, flags), DEFAULT_WARMUP_FRAMES, OnPrepareFrame (sets Program.DrawUI
    false)
  - current/decomp/KSA/Program.cs _screenshotCapture, Screenshot terminal action, DrawUI
  - current/decomp/KSA/Constants.cs DocumentsFolderPath (exports/screenshots)
  - current/decomp/Core/Renderer.cs ExtentOverride (high-resolution captures)
  - current/decomp/KSA/ScreenshotCapture.cs Request (scale, flags such as ui, hud, warm), DEFAULT_WARMUP_FRAMES
  - current/decomp/KSA/Program.cs _screenshotCapture
  - current/decomp/KSA/Camera.cs EgoToClipDouble
  lifecycle:
  - frame:after-on-frame
  - frame:post-render
  - frame:prepare
  - thread:background
  - frame:viewports
  approaches:
  - n: 1
    title: Reflect the private Program._screenshotCapture once and call the public Request with warm=N
    mod: ksagolf
    features:
    - mods/ksagolf/features/visual-testing-captures
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/file-command-bridge-and-mcp
    - mods/ksacars/features/file-drop-command-bridge
    technique: reflection
    note: 'warm=24 hides the UI during warm-up; move the newest ksa_*.png out of the exports folder; do not start a capture
      from inside the UI pass - set a flag and start it on the next update; account for Renderer.ExtentOverride on scaled
      captures; manifest holds craft_screen from camera.EgoToClipDouble. Also (merged from external-io/take-screenshots-from-code
      approach 1, "Request with warm=24, wait for the new ksa_*.png, move it and write a manifest" [ksacars]): Smallest working
      version: one reflected field, flags string, poll the screenshots folder, move the image beside a JSON manifest (time,
      pause, speed, FOV, craft screen position). Also (merged from rendering/capture-rendered-frames approach 2, "Drive KSA''s
      ScreenshotCapture for clean, scripted frames"): UI-free warm-up, per-image JSON manifest, series spaced in sim seconds
      or frames; account for Renderer.ExtentOverride on high-resolution captures.'
  - n: 2
    title: SceneCamera composed shots, 24-frame countdown, manifest with the craft's projected screen position
    mod: ksagolf
    features:
    - mods/ksagolf/features/visual-testing-captures
    technique: reflection
    note: Borrowed from testing-and-tooling. The manifest is written when the countdown ends so it describes the captured
      instant; craft_screen comes from camera.EgoToClipDouble.
  - n: 3
    title: SceneCamera shot relative to the craft or office, held by the dev bridge
    mod: ksastructures
    features:
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    technique: reflection
    note: Borrowed from testing-and-tooling. The bridge's camera command holds a composed shot driven each step through the
      same view-pose seam.
  - n: 4
    title: Bridge IViewPose holding the main view, optionally orbiting on player time
    mod: ksarmory
    features:
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: view-claim-ladder
    note: Borrowed from testing-and-tooling. DriveCamera runs in claim order beside the mod's other owners and hands the original
      view back afterwards.
  - n: 5
    title: Capture button that only sets a flag, and capture bundles with GPU split
    mod: ksarmory
    features:
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: reflection
    note: A capture must not start inside the UI pass, so the panel sets a static flag that the next frame hook consumes;
      also why the capture hook must be StarMapAfterOnFrame, since ScreenshotCapture hides the HUD and the GUI hooks stop.
  related:
  - visual-regression-for-mods
  - capture-rendered-frames
  - project-world-positions-to-screen
  - drive-a-running-game-through-a-file-bridge
  - handle-renderer-rebuilds
  - borrow-the-main-camera-and-hand-it-back
  merged_from:
  - external-io/take-screenshots-from-code
  - hold-a-composed-camera-shot-for-screenshots
  note: 'Approaches merged into other topics: "Series spaced in simulated seconds, same-instant variant diffs and temporal
    noise maps" -> visual-regression-for-mods.'
- slug: visual-regression-for-mods
  title: Visual regression testing for a KSA mod
  kind: howto
  group: in-game-testing
  batch: testing-and-tooling-1
  summary: Capture pairs or series of frames at the same simulated instant, then diff variants, build contact sheets and GIFs,
    and compute a temporal standard-deviation map to separate real change from render noise.
  game_types:
  - KSA.ScreenshotCapture
  - KSA.Camera
  engine_pointers:
  - current/decomp/KSA/ScreenshotCapture.cs
  lifecycle:
  - frame:after-on-frame
  - frame:post-render
  - thread:background
  approaches:
  - n: 1
    title: Same-instant variant diffs and noise maps with a vis.py toolbox
    mod: ksagolf
    features:
    - mods/ksagolf/features/visual-testing-captures
    technique: image-diff
    note: 'Series spaced in simulated seconds or frames; the variants composite pauses, sets a field, captures, restores and
      diffs. tools/vis/vis.py crops around the craft using the manifest''s screen position. Also (merged from external-io/take-screenshots-from-code
      approach 2, "Series spaced in simulated seconds, same-instant variant diffs and temporal noise maps"): Per-image manifests
      with the craft''s projected screen position, series stepping a paused world, variant captures at the same instant and
      a noise map for shimmer; the Python tools crop around the craft using the manifest.'
  - n: 2
    title: Contact sheets, GIFs and temporal-noise maps returned inline through the MCP server
    mod: ksacars
    features:
    - mods/ksacars/features/ksa-mcp-server
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: mcp-server
    note: Multi-frame captures become a contact sheet and GIF; images return base64 as JPEG; KSArmory pairs it with a verify-in-game
      skill and docs/VISUAL-TESTING.md.
  related:
  - take-screenshots-from-code
  - let-ai-agents-control-the-game-over-mcp
  - run-unattended-scenarios-and-report-a-verdict
- slug: run-unattended-scenarios-and-report-a-verdict
  title: Fly scripted scenarios unattended, report PASS or FAIL and A/B test variants
  kind: howto
  group: in-game-testing
  batch: testing-and-tooling-1
  summary: A developer-only state machine reads a request file at launch, loads a save, spawns targets, flies an engagement
    or drop, and writes tagged lines that a shell harness turns into an exit code, with budgets and restored settings; the
    same runner can fly interleaved variant batches and judge noisy results with a rank test. Also covers the bridge commands
    that load a save and step an exact number of simulated seconds for scripted checks.
  game_types:
  - KSA.GameSaves
  - KSA.Popup
  - KSA.Program
  - KSA.Universe
  - KSA.SimSpeed
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/Popup.cs Popups (private static list)
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  - current/decomp/KSA/Program.cs OnFrame
  - current/decomp/KSA/Popup.cs Popups (private static list), AnyOpen
  - current/decomp/KSA/Universe.cs GetLastSimStep, SetSimulationSpeed
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - frame:after-on-frame
  - startup:game-loaded
  approaches:
  - n: 1
    title: Request file taken once, state machine, wall-clock and sim-time budgets, tagged SCENARIO lines
    mod: ksarmory
    features:
    - mods/ksarmory/features/unattended-scenario-runner
    technique: starmap-lifecycle
    note: 'A file rather than an environment variable because the game is a Windows process launched from WSL. Take-once delete;
      Config and log threshold snapshotted and restored; open KSA popups closed each frame via the private Popup.Popups list
      by reflection because an open popup holds the craft''s throttle; TIMEOUT describes where it was stuck. Also (merged
      from external-io/run-an-unattended-scenario-and-report-pass-or-fail approach 1, "Request file, state machine, SCENARIO
      log lines and wall and sim budgets"): Why a file rather than an environment variable (game launched across WSL), take-once
      semantics, snapshot-and-restore of config around a run, TIMEOUT with a description of where it was stuck. LoadingSave
      then WaitingForWorld states; each frame closes engine popups found through the private static Popup.Popups list because
      an open one holds the throttle. Sub-step: loading a save with GameSaves.LoadSaveGame, waiting for the world and closing
      the engine popup by reflection, gets its own section.'
  - n: 2
    title: Bridge commands for loading a save and stepping an exact number of simulated seconds
    mod: ksacars
    features:
    - mods/ksacars/features/file-drop-command-bridge
    - mods/ksagolf/features/file-command-bridge
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    technique: file-ipc
    note: 'load installs a closure that returns its reply only when Program.ControlledVehicle exists. Same closure in three
      bridges: dtSim is the last sim step in a flight scene and 0 while paused or in menus; the reply is withheld until the
      sum reaches the requested seconds. Mention SetSimulationSpeed with speeds below the UI''s floor. Two sub-steps for a
      section each: load-a-save polling until a vehicle is controlled, and a per-frame closure summing Universe.GetLastSimStep().DeltaTime
      to pause after exactly N simulated seconds.'
  - n: 3
    title: Overnight shot batch with seeded interleaving and Wilcoxon rank-sum verdicts
    mod: ksarmory
    features:
    - mods/ksarmory/features/shot-night-statistics
    technique: statistics
    note: 'Folded from ab-test-mod-behaviour-in-flight (sub-step: give it its own section (statistics on noisy in-game results)).
      shot-batch.sh builds each arm up front, interleaves, copies each shot''s log out, takes a lock, supports resume and
      plan-only; shot-report.py uses exact permutation null and Hodges-Lehmann effect on the mean miss on a log scale. Merged
      from ab-test-mod-behaviour-in-flight (Within-run variant split by craft or tube): Per-craft settings applied by field
      name through ShotArms, so both arms experience the same conditions in one flight.'
  related:
  - drive-a-running-game-through-a-file-bridge
  - headless-test-harness-for-game-mods
  - visual-regression-for-mods
  - measure-and-budget-mod-performance
  - take-screenshots-from-code
  - show-alerts-and-popups-in-game
  - set-simulation-speed-from-a-mod
  - compute-mission-elapsed-time-and-detect-liftoff
  merged_from:
  - ab-test-mod-behaviour-in-flight
  - run-an-unattended-scenario-and-report-pass-or-fail
  - load-a-save-from-code
  - step-the-simulation-an-exact-number-of-seconds
