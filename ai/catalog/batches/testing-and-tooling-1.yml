batch: testing-and-tooling-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: testing-and-tooling
category_description: Testing and tooling for KSA mods - game-free unit tests, headless rigs and in-game HeadlessHarness suites,
  patch and solver tests, developer file bridges, screenshots and visual regression, unattended scenarios, live tuning and
  perf measurement, API-surface tracking, pinned builds and upgrade workflows.
groups:
  in-game-testing: 'Testing and measuring inside a running game: file command bridges, screenshots and visual regression,
    unattended scenarios, live tuning and per-frame cost.'
  offline-tests: 'Tests that run without a live game session: game-free unit tests, headless simulation rigs, HeadlessHarness
    suites, patch tests, solver harnesses and one check script for hooks and CI.'
  game-updates: 'Living with a game that changes under you: decompiled references, API-surface tracking, pinned builds and
    a repeatable upgrade procedure.'
topics:
- slug: drive-a-running-game-through-a-file-bridge
  title: Drive a running game from scripts through a file-drop command bridge
  kind: howto
  group: in-game-testing
  batch: testing-and-tooling-1
  summary: Poll a per-mod folder for JSON command files from the frame postfix, run one command at a time and answer atomically,
    so a shell script, a test runner or an agent can pause, step an exact number of simulated seconds, load a save and wait
    for a flown craft, spawn and script gameplay inputs; keep the bridge and other developer-only features out of player installs
    with a marker file, a manifest key or a build flag.
  game_types:
  - KSA.Universe
  - KSA.SimSpeed
  - KSA.GameSaves
  - KSA.Vehicle
  - KSA.Program
  - KSA.Constants
  - KSA.SimStep
  - KSA.KittenEva
  - KSA.ModManifest
  - KSA.ModEntry
  engine_pointers:
  - current/decomp/KSA/Universe.cs SetSimulationSpeed
  - GetLastSimStep
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  - current/decomp/KSA/Constants.cs DocumentsFolderPath
  - current/decomp/KSA/Universe.cs GetLastSimStep
  - SetSimulationSpeed
  - current/decomp/KSA/GameSaves.cs LoadSaveGame (line 283)
  - MakeUncompressedSave
  - current/decomp/KSA/Program.cs input processing (frame:input)
  - current/decomp/KSA/ModManifest.cs Save (rewrites only id and enabled)
  - current/decomp/KSA/Program.cs OnFrame (StarMapAfterOnFrame postfix site; StarMapAfterGui sits inside the DrawUI block)
  - current/decomp/KSA/Constants.cs DocumentsFolderPath, LogsFolderPath
  - current/decomp/KSA/Universe.cs SetSimulationSpeed, GetLastSimStep
  - current/decomp/KSA/Constants.cs LogsFolderPath (where bridge folders live)
  lifecycle:
  - startup:all-mods-loaded
  - frame:after-on-frame
  - startup:game-loaded
  - frame:input
  approaches:
  - n: 1
    title: in/ and out/ folders, .part rename, polled at 0.1 s from StarMapAfterOnFrame, closures for long commands
    mod: ksagolf
    features:
    - mods/ksagolf/features/file-command-bridge
    - mods/ksacars/features/file-drop-command-bridge
    - mods/ksarmory/features/file-command-bridge-and-mcp
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/unattended-scenario-runner
    - mods/ksagolf/features/putting-session
    - mods/ksarmory/features/build-deploy-package-release
    - mods/ksarmory/features/own-log-file-and-developer-switch
    technique: starmap-lifecycle
    note: 'No port or firewall, works across WSL to Windows. A per-mod subfolder so sibling mods never answer each other;
      id and cmd keys; KSA-free BridgeCommand.TryParse unit-tested; immediate commands reply the same frame, long ones install
      a Func(dtPlayer, dtSim) returning a reply; a sequence of files is a script. Gate it with the developer marker. Merged
      from step-the-simulation-an-exact-number-of-seconds (Bridge step command that sums GetLastSimStep().DeltaTime): Pause
      is simulation speed 0 via SetSimulationSpeed(new SimSpeed(x)); there is no 0.1x floor in the engine, only in the UI.
      Merged from load-a-save-from-code (Load command with a wait-for-world closure): KSArmory''s scenario runner loads a
      named save three seconds after start; the bridges poll until a craft is flown before replying. Merged from script-gameplay-through-a-command-bridge
      (golf and course bridge commands drive the putting session): Borrowed from kittens. Commands drop, pickup, address and
      a swing array of mouse dx per frame with wait_s; the replies feed assertions. Merged from gate-developer-only-features
      (An empty developer file beside the DLL, written by the deploy script and never packaged): Build.Developer is true when
      the file exists; the package script refuses to include it, so a release can never enable the bridge. Also (merged from
      external-io/script-gameplay-through-a-command-bridge approach 1, "Bridge with a KSA-free BridgeCommand parser and craft-level
      commands" [ksacars]): The reference implementation: in/ and out/ folders under the mod log folder, lexically first file
      every 0.1 s of player time, BridgeCommand.TryParse in a game-free Sim assembly, closures advanced once per frame for
      step, load and capture, plus spawn, drive, seat kittens and a telemetry report command. Sub-step: give the developer-only
      marker-file gate (Build.Developer from a file written by the deploy script) a section, since it applies to every bridge
      below.'
  - n: 2
    title: Generic get/set of config fields by reflection and composed-shot commands
    mod: ksagolf
    features:
    - mods/ksagolf/features/file-command-bridge
    technique: file-ipc
    note: Adds set/get over every public Config field by name, kitten pose and prop commands, camera holding and a swing array;
      shows how a bridge grows with a mod's panels.
  - n: 3
    title: Bridge with shader hot reload and an in-building scene for visual checks
    mod: ksastructures
    features:
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: file-ipc
    note: 'Adds reload_shaders through the internal FileReference.DoLoad, lighting and view commands, and the closure model;
      useful as the lean variant of the same protocol. Also (merged from external-io/script-gameplay-through-a-command-bridge
      approach 4, "Bridge that doubles as an effect lab and a camera claimant" [ksarmory]): Commands for bursts, spawn, fly
      and fire; the bridge holds the main view as one claimant of the camera arbiter; a UI button only sets a flag so a capture
      never starts inside the UI pass.'
  - n: 4
    title: A custom key on the mod's manifest.toml entry
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/patch-debug-stepper
    technique: toml-config
    note: 'Folded from gate-developer-only-features (sub-step of the bridge: give it its own section (keep the bridge out
      of player installs)). Read the extra key from the player''s manifest.toml; note that the game''s ModManifest.Save rewrites
      only id and enabled, so extra keys are dropped when the game saves.'
  - n: 5
    title: DEBUG compile flag plus a DebugConfig runtime switch
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/in-game-validation-dumps-and-perf
    technique: msbuild
    note: 'Folded from gate-developer-only-features (sub-step of the bridge: give it its own section (keep the bridge out
      of player installs)). Whole dump and perf code is'
  related:
  - let-ai-agents-control-the-game-over-mcp
  - take-screenshots-from-code
  - reload-a-mod-shader-in-a-running-game
  - run-unattended-scenarios-and-report-a-verdict
