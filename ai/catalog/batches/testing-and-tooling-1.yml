  - detect-a-new-ksa-build-automatically
- slug: upgrade-a-mod-to-a-new-ksa-build
  title: Upgrade a mod to a new KSA build and degrade gracefully when the API drifts
  kind: howto
  group: game-updates
  batch: testing-and-tooling-1
  summary: A repeatable procedure (refresh the pinned binaries and decompiled corpus, diff only what the mod touches, classify
    each coupling by how it fails, fix, record the new build and fly it), plus runtime design that resolves game members once
    and latches a single feature as degraded instead of crashing.
  game_types:
  - KSA.Program
  - KSA.GameSettings
  - KSA.ImGuiBackendVulkanImpl
  - KSA.Vehicle
  engine_pointers:
  - current/version.json (changelog commits can have gaps; the decomp diff is the full record)
  - current/decomp
  - current/dll
  lifecycle:
  - event:game-update
  - startup:all-mods-loaded
  - frame:viewports
  - frame:draw-ui
  approaches:
  - n: 1
    title: Lock, decompile both builds, diff narrowed to the API surface, then update the lock
    mod: ksarmory
    features:
    - mods/ksarmory/features/ksa-assemblies-lock
    - mods/ksarmory/features/api-surface-tracking
    - mods/ksacars/features/api-surface-pinning-and-diff
    - mods/ksagolf/features/api-surface-and-assembly-lock
    technique: decompiling
    note: Four commands - sync-import.sh, sync-assemblies.sh, check-assemblies.sh --update, commit; packaged as an upgrade-ksa
      agent skill that also diffs Core XML and pushes the private mirror first.
  - n: 2
    title: Coupling-catalog review skill that classifies how each coupling fails
    mod: purrtty
    features:
    - mods/purrtty/features/ksa-upgrade-coupling-review-skill
    technique: agent-skill
    note: 'Direct member reference fails at compile, Harmony targets at load, reflection silently, behaviour silently wrong;
      asset ids at runtime; severity per touchpoint; the baseline is the last validated build, not the previous folder. Also
      (merged from patching/validate-patch-targets-and-detect-game-update-breakage approach 5, "Coupling catalog and an upgrade-review
      skill"): Catalog of every mod-to-game coupling classified by failure mode (throws at patch time, silent no-op, wrong
      behaviour) and a skill that diffs two builds against it and reports severity per touchpoint.'
  - n: 3
    title: KsaAnchor-annotated bindings, scope catalog and changelog scan
    mod: gatos
    features:
    - mods/gatos/features/ksa-anchor-churn-tracking
    technique: annotation
    note: 'Every KSA binding carries member, source file, verified date, game version and risk, so a compile break lands on
      an annotated site and grep finds every reflection target; the playbook is also an agent skill. Merged from degrade-one-feature-on-api-drift
      (Per-accessor health latches published in the snapshot): KsaHealth.Fault logs once and marks the accessor degraded;
      later commands return EOPNOTSUPP; a later success clears it; the list is published as /sim/status/accessors.'
