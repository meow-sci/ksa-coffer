  - replace-the-stock-aerodynamic-force-model
  - simulate-bodies-outside-the-vehicle-system
  - draw-ui-while-the-hud-is-hidden
  - contain-exceptions-in-starmap-hooks
  merged_from:
  - play-a-sound-at-a-world-position
  - hold-and-move-a-spatial-channel-every-frame
- slug: drive-sound-parameters-from-code
  title: Drive a sound's Param curves from code and reuse stock sounds
  kind: howto
  group: playback
  batch: audio-1
  summary: Set the named parameters a sound's <Param> curves listen to (Throttle, Distance, Pressure, Intensity, Iva) with
    SetParameter and a KeyHash, knowing the engine stores the value and applies it in GameAudio.UpdateAudio and that a sound
    played by hand reads zero; use it to reuse Core's stock engine and explosion sounds for mod-simulated rockets, cars, missiles
    and blasts.
  game_types:
  - KSA.IChannel
  - KSA.ChannelWrapper
  - KSA.CompoundChannelWrapper
  - KSA.MultiChannelWrapper
  - KSA.SoundParameterData
  - KSA.KeyHash
  - KSA.GameAudio
  - KSA.SoundEvent
  - KSA.CompoundSound
  - KSA.ClusterSound
  - KSA.Vehicle
  - KSA.ViewportRegistry
  - KSA.ExplosionSoundSystem
  - KSA.ExplosionSystem
  - KSA.Rendering.Particles.ExplosionReference
  - KSA.MultiSound
  - KSA.SoundBehavior
  - KSA.SpatialAudio
  - KSA.AssetBundle
  engine_pointers:
  - current/decomp/KSA/SoundParameterData.cs (Type Volume/Pitch/Lpf/Hpf, InMin/InMax/OutMin/OutMax, Reverse mode, Rule)
  - current/decomp/KSA/ChannelWrapper.cs SetParameter, ApplyParameters L212-L246
  - current/decomp/KSA/GameAudio.cs UpdateAudio (ApplyParameters per active channel)
  - current/decomp/KSA/ExplosionSoundSystem.cs (reference for Distance, Pressure, Intensity)
  - current/decomp/KSA/Vehicle.cs UpdateAudio L6127-L6189 and sound hashes L6961-L6966
  - current/decomp/KSA/GameAudio.cs PlaySound(SoundEvent ...) (cluster sound attached to parent IAudio)
  - current/Content/Core/Sounds.xml DefaultEngine Param curves, DefaultEngineSoundBehavior
  - current/decomp/KSA/ExplosionSystem.cs SpawnPresetInternal L253-L257
  - current/decomp/KSA/ExplosionSoundSystem.cs Spawn, UpdateAudio, StopAll
  - current/decomp/KSA/Rendering/Particles/ExplosionReference.cs (Sound field)
  - current/Content/Core/ExplosionAssets.xml Explosion_Conflagration L99-L116, ExplosionBig L219-L249
  - current/decomp/KSA/Universe.cs DeserializeSave (ExplosionSoundSystem.StopAll)
  lifecycle:
  - frame:draw-ui
  - frame:post-render
  - frame:after-on-frame
  - startup:asset-load
  - frame:celestials
  approaches:
  - n: 1
    title: Engine parameters mirrored from Vehicle.UpdateAudio, borrowing the stock engine sound
    mod: ksacars
    features:
    - mods/ksacars/features/rocket-sound-without-engine
    technique: fmod-audio
    note: 'Prebuilt KeyHash.Make hashes; parameters set in StarMapAfterGui are consumed in the same frame''s PostRender apply
      pass; CompoundChannelWrapper fans SetParameter to start, loop, stop and the subscribed cluster channel; parameter multipliers
      reset after each apply so they must be set every frame. Absorbed from reuse-the-stock-engine-sound: give a section to
      playing Core''s DefaultEngineSoundBehavior for a mod-simulated rocket by mirroring the per-nozzle branch of Vehicle.UpdateAudio.
      Mirrors the per-nozzle branch of Vehicle.UpdateAudio: start paused, SetSpatialAudio, SetParameter Throttle/Distance/Pressure/Iva
      via prebuilt KeyHash, unpause on the first frame. Author states it has not been listened to in game, so treat the mix
      as unverified. One channel per car at its centre; silent above 10x.'
  - n: 2
    title: Explosion parameters set by hand on a MultiSound, preset stripped of its SoundEvent
    mod: ksarmory
    features:
    - mods/ksarmory/features/burst-sound-at-blast-arrival
    technique: fmod-audio
    note: 'ExplosionBig''s three layers mix on Distance (100-1000 m crack versus far report), Pressure (echo layer) and Intensity;
      the engine''s ExplosionSoundSystem sets them, but a sound played by hand needs them set explicitly or the layers mix
      wrong; MultiChannelWrapper forwards pitch and parameters to all layers. Absorbed from play-a-stock-explosion-sound:
      give a section to copying a Core Explosion preset without its SoundEvent so the engine stays silent, then playing the
      same Core sound yourself. KSArmoryNuclearBurst keeps Core''s flash and drops SoundEvent (and VolumeRef, for an unrelated
      cloud reason); BurstSound plays ExplosionBig with SoundBehavior.Play(startPaused: true), PitchMultiplier = cbrt(0.3
      kt / kt) clamped 0.35..1, Distance/Pressure/Intensity parameters, unpause, then re-places the channel each frame while
      IsStillActive. Calling SoundBehavior.Play directly skips the 10x and 50 km gates that GameAudio.PlaySound applies.'
  - n: 3
    title: Stock engine loop for a mod-simulated projectile with Throttle pinned open
    mod: ksarmory
    features:
    - mods/ksarmory/features/spatial-gun-and-motor-sounds
    technique: fmod-audio
    note: One channel per burning mod-simulated round; Core's loop maps Throttle 0 to 0.1x volume and 0.5x pitch so the mod
      sets Throttle=1 on start; the same lookup resolves mod and Core ids, so a custom sample can later replace the borrowed
      one without code changes.
