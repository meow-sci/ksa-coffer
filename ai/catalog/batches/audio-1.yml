category: audio
category_description: Playing sound in KSA from a mod through the game's FMOD system - shipping sound XML assets, placing
  and moving spatial channels, reusing Core sounds and their parameters, timing sounds against the world, and bringing your
  own files or music.
groups:
  playback: 'Playing sounds against the world from code: spatial channels, parameter curves, engine loops and propagation
    delay.'
  sound-assets: Declaring sounds and music as XML assets, and the sound type map they register into.
  channels: 'Owning FMOD channels: raw sound files, time-warp and volume behaviour, and releasing channels at scene change
    and exit.'
topics:
- slug: play-a-sound-at-a-world-position-and-hold-its-channel
  title: Play a sound at a world position and hold its spatial channel
  kind: howto
  group: playback
  batch: audio-1
  summary: Start a declared sound so it pans, attenuates, Doppler-shifts and is muffled by air pressure as if it came from
    a point in the world, using SpatialAudio built from a nearby object plus an offset or from camera-relative Ego vectors,
    then keep the returned IChannel, re-place it each frame with SetSpatialAudio, restart it when the engine has reclaimed
    it, and sweep channels against the live roster so nothing keeps playing after its owner is gone.
  game_types:
  - KSA.GameAudio
  - KSA.SpatialAudio
  - KSA.SoundBehavior
  - KSA.IChannel
  - KSA.Camera
  - KSA.PhysicalAtmosphereReference
  - KSA.ModLibrary
  - KSA.ChannelWrapper
  - KSA.CompoundChannelWrapper
  engine_pointers:
  - current/decomp/KSA/SpatialAudio.cs (constructors from Astronomical + offset and from Ego position/velocity/pressure)
  - current/decomp/KSA/GameAudio.cs GetAudioCamera, PlaySound overloads
  - current/decomp/KSA/ChannelWrapper.cs SetSpatialAudio (pressure to low-pass cutoff)
  - current/decomp/KSA/Camera.cs GetPositionEgo, GetVelocityEgo
  - current/decomp/KSA/GameAudio.cs UpdateAudio (drops channels that are neither playing nor virtual)
  - current/decomp/KSA/IChannel.cs
  - current/decomp/KSA/ChannelWrapper.cs UpdateVolume, UpdatePitch (multipliers persist until reset)
  lifecycle:
  - frame:draw-ui
  - frame:celestials
  - frame:after-on-frame
  - frame:post-render
  approaches:
  - n: 1
    title: GameAudio.PlaySound with SpatialAudio(Astronomical, offset)
    mod: ksagolf
    features:
    - mods/ksagolf/features/world-positioned-sounds
    technique: fmod-audio
    note: 'Anchor on a live vehicle near the sound and add the Ecl difference as the offset (Ego is a pure translation of
      Ecl); Doppler and pressure then come from the anchor. Includes ModLibrary.Get<SoundBehavior> lookup and the speed-band
      choice of sound id and volume. Fire-and-forget: no channel is kept, so this approach needs no hold-and-move section.'
  - n: 2
    title: Hand-built Ego SpatialAudio, one held channel per source swept against the live roster
    mod: ksarmory
    features:
    - mods/ksarmory/features/spatial-gun-and-motor-sounds
    - mods/ksacars/features/engine-sound-crossfade
    technique: held-channel
    note: 'Listener is GameAudio.GetAudioCamera(); position and velocity from camera.GetPositionEgo/GetVelocityEgo, pressure
      from PhysicalAtmosphereReference.GetAtmosphericPressure(listener). Use when the source is a mod-simulated object (platform
      ego plus the round''s own offset keeps it epoch-clean at orbital speed). Bypasses GameAudio.PlaySound''s 10x gate. Absorbed
      from hold-and-move: [armory] the channel unit is chosen by what the ear hears (one pitched loop for a fast gun, not
      many one-shots); the channel is moved every frame after the rounds are stepped, dictionaries are swept against the live
      roster, and the loop is never restarted from code. Give the held-channel lifecycle (SetSpatialAudio each frame, restart
      when reclaimed, sweep) its own section. Channel unit chosen by what the ear hears (a 75 round per second gun is one
      pitched loop, not 75 one-shots); position is platform ego plus the round''s offset; dictionaries swept each frame against
      the live roster; update runs after the rounds are stepped so a motor is heard where its round is now; do not restart
      a loop from code, let <Loop /> loop it.'
  - n: 3
    title: One looping channel per craft, guarded move and cut
    mod: ksacars
    features:
    - mods/ksacars/features/engine-sound-crossfade
    - mods/ksacars/features/rocket-sound-without-engine
    technique: fmod-audio
    note: 'Absorbed from hold-and-move: a sub-step section on keeping a looping channel per craft: guarded TryMove/Cut, replace
      a dead channel next frame. SoundChannels.TryMove/Cut wrap every call in try because the engine drops a finished channel;
      a dead channel is replaced next frame; per-craft dictionary; Update runs from the dual-hook StepOnce on the main thread,
      before GameAudio.UpdateAudio in PostRender applies the values.'
  related:
  - ship-custom-sounds-as-xml-assets
  - cursor-to-world-ray
  - understand-ksa-coordinate-frames-and-epochs
  - keep-mod-sounds-sensible-under-time-warp
  - release-sound-channels-at-scene-change-and-exit
