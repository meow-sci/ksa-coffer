- slug: play-a-spin-up-loop-tail-sound-and-crossfade-engine-loops
  title: Crossfade engine loops and play spin-up, loop and tail sounds
  kind: howto
  group: playback
  batch: audio-1
  summary: 'Make a simulated engine or weapon sound alive: crossfade an idle and a load loop by throttle and RPM with per-loop
    pitch against the recorded RPM, or declare a CompoundSound whose StartSound, looping Sound and StopSound ramp up, hold
    and wind down without the mod scheduling any of it. Includes cutting seamless mono loops from recordings.'
  game_types:
  - KSA.IChannel
  - KSA.SoundBehavior
  - KSA.SpatialAudio
  - KSA.GameAudio
  - KSA.CompoundSound
  - KSA.CompoundChannelWrapper
  - KSA.SoundReference
  - KSA.SoundFileReference
  engine_pointers:
  - current/decomp/KSA/ChannelWrapper.cs UpdateVolume, UpdatePitch (VolumeMultiplier and PitchMultiplier persist)
  - current/decomp/KSA/GameAudio.cs UpdateAudio
  - current/decomp/KSA/Program.cs PostRender L2362
  - current/decomp/KSA/CompoundSound.cs Play (stop sound starts paused)
  - current/decomp/KSA/CompoundChannelWrapper.cs Stop, SetParameter, SetSpatialAudio, SetPaused
  - current/Content/Core/Sounds.xml DefaultEngineSoundBehavior (same shape)
  - current/decomp/KSA/SoundFileReference.cs (Path, Volume, Loop, LoopData)
  - current/Content/Core/Sounds.xml (how Core declares loops)
  lifecycle:
  - startup:asset-load
  - frame:draw-ui
  - frame:after-on-frame
  - frame:post-render
  approaches:
  - n: 1
    title: Two mono loops with per-frame volume and pitch multipliers, cut from recordings with recorded-RPM provenance
    mod: ksacars
    features:
    - mods/ksacars/features/engine-sound-crossfade
    - mods/ksacars/features/art-and-audio-pipeline-tooling
    technique: fmod-audio
    note: 'rev from RPM between idle and redline, loaded = clamp(1.4 rev + 0.35 load); idle volume 1 - 0.85 loaded, pitch
      Rpm / IdleRecordedRpm; load volume scaled by loaded and Load, pitch Rpm / LoadRecordedRpm; clamps 0.5..2.5 pitch and
      0..2 volume; 2 s wait for the starter clip; loops cut above 4x warp; only the car the player flies is heard. Absorbed
      from cut-looping-sounds: give a section to cutting the idle and load loops from a CC0 recording with NumPy/SciPy scripts
      and recording the source RPM that the pitch ratio depends on. buggy-sounds.py and eldorado-sounds.py track the strongest
      engine line, cut loops at zero-return points, 20 ms seam crossfade, resample_poly and peak normalisation; tools/audio/README.md
      records freesound id, licence and the RPM each loop was recorded at (feeds IdleRecordedRpm and LoadRecordedRpm).'
  - n: 2
    title: CompoundSound spin, loop and tail cut from one recording, held while firing
    mod: ksarmory
    features:
    - mods/ksarmory/features/spatial-gun-and-motor-sounds
    technique: compound-sound
    note: 'Three <Sound> cuts (spin, <Loop /> loop, tail) plus <CompoundSound> with StartSound/Sound/StopSound; one channel
      per firing system held while guns fire; loop re-pitched toward the gun''s rate within 0.8..1.25 and ApplyParameters;
      a loop-plus-tail compound without a spin-up when the recording has none; cut points measured off the envelope. Absorbed
      from cut-looping-sounds: give a section to the envelope-measured spin, loop and tail cuts from one recording. tools/cut-cannon.py
      splits one recording into spin-up, loop and tail at envelope-measured points so a new recording needs no new numbers;
      recording licences tracked beside the scripts.'
