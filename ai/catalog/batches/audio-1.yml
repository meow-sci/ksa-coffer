- slug: ship-custom-sounds-as-xml-assets
  title: Ship custom sounds with a mod as XML sound assets
  kind: howto
  group: sound-assets
  batch: audio-1
  summary: Declare your own wav files in a mod asset XML (listed in mod.toml assets) so KSA registers them as SoundBehaviors
    you can look up by id, with the right channel group, 3D range, loop flag, priority and simulation-speed rule.
  game_types:
  - KSA.SoundReference
  - KSA.SoundFileReference
  - KSA.SpatialSoundData
  - KSA.SoundBehavior
  - KSA.AssetBundle
  - KSA.ModLibrary
  - KSA.ChannelGroupReference
  engine_pointers:
  - current/decomp/KSA/AssetBundle.cs (XmlElement table for Sound, SpatialSoundData, CompoundSound, MultiSound, MusicPlaylist,
    ChannelGroup)
  - current/decomp/KSA/SoundReference.cs (ChannelId, Priority default 128, SimSpeed, SelectionRule, Pitch, Volume, Param)
  - current/decomp/KSA/SpatialSoundData.cs (VolumeRange, TwoDRange)
  - current/decomp/KSA/ModLibrary.cs PopulateSounds
  - current/Content/Core/Sounds.xml (ExternalChannel group under Sfx, reference shapes)
  lifecycle:
  - startup:asset-load
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: One-shot sounds with random variants and a simulation-speed rule
    mod: ksagolf
    features:
    - mods/ksagolf/features/world-positioned-sounds
    technique: xml-asset
    note: Four <Sound> assets on ExternalChannel, two <SoundFile> children each (SelectionRule defaults to Random), SimSpeed=OnlyLower,
      <SpatialSoundData><VolumeRange Min Max> plus TwoDRange 0/0 for fully positional playback. Shows what each attribute
      means in the decomp and that ModLibrary.Get<SoundBehavior> throws on an unknown id.
  - n: 2
    title: Looping layers sharing one SpatialSoundData asset
    mod: ksacars
    features:
    - mods/ksacars/features/engine-sound-crossfade
    technique: xml-asset
    note: A named <SpatialSoundData Id> declared once and referenced from four <Sound> elements per car; <Loop /> inside <SoundFile>
      turns on FMOD loop mode; Volume clamped 0..2; mono files because the engine spatialises the source; missing asset file
      in mod.toml means a silent id that the mod warns about once.
  - n: 3
    title: Per-weapon-class spatial data, priority and pitch variation
    mod: ksarmory
    features:
    - mods/ksarmory/features/spatial-gun-and-motor-sounds
    technique: xml-asset
    note: SpatialSoundData per weapon class (a 5-inch gun carries further than a 20 mm), Priority=110 so gun channels beat
      Core's explosion (123/124) and engine (125) sounds under FMOD's voice limit, a <Pitch Min Max> range so a repeated gunshot
      is not one sample, and the Python cut scripts' provenance habit.
