  title: Play your own sound files through KSA's FMOD system without blocking
  kind: howto
  group: channels
  batch: audio-1
  summary: Create FMOD sounds from bytes or a file path on GameAudio.System, open long files with NonBlocking and poll their
    state, and play them on the game's Sfx, Music or Ui channel group (optionally attached in 3D to a vessel) so they mix
    with game audio and obey the player's volume sliders, without ever owning or pumping the FMOD system.
  game_types:
  - KSA.GameAudio
  - Brutal.FmodApi.FmodSystem
  - Brutal.FmodApi.Sound
  - Brutal.FmodApi.Channel
  - Brutal.FmodApi.Mode
  - KSA.ChannelGroupType
  - KSA.ChannelGroupReference
  - KSA.ModLibrary
  - Brutal.FmodApi.OpenState
  - Brutal.FmodApi.Result
  - KSA.SpatialAudio
  - KSA.Vehicle
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/GameAudio.cs System, OnApplicationStart (Init 1024, 3D right-handed, file callbacks, Master/Sfx/Ui/Music
    groups), GetChannelGroup L660-L680, CreateFmodSound L270-L280, UpdateAudio
  - current/decomp/KSA/ChannelGroupReference.cs
  - current/decomp/KSA/Program.cs PostRender L2362 (GameAudio.UpdateAudio pumps FMOD)
  - current/decomp/Brutal.FmodApi/Fmod.cs TryCreateSound, TryCreateStream, TryPlaySound
  - current/decomp/KSA/GameAudio.cs CreateFmodSound (Thread.Sleep(1) loop on TryGetOpenState for streamed sounds)
  - current/decomp/Brutal.FmodApi/OpenState.cs
  - current/decomp/KSA/SpatialAudio.cs PositionView, VelocityView (camera view space; KSA never sets FMOD listener attributes)
  - current/decomp/KSA/ChannelWrapper.cs SetSpatialAudio (convention being matched)
  - current/decomp/KSA/Program.cs L2263 (OnFrameViewports before GUI), L2267 (OnDrawUiFrame), L2362 (PostRender)
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  - frame:after-on-frame
  - frame:post-render
  - thread:background
  - event:save
  - event:load
  - frame:prepare
  approaches:
  - n: 1
    title: In-memory sounds, channel table and ref-counted release
    mod: gatos
    features:
    - mods/gatos/features/fmod-audio-playback
    technique: fmod-audio
    note: TryCreateSound(bytes, OpenMemory | _2d | CreateSample or CreateCompressedSample above 1 MiB), cached by (name, version);
      play on GameAudio.GetChannelGroup(Sfx/Music/Ui) started paused, then position, loop, volume, pitch and unpause; release
      a Sound only when no live channel plays it; never call System.Update/Close/Release; uploads stay on transport threads,
      FMOD calls on the main thread.
  - n: 2
    title: File-path streams on the Sfx group, opened non-blocking and polled each frame
    mod: unscience
    features:
    - mods/unscience/features/byo-music-vessel-3d-audio
    technique: fmod-audio
    note: 'TryCreateStream with a NUL-terminated UTF-8 absolute path (KSA''s file callbacks File.OpenRead the name), group
      from ModLibrary.Get<ChannelGroupReference>("Sfx").ChannelGroup, TryPlaySound paused, configure, unpause; Mode flags
      for 3D, loop and rolloff; avoid a second FMOD system (second listener and device). Absorbed from load-fmod-streams-without-blocking:
      give a section to opening long files with Mode.NonBlocking and polling the open state once per frame. TryCreateStream(Mode._3d
      | NonBlocking | LoopOff); each Update checks TryGetOpenState: Error aborts with a ''use PCM WAV, MP3 or Ogg Vorbis''
      message, anything but Ready waits a frame, 15 s without readiness is a timeout. The extension is not a codec check,
      so a mislabelled file ends as a per-entry error rather than a stuck Loading.'
  - n: 3
    title: One VesselSound per entry with per-frame 3D attributes and a completion-based repeat scheduler
    mod: unscience
    features:
    - mods/unscience/features/byo-music-vessel-3d-audio
    technique: fmod-audio
    note: 'Absorbed from attach-an-imported-sound-to-a-vessel-in-3d: a 3D vessel-attached playback layer on top of the stream
      approach, including persistence across scene saves. TrySet3dAttributes(spatial.PositionView(), VelocityView()) every
      frame after Mode._3d | _3dLinearRolloff, min/max (min(10, range*0.1), range), spread 0 for stereo files, Doppler 0;
      native LoopNormal for zero gap, otherwise RepeatPlayback.Advance counts real seconds from observed completion and keeps
      elapsed silence when the gap is edited; stop on vessel loss; scene-save participant restores paused sounds. Possible
      finish-path issue noted by static reading (strict TrySetPaused before tolerant TryIsPlaying), unverified in game.'
