- slug: delay-a-sound-until-the-blast-front-arrives
  title: Delay a world sound by the time sound takes to reach the listener
  kind: howto
  group: playback
  batch: audio-1
  summary: Make a distant event heard after it is seen by following its expanding front against the live audio camera instead
    of using a fixed delay, so flying toward it brings the sound sooner, with gates for vacuum, inaudible pressure and a ground-reflected
    second report. Coincident bursts are merged into one effect rather than stacked.
  game_types:
  - KSA.GameAudio
  - KSA.PhysicalAtmosphereReference
  - KSA.AtmosphereReference
  - KSA.Camera
  - KSA.Celestial
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/PhysicalAtmosphereReference.cs (pressure, density at altitude, speed of sound inputs)
  - current/decomp/KSA/GameAudio.cs GetAudioCamera
  - current/decomp/KSA/Celestial.cs GetBodyFixed2Ecl (anchor an event in the body-fixed frame)
  - current/decomp/KSA/GameAudio.cs (voice and channel limits, System.Init(1024 ...))
  lifecycle:
  - frame:draw-ui
  - frame:celestials
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Per-burst front aged on the simulated step and compared with the camera every frame, coincident bursts merged
    mod: ksarmory
    features:
    - mods/ksarmory/features/burst-sound-at-blast-arrival
    technique: live-front-arrival
    note: 'Speed of sound sqrt(gamma P0 / rho0) from the body''s atmosphere; Sedov-Taylor then sonic front radius, bisected
      for arrival; ground-anchored in the body frame so a minutes-long wait does not leave the burst behind the planet''s
      orbital speed; vacuum gate; 50 Pa audibility gate and loudness min(1, sqrt(p/1000)); an air-burst second report from
      the ground mirror path; stepped by _lastSimStep so it waits through pause and hurries under warp. Absorbed from merge-coincident-events:
      give a section to folding events that coincide in time and place into one louder effect instead of stacking voices.
      A new burst on the same body, no more than 0.5 s after a queued front and anchored within 1 km, adds its charge to that
      front (ChargeKg +=) instead of queuing a new one; called from both the new-cloud and merge paths of the cloud code so
      a bomb dropped on a standing fireball is still heard.'
  related:
  - drive-sound-parameters-from-code
  - play-a-sound-at-a-world-position-and-hold-its-channel
  - simulate-bodies-outside-the-vehicle-system
  - read-body-properties-and-orbit-elements
  - spawn-particle-effects
  merged_from:
  - merge-coincident-events-into-one-effect
