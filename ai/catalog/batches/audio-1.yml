- slug: keep-mod-sounds-sensible-under-time-warp
  title: Keep mod-played sounds sensible under time warp and the player's volume
  kind: howto
  group: channels
  batch: audio-1
  summary: Know what the engine does to a sound at high simulation speed (pitch rule, stop above 10x, PlaySound refusing)
    and the player's Master and Sfx sliders, and choose per sound whether to follow it, override it or bypass it.
  game_types:
  - KSA.GameAudio
  - KSA.ChannelWrapper
  - KSA.SimSpeedRule
  - KSA.SoundReference
  - KSA.ChannelGroupType
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/GameAudio.cs PlaySound L383-L423 (Universe.SimulationSpeed > 10 early-out, alwaysPlay), UpdateAudio,
    ApplySettings, MapVolumeSetting
  - current/decomp/KSA/ChannelWrapper.cs HandleSimSpeedPitch, StopForSimSpeed L497-L503
  - current/decomp/KSA/SimSpeedRule.cs (None, Ignore, All, OnlyLower, OnlyHigher)
  lifecycle:
  - startup:asset-load
  - frame:draw-ui
  - frame:post-render
  approaches:
  - n: 1
    title: Declare a SimSpeed rule and let the engine handle it
    mod: ksagolf
    features:
    - mods/ksagolf/features/world-positioned-sounds
    technique: fmod-audio
    note: SimSpeed=OnlyLower follows pitch below 1x (floored at 0.25) and never raises it; GameAudio.PlaySound silently returns
      no channel above 10x unless alwaysPlay, which the caller must handle; channels are stopped above 10x unless SimSpeed=Ignore.
  - n: 2
    title: Cut your own loops below the engine's threshold
    mod: ksacars
    features:
    - mods/ksacars/features/engine-sound-crossfade
    technique: fmod-audio
    note: Calling SoundBehavior.Play directly skips the PlaySound 10x early-out; the mod cuts its loops above 4x without a
      key-off because RPM swings under warp are only noise, which sits below StopForSimSpeed and HandleSimSpeedPitch.
  - n: 3
    title: Channels the game never registers
    mod: unscience
    features:
    - mods/unscience/features/byo-music-vessel-3d-audio
    technique: fmod-audio
    note: 'FMOD channels made directly on GameAudio.System and the game''s Sfx group are not in ActiveChannels, so HandleSimSpeedPitch
      and StopForSimSpeed never touch them: stable pitch, plays in space and in warp, still follows the player''s SFX and
      master sliders; Doppler level 0 keeps pitch steady.'
