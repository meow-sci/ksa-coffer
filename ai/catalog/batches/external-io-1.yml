- slug: export-game-state-to-other-threads
  title: Export live game state to background threads with immutable snapshots and a fixed sample clock
  kind: howto
  group: telemetry
  batch: external-io-1
  summary: 'Keep every transport thread away from KSA objects by building one immutable snapshot on the game thread and publishing
    it with a single volatile reference swap. Readers get lock-free access, async waiters wake on publish, and per-snapshot
    memoization keeps N readers at the cost of one format. Also covers choosing the sampling cadence: a drift-free accumulator
    that keeps phase but drops backlog after a hitch, so sampling runs a few times per second instead of every frame.'
  game_types:
  - KSA.Universe
  - KSA.Program
  - KSA.Vehicle
  - KSA.CelestialSystem
  - KSA.App
  engine_pointers:
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers (state settled before the sampler runs)
  - current/decomp/KSA/Program.cs ControlledVehicle, OnFrame
  - current/decomp/KSA/Universe.cs GetElapsedSeconds, CurrentSystem.All
  - current/decomp/KSA/Program.cs GetPlayerTime (wall-clock Stopwatch based)
  - current/decomp/KSA/Universe.cs GetElapsedSeconds, GetLastSimStep
  - current/decomp/KSA/App.cs (dtPlayer clamped to 1 / MinTargetFrameRate)
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  - frame:after-on-frame
  - thread:background
  approaches:
  - n: 1
    title: Sampler builds an immutable snapshot, volatile swap, TaskCompletionSource wake
    mod: gatos
    features:
    - mods/gatos/features/telemetry-sampler-snapshot
    technique: immutable-snapshot
    note: 'Per-vehicle try/catch so one craft mid-teardown cannot kill the sample, per-stream gates that skip KSA reads when
      nobody listens, a ConditionalWeakTable memo of projections per snapshot, and a GC.GetAllocatedBytesForCurrentThread
      delta as an allocation tripwire. The canonical pattern; every gatOS transport reads only the store. Default 10 Hz, 1-120
      configurable, clock reset and sampling idle while no transport client is connected. Unit-testable because the clock
      is game-free. Sub-step: give the SampleClock accumulator (drift-free phase, dropped backlog after a hitch) its own section;
      it is the answer to "sample telemetry at a fixed interval".'
  - n: 2
    title: Plain-struct snapshot sampled after the frame, drawn next frame (single thread, no locks)
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/live-flight-telemetry-sampling
    technique: snapshot-copy
    note: 'The lightest version for a UI-only consumer: copy kinematics into a plain snapshot from StarMapAfterOnFrame and
      let the next frame''s draw read it, accepting one frame of latency. Contrast with approach 1 to show when you need the
      volatile swap.'
  related:
