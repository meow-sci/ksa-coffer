    technique: background-thread
    note: 'Thread inventory (spawn, pump, writer, waiter, teardown, detection) and the rule that only the tick touches ImGui
      and the clipboard; hidden-HUD behaviour (no tick, queues fill to their bound). Primary: map every thread to one StarMapAfterGui
      tick; also sets the thread rules for the remaining approaches.'
  - n: 2
    title: Bounded byte inbox with backpressure and dirty-aware frame snapshots
    mod: purrtty
    features:
