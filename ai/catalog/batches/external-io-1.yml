  - current/decomp/KSA/Program.cs TerminalInterface (=> ConsoleWindow.Terminal), TerminalOutput, RegisterCommand calls
  - current/decomp/Brutal.ImGuiApi.Abstractions/TerminalInterface.cs Execute
  - current/decomp/Brutal.ImGuiApi.Abstractions/ConsoleWindow.cs Print
  lifecycle:
  - frame:draw-ui
  - thread:background
  - startup:all-mods-loaded
