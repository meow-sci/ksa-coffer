    while every main-thread API runs on one frame tick. Covers bounded queues in both directions, configure-before-publish
    sessions, dirty-aware frame snapshots of a headless terminal surface, and plugging in custom shells (line-buffered shells
    over the game console, SSH PTY sessions into a guest) with console command output captured by a gated Harmony postfix.'
  game_types:
