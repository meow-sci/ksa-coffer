- slug: bind-and-vendor-native-c-libraries
  title: Bind and vendor native C libraries with layout-exact P/Invoke
  kind: howto
  group: processes
  batch: external-io-1
  summary: Call a C library from a KSA mod safely. Use blittable layout-exact structs verified against a C probe compiled
    from the same headers, source-generated or hand-written imports, a startup layout self-check, one thread per solver instance,
    and per-RID builds. Loading the library from the mod folder is covered in the getting-started topic. Also covers vendoring
    an upstream binding (pruned, local patches marked as divergences, pin-bump self-checks) and the Apple arm64 variadic-call
    pitfall for ioctl and friends.
  game_types: []
  engine_pointers:
  - StarMap per-mod AssemblyLoadContext (natives are not resolved automatically; see ship-native-libraries-with-a-mod)
  lifecycle:
  - startup:all-mods-loaded
  - frame:dispatch-solvers
  - thread:background
  approaches:
  - n: 1
    title: Vendored libghostty-vt binding with managed packed-cell decoding and a startup self-check
    mod: purrtty
    features:
    - mods/purrtty/features/vendored-libghostty-vt-binding
    technique: native-interop
    note: 'Source-generated LibraryImport, natives cross-compiled with zig for three RIDs, a layout self-check that fails
      loudly at startup. README with the upstream commit, markers at every local change, and a self-check that fails when
      the native export list or struct layout drifts. Sub-step: vendoring and patching the upstream binding with divergence
      markers and a pin-bump check (formerly vendor-and-patch-a-third-party-binding) gets its own section.'
  - n: 2
    title: Clarabel and SCS solvers with layout-exact structs, reused sparse CSC patterns and single-thread ownership
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/native-conic-solver-interop
    technique: native-interop
    note: Struct layouts checked against a C probe on each target platform; native handles never crossed between threads;
      sparse pattern reuse across solves.
  - n: 3
    title: Pad register arguments for variadic C calls such as ioctl on Apple arm64
    mod: purrtty
    features:
    - mods/purrtty/features/posix-pty-spawn-without-fork
    technique: native-interop
    note: 'WinSizeIoctl calls a second import of ioctl with six dummy nint arguments so the winsize pointer lands on the stack;
      explain the failure signature (garbage winsize pointer). Sub-step: stand-alone pitfall (variadic args go on the stack
      on Apple arm64) a reader may search for by name; keep as its own section or short article.'
  related:
  - ship-native-libraries-with-a-mod
  - run-an-expensive-solve-without-stalling-the-frame
  - ship-third-party-dlls-with-a-mod
  - host-and-supervise-an-external-process-from-a-mod
