- slug: host-guest-transports-tcp-9p-and-ssh
  title: Connect a VM guest to the game with slirp TCP, a 9P filesystem and pinned SSH
  kind: howto
  group: processes
  batch: external-io-1
  summary: 'The channels between a QEMU guest and the game process that work on Windows, Linux and macOS: TCP over slirp user
    networking with pre-allocated host ports and guest-side supervisors; a from-scratch 9P2000.L server exposing a virtual
    filesystem and confined host folders (including synthetic files that behave under cat, watch and tail -f); and SSH.NET
    sessions that refuse a host key whose SHA-256 does not match the guest manifest.'
  game_types: []
  engine_pointers: []
  lifecycle:
  - startup:all-mods-loaded
  - thread:background
  approaches:
  - n: 1
    title: slirp hostfwd/guestfwd TCP with a PortAllocator and guest-side supervisors
    mod: gatos
    features:
    - mods/gatos/features/slirp-tcp-host-guest-transport
    technique: process-hosting
    note: Why not virtio-9p, virtiofs or vsock (unavailable or unsupported on Windows hosts); bind port 0 for all channels
      at once to avoid a race between allocation and use, retry once on a clash; ports carried on the kernel command line.
  - n: 2
    title: From-scratch 9P2000.L server with a VfsNode tree and HostDirectory confinement
    mod: gatos
    features:
    - mods/gatos/features/ninep-server-in-csharp
    technique: protocol-server
    note: 'Session per connection, accept loop on a background task, HostDirectory/HostFile mapping nodes to real files with
      confinement to the mount root so a guest cannot escape with .., read-only mounts rejecting mutations. Sub-step: give
