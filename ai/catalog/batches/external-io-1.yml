batch: external-io-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: external-io
category_description: 'Everything that connects a KSA mod to the world outside the frame: sampling, exporting and recording
  telemetry, command queues drained on the game thread, timed scripts and AI agents, in-process HTTP/MQTT/MCP/9p/serial servers,
  hosted child processes, VMs and terminals, native libraries, HTTP clients and external SDKs.'
groups:
  control: 'Getting commands in: game-thread command queues, timed scripts, AI agents over MCP and typed external clients.'
  telemetry: 'Getting game state out safely: immutable snapshots for other threads, derived flight events and recording to
    files.'
  processes: 'Running and binding code that is not managed C#: child processes and virtual machines, host-guest transports
    and native C libraries.'
  network: 'Talking to networks and devices from inside the game: HTTP and MQTT servers, serial and bus protocols, and outgoing
    HTTP requests.'
  terminals: 'Terminals inside the game: pty sessions handed to the frame, clipboard escape codes and streaming the game screen
    into a terminal.'
topics:
- slug: marshal-commands-to-the-game-thread
  title: Marshal commands from background threads to the game thread
  kind: howto
  group: control
  batch: external-io-1
  summary: Let transport threads submit immutable commands and await a result while all KSA mutation happens at one fixed
    point in the frame. Covers two-phase queues (frame versus solver window), timeouts that abandon a pending entry, atomic
    batches drained as a unit, and a shared outcome-to-errno mapping every transport reuses.
  game_types:
  - KSA.Program
  - KSA.Universe
  - KSA.Vehicle
  - KSA.GameViewport
  engine_pointers:
  - current/decomp/KSA/Program.cs OnFrame, PrepareFrame
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers, ExecuteNextVehicleSolvers
  - current/decomp/KSA/Vehicle.cs PrepareWorker (copies manual inputs and flight computer into the worker state)
  - current/decomp/KSA/GameViewport.cs OnFrame
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  - frame:after-on-frame
  - frame:dispatch-solvers
  - thread:background
  approaches:
  - n: 1
    title: Two ConcurrentQueues (Frame and Solver phase) with TaskCompletionSource, timeout and abandon
    mod: gatos
    features:
    - mods/gatos/features/game-thread-command-queue
    technique: command-queue
    note: SimCommand carries a stable action key and the phase is derived from it. SubmitAsync awaits with a timeout (ETIMEDOUT
      when the game thread does not reach the drain, for example while loading), SubmitBatchAsync keeps up to 64 commands in one Pending so they execute in one drain, RunContinuationsAsynchronously
      keeps awaiting code off the game thread, and KsaCatalog applies authority gates, ENOENT and latches a degraded accessor
      on exceptions. Includes the CommandOutcome to errno/HTTP name mapping.
  - n: 2
    title: Solver-window drain in a Priority.First prefix on ExecuteNextVehicleSolvers
    mod: gatos
    features:
    - mods/gatos/features/solver-phase-command-drain
    - mods/gatos/features/game-thread-command-queue
    technique: harmony-prefix
    note: Writes that the vehicle step would otherwise restore (flight computer setpoints, refills, teleports) must land after
      ApplyVehicleSolvers and before PrepareVehicleWorkers. Shows why Frame-phase writes are one frame late for those fields.
  related:
  - schedule-timed-commands
  - host-http-and-mqtt-servers-in-the-game-process
  - let-ai-agents-control-the-game-over-mcp
  - change-vehicles-without-racing-the-solver
  - host-a-terminal-with-pty-sessions-and-frame-handoff
  - game-loop-and-lifecycle
- slug: schedule-timed-commands
  title: Schedule timed command sequences on render, wall or sim time
  kind: howto
  group: control
  batch: external-io-1
  summary: Play back a script of commands at millisecond offsets against a chosen clock, ticked on the game thread just before
    the command drain. Covers absolute offsets so rounding never accumulates, all-or-nothing validation, catch-up after a
    hitch that never skips a trigger, and live players that can pause, scrub or loop.
  game_types:
  - KSA.Universe
  - KSA.App
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/App.cs (dtPlayer clamp to MinTargetFrameRate)
  - current/decomp/KSA/Universe.cs GetElapsedSeconds
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  - thread:background
  approaches:
  - n: 1
    title: Scheduler posting SimCommands before the drain, with render, wall and ut clocks
    mod: gatos
    features:
    - mods/gatos/features/timed-command-scheduler
    technique: command-queue
    note: Grammar of offset, path and value lines plus @id/@clock/@rate/@loop/@group directives; wall clock parked while idle
      so time is never banked; coalescing catch-up posts every trigger but only the last non-trigger value per path; failures
      recorded per schedule.
  related:
