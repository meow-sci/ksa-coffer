  - compute-mission-elapsed-time-and-detect-liftoff
  - play-cinematic-camera-tracks
  - export-game-state-to-other-threads
- slug: let-ai-agents-control-the-game-over-mcp
  title: Let AI agents drive the game through an MCP server
  kind: howto
  group: control
  batch: external-io-1
  summary: 'Expose the game to a coding agent as MCP tools, either with an in-process Streamable HTTP endpoint on the game''s
    own server or with a small stdlib Python MCP server that wraps a file bridge and returns screenshots inline. Also covers
    shaping tools and resources for a language-model client instead of a programmer: logical grouped reads, batch and scheduled
    actions, stable action keys and error results an agent can act on.'
  game_types:
  - KSA.Program
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/Constants.cs LogsFolderPath (where the file bridge folders live)
  - ModelContextProtocol.Core C# SDK (in-process approach)
  - .mcp.json registration
  lifecycle:
  - startup:all-mods-loaded
  - thread:background
  - event:unload
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Stateless Streamable HTTP MCP endpoint inside the game process
    mod: gatos
    features:
    - mods/gatos/features/mcp-server-for-agents
    technique: protocol-server
    note: 'ModelContextProtocol.Core behind a hand-rolled HTTP adapter, a stateless transport per request, Host and Origin
      validation against DNS rebinding, tools mapped to the command queue. How reads are grouped for few round trips, how
      batch and scheduled actions map to SubmitBatchAsync and the scheduler, and how errno names become tool errors. Sub-step:
      give agent-facing API design (McpRegistry logical resources, grouped reads, batch and scheduled actions, stable action
      keys, actionable errors) its own section. Also (merged from testing-and-tooling/expose-a-running-game-to-an-ai-agent-with-mcp
      approach 2, "In-process stateless Streamable HTTP endpoint on the official C# SDK"): Borrowed from external-io. A TcpListener
      adapter with host and origin checks, 24 MiB cap and 3 minute timeout; resources and tools over simulation snapshots;
      no bearer token, so keep it on loopback.'
  - n: 2
    title: Stdlib Python stdio MCP server wrapping the file bridge, with image tools
    mod: ksacars
    features:
    - mods/ksacars/features/ksa-mcp-server
    - mods/ksagolf/features/file-command-bridge
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: file-ipc
    note: 'JSON-RPC over stdio registered in .mcp.json; finds the user directory, launches the game only if none runs and
      never closes one it did not start; returns screenshots as base64 JPEG, contact sheets, GIFs and noise maps; doubles
      as a CLI. No change to the mod beyond the bridge. Also (merged from testing-and-tooling/expose-a-running-game-to-an-ai-agent-with-mcp
      approach 1, "Stdlib Python JSON-RPC over stdio wrapping the file bridge"): server.py with initialize, tools/list and
      tools/call; doubles as a CLI; finds the user directory via a helper script; launches the game only if none runs and
      never closes one it did not launch; converts Windows paths to WSL; registered in .mcp.json as server ksa.'
  related:
  - drive-a-running-game-through-a-file-bridge
  - host-http-and-mqtt-servers-in-the-game-process
  - take-screenshots-from-code
  - marshal-commands-to-the-game-thread
  - schedule-timed-commands
  - visual-regression-for-mods
  - reload-a-mod-shader-in-a-running-game
  merged_from:
