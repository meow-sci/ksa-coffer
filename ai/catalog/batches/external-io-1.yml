- slug: host-http-and-mqtt-servers-in-the-game-process
  title: Host HTTP and MQTT servers in the game process for telemetry and control
  kind: howto
  group: network
  batch: external-io-1
  summary: Expose telemetry and accept control commands from outside the game with servers running inside it. One approach
    is a raw-socket HTTP/1.1 server with JSON snapshots, Server-Sent Events, long-poll and an OpenAPI document; the other
    an embedded MQTT broker that publishes retained, changed-only values while subscribers exist and consumes command topics.
    Both route commands through the game-thread queue and shut down cleanly at unload.
  game_types: []
  engine_pointers:
  - current/decomp/KSA/Program.cs OnFrame (the only place game objects may be touched)
  - current/decomp/KSA/Program.cs OnFrame (publish pump reads snapshots, not game objects)
  lifecycle:
  - startup:all-mods-loaded
  - thread:background
  - event:unload
  approaches:
  - n: 1
    title: Raw TcpListener server with SSE, long-poll, OpenAPI and a generic command endpoint
    mod: gatos
    features:
    - mods/gatos/features/http-v1-api-server
    technique: protocol-server
    note: 'No HttpListener or ASP.NET dependency: a hand-rolled request-line parser keeps the mod loadable in the game''s
      runtime; reads come from the snapshot store, writes enqueue SimCommands; loopback binding and the per-leaf /sim mirror.'
  - n: 2
    title: Embedded broker with subscription-gated changed-only publish and ProcessPublish=false command topic
    mod: gatos
    features:
    - mods/gatos/features/embedded-mqtt-broker
    technique: protocol-server
    note: Publish pump task off the main thread; intercepting the command topic with ProcessPublish=false so other subscribers
      never see commands; byte-change gating per leaf topic.
