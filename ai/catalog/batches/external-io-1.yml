- slug: host-and-supervise-an-external-process-from-a-mod
  title: Host and supervise an external process or virtual machine from a KSA mod
  kind: howto
  group: processes
  batch: external-io-1
  summary: Start a child process from the game without blocking the frame or leaking it, with pumps for its output, a queued
    writer, readiness probing, and bounded shutdown at unload. Three concrete shapes cover a long-lived VM, a Windows pseudoconsole
    shell and a Unix pty shell. The VM shape also covers per-OS QEMU accelerator ladders (WHPX, HVF, KVM, TCG fallback), CPU
    models, a pristine base image with per-profile qcow2 overlays and a pinned guest image fetched by the build. A further
    sub-step finds installed shells and WSL distributions on a background thread and builds correct launch command lines.
    Also covers keeping guest disk images in copy-on-write overlays over an immutable versioned base in the data folder, never
    in the install folder.
  game_types:
  - KSA.Program
  engine_pointers:
  - StarMap.Core unload path (StarMapUnload runs on a normal exit; Environment.Exit skips it)
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - thread:background
  - event:unload
  approaches:
  - n: 1
    title: QEMU microVM with async boot state machine, accelerator ladder, qcow2 overlays and a shutdown ladder
    mod: gatos
    features:
    - mods/gatos/features/qemu-microvm-host-process
    - mods/gatos/features/qcow2-overlay-guest-disks
    - mods/gatos/features/alpine-guest-image
    technique: process-hosting
    note: 'Everything off the main thread; StarMapUnload runs a bounded stop so a hung child cannot hold the game exit. Direct
      kernel boot artifacts plus a manifest contract, a PID lock on the overlay, grow-only resize, a minimal busybox init
      with respawned supervisors. Sub-step: the QemuCommandBuilder accelerator ladder, qcow2 overlay disks and pinned Alpine
      guest image (formerly run-a-virtual-machine-alongside-the-game) get their own sections. Also (merged from persistence/keep-big-user-data-in-copy-on-write-overlays
      approach 1, "qemu-img overlay per profile, version-pinned boots, grow-only resize, lock file"): EnsureBaseInstalled
      copies base-v<N>.qcow2 once, never overwriting; CreateOverlay runs in the disks folder so the backing reference stays
      a bare relative name; qemu-img commit is never used; orphaned overlays are moved aside; DiskLock reclaims stale locks.'
  - n: 2
    title: Windows ConPTY with a never-sleeping ReadFile pump, queued writer and close-first teardown
    mod: purrtty
    features:
    - mods/purrtty/features/conpty-shell-hosting
    technique: native-interop
    note: CreatePseudoConsole plus a process attribute list, STARTF_USESTDHANDLES with null handles, and a teardown that closes
      the pseudoconsole first and leaks handles still in use rather than closing them under a pump.
  - n: 3
    title: POSIX pty via posix_openpt and posix_spawnp with a poll reader and a waitpid thread
    mod: purrtty
    features:
    - mods/purrtty/features/posix-pty-spawn-without-fork
    technique: native-interop
    note: 'The game never forks (a large multithreaded process); SETSID, slave as stdin, signal reset; DllImport resolution
      through a per-assembly resolver. Sub-step: the variadic ioctl padding for Apple arm64 is covered in bind-and-vendor-native-c-libraries;
      link to it.'
  - n: 4
    title: ShellCommandResolver, WslDistributionDetector and UnixShellDetector feeding a menu cache
    mod: purrtty
    features:
    - mods/purrtty/features/shell-detection-and-command-resolution
    technique: background-thread
    note: 'Never probe on the frame; cache for the menu; quoting rules for arguments with spaces, quotes and trailing backslashes.
      Sub-step: detecting shells/WSL distributions once with bounded waits and quoting launch commands (CommandLineToArgvW
      versus discrete argv); feeds the terminal topic.'
  related:
