- slug: record-telemetry-and-diagnostics-to-files
  title: Record telemetry and diagnostics to files without stalling the frame
  kind: howto
  group: telemetry
  batch: external-io-1
  summary: Write flight telemetry to a file for later analysis, either as an on-demand export of a history buffer or as a
    continuous per-step recorder that buffers rows, flushes in batches, never throws and never waits on the disk. Includes
    the wall-clock player-time interval that feeds a fixed-length history array for a HUD graph. Also covers one-shot latched
    validation dumps (text and SVG) once the universe exists, built by pure code shared with offline tests, and log lines
    emitted only when a bucketed state changes.
  game_types:
  - KSA.Vehicle
  - KSA.Universe
  - KSA.Program
  - KSA.App
  - KSA.CelestialSystem
  - KSA.Celestial
  - Brutal.Logging.DefaultCategory
  - Brutal.Logging.LogCategory
  engine_pointers:
  - current/decomp/KSA/Constants.cs DocumentsFolderPath
  - current/decomp/KSA/Vehicle.cs PrepareWorker (per-step hook used by the recorder)
  - current/decomp/KSA/Program.cs GetPlayerTime (wall-clock Stopwatch based)
  - current/decomp/KSA/Universe.cs GetElapsedSeconds, GetLastSimStep
  - current/decomp/KSA/App.cs (dtPlayer clamped to 1 / MinTargetFrameRate)
  - current/decomp/KSA/Universe.cs CurrentSystem
  - Brutal.Logging DefaultCategory
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  lifecycle:
  - frame:draw-ui
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Wall-clock player-time interval feeding a fixed-length history array
    mod: kitten-engineer-redux
    features:
    - mods/kitten-engineer-redux/features/telemetry-history-and-csv-export
    technique: telemetry-sampling
    note: '0.25 s of Program.GetPlayerTime from the HUD draw into 720-entry shifted arrays, reset on vehicle change. Simple,
      but it keeps ticking while paused and ignores time warp; explain the trade-off. Six metrics, one row per sample, written
      to the KSA documents folder when the player clicks Export. Sub-step: the wall-clock player-time sampling interval (as
      opposed to the drift-free sim-clock accumulator in export-game-state-to-other-threads) deserves its own section.'
  - n: 2
    title: Static single-owner buffered sink with per-step CSV, plan snapshots and event log
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/guidance-flight-telemetry-csv
    technique: buffered-file-sink
    note: 'Rows buffered in memory and flushed every N, a sink that swallows I/O errors, one owner vehicle per run, rate-limited
      whole-plan snapshots, and log lines keyed on a bucketed change signature so repeated states are not re-logged. Also
      (merged from testing-and-tooling/dump-and-record-diagnostics-from-a-running-game approach 2, "Single-owner CSV sink
      with batched flush and rate-limited plan snapshots"): Folded from record-diagnostics-without-flooding-the-frame-or-the-log
      (sub-step: give it its own section (CSV and change-only logging)). Static, single-owner sink that never throws or waits
      on disk; per-step CSV, plan snapshot JSON, event log, one owner vehicle. Merged from record-diagnostics-without-flooding-the-frame-or-the-log
      (Vehicle-prefixed log lines keyed on a bucketed signature): Five percent buckets decide when a stage state is new enough
      to log, instead of logging every refresh.'
  - n: 3
    title: Latched dumps from StarMapAfterGui behind a DebugConfig flag
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/in-game-validation-dumps-and-perf
    - mods/ksa-deltavmap/features/offline-layout-and-math-tests
    technique: starmap-lifecycle
    note: 'Folded from testing-and-tooling/dump-and-record-diagnostics-from-a-running-game approach 1: Return early unless
      the flag is set, the latch is clear and Universe.CurrentSystem is non-null; run inside try/catch that logs once so the
      render path never unwinds. Output capped per tree and written to a configurable directory with log-only fallback. Merged
      from dump-layouts-and-geometry-to-svg (Pure LayoutDumpFormat shared by offline tests, harness tests and the in-game
      dump): Synthetic 100+ node tree and a real system laid out and dumped with no text measurer, so the character-count
      estimate matches between environments; OverlapCheck gives pass-fail verdicts.'
