    technique: particle-emitter
    note: EmitterPool.Get + InitializeEmitter + AddEmitter, pool of 1024, update in OnPreRender.
  - n: 3
    title: ExplosionSystem presets with a body-fixed origin
    mod: ksarmory
    features:
    - mods/ksarmory/features/ksa-explosions-from-a-point
    technique: engine-explosion-preset
