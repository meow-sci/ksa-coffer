- slug: spawn-particle-effects
  title: Spawn particle effects and explosions from a mod
  kind: howto
  group: lights-and-particles
  batch: rendering-2
  summary: Take emitters from the engine's fixed pool, either from XML-declared ParticleEmitter assets or built in C#, anchor
    them, return them correctly, and fire the game's own explosion presets where no vehicle hosts the burst.
  game_types:
  - KSA.Rendering.Particles.ParticleEmitter
  - KSA.Rendering.Particles.ParticleEmitterReference
  - KSA.ExplosionSystem
  - KSA.Rendering.Particles.EmitterSpawnPresets
  engine_pointers:
  - current/decomp/KSA.Rendering.Particles/ParticleEmitter.cs
  - current/decomp/KSA.Rendering.Particles/ParticleEmitterReference.cs
  - current/decomp/KSA.Rendering.Particles/EmitterSpawnPresets.cs
  - current/decomp/KSA/ExplosionSystem.cs SpawnPreset
  lifecycle:
  - startup:asset-load
  - frame:viewports
  - frame:pre-render
  - render:particles
  approaches:
  - n: 1
    title: XML ParticleEmitter assets taken by id from the engine pool
    mod: ksarmory
    features:
    - mods/ksarmory/features/pooled-particle-emitters
    technique: pooled-resource
