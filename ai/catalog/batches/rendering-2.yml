    mod: unscience
    features:
    - mods/unscience/features/zippo-light-animation-queue
    technique: inter-mod-api
    note: '[Folded from animate-part-lights: animation sub-step (own section): eased colour cycles, intensity fades and spotlight
      sweeps without fighting stock keyframe actuators.] Uses UI-frame delta time; re-captures live start values when the
      template changes; exposed through a static API instance.'
  - n: 5
    title: Disco channels via private Template copies and actuator claiming
    mod: unscience
    features:
    - mods/unscience/features/zippo-disco-party-lights
    technique: runtime-template-swap
    note: '[Folded from animate-part-lights: animation sub-step (own section): eased colour cycles, intensity fades and spotlight
      sweeps without fighting stock keyframe actuators.] Colour, assembly-actuation and spread channels; owner-guarded restore
      and per-instance module template override.'
