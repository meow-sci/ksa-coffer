  - draw-exhaust-plumes-without-an-engine
- slug: draw-exhaust-plumes-without-an-engine
  title: Draw volumetric exhaust plumes and smoke trails without a real engine
  kind: howto
  group: lights-and-particles
  batch: rendering-2
  summary: Reuse the game's volumetric exhaust renderer for flames from a mod-owned thrust source (a car exhaust, a prop flame,
    a pyrotechnic) by building VolumetricExhaustInstances and plume data yourself, including the plume physics so it reacts
    to altitude. Also covers editing plume and cloud templates live and laying volumetric smoke trails behind projectiles
    and flares.
  game_types:
  - KSA.VolumetricExhaustInstance
  - KSA.VolumetricExhaustRenderer
  - KSA.PlumeData
  - KSA.RocketNozzle
  - KSA.Vehicle
  - KSA.VolumetricExhaustTemplate
  - KSA.PlanetRenderer
  - KSA.PlumeTrailEmitterState
  - KSA.VolumetricTrailRenderer
  engine_pointers:
  - current/decomp/KSA/VolumetricExhaustInstance.cs
  - current/decomp/KSA/VolumetricExhaustRenderer.cs AddInstance
  - current/decomp/KSA/PlumeData.cs Compute
  - current/decomp/KSA/RocketNozzle.cs UpdatePlumeData
  - current/decomp/KSA/Vehicle.cs AddVolumetricExhaustInstances
  - current/decomp/KSA/VolumetricExhaustRenderer.cs
  - current/decomp/KSA/PlumeTrailEmitterState.cs
  - current/decomp/KSA/VolumetricTrailRenderer.cs
  lifecycle:
  - frame:pre-render
  - render:exhaust
  - frame:draw-ui
  - frame:celestials
  - render:atmosphere
  approaches:
  - n: 1
    title: Template-based instances with RocketNozzle.ComputePlumeData and mod gas numbers
    mod: ksacars
    features:
    - mods/ksacars/features/exhaust-plumes-without-engine
    technique: harmony-postfix
    note: Camera-relative float positions; must be submitted between UpdateFrameData and the render; UpdateState transients
      for ignite and shutdown.
  - n: 2
    title: Postfix AddVolumetricExhaustInstances with an isentropic nozzle model
    mod: unscience
    features:
    - mods/unscience/features/pyro-volumetric-exhaust-plumes
    - mods/unscience/features/pyro-isentropic-nozzle-model
    technique: harmony-postfix
    note: Exit Mach from area ratio, isentropic expansion, PlumeData.Compute, so the plume reacts to ambient pressure and
      throttle.
  - n: 3
    title: Template editor with propagation to instances and nozzles
    mod: unscience
    features:
    - mods/unscience/features/pyro-exhaust-template-editor
    technique: reflection
    note: '[Folded from edit-exhaust-and-cloud-templates-live: live template editing sub-step (own section): edit plume and
      cloud templates and propagate to live instances.] Absorption, emission, noise, length and quality values written and
      pushed to every instance and engine nozzle, with save sidecar.'
  - n: 4
    title: Reflect into private editor fields and replay each editor's apply sequence
    mod: gatos
    features:
    - mods/gatos/features/fx-editor-reflection
    technique: reflection
    note: '[Folded from edit-exhaust-and-cloud-templates-live: live template editing sub-step (own section): edit plume and
      cloud templates and propagate to live instances.] OnSettingsChanged + RecomputeVolumetricExhaustLimits; clouds via UpdateStaticData
      + PopulatePlanets; capture pristine value on first write for reset.'
  - n: 5
    title: One PlumeTrailEmitterState cursor per source via a reflected renderer field
    mod: ksarmory
    features:
    - mods/ksarmory/features/trail-renderer-smoke
    technique: volumetric-trail-emitter
    note: '[Folded from lay-volumetric-smoke-trails: smoke-trail sub-step (own section): submit trail emitter states each
      frame for projectiles and flares, fixed in the body frame.] Reflect once, warn once, degrade; isFlowing passed by the
      caller bypasses the nozzle gate.'
  related:
  - spawn-particle-effects
  - choose-a-render-frame-and-anchor-effects
  merged_from:
  - edit-exhaust-and-cloud-templates-live
  - lay-volumetric-smoke-trails
