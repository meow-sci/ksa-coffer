    - mods/ksagolf/features/prop-and-course-asset-xml
    - mods/ksacars/features/car-part-assets-glb-pbr
    - mods/ksarmory/features/weapon-part-definitions-xml
    technique: xml-asset
    note: Walk AssetBundle.Assets element by element; mark which are file-backed (FileReference subclasses) versus templates,
      which accept Id references with no Path, and which the mods use. Sound, Character and Gauge elements are listed with
      a pointer to the audio, kittens and ui topics. Includes the rule that new part module element names cannot be added
      without extending the serializer (see register-custom-xml-asset-type).
