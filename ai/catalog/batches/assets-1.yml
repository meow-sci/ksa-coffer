    mod: ksarmory
    features:
    - mods/ksarmory/features/blender-model-pipeline-and-checks
    - mods/ksastructures/features/asset-and-mesh-validation-tools
    technique: offline-asset-validation
    note: 'XML not listed in mod.toml, ids declared twice including atlas mesh names, launch geometry disagreeing with muzzles.json,
      planes shared between two subparts as the XML places them, unsized stacking connectors, ids that appear as string constants
