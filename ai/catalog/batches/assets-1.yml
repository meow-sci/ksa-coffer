  kind: howto
  group: validation
  batch: assets-1
  summary: 'Two defects look identical in game (flickering white speckle) and never show in a Blender preview: coplanar faces
    from different directions, and triangles with zero UV area whose zero tangent turns into NaN shading. Pure Python readers
    of the GLB binary find both, plus unpaired node and mesh names and primitives without a material, with no Blender and
    no game, and run in CI and deploy scripts. Also covers reading mesh names and bounds from the GLB JSON chunk in Python
    and C#.'
  game_types:
  - KSA.MeshAtlasFileReference
  - KSA.MeshReference
  - Brutal.GltfApi.GltfUtility
  - Brutal.GltfApi.GltfLoader
