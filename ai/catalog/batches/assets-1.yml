- slug: xpath-xml-patch-recipes
  title: Write XPath patch operations for game XML
  kind: howto
  group: xml-patching
  batch: assets-1
  summary: 'The patch language is a ModuleManager-style set of operations (Copy with Pos Replace, Append, Prepend, Before
    or After; Merge with _MergeId and _MergePos; Delete; If, IfAny, IfNone; With; SetVar) over XPath 1.0 paths evaluated from
    Root. Worked recipes: append a button to a stock gauge canvas, add missing elements to every comet, and rewrite values
    for every body with a conditional.'
  game_types:
  - KSA.AssetBundle
  - KSA.GaugeCanvas
  - KSA.SystemTemplate
  - KSA.PlanetMeshCollection
  engine_pointers:
  - current/Content/Core/Gauges.xml (GaugeCanvas EngineControl, Buttons component)
  - current/Content/Core/Astronomicals.xml (body templates)
  - current/decomp/KSA/GaugeCanvas.cs
  lifecycle:
  - startup:asset-load
  approaches:
  - n: 1
    title: Copy Pos="Append" with inline XML into a stock gauge canvas
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/autostage-gauge-button
    - mods/kittenextensions/features/xpath-patch-operations
    technique: xml-patch
    note: AutoStageButton.xml targets //GaugeCanvas[@Id='EngineControl']/Component[@Name='Buttons']; chosen over BurnControl
      because that canvas only draws while a burn is planned; flight-computer enum registration is the UI side (add-or-change-a-stock-gauge-button).
  - n: 2
    title: Add missing mass and sphere-of-influence elements to a kind of body
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets
    - mods/kittenextensions/features/xpath-patch-operations
    technique: xml-patch
    note: HyperbolicBodies.xml appends Mass and SphereOfInfluence to each InterstellarComet, selected by //InterstellarComet[@Id='...'],
      so the planner can treat the comets as targets; shows selecting a body by element name and Id and appending inline XML.
  - n: 3
    title: With, If and SetVar for per-node rewrites, and Merge with _MergeId
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/xpath-patch-operations
    technique: xml-patch
    note: The README colour example (brighten or darken orbit colours by a sum test) and the Merge rules table with the _MergeId,
      _MergePos worked example; operation semantics come from the README because the XPathPatch submodule is not checked out.
  related:
