  title: Patch Core or another mod's XML data without copying files
  kind: howto
  group: xml-patching
  batch: assets-1
  summary: List patch files under a patches key in mod.toml and KittenExtensions applies them to one in-memory document of
    every manifest mod's XML before the game deserializes anything, so a mod can change stock parts, gauges, systems or another
    mod's assets with no copies of those files. Covers the Root/Mod document shape, RelPath, run order and how a mod depends
    on KittenExtensions optionally.
  game_types:
