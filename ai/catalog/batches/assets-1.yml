- slug: redirect-game-xml-loading
  title: Redirect the game to patched copies of its XML and coordinate edits between mods
  kind: howto
  group: xml-patching
  batch: assets-1
  summary: 'Two ways to substitute the XML the game reads without editing the install: rewrite the file name entries inside
    the Core Mod object to absolute paths of patched copies (rooted paths escape the mod folder), or transpile the Mod loader
    methods so each XmlLoader.Load<T> call reads from an in-memory document instead. Includes the lesson that patching the
    shared generic XmlLoader.Load<T> hijacks every reference-type instantiation. Also covers verified text-anchor edits of
    shadow copies, generator splicing between markers, and sharing one shadow tree between two mods. Also covers changing
    Sol''s stock system and body XML (the Core body library and inline system templates) without editing Core.'
  game_types:
  - KSA.Mod
  - KSA.ModLibrary
  - KSA.XmlLoader
  - KSA.SystemInfo
  - KSA.AssetBundle
  - KSA.SystemTemplate
  - KSA.AtmosphericBodyTemplate
  - KSA.SerializedCollection
  - KSA.AstronomicalTemplate
  - KSA.PlanetaryBodyTemplate
  engine_pointers:
  - current/decomp/KSA/Mod.cs Assets (private string[]), SystemTemplates, LoadAssetBundles, LoadSystems, PrepareSystems, LoadEditorTagDefinitions
  - current/decomp/KSA/XmlLoader.cs Load<T>
  - current/decomp/KSA/Mod.cs GetPath
  - current/Content/Core/Astronomicals.xml and current/Content/Core/SolSystem*.xml (the files copied and edited)
  - current/Content/Core/Astronomicals.xml and SolSystem*.xml (the shared edit targets)
  - current/decomp/KSA/XmlLoader.cs Load<T> (cached XmlSerializer without overrides)
  - current/decomp/KSA/Mod.cs LoadAssetBundles, LoadPlanetMeshes, LoadSystems, PrepareSystems, LoadEditorTagDefinitions, LoadPlanetRandomHeightmaps
  - current/decomp/KSA/SerializedCollection.cs Register (first duplicate id wins)
  - current/decomp/KSA/Mod.cs Assets, SystemTemplates, LoadAssetBundles, LoadSystems, PrepareSystems
  - current/Content/Core/ (Astronomicals.xml, SolSystem.xml, SolSystemDense.xml, SolSystemInterstellar.xml)
  lifecycle:
  - startup:starmap-before-main
  - startup:immediate-load
  - startup:asset-load
  approaches:
  - n: 1
    title: Prefix the non-generic Mod loaders and swap list entries for shadow-copy paths
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/core-xml-entry-redirect
    - mods/realatmospheres/features/atmosphere-optics-in-system-xml
    technique: harmony-prefix
    note: 'Prefixes on Mod.PrepareSystems, LoadSystems, LoadAssetBundles and LoadEditorTagDefinitions replace entries in Core''s
      own arrays, idempotent comparison against the shadow path; both system methods because XmlName is stored then compared;
      deliberately not XmlLoader.Load<T>. Also (merged from patching/redirect-game-xml-loading approach 2, "Prefix the loader
      methods to point the Core mod at shadow files"): Prefixes on Mod.PrepareSystems, LoadSystems, LoadAssetBundles, LoadEditorTagDefinitions
      rewrite the Core mod''s private Assets and public SystemTemplates arrays to absolute paths (Path.Combine passes rooted
      paths through). No IL, no generic matching, but only helps when the mod owns the whole file. Also (merged from celestials/change-stock-system-and-body-xml-without-editing-core
      approach 1, "Write patched copies and swap the file names in Core mod lists for absolute paths"): Prefixes on Mod.LoadAssetBundles
      / LoadSystems / PrepareSystems replace the Astronomicals.xml and system template entries; Path.Combine returns a rooted
      second argument unchanged so no further patch is needed; idempotent, and PrepareSystems stores XmlName so both system
      methods are patched. Edits are anchor-verified text edits of the XML.'
  - n: 2
    title: Transpile four Mod loaders to read from the patched document
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/xmlloader-call-site-redirect
    technique: harmony-transpiler
    note: 'HarmonyTargetMethods transpiler replaces each constructed XmlLoader.Load<T> operand with XmlPatcher.Load<T> via
      MakeGenericMethod; LoadEditorTagDefinitions and LoadPlanetRandomHeightmaps stay stock; duplicate asset ids resolve first-wins.
      Also (merged from patching/redirect-game-xml-loading approach 1, "Transpile every XmlLoader.Load<T> call to XmlPatcher.Load<T>"):
      HarmonyTargetMethods picks four callers by name; match constructed generic methods via GetGenericMethodDefinition, read
      T from GetGenericArguments, swap operand for MakeGenericMethod(T). The replacement reads the file''s node from the patched
      document and still calls OnDataLoad. Why the helper itself is not patched, and why two callers are left stock.'
  - n: 3
    title: Anchor-verified, marker-guarded edits of shadow copies, and generated XML spliced between markers
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/shadow-tree-anchor-patching
    - mods/realatmospheres/features/atmosphere-optics-in-system-xml
    - mods/ksastructures/features/generated-deep-ramp
    technique: xml-patch
    note: '(stock, corrected, marker) triples and (file, stock, patch, count) sites, exact-count checks, invariant-culture
      number formatting, asset-gated insertions, renaming an element and appending a block to promote a body type. Shaders
      owns the GLSL variant (patch-game-glsl-with-anchored-text-edits). Also: The layout script rewrites only the region between
      marker comments in the hand-written asset XML, so generated colliders and the rest of the file coexist and a rerun is
      a no-op when nothing changed. Sub-step for the writer: verified text anchors and idempotent markers (absorbed from patch-xml-text-with-anchors-and-markers)
      get their own section.'
  - n: 4
    title: Shared shadow folder, Global named mutex and a process-start launch token
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/cross-mod-shared-shadow
    technique: named-mutex
    note: 'SharedShadow.CoreDir under the mods folder, abandoned-mutex handling, .launch_token from the process start time,
      edit callbacks per mod, fail-soft dependent edits, and the conditional Compile Include that links one source into both
      csproj files (share-source-between-mod-projects folded in). Sub-step for the writer: this approach covers the whole
      coordination topic (absorbed from coordinate-file-edits-between-mods). Also (merged from celestials/change-stock-system-and-body-xml-without-editing-core
      approach 2, "One shared patched copy built by two cooperating mods"): A named mutex, a once-per-launch reset token (process
      start time), a callback of marker-guarded idempotent edits and source shared between projects, so the second mod patches
      on top of the first mod rather than clobbering it.'
  related:
  - patch-game-xml-data
  - replace-or-patch-game-glsl-without-editing-game-files
  - mod-xml-load-order
  - share-types-between-mods
  - declare-a-mod-dependency
  - write-a-harmony-transpiler
  - swap-one-call-inside-a-game-method-with-a-transpiler
  - call-private-game-members-through-reflection-and-delegates
  - how-starmap-launches-ksa
  - define-atmospheres-and-cloud-layers-in-system-xml
  merged_from:
  - patch-xml-text-with-anchors-and-markers
  - coordinate-file-edits-between-mods
  - patching/redirect-game-xml-loading
  - change-stock-system-and-body-xml-without-editing-core
- slug: asset-xml-element-reference
  title: Know which asset XML elements the game accepts and what they load
  kind: reference
  group: asset-xml
  batch: assets-1
  summary: A mod's Assets files are deserialized into KSA.AssetBundle, whose Assets list maps about sixty element names (GltfFile,
    MeshAtlas, PbrMaterial, Texture, Part, SubPart, PartGameData, StaticObject, ClutterObject, Sound, Character, GaugeCanvas,
    EditorTagDef and more) to template types. This reference lists the table, shows which elements the reference mods actually
    use, explains how part module elements are registered by reflection, and lists the attributes that matter (Id, Path, Category,
    HostOnly).
  game_types:
  - KSA.AssetBundle
  - KSA.SerializedId
  - KSA.XmlHelper
  - KSA.FileReference
  - KSA.MeshAtlasFileReference
  - KSA.Gltf2Reference
  - KSA.PbrMaterialReference
  - KSA.PartTemplate
  engine_pointers:
  - current/decomp/KSA/AssetBundle.cs (the XmlElement table on Assets, OnDataLoad registration rules)
  - current/decomp/KSA/XmlHelper.cs (static constructor registers every TemplateDataBase subclass under PartTemplate.Components)
  - current/decomp/KSA/SerializedId.cs (Id, IsReferenceable, SetHash)
  - current/Content/Core/CoreFuelTankAAssets.xml, current/Content/Core/CorePropulsionAAssets.xml (stock examples of each element)
  lifecycle:
  - startup:asset-load
  approaches:
  - n: 1
    title: The AssetBundle element table, read against three real asset files
    mod: ksagolf
