- slug: mod-xml-load-order
  title: Understand when and in which order KSA loads mod XML
  kind: reference
  group: asset-xml
  batch: assets-1
  summary: 'The mod.toml keys (assets, systems, planetMeshes, planetRandomHeightmapCollections, fonts, starBinaries) feed
    separate loaders that run in a fixed order inside the Program constructor: PrepareAll, PreloadAssetBundles, LoadEditorTags,
    LoadAll and then AttachGameData. Knowing the order tells you where a patch, a redirect, a StarMap hook or a runtime registration
    can see the data it needs.'
  game_types:
  - KSA.ModLibrary
  - KSA.Mod
  - KSA.ModManifest
  - KSA.ModEntry
  - KSA.XmlLoader
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/ModLibrary.cs PrepareManifest, PrepareAll, PreloadAssetBundles, LoadEditorTags, LoadAll, AttachGameData
  - current/decomp/KSA/Mod.cs LoadAssetBundles, LoadEditorTagDefinitions, LoadSystems, PrepareSystems, LoadPlanetMeshes (each
    does Path.Combine(DirectoryPath, entry) then XmlLoader.Load<T>)
  - current/decomp/KSA/Program.cs constructor startup sequence
  - current/Content/Core/mod.toml
  lifecycle:
  - startup:asset-load
  - startup:immediate-load
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: Per-phase table from the KittenExtensions document and the Core redirect
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/gamedata-document
    - mods/realatmospheres/features/core-xml-entry-redirect
    - mods/ksacars/features/mod-folder-content-and-code-mod
    technique: xml-asset
    note: Which mod.toml key each loader reads (and which keys the game ignores, such as KittenExtensions' patches), Preload
      versus full load of AssetBundle.OnDataLoad, where StarMapImmediateLoad and StarMapAllModsLoaded sit relative to PrepareSystems
      and LoadAll, why the parallel ILoader pass loads files after the XML is read, and that a malformed XML is reported only
      as missing content.
