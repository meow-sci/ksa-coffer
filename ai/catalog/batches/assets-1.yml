    - mods/ksacars/features/art-and-audio-pipeline-tooling
    - mods/ksarmory/features/blender-model-pipeline-and-checks
    technique: offline-asset-validation
    note: 'Triangles reduced to quantised sign-canonical planes, overlap area measured in 2D, near-parallel faces within 0.3
      to 4 mm, --near-max 0 in the release job, missing TEXCOORD_0, unmaterialed primitives. Also: List every mesh of Core''s
      or your own atlas with a bounding box, filtered by name, so parts are laid out against facts; used by build.sh after
      the headless export. Sub-step for the writer: reading mesh names and POSITION min and max from the GLB JSON chunk (absorbed
      from read-glb-mesh-names-and-bounds) gets its own section.'
  - n: 2
    title: Fingerprint --compare and swept-pose collision checks for moving assemblies
    mod: ksarmory
    features:
    - mods/ksarmory/features/blender-model-pipeline-and-checks
    technique: offline-asset-validation
    note: Order-independent surface fingerprint because the exporter permutes the index buffer on every rebuild (answers "did
      my edit change anything"), box skin plus seeded jitter at generation time so abutting faces interpenetrate, and checkswept.py
      testing convex primitives with SAT through every pose of an articulated mount.
