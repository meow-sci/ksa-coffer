      approach 1, "validate-parts.py with check-xml.sh" [ksastructures]): Duplicate ids and collisions, mesh names inside
      GLB atlases, exact-case paths, shared textures, mod.toml assets and ids referenced in C#. Merged from check-glb-meshes-for-z-fighting-offline
