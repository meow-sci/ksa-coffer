    - mods/ksagolf/features/glb-authoring-and-mesh-checks
    technique: offline-asset-validation
    note: 'Well-formedness, SubPart InstanceOf and Material ids resolving locally or in Core, Mesh ids existing in the declared
      atlas, case-exact paths, duplicate top-level ids, run in deploy.sh and a pre-push check-all. Also (merged from testing-and-tooling/check-and-generate-mod-assets-offline
      approach 2, "Id and path validation against Core in an art pipeline"): Borrowed from assets. Also GLB bounds from accessor
      min/max and atlas dilation. Merged from check-glb-meshes-for-z-fighting-offline (Mesh checkers bundled with a GLB authoring
      contract): Borrowed from assets. Zero UV-area faces, coplanar z-fighting, unmaterialed primitives and bad asset references.'
