- slug: resolve-asset-ids-and-mod-relative-paths
  title: Resolve asset ids and file paths correctly across mods
  kind: howto
  group: asset-xml
  batch: assets-1
  summary: Asset ids are global registry keys, a second registration of the same id is silently ignored (mesh ids come from
    glTF mesh names), every Path attribute is joined to the mod folder by Mod.GetPath rather than to the XML file, and a rooted
    path escapes the mod folder. Covers case-exact paths, id prefixes to avoid collisions, referencing Core's meshes and materials
    by id, and pointing XML at another mod's textures.
  game_types:
  - KSA.Mod
  - KSA.FileReference
  - KSA.SerializedId
  - KSA.ModLibrary
  - KSA.MeshAtlasFileReference
  - KSA.MeshReference
  engine_pointers:
  - current/decomp/KSA/Mod.cs GetPath, DirectoryPath
  - current/decomp/KSA/FileReference.cs ModPath, OnDataLoad (Id defaults to the path when none is given; empty Path makes
    a reference)
  - current/decomp/KSA/MeshAtlasFileReference.cs DoLoad (Id = glTF mesh name, ModLibrary.Register refusal reuses the existing
    mesh)
  - current/decomp/KSA/ModLibrary.cs Register overloads, Get<T>, TryGet<T>
  lifecycle:
  - startup:asset-load
  approaches:
  - n: 1
    title: Mod-folder-relative paths and prefixed global ids
    mod: ksacars
    features:
    - mods/ksacars/features/car-part-assets-glb-pbr
    - mods/ksagolf/features/prop-and-course-asset-xml
    technique: xml-asset
    note: XML at the mod root, Meshes/Textures/Sounds beside it, ids prefixed with the mod name, first registration wins,
      case-exact paths for Linux and Windows. KSAGolf shows ids that code looks up by string instead of parts that reference
      them.
  - n: 2
    title: Absolute and cross-mod paths for assets shipped by another mod
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/cloud-layers-in-system-xml
    - mods/realatmospheres/features/core-xml-entry-redirect
    technique: xml-asset
    note: Path.Combine returns a rooted second argument unchanged, so an absolute path reaches files outside the mod folder
      (another mod, a shadow tree); assets are gated on File.Exists before the XML that uses them is inserted. Also why this
      makes the redirect trick work.
  related:
  - asset-xml-element-reference
  - redirect-game-xml-loading
  - declare-gltf-and-pbr-material-assets
  - ship-content-and-code-in-one-mod
