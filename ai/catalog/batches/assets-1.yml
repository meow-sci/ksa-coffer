- slug: debug-xml-patches
  title: Debug XML patches with the step debugger and the session log
  kind: howto
  group: validation
  batch: assets-1
  summary: A wrong XPath or an operation that matches nothing fails quietly. A debug key on the KittenExtensions manifest
    entry opens a pre-game ImGui stepper (Run All, Step, Step Over, Step Out, XPath tester, live document tree) and every
    run writes a per-mutation log with old and new values.
  game_types:
  - KSA.ModLibrary
  - KSA.ModEntry
  - KSA.Constants
  - KSA.Popup
  - KSA.Program
  - KSA.ModManifest
  engine_pointers:
  - current/decomp/KSA/ModLibrary.cs PrepareAll
  - current/decomp/KSA/ModEntry.cs
  - current/decomp/KSA/ModManifest.cs Save
  - current/decomp/KSA/Constants.cs LogsFolderPath
  lifecycle:
  - startup:asset-load
  - startup:starmap-before-main
  approaches:
  - n: 1
    title: debug = true on the manifest entry opens the stepper
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/patch-debug-stepper
    technique: xml-patch
    note: 'Saves the unpatched document to root.xml, blocks startup in a popup before the game loop exists, shows target and
      source XPath results for each action; how to read a failing patch. Also (merged from testing-and-tooling/debug-xml-patches
      approach 1, "Step debugger enabled by a debug key in manifest.toml"): Blocks startup in an ImGui popup with Run All,
      Step, Step Over and Step Out, an action tree with target and source XPath results, an XPath tester and a live document
      tree; root.xml holds the unpatched document.'
  - n: 2
    title: Audit the changes from KittenExtensions.log
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/patch-session-log
    technique: xml-patch
    note: 'One line per Set, Insert, InsertText or Remove with old and new value plus per-file summaries; deleted at StarMapBeforeMain
      and rewritten each launch. Also (merged from testing-and-tooling/debug-xml-patches approach 2, "Per-session patch log
      subscribed to executor events"): KittenExtensions.log deleted at StarMapBeforeMain, one line per Set, Insert, InsertText
      or Remove with old and new values, searchable by target file and object; per-file summaries echoed to the game log.'
  related:
  - patch-game-xml-data
  - xpath-xml-patch-recipes
  - mod-xml-load-order
  - drive-a-running-game-through-a-file-bridge
  - redirect-game-xml-loading
  - write-a-per-mod-log-file
  - validate-asset-xml-references
  merged_from:
  - testing-and-tooling/debug-xml-patches
