  approaches:
  - n: 1
    title: Register the enum at immediate load, append the Button by XML patch
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/autostage-gauge-button
    technique: xml-patch
    note: StarMapImmediateLoad runs before Gauges.xml is read, so the enum must be registered first; Vehicle.ToggleEnum/IsSet/IsFlightComputerDisabled
      prefixes give the state.
  - n: 2
    title: Rewrite disabled bits and tooltip in postfixes
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/rcs-burn-editor-and-gauge-ui
    technique: harmony-postfix
    note: Postfix GaugeButtonFlightComputer.IsDisabled and Pack to enable a stock button for engineless vehicles.
  - n: 3
    title: IsContextVisible and AreAllEnginesInactive postfixes plus a throttle write by reflection
    mod: ksacars
    features:
    - mods/ksacars/features/engine-hud-for-engineless-craft
    technique: harmony-postfix
    note: 'Write the value between PrepareWorker''s clamp and UpdateGauges; display only, not control. Sub-step to give its
      own section: forcing a gauge canvas visible for an engineless craft and suppressing the "No active engines" alert.'
  - n: 4
    title: Toggle GaugeCanvas.SetEnabled and remember what was changed
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/hide-and-restore-stock-flight-hud
    technique: reflection
    note: 'Pause while the LAYOUTS window is open because layout saves capture the enabled flag; restore on unload. Uses ImGui.Internal.FindWindowByName
      and WasActive to detect a game window. Sub-step to give its own section: detect whether a game ImGui window (LAYOUTS)
      is open by its derived id before toggling canvases.'
  - n: 5
    title: CCE to CCI to control to Body2Screen on the foreground draw list
    mod: ohmystars
    features:
    - mods/ohmystars/features/navball-star-marker
    technique: imgui-drawlist
    note: 'GaugeCanvas windows render via draw callbacks, so draw on the foreground list; copy style constants from NavballMarkers.glsl;
      CPU coverage checks and a repainted centre indicator. Sub-step to give its own section: GaugeCanvas renders via ImGui
      draw callbacks, so a navball marker must draw on the foreground list.'
