  - current/decomp/KSA/GameViewport.cs SetMenuBarInUse
  lifecycle:
  - frame:draw-ui
  approaches:
  - n: 1
    title: Harmony postfix on the empty Program.DrawProgramMenusHook
    mod: unscience
    features:
