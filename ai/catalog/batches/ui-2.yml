  - KSA.Program
  - KSA.NavBallRenderer
  - KSA.CanvasRect
  - KSA.ImGuiHelper
  engine_pointers:
  - current/decomp/KSA/GaugeButtonFlightComputer.cs EnumTypes, IsDisabled, Pack
  - current/Content (Gauges.xml EngineControl canvas)
  - current/decomp/KSA/GaugeCanvas.cs IsContextVisible
  - current/decomp/KSA/Vehicle.cs AreAllEnginesInactive, _manualControlInputs, PrepareWorker
  - current/decomp/KSA/GaugeCanvas.cs AllCanvases, SetEnabled
  - current/decomp/KSA/ImGuiWindow.cs (id form title###TypeFullName_)
  - current/decomp/KSA/NavBallRenderer.cs ToScreenMarker
