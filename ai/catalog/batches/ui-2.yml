- slug: work-with-stock-cockpit-gauges
  title: Add to, drive and hide the stock cockpit gauges and navball
  kind: howto
  group: menus
  batch: ui-2
  summary: Add a mod-defined button to the EngineControl gauge canvas via an XML patch and mod enum, drive its state from
    Harmony patches, force stock gauges visible for a craft with no engines, hide and restore the stock flight HUD, and draw
    a custom marker on the navball.
  game_types:
  - KSA.GaugeButtonFlightComputer
  - KSA.EnumTypeOption
  - KSA.GaugeCanvas
  - KSA.Vehicle
  - KSA.ModLibrary
  - KSA.GaugeVisibilityFlag
  - KSA.ManualControlInputs
  - KSA.FixedAlert
  - KSA.LayoutSaves
  - KSA.SerializedLayout
