  - category: assets
    slug: validate-asset-xml-references
    title: Validate asset XML ids and paths before launching the game (offline)
    kind: howto
    group: validation
    batch: assets-1
    summary: "A bad mesh id, a mistyped texture path or a malformed XML file is a silent failure in KSA: the part renders
      untextured, invisible or not at all, with nothing in the log. An offline script cross-checks every id against the
      mod's own files and Core's library, checks paths with exact case and that the XML is listed in mod.toml, and runs
      from the deploy script and CI. Also covers deserializing an AssetBundle with the game serializer, without
      registering it, for rule-based checks."
    game_types:
      - KSA.AssetBundle
      - KSA.MeshAtlasFileReference
      - KSA.ModLibrary
      - KSA.XmlHelper
      - KSA.XmlLoader
      - KSA.SerializedId
      - KSA.PartTemplate
      - KSA.PhysicalAtmosphereReference
      - KSA.AtmosphereRenderer
      - KSA.Mod
    engine_pointers:
      - current/decomp/KSA/Mod.cs LoadAssetBundles (only mod.toml-listed XML is read)
      - current/decomp/KSA/MeshAtlasFileReference.cs DoLoad
      - current/decomp/KSA/XmlHelper.cs Serializers, AttributeOverrides
      - current/decomp/KSA/XmlLoader.cs Load<T>, Deserialize<T> (OnDataLoad only runs in Load)
      - current/decomp/KSA/AssetBundle.cs OnDataLoad (registers templates)
      - current/decomp/KSA/ModLibrary.cs
      - current/Content/Core (shared atlases and ids)
      - current/decomp/KSA/PhysicalAtmosphereReference.cs
      - current/Content/Core/Shaders (atmosphere shaders)
      - current/decomp/KSA/AtmosphereRenderer.cs
    lifecycle:
      - frame:draw-ui
      - startup:asset-load
      - tool:build
    approaches:
      - n: 1
        title: check-xml.sh and validate-parts.py with an --offline mode
        mod: ksacars
        features:
          - mods/ksacars/features/art-and-audio-pipeline-tooling
          - mods/ksagolf/features/glb-authoring-and-mesh-checks
        technique: offline-asset-validation
        note: 'Well-formedness, SubPart InstanceOf and Material ids resolving locally or in Core, Mesh ids existing in the
          declared atlas, case-exact paths, duplicate top-level ids, run in deploy.sh and a pre-push check-all. Also
          (merged from testing-and-tooling/check-and-generate-mod-assets-offline approach 2, "Id and path validation
          against Core in an art pipeline"): Borrowed from assets. Also GLB bounds from accessor min/max and atlas
          dilation. Merged from check-glb-meshes-for-z-fighting-offline (Mesh checkers bundled with a GLB authoring
          contract): Borrowed from assets. Zero UV-area faces, coplanar z-fighting, unmaterialed primitives and bad
          asset references.'
      - n: 2
        title: Extended checks for generated geometry, ids named in C# and shared planes
        mod: ksarmory
        features:
          - mods/ksarmory/features/blender-model-pipeline-and-checks
          - mods/ksastructures/features/asset-and-mesh-validation-tools
        technique: offline-asset-validation
        note: 'XML not listed in mod.toml, ids declared twice including atlas mesh names, launch geometry disagreeing with
          muzzles.json, planes shared between two subparts as the XML places them, unsized stacking connectors, ids that
          appear as string constants in the C#, and compiling GLSL with glslang (shaders owns the shader side). Also
          (merged from testing-and-tooling/check-and-generate-mod-assets-offline approach 1, "validate-parts.py with
          check-xml.sh" [ksastructures]): Duplicate ids and collisions, mesh names inside GLB atlases, exact-case paths,
          shared textures, mod.toml assets and ids referenced in C#. Merged from check-glb-meshes-for-z-fighting-offline
          (checkmesh.py and meshinfo.py): Coplanar bucket test and degenerate UV detection.'
      - n: 3
        title: XmlHelper.Serializers lookup, parse only, then pure rules over the object tree
        mod: unscience
        features:
          - mods/unscience/features/parts-now-bundle-validation
        technique: xml-serializer
        note: "BundleParser fetches the AssetBundle serializer from XmlHelper.Serializers, also parses an XDocument with line
          info, never calls OnDataLoad, and hands the object tree to isolated validation rules; includes the warning
          that a fresh XmlSerializer(typeof(AssetBundle)) lacks the overrides and silently drops every part component.
          Sub-step for the writer: deserializing with XmlHelper.Serializers without OnDataLoad (absorbed from
          deserialize-asset-bundle-with-game-serializer) gets its own section."
      - n: 4
        title: Supply catalog assets and regression-test browser exports
        mod: flexo
        features:
          - mods/flexo/features/asset-pipeline-and-regression-tooling
        technique: asset-pipeline, test-fixtures, browser-smoke-tests
        note: External browser authoring workflow; distinguish preview and export validation from native asset loading and live
          in-game verification. Cover every listed reusable mechanism with actionable source-backed steps.
    related:
