  - category: celestials
    slug: exclude-or-replace-ground-clutter
    title: Keep grass, rocks and trees off a custom site, and replace or preserve a planet's ground clutter
    kind: howto
    group: terrain
    batch: celestials-1
    summary: KSA clears ground clutter only around the first four launch pads in a body's Locations list, so a mod-added pad
      needs its exclusion zones refilled by a postfix (the zones are baked at load). Separately, chosen clutter types on
      one body can be swapped for imported models with their own materials, scale and colliders by building private
      native clutter bundles at the solver-dispatch window, with originals kept for exact undo; and since KSA 5447,
      knocked-out or displaced instances must be remembered per grid spacing and replayed across swaps and saves.
    game_types:
      - KSA.GroundClutterPlacementData
      - KSA.ClutterCubeCellGrid
      - KSA.ClutterEcotypeRenderData
      - KSA.ClutterEcotypePhysicalData
      - KSA.GroundClutterRenderer
      - KSA.PlanetRenderer
      - KSA.LandmarkReference
      - KSA.StaticObject
      - KSA.Celestial
      - KSA.Camera
      - KSA.Universe
      - KSA.GroundClutterReference
      - KSA.ClutterEcotypeReference
      - KSA.ClutterObjectTemplate
      - KSA.GroundClutterLodReference
      - KSA.PhysicsBubble
      - KSA.BubbleClutterStatics
      - KSA.CelestialTemplate
      - KSA.GameSave
      - KSA.AssetBundle
      - KSA.SerializedReference
      - KSA.SystemTemplate
    engine_pointers:
      - current/decomp/KSA/GroundClutterPlacementData.cs PopulateLaunchPadExclusionZones, BuildEcotypeData
      - current/decomp/KSA/ClutterEcotypeRenderData.cs BuildRenderResources
      - current/decomp/KSA/PlanetRenderer.cs RebuildGroundClutterResources
      - current/decomp/KSA/Universe.cs ExecuteNextClothSolvers, SyncGroundClutter
      - current/decomp/KSA/GroundClutterRenderer.cs RebuildFrameResources, Dispose
      - current/decomp/KSA/GroundClutterPlacementData.cs
      - current/decomp/KSA/GroundClutterLodReference.cs BuildMaterialIndirection (private)
      - current/decomp/KSA/GroundClutterPlacementData.cs SerializeSave, DeserializeDisplacedObject, ExcludeCell,
        GetExclusionData
      - current/decomp/KSA/GroundClutterRenderer.cs ExclusionData, QueueExclusionUpload
      - current/decomp/KSA/Universe.cs SyncGroundClutter
    lifecycle:
      - startup:all-mods-loaded
      - startup:game-loaded
      - frame:dispatch-solvers
      - frame:draw-ui
      - event:renderer-rebuild
      - event:load
      - event:save
      - tool:build
    approaches:
      - n: 1
        title: Harmony postfix on the private PopulateLaunchPadExclusionZones with ____celestial injection
        mod: ksastructures
        features:
          - mods/ksastructures/features/ground-clutter-exclusion-zones
        technique: harmony-postfix
        note: AccessTools.Method by name for the private target; four nearest pads with positive FootprintRadius to the main
          camera (the lift landmark has footprint 0 so is never a candidate); engine's formula float4(ForwardCcf,
          (Footprint + 50 m) / MeanRadius); zones are evaluated once at renderer build.
      - n: 2
        title: Prefix on ExecuteNextClothSolvers builds private bundles; originals captured for exact restore
        mod: unscience
        features:
          - mods/unscience/features/pebbles-ground-clutter-replacement
          - mods/unscience/features/pebbles-private-clutter-materials
        technique: harmony-prefix
        note: "Wait for the cloth and vehicle workers, swap placement data and bubble statics in one window; postfix
          RebuildFrameResources and prefix Dispose so a renderer recreation rebuilds or releases the override;
          HiddenUiFrameHook replays updates while the HUD is hidden. Collider authoring and GLB import are the physics
          and assets topics. Distinct problem within the topic: replacing clutter meshes, materials and colliders."
      - n: 3
        title: Per-grid memory with AND-merge, public-API snapshot and replay, native plus sidecar saves
        mod: unscience
        features:
          - mods/unscience/features/pebbles-clutter-state-persistence
