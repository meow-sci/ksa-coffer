  - category: celestials
    slug: place-static-objects-on-a-planet-surface
    title: Place a static object on a planet surface at a latitude and longitude, and keep it anchored
    kind: howto
    group: terrain
    batch: celestials-1
    summary: Static objects declared in XML are stood on a planet by LandmarkReferences in the body template's Locations
      list; adding an IsLaunchPad landmark in code before the engine resolves static objects gets a multi-part building
      with render models and Bepu colliders kittens can walk on. The engine culls it from inside a dug pit (terrain
      sampled with accurate false), so a postfix can redraw it per viewport; and anything stood on the ground must be
      anchored in the body-fixed frame so it follows rotation, survives floating-origin shifts and restores from a save.
    game_types:
      - KSA.LandmarkReference
      - KSA.LocationReference
      - KSA.CelestialTemplate
      - KSA.StaticObject
      - KSA.StaticObjectTemplate
      - KSA.StaticSubObjectTemplate
      - KSA.ConstraintSim
      - KSA.ModLibrary
      - KSA.Celestial
      - KSA.Camera
      - KSA.Program
      - KSA.Cursor
      - KSA.Vehicle
      - KSA.IViewport
      - KSA.JobSystems
      - KSA.Universe
      - KSA.SystemTemplate
    engine_pointers:
      - current/decomp/KSA/LandmarkReference.cs
      - current/decomp/KSA/LocationReference.cs GetAxesCcf, UpdateStaticObjectRenderData
      - current/decomp/KSA/CelestialTemplate.cs Locations
      - current/decomp/KSA/StaticObject.cs ResolveAll, Find
      - current/decomp/KSA/ConstraintSim.cs ResolveLaunchPads, UpdateStaticObjectCollider
      - current/decomp/KSA/ModLibrary.cs AttachGameData
      - current/decomp/KSA/LocationReference.cs UpdateStaticObjectRenderData
      - current/decomp/KSA/Camera.cs IsVisibleTo
      - current/decomp/KSA/StaticObject.cs UpdateRenderData
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf, GetCcf2Cce
      - current/decomp/KSA/Camera.cs GetPositionEgo
      - current/decomp/KSA/StaticObjectRenderer.cs UpdateRenderData
      - current/decomp/KSA/JobSystems.cs VehicleSolver
    lifecycle:
      - startup:all-mods-loaded
      - frame:render
      - physics:bepu
      - frame:draw-ui
      - event:save
      - event:load
      - tool:authoring
      - tool:build
    approaches:
      - n: 1
        title: Append IsLaunchPad LandmarkReferences to Earth's CelestialTemplate at StarMapAllModsLoaded; Postfix
          UpdateStaticObjectRenderData and call StaticObject.UpdateRenderData with your own matrix
        mod: ksastructures
        features:
          - mods/ksastructures/features/office-landmarks-static-objects
        technique: xml-asset
        note: "StaticSubObject + StaticObject XML with GroundOffset, SurfaceHeight, FootprintRadius; Latitude and Longitude as
          RadianReferences and OnDataLoad(Mod.Empty) to compute ForwardCcf; AllModsLoaded precedes AttachGameData so
          ResolveAll picks the landmark up; asset frame +X up, +Y east, +Z north; the nearest launch pad within 300 m is
          a body's only static collider (use it as a doorway). Runs inside Program.Render per visible viewport; same
          matrix the engine would have built (axes plus up * GroundOffset); only when the tangent-plane cull hid it.
          Sub-step of the landmark approach: redraw when the engine culls the object; give it its own section."
      - n: 2
        title: GroundAnchor (Celestial, Ccf position, normal) composed each frame into a camera-relative matrix
        mod: unscience
        features:
          - mods/unscience/features/sphinx-glb-statics-placement
          - mods/unscience/features/sphinx-static-object-render-hooks
        technique: glb-model
        note: "FrameCcf x Ccf2Cce x translation(camera.GetPositionEgo(body)); east from UnitZ x radial with a pole fallback;
          placed by terrain click or beside a vessel after waiting for solvers; drawn through postfixes on
          StaticObjectRenderer; restored from scene saves. PlacementMath.GroundedLocal (scale 0.01 to 1000 per axis,
          rotations X Y Z in degrees) grounds and centres from the import bounds; tested with 200 random cases. Distinct
          problem within the topic: anchoring mod-drawn models (not landmarks) in the body-fixed frame."
      - n: 3
        title: Course frame anchored at the kitten and saved as latitude, longitude, heading and floor height
        mod: ksagolf
        features:
          - mods/ksagolf/features/course-grid-and-save-file
          - mods/ksagolf/features/minigolf-course-builder
          - mods/ksagolf/features/mod-mesh-draw-hook
        technique: custom-physics
        note: "Body-fixed frame with up from the feet direction, +J from the facing projected to horizontal, floor at terrain
          plus 2 cm and releveled to the highest corner; saved as lat/lon/heading/floor height above ground rather than
          an absolute radius; meshes drawn per viewport after ClearBuckets with Ccf2Cce plus ego translation. Distinct
          problem within the topic: anchoring mod-drawn models (not landmarks) in the body-fixed frame."
      - n: 4
        title: Compose static objects and export launch sites into system XML
        mod: flexo
        features:
          - mods/flexo/features/static-object-composition
          - mods/flexo/features/launch-site-system-export
        technique: xml-asset, template-composition, coordinate-adapter, reference-remapping
        note: External browser authoring workflow; distinguish preview and export validation from native asset loading and live
          in-game verification. Cover every listed reusable mechanism with actionable source-backed steps.
