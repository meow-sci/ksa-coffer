    kind: howto
    group: user-data
    batch: persistence-1
    summary: "Store what the player creates rather than what the mod configures: editable color schemes and themes
      (including the byte-to-float round trip ImGui color pickers need and name-clash rules between bundled and user
      files), effect presets exported to XML, user-built layouts as versioned JSON anchored to a body, and imported PNG,
      GLB or sound files copied into a catalog folder and referenced by name so a saved scene can reproduce them."
    game_types:
      - Brutal.ImGuiApi.ImGui
      - KSA.SerializedId
      - KSA.IKeyed
      - KSA.ModLibrary
      - KSA.Celestial
      - KSA.Universe
      - KSA.CelestialSystem
    engine_pointers:
      - current/decomp/KSA/ModLibrary.cs (asset registration and Get<T>)
      - current/decomp/KSA/Celestial.cs GetDirCcfFromLatLon (convention for latitude and longitude)
