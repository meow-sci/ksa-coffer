- slug: persist-imgui-window-state
  title: Persist ImGui window state and layouts
  kind: howto
  group: user-data
  batch: persistence-1
  summary: imgui.ini keeps position and size only for windows that do not set NoSavedSettings, and never remembers the open
    flag. Use a plain ImGui.Begin so the game's ini restores geometry and save the open flag in your own file; persist only
    your own window sections with SaveIniSettingsToMemory and LoadIniSettingsFromMemory; or let the player capture every live
    window or in-world panel as a named layout and apply it on request.
  game_types:
  - KSA.ImGuiWindow
  - KSA.ConsoleStyle
  - Brutal.ImGuiApi.ImGui
  - KSA.Vehicle
  - KSA.LayoutSaves
  engine_pointers:
  - current/decomp/KSA/ImGuiWindow.cs (NoSavedSettings in OnDrawUi)
  - current/decomp/KSA/LayoutSaves.cs (the game's own HUD layout files, for comparison)
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - event:starmap-unload
  approaches:
  - n: 1
    title: Plain ImGui.Begin so imgui.ini restores geometry, and compare the open flag every frame
    mod: ohmystars
    features:
    - mods/ohmystars/features/ini-settings-persistence
    - mods/compendium/features/settings-ini-persistence
    technique: imgui-window
    note: 'The game''s ConsoleStyle.BeginWindow forces NoSavedSettings, so the mod calls ImGui.Begin directly; window size
      is set with ImGuiCond.FirstUseEver. Second half, give it its own section: The flag changes from the ModMenu entry and
      from the window close button, so a per-frame comparison catches both; OhMyStars does the same for two windows and persists
      the legend sub-view as its parent tab.'
  - n: 2
    title: Filtered ImGui ini section saved on a timer and at unload
    mod: unscience
    features:
    - mods/unscience/features/unscience-supermod-host
    technique: imgui-window
    note: window.ini holds only the [Window][Unscience Toolbox] section; the ImGui context must already exist when the file
      is loaded at AllModsLoaded; header open-state and a layout auto-save toggle are stored beside it.
  - n: 3
    title: One TOML file per layout, hand-emitted and applied only on request
    mod: purrtty
    features:
    - mods/purrtty/features/saved-terminal-layouts
    technique: toml-config
    note: Layout data model, atomic write, skip-on-name-collision apply, tracked set for Tear down, startup command history,
      and the note that in-world anchors resolve best-effort across restarts because only Vehicle.Id is stable.
  related:
  - subclass-the-stock-imguiwindow
  - persist-mod-settings-ini
  - identify-vessels-and-parts-across-saves
  - persist-mod-settings-toml
  merged_from:
  - persist-imgui-window-layout
  - save-and-restore-named-window-layouts
