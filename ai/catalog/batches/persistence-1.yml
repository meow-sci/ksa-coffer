- slug: save-and-load-the-game-from-code
  title: Create and load native KSA saves from mod code
  kind: howto
  group: saves
  batch: persistence-1
  summary: Call the same game methods the console commands use - SaveName.TryAccept then UncompressedSave.Make to save, GameSaves.LoadSaveGame
    to load - so every other mod's save hooks and sidecars run as for a manual save. Refuse to save while the editor is open,
    drive an autosave from a real-time timer independent of warp and pause, and after a load wait until a craft is flown again,
    expecting every vehicle to be replaced while the scene stays alive.
  game_types:
  - KSA.GameSaves
  - KSA.UncompressedSave
  - KSA.GameSave
  - KSA.SaveName
  - KSA.Program
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/GameSaves.cs MakeUncompressedSave
  - current/decomp/KSA/UncompressedSave.cs Make, Write
  - current/decomp/KSA/SaveName.cs TryAccept, MAX_LENGTH
  - current/decomp/KSA/Program.cs IsEditorOpen
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  - current/decomp/KSA/UncompressedSave.cs Load
  - current/decomp/KSA/Universe.cs DeserializeSave
  lifecycle:
  - frame:draw-ui
  - event:save
  - frame:after-on-frame
  - event:load
  approaches:
  - n: 1
    title: GameSaveProvider.TryMakeSave driven by a Stopwatch-fed controller with injected delegates
    mod: unscience
    features:
    - mods/unscience/features/save-yourself-timed-autosave
    technique: starmap-lifecycle
    note: CanSaveNow mirrors RefusedInEditor without its alert; prefix length and alphabet rules so TryAccept never alters
      the name; the controller takes two delegates so it runs in KSA-free tests; the hidden-HUD replay keeps the timer running.
  - n: 2
    title: A file-bridge load command that waits for a controlled craft
    mod: ksagolf
    features:
    - mods/ksagolf/features/file-command-bridge
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksacars/features/file-drop-command-bridge
    technique: starmap-lifecycle
    note: Called from the frame postfix; completion is detected by waiting until Program.ControlledVehicle is set. Same pattern
      in three bridges.
  - n: 3
    title: A scenario runner that loads a save a few seconds after start
    mod: ksarmory
    features:
    - mods/ksarmory/features/unattended-scenario-runner
    technique: starmap-lifecycle
    note: Request file read at load, save loaded three seconds later, then the scenario spawns targets and flies; a developer-only
      harness.
