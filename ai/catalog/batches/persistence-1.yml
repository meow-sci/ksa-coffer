- slug: persist-mod-settings-ini
  title: Persist mod settings in a hand-rolled ini file
  kind: howto
  group: settings-formats
  batch: persistence-1
  summary: Keep a flat key=value settings file without any library - invariant-culture numbers and colors, defaults for missing
    keys, and a choice of when to write (every change, a Save button, or a dirty flag flushed on close and unload).
  game_types:
  - KSA.Mod
  - Brutal.ImGuiApi.ImGui
  engine_pointers: []
  lifecycle:
  - startup:immediate-load
  - startup:all-mods-loaded
  - frame:draw-ui
  - event:starmap-unload
  approaches:
