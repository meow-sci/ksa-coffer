- slug: detect-save-load
  title: Detect a save load or quickload and reset mod state safely
  kind: howto
  group: saves
  batch: persistence-1
  summary: StarMap has no load hook and the flight scene is not recreated on a load, so a mod that holds Vehicle, body or
    camera references has to notice the load itself. Postfix Program.OnGameLoaded and act in the next frame step, watch UncompressedSave.Load,
    infer a reload from the universe clock, or avoid detection by rebuilding state from the live world. Then drop what DeserializeSave
    made stale (vehicles, cameras, the universe clock, body indices) from a safe point, telling a discard from a clear that
    writes settings.
  game_types:
  - KSA.Program
  - KSA.Universe
  - KSA.UncompressedSave
  - KSA.GameSaves
  - KSA.CelestialSystem
  - KSA.Vehicle
  - KSA.Part
  engine_pointers:
  - current/decomp/KSA/Program.cs OnGameLoaded
  - current/decomp/KSA/UncompressedSave.cs Load
  - current/decomp/KSA/Universe.cs DeserializeSave
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  - current/decomp/KSA/CelestialSystem.cs All
  - current/decomp/KSA/Program.cs VehiclesInFrame
  lifecycle:
  - startup:all-mods-loaded
  - event:load
  - frame:draw-ui
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Postfix Program.OnGameLoaded, latch a flag, consume it in the next frame step and forget the world
    mod: ksarmory
    features:
    - mods/ksarmory/features/detect-save-load-ongameloaded
    - mods/ksagolf/features/save-load-detection
    technique: harmony-postfix
    note: 'The postfix only sets a flag inside a try; ConsumeReload clears it so exactly one caller acts. Walks through what
      the engine does in DeserializeSave and why the flight scene stays alive. KSAGolf shows the same latch for a craft mover,
      course builder and putting session. Sub-step (folded from reset-mod-state-on-load, give it its own section): ForgetTheWorld
      table of everything dropped (systems, effects, roster, cameras, step tracking) and why Discard is used instead of Clear,
      which would write settings that now belong to the save being opened; KSAGolf releases the craft mover, course builder
      and putting session and resets StepGate so the next consumed step takes the new clock whatever its timestamp.'
  - n: 2
    title: Same latch with the target pinned at compile time
    mod: ksastructures
    features:
    - mods/ksastructures/features/save-load-detection
    technique: harmony-postfix
    note: A never-called PinTheSignature method references Program.OnGameLoaded so a signature change in a later build becomes
      a build error instead of a silently dead patch; degrade-not-break when the target is missing.
  - n: 3
    title: Observe UncompressedSave.Load, compare the UniverseData reference and reset a list of save-lifetime caches
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/save-scoped-sidecar-registries
    - mods/ohmystars/features/save-scoped-settings-sidecar
    technique: harmony-prefix
    note: 'A prefix captures the current UniverseData and the postfix compares it, because stock Load returns normally when
      the editor refuses the load or the file is unreadable. Also gives the loaded save id (__instance.Id). Sub-step (folded
      from reset-mod-state-on-load, give it its own section): SaveScopedState.ResetAll names each cache holding Vehicle, Burn
      or FlightPlan references or body indices, with the reason: vehicles are rebuilt, a disposed vehicle''s plan stays intact,
      and swap-removal makes kept indices resolve to another body.'
  - n: 4
    title: Postfix Universe.DeserializeSave when the CelestialSystem object survives
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/live-body-relative-anchors
    technique: harmony-postfix
    note: DeserializeSave keeps the same CelestialSystem object, so a latch on the CurrentSystem reference cannot see a load;
      the postfix clears anchors held against the old world.
  - n: 5
    title: Infer a reload from universe time running backwards
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/mission-clock-and-liftoff-detection
    technique: starmap-lifecycle
    note: 'No hook at all: a known mission whose universe time drops by more than a tolerance resets its clock, covering quickload
      and revert; liftoff epochs are persisted in config.json so T+ survives a reload.'
  - n: 6
    title: 'Do not detect at all: rebuild a derived registry from the live world each frame'
    mod: ksacars
    features:
    - mods/ksacars/features/frame-step-latch-and-car-registry
    technique: starmap-lifecycle
    note: Buggies.Sync finds each vehicle with a part whose Id matches, resolves its subparts once, restores the headlamp
      setting from the part's saved light switch and drops entries whose vehicle is disposed; a load needs no special handling.
      Contrast with detect-save-load for mods that hold state the world cannot reproduce.
  related:
  - save-mod-state-with-the-scene
  - save-mod-state-with-the-game-save
  - cache-and-key-body-data-per-loaded-system
  - save-and-load-the-game-from-code
  - mutate-vehicles-at-a-physics-safe-point
  - track-and-classify-craft
  - draw-ui-while-the-hud-is-hidden
  merged_from:
  - reset-mod-state-on-load
  - rebuild-mod-state-from-the-loaded-world
- slug: save-mod-state-with-the-game-save
  title: Store per-save mod data next to a KSA save and notice when the player saves
  kind: howto
  group: saves
  batch: persistence-1
  summary: UniverseData is a fixed XML class with no room for a mod, so per-save data goes in a sidecar. Choose the location
    and the key - inside the save folder keyed by craft name, or in the mod folder keyed by save id and vehicle id - detect
    that the game wrote a save (patch UncompressedSave.Write or Make, or poll universe.xml) and write after the game's own
    write, because KSA 5554 wipes and recreates the save folder on every save.
  game_types:
  - KSA.GameSaves
  - KSA.GameSave
  - KSA.UncompressedSave
  - KSA.SaveDirectory
  - KSA.UniverseData
  - KSA.Vehicle
  engine_pointers:
  - current/decomp/KSA/UncompressedSave.cs Write, Load, Make
  - current/decomp/KSA/SaveDirectory.cs TryReplace
  - current/decomp/KSA/GameSaves.cs SaveFolderPath, Selected
  - current/decomp/KSA/UncompressedSave.cs Make, Write
  - current/decomp/KSA/GameSaves.cs MakeUncompressedSave
  lifecycle:
  - startup:all-mods-loaded
  - event:save
  - event:load
  - frame:draw-ui
  approaches:
  - n: 1
    title: JSON file inside the save folder, written when universe.xml changes
    mod: ksarmory
    features:
    - mods/ksarmory/features/per-craft-settings-json-sidecar
    technique: save-sidecar
    note: 'saves/<id>/KSArmory/systems.json keyed by craft name, flat DTO with defaults so older files load new fields, a
      loose file adopted by the first save when none is open, refusing to create a save folder that does not exist, and no
      write on load because the file belongs to the save being opened. Sub-step (folded from detect-game-save, give it its
      own section): with no Harmony patch, poll the universe.xml last-write time every step; the first sighting only records
      the stamp, later changes trigger the sidecar write. Trade-off is a one-step delay and reliance on the file system clock;
      explain why writing on every change instead would defeat reload.'
  - n: 2
    title: Generic per-save store keyed by save id, written on UncompressedSave.Make
    mod: ohmystars
    features:
    - mods/ohmystars/features/save-scoped-settings-sidecar
    - mods/ksa-advancedflightcomputer/features/save-scoped-sidecar-registries
    technique: save-sidecar
    note: 'SaveLoadObserver tracks the current save id; a generic SaveScopedSettingsStore reads every save folder''s file
      and writes atomically; honest note that the settings type is empty in this version, so the article is about the pattern.
      Sub-step (folded from detect-game-save, give it its own section): postfix UncompressedSave.Make and take __result?.Id
      with the typed name as a fallback, or postfix Write only when it returned true (the AFC variant in the next approach).'
  - n: 3
    title: TOML in the mod folder keyed by (save id, vehicle id), rekeyed on save-as
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/save-scoped-sidecar-registries
    technique: save-sidecar
    note: 'Keeps the stock save format untouched so uninstalling loses nothing; unsaved changes are dropped like the game
      drops unsaved burns; the init-time load fixes first-save overwrites of other saves'' entries; hand-written TOML with
      round-trip doubles. Sub-step (folded from detect-game-save, give it its own section): AFC patches UncompressedSave.Write
      and acts only on success, rekeying entries from the old save id to the written one.'
  related:
  - save-mod-state-with-the-scene
  - detect-save-load
  - identify-vessels-and-parts-across-saves
  - write-and-load-config-files-safely
  - open-the-vehicle-editor-on-a-live-eva-kitten
  - restore-kitten-customizations-after-a-load
  - save-and-load-the-game-from-code
  merged_from:
  - detect-game-save
- slug: save-mod-state-with-the-scene
  title: Save a whole mod's scene state as versioned sidecar records, with reset and replay on load
  kind: howto
  group: saves
  batch: persistence-1
  summary: 'For many features with native objects to rebuild, capture each feature as a versioned JSON record at save time,
    validate every record before the world is touched on load, reset old ownership in reverse order, replay restores in order
    after KSA rebuilds the world, and retain records that cannot be restored. The third approach is the mechanism underneath:
    patch GameSave.Populate, UncompressedSave.Write and Load, and Universe.DeserializeSave and LoadSystem to publish capture,
    write, reset and restore callbacks, validate incoming data before anything is destroyed, and replay world replacement
    at the PrepareFrame handoff.'
  game_types:
  - KSA.GameSave
  - KSA.UncompressedSave
  - KSA.Universe
  - KSA.UniverseData
  - KSA.GameSaves
  - KSA.JobSystems
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/GameSave.cs Populate
  - current/decomp/KSA/UncompressedSave.cs Write, Load
  - current/decomp/KSA/Universe.cs DeserializeSave
  - current/decomp/KSA/Universe.cs DeserializeSave, LoadSystem
  - current/decomp/KSA/Program.cs PrepareFrame, OnGameLoaded
  lifecycle:
  - startup:all-mods-loaded
  - event:save
  - event:load
  - frame:prepare
  - frame:draw-ui
  - frame:input
  approaches:
  - n: 1
    title: ISaveParticipant records through a game-independent coordinator
    mod: unscience
    features:
    - mods/unscience/features/lib-scene-save-coordinator
    - mods/unscience/features/camera-controller-override-keyframe-sequences
    - mods/unscience/features/kitten-animations-locomotion-tuning
    technique: save-sidecar
    note: Participant contract (SaveId, SaveVersion, RestoreOrder, CaptureState, ResetState, PrepareRestore), coordinator
      state machine, retention of unknown or newer records so older builds round-trip them, the unscience.json document with
      size limits and a universe.xml SHA-256 binding, and the SaveJson options for Brutal vector types.
  - n: 2
    title: Host wiring - pair each capture with its write by object identity
    mod: unscience
    features:
    - mods/unscience/features/unscience-scene-save-sidecar
    technique: save-sidecar
    note: Populate postfix stores the document in a ConditionalWeakTable keyed by the GameSave, the Write postfix publishes
      it only when the native write succeeded, a write without a capture is reported rather than filled with fresh state,
      and a missing sidecar means reset everything, restore nothing.
  - n: 3
    title: Eight static callbacks over five patched methods, loads replayed at the frame handoff
    mod: unscience
    features:
    - mods/unscience/features/lib-native-save-hooks
    technique: harmony-prefix
    note: Exact-signature binding with rollback on failure, the deferral prefix that re-queues the same native call, worker
      joins before reset, preflight validation of incoming UniverseData, finalizers that turn silent native read failures
      into errors, and per-callback try/catch isolation. Includes the call-chain table from console, windows and multiplayer.
  related:
  - identify-vessels-and-parts-across-saves
  - detect-save-load
  - save-mod-state-with-the-game-save
  - exclude-or-replace-ground-clutter
  - chain-camera-moves-into-keyframe-sequences
  - restore-kitten-customizations-after-a-load
  - mutate-vehicles-at-a-physics-safe-point
  - save-and-load-the-game-from-code
  merged_from:
  - hook-native-save-and-load
  - save-sidecar-state-per-scene
  - save-mod-state-with-native-saves
- slug: identify-vessels-and-parts-across-saves
  title: Identify vessels and parts stably across saves
  kind: howto
  group: saves
  batch: persistence-1
  summary: Part.InstanceId comes from a running counter reset on load and Part.Id falls back to the template id, while Vehicle.Id
    is a display name that can be renamed, duplicated or recycled. Choose a key, follow renames and disposals so a recycled
    id cannot inherit another craft's data, and when a specific part must survive, store a structural address (vehicle id,
    tree and sub-part index paths, template id, SHA-256 topology signature) and resolve it to null rather than guess.
  game_types:
  - KSA.Part
  - KSA.PartInstance
  - KSA.Vehicle
  - KSA.Universe
  - KSA.PartTree
  - KSA.PartTemplate
  - KSA.CelestialSystem
  engine_pointers:
  - current/decomp/KSA/Part.cs InstanceId
  - current/decomp/KSA/Universe.cs GetNextRunningId, DeserializeSave
  - current/decomp/KSA/Vehicle.cs SetName, Dispose(bool)
  - current/decomp/KSA/Part.cs InstanceId, TreeChildren, SubParts
  - current/decomp/KSA/Universe.cs DeserializeSave
  lifecycle:
  - event:save
  - event:load
  - event:vehicle-destroyed
  - frame:prepare
  approaches:
  - n: 1
    title: Key on Vehicle.Id and follow SetName and Dispose with postfixes
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/save-scoped-sidecar-registries
    technique: harmony-postfix
    note: Prefix and postfix on Vehicle.SetName move entries only when the rename succeeded (__result); Dispose(bool) is hooked
      rather than Dispose() because EVA boarding calls the bool overload directly.
  - n: 2
    title: 'Key on the craft display name with a #n suffix for duplicates'
    mod: ksarmory
    features:
    - mods/ksarmory/features/per-craft-settings-json-sidecar
    technique: save-sidecar
    note: Craft built from one blueprint share a name and therefore an entry; the roster warns when the second one is crewed.
      Shows the limit of name keys.
  - n: 3
    title: Why a window layout can only anchor on Vehicle.Id
    mod: purrtty
    features:
    - mods/purrtty/features/saved-terminal-layouts
    technique: toml-config
    note: Part and sub-part ids resolve to the first match after a restart, so in-world anchors are best effort; use as the
      counter-example that leads into reference-a-part-stably-across-saves.
  - n: 4
    title: SavedPartReference with paths and a topology hash, resolved in the restore scope
    mod: unscience
    features:
    - mods/unscience/features/lib-save-part-identity
    technique: save-sidecar
    note: Capture and resolve scopes that hash each vehicle once per transaction, the exact conditions under which Resolve
      returns null, the ambiguous-id rule, and the stated policy that references never fall back to the controlled vehicle
      or a similar part.
  related:
  - make-a-vehicle-indestructible
  - save-mod-state-with-the-game-save
  - anchor-to-parts-across-vehicle-changes
  - save-mod-state-with-the-scene
  merged_from:
  - understand-which-ids-survive-a-save
  - reference-a-part-stably-across-saves
