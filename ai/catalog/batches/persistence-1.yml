category: persistence
category_description: Where a mod keeps its files, how it reads and writes settings (ini, json, toml), and how it ties its
  own data to KSA's native saves - detecting loads and saves, sidecars, scene records, stable ids, window layouts and user
  data folders.
groups:
  saves: 'Tying mod data to KSA''s native saves: saving and loading from code, detecting loads, sidecars, scene records, stable
