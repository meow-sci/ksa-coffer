    mod: realatmospheres
    features:
    - mods/realatmospheres/features/modmenu-page-and-toml-settings
    technique: toml-config
    note: One setting under Documents/RealAtmospheres, read once, written on change, defaults for anything missing; suits
      a reflection-only mod without references.
