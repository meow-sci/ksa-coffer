- slug: write-and-load-config-files-safely
  title: Write config files atomically and load hand-edited ones without losing them
  kind: howto
  group: settings-formats
  batch: persistence-1
  summary: Avoid truncated or constantly rewritten files by writing to a temp file and moving it over the target, saving only
    when the content changed, debouncing bursts of edits, keeping file I/O off the render path and flushing on unload; and
    make loading tolerant - clamp or default bad values, drop only the field that breaks deserialisation, migrate older layouts
    and never overwrite a file you could not parse.
  game_types: []
  engine_pointers: []
  lifecycle:
  - frame:draw-ui
  - event:starmap-unload
  - thread:background
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: Dirty flag, debounce and atomic replace on write; JsonObject retry on load
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/json-config-in-documents
    technique: json-config
    note: 'Write side: MarkDirty from the UI, Flush(dt) from the draw loop after one second of quiet, temp file and File.Move
      overwrite, final SaveNow at StarMapUnload. Load side (folded from load-config-without-losing-user-edits, give it its
      own section): parse to a JsonObject, remove the fragile field and retry on JsonException; a list of fragile fields tried
      in order, colors and tuning sections parsed independently, then sanitising (clamps, array trimming, unknown enum values
      replaced).'
  - n: 2
    title: Compare the serialised snapshot with the last write
    mod: kitten-engineer-redux
    features:
    - mods/kitten-engineer-redux/features/json-settings-autosave
    technique: json-config
    note: A fixed two second Stopwatch interval; identical JSON is skipped, so no dirty flag has to be threaded through the
      UI.
  - n: 3
    title: Save from Task.Run with an atomic helper; clamp and log on load, leave an unparseable file alone
    mod: gatos
    features:
    - mods/gatos/features/toml-config-seeded-template
    technique: background-thread
    note: 'Write side: AtomicFile helper plus PersistConfig on a worker so the render thread never does file I/O; contrast
      with the main-thread saves of the other approaches. Load side (folded from load-config-without-losing-user-edits, give
      it its own section): Normalize() clamps every numeric knob into a bootable range and warns; on a parse error or unknown
      schema value the file is left alone so a typo cannot destroy the player''s config.'
  - n: 4
    title: Flush on close and unload; skip junk keys and migrate the previous format on load
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/color-palettes-persistence
    - mods/purrtty/features/toml-themes-and-settings
    technique: starmap-lifecycle
    note: 'Write side: dirty flag set by editors, open flags compared every frame, written when the window closes and again
      at StarMapUnload. Load side (folded from load-config-without-losing-user-edits, give it its own section): unknown keys
      and malformed values skipped; the old flat color format and purrTTY''s legacy flat settings file are converted into
      the current structure.'
  related:
  - persist-mod-settings-as-json
  - persist-mod-settings-toml
  - persist-mod-settings-ini
  - persist-user-created-presets-and-content
  merged_from:
  - write-config-files-atomically
  - load-config-without-losing-user-edits
- slug: choose-where-a-mod-stores-its-files
  title: Find where KSA keeps user data and choose where a mod stores its config and data files
  kind: howto
  group: user-data
  batch: persistence-1
  summary: Every per-user path in the game derives from Constants.DocumentsFolderPath (settings.toml, saves, Vehicles, HUDLayouts,
    mods, manifest), and StarMap can redirect the whole tree per launch. Decide between a file beside the mod DLL, a folder
    under the KSA documents folder, a data folder separate from the install folder, or a path derived from KSA's Logs folder,
    and know what each choice means for mod updates, shipped default configs, instance paths and uninstalling.
  game_types:
  - KSA.Constants
  - KSA.Mod
  - KSA.ModLibrary
  - KSA.GameSettings
  - KSA.GameSaves
  - KSA.VehicleSaves
  - KSA.LayoutSaves
  engine_pointers:
  - current/decomp/KSA/Constants.cs DocumentsFolderPath, LogsFolderPath
  - current/decomp/KSA/Mod.cs DirectoryPath
  - current/decomp/KSA/Constants.cs DocumentsFolderPath
  - current/decomp/KSA/GameSettings.cs SettingsFilePath
  - current/decomp/KSA/GameSaves.cs SaveFolderPath
  - current/decomp/KSA/VehicleSaves.cs and LayoutSaves.cs SaveFolderPath
  lifecycle:
  - startup:immediate-load
  - startup:all-mods-loaded
  - startup:starmap-before-main
  approaches:
  - n: 1
    title: Beside the mod DLL, resolved from the loaded assembly location
    mod: ohmystars
    features:
    - mods/ohmystars/features/mod-root-and-packaging
    - mods/compendium/features/settings-ini-persistence
    - mods/ksa-measuretools/features/color-palettes-persistence
    - mods/ohmystars/features/ini-settings-persistence
    - mods/ksa-aircrafthud/features/ini-settings-and-settings-window
    technique: toml-config
    note: 'Assembly.Location (or GetExecutingAssembly) gives the mod folder inside StarMap''s per-mod load context. Simple
      and portable, but a redeploy replaces the file unless the build is careful; the three mods differ in when they resolve
      the path (immediate load vs all-mods-loaded). Sub-step (folded from ship-default-config-and-keep-user-edits, give it
      its own section): when the shipped settings file is also the live one, the csproj copies the source ini to the output
      on each build, so published files carry the defaults and an update replaces user changes unless the mod seeds a separate
      copy.'
  - n: 2
    title: A mod-named subfolder under Constants.DocumentsFolderPath
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/json-config-in-documents
    - mods/purrtty/features/toml-themes-and-settings
    - mods/realatmospheres/features/modmenu-page-and-toml-settings
    - mods/kitten-engineer-redux/features/json-settings-autosave
    technique: json-config
    note: Survives mod updates and honours StarMap instance paths because the game constant is used. Compare the folder naming
      (KSATelemetryOverlay, .purrTTY, RealAtmospheres, KittenEngineerReduxData) and the one mod that bypasses the constant
      with Environment.SpecialFolder.MyDocuments.
  - n: 3
    title: A data folder under Documents/mods/<mod> kept apart from the install folder
    mod: gatos
    features:
    - mods/gatos/features/toml-config-seeded-template
    - mods/gatos/features/qcow2-overlay-guest-disks
    technique: toml-config
    note: 'Install folder holds only shipped, read-only artifacts; config, disks and logs go to a separate user-writable data
      folder (GatOsPaths) so updates never touch user data. Sub-step (folded from ship-default-config-and-keep-user-edits,
      give it its own section): a commented template in the install folder is copied to the live file only if missing (gatos.default.toml
      to gatos.toml), so edits made to the template before first launch carry over and updates never replace the live file.'
  - n: 4
    title: Derive the folder from KSA's own Logs folder with a temp fallback
    mod: ksagolf
    features:
    - mods/ksagolf/features/course-grid-and-save-file
    - mods/ksastructures/features/mod-log-file
    technique: json-config
    note: Course files go to a KSAGolf/Courses folder beside the folder the mod log lives in; if no KSA folder is found the
      temp directory is used. KSAStructures probes the Documents and XDG locations for its log the same way.
  - n: 5
    title: Know the folder map and let StarMap redirect it with an instance path
    mod: starmap
    features:
    - mods/starmap/features/instance-path-override
    technique: harmony-prefix
    note: 'Sub-step (folded from where-ksa-stores-user-data, give it its own section): Table of every path derived from the
      constant, the order StarMap looks for the override (command line argument, then environment variable), and why the patch
      must run before the manifest is read. Also the general recipe for patching a static property getter with AccessTools.PropertyGetter
      and a prefix that sets __result and returns false.'
  related:
  - persist-mod-settings-toml
  - persist-mod-settings-as-json
  - persist-mod-settings-ini
  - ship-content-and-code-in-one-mod
  - write-a-per-mod-log-file
  - how-starmap-launches-ksa
  merged_from:
  - where-ksa-stores-user-data
  - ship-default-config-and-keep-user-edits
- slug: persist-user-created-presets-and-content
  title: Persist user-created palettes, presets and content files
  kind: howto
  group: user-data
  batch: persistence-1
  summary: 'Store what the player creates rather than what the mod configures: editable color schemes and themes (including
    the byte-to-float round trip ImGui color pickers need and name-clash rules between bundled and user files), effect presets
    exported to XML, user-built layouts as versioned JSON anchored to a body, and imported PNG, GLB or sound files copied
    into a catalog folder and referenced by name so a saved scene can reproduce them.'
  game_types:
  - Brutal.ImGuiApi.ImGui
  - KSA.SerializedId
  - KSA.IKeyed
  - KSA.ModLibrary
  - KSA.Celestial
  - KSA.Universe
  - KSA.CelestialSystem
  engine_pointers:
  - current/decomp/KSA/ModLibrary.cs (asset registration and Get<T>)
  - current/decomp/KSA/Celestial.cs GetDirCcfFromLatLon (convention for latitude and longitude)
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - event:starmap-unload
  - startup:asset-load
  approaches:
  - n: 1
    title: Named palettes in a sectioned ini, byte4 colors with ColorEdit4 round trip
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/color-palettes-persistence
    technique: imgui-window
    note: Four shipped palettes plus user palettes, active index, derived alpha shades from the pending color, Restore default
      palettes that re-adds by name.
  - n: 2
    title: Bundled and user theme TOML files in alacritty format, user wins on name clash
    mod: purrtty
    features:
    - mods/purrtty/features/toml-themes-and-settings
    technique: toml-config
    note: Theme catalog merges a code-built default, the bundled folder and the user folder; 16 colors expand to a 256-color
      palette; custom colors persist only when saved as a named theme.
  - n: 3
    title: Override-only color table in the main config
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/json-config-in-documents
    - mods/ksa-public-telemetry/features/live-tuning-and-palette-reflection
    technique: json-config
    note: 'Only colors that differ from the compiled defaults are stored, as #RRGGBBAA keyed by field name, so changed defaults
      reach players who never customised.'
  - n: 4
    title: KxAsset profile type, XmlSerializer export trimmed with DefaultValue and ShouldSerialize
    mod: mpfx
    features:
    - mods/mpfx/features/xml-effect-profiles
    technique: xml-asset
    note: Registration in OnDataLoad, why in-game profiles are never written back automatically, ShouldSerialize methods and
      DefaultValue attributes to keep exports short, and copying the result to the clipboard from an ImGui window.
  - n: 5
    title: Snake_case JSON course file, append-only piece ids, drift warning on load
    mod: ksagolf
    features:
    - mods/ksagolf/features/course-grid-and-save-file
    technique: json-config
    note: Lat/lon from the body-fixed up vector with the same convention as Celestial.GetDirCcfFromLatLon, heading of the
      grid axis, floor height above the ground so terrain changes between builds do not strand the course; unknown piece ids
      dropped and named rather than thrown; the immutable grid model, port-on-edge design and undo stacks are only mentioned,
      not taught.
  - n: 6
    title: SharedFileLibrary with import caps, (n) suffixes and a shared ImGui browser
    mod: unscience
    features:
    - mods/unscience/features/lib-shared-file-library
    technique: save-sidecar
    note: Catalog folders under the .unscience data folder, FullPath rejecting separators, Import choosing stem (n).ext and
      copying with overwrite false, GLB selection ids that mix catalog files with built-in meshes. The ImGui browser itself
      is covered by build-a-filesystem-file-picker.
  related:
  - build-a-settings-window
  - persist-mod-settings-as-json
  - persist-mod-settings-toml
  - weld-one-vessel-to-another
  - build-searchable-lists-and-browsers
  - save-mod-state-with-the-scene
  - choose-where-a-mod-stores-its-files
  - write-and-load-config-files-safely
  - place-static-objects-on-a-planet-surface
  merged_from:
  - persist-named-color-palettes
  - ship-presets-as-xml-assets-and-export-them
  - import-user-files-into-a-mod-catalog
