    title: Flat settings.ini rewritten on every widget change
    mod: ohmystars
    features:
    - mods/ohmystars/features/ini-settings-persistence
    technique: toml-config
    note: Case-insensitive keys, sections ignored on read, TryParse with default constants, file created from defaults when
      missing; every widget change branch calls SaveSettings.
  - n: 2
    title: Load first at StarMapImmediateLoad, rewrite on change
    mod: compendium
    features:
    - mods/compendium/features/settings-ini-persistence
    technique: toml-config
    note: Loaded before anything else so later initialisation sees the saved options; clamps colors to 0..1 and keeps the
