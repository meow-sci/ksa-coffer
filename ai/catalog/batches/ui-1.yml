      approach 1, "Reflection-only Harmony.Patch with arguments filled by parameter name"): FindType scans loaded assemblies,
      GetMethod(NonPublic|Static) with Type.EmptyTypes, Harmony and HarmonyMethod created through Activator, argument array
      sized to the Patch method with HarmonyMethod placed where the parameter is named postfix; failures are logged with the
      reason and shown in the settings UI. Optional dependency on Harmony without a build reference.'
