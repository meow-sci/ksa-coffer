category: ui
category_description: ImGui windows, menu bar and ModMenu entries, fonts, draw-list overlays and widgets, hotkeys and input
  focus, stock-window injection, HUD overlays and settings UIs for KSA mods.
groups:
  input: 'Mouse and keyboard: cursor rays and picking, grid placement, sharing input between ImGui, mod tools and the game,
    hotkeys and text entry.'
  windows: 'Mod windows that look and behave like the game''s: ImGuiWindow subclasses, stock styling, tabs, settings panels,
    searchable lists, live data, alerts and loading-time dialogs.'
  overlays: 'Full-screen overlays and HUDs: choosing the draw list, staying visible and stepping when the HUD is hidden, and
    instrument-style HUD drawing.'
topics:
- slug: cursor-to-world-ray
  title: Turn the mouse cursor into a world ray and pick points on a construction plane
  kind: howto
  group: input
  batch: ui-1
  summary: Convert the ImGui cursor into an Ecl or Ego ray through the camera of the viewport it is over, subtracting the
    viewport offset and scaling to framebuffer pixels, and verify it by round-tripping. Also covers the camera ego frame the
    ray lives in (ecliptic axes, camera-relative origin, EgoToEcl as a pure translation, one ego frame per viewport camera)
    and intersecting the ray with a camera-facing or ecliptic construction plane, storing the hit relative to a body.
  game_types:
  - KSA.Camera
  - KSA.Cursor
  - KSA.Ray
  - KSA.ViewportRegistry
  - KSA.IGameViewport
  - KSA.Vehicle
  - KSA.Transform3D
  - KSA.GameViewport
  - KSA.MathEx
  - KSA.Astronomical
  - KSA.VehicleEditingSpace
  engine_pointers:
  - current/decomp/KSA/Camera.cs ScreenToEgoRay
  - current/decomp/KSA/Cursor.cs GetEgoRay
  - current/decomp/KSA/Camera.cs GetPositionEgo, EgoToEcl, EclToEgo, Ego2View, GetFieldOfView
  - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
  - references/KSACars/docs/KSA-CAMERAS.md section 3 and the reference-frame discussion
  - current/decomp/KSA/Camera.cs ScreenToEgoRay, EgoToEcl, EclToScreen, EgoToScreen, GetForwardEcl
  - current/decomp/KSA/Cursor.cs GetPosition, GetEgoRay
  - current/decomp/KSA/MathEx.cs RayPlaneIntersection
  lifecycle:
  - frame:draw-ui
  - frame:input
  - frame:viewports
  - frame:render
  approaches:
  - n: 1
    title: ScreenToEgoRay with viewport offset and framebuffer scale
    mod: ksarmory
    features:
    - mods/ksarmory/features/cursor-ray-world-click-tools
    technique: imgui-drawlist
    note: Ignore clicks ImGui owns; works with the HUD hidden.
  - n: 2
    title: Viewport lookup, EgoToEcl and a projected round trip for debugging
    mod: ksagolf
    features:
    - mods/ksagolf/features/cursor-picking-and-terrain-ray
    technique: imgui-drawlist
    note: Project the hit back and measure the pixel error.
  - n: 3
    title: Framebuffer pixel conversion before ScreenToEgoRay
    mod: ksacars
    features:
    - mods/ksacars/features/craft-mover-mouse-pick-place
    technique: imgui-drawlist
    note: Convert to camera framebuffer pixels first.
  - n: 4
    title: Cursor.GetEgoRay
    mod: purrtty
    features:
    - mods/purrtty/features/ray-pick-focus-for-world-quads
    technique: imgui-drawlist
    note: Stock helper with Moller-Trumbore triangle tests for world quads.
  - n: 5
    title: Ego axes are ECL axes; lift the ray origin, keep directions; ScreenToEgoRay, ray origin lifted by EgoToEcl, MathEx.RayPlaneIntersection,
      stored as a CCE offset
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/cursor-unprojection-and-construction-plane
    technique: screen-to-world-ray
    note: 'Folded from camera/work-in-the-cameras-ego-frame approach 1: EgoToEcl is posEgo + PositionEcl, so a ray direction
      can be used unchanged in ecliptic space. Sub-step: give this its own section, "Pick points on a construction plane".
      The ecliptic normal is ECL +Z, checked in game, not Camera.UpView; a plane through the previous point shares one depth
      for all points of a measurement; behind-camera hits (t <= 0) are rejected; the preview runs after the camera updates,
      the click in the OnMouseButton prefix.'
  related:
  - pick-objects-under-the-cursor
  - project-world-positions-to-screen
  - understand-ksa-coordinate-frames-and-epochs
  - choose-a-render-frame-and-anchor-effects
  - draw-lines-on-the-sky
  - draw-a-fullscreen-click-through-overlay
  - coordinate-imgui-focus-with-game-input
  - aim-a-secondary-viewport-camera
  - draw-a-textured-quad-in-the-world
  merged_from:
