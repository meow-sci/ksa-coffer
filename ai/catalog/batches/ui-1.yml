  - place-points-under-the-cursor-on-a-construction-plane
  note: 'Approaches merged into other topics: "Direction times a camera-centred sphere radius" -> project-world-positions-to-screen;
    "View-space billboard pinned to the camera" -> draw-a-textured-quad-in-the-world; "Position as this window''s camera draws
    it, not the analytic position" -> aim-a-secondary-viewport-camera.'
- slug: pick-objects-under-the-cursor
  title: Pick the vessel, part, world quad or terrain point under the cursor
  kind: howto
  group: input
  batch: ui-1
  summary: Choose among vessels by screen-space nearest with an apparent-size reach, parts by hull ray, in-world quads by
    triangle tests, or the terrain point under the cursor by marching the ray below the height field; route input to the one
    hit and optionally teleport a craft there.
  game_types:
  - KSA.Part
  - KSA.Vehicle
  - KSA.Cursor
  - KSA.Ray
  - KSA.Celestial
  - KSA.CelestialSystem
  - KSA.Camera
  - KSA.InputEvents
  engine_pointers:
  - current/decomp/KSA/Part.cs RayCastEgo
  - current/decomp/KSA/Celestial.cs (terrain height queries)
  - current/decomp/KSA/Vehicle.cs TeleportToLocation
  lifecycle:
  - frame:draw-ui
  - frame:input
  approaches:
  - n: 1
    title: Screen-space nearest with a per-item reach
    mod: ksagolf
    features:
    - mods/ksagolf/features/cursor-picking-and-terrain-ray
    - mods/ksacars/features/craft-mover-mouse-pick-place
    - mods/ksagolf/features/craft-mover
    technique: imgui-drawlist
    note: 'Project all vehicles and pick within size-based radii. Also (merged from vehicles-and-parts/raycast-against-part-meshes
      approach 4, "Screen-space projection with a size-based pick radius"): [folded from pick-a-vehicle-under-the-cursor:
      give it its own section] Cheap, no mesh test; pair with the terrain height-field ray for placement.'
  - n: 2
    title: Part.RayCastEgo hull test plus terrain march (fire-at-spot designation)
    mod: ksarmory
    features:
    - mods/ksarmory/features/cursor-ray-world-click-tools
    technique: imgui-drawlist
    note: 'Exact hull hits plus a terrain march. Also folded: Terrain march alongside hull ray tests (ksarmory): Used for
      fire-at-spot designation.'
  - n: 3
    title: Ray hit to texture UV for interactive in-world UI
    mod: purrtty
    features:
    - mods/purrtty/features/ray-pick-focus-for-world-quads
    technique: imgui-drawlist
    note: Converts the hit to widget coordinates so a world quad is clickable and typeable.
  - n: 4
    title: Clearance-stepped terrain march with bisection, then a buffered TeleportToLocation
    mod: ksagolf
    features:
    - mods/ksagolf/features/cursor-picking-and-terrain-ray
    - mods/ksacars/features/craft-mover-mouse-pick-place
    technique: imgui-drawlist
    note: 'March from the eye; do not refine a sphere hit. Also folded: Height-field walk with steps bounded by height above
      ground (ksacars): Walk the ray below the highest terrain. Also folded: Buffered TeleportToLocation after a cursor pick
      (ksacars): A buffered input event, so call once per action. Sub-step to give its own section: teleport a craft to the
      picked latitude and longitude once per action with Vehicle.TeleportToLocation (a buffered input event).'
  - n: 5
    title: Ray.RaycastWatertight plus terrain march and bisection
    mod: gatos
    features:
    - mods/gatos/features/sticker-projected-decals
    technique: raycast-picking
    note: 'Folded from rendering/choose-a-render-frame-and-anchor-effects approach 10: [Folded from pick-a-surface-point-under-the-cursor:
      cursor-picking sub-step (own section): turn a click ray into a surface anchor, as an armed one-shot placement mode.]
      Same goal with the engine''s watertight ray cast against parts and a bisected terrain hit.'
  related:
  - cursor-to-world-ray
