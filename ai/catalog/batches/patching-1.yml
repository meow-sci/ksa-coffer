- slug: validate-patch-targets-and-detect-game-update-breakage
  title: Validate patch and reflection targets at load and detect game-update breakage
  kind: howto
  group: safety
  batch: patching-1
  summary: Resolve all private fields and methods in one place at startup, tag each with the features that need it, and let
    each feature refuse to load or the mod report a degraded state when one is gone. Then make signature drift visible in
    code before a player hits it by pinning public patch targets with never-called members. Build-level drift detection (hashed
    assembly lock, external member surface, coupling catalog) lives in testing-and-tooling.
  game_types:
  - KSA.TransferPlanner
  - KSA.Vehicle
  - KSA.FlightComputer
  - KSA.GameSettings
  - KSA.ModLibrary
  - KSA.SerializedCollection
  - KSA.VehicleEditor
  - KSA.Program
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/TransferPlanner.cs private static planner fields and SetTransferInfo
  - current/decomp/KSA/ModLibrary.cs internal static readonly registries (AllParts, AllMeshes, AllFiles, AllMaterials)
  - current/decomp/KSA/SerializedCollection.cs _collection
  - current/dll/KSA.dll (member references read from metadata tables)
  - current/decomp/ (diff two builds against the recorded surface)
