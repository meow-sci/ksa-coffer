- slug: identify-a-call-by-its-argument-il
  title: Identify the right call in a method that makes several similar calls
  kind: howto
  group: transpilers
  batch: patching-1
  summary: 'When a method calls the same helper more than once (ocean versus air drag, one Burn.Create among many, one BeginRenderPass
    among several), pick the right instruction by what surrounds it: the loads that feed its arguments, a unique neighbouring
    call, or the instruction that consumes its result. Includes window sizes, stopping at the previous call boundary, and
    what to do when a later build adds a second match.'
  game_types:
  - KSA.PhysicsStates
  - KSA.PhysicsEnvironment
  - KSA.Program
  - KSA.TransferPlanner
  - KSA.BurnContextMenu
  - KSA.Vehicle
  - KSA.GaugeCanvas
  - KSA.GaugeButtonNavBallMode
  - KSA.NavigationTarget
  engine_pointers:
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives (two ComputeDrag calls, AtmosphericDensity versus OceanDensity)
  - current/decomp/KSA/Program.cs RenderGame (RenderDrawData then the preceding BeginRenderPass)
  - current/decomp/KSA/TransferPlanner.cs DrawPlanWindow (PrimaryButton before Burn.Create)
  - current/decomp/KSA/GaugeCanvas.cs IsContextVisible
  - current/decomp/KSA/GaugeButtonNavBallMode.cs IsDisabled and OnReleased
  - current/decomp/KSA/Vehicle.cs UpdateNavballData and IsDisabled(VehicleReferenceFrame)
  lifecycle:
  - startup:all-mods-loaded
  - startup:starmap-before-main
  - startup:immediate-load
  - frame:draw-ui
  - frame:apply-solvers
  approaches:
  - n: 1
    title: Scan backwards through the argument loads to the previous call
    mod: ksaero
    features:
    - mods/ksaero/features/computedrag-call-site-transpiler
    technique: harmony-transpiler
    note: Walk back at most N instructions from the call, succeed on LoadsField of the discriminating field, fail on the first
      call or callvirt. Include the IL table of the two ComputeDrag calls in build 5554 and why matching a field load beats
      a fixed offset.
  - n: 2
    title: Anchor on a unique neighbouring call, then walk to the target
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/rendergame-render-pass-transpiler
    - mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection
    technique: harmony-transpiler
    note: Find the single RenderDrawData call and walk back to the nearest BeginRenderPass; find the last EndRenderPass from
      the end; from Burn.Create walk back up to 160 instructions to the PrimaryButton call. Discuss the fragility of last-occurrence
      anchors and requiring each anchor exactly once.
  - n: 3
    title: Anchor on a UTF-8 label literal in the method
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/orbit-context-menu-shortcuts
    technique: harmony-transpiler
    note: Locate a menu or window section by the string literal the game draws, then insert before the final EndPopup. Useful
      when no distinctive call exists but the UI text does.
  - n: 4
    title: Match the instruction that consumes the result
    mod: compendium
    features:
    - mods/compendium/features/navball-target-marker-and-tgt-frame
    technique: harmony-transpiler
    note: 'A getter call is only the target when immediately followed by brtrue/brfalse or ldnull plus ceq/cgt.un; other uses
      of the same getter (passing it on) are left alone. [Absorbed topic make-game-null-checks-see-mod-state - Make the game''s
      null checks see mod-supplied state] Give the multi-method null-check rewrite its own section: TargetMethods over GaugeCanvas.IsContextVisible,
      GaugeButtonNavBallMode.IsDisabled and OnReleased, Vehicle.UpdateNavballData; match call get_Target followed by brtrue/brfalse
      or ldnull then ceq/cgt.un, replace with a static call returning vehicle.Target ?? mod value, throw unless exactly one
      test per method; pairs with a postfix on the private IsDisabled overload.'
