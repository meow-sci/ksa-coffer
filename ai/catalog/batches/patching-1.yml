  - current/decomp/KSA/NavigationTarget.cs Create and current/decomp/KSA/Vehicle.cs UpdateNavBallMarkers, UpdateNavballData
  - current/decomp/KSA/Program.cs RenderGame (BeginRenderPass call)
  - current/decomp/KSA/Vehicle.cs UpdateRenderData (IsLargeEnoughToRender), GetWorldMatrix (MeanRadius)
  - current/decomp/KSA/Vehicle.cs TeleportToLocation
