- slug: remove-your-patches-safely-at-runtime-and-at-exit
  title: Remove your Harmony patches safely, during play and at exit
  kind: howto
  group: safety
  batch: patching-1
  summary: 'UnpatchAll() with no id removes every mod''s patches; remove only yours by id or by patch method, from a main-thread
    hook, after nulling the delegates the patches call. Also the shutdown fact: StarMapCore.DeInit runs an id-less UnpatchAll
    before StarMapUnload methods, so unload code usually finds nothing to remove.'
  game_types:
  - HarmonyLib.Harmony
  - KSA.Program
  engine_pointers:
  - StarMap.Core/StarMapCore.cs DeInit (UnpatchAll before ModLoader.Dispose)
  - StarMap/GameSurveyer.cs Dispose and StarMap/Program.cs Main
  lifecycle:
  - event:starmap-unload
  - frame:after-on-frame
  - frame:draw-ui
  approaches:
  - n: 1
    title: UnpatchAll(ownId) from a main-thread hook after nulling delegates
    mod: ksagolf
    features:
    - mods/ksagolf/features/degrading-harmony-patches
    - mods/ksaero/features/patch-refusal-and-rollback
    technique: harmony-prefix
    note: Each class has its own id; Remove() nulls the handed-in delegate first, then UnpatchAll(HarmonyId). StarMapUnload
      unpatching is a no-op because StarMap's id-less UnpatchAll has already run; purrTTY and AFC reach the same conclusion.
  - n: 2
    title: Lazy install and removal of one patch while it is in use
    mod: gatos
    features:
    - mods/gatos/features/scale-and-force-render-cheats
    technique: dynamic-harmony-install
    note: 'Patch only while a vessel is marked; unpatch when the set empties; both happen on the main thread in the frame
      drain so no render code is mid-call. [Absorbed from patch-a-private-game-method-by-name approach 3] Also the install
      half: each cheat creates its own Harmony instance when the first object is marked; prefixes read a volatile immutable
      set so they are thread-agnostic.'
  - n: 3
    title: Unpatch by patch method on a shared Harmony instance
    mod: unscience
    features:
    - mods/unscience/features/sphinx-static-colliders
    - mods/unscience/features/unscience-consolidated-patcher
    technique: harmony-prefix
    note: SphinxPhysicsPatches.Remove walks Harmony.GetAllPatchedMethods and unpatches only methods declared on its own class,
      so it never strips other features' patches; contrast with CameraControllerOverridePatches.Remove which calls UnpatchAll(harmony.Id)
      and removes every feature on the shared instance.
