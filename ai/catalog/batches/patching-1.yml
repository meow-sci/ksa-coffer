  - redirect-game-xml-loading
  - register-custom-xml-asset-type
  - feed-uniform-buffers-to-a-shaderextensions-shader
  merged_from:
  - access-private-members-with-reflection
  - call-a-private-game-method-through-a-delegate
  - write-readonly-game-statics-with-unsafeaccessor
- slug: patch-a-private-game-method-by-name
  title: Patch a private or overloaded game method by name and read its private state
  kind: howto
  group: internals
  batch: patching-1
  summary: 'Private targets cannot be named with typeof and nameof. Ways to attach: a string in the HarmonyPatch attribute,
    a manual AccessTools lookup with a degrade path, explicit parameter arrays with MakeByRefType, attribute argument types
    that bind by assignability, and TargetMethods with __args. Then read private fields and arguments with Harmony''s injected
    parameters (___field, __instance, __N) instead of reflection, and know that a name that matches nothing makes Harmony
    throw at patch time. The __state and positional ref __N parameter forms are covered in the finalizer and skipping-prefix
    topics.'
  game_types:
  - KSA.Program
  - KSA.Universe
  - KSA.PhysicsStates
  - KSA.Astronomical
  - KSA.IViewport
  - KSA.IGameViewport
  - KSA.PhysicsBubble
  - KSA.KittenEva
  - KSA.ClutterCubeCellGrid
  - KSA.GroundClutterPlacementData
  - KSA.FlightComputer
  - KSA.InstancedStarTechnique
  - KSA.Camera
  engine_pointers:
  - current/decomp/KSA/Program.cs OnFrameEditor (private, called right after ImGui.NewFrame)
  - current/decomp/KSA/Program.cs OnFrameCelestials (private)
  - current/decomp/KSA/Program.cs DrawFps (private static)
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives (static plus two instance forwarders)
  - current/decomp/KSA/Astronomical.cs ShouldDrawLines overloads
  - current/decomp/KSA/IGameViewport.cs (extends IViewport)
  - current/decomp/KSA/PhysicsBubble.cs ApplyMmuAttitudeTarget, ResetMmuAttitudeTarget
  - current/decomp/KSA/GroundClutterPlacementData.cs PopulateLaunchPadExclusionZones (private, _celestial field)
  - current/decomp/KSA/FlightComputer.cs ComputeControl (ref readonly FlightComputerNavigation nav)
  - current/decomp/KSA/InstancedStarTechnique.cs constructor and AddInstance
  lifecycle:
  - startup:immediate-load
  - startup:all-mods-loaded
  - frame:viewports
  - frame:celestials
  - startup:starmap-before-main
  - physics:vehicle-solver
  approaches:
  - n: 1
    title: HarmonyPatch attribute with a string method name, applied by PatchAll
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/always-on-onframeeditor-hook
    technique: harmony-postfix
    note: '[HarmonyPatch("OnFrameEditor")] on a postfix whose parameter is named dtPlayer like the target''s so Harmony passes
      it through; installed from StarMapImmediateLoad; skipped on PrepareFrame Exit frames. Link to the lifecycle reference
      for the hidden-HUD rationale instead of repeating it.'
  - n: 2
    title: Manual AccessTools lookup with a degrade path when the method is gone
    mod: ksarmory
    features:
    - mods/ksarmory/features/dual-hook-simulation-step
    - mods/ksagolf/features/dual-hook-frame-stepping
    - mods/ksagolf/features/degrading-harmony-patches
    technique: harmony-prefix
    note: Look up OnFrameCelestials(double) by name, null means record Trouble and fall back to the other hook; the patch
      class stays installable even if the target is absent. [Absorbed sub-step from make-patch-bodies-fault-proof approach
      3] The degrade path records a Trouble string and logs the consequence (stepping after the render on no-UI frames) while
      the other hook keeps working.
  - n: 3
    title: Explicit parameter arrays with MakeByRefType
    mod: ksaero
    features:
    - mods/ksaero/features/computedrag-call-site-transpiler
    - mods/ksa-advancedflightcomputer/features/validated-reflection-handles
    technique: reflection
    note: ComputeDerivatives exists three times (static 10-parameter body and two instance forwarders); by-ref parameters
      in IL are all by-reference. An explicit list also stops a later overload with the same name from being picked.
  - n: 4
    title: Attribute argument types bind by assignability
    mod: compendium
    features:
    - mods/compendium/features/orbit-line-visibility-and-color
    technique: harmony-postfix
    note: 'HarmonyPatch lists (Astronomical, IGameViewport, Orbit) but build 5554 has ShouldDrawLines(Astronomical, IViewport,
      Orbit?); Type.GetMethod''s default binder accepts the assignable type, so it binds. Risk: a future overload accepting
      IGameViewport changes the binding, so list the exact parameter type.'
  - n: 5
    title: TargetMethods with per-name AccessTools lookups and __args
    mod: ohmystars
    features:
    - mods/ohmystars/features/attitude-mode-handoff-patches
    technique: harmony-target-methods
    note: Private static ApplyMmuAttitudeTarget and ResetMmuAttitudeTarget resolved in TargetMethods, state read from __args[0];
      string-named targets yield nothing if renamed and the attribute form throws at patch time.
  - n: 6
    title: Inject a private instance field as a triple-underscore parameter
    mod: ksastructures
    features:
    - mods/ksastructures/features/ground-clutter-exclusion-zones
    technique: harmony-postfix
    note: Postfix on a private method installed by name with AccessTools.Method takes the ref zones array plus Celestial ____celestial
      (the field is _celestial); missing method is logged once and clutter stays as the engine places it.
  - n: 7
    title: Prefer __instance and a property over a field injector that matches nothing
    mod: unscience
    features:
    - mods/unscience/features/camera-controller-override-camera-animations
    technique: harmony-prefix
    note: 'History: a prefix with Transform3D ___Transform matched no field, Harmony threw at patch time and aborted the supermod''s
      remaining patch chain; fixed by reading __instance.Camera. Lesson for per-feature TryApply.'
