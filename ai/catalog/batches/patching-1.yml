    title: Same-signature static replacement, operand-only edit
    mod: ksaero
    features:
    - mods/ksaero/features/computedrag-call-site-transpiler
    - mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection
    technique: harmony-transpiler
    note: Replacement mirrors the parameter list and return type including by-ref modifiers, so only instruction.operand changes.
      AFC applies the same move to Burn.Create inside the plan window, moving labels and exception blocks to the new instruction.
      Emphasise the signature-equality rule and that the replacement may call the original through a delegate.
  - n: 2
