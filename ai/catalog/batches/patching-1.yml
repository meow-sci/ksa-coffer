  batch: patching-1
  summary: Make a big game method call your code instead of one helper without copying the method. Covers same-signature replacement
    (stack untouched), wider signature with an extra ldarg.0, replacements that run work then call the original, gate helpers
    that skip a call, and replacements that adapt an argument or result.
  game_types:
