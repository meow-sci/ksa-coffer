    title: Static patch classes that look up the target, log once and stand down
    mod: ksagolf
    features:
    - mods/ksagolf/features/degrading-harmony-patches
    - mods/ksagolf/features/dual-hook-frame-stepping
    technique: harmony-postfix
    note: Six classes with their own id, Installed property, per-class consequence table (what a missing patch costs), delegates
      handed in from the mod. See also the compile-time pins topic. [Absorbed from make-patch-bodies-fault-proof approach
      1] try/catch in every patch body; a failure that would repeat each frame nulls the delegate the patch calls and logs
      once; worker-thread prefixes follow the same rule; Remove() nulls the delegate first so a stale patch cannot reach a
