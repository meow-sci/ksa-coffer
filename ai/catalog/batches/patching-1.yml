    technique: reflection
    note: '[UsedBy(Feature.A | Feature.B)] on each static readonly handle, Validate enumerates the class''s own fields, handles
      with no UsedBy fail every validation, soft anchors for optional patches, readable DisplayName in the warning, and a
      headless drift test that runs every validator and anchor probe. Also (merged from testing-and-tooling/upgrade-a-mod-to-a-new-ksa-build
      approach 4, "A validated reflection-handle class that lets each feature refuse to load"): Folded from degrade-one-feature-on-api-drift
      (sub-step: give it its own section (design for drift)). Borrowed from patching. One class resolves every private member,
      tagged by feature; a missing handle disables only the features that need it.'
