- slug: write-a-harmony-transpiler
  title: Write a Harmony transpiler for a game method
  kind: howto
  group: transpilers
  batch: patching-1
  summary: 'Start-to-finish recipe for changing the IL of a KSA method: read the real IL from KSA.dll, pick exact overloads,
    build the instruction list, mutate it, prove the match count, and know that Harmony rebuilds the method from original
    IL every time any mod patches it. Four common shapes (retarget a call, insert at an anchor, replace an instruction run
    with a helper, filter a read) each get a worked example. Also covers rewriting a decision the game makes inline (a compare-and-branch
    sequence or one getter read) rather than a call.'
  game_types:
  - KSA.PhysicsStates
  - KSA.TransferPlanner
  - KSA.CelestialSystem
  - KSA.PhysicsBubble
  - KSA.StructuralLoad
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives and ComputeDrag
  - current/decomp/KSA/TransferPlanner.cs DrawPlanWindow
  - current/decomp/KSA/CelestialSystem.cs GetNearbyAstronomical
  - current/decomp/KSA/PhysicsBubble.cs DetectStructuralFailure
  - current/dll/KSA.dll (read IL with ilspycmd; the shipped assembly is debug-compiled and contains nops)
  - current/decomp/KSA/PhysicsBubble.cs DetectStructuralFailure and current/decomp/KSA/StructuralLoad.cs GLoadFraction
  lifecycle:
  - startup:all-mods-loaded
  - startup:starmap-before-main
  - frame:celestials
  - physics:vehicle-solver
  approaches:
  - n: 1
    title: Retarget the operand of one call (same signature)
    mod: ksaero
    features:
    - mods/ksaero/features/computedrag-call-site-transpiler
    technique: harmony-transpiler
    note: Smallest useful transpiler. Resolve the target with an explicit parameter array, copy instructions to a list, test
      each with CodeInstruction.Calls, change only operand, count and throw unless exactly one. Establish the vocabulary (opcode,
      operand, labels, blocks, evaluation stack) the other approaches build on, and the Harmony caveat that transpilers re-run
      whenever another patch touches the method.
  - n: 2
    title: Insert a call before a validated anchor
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection
    technique: harmony-transpiler
    note: Pipeline of small passes over the same list, each returning the list unchanged and warning once when its anchor
      is missing; headless test that runs the transpiler over PatchProcessor.GetOriginalInstructions. Shows how to unit test
      IL rewrites.
  - n: 3
    title: Replace an instruction run with a helper that takes a local by reference
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/nearby-body-transpiler
    technique: harmony-transpiler
    note: 'Multi-instruction rewrite (sub, ldloc, clt becomes ldloca.s plus argument loads plus call) with the original store
      nopped. Emphasise reading local slots from the matched instructions, finding an argument slot by parameter name and
      type plus one for this, and returning the original IL when the shape check fails. [Absorbed topic rewrite-a-comparison-or-value-read-with-a-transpiler,
      comparison half] Give the compare-and-branch rewrite its own section: verify the exact IL sequence, read local slots
      from it, ldloca.s the best-so-far local, nop the redundant store, bail out returning original IL when labels or exception
      blocks fall inside the range, and record Patched so the log states the result.'
  - n: 4
    title: Filter one value read through a registry check
    mod: unscience
    features:
    - mods/unscience/features/kitchen-sink-g-load-protection
    technique: harmony-transpiler
    note: 'Scan for the typed property getter call and insert a filter call that returns a replacement value for registered
      vessels, in a private static method resolved by exact signature that runs on vehicle worker threads. [Absorbed topic
      rewrite-a-comparison-or-value-read-with-a-transpiler, getter-read half] Give the single-getter-read filter its own section:
      insert the filter after StructuralLoad.GLoadFraction so registered vessels read 0.0 while the structural-failure detector
      keeps its other checks; the filter is backed by a concurrent registry because DetectStructuralFailure runs on vehicle
      workers.'
  related:
