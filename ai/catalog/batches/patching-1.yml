- slug: coexist-with-other-mods-patching-the-same-method
  title: Coexist with other mods and share one patch between several features
  kind: howto
  group: harmony
  batch: patching-1
  summary: 'Harmony re-runs every registered transpiler against the original IL whenever any mod patches a method, so a later
    mod can see your result or remove its anchor. How mods cope: order prefixes and finalizers with Priority, design anchors
    that tolerate earlier transpilers, make shared installs idempotent so several features can ask for the same seam, and
    quieten once-only logs that re-fire on re-runs. Also the inward-facing side: install a seam once (post-solver tick, physics
    frame hook, command sink, hotkey guard, render filter) and let each feature subscribe, with enable flags set from each
    feature''s own patch result.'
  game_types:
  - KSA.Universe
  - KSA.Program
  - KSA.PhysicsStates
  - KSA.PartTreeRenderData
  - KSA.Vehicle
  - KSA.FlightComputer
  engine_pointers:
  - current/decomp/KSA/Universe.cs ExecuteNextVehicleSolvers
  - current/decomp/KSA/Program.cs RenderGame
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers
  - current/decomp/KSA/FlightComputer.cs ComputeControl
  - current/decomp/KSA/Program.cs PrepareFrame (GetJobSimStep)
  lifecycle:
  - startup:all-mods-loaded
  - frame:dispatch-solvers
  - frame:apply-solvers
  - physics:vehicle-solver
  - frame:prepare
  - frame:render
  approaches:
  - n: 1
    title: Priority.First prefixes and Priority.Last finalizers around shared seams
    mod: gatos
    features:
    - mods/gatos/features/solver-phase-command-drain
    - mods/ksastructures/features/terrain-height-roof-override
    technique: harmony-prefix
    note: Command drain prefix at Priority.First on ExecuteNextVehicleSolvers so writes land before other mods' prefixes snapshot;
      cleanup finalizer at Priority.Last.
  - n: 2
    title: Anchors that one mod can consume (and what the next transpiler then sees)
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/rendergame-render-pass-transpiler
    - mods/ksaero/features/computedrag-call-site-transpiler
    technique: harmony-transpiler
    note: After ShaderExtensions moves BeginRenderPass into ImGuiPreRender a second mod searching backwards from RenderDrawData
      finds nothing; a transpiler that rewrites the same call before KSAero leaves it zero matches. Choose anchors that survive
      earlier rewriting, and fail by name.
  - n: 3
    title: Idempotent shared installs with a registration API
    mod: unscience
    features:
    - mods/unscience/features/lib-part-render-filter
    - mods/unscience/features/unscience-consolidated-patcher
    - mods/unscience/features/lib-physics-frame-hook
    - mods/unscience/features/lib-hotkey-guard
    technique: harmony-prefix
    note: PhysicsFrameHook.Apply returns early when applied; the first PartRenderFilter.Register installs and later owners
      only add predicates, so features applying the same seam again are harmless. [Absorbed from share-one-patch-between-several-features
      approach 3] The same register-and-forward shape serves a PrepareFrame transpiler dispatching queued callbacks for several
      features, PartRenderFilter and HotkeyGuard.
  - n: 4
    title: One shared tick with per-feature enable flags set from TryApply results
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick
    - mods/ksa-advancedflightcomputer/features/feature-gated-patch-sets
    technique: harmony-postfix
    note: SharedVehicleHooks.*Enabled flags plus a prefix/postfix pair on ApplyVehicleSolvers that drives each feature's state
      machine once per frame.
  - n: 5
    title: One worker-side postfix merging every writer
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
    technique: harmony-postfix
    note: A single postfix on FlightComputer.ComputeControl runs all mod actuator writers in order and merges wake and off-rails
      requests into the stock output.
  related:
  - write-a-harmony-transpiler
  - identify-a-call-by-its-argument-il
  - mutate-vehicles-at-a-physics-safe-point
  - run-cleanup-or-recover-from-exceptions-with-a-finalizer
  - isolate-patch-failures-and-fault-proof-patch-bodies
  - drive-the-flight-computer-and-attitude-modes-from-a-mod
  - create-a-minimal-starmap-mod
  merged_from:
  - share-one-patch-between-several-features
- slug: patch-methods-that-run-on-background-threads
  title: Patch game methods that run on workers and the thread pool, and pass data to them
  kind: howto
  group: harmony
  batch: patching-1
  summary: 'Patch bodies run on whatever thread the game called the method from: vehicle workers per substep, Bepu fan-out
    threads, thread-pool tasks for planner searches and parallel shader compilation. State which thread each target uses,
    what the patch may touch there (no ImGui, no Vulkan, no main-thread-only collections), and how results reach the main
    thread. Includes the flight computer worker copy: the vehicle worker flies a copy taken in Vehicle.PrepareWorker, so worker-side
    tables must be keyed by objects the copy shares by reference (BurnPlan, VehicleConfigInfo) and settings written only between
    apply and snapshot.'
  game_types:
  - KSA.TransferPlanner
  - KSA.OrbitalTransfers
  - KSA.RefineBurnTask
  - KSA.PatchedConic
  - KSA.VehicleUpdateTask
  - KSA.PhysicsStates
  - KSA.FlightComputer
  - KSA.Vehicle
  - KSA.BurnPlan
  - KSA.VehicleConfigInfo
  - KSA.VehicleUpdateState
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/RefineBurnTask.cs TryFindIntercept
  - current/decomp/KSA/OrbitalTransfers.cs HohmannFlight, AlignmentTime
  - current/decomp/KSA/PatchedConic.cs FindClosestApproaches
  - current/decomp/KSA/VehicleUpdateTask.cs ApplyResultsToMainThread, RunIsland
  - current/decomp/KSA/Vehicle.cs PrepareWorker, PrepareFromVehicle
  - current/decomp/KSA/FlightComputer.cs CopyFrom, ComputeControl, UpdateAttitudeTarget
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers, ExecuteNextVehicleSolvers
  lifecycle:
  - thread:background
  - physics:vehicle-solver
  - startup:starmap-before-main
  - frame:apply-solvers
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Patches on planner tasks that run on pooled threads
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets
    technique: harmony-prefix
    note: Prefixes on HohmannFlight, AlignmentTime, TryFindIntercept and FindClosestApproaches run on background tasks; results
      are stored and the UI alert is raised only from the finalizer on the draw thread.
  - n: 2
    title: Preload in StarMapBeforeMain because shaders compile in parallel on pool threads
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/shader-file-redirect
    technique: harmony-prefix
    note: StarMapBeforeMain is the only hook before shader loading; the redirect patch runs on thread-pool threads, so it
      must be allocation-light, thread-safe, and the target assembly must be preloaded into the game's context.
  - n: 3
    title: Worker-side postfix merging commands from the main thread
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
    - mods/ksacars/features/keep-thrusting-craft-off-rails
    technique: harmony-postfix
    note: Wake and off-rails requests answered from a concurrent dictionary inside patches on vehicle worker threads (PhysicsBubble.KittenWantsWake,
      ComputeControl), written by main-thread code before dispatch.
  - n: 4
    title: ConditionalWeakTable keyed by objects the copy shares by reference
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-worker-copy-channels
    technique: conditional-weak-table
    note: Worker-side command tables keyed by the BurnPlan and VehicleConfigInfo the copy shares; flight-computer writes confined
      to the window between apply and snapshot; UI requests queued.
  - n: 5
    title: Look the state up through __instance.BurnPlan in a ComputeControl prefix
    mod: compendium
    features:
    - mods/compendium/features/flight-computer-root-attitude-tracking
    technique: harmony-prefix
    note: ApplyControlTarget finds the vehicle's side target by the BurnPlan object the solver copy shares with the live flight
      computer and injects it for exactly one call.
  related:
