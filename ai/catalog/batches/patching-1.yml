- slug: run-cleanup-or-recover-from-exceptions-with-a-finalizer
  title: Use a Harmony finalizer for cleanup, recovery and scoped overrides
  kind: howto
  group: harmony
  batch: patching-1
  summary: 'A postfix does not run when the original throws; a finalizer always does. Uses: restore state a prefix changed,
    even if the game call fails; finish a method that throws on data it was never meant to see (swallow the exception and
    replay the missing tail); put back an edited input struct using __state; and bracket load or save transactions so failures
    are reported. Also scoped overrides: make a patch on a shared method conditional on a context only the mod''s own call
    sets (ThreadStatic flag in try/finally, construction context, asker marker set by a prefix and cleared by a finalizer).'
  game_types:
  - KSA.ConstraintSim
  - KSA.PartTreeRenderData
  - KSA.TransferPlanner
  - KSA.FlightComputer
  - KSA.UncompressedSave
  - KSA.Universe
  - KSA.VolumetricExhaustRenderer
  - KSA.Vehicle
  - KSA.Celestial
  - KSA.ClutterCubeCellGrid
  engine_pointers:
  - current/decomp/KSA/ConstraintSim.cs DetectCollisions and Simulate
  - current/decomp/KSA/PartTreeRenderData.cs Compose
  - current/decomp/KSA/TransferPlanner.cs SetTransferInfo (subtracts a NaN Period from a UniverseTime and throws)
  - current/decomp/KSA/FlightComputer.cs ComputeControl
  - current/decomp/KSA/UncompressedSave.cs Load
  - current/decomp/KSA/VolumetricExhaustRenderer.cs AddInstance(ExhaustInstance, int)
  - current/decomp/KSA/Vehicle.cs PrepareWorker, TeleportToLocation
  - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCce
  lifecycle:
  - physics:bepu
  - frame:render
  - frame:draw-ui
  - physics:vehicle-solver
  - event:save
  - frame:pre-render
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Restore what a prefix changed around one game call
    mod: unscience
    features:
    - mods/unscience/features/garrys-torch-scoped-collision-suppression
    - mods/unscience/features/lib-iva-force-render
    technique: harmony-finalizer
    note: Prefix sets collidable shapes to default for the duration of DetectCollisions or Simulate and passes the (handle,
      shape) list as __state; the finalizer restores the exact shape through Bodies.SetShape, logging but not throwing. Same
      shape for the editor-only IVA reveal around PartTreeRenderData.Compose. A void finalizer does not swallow the original
      exception.
  - n: 2
    title: Swallow an exception and finish the method's remaining work
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets
    technique: harmony-finalizer
    note: 'static Exception Finalizer(Exception __exception) for SetTransferInfo with a NaN Period: stock already stored the
      new TransferInfo, the finalizer replays only the lines after the throw (window, selection, alerts) and returns null
      to swallow. Explains why a postfix would never run.'
  - n: 3
    title: Prefix with __state and a finalizer that restores an edited input
    mod: compendium
    features:
    - mods/compendium/features/flight-computer-root-attitude-tracking
    technique: harmony-finalizer
    note: 'Inject the side target into the by-ref navigation struct for exactly one ComputeControl call on the solver worker
      and put it back afterwards, keyed by the shared BurnPlan object. [Absorbed from patch-private-method-with-field-injection
      approach 3] Also the general __state rule: out/ref __state carries data from prefix to postfix or finalizer, here recording
      whether the prefix injected so the finalizer puts the struct back.'
  - n: 4
    title: Prefix, postfix and finalizer as a transaction around loads
    mod: unscience
    features:
    - mods/unscience/features/lib-native-save-hooks
    technique: harmony-finalizer
    note: UncompressedSave.Load gets a prefix (defer, open a transaction) and a finalizer (close it, turning a silent native
      read failure into an exception); Universe.DeserializeSave and LoadSystem likewise. World replacements are deferred to
      the PrepareFrame handoff.
  - n: 5
    title: ThreadStatic override set in try/finally around the mod's own submission
    mod: unscience
    features:
    - mods/unscience/features/pyro-scoped-exhaust-look-override
    technique: harmony-prefix
    note: Prefix on VolumetricExhaustRenderer.AddInstance applies per-plume absorption and refraction only while the ThreadStatic
      override is set inside Pyro's own call, so stock engines and shared templates never see it.
  - n: 6
    title: Thread-static construction context scoping a transpiler and a prefix
    mod: unscience
    features:
    - mods/unscience/features/pebbles-private-clutter-materials
    technique: harmony-transpiler
    note: Redirects ground clutter material buffer lookups to a private per-body buffer and swaps a fragment variant, only
      while an owned-construction context is active on the current thread.
  - n: 7
    title: Mark the asker in a Priority.First prefix, clear it in a Priority.Last finalizer
    mod: ksastructures
    features:
    - mods/ksastructures/features/terrain-height-roof-override
    technique: harmony-finalizer
    note: '[ThreadStatic] Vehicle _stepping set around Vehicle.PrepareWorker so a postfix on the terrain height getter answers
      roof height for the vehicle being prepared and ground height for the camera; the same pairing lends height across TeleportToLocation.'
  related:
