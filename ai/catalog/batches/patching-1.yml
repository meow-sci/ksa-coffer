- slug: refuse-a-patch-and-roll-back-when-the-game-changes
  title: Make a patch refuse and roll back when the game method has changed
  kind: howto
  group: safety
  batch: patching-1
  summary: 'Treat a changed game method as a normal outcome: validate lookups, throw from the transpiler unless the shape
    is exactly what was expected, catch around Patch, remove only your own patches by Harmony id, log once, and publish the
    instance or feature flag only on success so dependent UI and code stay honest. Also covers dependent-feature gates and
    what a thrown anchor check does when it runs in StarMapBeforeMain.'
  game_types:
  - KSA.PhysicsStates
  - KSA.TransferPlanner
  - KSA.Program
  - HarmonyLib.Harmony
  engine_pointers:
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives
  - StarMap.Core/StarMapCore.cs DeInit (id-less UnpatchAll before StarMapUnload)
  - StarMap.Core/ModRepository/RuntimeMod.cs (StarMapBeforeMain invoked without try/catch)
  lifecycle:
  - startup:all-mods-loaded
  - startup:starmap-before-main
  - event:starmap-unload
  approaches:
  - n: 1
    title: Throw on a bad match, UnpatchAll(own id), publish the instance on success
    mod: ksaero
    features:
    - mods/ksaero/features/patch-refusal-and-rollback
    - mods/ksaero/features/computedrag-call-site-transpiler
    technique: harmony-transpiler
    note: 'Layers: member lookup throws MissingMemberException, transpiler throws unless exactly one call matched, entry catches
      and unpatches by id, _harmony stays null so the readout window never shows. Warn that UnpatchAll() without an id removes
      every mod''s patches.'
  - n: 2
    title: One Harmony owner per feature with TryApply, validated handles and runtime flags
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/feature-gated-patch-sets
    technique: harmony-prefix
    note: 'FeaturePatchSet creates a Harmony per feature, rolls back by id on exception, dependent features gate on booleans,
      and the enable flags read by shared hooks come from the TryApply result so a still-installed shared hook never drives
      a failed feature. Also (merged from getting-started/apply-harmony-patches-independently approach 2, "One Harmony instance
      per feature, rolled back on failure"): Borrowed from patching. Validated before patching, rolled back on failure, features
      gated on patch success.'
  - n: 3
    title: Let an anchor failure stop the launch (and why that can be right)
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/rendergame-render-pass-transpiler
    technique: harmony-transpiler
    note: ThrowIfInvalid inside PatchAll in StarMapBeforeMain aborts startup because StarMap does not catch; the mod chooses
      this over running half-patched since pre- and post-ImGui passes depend on the transpiler. Compare with approaches 1
      and 2 and state that a shifted local index is not detected at all.
  related:
  - isolate-patch-failures-and-fault-proof-patch-bodies
  - validate-patch-targets-and-detect-game-update-breakage
  - remove-your-patches-safely-at-runtime-and-at-exit
  - check-the-game-version
  - game-loop-and-lifecycle
- slug: isolate-patch-failures-and-fault-proof-patch-bodies
  title: Isolate patch failures and keep patch bodies from throwing
  kind: howto
  group: safety
  batch: patching-1
  summary: 'Harmony PatchAll stops at the first failure and a prefix that throws every frame breaks the method it decorates.
    Structures mods use to localise damage (CreateClassProcessor per patch class, one consolidated patcher with TryApply,
    static patch classes that look up their own target and stand down, reflection-only builds with pre-checks) and patterns
    for the patch bodies themselves: catch everything, log once per failure kind, null the delegate, degrade with a recorded
    reason, and remove all patches after a fault limit. Also covers applying Harmony patches per class or per feature so one
    broken target costs one feature rather than the whole mod.'
  game_types:
  - KSA.Program
  - KSA.GameSettings
  - HarmonyLib.Harmony
  - KSA.Universe
  - KSA.SuperMeshRenderSystem
  engine_pointers:
  - current/decomp/KSA/Program.cs OnKey, DispatchKeyEvent, DrawProgramMenusHook
  - StarMap.Core/StarMapCore.cs Init and DeInit
  - current/decomp/KSA/Program.cs OnFrameCelestials (private)
  - current/decomp/KSA/Universe.cs GetLastSimStep, ExecuteNextVehicleSolvers
  - HarmonyLib Harmony.CreateClassProcessor
  - PatchClassProcessor
  lifecycle:
  - startup:all-mods-loaded
  - event:starmap-unload
  - frame:draw-ui
  - frame:celestials
  - frame:after-on-frame
  approaches:
  - n: 1
    title: CreateClassProcessor per patch class, required versus optional
    mod: purrtty
    features:
    - mods/purrtty/features/failure-isolated-harmony-patching
    - mods/ksa-measuretools/features/resilient-patching-and-diagnostics
    technique: harmony-prefix
    note: 'Separate classes per target so a drift in the private DispatchKeyEvent disables only that gate; log messages state
      the consequence for the player; lazily recreated Harmony instance and static resets on unload (defensive, StarMap never
      reloads in-process). [Absorbed from make-patch-bodies-fault-proof approach 4] Also exception-type-keyed once-only logging
      in every hook: log the first occurrence of each exception type and count the rest; DEBUG stopwatch scopes reported on
      an interval. Also (merged from getting-started/apply-harmony-patches-independently approach 1, "CreateClassProcessor
      per patch class inside try/catch" [ksa-measuretools]): Typed reflection handles with a load-time drift warning.'
  - n: 2
    title: Consolidated patcher with TryApply and ordered shared seams
    mod: unscience
    features:
    - mods/unscience/features/unscience-consolidated-patcher
    - mods/unscience/features/lib-isubmod-contract
    technique: harmony-prefix
    note: 'One Harmony id for thirty-odd features, each lib''s Apply wrapped in TryApply/TryRemove, order only where seams
      are shared, idempotent shared helpers, and unpatching by patch method on the shared instance rather than by id. Also
      (merged from getting-started/apply-harmony-patches-independently approach 4, "Static Apply/Remove patch classes"): Symmetric
      Apply and Remove make a feature cleanly removable and hostable by a supermod.'
