    technique: harmony-transpiler
    note: Exactly-one rewrites of a Draw call (skip while a flag is set) and of IsLargeEnoughToRender and MeanRadius reads
      in Vehicle.UpdateRenderData and GetWorldMatrix. Show why a getter patch would be wrong (shared by other callers) and
      the guarded count check.
  - n: 5
    title: Adapter that fixes up arguments and converts the result back
    mod: unscience
    features:
    - mods/unscience/features/iron-man-surface-teleport-correction
    technique: harmony-transpiler
    note: One GetInitialKinematicStateForLocation call in Vehicle.TeleportToLocation becomes an adapter that substitutes head-up
      proxy bounds for active Iron Man kittens and converts attitude and rates back. Pattern for any call whose inputs or
      outputs need translation.
