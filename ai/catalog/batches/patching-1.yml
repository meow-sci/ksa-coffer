  title: Read, write and call private game members with reflection, ref accessors and delegates
  kind: howto
  group: internals
  batch: patching-1
  summary: 'Reach KSA internals that have no API: private static fields, internal static registries, a private nested enum,
    instance fields of generic collections, private helper methods and get-only statics. Bind a typed ref accessor or a method
    delegate once instead of reflecting per call, replay the writes stock performs in the order it does them, overwrite a
    compiler-generated backing field with UnsafeAccessor, and fail gracefully when a member is missing or has changed type.'
  game_types:
  - KSA.TransferPlanner
  - KSA.ModLibrary
  - KSA.SerializedCollection
  - KSA.GameSettings
  - KSA.Vehicle
  - KSA.PhysicsStates
  - KSA.VehicleEditor
  - KSA.GameSaves
  - KSA.VehicleSaves
  - KSA.XmlHelper
  engine_pointers:
  - current/decomp/KSA/TransferPlanner.cs _sourceBody, _transferType, _transferCalculated, cts, SetTransferInfo
  - current/decomp/KSA/ModLibrary.cs AllParts and the other registries
  - current/decomp/KSA/SerializedCollection.cs _collection
  - current/decomp/KSA/GameSettings.cs _openTab and the private SettingsTab enum
  - current/decomp/KSA/PhysicsStates.cs ComputeDrag
  - current/decomp/KSA/VehicleEditor.cs QuantizeScale, ForEachPartWithSymmetry, UpdateSelectedScale
  - current/decomp/KSA/GameSaves.cs UniverseSerializer (get-only static)
  - current/decomp/KSA/VehicleSaves.cs VehicleSerializer (get-only static)
  - current/decomp/KSA/XmlHelper.cs Serializers, AttributeOverrides
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - physics:vehicle-solver
  - editor:frame
  - startup:starmap-before-main
  - startup:immediate-load
  approaches:
  - n: 1
    title: AccessTools static field refs bound once, replay stock's writes
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/stock-transfer-planner-bridge
    technique: accesstools-fieldref
    note: Bind<T>(name) requires static and exact type, returns a ref T getter with no per-call reflection, collects missing
      keys into a list declared before the bindings, then performs the same writes and side effects as one stock frame of
      combo changes. No Harmony patch at all.
  - n: 2
    title: Plain GetField on internal registries and a generic holder for instance fields
    mod: unscience
    features:
    - mods/unscience/features/parts-now-reflection-self-test
    - mods/unscience/features/parts-now-runtime-unload-purge
    technique: reflection
    note: typeof(ModLibrary).GetField(name, Static|NonPublic|Public).GetValue(null) as SerializedCollection<T>, plus a per-T
      holder that probes the private _collection dictionary once to unregister entries.
  - n: 3
    title: Typed FieldRefAccess, boxed private enum members and by-ref lookups
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/validated-reflection-handles
    technique: accesstools-fieldref
    note: StaticFieldRefAccess versus FieldRefAccess<T,F> (T must be a reference type), a private nested enum compared as
      a boxed value resolved once from the field's FieldType, and MakeByRefType in parameter lists.
  - n: 4
    title: AccessTools.MethodDelegate with a delegate type that mirrors in and ref modifiers
    mod: ksaero
    features:
    - mods/ksaero/features/stock-drag-delegate-fallback
    technique: method-delegate
    note: Declare ComputeDragFn with four in structs and a ref Disturbances, resolve with an explicit parameter array, bind
      in Apply before the transpiler is installed, invoke from worker threads as an immutable delegate. Because only a call
      site is rewritten the delegate runs the unmodified stock body.
  - n: 5
    title: Delegates over private editor helpers reused in a replacement drag
    mod: unscience
    features:
    - mods/unscience/features/dont-stifle-me-editor-free-scaling
    technique: method-delegate
    note: Per-axis drag replaces UpdateSelectedScale but reuses the game's private QuantizeScale and ForEachPartWithSymmetry
      through delegates; shows binding instance methods to delegates and the null-check on bind.
  - n: 6
    title: UnsafeAccessor StaticField on the k__BackingField with UnsafeAccessorType
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/custom-xml-asset-types
    technique: unsafe-accessor
    note: 'extern static ref XmlSerializer UniverseSerializer([UnsafeAccessorType("KSA.GameSaves, KSA")] object instance =
      null) with Name = "<UniverseSerializer>k__BackingField"; assignment through the ref return after rebuilding all cached
      serializers with the merged attribute overrides. [Absorbed topic write-readonly-game-statics-with-unsafeaccessor - Overwrite
      a get-only static in the game with UnsafeAccessor] Give this a section: get-only static auto-properties assigned in
      static constructors cannot be set with FieldInfo.SetValue cleanly.'
  - n: 7
    title: Copied injector in a consumer mod with the same accessor
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/xml-asset-types-and-element-injection
    technique: unsafe-accessor
    note: A consumer that cannot reference KittenExtensions copies the injector; it appends child element types to existing
      XML list members via XmlHelper.AttributeOverrides (keyed by declaring type), rebuilds serializers, and swaps the save
      serializers the same way.
  related:
  - validate-patch-targets-and-detect-game-update-breakage
