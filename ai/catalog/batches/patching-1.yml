    technique: reflection
    note: GameRegistry is the only file that calls GetField; each lookup in its own try/catch appends a readable sentence;
      accessors throw InvalidOperationException naming the member; SelfTest at AllModsLoaded and a red banner with disabled
      Load buttons when unhealthy.
  - n: 3
