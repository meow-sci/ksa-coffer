- slug: patch-around-aggressive-inlining
  title: Change behaviour of a game method marked AggressiveInlining
  kind: howto
  group: internals
  batch: patching-1
  summary: 'A Harmony detour only changes a method''s own entry point, so callers that inlined the body never reach a prefix
    or postfix. Four ways out that mods use: rewrite the caller''s call site, patch the non-inlined entry points that reach
    the target, patch the one outer method that always runs, or bracket the enclosing non-inlined methods. Includes how to
    find which of a method''s callees are marked and how to detect a silent no-op.'
  game_types:
  - KSA.PhysicsStates
  - KSA.FlightComputer
  - KSA.Vehicle
  - KSA.ConstraintSim
  - KSA.Universe
  - KSA.VehicleUpdateTask
  engine_pointers:
  - current/decomp/KSA/PhysicsStates.cs ComputeDrag (private static, AggressiveInlining)
  - current/decomp/KSA/FlightComputer.cs SetNullRot, SetInertialNullRot, LoadBurn, UpdateBurn, UnloadBurn
  - current/decomp/KSA/Vehicle.cs UpdateFromTaskResultsSynchronized
  - current/decomp/KSA/ConstraintSim.cs DetectCollisions, Simulate and the NarrowPhaseCallbacks struct
  lifecycle:
  - startup:all-mods-loaded
  - physics:vehicle-solver
  - frame:apply-solvers
  - physics:bepu
  approaches:
  - n: 1
    title: Rewrite the one caller's call site instead of the callee
    mod: ksaero
    features:
    - mods/ksaero/features/computedrag-call-site-transpiler
    technique: harmony-transpiler
    note: ComputeDerivatives gets a transpiler that retargets the atmospheric ComputeDrag call; works whether or not the JIT
      inlined. Note that KSA.dll is debug-compiled in this build so inlining behaviour is not verified at run time and the
      rewrite is correct either way.
  - n: 2
    title: Patch the non-inlined entry points that reach the target too
    mod: ohmystars
    features:
    - mods/ohmystars/features/attitude-mode-handoff-patches
    technique: harmony-prefix
    note: TrackTarget, RateHold and SetNullRot are AggressiveInlining so prefixes may be bypassed; SetEnum, ToggleEnum, SetStabilization
      and HandleKittenAction are patched as well to cover the usual UI paths. List which paths remain exposed and how to confirm
      with a behavioural test.
  - n: 3
    title: Postfix the single non-inlined outer method instead of a per-vehicle callee
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick
    - mods/ksa-advancedflightcomputer/features/validated-reflection-handles
    technique: harmony-postfix
    note: Universe.ApplyVehicleSolvers is static, runs once on the main thread after the pooled per-bubble work; Vehicle.UpdateFromTaskResultsSynchronized
      is AggressiveInlining so a callee detour could not be relied on. Also AFC's note that a private method later marked
      AggressiveInlining still resolves by reflection but its patch goes silent.
  - n: 4
    title: Bracket the non-inlined methods that enclose an inlined struct callback
    mod: unscience
    features:
    - mods/unscience/features/garrys-torch-scoped-collision-suppression
    - mods/unscience/features/sphinx-static-colliders
    technique: harmony-finalizer
    note: Bepu's NarrowPhaseCallbacks.AllowContactGeneration is AggressiveInlining on a value-type generic parameter; suppression
      is done by prefix and finalizer around ConstraintSim.DetectCollisions and Simulate. Sphinx keeps live acceptance open
      and relies on a one-call transpiler tripwire.
