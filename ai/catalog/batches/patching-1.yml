    technique: harmony-transpiler
    note: BeginRenderPass is a generic static extension; the swap keeps ldloc.1, ldloca.s, ldloc.3 on the stack, the new method
      records mod passes then issues the original BeginRenderPass itself. Explains why this cannot be a prefix (no method
      boundary exists at that point).
  - n: 4
