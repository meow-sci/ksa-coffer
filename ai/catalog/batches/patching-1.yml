batch: patching-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: patching
category_description: Generic Harmony technique for KSA mods - skipping prefixes, finalizers and scoped overrides, coexisting
  with other mods, worker-thread patches, writing and anchoring transpilers, swapping single calls, reaching private members
  and patching around AggressiveInlining, and fault-contained, refusing, validated and removable patch sets.
groups:
  harmony: 'Everyday Harmony technique against KSA: skipping prefixes, finalizers, sharing a method with other mods and patching
    code that runs off the main thread.'
  safety: 'Keeping patches survivable across game updates and other mods: refusing and rolling back, isolating failures, validating
    targets and removing patches cleanly.'
  transpilers: 'Changing a game method''s IL: the transpiler recipe, swapping one call, finding the right call among several
    and inserting at an anchor.'
  internals: 'Reaching what the game does not expose: private members through reflection and delegates, private or overloaded
    patch targets, and methods the JIT inlines.'
topics:
- slug: skip-the-original-method-with-a-prefix
  title: Replace, veto or consume with a skipping Harmony prefix
  kind: howto
  group: harmony
  batch: patching-1
  summary: 'Return false from a prefix to skip the original: write __result and return, veto an action for selected objects,
    rewrite by-ref arguments, guard a call that would throw, or take keyboard and mouse input away from the game while a mod
    tool owns it. A skipped original also skips its finally block, so consumed presses and releases must be paired and private
    latches repaired. Includes how to keep a replacement faithful to the original body, how skipping interacts with other
    mods'' patches, and when a postfix that edits __result is the safer choice.'
  game_types:
  - KSA.Vehicle
  - KSA.InstancedStarTechnique
  - KSA.Camera
  - KSA.GameSettings
  - KSA.Program
  - KSA.Input
  - KSA.BurnContextMenu
  - KSA.MapController
  - KSA.VehicleEditor
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs UpdateRenderData, GetWorldMatrix, IsLargeEnoughToRender
  - current/decomp/KSA/InstancedStarTechnique.cs AddInstance ("Instance buffer full")
  - current/decomp/KSA/Camera.cs UpdateProjection and _fovRadians
  - current/decomp/KSA/Program.cs OnMouseButton (_heldMouseButtons, _inputViewport latches)
  - current/decomp/KSA/Program.cs OnKey and private DispatchKeyEvent
  - current/decomp/KSA/GameSettings.cs OnKeyAll
  - current/decomp/KSA/BurnContextMenu.cs _rightClickValid
  lifecycle:
  - frame:render
  - startup:starmap-before-main
  - frame:viewports
  - frame:input
  - frame:draw-ui
  approaches:
  - n: 1
    title: Reproduce the original body for marked objects and return false
    mod: gatos
    features:
    - mods/gatos/features/scale-and-force-render-cheats
    technique: harmony-prefix
    note: Prefixes on GetWorldMatrix and UpdateRenderData reproduce the stock body minus the sub-pixel size test for marked
      vessels and let everyone else fall through to the original.
  - n: 2
    title: Rewrite by-ref arguments and skip when a limit would throw
    mod: ohmystars
    features:
    - mods/ohmystars/features/star-instance-restyle-patch
    technique: harmony-prefix
    note: 'ref byte scale and ref byte4 color are transformed per star; when the instance array is full the prefix returns
      false instead of letting the original throw; counters bumped with Interlocked. [Absorbed topic patch-private-method-with-field-injection
      approach 4] Also the positional __N form: a manual patch of the InstancedStarTechnique constructor found by its fifth
      int parameter, with prefix ref int __4 replacing the capacity.'
  - n: 3
    title: Re-inject a private field before a rebuild so nothing can change it back
    mod: unscience
    features:
    - mods/unscience/features/glass-fov-override
    technique: harmony-prefix
    note: A prefix on Camera.UpdateProjection writes the override into the private _fovRadians before any rebuild of the main
      camera's projection, covering window resize, settings apply and the stock FOV keys.
  - n: 4
    title: Mouse prefix that pairs presses with releases and repairs private latches
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/click-capture-mouse-prefix
    technique: harmony-prefix
    note: Order of gates mirrors the stock handler (pairing first, popups, ImGui WantCaptureMouse, Input.MouseBound plus Input.Contains
      over EnumCollections.InputActions, editor drags), right-release repair via cached AccessTools handles, and the rule
      to decline consumption when a latch field is missing or changed type.
  - n: 5
    title: Keyboard and mouse-binding gates with a held-key model
    mod: purrtty
    features:
    - mods/purrtty/features/gate-game-input-while-terminal-focused
    technique: harmony-prefix
    note: Prefixes on Program.OnKey, GameSettings.OnKeyAll and private DispatchKeyEvent (mouse events) stop hotkeys while
      a mod UI has focus, tracking pressed keys and swallowed buttons so releases are never stranded or leaked.
