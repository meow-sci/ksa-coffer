- slug: evolve-a-shipped-part-without-breaking-saves
  title: Change a shipped part without breaking saves
  kind: howto
  group: parts
  batch: vehicles-and-parts-1
  summary: Subparts are paired by position when a save loads, so removing or reordering them crashes old saves. Follow append-only
    subpart lists and fixed part Ids, and repair saves at startup when a mistake already shipped. Also covers scanning the
    player's saves and craft library at StarMapAllModsLoaded and rewriting only the offending lines, with a backup and an
    offline twin for authors.
  game_types:
  - KSA.PartTree
  - KSA.PartTemplate
  - KSA.VehicleSave
  - KSA.PartInstance
  - KSA.VehicleSaveData
  - KSA.VehicleSaves
  - KSA.GameSaves
  - KSA.SaveDirectory
