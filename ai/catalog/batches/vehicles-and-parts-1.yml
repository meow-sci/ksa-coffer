batch: vehicles-and-parts-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: vehicles-and-parts
category_description: Defining parts and whole craft, spawning and controlling vehicles at runtime, reading and driving part
  modules (engines, tanks, staging, RCS, parachutes), subpart animation, scaling, crash survival, part geometry and anchors,
  and loading part mods into a running game.
groups:
  vehicles: 'Whole vehicles at runtime: spawning, safe creation and mutation, taking control, crash survival and scaling.'
  parts: 'Defining parts and craft in XML and code: game data, ready-made craft, seats and doors, subparts, safe evolution
    of shipped parts and runtime part-mod loading.'
  modules-and-resources: 'Part modules and resources: reading live module state, refilling and draining, commanding engines
    and RCS, adding parts in flight and parachutes.'
  staging-and-engines: 'Stages and engine performance: staged delta-v, thrust at ambient pressure, staging from code and automatic
    staging.'
topics:
- slug: spawn-a-vehicle-at-runtime
  title: Spawn a vehicle from code (from the vehicle library or a hand-built part)
  kind: howto
  group: vehicles
  batch: vehicles-and-parts-1
  summary: Create a Vehicle at runtime from a craft save or from a single hand-built part, register it with its celestial
    parent, and place it on the ground or in orbit. Also covers loading a craft from the stock or player vehicle library.
    Spawning an EVA kitten lives in spawn-an-eva-kitten-from-code.
  game_types:
  - KSA.Vehicle
  - KSA.Part
  - KSA.PartTree
  - KSA.VehicleSave
  - KSA.KittenEva
  - KSA.Orbit
  - KSA.CelestialSystem
  - KSA.VehicleSaves
  - KSA.DefaultVehicleSaves
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs CreateVehicle, TeleportToLocation
  - current/decomp/KSA/VehicleSave.cs Load
  - current/decomp/KSA/KittenEva.cs constructor
  - current/decomp/KSA/Orbit.cs CreateFromStateCci
  - current/decomp/KSA/VehicleSaves.cs Refresh, AsSpan
  - current/decomp/KSA/DefaultVehicleSaves.cs FindSave
  lifecycle:
  - frame:after-on-frame
  - frame:input
  - frame:draw-ui
  approaches:
  - n: 1
    title: Parked copy of a library craft at a latitude and longitude
    mod: ksacars
    features:
    - mods/ksacars/features/spawn-parked-craft
    technique: starmap-lifecycle
    note: VehicleSave.Load, CreateVehicle, parent.Children.Add, UpdatePerFrameData, then TeleportToLocation. (also load-a-craft-from-the-vehicle-library)
      Handles missing saves and library refresh timing.
  - n: 2
    title: Test drones into orbit from a state vector
    mod: ksarmory
    features:
    - mods/ksarmory/features/spawn-and-teleport-test-craft
    technique: vehicle-spawn
    note: Orbit.CreateFromStateCci after an Ecl-to-CCI rotation, KittenEva variant, ShapesRegistry lock.
  - n: 3
    title: A one-part vehicle built in code
    mod: ksastructures
    features:
    - mods/ksastructures/features/office-furniture-craft
    technique: xml-asset
    note: new Part, CreateOwnTree, Vehicle.CreateVehicle, TeleportToLocation; no craft file needed.
  related:
  - change-vehicles-without-racing-the-solver
  - teleport-a-vessel-by-building-a-new-orbit
  - keep-mod-vehicles-out-of-saves
  - ship-ready-made-craft
  - spawn-an-eva-kitten-from-code
