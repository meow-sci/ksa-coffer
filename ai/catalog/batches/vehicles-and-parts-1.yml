  - current/decomp/KSA/PartTree.cs Deserialize (SubPartRefs paired by index)
  - current/decomp/KSA/GameSaves.cs SaveFolderPath
  - current/decomp/KSA/VehicleSaves.cs SaveFolderPath
  lifecycle:
  - startup:all-mods-loaded
  - startup:asset-load
  approaches:
  - n: 1
    title: Append-only subpart lists and fixed part Ids
    mod: ksarmory
    features:
    - mods/ksarmory/features/weapon-part-definitions-xml
    technique: xml-asset
    note: The authoring rule; derived from PartTree.Deserialize.
  - n: 2
    title: Rewrite saves and library craft at AllModsLoaded
    mod: ksarmory
    features:
    - mods/ksarmory/features/startup-save-repair
    technique: regex-xml-surgery
