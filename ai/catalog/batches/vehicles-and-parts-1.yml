- slug: make-a-vehicle-indestructible
  title: Make a vehicle survive crashes and g-loads, or damage parts against crash tolerance
  kind: howto
  group: vehicles
  batch: vehicles-and-parts-1
  summary: 'KSA destroys vehicles through two paths, a crash-tolerance comparison and a structural failure detector. Veto
    one with a prefix and neutralise the other with CrashTolerance, per craft rather than per template. Also covers: Damage
    and dent individual parts against their crash tolerance. Also covers filtering only the g-load read for chosen vessels
    and keeping the per-vessel setting across saves by stable identity.'
  game_types:
  - KSA.Part
  - KSA.PhysicsBubble
  - KSA.PartFailureEvent
  - KSA.FxDeformation
  - KSA.PartStructuralLimits
  - KSA.Universe
  - KSA.StructuralLoad
  - KSA.Vehicle
  - KSA.GameSave
  engine_pointers:
  - current/decomp/KSA/Part.cs CrashTolerancePascals
  - current/decomp/KSA/PhysicsBubble.cs DetectStructuralFailure
  - current/decomp/KSA/FxDeformation.cs ReportContact
  - current/decomp/KSA/PartStructuralLimits.cs
  - current/decomp/KSA/PartContactLoad.cs
  - current/decomp/KSA/Universe.cs DestroyVehicleFromEvent
  lifecycle:
  - physics:vehicle-solver
  - frame:apply-solvers
  - event:vehicle-destroyed
  - frame:after-on-frame
  - physics:bepu
  - event:save
  - event:load
  - frame:draw-ui
  approaches:
  - n: 1
    title: XML CrashTolerance plus a crash-veto prefix for one kind of craft
    mod: ksacars
    features:
    - mods/ksacars/features/crash-veto
    technique: harmony-prefix
    note: 'Pascals; NaN or <= 0 derives from mass over collider volume, clamped 0.1..100 MPa. Also (merged from physics/make-a-vessel-indestructible
      approach 2, "Veto Universe.DestroyVehicleFromEvent and set part crash tolerance"): Two destruction paths: veto the main-thread
      event and raise CrashTolerance for the other. Pascals; non-positive derived from mass over collider volume, clamped
      to 0.1..100 MPa.'
  - n: 2
    title: Per-vessel registration with a getter prefix and detector pair
    mod: unscience
    features:
    - mods/unscience/features/the-tick-vessel-indestructibility
    technique: harmony-prefix
    note: 'Prefix Part.CrashTolerancePascals; prefix and postfix on DetectStructuralFailure discard only the event just created;
      no template mutation. Also (merged from physics/make-a-vessel-indestructible approach 1, "Prefixes on CrashTolerancePascals
      and DetectStructuralFailure"): Per-instance override in a worker-safe registry; prefix and postfix pair on the detector.'
  - n: 3
    title: Filter only the g-load read with a guarded transpiler
    mod: unscience
    features:
    - mods/unscience/features/kitchen-sink-g-load-protection
    technique: harmony-transpiler
    note: 'Folded from physics/make-a-vessel-indestructible approach 3: Insert a static filter after the single StructuralLoad.GLoadFraction
      getter; require exactly one match. Sub-step (give it a section on persisting the setting by vessel identity): Sidecar
      keyed on vessel identity. Rebind references after load without ambiguity.'
  - n: 4
    title: Blast damage against engine-derived strength with a weak-keyed health ledger
    mod: ksarmory
    features:
    - mods/ksarmory/features/blast-damage-and-part-health
    technique: weak-keyed-ledger
    note: '[folded from damage-parts-against-crash-tolerance: give it its own section] Cube-root blast law re-anchored to
      the reference strength; dents honour the player dent setting.'
  related:
  - change-vehicles-without-racing-the-solver
  - write-worker-thread-safe-solver-patches
  merged_from:
  - damage-parts-against-crash-tolerance
  - make-a-vessel-indestructible
  - persist-vessel-references-across-save-and-load
