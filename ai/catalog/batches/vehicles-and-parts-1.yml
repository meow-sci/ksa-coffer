- slug: change-vehicles-without-racing-the-solver
  title: Create, destroy and mutate vehicles, part state and mass without racing the vehicle solver
  kind: howto
  group: vehicles
  batch: vehicles-and-parts-1
  summary: The physics worker may be stepping while a mod builds, destroys or mutates a vehicle. Take the shape-registry lock
    or wait for the solver before changing shapes, parts or vehicles, queue PartFailureEvent entries instead of splitting
    directly, and write module state, mass, throttle or flight-computer fields only where the worker has not yet snapshotted
    the vehicle.
  game_types:
  - KSA.ConstraintSim
  - KSA.JobSystems
  - KSA.Vehicle
  - KSA.PhysicsBubble
  - KSA.InputEvents
  - KSA.PartFailureEvent
  - KSA.PartFailure
  - KSA.Universe
  - KSA.PartTree
  - KSA.MoleState
  - KSA.FlightComputer
  - KSA.Part
  engine_pointers:
  - current/decomp/KSA/ConstraintSim.cs UnlockShapes / UnlockShapesBlocking
  - current/decomp/KSA/JobSystems.cs VehicleSolver.Wait
  - current/decomp/KSA/InputEvents.cs EvaSpawn staging
  - current/decomp/KSA/PartFailureEvent.cs
  - current/decomp/KSA/PartFailure.cs
  - current/decomp/KSA/Universe.cs ExecuteNextVehicleSolvers
  - current/decomp/KSA/Vehicle.cs PrepareWorker, UpdateBulkStates
  - current/decomp/KSA/Part.cs mass fields
  - current/decomp/KSA/Vehicle.cs Props
  lifecycle:
  - frame:apply-solvers
  - frame:after-on-frame
  - frame:dispatch-solvers
  - physics:vehicle-solver
  - frame:draw-ui
  approaches:
  - n: 1
    title: UnlockShapesBlocking around the build
    mod: ksacars
    features:
    - mods/ksacars/features/spawn-parked-craft
    - mods/ksarmory/features/spawn-and-teleport-test-craft
    technique: shapes-registry-lock
    note: UnlockShapes throws during the step; UnlockShapesBlocking waits for EndVehicleUpdate.
  - n: 2
    title: Wait on JobSystems.VehicleSolver before mutating
    mod: unscience
    features:
    - mods/unscience/features/doh-kitten-spawning
    - mods/gatos/features/welds-vessel-anchoring
    technique: job-barrier
    note: Either wait for the solver or stage the operation like InputEvents.EvaSpawn; recover from constructors that throw
      after registration.
  - n: 3
    title: Safe destruction from a frame hook
    mod: ksarmory
    features:
    - mods/ksarmory/features/safe-vehicle-destruction-and-part-failure
    technique: job-barrier
    note: Wait for the solver, hold the shapes lock, then dispose; staged results must not land on a changed craft. (also
      destroy-vehicles-and-fail-parts-safely) Deferred application, split-id lineage, fragment guard.
  - n: 4
    title: Prefix Universe.ExecuteNextVehicleSolvers
    mod: unscience
    features:
    - mods/unscience/features/eternal-flame-resource-refill
    technique: harmony-prefix
    note: '[folded from write-state-where-the-vehicle-solver-sees-it: give it its own section] Run once per frame immediately
      before the snapshot.'
  - n: 5
    title: Prefix Vehicle.PrepareWorker (double-buffered fields)
    mod: ksarmory
    features:
    - mods/ksarmory/features/per-part-store-mass
    - mods/ksarmory/features/prepareworker-prefix-command-window
    technique: prepareworker-window
    note: '[folded from write-state-where-the-vehicle-solver-sees-it: give it its own section] Per-vehicle window, known double-buffered
      state, Unsafe write of ref readonly Props.'
  - n: 6
    title: Mole states are copy-on-write in the worker
    mod: ksarmory
    features:
    - mods/ksarmory/features/holed-tank-leaks
    technique: module-state-write
    note: '[folded from write-state-where-the-vehicle-solver-sees-it: give it its own section] Write tank state in the window
      where UpdateBulkStates will not overwrite it.'
  - n: 7
    title: Write the mass in the PrepareWorker window, derived not subtracted
    mod: ksarmory
    features:
    - mods/ksarmory/features/per-part-store-mass
    technique: unsafe-ref-write
    note: '[folded from change-a-part-mass-at-runtime: give it its own section] Recompute from the roster every step so the
      mass is idempotent.'
  related:
  - spawn-a-vehicle-at-runtime
  - make-a-vehicle-indestructible
  - refill-or-drain-resources
  - take-control-of-another-vehicle
  merged_from:
  - create-or-dispose-vehicles-without-racing-the-solver
  - destroy-vehicles-and-fail-parts-safely
  - write-state-where-the-vehicle-solver-sees-it
  - change-a-part-mass-at-runtime
