    technique: harmony-transpiler
    note: 'Separate render, physics and collider scaling. Also (merged from rendering/visually-scale-a-vessel approach 1,
      "Part-tree draw-matrix patches and a GetWorldMatrix postfix about the centre of mass"): Visual channel separate from
      the collider channel; also enlarges the render cull radius.'
  - n: 2
    title: Recursive Part.Scale and avatar Core.Scale cheats
    mod: gatos
    features:
    - mods/gatos/features/scale-and-force-render-cheats
    technique: harmony-prefix
    note: 'Folded from rendering/visually-scale-a-vessel approach 2: Simple route that also affects what the game believes
      about the part.'
  - n: 3
    title: Per-axis part scaling with captured baselines
    mod: unscience
    features:
    - mods/unscience/features/garrys-torch-per-axis-part-scaling
    technique: harmony-postfix
    note: Part.Scale with exact restore; ScaleFactors collapses double3 to the largest axis for connectors, mass and IRescale.
  - n: 4
