batch: flight-and-orbits-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: flight-and-orbits
category_description: Reading a vehicle's flight state and orbit, working in KSA's coordinate frames and epochs, driving the
  flight computer and burns from a mod, extending the stock Transfer Planner, transfer and encounter math, targets, map-view
  overlays and guided flight (ascent, boostback, landing, ballistic and homing guidance).
groups:
  flight-state: 'Reading where a craft is and how it flies: coordinate frames and epochs, flight state, horizon-frame angles,
    orbit elements, mission time and simulation speed.'
  autopilot: 'Flying a craft from code: maneuver nodes, executing burns, the flight computer and attitude modes, per-vehicle
    autopilots and navigation targets.'
  transfers: 'Transfer planning: patched-conic delta-v, multi-leg routes, transfer and launch windows, flyby targeting and
    extending the stock Transfer Planner.'
topics:
- slug: understand-ksa-coordinate-frames-and-epochs
  title: Understand KSA coordinate frames and epochs (ECL, CCE, CCI, CCF, ego, body)
  kind: reference
  group: flight-state
  batch: flight-and-orbits-1
  summary: Reference for which frame and epoch each Vehicle, Orbit and body member lives in, how to sample two positions at
    one consistent epoch, how to convert a position to latitude, longitude and altitude, and what the usual conversion pitfalls
    are.
  game_types:
  - KSA.Vehicle
  - KSA.IParentBody
  - KSA.Orbit
  - KSA.Camera
  - KSA.CelestialFrameMath
  - KSA.Universe
  - KSA.PhysicsBubble
  - KSA.Celestial
  engine_pointers:
  - current/decomp/KSA/Celestial.cs (GetCce2Cci, GetCci2Ccf)
  - current/decomp/KSA/Orbit.cs (Inclination, CreateFromStateCci)
  - current/decomp/KSA/Camera.cs (EclToEgo, GetPositionEgo)
  - current/decomp/KSA/Camera.cs GetPositionEgo, EclToEgo
  - current/decomp/KSA/Universe.cs GetElapsedTime, ApplyVehicleSolvers
  - current/decomp/KSA/Celestial.cs GetCci2Ccf, GetLlaFromCcf
  lifecycle:
  - frame:draw-ui
  - frame:dispatch-solvers
  - frame:celestials
  - frame:after-on-frame
  - frame:viewports
  approaches:
  - n: 1
    title: Vessel state in CCI/CCF/ECL
    mod: gatos
    features:
    - mods/gatos/features/vessel-flight-state-reads
    - mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate
    technique: immutable-snapshot
    note: 'Attitude is stored as Body2Cce; the table of which member is in which frame. Also (convert-position-to-latitude-longitude):
      Sub-step folded from convert-position-to-latitude-longitude (give it its own section): The two mods use the same two
      calls; the article also covers the reverse (lat/lon to a position) used in site and landing code.'
  - n: 2
    title: Ecl as the mod's working frame, ego for anything drawn
    mod: ksarmory
    features:
    - mods/ksarmory/features/ecliptic-frames-and-epochs
    - mods/ksarmory/features/cpa-threat-classification
    technique: frame-invariant-signatures
    note: 'All state in Ecl at the sub-step instant; the 29.8 km/s carrier that makes mixing epochs fail. Also (sample-positions-at-a-consistent-epoch):
      Sub-step folded from sample-positions-at-a-consistent-epoch (give it its own section): One parent-first walk in ApplyVehicleSolvers
      decides which instant each engine sample belongs to; relative motion taken from paired samples.'
  - n: 3
    title: Anchors stored in the owner's frame and resolved on use
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/live-body-relative-anchors
    technique: frame-relative-anchors
    note: CCE offset, orbit-parent offset, body-fixed lat/lon and part-local asmb frames as resolve-to-ECL recipes.
  - n: 4
    title: Equatorial versus ecliptic reference planes
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/apse-and-inclination-quick-tools
    technique: custom-physics
    note: Orbit.Inclination is measured against CCI +Z (the parent pole); the ecliptic normal is CCE +Z via GetCce2Cci (AFC labels the two the other way round).
  - n: 5
    title: Pair the rendered Ego position with Ecl offsets from the same instant
    mod: ksagolf
    features:
    - mods/ksagolf/features/frame-epoch-draw-anchor
    technique: frame-epoch
    note: 'Sub-step folded from sample-positions-at-a-consistent-epoch (give it its own section): Draw next to a craft by
      measuring offsets against a platform sample taken the same frame, avoiding the 500 m-per-frame ecliptic error.'
  related:
  - build-a-site-frame-and-compute-a-launch-window
  - anchor-and-pick-points-on-bodies
  - compute-mission-elapsed-time-and-detect-liftoff
  - find-closest-approach-along-the-flight-plan
  merged_from:
  - understand-ksa-coordinate-frames
  - sample-positions-at-a-consistent-epoch
  - convert-position-to-latitude-longitude
- slug: read-vehicle-flight-state
  title: Read a vehicle's position, velocity, attitude, orbit and flight instruments
  kind: howto
  group: flight-state
  batch: flight-and-orbits-1
  summary: Pull a consistent kinematic snapshot (position, velocity, attitude, mass, orbit, navball, SOI encounters) out of
    KSA.Vehicle, knowing which frame and unit each member uses and which thread and frame point the read is valid on; then
    derive the instrument values (barometric versus radar altitude, orbital versus surface speed, g-load, dynamic pressure,
    Mach).
  game_types:
  - KSA.Vehicle
  - KSA.Orbit
  - KSA.NavBallData
  - KSA.PatchedConic
  - KSA.Encounter
  - KSA.UniverseTime
  - KSA.PhysicsEnvironment
  - KSA.PhysicalAtmosphereReference
  - KSA.ReadOnlyPhysicsStates
  - KSA.SituationEx
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs (GetPositionCci, GetVelocityCci, GetBody2Cci, Orbit, NavBallData)
  - current/decomp/KSA/Program.cs OnFrame (what is settled after the solver apply)
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers
  - current/decomp/KSA/Vehicle.cs (GetBarometricAltitude, GetRadarAltitude, GetSurfaceSpeed, AccelerationBody)
  - current/decomp/KSA/PhysicsEnvironment.cs
  - current/decomp/KSA/PhysicalAtmosphereReference.cs
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Immutable snapshot built in a main-viewport OnFrame prefix
    mod: gatos
    features:
    - mods/gatos/features/vessel-flight-state-reads
    technique: immutable-snapshot
    note: CCI/CCF/ECL members, NaN scrubbing, UniverseTime sentinels and SOI encounters copied into a record that other threads
      can read without touching the game.
  - n: 2
    title: Plain snapshot taken from StarMapAfterOnFrame, drawn next frame
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/live-flight-telemetry-sampling
    technique: snapshot-copy
    note: 'One read per frame after the game finished the frame, one frame of latency, no locks; shows the apsides, thrust,
      T/W and downrange extras. Also (read-altitude-speed-and-g-load): Sub-step folded from read-altitude-speed-and-g-load
      (give it its own section): Reads dynamic pressure from ReadOnlyPhysicsStates.Environment, sums active engine thrust,
      derives T/W and downrange.'
  - n: 3
    title: Postfix read of a settled vehicle for an instrument panel
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/flight-data-from-vehicle
    technique: harmony-postfix
    note: 'Reading after the vehicle solver results are applied so values are not a frame stale; compare with approaches 1
      and 2. Also (read-altitude-speed-and-g-load): Sub-step folded from read-altitude-speed-and-g-load (give it its own section):
      Barometric versus radar altitude, surface speed, AccelerationBody and Mach computed from PhysicalAtmosphereReference.'
  - n: 4
    title: Speed of sound from pressure and density
    mod: ksaero
    features:
    - mods/ksaero/features/mach-from-game-atmosphere
    technique: flight-math
    note: 'Sub-step folded from read-altitude-speed-and-g-load (give it its own section): sqrt(1.4 p / rho) from PhysicsEnvironment;
      constant per body because KSA atmospheres are isothermal.'
  related:
  - understand-ksa-coordinate-frames-and-epochs
  - read-orbit-elements-and-timing
  - drive-the-flight-computer-and-attitude-modes-from-a-mod
  - read-flight-state-in-a-local-horizon-frame
  - compute-a-suicide-burn
  merged_from:
  - read-altitude-speed-and-g-load
- slug: read-flight-state-in-a-local-horizon-frame
  title: Read roll, pitch, heading, angle of attack and sideslip in the local horizon frame
  kind: howto
  group: flight-state
  batch: flight-and-orbits-1
  summary: 'Express a vehicle''s attitude and velocity relative to the local horizon (east-north-up or north-east-down) of
    the body it is over: roll, pitch, heading, flight-path angle, angle of attack and sideslip, and the surface-relative velocity
    on a rotating body.'
  game_types:
  - KSA.Vehicle
  - KSA.VehicleReferenceFrameEx
  - KSA.QuaternionEx
  - Brutal.Numerics.doubleQuat
  - KSA.PhysicalAtmosphereReference
  engine_pointers:
  - current/decomp/KSA/VehicleReferenceFrameEx.cs GetEnuBody2Cci
  - current/decomp/KSA/Vehicle.cs GetBody2Cci
  - current/decomp/KSA/Vehicle.cs (GetBody2Cci, surface velocity)
  - current/decomp/KSA/VehicleReferenceFrameEx.cs
  lifecycle:
  - frame:viewports
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Concatenate GetBody2Cci with the inverse of the ENU frame, then ToRollPitchYawRadians
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/flight-data-from-vehicle
    technique: custom-physics
    note: 'The game-supplied ENU body frame does the horizon work; the article shows the composition order and the resulting
      angle conventions. Also (compute-angle-of-attack-and-sideslip): Sub-step folded from compute-angle-of-attack-and-sideslip
      (give it its own section): Alpha and beta from the body-frame velocity components; why the wind-relative velocity is
      the right input.'
  - n: 2
    title: Transform basis vectors with the game's own quaternion type
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/vehicle-state-to-site-frame
    technique: frame-conversion
    note: Never assume a quaternion convention (doubleQuat is scalar-last); rotate known basis vectors and rebuild the attitude
      from them. Body axes inferred from the measured thrust direction.
  related:
