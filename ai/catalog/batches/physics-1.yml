- slug: ray-cast-against-vessel-meshes-and-terrain
  title: Ray cast against part meshes and terrain, from the cursor or any origin
  kind: howto
  group: mod-simulation
  batch: physics-1
  summary: Resolve whether a path segment or a mouse ray hits a craft using KSA's watertight Part.RayCastEgo in a local metres
    frame, and walk the terrain height field or layer casts over cloth, part meshes and kittens to find the first hit point
    for placing, launching or decorating. Also covers frame-budgeted sweeps of a craft's own geometry to find actuator travel
    limits.
  game_types:
  - KSA.Part
  - KSA.Vehicle
  - KSA.Camera
  - KSA.Cursor
  - KSA.Celestial
  - KSA.ViewportPartPicker
  engine_pointers:
  - current/decomp/KSA/Part.cs RayCastEgo
  - current/decomp/KSA/Part.cs GetMatrixAsmb2Ego
  - current/decomp/KSA/Cursor.cs GetEgoRay
  - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
  - current/decomp/KSA/Universe.cs OnDrawUi ViewportPartPicker
  - current/decomp/KSA/Camera.cs world to screen projection
  lifecycle:
  - frame:celestials
  - frame:after-on-frame
  - frame:draw-ui
  - frame:input
  approaches:
  - n: 1
    title: Round-centred ego origin and sphere broad phase
    mod: ksarmory
    features:
    - mods/ksarmory/features/hull-triangle-hit-test
    - mods/ksagolf/features/swept-hull-contact
    technique: engine-raycast
    note: 'Pass the separation as the ego origin to GetMatrixAsmb2Ego so queries stay at metre scale. Also (merged from vehicles-and-parts/raycast-against-part-meshes
      approach 2, "Camera-less ray from a caller-chosen origin (hit test and swept contact)"): Sphere broad phase, then watertight
      per-triangle cast with the separation as ego origin.'
  - n: 2
    title: Cursor ray against every vehicle, plus the stock hover picker
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/part-mesh-raycast-picking
    - mods/unscience/features/hot-pursuit-mesh-ray-placement
    technique: mesh-raycast
    note: 'Folded from vehicles-and-parts/raycast-against-part-meshes approach 1: GetMatrixAsmb2Ego plus RayCastEgo returns
      subpart, local hit point and vertex; reuse ViewportPartPicker.'
  - n: 3
    title: Per-triangle cast in a mover-centred frame with no camera
    mod: ksagolf
    features:
    - mods/ksagolf/features/swept-hull-contact
    technique: ray-cast
    note: Same call with a caller-chosen origin; the narrow phase for a ball hitting a craft.
  - n: 4
    title: Walk the ray over the height field in bounded steps
    mod: ksacars
    features:
    - mods/ksacars/features/craft-mover-mouse-pick-place
    technique: ray-cast
    note: 'Sub-step (give it a section on cursor picking): Walk the ray over the height field in bounded steps. Convert the
      mouse position to camera framebuffer pixels before ScreenToEgoRay; step bounded by height above ground.'
  - n: 5
    title: Layered cast over cloth, part meshes, kitten sphere and a terrain march
    mod: unscience
    features:
    - mods/unscience/features/graffiti-decal-placement-picking
    technique: ray-cast
    note: 'Sub-step (give it a section on cursor picking): Layered cast over cloth, part meshes, kitten sphere and a terrain
