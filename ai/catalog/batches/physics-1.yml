batch: physics-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: physics
category_description: Forces, drag and aero, wheels and suspension, colliders, Bepu, custom motion, terrain contact and physics-safe
  mutation of simulated state, including patches inside the worker-thread vehicle solver.
groups:
  solver: 'Writing simulated state safely: the physics-safe windows, worker-thread patches, injected forces and impulses,
    and keeping pushed craft off rails.'
  mod-simulation: 'Bodies the mod simulates itself: sub-stepped integration, tunnelling-free hits, ray casts against hulls
    and terrain, and drag and gravity.'
  colliders: 'Bepu colliders and contacts: the shared shape registry, static colliders, clutter colliders, collision suppression,
    collider scaling, moving platforms and a private Bepu world.'
  kinematics: 'Moving whole vessels by fiat: teleporting to an orbit or state vector, placing on a surface and welding one
    vessel to another.'
topics:
- slug: mutate-vehicles-at-a-physics-safe-point
  title: Mutate vehicles at a physics-safe point
  kind: howto
  group: solver
  batch: physics-1
  summary: Vehicle state written from an ordinary StarMap hook or ImGui button is overwritten by the physics step already
    in flight. This topic shows the four windows where a write survives and which kind of change belongs in each.
  game_types:
  - KSA.Vehicle
  - KSA.Universe
  - KSA.Program
  - KSA.JobSystems
  - KSA.VehicleUpdateTask
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  - current/decomp/KSA/Universe.cs PrepareVehicleWorkers, ExecuteNextVehicleSolvers, ApplyVehicleSolvers
  - current/decomp/KSA/Program.cs PrepareFrame
  - current/decomp/KSA/JobSystems.cs VehicleSolver
  lifecycle:
  - frame:prepare
  - frame:apply-solvers
  - frame:dispatch-solvers
  - frame:draw-ui
  approaches:
  - n: 1
    title: Write inside a Vehicle.PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/prepareworker-impulse-injection
    - mods/ksarmory/features/prepareworker-prefix-command-window
    - mods/ksastructures/features/lift-moving-landmark
    technique: harmony-prefix
    note: The window just before KSA snapshots a vehicle for the worker; queue from any hook, perform here. Explain why writes
      from StarMap hooks are lost (ApplyVehicleSolvers overwrites the kinematic states, the worker snapshot is taken before
      the next Apply) and how GetPhysicsStatesMutable is used. KSArmory demonstrates queuing attitude, throttle, staging,
      mass writes; KSACars velocity writes; KSAStructures position writes after taking a body off rails.
  - n: 2
    title: Drain a command queue in a Priority.First prefix on Universe.ExecuteNextVehicleSolvers
    mod: gatos
    features:
    - mods/gatos/features/solver-phase-command-drain
    - mods/ksagolf/features/launch-site-surface-raycast
    - mods/unscience/features/kiwis-marbles-celestial-welding
    technique: harmony-prefix
    note: 'Runs after Apply*Solvers and before the step is queued, so orbit swaps, refills, teleports and shape-registry reads
      are safe. Compare with the PrepareWorker window: earlier, once per frame rather than once per vehicle, and where the
      shapes registry is guaranteed idle.'
  - n: 3
    title: Run a callback at the PrepareFrame handoff with a GetJobSimStep transpiler
    mod: unscience
    features:
    - mods/unscience/features/lib-physics-frame-hook
    - mods/unscience/features/garrys-torch-vehicle-welding
    - mods/unscience/features/dent-wizard-vessel-launcher
    - mods/unscience/features/godzilla-vessel-scaling
    technique: harmony-transpiler
    note: A shared hook (Enqueue one-shots, BeforePhysics per-frame event, world-change deferral) that rewrites the single
      GetJobSimStep call. Emphasise the exactly-once call-order validation that makes the hook disable itself when the game
      changes, and the stateTime value passed to callbacks.
  - n: 4
    title: Join JobSystems.VehicleSolver before mutating from a frame hook
    mod: ksarmory
    features:
    - mods/gatos/features/welds-vessel-anchoring
    - mods/ksarmory/features/safe-vehicle-destruction-and-part-failure
    technique: reflection
    note: When the edit cannot wait for a dispatch window, Wait() on the vehicle solver first, mutate, and accept that results
      staged for the craft must not land on a changed craft. Covers batching kills behind one barrier and queuing PartFailureEvent
      rather than splitting directly.
  related:
  - write-worker-thread-safe-solver-patches
  - inject-forces-and-impulses-at-the-physics-safe-point
  - weld-one-vessel-to-another
  - teleport-a-vessel-by-building-a-new-orbit
- slug: write-worker-thread-safe-solver-patches
  title: Write worker-thread-safe patches inside the vehicle solver
  kind: howto
  group: solver
  batch: physics-1
  summary: Patches on ComputeDerivatives, the atmosphere functions, the flight computer or the constraint sim run on vehicle
    worker threads, per substep, possibly several at once. This topic collects the patterns the mods use to share data with
    them without locks, allocation or exceptions.
  game_types:
  - KSA.PhysicsStates
  - KSA.PhysicsBubble
  - KSA.VehicleUpdateTask
  - KSA.PhysicsEnvironment
  - KSA.ConstraintSim
  - KSA.KittenLocomotion
  - KSA.FlightComputer
  engine_pointers:
  - current/decomp/KSA/VehicleUpdateTask.cs
  - current/decomp/KSA/PhysicsBubble.cs
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives
  lifecycle:
  - physics:vehicle-solver
  - physics:bepu
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Pure, allocation-free, never-throwing code over the in arguments
    mod: ksaero
    features:
    - mods/ksaero/features/body-of-revolution-aerodynamics
    - mods/ksaero/features/stock-drag-delegate-fallback
    technique: harmony-transpiler
    note: Explain the call chain PrepareFrame -> ExecuteNextVehicleSolvers -> VehicleUpdateTask on JobSystems.VehicleSolver
      -> ComputeDerivatives, what MarkFailed does when the step throws (the bubble step is not applied that frame), and why
      KSAero uses only its arguments and falls back to stock on degenerate geometry.
  - n: 2
    title: Read-only tables filled on the main thread before physics starts
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/measured-flight-atmospheres
    - mods/ksastructures/features/dry-volume-below-sea-level
    technique: reflection
    note: ConditionalWeakTable keyed on the game's reference object, populated in a load-time postfix, read by allocation-free
      prefixes on the worker. Also volatile array swaps for data that changes at runtime.
  - n: 3
    title: Concurrent registries keyed by reference
    mod: unscience
    features:
    - mods/unscience/features/kitchen-sink-g-load-protection
    - mods/unscience/features/the-tick-vessel-indestructibility
    technique: reflection
    note: ConcurrentDictionary with ReferenceEqualityComparer written by the UI and read by workers, an IsDisposed check on
      read and a per-frame prune on the main thread.
  - n: 4
    title: Volatile snapshot handoff from worker patches to the main thread
    mod: ksagolf
    features:
    - mods/ksagolf/features/course-colliders-as-clutter
    - mods/ksastructures/features/first-person-kitten-view
    technique: worker-thread-patch
    note: Worker prefixes on ConstraintSim passes and KittenLocomotion.StepGrounded read an immutable snapshot published by
      the main thread and write results through volatile fields; one sim per prefix call, no shared mutable state.
  - n: 5
    title: Identify the vehicle a callback runs for with a ThreadStatic set in a prefix and cleared in a finalizer
    mod: ksastructures
    features:
    - mods/ksastructures/features/terrain-height-roof-override
    technique: harmony-finalizer
    note: Functions like GetTerrainHeightFromDirCce do not receive the vehicle. A Priority.First prefix on Vehicle.PrepareWorker
      sets a thread-static and a Priority.Last finalizer clears it, so later patches can tell vehicle-driven calls from camera
      and UI calls.
  - n: 6
    title: Immutable commands published before the solver job is queued
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
    technique: harmony-postfix
    note: A single postfix on FlightComputer.ComputeControl runs every mod actuator writer on the worker, each consuming an
      immutable command handed over at PrepareWorker time, with wake and off-rails requests merged into the stock output.
  related:
  - mutate-vehicles-at-a-physics-safe-point
  - replace-the-stock-aerodynamic-force-model
  - mutate-the-shared-bepu-shape-registry
- slug: inject-forces-and-impulses-at-the-physics-safe-point
  title: Inject forces, impulses and velocity changes at the physics safe point
  kind: howto
  group: solver
  batch: physics-1
  summary: Push a craft from a mod (driven car, blast, boost, hover, lift, a flip or lift-in-place) by writing velocity, spin
    or pose deltas in the PrepareWorker prefix or the solver-dispatch window, and keep those forces bounded at any time warp
    with exponential shares, per-step caps and saturation.
  game_types:
  - KSA.Vehicle
  - KSA.PhysicsStates
  - KSA.Kinematic
  - KSA.Universe
  - KSA.Celestial
  - KSA.FlightComputer
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs PrepareWorker, GetPhysicsStatesMutable
  - current/decomp/KSA/PhysicsStates.cs
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf
  - current/decomp/KSA/SimStep.cs
  lifecycle:
  - frame:dispatch-solvers
  - frame:draw-ui
  approaches:
  - n: 1
    title: Add velocity deltas in the PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/prepareworker-impulse-injection
    technique: harmony-prefix
    note: 'Write VelocityPhys and AngularVelocityPhys in the window before the worker snapshot; the generic recipe and its
      limits (railed craft ignore writes, see keep-a-pushed-craft-off-rails). Sub-step (give it a section): rotate or lift
      in place by writing PositionPhys and Body2Phys and zeroing both velocities in the same window. Write PositionPhys, Body2Phys
      and zero velocities in the PrepareWorker prefix. The unflip action; explain why position, attitude and both velocities
      must change together.'
  - n: 2
    title: Summed per-part drag-style shove with torque from a blast front
    mod: ksarmory
    features:
    - mods/ksarmory/features/blast-shove-impulse
    technique: impulse-write
    note: 'Each part the front reaches adds a push and a torque about the centre of mass, saturated so nothing outruns the
      wind, written as one impulse; covers Kinney-Graham overpressure and the post-front wind, off-rails handling and the
      orbit rebuild. Sub-step (give it a section on warp-stable forces): Saturate a pushed velocity so nothing outruns the
      driving flow. Clamp the induced velocity to the local wind speed rather than integrating an unbounded drag.'
  - n: 3
    title: Impulsive kick from the solver-dispatch window
    mod: gatos
    features:
    - mods/gatos/features/debug-cheats-teleport-refuel-warp
    technique: harmony-prefix
    note: Debug cheat that applies an instantaneous velocity change in the ExecuteNextVehicleSolvers prefix; shows the simpler
      no-per-part variant.
  - n: 4
    title: Velocity and spin deltas gated by hatches in the PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/rocket-lift-hover-boost-downforce
    technique: harmony-prefix
    note: 'Sub-step (give it a section): lift, hover, boost and downforce. Velocity and spin deltas gated by hatches in the
      PrepareWorker prefix. Lift with airborne attitude hold, hover cancelling gravity, boost and downforce all expressed
      as per-step deltas; covers the 0.1 s hatch gating. Sub-step (give it a section on warp-stable forces): Fractional (1
      - exp(-k dt)) shares and per-step caps. Replace force-based damping with velocity shares that approach a target; derive
      the cap from the step length.'
  - n: 5
    title: Hover and touchdown under real engine power with a PID
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/terminal-hover-touchdown
    technique: harmony-prefix
    note: 'Sub-step (give it a section): lift, hover, boost and downforce. Hover and touchdown under real engine power with
      a PID. Quadratic sink profile, per-axis PID with gravity feedforward and terrain height from the body-fixed frame; contrasts
      commanding engines with injecting forces.'
  related:
  - keep-a-pushed-craft-off-rails
  - mutate-vehicles-at-a-physics-safe-point
  - place-a-vessel-on-a-surface-at-latitude-and-longitude
  - query-terrain-height-and-line-of-sight
  merged_from:
  - apply-impulses-and-velocity-changes-to-a-vehicle
  - reposition-or-rotate-a-vehicle-in-place
  - add-lift-hover-boost-and-downforce-to-a-craft
  - keep-custom-forces-stable-under-time-warp
- slug: keep-a-pushed-craft-off-rails
  title: Keep a craft under full physics while your mod pushes it
  kind: howto
  group: solver
  batch: physics-1
  summary: A railed (analytic orbit) craft ignores velocity writes. Make the game keep the craft in the physics bubble, and
    wake it correctly when it is already on rails.
  game_types:
  - KSA.PhysicsBubble
  - KSA.Vehicle
  - KSA.FlightComputer
  engine_pointers:
  - current/decomp/KSA/PhysicsBubble.cs KittenWantsWake
  - current/decomp/KSA/Vehicle.cs TakeOffRails, UpdateFromAnalytic
  lifecycle:
  - startup:all-mods-loaded
  - frame:dispatch-solvers
  - physics:vehicle-solver
  approaches:
  - n: 1
    title: Postfix PhysicsBubble.KittenWantsWake from a concurrent set
    mod: ksacars
    features:
    - mods/ksacars/features/keep-thrusting-craft-off-rails
    technique: harmony-postfix
    note: Both rails decisions ask the per-craft wake check on the worker; answer true for marked craft. Wake a landed craft
      with TakeOffRails and a coasting one by UpdateFromAnalytic with Maneuvering.
  - n: 2
    title: Request wake or off-rails from the flight computer command sink
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
    technique: harmony-postfix
    note: Mod actuator writers merge wake and off-rails requests into the stock ComputeControl output instead of patching
      the bubble.
  related:
  - inject-forces-and-impulses-at-the-physics-safe-point
  - write-worker-thread-safe-solver-patches
- slug: simulate-bodies-outside-the-vehicle-system
  title: Simulate mod-owned bodies in sub-steps outside the vehicle system
  kind: howto
  group: mod-simulation
  batch: physics-1
  summary: 'Run missiles, shells, bombs or a golf ball as plain objects the mod integrates itself in fixed sub-steps on KSA''s
    simulated time: consume the applied sim step, pick the frame (body-fixed versus ecliptic) and epoch, contact the terrain
    height field with bounce and rolling, and keep the maths engine-free for headless tests.'
  game_types:
  - KSA.Universe
  - KSA.SimStep
  - KSA.Celestial
  - KSA.Vehicle
  - KSA.Camera
  - KSA.PhysicsStates
  - KSA.Rendering.Water.Data.OceanReference
  engine_pointers:
  - current/decomp/KSA/Universe.cs GetLastSimStep
  - current/decomp/KSA/Program.cs OnFrameCelestials
  - current/decomp/KSA/Universe.cs GetLastSimStep, GetElapsedTime
  - current/decomp/KSA/SimStep.cs
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers
  - current/decomp/KSA/Camera.cs GetPositionEgo
  - current/decomp/KSA/PhysicsStates.cs GetStatesCcf
  - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCce
  - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf
  lifecycle:
  - frame:celestials
  - frame:after-on-frame
  - frame:draw-ui
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: IProjectile objects with fixed 5 ms sub-steps and a faithful-step clamp
    mod: ksarmory
    features:
    - mods/ksarmory/features/mod-simulated-rounds
    - mods/ksarmory/features/analytic-subframe-fuses
    technique: sub-stepping
    note: 'One RoundDriver seam shared with the headless rig; end-of-step samples back-dated to the sub-step; rounds never
      touch the save or the solver. Sub-step (give it a section on frames and epochs): End-of-step samples applied across
      a sub-stepped round. How a moving target is read once per frame and back-dated before every sub-step. Sub-step (give
      it a section on engine-free maths and headless rigs): One RoundDriver seam shared by the game and a headless rig. The
      same driver steps rounds in game and in tests.'
  - n: 2
    title: Ball integrated at up to 1/240 s in the body-fixed frame
    mod: ksagolf
    features:
    - mods/ksagolf/features/golf-ball-physics
    technique: sub-stepping
    note: 'Flight, bounce, rolling resistance and rest in one integrator that runs from a Program.OnFrameCelestials prefix.
      Sub-step (give it a section on simulated time and GetLastSimStep): Integrate between GetLastSimStep boundaries for a
      ball. Same idea in a simpler single-object mod; the paused span is 0. Sub-step (give it a section on the planet-fixed
      frame): Integrate a free body in Ccf and convert to Ecl only to draw. The state carries no epoch; the rotating frame
      removes the need to chase the ground. Sub-step (give it a section on terrain contact, bounce and rolling): Height-field
      integrator in the body-fixed frame. The height field returns the seabed, so treat sea level as ground separately; finite-difference
      normal, rest slope, headless tests.'
  - n: 3
    title: Deduplicate GetLastSimStep on NextTime and widen to the span since the last boundary
    mod: ksarmory
    features:
    - mods/ksarmory/features/consume-applied-sim-step
    technique: sim-clock
    note: 'Sub-step (give it a section on simulated time and GetLastSimStep): Deduplicate GetLastSimStep on NextTime and widen
      to the span since the last boundary. Verified contiguity and the two-frame delay; pause gives zero; also shows measuring
      simulated seconds per wall second with the saturating achieved-speed fraction.'
  - n: 4
    title: Ecl state at GetElapsedTime with epoch back-dating
    mod: ksarmory
    features:
    - mods/ksarmory/features/ecliptic-frames-and-epochs
    technique: epoch-backdating
    note: 'Sub-step (give it a section on frames and epochs): Ecl state at GetElapsedTime with epoch back-dating. Which instant
      engine samples belong to (one parent-first walk in ApplyVehicleSolvers); Ecl, Ego, Cci and Cce conversions; GetPositionEgo
      versus GetPositionEcl in a physics bubble.'
  - n: 5
    title: Read GetStatesCcf in the PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/terrain-contact-under-wheels
    technique: harmony-prefix
    note: 'Sub-step (give it a section on the planet-fixed frame): Read GetStatesCcf in the PrepareWorker prefix. Position
      wheels in Ccf for ground queries, convert results back for the force write.'
  - n: 6
    title: Differences-only inputs and headless tests
    mod: ksagolf
    features:
    - mods/ksagolf/features/swept-hull-contact
    technique: headless-tests
    note: 'Sub-step (give it a section on engine-free maths and headless rigs): Differences-only inputs and headless tests.
      Pass the mover-to-vessel difference so the maths needs no large coordinates and no game types.'
  related:
