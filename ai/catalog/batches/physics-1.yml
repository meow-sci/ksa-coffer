- slug: apply-drag-and-gravity-to-a-mod-simulated-body
  title: Apply air drag, gravity and aiming to a mod-simulated body
  kind: howto
  group: mod-simulation
  batch: physics-1
  summary: Drag a ball, shell or missile through the same air and water the game uses, give it the right gravity (inverse-square
    with the parent's own fall, or body-fixed surface gravity), and lead a moving target by solving time of flight and refining
    with simulated shells.
  game_types:
  - KSA.PhysicalAtmosphereReference
  - KSA.AtmosphereReference
  - KSA.Rendering.Water.Data.OceanReference
  - KSA.Celestial
  - KSA.Astronomical
  - KSA.IParentBody
  - KSA.Vehicle
  engine_pointers:
  - current/decomp/KSA/PhysicalAtmosphereReference.cs GetAtmosphericDensityAtAltitude
  - current/decomp/KSA/Celestial.cs
  - current/decomp/KSA/IParentBody.cs Mu (default interface member)
  lifecycle:
  - frame:draw-ui
  - frame:celestials
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Density ratio to one reference air, ocean density below the waterline
    mod: ksagolf
    features:
    - mods/ksagolf/features/golf-ball-physics
    technique: custom-physics
    note: 'GetAtmosphericDensityAtAltitude and OceanReference.Density; never gate on IsValid; 0 for airless, 1 for unreadable.
      Sub-step (give it a section on gravity): Body-fixed surface gravity from IParentBody.Mu. Mu is a default interface member
      so it needs a cast; the integrator works in the rotating body-fixed frame.'
  - n: 2
    title: Shell and missile drag with the same density read
    mod: ksarmory
    features:
    - mods/ksarmory/features/point-gravity-and-atmosphere-model
    - mods/ksarmory/features/unguided-ballistic-lead
    technique: quadratic-drag
    note: 'Drag against a fixed reference air for every body; the ballistic-lead solver flies simulated shells through the
      identical model. Sub-step (give it a section on gravity): Point gravity at the back-dated sub-step plus the body''s
      own fall. mu / r^2 toward the parent evaluated at the sub-step epoch and the parent''s acceleration toward its primary.
      Sub-step (give it a section on leading a target): Fixed-point iteration plus shooting method with Broyden updates. Iterate
      time of flight to a tolerance, then fly rounds with the mod''s drag and gravity and correct from the turns already flown.'
  - n: 3
    title: Impact prediction in a co-rotating atmosphere
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/boostback-impact-prediction
    technique: custom-physics
    note: Integrate gravity and drag on air-relative velocity with the atmosphere rotating with the body.
