  summary: Pin a vessel to another vessel or part by re-teleporting it onto the anchor pose every frame, stamped with the
    correct sim-step time, with optional eased animation of offset, rotation and scale and named weld presets stored in TOML.
  game_types:
  - KSA.Vehicle
  - KSA.SimStep
  - KSA.Universe
  - KSA.JobSystems
  - KSA.PhysicsFrameHook
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs Teleport
  - current/decomp/KSA/SimStep.cs
  - current/decomp/KSA/Program.cs PrepareFrame handoff
  - current/decomp/KSA/JobSystems.cs VehicleSolver.Wait
  lifecycle:
  - frame:prepare
  - frame:draw-ui
  - frame:after-on-frame
  approaches:
  - n: 1
    title: BeforePhysics callback at the PrepareFrame handoff
    mod: unscience
    features:
    - mods/unscience/features/garrys-torch-vehicle-welding
    - mods/unscience/features/garrys-torch-scoped-collision-suppression
    - mods/unscience/features/garrys-torch-weld-animation-and-presets
    technique: harmony-transpiler
    note: 'Teleport at the handoff stamped with SimStep.PreviousTime; suppress collisions between welded vessels. Also (merged
      from vehicles-and-parts/weld-vehicles-together approach 1, "BeforePhysics callback stamped with the previous step time"):
      Part-anchored offset, eased animation queues and TOML presets.'
  - n: 2
    title: VehicleSolver.Wait then teleport stamped with the next sim step
    mod: gatos
    features:
    - mods/gatos/features/welds-vessel-anchoring
    technique: kinematic-teleport
    note: 'Frame-hook variant without a transpiler. Also (merged from vehicles-and-parts/weld-vehicles-together approach 2,
      "Teleport after VehicleSolver.Wait, stamped with the next step time"): Vessel onto vessel or part pose each frame.'
  - n: 3
    title: Per-weld eased animation queues in player time
    mod: unscience
    features:
    - mods/unscience/features/garrys-torch-weld-animation-and-presets
    technique: custom-physics
    note: 'Sub-step (give it a section on animating a weld): Per-weld eased animation queues in player time. Queues advance
      at the physics handoff, not in the UI. Sub-step (give it a short section on named weld presets in TOML): Preset file
      with legacy-key migration. Reusable weld settings as presets.'
  related:
  - suppress-collisions-for-one-vessel
  - teleport-a-vessel-by-building-a-new-orbit
  - mutate-vehicles-at-a-physics-safe-point
  - change-vehicles-without-racing-the-solver
  - anchor-to-parts-across-vehicle-changes
  merged_from:
  - animate-a-weld-with-eased-queues
  - store-named-presets-in-toml-with-tomlyn
  - weld-vehicles-together
