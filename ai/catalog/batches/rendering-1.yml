- slug: project-decals-onto-scene-geometry
  title: Project decals onto vessels, terrain and clutter
  kind: howto
  group: textures-and-decals
  batch: rendering-1
  summary: Draw an image, a sticker or a damage mark onto arbitrary surfaces by reconstructing the scene position from the
    depth buffer and drawing a box or fullscreen pass in the post-resolve window, or by using the terrain's own decal modifiers.
  game_types:
  - KSA.Rendering.RenderTarget
  - KSA.DecalModifierReference
  - KSA.TerrainReference
  engine_pointers:
  - current/decomp/KSA.Rendering/RenderTarget.cs ResolveAttachments
  - current/decomp/KSA/DecalModifierReference.cs
  lifecycle:
  - frame:render
  - render:grid
  - render:bloom
  approaches:
  - n: 1
    title: Unit-cube decal volumes with reverse-Z depth reconstruction
    mod: unscience
    features:
    - mods/unscience/features/graffiti-projected-decal-pass
    - mods/unscience/features/graffiti-bindless-decal-textures
    technique: vulkan-pipeline
    note: One cube per decal; fragment shader rebuilds scene position and projects the texture; texture index through the
      bindless table.
  - n: 2
    title: Sticker pass after resolve with runtime GLSL including the game library
    mod: gatos
    features:
    - mods/gatos/features/sticker-projected-decals
    technique: vulkan-pipeline
    note: Same hook as approach 1, patches installed only while stickers exist.
  - n: 3
    title: Procedural bullet holes painted by compute from depth, stored in the struck subpart's frame
    mod: ksarmory
    features:
    - mods/ksarmory/features/bullet-hole-decals
    technique: vulkan-pipeline
    note: No texture or decal mesh; the hole follows the sub-part through the engine's draw matrix and the dented skin's real
      surface.
  - n: 4
    title: Engine terrain DecalModifier deserialized from XML in code
    mod: ksastructures
    features:
    - mods/ksastructures/features/terrain-decal-pits
    technique: xml-asset
    note: Not a render pass, terrain modifiers dig pits so the drawn ground, colliders and height queries all follow; must
      happen while the game is still loading.
  related:
  - choose-a-render-frame-and-anchor-effects
  - insert-a-custom-pass-into-render-game
- slug: paint-vessel-parts-with-custom-colours
  title: Recolour vessel parts and kittens with a patched part shader
  kind: howto
  group: textures-and-decals
  batch: rendering-1
  summary: Tint, multiply or replace the colour of individual part instances, part types or whole vessels by packing colour
    into per-instance state bits and compiling a modified fragment shader, leaving glass and heat glow intact. Also covers
    coloured emissive glow per part or subpart and overriding engine heat glow.
  game_types:
  - KSA.PartModelDynamic
  - KSA.ShaderReference
  - KSA.PartTreeRenderData
  - KSA.PartModelRenderer
  engine_pointers:
  - current/decomp/KSA/PartModelDynamic.cs AddInstance
  - current/decomp/KSA/PartTreeRenderData.cs
  - current/decomp/KSA/PartTreeRenderData.cs WriteState
  lifecycle:
  - startup:all-mods-loaded
  - frame:render
  - frame:draw-ui
  - frame:pre-render
  approaches:
  - n: 1
    title: 7:7:7 colour in the unused StateBitFlag high bits plus a patched MeshIndirect.frag
    mod: unscience
    features:
    - mods/unscience/features/humble-arteest-vehicle-paint-shader-patch
    - mods/unscience/features/humble-arteest-kitten-color
    technique: glsl-shader
    note: Ten-line decode snippet compiled in place of the stock file; Multiply, Tint, Replace; kitten colour via the material
      system.
  - n: 2
    title: Shader transform at compile time with packed colours and runtime masters
    mod: gatos
    features:
    - mods/gatos/features/vehicle-and-eva-paint
    technique: glsl-shader
    note: Global, per-template, per-vessel or per-instance scope; restores stock rendering when disabled; also covers EVA
      suit, fur, visor.
  - n: 3
    title: ADD_EMISSIVE_COLOR state bit and instance colour in a postfix on WriteState
    mod: ksacars
    features:
    - mods/ksacars/features/coloured-emissive-lenses
    technique: harmony-postfix
    note: '[Folded from tint-emissive-glow-per-part: emissive glow sub-step (own section): per-instance emissive colour and
      engine heat glow override by editing instance data before it is appended.] Reflection into private batch arrays, disabled
      automatically if the target moves; red-channel mask and bit meanings in MeshIndirect.frag; lens triangles split from
      a GLB mesh by UV region.'
  - n: 4
    title: Prefix on PartModelDynamic.AddInstance rewrites Temperature and TfiThickness
    mod: unscience
    features:
    - mods/unscience/features/humble-arteest-engine-emissive
    technique: harmony-prefix
    note: '[Folded from tint-emissive-glow-per-part: emissive glow sub-step (own section): per-instance emissive colour and
      engine heat glow override by editing instance data before it is appended.] Reuses the game''s own ENABLE_TEMPERATURE
      heat lookup and thin-film path; unsafe struct reinterpret.'
  related:
  - project-decals-onto-scene-geometry
  merged_from:
  - tint-emissive-glow-per-part
