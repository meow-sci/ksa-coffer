batch: rendering-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: rendering
category_description: Drawing things the game does not draw by itself - ImGui overlays on the sky and world, custom Vulkan
  passes, textures, meshes, lights, particles, plumes and decals - plus the Vulkan resource discipline that keeps those additions
  alive across frames, resizes and shutdown.
groups:
  vulkan-passes: 'Recording your own Vulkan work inside KSA''s frame: command submission, pass insertion, compatible pipelines,
    HDR compute passes, renderer rebuilds, resource teardown and frame capture.'
  overlays: Projecting world and sky points to the screen and drawing overlays that stay glued to bodies, craft and the sky.
  textures-and-decals: 'Getting pixels onto the screen and onto surfaces: texture upload, ImGui images, replacing game textures,
    UI rendered to textures, world quads, projected decals and part recolouring.'
topics:
- slug: submit-your-own-vulkan-commands
  title: 'Record and submit your own Vulkan work: offscreen renders and one-shot uploads'
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: One-shot uploads, offscreen renders and ImGui-to-texture need command buffers the game does not own; pick the pool,
    fence and queue lock so they neither stall nor auto-submit half-recorded work. Also covers rendering your own Vulkan scene
    offscreen into private images and showing it in an ImGui window.
  game_types:
  - RenderCore.StagingPool
  - Brutal.VulkanApi
  - KSA.Program
  - RenderCore.SimpleVkTexture
  - KSA.ImGuiBackendVulkanImpl
  engine_pointers:
  - current/decomp/Brutal.VulkanApi.Abstractions/StagingPool.cs
  - current/decomp/KSA/Program.cs (Render and OnPreRender order)
  - current/decomp/KSA/ImGuiBackendVulkanImpl.cs AddTexture
  lifecycle:
  - frame:draw-ui
  - frame:dispatch-solvers
  - frame:pre-render
  - render:imgui
  approaches:
  - n: 1
    title: Private one-shot command buffer and fence; StagingPool only for memory
    mod: unscience
    features:
    - mods/unscience/features/pebbles-asset-upload-submission
    technique: vulkan-buffer
    note: A StagingPool submits half-recorded work on dispose, so use it only for memory; publish after the fence and free
      after DeviceWaitIdle.
  - n: 2
    title: Mod command pool, fence ring and locked queue submit
    mod: purrtty
    features:
    - mods/purrtty/features/offscreen-imgui-context-render-to-texture
    technique: vulkan-pipeline
    note: Per-frame ring of fences; submit under the engine's queue lock.
  - n: 3
    title: Private transient pool for readback and thumbnails
    mod: unscience
    features:
    - mods/unscience/features/parts-now-thumbnail-generation
    technique: offscreen-viewport
    note: Fence wait and readback at a safe point before OnPreRender.
  - n: 4
    title: Private images, runtime GLSL, fenced submit from StarMapBeforeGui
    mod: unscience
    features:
    - mods/unscience/features/pebbles-workshop-offscreen-preview
    technique: vulkan-pipeline
    note: '[Folded from render-a-vulkan-scene-offscreen-into-imgui: offscreen-scene sub-step (own section): render a mesh
      into private colour and depth images and show the result in an ImGui window as an editor preview.] Replacing or freeing
      images ImGui still references is done in BeforeGui with WaitIdle; derivative normal mapping in the shader.'
  related:
  - free-vulkan-resources-safely
  - capture-rendered-frames
  - render-imgui-into-a-texture
  - build-a-vulkan-pipeline-for-the-scene-target
  merged_from:
  - render-a-vulkan-scene-offscreen-into-imgui
- slug: insert-a-custom-pass-into-render-game
  title: Insert a custom Vulkan pass into KSA's frame
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: KSA records one frame as a sequence of scene, resolve, bloom and composite stages. A mod can hook a stage boundary
    with a Harmony postfix or prefix, or rewrite RenderGame, to record its own draws or dispatches where depth, colour and
    light are in the state it needs.
  game_types:
  - KSA.Program
  - KSA.SuperMeshRenderSystem
  - KSA.Rendering.RenderTarget
  - KSA.SunbloomRenderer
  engine_pointers:
  - current/decomp/KSA/Program.cs RenderGame
  - current/decomp/KSA/SuperMeshRenderSystem.cs RenderMainPass, RenderTranslucencyPass
  - current/decomp/KSA.Rendering/RenderTarget.cs ResolveAttachments
  - current/decomp/KSA/SunbloomRenderer.cs Render
  - current/decomp/KSA/CommandBufferEx.cs
  lifecycle:
  - frame:render
  - render:scene-opaque
  - render:translucency
  - render:grid
  - render:bloom
  - render:post-process
  approaches:
  - n: 1
    title: Postfix RenderTarget.ResolveAttachments (post-resolve window)
    mod: unscience
    features:
    - mods/unscience/features/graffiti-projected-decal-pass
    - mods/gatos/features/sticker-projected-decals
    technique: harmony-postfix
    note: The window KSA's GridPass uses after the main view resolves; depth is sampleable. Filter to the main viewport.
  - n: 2
    title: Postfix SuperMeshRenderSystem.RenderMainPass (inside the offscreen opaque pass)
    mod: unscience
    features:
    - mods/unscience/features/thug-life-textured-quad-render-pass
    - mods/gatos/features/thug-life-world-space-quad
    technique: harmony-postfix
    note: Draws land in the already-open MSAA scene pass, depth-tested; pipeline must match the scene target formats and sample
      count.
  - n: 3
    title: Postfix SuperMeshRenderSystem.RenderTranslucencyPass with tracked barriers
    mod: purrtty
    features:
    - mods/purrtty/features/draw-after-translucency-pass-postfix
    technique: harmony-postfix
    note: Reopens a dynamic-rendering scope over the scene attachments after atmosphere, clouds and plumes so translucent
      mod content composites last.
  - n: 4
    title: Prefix SunbloomRenderer.Render to dispatch compute on the HDR scene
    mod: ksarmory
    features:
    - mods/ksarmory/features/compute-pass-before-bloom
    - mods/ksastructures/features/underground-dark-compute-pass
    technique: harmony-prefix
    note: A public method handing over the command buffer with scene colour in General layout and depth sampled, before bloom
      and tonemap, so results bloom and grade with the scene. See the dedicated compute-pass topic for the shader side.
  - n: 5
    title: Transpile Program.RenderGame around the swapchain render pass
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/rendergame-render-pass-transpiler
    - mods/shaderextensions/features/pre-imgui-post-processing
    - mods/shaderextensions/features/post-imgui-global-post-shaders
    technique: harmony-transpiler
    note: Dynamic-rendering passes are illegal inside the legacy swapchain render pass, so the mod rewrites the BeginRenderPass/End
      call sites in RenderGame to record before and after it.
  related:
  - draw-a-textured-quad-in-the-world
  - project-decals-onto-scene-geometry
  - modify-the-hdr-scene-with-a-compute-pass
  - build-a-vulkan-pipeline-for-the-scene-target
  - capture-rendered-frames
- slug: build-a-vulkan-pipeline-for-the-scene-target
  title: Build a Vulkan pipeline compatible with KSA's scene render target
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: A pipeline recorded inside KSA's scene pass must match its colour and depth formats, sample count and dynamic-rendering
    setup, and for offscreen work of the mod's own needs a render-pass-less pipeline. Several routes exist, from the game's
    own pipeline helper to a hand-built one. Also covers compiling GLSL at runtime with the game's shader utilities and includes.
  game_types:
  - KSA.Program
  - RenderCore.ShaderModuleUtils
  - RenderCore.SimpleVkMesh
  - KSA.ShaderReference
  engine_pointers:
  - current/decomp/KSA/Program.cs OffscreenTarget SetupGraphicsPipeline
  - current/decomp/KSA/CommandBufferEx.cs PipelineBarrier2
  - current/decomp/RenderCore/ShaderModuleUtils.cs FromString, FromFile
  lifecycle:
  - frame:render
  - render:scene-opaque
  - render:translucency
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: Program.OffscreenTarget.SetupGraphicsPipeline, created lazily
    mod: unscience
    features:
    - mods/unscience/features/thug-life-textured-quad-render-pass
    - mods/gatos/features/thug-life-world-space-quad
    technique: vulkan-pipeline
    note: The helper stamps dynamic-rendering formats and sample count; create lazily once render targets exist and rebuild
      after renderer rebuilds.
  - n: 2
    title: Hand-built dynamic-rendering pipeline reusing UnlitMeshVert with premultiplied alpha
    mod: purrtty
    features:
    - mods/purrtty/features/world-space-quad-pipeline-custom-shader
    technique: vulkan-pipeline
    note: Custom premultiplied-alpha fragment shader, depth test against the scene, translucency-pass compatible.
  - n: 3
    title: Private colour/depth targets with a standalone dynamic-rendering pipeline
    mod: unscience
    features:
    - mods/unscience/features/pebbles-workshop-offscreen-preview
    technique: vulkan-pipeline
    note: Not drawing into the scene at all, so the pipeline is free-standing; contrasts with approaches 1 and 2.
  related:
  - insert-a-custom-pass-into-render-game
  - draw-a-textured-quad-in-the-world
  - handle-renderer-rebuilds
  - modify-the-hdr-scene-with-a-compute-pass
  - compile-glsl-at-runtime
  - include-the-game-shader-library-in-mod-glsl
  note: 'Approaches merged into other topics: "Generate an include file at immediate load and let KSA compile .comp assets"
    -> include-the-game-shader-library-in-mod-glsl; "Embedded fragment/vertex source for a quad or preview pipeline" -> compile-glsl-at-runtime;
    "ShaderModuleUtils.FromString with a NUL-terminated debug path and game includes" -> compile-glsl-at-runtime.'
- slug: modify-the-hdr-scene-with-a-compute-pass
  title: Paint into or rescale the HDR scene with a compute pass shipped as a Shader asset
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: 'From the pre-bloom hook a mod can read the scene colour and depth and write straight back into it, drawing depth-aware
    rings, holes and tracers, relighting or darkening areas, all without a graphics pipeline. Also covers the shader-asset
    side: declaring .comp files as Shader assets so KSA compiles them from any mod folder, laying out storage image, depth
    and buffer bindings and push constants for ComputePipelineWrapper, and sizing the dispatch.'
  game_types:
  - KSA.SunbloomRenderer
  - KSA.Rendering.ComputePipelineWrapper
  - KSA.ShaderReference
  - KSA.Rendering.RenderImage
  - KSA.Rendering.BarrierBatch
  - KSA.Rendering.ImageBarrierInfo
  - KSA.Rendering.Lighting.ClusteredLightSystem
  - KSA.PrePassRenderer
  - KSA.PrePassData
  - KSA.GpuTextureSystem
  - KSA.Rendering.Lighting.LightDebug
  engine_pointers:
  - current/decomp/KSA/SunbloomRenderer.cs Render
  - current/decomp/KSA.Rendering/ComputePipelineWrapper.cs
  - current/decomp/KSA/ShaderReference.cs
  - current/decomp/KSA.Rendering.Lighting/ClusteredLightSystem.cs
  - current/decomp/KSA/PrePassRenderer.cs
  lifecycle:
  - frame:render
  - render:bloom
  - startup:asset-load
  - startup:all-mods-loaded
  - frame:draw-ui
  - frame:celestials
  approaches:
  - n: 1
    title: Depth-reading compute dispatches for rings, holes, tracers and relighting
    mod: ksarmory
    features:
    - mods/ksarmory/features/compute-pass-before-bloom
    - mods/ksarmory/features/depth-painted-ground-rings
    - mods/ksarmory/features/compute-shell-tracers
    - mods/ksarmory/features/fireball-light-injection
    - mods/ksarmory/features/burst-flash-and-view-shake
    technique: vulkan-pipeline
    note: 'KSA compiles the mod''s .comp files as Shader assets and ComputePipelineWrapper builds the pipelines; one prefix
      on the public method is the only patch. Rings lie on terrain by measuring from the depth buffer. Also (merged from shaders/ship-a-compute-shader-as-a-mod-asset
      approach 1, ".comp Shader assets in the mod XML, pipelines built through the engine wrapper"): KSArmoryParticles.xml
      declares the shaders; one wrapper per kernel; scene colour in General layout, depth sampled. See insert-a-custom-pass-into-render-game
      for the hook. Also (tune-compute-shader-constants-live-with-specialization-constants, approach "ShaderTunables with
      VkSpecializationInfo marshalled and freed after construction", ksarmory): Sub-step (folded from tune-compute-shader-constants-live-with-specialization-constants:
      Tune compute shader constants live with Vulkan specialization constants), give it its own section. Glare constants use
      ids 7-13; changing one rebuilds the pipeline with no recompile.'
  - n: 2
    title: In-place rescale using KSA's light pre-pass images
    mod: ksastructures
    features:
    - mods/ksastructures/features/underground-dark-compute-pass
    technique: vulkan-pipeline
    note: 'Priority.First prefix builds a compute wrapper over colour, depth and light pre-pass images and rescales each pixel
      by the share of light that did not come from ambient. Also (merged from shaders/ship-a-compute-shader-as-a-mod-asset
      approach 2, "A single darkening kernel over colour, depth and light images"): KSAStructuresDark.comp, a minimal in-place
      kernel; leaves a compute write-to-read barrier for other mods. Also (read-the-light-prepass-irradiance-in-a-compute-shader,
      approach "Rescale each pixel by the share of light not from ambient", ksastructures): Sub-step (folded from read-the-light-prepass-irradiance-in-a-compute-shader:
      Read KSA''s light pre-pass irradiance in a mod compute shader), give it its own section. Reads _diffuseIrradianceImage
      and _specularIrradianceImage; Priority.First prefix so the result is in place for other mods.'
  - n: 3
    title: Add a fireball's diffuse term where the pre-pass culled it beyond about 3 km
    mod: ksarmory
    features:
    - mods/ksarmory/features/fireball-light-injection
    technique: reflection
    note: 'Folded from shaders/ship-a-compute-shader-as-a-mod-asset approach 3: The point light itself goes through the public
      LightDebug list; the dispatch fills in the culled range.'
  related:
  - insert-a-custom-pass-into-render-game
  - build-a-vulkan-pipeline-for-the-scene-target
  - project-decals-onto-scene-geometry
  - include-the-game-shader-library-in-mod-glsl
  - check-mod-shaders-offline-with-glslang
  - add-dynamic-lights-to-the-world
  merged_from:
  - ship-a-compute-shader-as-a-mod-asset
  - tune-compute-shader-constants-live-with-specialization-constants
  - read-the-light-prepass-irradiance-in-a-compute-shader
- slug: handle-renderer-rebuilds
  title: Recreate mod render targets when KSA rebuilds its renderer
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: KSA recreates swapchain-sized targets on resize, MSAA changes and high-resolution screenshots; mod pipelines and
    images tied to those extents must be rebuilt at the same point or they render into stale targets.
  game_types:
  - KSA.Program
  - Core.Renderer
  - KSA.Rendering.RenderTarget
  engine_pointers:
  - current/decomp/KSA/Program.cs RebuildRenderer
  - current/decomp/Core/Renderer.cs ExtentOverride
  lifecycle:
  - frame:prepare
  - frame:render
  - frame:post-render
  approaches:
  - n: 1
    title: Postfix Program.RebuildRenderer plus a first-frame schedule and per-frame extent check
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/renderer-rebuild-hook
    technique: harmony-postfix
    note: Rebuild is called from PrepareFrame, Render, PostRender and ScreenshotCapture; ExtentOverride must be honoured.
  - n: 2
    title: Rebuild targets in place on a live size change
    mod: purrtty
    features:
    - mods/purrtty/features/vulkan-resource-teardown-discipline
    technique: vulkan-texture
    note: Stops recording, rebuilds when the size changes, frees the old after frames in flight.
  - n: 3
    title: Re-create the private material pipeline on the renderer-rebuild event
    mod: unscience
    features:
    - mods/unscience/features/pebbles-private-clutter-materials
    technique: vulkan-pipeline
    note: Private buffers and pipeline variants re-created after rebuild.
  related:
  - free-vulkan-resources-safely
  - build-a-vulkan-pipeline-for-the-scene-target
  - capture-rendered-frames
- slug: free-vulkan-resources-safely
  title: Free mod-owned Vulkan resources without device loss
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: The GPU may still read an image or buffer for several frames after the mod stops referencing it; stop recording
    first, free after frames in flight or WaitIdle, and never touch the destroyed device at game exit.
  game_types:
  - RenderCore.SimpleVkTexture
  - KSA.ImGuiBackendVulkanImpl
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/ImGuiBackendVulkanImpl.cs RemoveTexture
  - current/decomp/KSA/Program.cs (MaxFramesInFlight and shutdown order)
  lifecycle:
  - frame:draw-ui
  - frame:render
  - frame:prepare
  approaches:
  - n: 1
    title: Stop recording now, free two frames later after WaitIdle; nullable images; no device work in unload
    mod: purrtty
    features:
    - mods/purrtty/features/vulkan-resource-teardown-discipline
    - mods/purrtty/features/kitty-graphics-as-imgui-vulkan-textures
    technique: vulkan-texture
    note: Rebuilds targets in place on live resize and treats StarMapUnload as no-device territory.
  - n: 2
    title: Retire by MaxFramesInFlight + 1 frames
    mod: gatos
    features:
    - mods/gatos/features/clutter-texture-override
    technique: deferred-destruction
    note: Counter-based retirement of replaced textures with no explicit idle.
  - n: 3
    title: Publish new GPU resources after a fence, retire old ones after WaitIdle
    mod: unscience
    features:
    - mods/unscience/features/pebbles-asset-upload-submission
    - mods/unscience/features/sphinx-uv-texture-overrides
    - mods/unscience/features/pebbles-workshop-offscreen-preview
    technique: vulkan-buffer
    note: Buffer and image swaps while frames are in flight; ImGui-referenced images handled in BeforeGui.
  related:
  - handle-renderer-rebuilds
  - show-an-image-in-imgui
  - submit-your-own-vulkan-commands
- slug: capture-rendered-frames
  title: Capture rendered frames from KSA
  kind: howto
  group: vulkan-passes
  batch: rendering-1
  summary: Grab the finished scene for streaming or automated visual testing without stalling the GPU, by recording a copy
    in the frame command buffer and reading it back when the staging slot is reused. Also covers rendering part thumbnails
    at runtime with the game thumbnail pipeline. Driving KSA's own ScreenshotCapture lives in take-screenshots-from-code.
  game_types:
  - KSA.Program
  - KSA.ScreenshotCapture
  - Core.Renderer
  - KSA.Rendering.ThumbnailCreator
  - KSA.Rendering.Thumbnails.ThumbnailDynamic
  - KSA.PartThumbnailViewport
  engine_pointers:
  - current/decomp/KSA/Program.cs RenderGame (final End)
  - current/decomp/KSA/ScreenshotCapture.cs
  - current/decomp/Core/Renderer.cs ExtentOverride
  - current/decomp/KSA.Rendering/ThumbnailCreator.cs
  - current/decomp/KSA.Rendering.Thumbnails/ThumbnailDynamic.cs
  - current/decomp/KSA/PartThumbnailViewport.cs
  lifecycle:
  - frame:render
  - frame:post-render
  - thread:background
  - frame:draw-ui
  - frame:pre-render
  approaches:
  - n: 1
    title: Transpiler before the final End(), blit into per-slot staging buffers, readback on slot reuse
    mod: gatos
    features:
    - mods/gatos/features/screen-stream-frame-capture
    technique: harmony-transpiler
    note: No stall; encoder runs on a background thread with the Kitty graphics protocol and a fixed image id.
  - n: 2
    title: ThumbnailCreator framing plus ThumbnailDynamic per-frame submit, two parts per frame
    mod: unscience
    features:
    - mods/unscience/features/parts-now-thumbnail-generation
    technique: offscreen-viewport
    note: '[Folded from render-part-thumbnails-at-runtime: thumbnail sub-step (own section): render a runtime part thumbnail
      with the game''s thumbnail viewport framing and read it back.] Shares the offscreen viewport with the hover preview,
      submits before OnPreRender, private transient command pool with fence wait, GPU image readback.'
  related:
  - insert-a-custom-pass-into-render-game
  - handle-renderer-rebuilds
  - submit-your-own-vulkan-commands
  - grow-game-gpu-buffers-for-runtime-content
  - take-screenshots-from-code
  merged_from:
  - render-part-thumbnails-at-runtime
  note: 'Approaches merged into other topics: "Drive KSA''s ScreenshotCapture for clean, scripted frames" -> take-screenshots-from-code.'
- slug: project-world-positions-to-screen
  title: Project world and sky positions to screen pixels and point at off-screen targets
  kind: howto
  group: overlays
  batch: rendering-1
  summary: Turn a position in the game's frames into an ImGui screen coordinate, including the cases the engine call does
    not handle for you - behind the camera, off the edge, inside the viewport's pixel offset and far-away directions that
    are not real points. Also covers hiding overlay points behind planets and vessels with a CPU ray-sphere occlusion test,
    since ImGui has no depth buffer. Also covers culling points behind the camera and breaking polylines at them, and edge
    cues for targets that are off screen.
  game_types:
  - KSA.Camera
  - KSA.IViewport
  - KSA.Program
  - KSA.GalacticPlane
  - KSA.IOrbiter
  - KSA.IParentBody
  - KSA.StellarBody
  - KSA.Vehicle
  - KSA.ViewportRegistry
  - KSA.IGameViewport
  - Brutal.ImGuiApi.ImGuiViewportPtr
  engine_pointers:
  - current/decomp/KSA/Camera.cs EgoToScreen, EclToScreen, EgoToClip, IsPointWithinFov, GetPositionEgo
  - current/decomp/KSA/Universe.cs DrawGalacticGrid (stock reference for skipping NaN and clipping)
  - current/decomp/KSA/Camera.cs GetPositionEgo
  - current/decomp/KSA/IOrbiter.cs Parent
  - current/decomp/KSA/Camera.cs EclToScreen, EgoToScreen, EgoToClip, IsPointWithinFov, GetPositionEgo
  - current/decomp/KSA/Camera.cs EgoToClip, IsPointWithinFov, EgoToScreen
  lifecycle:
  - frame:draw-ui
  approaches:
  - n: 1
    title: Body-fixed or orbit-relative anchors lifted to ecliptic, then Camera.EclToScreen
    mod: ksarmory
    features:
    - mods/ksarmory/features/world-anchored-screen-markers
    - mods/ksa-deltavmap/features/map-mode-transfer-overlay
    - mods/ksagolf/features/cursor-picking-and-terrain-ray
    - mods/ksa-advancedflightcomputer/features/guidance-panel-and-overlays
    technique: imgui-drawlist
    note: 'Real points are projected through the viewport''s own camera; constant-pixel-size brackets, a crossed variant when
      the target is behind a planet and an edge arrow when it is off-screen. Map mode computes parent CCE positions from Orbit
      and lifts them with GetPositionEclFromCce. Also (merged from ui/project-world-to-screen approach 1, "EclToScreen/EgoToScreen
      on the viewport''s camera"): Ignore-behind option plus the viewport offset; Ego anchoring via GetPositionEgo. Also (merged
      from ui/project-world-to-screen approach 3, "CCI and body-fixed points through the main camera" [ksa-advancedflightcomputer]):
      Projecting orbit-frame points for a trajectory overlay. Also (merged from ui/project-world-to-screen approach 4, "Direction
      arrows and transfer overlay in the map view" [ksa-deltavmap]): Borrowed from flight-and-orbits. GetPositionEclFromCce
      plus Camera.EclToScreen and a fixed-length screen arrow for a world direction.'
  - n: 2
    title: Ego-space direction times a sphere radius, then Camera.EgoToScreen plus viewport origin
    mod: ohmystars
    features:
    - mods/ohmystars/features/sky-overlay-lines-and-labels
    technique: sky-projection
    note: 'Sky directions have no distance, so they are placed on the same 19.5-unit camera-centred sphere the star sprites
      use; NaN results (behind the camera) are skipped and the ImGui main viewport origin is added. Straight screen segments
      between projected endpoints are exact great circles under perspective. Also (merged from camera/work-in-the-cameras-ego-frame
      approach 3, "Direction times a camera-centred sphere radius"): Borrowed from rendering. Sky directions are placed on
      a sphere around the camera (radius 19.5 for stars), so parallax does not matter.'
  - n: 3
    title: Behind-camera NaN culling with polyline breaking
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/overlay-drawlist-rendering
    technique: imgui-drawlist
    note: Behind-camera projections return NaN; split lines instead of drawing across the screen.
  - n: 4
    title: Clip-space edge clamp for off-screen and behind-camera targets
    mod: compendium
    features:
    - mods/compendium/features/body-pointer-overlay
    - mods/ohmystars/features/star-pointer
    technique: imgui-drawlist
    note: 'IsPointWithinFov first, otherwise EgoToClip divided by w with the sign flipped for w<0 and scaled to the viewport
      rectangle. This is the reusable core of a pointer to anything not currently visible. Also (merged from ui/project-world-to-screen
      approach 5, "EgoToClip, divide by W, flip when behind, clamp to the NDC square" [ohmystars]): IsPointWithinFov first,
      then clip-space direction normalisation; the pointer line runs from the nearest window corner. Sub-step to give its
      own section: clamping a marker or pointer line to the screen edge for off-screen or behind-camera targets.'
  - n: 5
    title: Edge cue from the camera basis (bearing), not the projection
    mod: ksarmory
    features:
    - mods/ksarmory/features/world-anchored-screen-markers
    - mods/ksarmory/features/gunner-sight-overlay
    technique: imgui-drawlist
    note: Robust when the projection is degenerate near the camera plane.
  - n: 6
    title: Per-frame ego-space sphere list and ray test per overlay point
    mod: ohmystars
    features:
    - mods/ohmystars/features/overlay-occlusion-by-bodies
    technique: cpu-occlusion
    note: '[Folded from occlude-overlays-behind-bodies: visibility sub-step (own section): CPU ray-sphere test so overlays
      hide behind planets.] Bodies by MeanRadius and vehicles by bounding sphere, walked from the camera-followed object up
      to the root via IOrbiter.Parent and down via IParentBody.Children. Covers the cost trade-offs and the spheres to skip.'
  related:
