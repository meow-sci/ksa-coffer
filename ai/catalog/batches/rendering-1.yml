- slug: choose-a-render-frame-and-anchor-effects
  title: Choose a render frame and anchor effects to bodies, parts and terrain
  kind: howto
  group: overlays
  batch: rendering-1
  summary: Ecl positions keep the 29.8 km/s orbital carrier and move hundreds of metres per frame; ego positions are camera-relative
    translations of Ecl. Pick the right frame and sample instant or an overlay will lag, jitter or drift from the craft it
    should hug. Also covers keeping effects fixed to a rotating planet and anchoring stickers and decals to parts, cloth or
    terrain so they follow every frame.
  game_types:
  - KSA.Camera
  - KSA.Vehicle
  - KSA.GizmosRenderer
  - KSA.PartModel
  - KSA.Celestial
  - KSA.ExplosionSystem
  - KSA.ParticleEmitter
  - KSA.StaticMeshRenderable
  - KSA.Part
  - KSA.PartTree
  - KSA.Cursor
  engine_pointers:
  - current/decomp/KSA/Camera.cs GetPositionEgo, EclToEgo
  - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
  - current/decomp/KSA/GizmosRenderer.cs
  - current/decomp/KSA/ExplosionSystem.cs SpawnPreset (BubbleOrigin)
  - current/decomp/KSA/Celestial.cs (body-fixed frame helpers)
  - current/decomp/KSA/Part.cs
  - current/decomp/KSA/Cursor.cs GetEgoRay
  - current/decomp/KSA/Part.cs RayCastEgo
  lifecycle:
  - frame:draw-ui
  - frame:apply-solvers
  - frame:render
  - frame:celestials
  - frame:pre-render
  - frame:input
  approaches:
  - n: 1
    title: Two-instant draw anchor against GetPositionEgo
    mod: ksagolf
    features:
    - mods/ksagolf/features/frame-epoch-draw-anchor
    technique: reference-frames
    note: Pair the craft's rendered Ego position sampled this frame with Ecl offsets measured against the same-instant platform
      sample, so overlays do not slide 500 m per frame.
  - n: 2
    title: Anchor to the engine's own render position and add travel since launch
    mod: ksarmory
    features:
    - mods/ksarmory/features/gizmo-world-overlays
    - mods/ksarmory/features/rounds-as-hidden-launcher-subparts
    technique: ego-anchor
    note: Gizmos and projectile subparts placed relative to where the engine draws the launcher, with Ego a pure translation
      of Ecl; shows when to use Ecl at GetElapsedTime versus the rendered sample.
  - n: 3
    title: Explosion presets with a BubbleOrigin fixed in the body frame
    mod: ksarmory
    features:
    - mods/ksarmory/features/ksa-explosions-from-a-point
    technique: body-fixed-anchor
    note: '[Folded from keep-effects-fixed-to-a-rotating-body: body-fixed anchoring sub-step (own section): effects, emitters
      and meshes stay on a rotating planet.] Anchored to the ground the burst happened over rather than the target craft;
      ambient pressure fed to the pressure-gated stages.'
  - n: 4
    title: Pooled emitters re-anchored to the celestial's rotating frame every frame
    mod: ksarmory
    features:
    - mods/ksarmory/features/pooled-particle-emitters
    technique: emitter-reanchoring
    note: '[Folded from keep-effects-fixed-to-a-rotating-body: body-fixed anchoring sub-step (own section): effects, emitters
      and meshes stay on a rotating planet.] Re-point following emitters each frame so smoke stays on the rotating body.'
  - n: 5
    title: Body-fixed mesh with Ccf-to-Cce rotation and body position at draw time
    mod: ksagolf
    features:
    - mods/ksagolf/features/mod-mesh-draw-hook
    technique: runtime-mesh-draw
    note: '[Folded from keep-effects-fixed-to-a-rotating-body: body-fixed anchoring sub-step (own section): effects, emitters
      and meshes stay on a rotating planet.] Course pieces and ball are stored body-fixed and turned into per-viewport ego
      transforms in the draw hook.'
  - n: 6
    title: Part-local, cloth-barycentric or geodetic anchors with double-precision composition
    mod: unscience
    features:
    - mods/unscience/features/graffiti-decal-anchoring
    technique: double-precision-transforms
    note: '[Folded from anchor-rendered-objects-to-parts-and-terrain: part/cloth/terrain anchoring sub-step (own section):
      anchors that survive staging, docking and floating-origin shifts.] Stable ids re-resolved each frame and a decal-to-ego
      box recomposed in double precision; follows staging, parachute inflation and planet rotation.'
  related:
  - draw-world-space-lines-and-gizmos
  - spawn-particle-effects
  - draw-mod-meshes-with-the-engine-renderers
  - project-decals-onto-scene-geometry
  - draw-a-textured-quad-in-the-world
  - pick-objects-under-the-cursor
  - ray-cast-against-vessel-meshes-and-terrain
  merged_from:
  - choose-ecl-or-ego-positions-for-rendering
  - keep-effects-fixed-to-a-rotating-body
  - anchor-rendered-objects-to-parts-and-terrain
  note: 'Approaches merged into other topics: "Ray.RaycastWatertight plus terrain march and bisection" -> pick-objects-under-the-cursor;
    "Attach a quad via the part''s ego matrix" -> draw-a-textured-quad-in-the-world; "Part transform times user offset in
    ego space, or a view-space billboard" -> draw-a-textured-quad-in-the-world; "Armed placement mode casting against cloth
