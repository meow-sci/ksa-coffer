  - write-a-post-processing-fragment-shader
  - bend-the-picture-with-crt-curvature-and-chromatic-aberration
  - blur-the-screen-with-a-separable-gaussian
  - send-push-constants-to-a-shaderextensions-shader
  merged_from:
  - chain-post-processing-passes
- slug: choose-pre-or-post-imgui-post-processing
  title: Choose between pre-ImGui (HDR scene) and post-ImGui (final frame) post-processing
  kind: howto
  group: post-processing
  batch: shaders-1
  summary: A PostProcessingShader runs on the linear HDR scene before the tonemap composite, a GlobalPostShader on the finished
    swapchain image including the UI. The choice decides colour range, whether the UI is affected, how CMAA2 interacts and
    what image layout the shader inherits.
  game_types:
  - KSA.Program
  - KSA.Rendering.RenderTarget
  - KSA.Rendering.PostProcessing.Cmaa2Renderer
  - KSA.ScreenshotCapture
  - Core.Renderer
  engine_pointers:
  - current/decomp/KSA/Program.cs RenderGame (offscreen target, swapchain render pass, RenderFinalComposite)
  - current/decomp/KSA.Rendering.PostProcessing/Cmaa2Renderer.cs
  - current/decomp/KSA.Rendering/RenderTarget.cs
  lifecycle:
  - frame:render
  - render:post-process
  - render:aa
  - render:imgui
  approaches:
  - n: 1
    title: Pre-ImGui chain on the RGBA16F offscreen scene, copied back before tonemap
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/pre-imgui-post-processing
    - mods/mpfx/features/effect-chain-assets
    technique: post-processing
    note: HDR values above 1.0 survive, UI untouched. Invisible when CMAA2 is active and leaves the image in a transfer layout,
      by reading 5554. Colour grading, bloom-like and blur effects belong here.
  - n: 2
    title: Post-ImGui chain on the presented image via swapchain copies
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/post-imgui-global-post-shaders
    - mods/shaderextensions/features/cross-pass-image-references
    technique: post-processing
    note: Scene plus UI in display-referred colour; the swapchain lacks TRANSFER_DST in 5554 so the mod copies to a tracked
      target and back in PresentSrcKHR. Use for film grain, CRT curvature and anything that must cover the UI; can sample
      the pre-UI image by reference.
  related:
  - write-a-post-processing-fragment-shader
  - insert-a-custom-pass-into-render-game
  - capture-rendered-frames
  - refract-and-distort-the-scene
  - declare-post-processing-shader-assets-in-xml
- slug: feed-uniform-buffers-to-a-shaderextensions-shader
  title: Feed a ShaderExtensions shader from C# with uniform buffers (std140)
  kind: howto
  group: post-processing
  batch: shaders-1
  summary: Define a C# struct matching a GLSL std140 uniform block, register it as an XML element, and write it from the mod
    each frame. Covers std140 padding (vec4 arrays, mat4 columns), Span, pointer and BufferEx lookups, and sharing one buffer
    across several shaders by Id. Also covers integrating by attribute name with no assembly reference to ShaderExtensions,
    and how the host allocates and persistently maps the buffer (HostVisible and HostCoherent, one copy versus two frames
    in flight).
  game_types:
  - KSA.KeyHash
  - KSA.LookupCollection
  - Brutal.VulkanApi.Abstractions.BufferEx
  - Brutal.VulkanApi.Abstractions.MappedMemory
  - Brutal.Numerics.float4x4
  - KSA.SerializedId
  - Core.Renderer
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/KeyHash.cs
  - current/decomp/Brutal.VulkanApi.Abstractions/BufferEx.cs
  - current/decomp/KSA/Program.cs Main (host patches it to run AssetEx.Init)
  - current/decomp/KSA/Program.cs RebuildRenderer
  lifecycle:
  - startup:starmap-before-main
  - startup:asset-load
  - frame:draw-ui
  - render:post-process
  - frame:render
  - frame:prepare
  approaches:
  - n: 1
    title: Pack = 1 structs with manual std140 padding, one block per effect
    mod: mpfx
    features:
    - mods/mpfx/features/duck-typed-buffer-structs
    - mods/mpfx/features/separable-gaussian-blur
    - mods/mpfx/features/color-grading-math
    technique: vulkan-buffer
    note: 'float arrays packed into vec4, float4x4 rows become mat4 columns, blur weights computed on the CPU into an int
      plus vec4[6] block. KeyHash.Make(Id) lookups return the mapped span. Also (use-shaderextensions-without-referencing-its-assembly,
      approach "Private SxUniformBuffer/SxPushConstant attribute copies and delegate fields", mpfx): Sub-step (folded from
      use-shaderextensions-without-referencing-its-assembly: Integrate with ShaderExtensions by attribute name, with no assembly
      reference), give it its own section. Attributes declared in the provider''s namespace, matched by name; registration
      happens before Program.Main so XML elements exist when assets load.'
  - n: 2
    title: Share one buffer across passes (Size owns it, Id references it)
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/custom-uniform-buffers
    - mods/mpfx/features/effect-chain-assets
    technique: vulkan-buffer
    note: 'Pre and post variants of an effect read one block so the UI writes once; how ownership and reference elements resolve
      at bind time. Also (create-a-persistently-mapped-uniform-buffer, approach "Consumer-declared buffer owned through an
      XML Size", shaderextensions): Sub-step (folded from create-a-persistently-mapped-uniform-buffer: Create and update a
      persistently mapped uniform buffer), give it its own section. The host allocates and maps; mods only receive a Span
      or pointer.'
  - n: 3
    title: Span/pointer/BufferEx lookups beside push constants in a HUD mod
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/sx-push-constants-and-buffers
    technique: vulkan-buffer
    note: 'Lookup delegate fields injected into static members, std140 padding, and which lookup form to pick. Also (use-shaderextensions-without-referencing-its-assembly,
      approach "Same pattern with StarMapBeforeMain registration and marker callbacks", ksa-aircrafthud): Also copies the
      ImGui marker types; uses no type from ShaderExtensions.dll.'
  related:
  - send-push-constants-to-a-shaderextensions-shader
  - free-vulkan-resources-safely
  merged_from:
  - use-shaderextensions-without-referencing-its-assembly
  - create-a-persistently-mapped-uniform-buffer
- slug: send-push-constants-to-a-shaderextensions-shader
  title: Send per-frame values and time to a shader with push constants, written at the right point in the frame
  kind: howto
  group: post-processing
  batch: shaders-1
  summary: 'Use a push-constant struct for values that change every frame (time, enabled flag, strength): how it becomes a
    VkPushConstantRange, the 128-byte and 4-byte alignment limits, stage-range rules, and why push constants are captured
    at record time so passes never tear across frames in flight. Also covers switching an always-on pass off with an enabled
    flag or neutral values, and choosing the clock the shader reads: the ShaderTime block every ShaderEx set receives (frame,
    real and simulation time, warp rate), a mod-owned wall-clock accumulator, or simulation seconds smuggled through a stock
    field. Also covers when to upload: write parameter blocks from a UI or viewport hook before RenderGame records the passes,
    and rewrite large buffers only when a dirty flag is set.'
  game_types:
  - KSA.LookupCollection
  - KSA.KeyHash
  - Brutal.VulkanApi.VkDeviceExtensions
  - KSA.Program
  - KSA.Universe
  - Core.Renderer
  - Brutal.VulkanApi.Abstractions.BufferEx
  - Brutal.VulkanApi.Abstractions.MappedMemory
  engine_pointers:
  - current/decomp/KSA/KeyHash.cs
  - current/decomp/KSA/Program.cs RenderGame
  - current/decomp/KSA/Universe.cs GetElapsedTime, GetElapsedSeconds
  - current/decomp/KSA/Program.cs FrameNumber, RenderGame
  - current/decomp/Brutal.VulkanApi.Abstractions/BufferEx.cs
  - current/decomp/KSA/Program.cs RebuildRenderer
  - current/decomp/KSA/Program.cs OnFrame, RenderGame
  lifecycle:
  - startup:starmap-before-main
  - startup:asset-load
  - frame:draw-ui
  - frame:render
  - render:post-process
  - frame:viewports
  - render:atmosphere
  - frame:prepare
  approaches:
  - n: 1
    title: One push-constant element per pass with a lookup delegate field
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/sx-push-constants-and-buffers
    - mods/shaderextensions/features/push-constants
    - mods/ksa-aircrafthud/features/glass-post-process-chain
    technique: vulkan-pipeline
    note: 'SxPushConstant struct, KeyHash of the XML Id, enabled and time written every frame to three passes. Overlapping
      ranges with different stage flags need every stage in each push. Also (toggle-a-post-processing-pass, approach "Enabled
      push constant with an early pass-through branch", ksa-aircrafthud): Sub-step (folded from toggle-a-post-processing-pass:
      Turn an always-on post-processing pass on and off), give it its own section. Per-pass push constant carries enabled
      and time; uniform branch returns the input colour. Also (merged from shaders/update-shader-parameters-at-the-right-time
      approach 2, "Postfix OnFrameEditor writes enabled and time into push constants"): Runs in frame:viewports so it also
      works when the HUD is hidden; compare with the draw-ui timing.'
  - n: 2
    title: Per-side push-constant clock and strengths in a settings-driven mod
    mod: mpfx
    features:
    - mods/mpfx/features/film-grain-and-experimental-effects
    - mods/mpfx/features/duck-typed-buffer-structs
    - mods/mpfx/features/per-frame-parameter-upload
    - mods/mpfx/features/effect-shader-contract
    technique: vulkan-pipeline
    note: 'Separate pre and post clocks, optionally scaled by time warp; push constants written every frame while uniform
      buffers are written on change. Also (toggle-a-post-processing-pass, approach "Substitute neutral parameter values for
      disabled effects", mpfx): Neutral values written when an effect is unchecked; each shader reduces to a copy at neutral.
      Cost of the pass remains. Also (animate-shaders-with-game-time, approach "Own accumulated clock in a push constant,
      optionally warp-scaled", mpfx): Sub-step (folded from animate-shaders-with-game-time: Animate a shader with frame, real
      or simulation time), give it its own section. Grain should keep moving on pause, so a wall-clock accumulator, with an
      option to scale by time warp. Also (merged from shaders/update-shader-parameters-at-the-right-time approach 1, "StarMapAfterGui
      writes push constants every frame and buffers on a UI dirty flag"): Disabled effects get neutral values; settings are
      not persisted. The write happens in frame:draw-ui, the same frame RenderGame records.'
  - n: 3
    title: ShaderTime block at binding 1 of every ShaderEx set
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/shared-time-uniform-buffer
    technique: vulkan-buffer
    note: 'Frame number, RenderGame dt, Universe.GetElapsedSeconds and SimulationSpeed; which fields freeze on pause and which
      scale with warp. Also (create-a-persistently-mapped-uniform-buffer, approach "One shared time buffer rewritten from
      a RenderGame prefix", shaderextensions): Sub-step (folded from create-a-persistently-mapped-uniform-buffer: Create and
      update a persistently mapped uniform buffer), give it its own section. Rewritten each flight frame; single copy versus
      two frames in flight discussed; recreated after RebuildRenderer.'
  - n: 4
    title: Signed simulation seconds smuggled through a stock atmosphere field
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/atmosphere-uniform-side-channel
    technique: harmony-prefix
    note: Universe.GetElapsedTime is the last applied sim step; the sim clock freezes on pause and scales with warp, the wall
      clock does not.
  related:
