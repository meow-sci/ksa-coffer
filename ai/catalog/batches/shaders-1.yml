  title: Smuggle data into stock shaders through unused uniforms, state bits and sentinel values
  kind: howto
  group: stock-shaders
  batch: shaders-1
  summary: Stock shaders have fixed inputs, so a patched shader borrows ones that are free or irrelevant for the case at hand
    - unused fields in a uniform struct, spare high bits in a per-instance flag word, or a marker on the material - and decodes
    them in the patched GLSL. Also covers selecting new behaviour from out-of-range values an author would never use naturally
    (a dispatcher replacing a stock function), shipping lookup data as generated GLSL source, and clearing the atmosphere
    LUT-valid flag when the side-channel switch changes.
