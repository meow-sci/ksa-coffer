- slug: declare-post-processing-shader-assets-in-xml
  title: Declare ShaderEx, PostProcessingShader, GlobalPostShader and ImGuiShader assets
  kind: howto
  group: post-processing
  batch: shaders-1
  summary: Register shader passes entirely in mod XML - which element type to use, how Id, RenderPassId, shader paths, uniform
    buffer and push constant children fit together, and how one XML file can ship a whole chain with no C# render code. Also
    covers ordering a chain with RenderPassId and letting a later pass read an earlier pass's input or output image (PostProcessingInputReference),
    for example a blur chain whose composite still sees the unblurred scene.
  game_types:
  - KSA.ShaderReference
  - KSA.SerializedId
  - KSA.ModLibrary
  - KSA.AssetBundle
  - KSA.Rendering.RenderImage
  - KSA.Program
  - RenderCore.RenderTechnique
  engine_pointers:
  - current/decomp/KSA/ShaderReference.cs
  - current/decomp/KSA/AssetBundle.cs
  - current/decomp/KSA/Program.cs RenderGame
  - current/decomp/KSA.Rendering/RenderImage.cs
  lifecycle:
  - startup:asset-load
  - render:post-process
  approaches:
  - n: 1
    title: Paired pre- and post-ImGui assets sharing a RenderPassId and parameter buffer by Id
    mod: mpfx
    features:
    - mods/mpfx/features/effect-chain-assets
    - mods/mpfx/features/separable-gaussian-blur
    technique: xml-asset
    note: '32 assets for 16 effects, one XML element per pass, no render code in C#. Size creates a buffer and an Id alone
      references it. Also (chain-post-processing-passes, approach "Consecutive RenderPassIds, each pass samples the previous
      target", mpfx): Sub-step (folded from chain-post-processing-passes: Chain several post-processing passes in a defined
      order), give it its own section. Relies on implicit previous-image binding; ids 128-143 leave room to insert effects.'
  - n: 2
    title: A small asset file with a chain, input references and an ImGuiShader
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/glass-post-process-chain
    - mods/ksa-aircrafthud/features/imgui-window-hud-shader
    technique: xml-asset
    note: 'Three PostProcessingShader passes plus one ImGuiShader in HudAssests.xml, per-pass push constants and texture children
      in binding order. Also (chain-post-processing-passes, approach "PostProcessingInputReference to the pre-blur scene from
      a composite pass", ksa-aircrafthud): H blur, V blur, then a composite that also needs the sharp scene; binding numbers
      follow XML document order.'
  - n: 3
    title: Input and output references resolved while the chain is built
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/cross-pass-image-references
    - mods/shaderextensions/features/post-processing-pass-chain
    technique: post-processing
    note: How references are resolved, stage selection (pre or post ImGui) and why a reference to a later pass is not allowed.
  related:
