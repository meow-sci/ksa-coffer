  group: compute-effects
  batch: shaders-1
  summary: 'Fit an effect''s state into Vulkan''s guaranteed 128 bytes of push constants (octahedral unit vectors, exact integer
    flag sums with a sign discriminator), run several effects through one pipeline with a kind tag, or spill many items into
    a host-visible storage buffer. Also covers giving a custom pass the camera pose: camera-relative positions subtracted
    in double before narrowing to float, and reading the viewport''s BaseCamera rather than GetMainCamera so effects follow
    the flight view even in map mode.'
