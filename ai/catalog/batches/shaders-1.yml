- slug: bend-the-picture-with-crt-curvature-and-chromatic-aberration
  title: Bend the picture with CRT curvature and chromatic aberration
  kind: howto
  group: screen-effects
  batch: shaders-1
  summary: 'Remap UVs for barrel distortion inside a rectangle and offset colour channels by a luminance-masked amount, applied
    either to a single HUD window or to a whole canopy-glass composite. Includes the full recipe for running a custom fragment
    shader over one ImGui window: tag the draw list with a marker callback, declare an ImGuiShader asset, and how the host
    replays the window offscreen (useful when a window does not show). Also covers tagging an ImGui window''s draw data with
    a no-op marker callback so a shader pass can find and treat that window specially.'
