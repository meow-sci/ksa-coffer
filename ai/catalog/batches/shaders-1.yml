  kind: howto
  group: stock-shaders
  batch: shaders-1
  summary: One stock shader draws every body, so per-body behaviour has to be keyed on something the shader can already see.
    Two keys that work in practice are the body radius plus a value only the mod's XML writes, and per-point terrain height
    for relief-aware shading. Also covers generating the per-body data tables offline (C# payload, XML values and GLSL tables
    from one script) so the renderer and flight model agree.
