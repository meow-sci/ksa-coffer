      same function; adds a Mars dust layer and altitude-dependent Titan Rayleigh colour. Also (ship-lookup-data-inside-glsl-source,
      approach "Density tables emitted into a generated C# payload next to flight tables", realatmospheres): Sub-step (folded
      from ship-lookup-data-inside-glsl-source: Generate GLSL tables and lookup functions from an offline script), give it
