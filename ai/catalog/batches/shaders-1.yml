- slug: refract-and-distort-the-scene
  title: Refract and distort the rendered scene, and flash or shake it
  kind: howto
  group: screen-effects
  batch: shaders-1
  summary: Fake glass, heat haze, lenses and shock rings by sampling the scene at an offset. A fragment pass can use a packed
    normal/dirt mask texture; a compute pass copies the HDR scene and writes pixels back displaced by an analytic lens. Also
    covers whiteouts driven by an eye-adaptation model and view shake done by translating, rolling and zooming a scene copy,
    so nothing fights the camera.
