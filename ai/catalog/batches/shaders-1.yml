batch: shaders-1
game_loop_reference: getting-started/game-loop-and-lifecycle
category: shaders
category_description: The shader-authoring side of KSA modding - writing GLSL post-processing passes, declaring ShaderExtensions
  assets, feeding them parameters from C#, building common screen effects, compute effects in the HDR scene, and replacing
  or patching the game's own GLSL without editing game files, plus the tooling to include, compile, validate and hot-reload
  shaders.
groups:
  post-processing: 'ShaderExtensions post-processing passes: the fragment-shader contract, XML assets, pre- versus post-ImGui
    placement, uniform buffers and push constants.'
  stock-shaders: 'Changing the game''s own shaders: redirected and text-patched copies, in-memory patching at compile time,
    smuggled data, per-body branches and sky and cloud extensions.'
  glsl-workflow: 'Writing and maintaining mod GLSL: including the game''s shader library, compiling at runtime, hot reload
    in a running game and offline compile checks.'
  screen-effects: 'Ready-made full-screen effects: colour grading, blur, grain and dithering, CRT curvature on one ImGui window,
    refraction and view shake.'
  compute-effects: 'Compute-shader effects in the HDR scene: packing parameters, reconstructing positions from depth and raymarching
    local volumes.'
topics:
- slug: write-a-post-processing-fragment-shader
  title: Write a fullscreen post-processing fragment shader for KSA
  kind: howto
  group: post-processing
  batch: shaders-1
  summary: A ShaderExtensions pass is one fragment shader run over a fullscreen triangle. This covers the contract the shader
    is written against (previous image as sampler2D at set 1 binding 0, ShaderTime at binding 1, an optional parameter block
    and push constant after it, the game's global bindings at set 0) and how to port older shaders that assumed subpasses.
    Also covers how to bind extra textures and buffers (dirt masks, noise, lookup tables) by listing child elements, how the
    game's global camera and lighting set at descriptor set 0 is available to the pass, and, as background, how ShaderExtensions
    builds the pass (RenderTechnique and RenderTarget, descriptor pool and set from XML) so a shader that does not show can
    be debugged.
  game_types:
  - KSA.Program
  - KSA.GlobalShaderBindings
  - RenderCore.RenderTechnique
  - KSA.Rendering.RenderTarget
  - KSA.Rendering.ImageBarrierInfo
  - KSA.CommandBufferEx
  - KSA.RenderingPresets
  - KSA.ShaderReference
  - KSA.TextureReference
  - KSA.ModLibrary
  - KSA.FileReference
  - KSA.IBinder
  - KSA.AssetBundle
  - Brutal.VulkanApi.Abstractions.DescriptorPoolEx
  - Brutal.VulkanApi.Abstractions.DescriptorSetLayoutEx
  - KSA.Camera
  - KSA.ViewProjection
  - KSA.IGameViewport
  - KSA.ViewportRegistry
  engine_pointers:
  - current/decomp/KSA/GlobalShaderBindings.cs
  - current/decomp/KSA/ScreenspaceRenderer.cs
  - current/decomp/KSA/Program.cs RenderGame
  - current/decomp/RenderCore/RenderTechnique.cs
  - current/decomp/KSA.Rendering/RenderTarget.cs
