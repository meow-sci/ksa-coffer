    technique: glsl-shader
    note: 'UI_PP_HUD.frag remaps UV inside the window rect and offsets channels by a luminance mask; shared UI_Functions.glsl.
      Also (shade-one-imgui-window-with-a-custom-fragment-shader, approach "ImGuiShader asset plus SxImGui.CustomShader marker
      callback", ksa-aircrafthud): Sub-step (folded from shade-one-imgui-window-with-a-custom-fragment-shader: Run a custom
