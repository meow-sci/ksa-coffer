  - current/decomp/KSA/Camera.cs
  - current/decomp/KSA/ViewportRegistry.cs MainViewport
  lifecycle:
  - startup:asset-load
  - render:post-process
  - frame:render
  - frame:draw-ui
  - frame:celestials
  - render:bloom
  approaches:
  - n: 1
    title: Minimal identity-for-neutral pass (MPFX contract)
    mod: mpfx
    features:
    - mods/mpfx/features/effect-shader-contract
    - mods/shaderextensions/features/post-processing-pass-chain
    technique: glsl-shader
    note: 'ScreenspaceVert supplies Uv; binding 0 is the previous image, 1 is ShaderTime, 2 the parameter block, push constant
      optional. Write every pass so neutral parameters return the input unchanged, because a pass cannot be removed at runtime.
      Note the build-5554 dynamic-offset quirk in the pass chain. Also (give-a-mod-shader-the-camera-pose-and-global-data,
      approach "GlobalShaderBindings at set 0 of a fullscreen pass", shaderextensions): Sub-step (folded from give-a-mod-shader-the-camera-pose-and-global-data:
      Give a mod shader the camera pose and the game''s global shader data), give it its own section. The pass chain binds
      the game''s own descriptor set at slot 0, so a fragment shader can read camera and lighting data directly; no dynamic
      offsets are used in 5554.'
    other_mods:
    - shaderextensions
  - n: 2
    title: Multi-binding pass with extra textures and a dynamic-rendering port
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/glass-post-process-chain
    - mods/shaderextensions/features/shaderex-extra-bindings
    - mods/ksa-aircrafthud/features/blue-noise-dithering
    technique: glsl-shader
    note: 'Shared Functions.glsl include, extra samplers shifted past the time buffer at binding 1, and the port from the
      v0.4.0 subpass style (drop SubpassId and RequiresUniqueRenderpass). Shows why the pinned ShaderExtensions rejected the
      original. Also (bind-extra-textures-and-buffers-to-a-shader, approach "Texture and buffer children in XML document order",
      ksa-aircrafthud): Sub-step (folded from bind-extra-textures-and-buffers-to-a-shader: Bind extra textures and buffers
      to a ShaderEx shader), give it its own section. A packed normal/dirt mask and a 128x8192 stacked blue-noise PNG bound
      as extra samplers; binding numbers follow document order after fixed bindings 0 and 1.'
  - n: 3
    title: One RenderTarget as IRenderPassInfo per shader, rebuilt after RebuildRenderer
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/post-processing-pass-chain
    technique: vulkan-pipeline
    note: 'Sub-step (folded from build-a-fullscreen-pass-with-rendertechnique: Build a fullscreen shader pass with RenderTechnique
      and RenderTarget), give it its own section. A RenderTarget doubles as the pipeline''s render-pass info; GlobalShaderBindings
      supplies set 0; dynamic offset count is one too many in 5554.'
  - n: 4
    title: ShaderReference subclass with counted pool, one set and a Bind-time resolver
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/shaderex-extra-bindings
    technique: vulkan-pipeline
    note: 'Sub-step (folded from implement-a-shader-asset-type-with-its-own-descriptor-set: Implement a shader asset type
      that builds its own descriptor set from XML), give it its own section. Count per descriptor type, MaxSets 1, stackalloc
      writes. AssetBundle.OnDataLoad visits top-level entries only so nested ones are forwarded manually; Bind runs in parallel
      on the thread pool inside the Program constructor.'
