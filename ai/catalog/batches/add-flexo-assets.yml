  - category: assets
    slug: add-a-part-model-with-glb-and-pbr-textures
    title: Add a part's art with its own GLB model and PBR textures
    kind: howto
    group: models-and-textures
    batch: assets-1
    summary: "Turn a Blender export into a placeable part: a MeshAtlas for the GLB, a PbrMaterial for its textures, SubPart
      templates pairing a mesh with a material (PartModel, MeshView preview twin, PartModelGlass windows, mesh-less
      hidden subparts) and a Part that instances the subparts with Transform positions. Game data (mass, colliders,
      connectors) is the sibling topic."
    game_types:
      - KSA.PartTemplate
      - KSA.SubPartTemplate
      - KSA.PartInstance
      - KSA.PartModelModule
      - KSA.PartModelGlassModule
      - KSA.MeshViewModule
      - KSA.MeshAtlasFileReference
      - KSA.PbrMaterialReference
      - KSA.TransformReference
      - KSA.Part
    engine_pointers:
      - current/decomp/KSA/MeshAtlasFileReference.cs DoLoad
      - current/decomp/KSA/PartModelModule.cs, current/decomp/KSA/PartModelGlassModule.cs,
        current/decomp/KSA/MeshViewModule.cs
      - current/decomp/KSA/PartTemplate.cs, current/decomp/KSA/SubPartTemplate.cs
      - current/Content/Core/CoreFuelTankAAssets.xml (stock MeshView plus PartModel pattern)
    lifecycle:
      - startup:asset-load
      - tool:authoring
      - tool:build
    approaches:
      - n: 1
        title: One atlas per vehicle, one SubPart per moving body, glass and hidden subparts
        mod: ksacars
        features:
          - mods/ksacars/features/car-part-assets-glb-pbr
        technique: glb-model
        note: MeshAtlas registers every glTF mesh by name (first wins, node transforms ignored), AoRoughMetal ORM textures,
          TextureCategory Vessel, emissive channel for lights, PartModelGlass fixed 0.75 opacity with Fresnel, EditorTag
          Hidden doors, rotation in radians. Pivot recentring is covered by export-glb-from-blender-for-ksa.
      - n: 2
        title: Shared palette atlas, _VM preview twins and namespaced subpart ids
        mod: ksarmory
        features:
          - mods/ksarmory/features/weapon-part-definitions-xml
          - mods/ksarmory/features/blender-model-pipeline-and-checks
        technique: xml-asset
        note: Eleven GLB atlases, the three generated parts sharing one flat palette material, MeshView _VM twin declared beside
          PartModel as Core does, keeping KSArmory_<name>_SubPart apart from atlas mesh names so ids never collide, and
          the Assets versus GameData file split (game data detail lives in define-a-part-with-game-data).
      - n: 3
        title: Import models and author procedural meshes in a browser asset pipeline
        mod: flexo
        features:
          - mods/flexo/features/gltf-model-import
          - mods/flexo/features/mesh-atlas-and-picking-export
          - mods/flexo/features/procedural-mesh-and-surface-authoring
        technique: glb-model, geometry-normalization, mesh-simplification, procedural-geometry
        note: External browser authoring workflow; distinguish preview and export validation from native asset loading and live
          in-game verification. Cover every listed reusable mechanism with actionable source-backed steps.
    related:
      - define-a-part-with-game-data
      - define-and-animate-subparts
      - evolve-a-shipped-part-without-breaking-saves
      - export-glb-from-blender-for-ksa
      - validate-asset-xml-references
      - declare-gltf-and-pbr-material-assets
    assigned_approach: 3
    existing_topic: true
  - category: assets
    slug: declare-gltf-and-pbr-material-assets
    title: Declare glTF meshes and PBR materials in asset XML and author their texture sets
    kind: howto
    group: models-and-textures
    batch: assets-1
    summary: "Mods that only need a mesh and a look (props, course pieces, held items, ghost tints) declare bare GltfFile
      and PbrMaterial assets with no Part or StaticObject, and let code pair them by id at runtime. Covers Source, the
      Diffuse, Normal and AoRoughMetal texture children, unit conventions, see-through tint materials and sharing one
      atlas and material across many meshes. Also covers authoring the texture set: the Diffuse, Normal and AoRoughMetal
      channel rules, baking from Blender, generated palette swatches, flat-colour textures and atlas dilation so mipmaps
      do not bleed."
    game_types:
      - KSA.AssetBundle
      - KSA.Gltf2Reference
      - KSA.PbrMaterialReference
      - KSA.TextureReference
      - KSA.TexturePowerReference
      - KSA.FileReference
      - KSA.ModLibrary
      - KSA.TextureCategory
    engine_pointers:
      - current/decomp/KSA/Gltf2Reference.cs Source, Usage, Material and Image sub-references
      - current/decomp/KSA/PbrMaterialReference.cs DiffuseReference, NormalReference, PBRMap, EmissiveMap, ThinFilmMap,
        AlphaMap
      - current/decomp/KSA/TextureReference.cs Category, IsVirtual
      - current/decomp/KSA/ModLibrary.cs AllGltfs, AllMaterials
      - current/decomp/KSA/PbrMaterialReference.cs
      - current/decomp/KSA/TextureReference.cs Category, Manifest, DoLoad
      - current/Content/Core/Textures (stock channel conventions)
      - current/decomp/KSA/TextureReference.cs (mip generation and KTX path)
    lifecycle:
      - startup:asset-load
      - startup:all-mods-loaded
      - tool:authoring
      - tool:build
    approaches:
      - n: 1
        title: Bare GltfFile and PbrMaterial assets, one shared atlas and material for many meshes
        mod: ksagolf
        features:
          - mods/ksagolf/features/prop-and-course-asset-xml
        technique: xml-asset
        note: "Props authored in centimetres, course pieces in metres, ModLibrary.Get by id after asset load. Show the XML for a
          mesh, an opaque material and a translucent ghost material, and the two required-channel gotcha (Diffuse,
          Normal and AoRoughMetal are dereferenced without a null check, see author-pbr-texture-sets). Also: Twelve
          course pieces share one texture atlas and one PbrMaterial, and ghost tints reuse every piece glTF with
          single-colour materials; id naming scheme, PieceCatalogue mapping each piece to its glTF id, chiral pieces as
          a separate mirrored glTF, and the mip bleed risk that makes atlas dilation matter. Sub-step for the writer:
          the PBR channel rules (Diffuse, Normal and AoRoughMetal mandatory, R occlusion G roughness B metalness,
          TextureCategory sets the size cap) get their own section here, absorbed from author-pbr-texture-sets."
      - n: 2
        title: Bake diffuse, normal, ORM and emissive maps from Blender and dilate the atlas
        mod: ksacars
        features:
          - mods/ksacars/features/car-part-assets-glb-pbr
          - mods/ksacars/features/art-and-audio-pipeline-tooling
          - mods/unscience/features/parts-now-bundle-validation
          - mods/ksagolf/features/glb-authoring-and-mesh-checks
        technique: glb-model
        note: "Bake recipes from the ksa-blender skill (diffuse without lighting, metalness routed through emission), ORM
          channel order, Category Vessel, PNG in every slot, and the validator rule that rejects a material with a
          missing mandatory channel before it crashes the renderer. Also: dilate-atlas.py --key 0,255,0 over the baked
          PNGs; run it between bake and export, after the UV layout is frozen; measured numbers on how much of a
          neighbouring island a margin overwrote. Sub-step for the writer: dilating the atlas between bake and export
          (absorbed from dilate-baked-texture-atlas) gets its own section so lower mips do not bleed neighbouring
          islands."
      - n: 3
        title: Generated flat-swatch palette atlas with a JSON swatch map
        mod: ksarmory
        features:
          - mods/ksarmory/features/blender-model-pipeline-and-checks
        technique: palette-atlas
        note: palette.py writes Diffuse, PBR and Normal PNGs as a 4x4 grid of 128 px swatches plus palette.json with each
          swatch's UV centre; box-projecting faces into a swatch gives untextured hard-surface parts a full PBR set.
      - n: 4
        title: Flat-colour textures emitted by a geometry script
        mod: ksastructures
        features:
          - mods/ksastructures/features/generated-deep-ramp
        technique: code-generation
        note: numpy and Pillow write the swatch textures alongside the generated atlas, so the mesh, its UVs and its textures
          come from one script and cannot drift.
      - n: 5
        title: Author PBR textures and bake emissive paint into native material assets
        mod: flexo
        features:
          - mods/flexo/features/material-and-ktx2-pipeline
          - mods/flexo/features/emissive-paint-and-ramp-baking
        technique: xml-asset, ktx2-texture, channel-packing, texture-painting, texture-compositing
        note: External browser authoring workflow; distinguish preview and export validation from native asset loading and live
          in-game verification. Cover every listed reusable mechanism with actionable source-backed steps.
    related:
      - asset-xml-element-reference
      - attach-a-prop-to-a-kitten-bone
