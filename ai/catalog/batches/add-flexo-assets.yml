  - category: vehicles-and-parts
    slug: define-and-animate-subparts
    title: Define articulated subparts and mounts, animate and hide them from code
    kind: howto
    group: parts
    batch: vehicles-and-parts-1
    summary: "Export one SubPart per moving body recentred on its pivot, then write the parent-relative transform every
      frame (and reset cached matrices) for wheels, arms, turrets, mounts and gimbals. Covers chains XML cannot nest,
      rate limits and roll-nod pointing. Also covers: Hide subparts and fly them as projectiles of their launcher."
    game_types:
      - KSA.Part
      - KSA.SubPartTemplate
      - KSA.PartTree
      - KSA.SubPart
      - KSA.KeyframeAnimationData
    engine_pointers:
      - current/decomp/KSA/Part.cs PositionParentAsmb, Asmb2ParentAsmb, ResetCachedPosMatrixValues
      - current/decomp/KSA/SubPartTemplate.cs
      - current/decomp/KSA/Part.cs Scale, PositionParentAsmb
    lifecycle:
      - startup:asset-load
      - frame:draw-ui
      - frame:after-on-frame
      - frame:celestials
      - frame:viewports
      - tool:authoring
      - tool:build
    approaches:
      - n: 1
        title: Pose wheels, arms and blades from StarMapAfterGui with a hidden-UI fallback
        mod: ksacars
        features:
          - mods/ksacars/features/pose-subparts-at-runtime
          - mods/ksacars/features/car-part-assets-glb-pbr
        technique: starmap-lifecycle
        note: 'Author the subparts in the GLB/XML, then FrameLatch plus StarMapAfterOnFrame fallback; hiding a subpart. Also
          (merged from rendering/animate-subparts-from-code approach 1, "Write transforms and reset caches from
          StarMapAfterGui with a frame latch"): Wheels, coil-overs, steering wheel, iris blades; FrameLatch with a
          StarMapAfterOnFrame fallback when the HUD is hidden.'
      - n: 2
        title: Articulated turret mounts, rate-limited, with sibling chains
        mod: ksarmory
        features:
          - mods/ksarmory/features/articulated-mount-subparts
        technique: subpart-transform-write
        note: Pods and arrays are siblings composed by the mod; latch on refusal.
      - n: 3
        title: Optical director heads with roll-nod gimbals
        mod: ksarmory
        features:
          - mods/ksarmory/features/optical-director-heads
        technique: gimbal-geometry
        note: Roll about the centreline, nod within it, keyhole kept out of the command.
      - n: 4
        title: Scale-to-hide and parent-frame transform writes
        mod: ksarmory
        features:
          - mods/ksarmory/features/rounds-as-hidden-launcher-subparts
          - mods/ksarmory/features/articulated-mount-subparts
        technique: scale-to-hide
        note: '[folded from hide-show-and-fly-subparts-as-projectiles: give it its own section] Anchor to the tube and add
          travel since launch. Also (merged from rendering/animate-subparts-from-code approach 2, "Projectiles as hidden
          launcher subparts placed at the simulated position"): Transform in Ego relative to the tube plus travel since
          launch; sim/render split.'
      - n: 5
        title: Author and import keyframe clips and bake native GLB animations
        mod: flexo
        features:
          - mods/flexo/features/keyframe-animation-authoring
          - mods/flexo/features/animation-import-and-linear-baking
        technique: glb-model, keyframe-animation, matrix-composition, animation-baking, curve-fitting
        note: External browser authoring workflow; distinguish preview and export validation from native asset loading and live
          in-game verification. Cover every listed reusable mechanism with actionable source-backed steps.
