mod: ksa-advancedflightcomputer
repo: KSA-AdvancedFlightComputer
ref: 77c0ccf5608e49c459eec72c3a56d0b30d62da63
summary: >-
  AdvancedFlightComputer (AFC) is a large StarMap mod by Maximilian Nesslauer, with powered guidance
  originally written by Oliver Cairns (cairn5) as PoweredGuidance, that extends the stock flight
  computer and Transfer Planner instead of replacing them. Planning features add plan types, flyby
  periapsis targeting, multi-pass burn splitting and hyperbolic (interstellar comet) targets to the
  stock planner and create ordinary stock burns; execution features hook the stock Auto burn path for
  RCS-only burns, automatic staging with delays and spent-booster drop, and removal of finished burns;
  closed-loop guidance (UPFG and convex SCvx ascent, boostback with impact prediction and glide
  steering, G-FOLD and 6-DOF SCvx landing, terminal hover) flies vehicles through the stock flight
  computer from a Vehicle.PrepareWorker prefix, using vendored Clarabel and SCS native solvers. About
  30 Harmony patch targets are applied per feature after validated reflection, and the repo ships a
  HeadlessHarness test mod, game-free console checks against Python references, a native ABI check and
  CI built against private reference assemblies.
