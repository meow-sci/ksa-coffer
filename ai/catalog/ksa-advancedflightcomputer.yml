    howto_topics:
      - slug: steer-descent-with-angle-of-attack
        title: "Steer an unpowered descent onto a target with angle of attack"
        note: "impact miss -> lift via a velocity Jacobian; invert the measured lift curve"
      - slug: aerodynamic-lift-model
        title: "Read lift and drag coefficients of a vehicle under the active aero model"
        note: "sample the game force function; sign of CL/CD tells which way to tilt"
      - slug: zero-effort-miss-guidance
