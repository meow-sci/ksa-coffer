  - slug: resolve-overloaded-and-byref-game-methods
    title: Resolve the right overload when patching or reflecting
    summary: "Name-only lookups bind to the wrong method or none. How Harmony and AccessTools choose: explicit parameter arrays with MakeByRefType for in, ref and out parameters, the default binder accepting an argument type assignable to the parameter type (so a patch written against IGameViewport can bind the IViewport overload), and TargetMethods with per-name lookups and __args for private or overloaded targets."
    game_types: [KSA.PhysicsStates, KSA.Astronomical, KSA.IViewport, KSA.IGameViewport, KSA.PhysicsBubble, KSA.KittenEva]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives (static plus two instance forwarders)
      - current/decomp/KSA/Astronomical.cs ShouldDrawLines overloads
      - current/decomp/KSA/IGameViewport.cs (extends IViewport)
      - current/decomp/KSA/PhysicsBubble.cs ApplyMmuAttitudeTarget, ResetMmuAttitudeTarget
    lifecycle: [startup:all-mods-loaded, startup:immediate-load]
    approaches:
      - n: 1
        title: Explicit parameter arrays with MakeByRefType
        mod: ksaero
        features: [mods/ksaero/features/computedrag-call-site-transpiler, mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: reflection
        note: "ComputeDerivatives exists three times (static 10-parameter body and two instance forwarders); by-ref parameters in IL are all by-reference. An explicit list also stops a later overload with the same name from being picked."
      - n: 2
        title: Attribute argument types bind by assignability
        mod: compendium
        features: [mods/compendium/features/orbit-line-visibility-and-color]
        technique: harmony-postfix
        note: "HarmonyPatch lists (Astronomical, IGameViewport, Orbit) but build 5554 has ShouldDrawLines(Astronomical, IViewport, Orbit?); Type.GetMethod's default binder accepts the assignable type, so it binds. Risk: a future overload accepting IGameViewport changes the binding, so list the exact parameter type."
      - n: 3
        title: TargetMethods with per-name AccessTools lookups and __args
        mod: ohmystars
        features: [mods/ohmystars/features/attitude-mode-handoff-patches]
        technique: harmony-target-methods
        note: "Private static ApplyMmuAttitudeTarget and ResetMmuAttitudeTarget resolved in TargetMethods, state read from __args[0]; string-named targets yield nothing if renamed and the attribute form throws at patch time."
    related: [call-a-private-game-method-through-a-delegate, patch-a-private-game-method-by-name, patch-private-method-with-field-injection, write-a-harmony-transpiler, set-orbit-line-visibility-and-color]
    borrowed_from: [mods/compendium/features/orbit-line-visibility-and-color]

  - slug: patch-private-method-with-field-injection
    title: Read private fields and arguments of a patched method with Harmony injection
    summary: "Use Harmony's injected parameters instead of reflection inside the patch: ___field (three underscores plus the field name) for private fields, __instance, __result, __state to carry data from prefix to postfix or finalizer, __args and positional __N for arguments, and the failure modes when a name matches nothing (Harmony throws at patch time and can abort the rest of a patch chain)."
    game_types: [KSA.ClutterCubeCellGrid, KSA.GroundClutterPlacementData, KSA.FlightComputer, KSA.InstancedStarTechnique, KSA.Camera]
    engine_pointers:
      - current/decomp/KSA/GroundClutterPlacementData.cs PopulateLaunchPadExclusionZones (private, _celestial field)
      - current/decomp/KSA/FlightComputer.cs ComputeControl (ref readonly FlightComputerNavigation nav)
      - current/decomp/KSA/InstancedStarTechnique.cs constructor and AddInstance
    lifecycle: [startup:all-mods-loaded, startup:starmap-before-main, physics:vehicle-solver]
    approaches:
      - n: 1
        title: Inject a private instance field as a triple-underscore parameter
        mod: ksastructures
        features: [mods/ksastructures/features/ground-clutter-exclusion-zones]
        technique: harmony-postfix
        note: "Postfix on a private method installed by name with AccessTools.Method takes the ref zones array plus Celestial ____celestial (the field is _celestial); missing method is logged once and clutter stays as the engine places it."
      - n: 2
        title: Prefer __instance and a property over a field injector that matches nothing
        mod: unscience
        features: [mods/unscience/features/camera-controller-override-camera-animations]
        technique: harmony-prefix
        note: "History: a prefix with Transform3D ___Transform matched no field, Harmony threw at patch time and aborted the supermod's remaining patch chain; fixed by reading __instance.Camera. Lesson for per-feature TryApply."
      - n: 3
        title: __state to carry data from a prefix to a postfix or finalizer
        mod: compendium
        features: [mods/compendium/features/flight-computer-root-attitude-tracking]
        technique: harmony-state
        note: "Prefix declares ref FlightComputerNavigation nav (aliasing the caller's storage) and out bool __state recording whether it injected; the finalizer reads __state to put the struct back."
      - n: 4
        title: Positional __N and ref arguments to rewrite a constructor or method argument
        mod: ohmystars
        features: [mods/ohmystars/features/star-instance-restyle-patch]
        technique: harmony-prefix
        note: "Manual patch of the InstancedStarTechnique constructor found by its fifth int parameter, prefix with ref int __4 replacing the capacity; AddInstance prefix mutates ref byte scale and ref byte4 color and returns false when the buffer is full."
    related: [patch-a-private-game-method-by-name, resolve-overloaded-and-byref-game-methods, run-cleanup-or-recover-from-exceptions-with-a-finalizer, access-private-members-with-reflection, keep-ground-clutter-off-a-site, replace-a-game-method-with-a-prefix]
