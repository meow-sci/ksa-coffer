  - slug: write-readonly-game-statics-with-unsafeaccessor
    title: Overwrite a get-only static in the game with UnsafeAccessor
    summary: "Some game values are get-only static auto-properties assigned in static constructors (for example the XML serializers behind GameSaves and VehicleSaves). Write the compiler-generated backing field through a local extern function marked UnsafeAccessor with the type named by string, avoiding FieldInfo.SetValue on a readonly field and any compile-time reference to the internal type."
    game_types: [KSA.GameSaves, KSA.VehicleSaves, KSA.XmlHelper]
    engine_pointers:
      - current/decomp/KSA/GameSaves.cs UniverseSerializer (get-only static)
      - current/decomp/KSA/VehicleSaves.cs VehicleSerializer (get-only static)
      - current/decomp/KSA/XmlHelper.cs Serializers, AttributeOverrides
    lifecycle: [startup:starmap-before-main, startup:immediate-load]
    approaches:
      - n: 1
        title: UnsafeAccessor StaticField on the k__BackingField with UnsafeAccessorType
        mod: kittenextensions
        features: [mods/kittenextensions/features/custom-xml-asset-types]
        technique: unsafe-accessor
        note: "extern static ref XmlSerializer UniverseSerializer([UnsafeAccessorType(\"KSA.GameSaves, KSA\")] object instance = null) with Name = \"<UniverseSerializer>k__BackingField\"; assignment through the ref return after rebuilding all cached serializers with the merged attribute overrides."
      - n: 2
        title: Copied injector in a consumer mod with the same accessor
        mod: shaderextensions
        features: [mods/shaderextensions/features/xml-asset-types-and-element-injection]
        technique: unsafe-accessor
        note: "A consumer that cannot reference KittenExtensions copies the injector; it appends child element types to existing XML list members via XmlHelper.AttributeOverrides (keyed by declaring type), rebuilds serializers, and swaps the save serializers the same way."
    related: [access-private-members-with-reflection, redirect-game-xml-loading, define-custom-xml-asset-types, use-shaderextensions-without-referencing-its-assembly]
    borrowed_from: [mods/kittenextensions/features/custom-xml-asset-types, mods/shaderextensions/features/xml-asset-types-and-element-injection]

  # ------------------------------------------------------------------ patch shapes
  - slug: run-cleanup-or-recover-from-exceptions-with-a-finalizer
    title: Run cleanup or recover from an exception with a Harmony finalizer
    summary: "A postfix does not run when the original throws; a finalizer always does. Uses: restore state a prefix changed, even if the game call fails; finish a method that throws on data it was never meant to see (swallow the exception and replay the missing tail); put back an edited input struct using __state; and bracket load or save transactions so failures are reported."
    game_types: [KSA.ConstraintSim, KSA.PartTreeRenderData, KSA.TransferPlanner, KSA.FlightComputer, KSA.UncompressedSave, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/ConstraintSim.cs DetectCollisions and Simulate
      - current/decomp/KSA/PartTreeRenderData.cs Compose
      - current/decomp/KSA/TransferPlanner.cs SetTransferInfo (subtracts a NaN Period from a UniverseTime and throws)
      - current/decomp/KSA/FlightComputer.cs ComputeControl
      - current/decomp/KSA/UncompressedSave.cs Load
    lifecycle: [physics:bepu, frame:render, frame:draw-ui, physics:vehicle-solver, event:save]
    approaches:
      - n: 1
        title: Restore what a prefix changed around one game call
        mod: unscience
        features: [mods/unscience/features/garrys-torch-scoped-collision-suppression, mods/unscience/features/lib-iva-force-render]
        technique: harmony-finalizer
        note: "Prefix sets collidable shapes to default for the duration of DetectCollisions or Simulate and passes the (handle, shape) list as __state; the finalizer restores the exact shape through Bodies.SetShape, logging but not throwing. Same shape for the editor-only IVA reveal around PartTreeRenderData.Compose. A void finalizer does not swallow the original exception."
      - n: 2
        title: Swallow an exception and finish the method's remaining work
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets]
        technique: harmony-finalizer
        note: "static Exception Finalizer(Exception __exception) for SetTransferInfo with a NaN Period: stock already stored the new TransferInfo, the finalizer replays only the lines after the throw (window, selection, alerts) and returns null to swallow. Explains why a postfix would never run."
      - n: 3
        title: Prefix with __state and a finalizer that restores an edited input
        mod: compendium
        features: [mods/compendium/features/flight-computer-root-attitude-tracking]
        technique: harmony-finalizer
        note: "Inject the side target into the by-ref navigation struct for exactly one ComputeControl call on the solver worker and put it back afterwards, keyed by the shared BurnPlan object."
      - n: 4
        title: Prefix, postfix and finalizer as a transaction around loads
        mod: unscience
        features: [mods/unscience/features/lib-native-save-hooks]
        technique: harmony-finalizer
        note: "UncompressedSave.Load gets a prefix (defer, open a transaction) and a finalizer (close it, turning a silent native read failure into an exception); Universe.DeserializeSave and LoadSystem likewise. World replacements are deferred to the PrepareFrame handoff."
    related: [scope-a-patch-to-your-own-calls, patch-private-method-with-field-injection, patch-around-aggressive-inlining, patch-methods-that-run-on-background-threads, suppress-collisions-for-one-vessel, synthesize-a-navigation-target-for-the-flight-computer, save-mod-state-with-the-game-save]
    borrowed_from: [mods/unscience/features/garrys-torch-scoped-collision-suppression, mods/unscience/features/lib-iva-force-render, mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets, mods/compendium/features/flight-computer-root-attitude-tracking, mods/unscience/features/lib-native-save-hooks]

  - slug: scope-a-patch-to-your-own-calls
    title: Scope a shared-method override to the mod's own calls
    summary: "When a patch must change behaviour of a method that other code (the stock game, other mods) also calls, make it conditional on a context that only the mod's own call sets: a ThreadStatic flag set in try/finally around the mod's call, a construction context that scopes both a transpiler and a prefix, or an asker marker set by a prefix on the caller and cleared by a finalizer."
    game_types: [KSA.VolumetricExhaustRenderer, KSA.Vehicle, KSA.Celestial, KSA.ClutterCubeCellGrid]
    engine_pointers:
      - current/decomp/KSA/VolumetricExhaustRenderer.cs AddInstance(ExhaustInstance, int)
      - current/decomp/KSA/Vehicle.cs PrepareWorker, TeleportToLocation
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCce
    lifecycle: [frame:pre-render, frame:dispatch-solvers, physics:vehicle-solver]
    approaches:
      - n: 1
        title: ThreadStatic override set in try/finally around the mod's own submission
        mod: unscience
        features: [mods/unscience/features/pyro-scoped-exhaust-look-override]
        technique: harmony-prefix
        note: "Prefix on VolumetricExhaustRenderer.AddInstance applies per-plume absorption and refraction only while the ThreadStatic override is set inside Pyro's own call, so stock engines and shared templates never see it."
      - n: 2
        title: Thread-static construction context scoping a transpiler and a prefix
        mod: unscience
        features: [mods/unscience/features/pebbles-private-clutter-materials]
        technique: harmony-transpiler
        note: "Redirects ground clutter material buffer lookups to a private per-body buffer and swaps a fragment variant, only while an owned-construction context is active on the current thread."
      - n: 3
        title: Mark the asker in a Priority.First prefix, clear it in a Priority.Last finalizer
        mod: ksastructures
        features: [mods/ksastructures/features/terrain-height-roof-override]
        technique: harmony-finalizer
        note: "[ThreadStatic] Vehicle _stepping set around Vehicle.PrepareWorker so a postfix on the terrain height getter answers roof height for the vehicle being prepared and ground height for the camera; the same pairing lends height across TeleportToLocation."
    related: [run-cleanup-or-recover-from-exceptions-with-a-finalizer, write-worker-thread-safe-solver-patches, coexist-with-other-mods-patching-the-same-method, override-terrain-height-for-roofs-and-platforms]
    borrowed_from: [mods/unscience/features/pyro-scoped-exhaust-look-override, mods/unscience/features/pebbles-private-clutter-materials, mods/ksastructures/features/terrain-height-roof-override]

  - slug: replace-a-game-method-with-a-prefix
    title: Replace or veto a game method's behaviour with a skipping prefix
    summary: "Return false from a prefix to skip the original: write __result and return, veto an action for selected objects, rewrite by-ref arguments before the original runs, or guard a call that would throw. Includes how to keep the replacement faithful to the original body, how skipping interacts with other mods' patches, and when a postfix that edits __result is the safer choice."
    game_types: [KSA.Vehicle, KSA.InstancedStarTechnique, KSA.Camera, KSA.GameSettings]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs UpdateRenderData, GetWorldMatrix, IsLargeEnoughToRender
      - current/decomp/KSA/InstancedStarTechnique.cs AddInstance ("Instance buffer full")
      - current/decomp/KSA/Camera.cs UpdateProjection and _fovRadians
    lifecycle: [frame:render, startup:starmap-before-main, frame:viewports]
    approaches:
      - n: 1
        title: Reproduce the original body for marked objects and return false
        mod: gatos
        features: [mods/gatos/features/scale-and-force-render-cheats]
        technique: harmony-prefix
        note: "Prefixes on GetWorldMatrix and UpdateRenderData reproduce the stock body minus the sub-pixel size test for marked vessels and let everyone else fall through to the original."
      - n: 2
        title: Rewrite by-ref arguments and skip when a limit would throw
        mod: ohmystars
        features: [mods/ohmystars/features/star-instance-restyle-patch]
        technique: harmony-prefix
        note: "ref byte scale and ref byte4 color are transformed per star; when the instance array is full the prefix returns false instead of letting the original throw; counters bumped with Interlocked."
      - n: 3
        title: Re-inject a private field before a rebuild so nothing can change it back
        mod: unscience
        features: [mods/unscience/features/glass-fov-override]
        technique: harmony-prefix
        note: "A prefix on Camera.UpdateProjection writes the override into the private _fovRadians before any rebuild of the main camera's projection, covering window resize, settings apply and the stock FOV keys."
    related: [patch-private-method-with-field-injection, consume-game-input-with-a-skipping-prefix, override-the-camera-field-of-view, keep-vessels-rendered-at-any-distance, restyle-background-stars, coexist-with-other-mods-patching-the-same-method]
    borrowed_from: [mods/gatos/features/scale-and-force-render-cheats, mods/ohmystars/features/star-instance-restyle-patch, mods/unscience/features/glass-fov-override]

  - slug: consume-game-input-with-a-skipping-prefix
    title: Take keyboard and mouse input away from the game with a skipping prefix
    summary: "Stop KSA reacting to a click or key while a mod tool owns it, without leaking latches. A skipped original also skips its finally block, so consumed presses and releases must be paired, the private held-button bits and input viewport repaired, user-bound buttons and popups left to the game, and held-key state tracked so a swallowed press never strands its release."
    game_types: [KSA.Program, KSA.GameSettings, KSA.Input, KSA.BurnContextMenu, KSA.MapController, KSA.VehicleEditor]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnMouseButton (_heldMouseButtons, _inputViewport latches)
      - current/decomp/KSA/Program.cs OnKey and private DispatchKeyEvent
      - current/decomp/KSA/GameSettings.cs OnKeyAll
      - current/decomp/KSA/BurnContextMenu.cs _rightClickValid
    lifecycle: [frame:input, frame:draw-ui]
    approaches:
      - n: 1
        title: Mouse prefix that pairs presses with releases and repairs private latches
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/click-capture-mouse-prefix]
        technique: harmony-prefix
        note: "Order of gates mirrors the stock handler (pairing first, popups, ImGui WantCaptureMouse, Input.MouseBound plus Input.Contains over EnumCollections.InputActions, editor drags), right-release repair via cached AccessTools handles, and the rule to decline consumption when a latch field is missing or changed type."
      - n: 2
        title: Keyboard and mouse-binding gates with a held-key model
        mod: purrtty
        features: [mods/purrtty/features/gate-game-input-while-terminal-focused]
        technique: harmony-prefix
        note: "Prefixes on Program.OnKey, GameSettings.OnKeyAll and private DispatchKeyEvent (mouse events) stop hotkeys while a mod UI has focus, tracking pressed keys and swallowed buttons so releases are never stranded or leaked."
    related: [block-game-hotkeys-while-typing, coordinate-imgui-focus-with-game-input, swallow-game-input-while-a-tool-is-active, capture-mouse-for-gameplay, rebindable-hotkeys, game-loop-and-lifecycle]
    borrowed_from: [mods/purrtty/features/gate-game-input-while-terminal-focused]

  # ------------------------------------------------------------------ coexistence and sharing
  - slug: coexist-with-other-mods-patching-the-same-method
    title: Coexist with other mods that patch the same game method
    summary: "Harmony re-runs every registered transpiler against the original IL whenever any mod patches a method, so a later mod can see your result or remove its anchor. How mods cope: order prefixes and finalizers with Priority, design anchors that tolerate earlier transpilers, make shared installs idempotent so several features can ask for the same seam, and quieten once-only logs that re-fire on re-runs."
    game_types: [KSA.Universe, KSA.Program, KSA.PhysicsStates, KSA.PartTreeRenderData, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/Universe.cs ExecuteNextVehicleSolvers
      - current/decomp/KSA/Program.cs RenderGame
      - current/decomp/KSA/Vehicle.cs PrepareWorker
    lifecycle: [startup:all-mods-loaded, frame:dispatch-solvers]
    approaches:
      - n: 1
        title: Priority.First prefixes and Priority.Last finalizers around shared seams
        mod: gatos
        features: [mods/gatos/features/solver-phase-command-drain, mods/ksastructures/features/terrain-height-roof-override]
        technique: harmony-prefix
        note: "Command drain prefix at Priority.First on ExecuteNextVehicleSolvers so writes land before other mods' prefixes snapshot; cleanup finalizer at Priority.Last."
      - n: 2
        title: Anchors that one mod can consume (and what the next transpiler then sees)
        mod: shaderextensions
        features: [mods/shaderextensions/features/rendergame-render-pass-transpiler, mods/ksaero/features/computedrag-call-site-transpiler]
        technique: harmony-transpiler
        note: "After ShaderExtensions moves BeginRenderPass into ImGuiPreRender a second mod searching backwards from RenderDrawData finds nothing; a transpiler that rewrites the same call before KSAero leaves it zero matches. Choose anchors that survive earlier rewriting, and fail by name."
      - n: 3
        title: Idempotent shared installs with a registration API
        mod: unscience
        features: [mods/unscience/features/lib-part-render-filter, mods/unscience/features/unscience-consolidated-patcher]
        technique: harmony-prefix
        note: "PhysicsFrameHook.Apply returns early when applied; the first PartRenderFilter.Register installs and later owners only add predicates, so features applying the same seam again are harmless."
    related: [share-one-patch-between-several-features, write-a-harmony-transpiler, identify-a-call-by-its-argument-il, mutate-vehicles-at-a-physics-safe-point, scope-a-patch-to-your-own-calls]
    borrowed_from: [mods/gatos/features/solver-phase-command-drain, mods/unscience/features/lib-part-render-filter]

  - slug: share-one-patch-between-several-features
    title: Share one Harmony patch between several mod features
    summary: "Install a seam once (post-solver tick, physics frame hook, command sink, hotkey guard, render filter) and let each feature subscribe or register, with enable flags set from each feature's own patch result so a shared hook never drives a failed feature."
    game_types: [KSA.Universe, KSA.Program, KSA.FlightComputer, KSA.PartTreeRenderData]
    engine_pointers:
      - current/decomp/KSA/Universe.cs ApplyVehicleSolvers
      - current/decomp/KSA/FlightComputer.cs ComputeControl
      - current/decomp/KSA/Program.cs PrepareFrame (GetJobSimStep)
    lifecycle: [frame:apply-solvers, physics:vehicle-solver, frame:prepare, frame:render]
    approaches:
      - n: 1
        title: One shared tick with per-feature enable flags set from TryApply results
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick, mods/ksa-advancedflightcomputer/features/feature-gated-patch-sets]
        technique: harmony-postfix
        note: "SharedVehicleHooks.*Enabled flags plus a prefix/postfix pair on ApplyVehicleSolvers that drives each feature's state machine once per frame."
      - n: 2
        title: One worker-side postfix merging every writer
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/flight-computer-command-sink]
        technique: harmony-postfix
        note: "A single postfix on FlightComputer.ComputeControl runs all mod actuator writers in order and merges wake and off-rails requests into the stock output."
      - n: 3
        title: Shared seam with a callback registry
        mod: unscience
        features: [mods/unscience/features/lib-physics-frame-hook, mods/unscience/features/lib-part-render-filter, mods/unscience/features/lib-hotkey-guard]
        technique: harmony-transpiler
        note: "One PrepareFrame transpiler dispatches queued callbacks for Garry's Torch, Dent Wizard, Godzilla and Iron Man; PartRenderFilter and HotkeyGuard follow the same register-and-forward shape."
    related: [coexist-with-other-mods-patching-the-same-method, isolate-patch-failures-per-class-or-feature, run-code-after-physics-results-land, mutate-vehicles-at-a-physics-safe-point, host-several-features-in-one-mod-or-standalone]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick, mods/ksa-advancedflightcomputer/features/flight-computer-command-sink, mods/unscience/features/lib-physics-frame-hook, mods/unscience/features/lib-part-render-filter, mods/unscience/features/lib-hotkey-guard]

  # ------------------------------------------------------------------ threads
  - slug: patch-methods-that-run-on-background-threads
    title: Patch game methods that run on workers and the thread pool
    summary: "Patch bodies run on whatever thread the game called the method from: vehicle workers per substep, Bepu fan-out threads, thread-pool tasks for planner searches and parallel shader compilation. State which thread each target uses, what the patch may touch there (no ImGui, no Vulkan, no main-thread-only collections), and how results reach the main thread."
    game_types: [KSA.TransferPlanner, KSA.OrbitalTransfers, KSA.RefineBurnTask, KSA.PatchedConic, KSA.VehicleUpdateTask, KSA.PhysicsStates]
    engine_pointers:
      - current/decomp/KSA/RefineBurnTask.cs TryFindIntercept
      - current/decomp/KSA/OrbitalTransfers.cs HohmannFlight, AlignmentTime
      - current/decomp/KSA/PatchedConic.cs FindClosestApproaches
      - current/decomp/KSA/VehicleUpdateTask.cs ApplyResultsToMainThread, RunIsland
    lifecycle: [thread:background, physics:vehicle-solver, startup:starmap-before-main]
    approaches:
      - n: 1
        title: Patches on planner tasks that run on pooled threads
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets]
        technique: harmony-prefix
        note: "Prefixes on HohmannFlight, AlignmentTime, TryFindIntercept and FindClosestApproaches run on background tasks; results are stored and the UI alert is raised only from the finalizer on the draw thread."
      - n: 2
        title: Preload in StarMapBeforeMain because shaders compile in parallel on pool threads
        mod: realatmospheres
        features: [mods/realatmospheres/features/shader-file-redirect]
        technique: harmony-prefix
        note: "StarMapBeforeMain is the only hook before shader loading; the redirect patch runs on thread-pool threads, so it must be allocation-light, thread-safe, and the target assembly must be preloaded into the game's context."
      - n: 3
        title: Worker-side postfix merging commands from the main thread
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/flight-computer-command-sink, mods/ksacars/features/keep-thrusting-craft-off-rails]
        technique: harmony-postfix
        note: "Wake and off-rails requests answered from a concurrent dictionary inside patches on vehicle worker threads (PhysicsBubble.KittenWantsWake, ComputeControl), written by main-thread code before dispatch."
    related: [write-worker-thread-safe-solver-patches, pass-data-to-patches-on-the-flight-computer-worker-copy, run-an-expensive-solve-without-stalling-the-frame, patch-a-lazily-loaded-game-assembly, game-loop-and-lifecycle]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/hyperbolic-transfer-targets, mods/realatmospheres/features/shader-file-redirect, mods/ksacars/features/keep-thrusting-craft-off-rails]

  - slug: pass-data-to-patches-on-the-flight-computer-worker-copy
    title: Pass data to patches that run on the flight computer's worker copy
    summary: "The vehicle worker flies a copy of the flight computer taken in Vehicle.PrepareWorker and written back over the original in ApplyVehicleSolvers, so field writes and instance-keyed tables on the original are lost or invisible to a ComputeControl patch. Key worker-side tables by objects the copy shares by reference (BurnPlan, VehicleConfigInfo), publish before dispatch, and write settings only between apply and snapshot."
    game_types: [KSA.FlightComputer, KSA.Vehicle, KSA.BurnPlan, KSA.VehicleConfigInfo, KSA.VehicleUpdateState, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs PrepareWorker, PrepareFromVehicle
      - current/decomp/KSA/FlightComputer.cs CopyFrom, ComputeControl, UpdateAttitudeTarget
      - current/decomp/KSA/Universe.cs ApplyVehicleSolvers, ExecuteNextVehicleSolvers
    lifecycle: [frame:apply-solvers, frame:dispatch-solvers, physics:vehicle-solver]
    approaches:
      - n: 1
        title: ConditionalWeakTable keyed by objects the copy shares by reference
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/flight-computer-worker-copy-channels]
        technique: conditional-weak-table
        note: "Worker-side command tables keyed by the BurnPlan and VehicleConfigInfo the copy shares; flight-computer writes confined to the window between apply and snapshot; UI requests queued."
      - n: 2
        title: Look the state up through __instance.BurnPlan in a ComputeControl prefix
        mod: compendium
        features: [mods/compendium/features/flight-computer-root-attitude-tracking]
        technique: harmony-prefix
        note: "ApplyControlTarget finds the vehicle's side target by the BurnPlan object the solver copy shares with the live flight computer and injects it for exactly one call."
    related: [choose-a-moment-to-write-flight-computer-state, write-worker-thread-safe-solver-patches, mutate-vehicles-at-a-physics-safe-point, command-attitude-through-the-flight-computer, patch-methods-that-run-on-background-threads]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/flight-computer-worker-copy-channels, mods/compendium/features/flight-computer-root-attitude-tracking]

  # ------------------------------------------------------------------ removal and testing
  - slug: remove-your-patches-safely-at-runtime-and-at-exit
    title: Remove your Harmony patches safely, during play and at exit
    summary: "UnpatchAll() with no id removes every mod's patches; remove only yours by id or by patch method, from a main-thread hook, after nulling the delegates the patches call. Also the shutdown fact: StarMapCore.DeInit runs an id-less UnpatchAll before StarMapUnload methods, so unload code usually finds nothing to remove."
    game_types: [HarmonyLib.Harmony, KSA.Program]
    engine_pointers:
      - StarMap.Core/StarMapCore.cs DeInit (UnpatchAll before ModLoader.Dispose)
      - StarMap/GameSurveyer.cs Dispose and StarMap/Program.cs Main
    lifecycle: [event:starmap-unload, frame:after-on-frame, frame:draw-ui]
    approaches:
      - n: 1
        title: UnpatchAll(ownId) from a main-thread hook after nulling delegates
        mod: ksagolf
        features: [mods/ksagolf/features/degrading-harmony-patches, mods/ksaero/features/patch-refusal-and-rollback]
        technique: harmony-prefix
        note: "Each class has its own id; Remove() nulls the handed-in delegate first, then UnpatchAll(HarmonyId). StarMapUnload unpatching is a no-op because StarMap's id-less UnpatchAll has already run; purrTTY and AFC reach the same conclusion."
      - n: 2
        title: Lazy install and removal of one patch while it is in use
        mod: gatos
        features: [mods/gatos/features/scale-and-force-render-cheats]
        technique: dynamic-harmony-install
        note: "Patch only while a vessel is marked; unpatch when the set empties; both happen on the main thread in the frame drain so no render code is mid-call."
      - n: 3
        title: Unpatch by patch method on a shared Harmony instance
        mod: unscience
        features: [mods/unscience/features/sphinx-static-colliders, mods/unscience/features/unscience-consolidated-patcher]
        technique: harmony-prefix
        note: "SphinxPhysicsPatches.Remove walks Harmony.GetAllPatchedMethods and unpatches only methods declared on its own class, so it never strips other features' patches; contrast with CameraControllerOverridePatches.Remove which calls UnpatchAll(harmony.Id) and removes every feature on the shared instance."
    related: [refuse-a-patch-and-roll-back-when-the-game-changes, make-patch-bodies-fault-proof, clean-up-on-game-exit, patch-a-private-game-method-by-name, game-loop-and-lifecycle]
    borrowed_from: [mods/gatos/features/scale-and-force-render-cheats]

  - slug: test-patches-without-the-game
    title: Test Harmony patches and transpilers without starting the game
    summary: "KSA cannot be started from a unit-test runner and some developers cannot run the Windows game at all. Three ways to test patch code: console projects that compile production patch files against namespace-KSA stand-ins and patch them with real Harmony, a second StarMap test mod run in a GPU-less headless harness against the real simulation, and transpiler tests over PatchProcessor.GetOriginalInstructions."
    game_types: [KSA.Program, KSA.Vehicle, KSA.TransferPlanner, HarmonyLib.PatchProcessor]
    engine_pointers:
      - current/decomp/KSA/Program.cs PrepareFrame (frame-loop fixture mirrors its solver call order)
    lifecycle: [startup:all-mods-loaded]
    approaches:
      - n: 1
        title: Console projects with namespace KSA stand-ins and real Harmony
        mod: unscience
        features: [mods/unscience/features/unscience-managed-test-harnesses]
        technique: harmony-prefix
        note: "Compile production files by Link, declare minimal stand-in types with the game's member names (NoInlining on patched methods so the JIT cannot inline them), apply the shipped patch methods and assert; frame-loop fixture checks the PrepareFrame transpiler's seam; RequiresKSAAssemblies=false."
      - n: 2
        title: Headless harness consumer mod that runs against the real simulation
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/headless-harness-test-mod, mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: starmap-lifecycle
        note: "Tests discovered by IHarnessTest, test-scoped Harmony ids removed afterwards, IL tests over original instructions, reflection drift test, and the rule that tests never catch MissingMemberException so the harness classifies it as API drift. Mention that DeltaVMap uses the same harness to demand equality with stock private routines."
      - n: 3
        title: Equality oracles against stock private routines
        mod: ksa-deltavmap
