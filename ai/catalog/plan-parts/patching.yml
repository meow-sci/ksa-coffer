  - slug: isolate-patch-failures-per-class-or-feature
    title: Apply patches so one drifted target cannot disable the rest
    summary: "Harmony PatchAll stops at the first failure and can abort mod initialisation. Four structures mods use to localise damage: CreateClassProcessor per patch class with required versus optional severity, one consolidated patcher with a TryApply wrapper on a single Harmony instance, static patch classes that look up their own target and stand down, and reflection-only builds with per-subsystem try and parameter-name checks."
    game_types: [KSA.Program, KSA.GameSettings, HarmonyLib.Harmony]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnKey, DispatchKeyEvent, DrawProgramMenusHook
      - StarMap.Core/StarMapCore.cs Init and DeInit
    lifecycle: [startup:all-mods-loaded, event:starmap-unload]
    approaches:
      - n: 1
        title: CreateClassProcessor per patch class, required versus optional
        mod: purrtty
        features: [mods/purrtty/features/failure-isolated-harmony-patching, mods/ksa-measuretools/features/resilient-patching-and-diagnostics]
        technique: harmony-prefix
        note: "Separate classes per target so a drift in the private DispatchKeyEvent disables only that gate; log messages state the consequence for the player; lazily recreated Harmony instance and static resets on unload (defensive, StarMap never reloads in-process)."
      - n: 2
        title: Consolidated patcher with TryApply and ordered shared seams
        mod: unscience
        features: [mods/unscience/features/unscience-consolidated-patcher]
        technique: harmony-prefix
        note: "One Harmony id for thirty-odd features, each lib's Apply wrapped in TryApply/TryRemove, order only where seams are shared, idempotent shared helpers, and unpatching by patch method on the shared instance rather than by id."
      - n: 3
        title: Static patch classes that look up the target, log once and stand down
        mod: ksagolf
        features: [mods/ksagolf/features/degrading-harmony-patches]
        technique: harmony-postfix
        note: "Six classes with their own id, Installed property, per-class consequence table (what a missing patch costs), delegates handed in from the mod. See also the compile-time pins topic."
      - n: 4
        title: Reflection-only mod with parameter-name and field-type pre-checks
        mod: realatmospheres
        features: [mods/realatmospheres/features/reflection-only-mod-build]
        technique: reflection
        note: "Compile against StarMap.API and 0Harmony only; reach every game member by name; verify parameter names and field types before each patch and wrap each subsystem in its own try/log."
    related: [refuse-a-patch-and-roll-back-when-the-game-changes, make-patch-bodies-fault-proof, validate-game-reflection-targets-at-load, apply-harmony-patches-independently, contain-exceptions-in-starmap-hooks, share-one-patch-between-several-features]
    borrowed_from: [mods/ksa-measuretools/features/resilient-patching-and-diagnostics, mods/realatmospheres/features/reflection-only-mod-build]

  - slug: make-patch-bodies-fault-proof
    title: Make Harmony patch bodies that never throw and stand down on failure
    summary: "A prefix or postfix that throws every frame breaks the game method it decorates. Patterns for patch bodies: catch everything, log once per failure kind, null the delegate or flag the patch to stand down, degrade to the game's behaviour with a recorded reason, and count faults so the mod removes all its patches after a limit."
    game_types: [KSA.Program, KSA.Universe, KSA.SuperMeshRenderSystem]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnFrameCelestials (private)
      - current/decomp/KSA/Universe.cs GetLastSimStep, ExecuteNextVehicleSolvers
    lifecycle: [startup:all-mods-loaded, frame:draw-ui, frame:celestials, frame:after-on-frame]
    approaches:
      - n: 1
        title: try/catch in every body, log once, null the delegate
        mod: ksagolf
        features: [mods/ksagolf/features/degrading-harmony-patches]
        technique: harmony-prefix
        note: "A failure that would repeat each frame nulls the delegate the patch calls and logs once; worker-thread prefixes follow the same rule. Remove() nulls the delegate first so a stale patch cannot reach a dead mod."
      - n: 2
        title: Fault counter that pulls every patch after a limit
        mod: ksagolf
        features: [mods/ksagolf/features/dual-hook-frame-stepping, mods/ksagolf/features/degrading-harmony-patches]
        technique: harmony-prefix
        note: "Ten consecutive exceptions in the frame wrapper set a disabled flag, release the mod's grabs and call Remove() on all patch classes; every later hook returns at its first line."
      - n: 3
        title: Trouble string and a degrade path for an optional hook
        mod: ksarmory
        features: [mods/ksarmory/features/dual-hook-simulation-step]
        technique: harmony-prefix
        note: "A by-name prefix on private Program.OnFrameCelestials; if the method is gone, record Trouble, log the consequence (stepping after the render on no-UI frames) and continue via the other hook."
      - n: 4
        title: Exception-type-keyed once-only logging in every hook
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/resilient-patching-and-diagnostics]
        technique: harmony-prefix
        note: "Log the first occurrence of each exception type and count the rest, so a hook that fails every frame does not flood the log; DEBUG stopwatch scopes reported on an interval."
    related: [isolate-patch-failures-per-class-or-feature, refuse-a-patch-and-roll-back-when-the-game-changes, contain-exceptions-in-starmap-hooks, log-each-problem-once, draw-ui-while-the-hud-is-hidden]
    borrowed_from: [mods/ksagolf/features/dual-hook-frame-stepping, mods/ksarmory/features/dual-hook-simulation-step, mods/ksa-measuretools/features/resilient-patching-and-diagnostics]

  - slug: validate-game-reflection-targets-at-load
    title: Resolve and validate every private game member once at load
    summary: "Resolve all private fields and methods in one place at startup, tag each with the features that need it, and let each feature refuse to load, or the mod report a degraded state in the UI, when one is gone. Two designs: a feature-tagged handle registry with per-feature validators, and a never-throwing static constructor that sorts failures into fatal and degraded lists and gates a status panel."
    game_types: [KSA.TransferPlanner, KSA.Vehicle, KSA.FlightComputer, KSA.GameSettings, KSA.ModLibrary, KSA.SerializedCollection, KSA.VehicleEditor]
    engine_pointers:
      - current/decomp/KSA/TransferPlanner.cs private static planner fields and SetTransferInfo
      - current/decomp/KSA/ModLibrary.cs internal static readonly registries (AllParts, AllMeshes, AllFiles, AllMaterials)
      - current/decomp/KSA/SerializedCollection.cs _collection
    lifecycle: [startup:immediate-load, startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: Feature-tagged handle registry with a Validate per feature
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: reflection
        note: "[UsedBy(Feature.A | Feature.B)] on each static readonly handle, Validate enumerates the class's own fields, handles with no UsedBy fail every validation, soft anchors for optional patches, readable DisplayName in the warning, and a headless drift test that runs every validator and anchor probe."
      - n: 2
        title: Non-throwing static constructor with fatal and degraded lists
        mod: unscience
        features: [mods/unscience/features/parts-now-reflection-self-test]
        technique: reflection
        note: "GameRegistry is the only file that calls GetField; each lookup in its own try/catch appends a readable sentence; accessors throw InvalidOperationException naming the member; SelfTest at AllModsLoaded and a red banner with disabled Load buttons when unhealthy."
    related: [access-private-members-with-reflection, detect-game-update-breakage-in-patches, refuse-a-patch-and-roll-back-when-the-game-changes, check-the-game-version, test-patches-without-the-game, load-part-mods-at-runtime]
