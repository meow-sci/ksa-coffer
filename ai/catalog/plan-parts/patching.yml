  - slug: detect-game-update-breakage-in-patches
    title: Find out which of your patches a game update broke
    summary: "Make signature and IL drift visible before a player hits it: pin public targets in compiled code with never-called members so a signature change is a build error, lock the referenced assemblies by hash and diff only the external member surface, and keep a coupling catalog classified by how each touchpoint fails."
    game_types: [KSA.Program, KSA.Universe]
    engine_pointers:
      - current/dll/KSA.dll (member references read from metadata tables)
      - current/decomp/ (diff two builds against the recorded surface)
    lifecycle: [startup:all-mods-loaded]
    approaches:
      - n: 1
        title: Pin patched members with a never-called method that really calls them
        mod: ksagolf
        features: [mods/ksagolf/features/degrading-harmony-patches]
        technique: reflection
        note: "A never-called method that really calls the target emits a MemberRef; nameof does not. PinTheSignature, PinTheStep and friends; private targets cannot be pinned this way; the pin only helps public members and one class forgot it."
      - n: 2
        title: SHA-256 assembly lock and a generated external member surface
        mod: ksagolf
        features: [mods/ksagolf/features/api-surface-and-assembly-lock]
        technique: metadata-reader
        note: "Read member references from the compiled DLL's metadata tables, write the list to a surface document, diff a new decompiled build against just that surface. Complementary to approach 1."
      - n: 3
        title: Coupling catalog and an upgrade-review skill
        mod: purrtty
        features: [mods/purrtty/features/ksa-upgrade-coupling-review-skill]
        technique: harmony-prefix
        note: "Catalog of every mod-to-game coupling classified by failure mode (throws at patch time, silent no-op, wrong behaviour) and a skill that diffs two builds against it and reports severity per touchpoint."
    related: [validate-game-reflection-targets-at-load, test-patches-without-the-game, check-the-game-version, refuse-a-patch-and-roll-back-when-the-game-changes]
    borrowed_from: [mods/ksagolf/features/api-surface-and-assembly-lock, mods/purrtty/features/ksa-upgrade-coupling-review-skill]

  # ------------------------------------------------------------------ reflection and targeting
  - slug: access-private-members-with-reflection
    title: Read and write private game members with reflection
    summary: "Reach KSA internals that have no API: private static fields, internal static registries, a private nested enum, instance fields of generic collections. Bind a typed ref accessor once instead of reflecting per call, replay the writes stock performs in the order it does them, and fail gracefully when a member is missing or has changed type."
    game_types: [KSA.TransferPlanner, KSA.ModLibrary, KSA.SerializedCollection, KSA.GameSettings, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/TransferPlanner.cs _sourceBody, _transferType, _transferCalculated, cts, SetTransferInfo
      - current/decomp/KSA/ModLibrary.cs AllParts and the other registries
      - current/decomp/KSA/SerializedCollection.cs _collection
      - current/decomp/KSA/GameSettings.cs _openTab and the private SettingsTab enum
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: AccessTools static field refs bound once, replay stock's writes
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/stock-transfer-planner-bridge]
        technique: accesstools-fieldref
        note: "Bind<T>(name) requires static and exact type, returns a ref T getter with no per-call reflection, collects missing keys into a list declared before the bindings, then performs the same writes and side effects as one stock frame of combo changes. No Harmony patch at all."
      - n: 2
        title: Plain GetField on internal registries and a generic holder for instance fields
        mod: unscience
        features: [mods/unscience/features/parts-now-reflection-self-test, mods/unscience/features/parts-now-runtime-unload-purge]
        technique: reflection
        note: "typeof(ModLibrary).GetField(name, Static|NonPublic|Public).GetValue(null) as SerializedCollection<T>, plus a per-T holder that probes the private _collection dictionary once to unregister entries."
      - n: 3
        title: Typed FieldRefAccess, boxed private enum members and by-ref lookups
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: accesstools-fieldref
        note: "StaticFieldRefAccess versus FieldRefAccess<T,F> (T must be a reference type), a private nested enum compared as a boxed value resolved once from the field's FieldType, and MakeByRefType in parameter lists."
    related: [call-a-private-game-method-through-a-delegate, validate-game-reflection-targets-at-load, write-readonly-game-statics-with-unsafeaccessor, open-and-preselect-the-stock-transfer-planner, load-part-mods-at-runtime, patch-private-method-with-field-injection]
    borrowed_from: [mods/ksa-deltavmap/features/stock-transfer-planner-bridge, mods/unscience/features/parts-now-runtime-unload-purge]

  - slug: call-a-private-game-method-through-a-delegate
    title: Call a private game method without per-call reflection
    summary: "Bind a private or internal game method to a delegate once so the hot path is a plain delegate call. Covers delegate types that mirror in and ref parameter modifiers, unbound delegates for statics, and reusing private helpers (quantisation, symmetry iteration, SetTransferInfo) from mod code."
    game_types: [KSA.PhysicsStates, KSA.VehicleEditor, KSA.TransferPlanner]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDrag
      - current/decomp/KSA/VehicleEditor.cs QuantizeScale, ForEachPartWithSymmetry, UpdateSelectedScale
    lifecycle: [startup:all-mods-loaded, physics:vehicle-solver, editor:frame]
    approaches:
      - n: 1
        title: AccessTools.MethodDelegate with a delegate type that mirrors in and ref modifiers
        mod: ksaero
        features: [mods/ksaero/features/stock-drag-delegate-fallback]
        technique: method-delegate
        note: "Declare ComputeDragFn with four in structs and a ref Disturbances, resolve with an explicit parameter array, bind in Apply before the transpiler is installed, invoke from worker threads as an immutable delegate. Because only a call site is rewritten the delegate runs the unmodified stock body."
      - n: 2
