category: patching
description: "Generic Harmony technique for KSA mods - writing and anchoring transpilers, swapping single calls, patching around AggressiveInlining, reaching private members, injecting patch arguments, finalizers and scoped overrides, skipping prefixes, fault-contained and refusing patch sets, worker-thread patches, unpatching and testing patches without the game."
topics:
  # ------------------------------------------------------------------ transpiler craft
  - slug: write-a-harmony-transpiler
    title: Write a Harmony transpiler for a game method
    summary: "Start-to-finish recipe for changing the IL of a KSA method: read the real IL from KSA.dll, pick exact overloads, build the instruction list, mutate it, prove the match count, and know that Harmony rebuilds the method from original IL every time any mod patches it. Four common shapes (retarget a call, insert at an anchor, replace an instruction run with a helper, filter a read) each get a worked example."
    game_types: [KSA.PhysicsStates, KSA.TransferPlanner, KSA.CelestialSystem, KSA.PhysicsBubble, KSA.StructuralLoad]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives and ComputeDrag
      - current/decomp/KSA/TransferPlanner.cs DrawPlanWindow
      - current/decomp/KSA/CelestialSystem.cs GetNearbyAstronomical
      - current/decomp/KSA/PhysicsBubble.cs DetectStructuralFailure
      - current/dll/KSA.dll (read IL with ilspycmd; the shipped assembly is debug-compiled and contains nops)
    lifecycle: [startup:all-mods-loaded, startup:starmap-before-main]
    approaches:
      - n: 1
        title: Retarget the operand of one call (same signature)
        mod: ksaero
        features: [mods/ksaero/features/computedrag-call-site-transpiler]
        technique: harmony-transpiler
        note: "Smallest useful transpiler. Resolve the target with an explicit parameter array, copy instructions to a list, test each with CodeInstruction.Calls, change only operand, count and throw unless exactly one. Establish the vocabulary (opcode, operand, labels, blocks, evaluation stack) the other approaches build on, and the Harmony caveat that transpilers re-run whenever another patch touches the method."
      - n: 2
        title: Insert a call before a validated anchor
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection]
        technique: harmony-transpiler
        note: "Pipeline of small passes over the same list, each returning the list unchanged and warning once when its anchor is missing; headless test that runs the transpiler over PatchProcessor.GetOriginalInstructions. Shows how to unit test IL rewrites."
      - n: 3
        title: Replace an instruction run with a helper that takes a local by reference
        mod: realatmospheres
        features: [mods/realatmospheres/features/nearby-body-transpiler]
        technique: harmony-transpiler
        note: "Multi-instruction rewrite (sub, ldloc, clt becomes ldloca.s plus argument loads plus call) with the original store nopped. Emphasise reading local slots from the matched instructions, finding an argument slot by parameter name and type plus one for this, and returning the original IL when the shape check fails."
      - n: 4
        title: Filter one value read through a registry check
        mod: unscience
        features: [mods/unscience/features/kitchen-sink-g-load-protection]
        technique: harmony-transpiler
        note: "Scan for the typed property getter call and insert a filter call that returns a replacement value for registered vessels, in a private static method resolved by exact signature that runs on vehicle worker threads."
    related: [swap-one-call-inside-a-game-method-with-a-transpiler, identify-a-call-by-its-argument-il, insert-calls-into-a-game-method-at-an-il-anchor, rewrite-a-comparison-or-value-read-with-a-transpiler, refuse-a-patch-and-roll-back-when-the-game-changes, patch-around-aggressive-inlining, test-patches-without-the-game, game-loop-and-lifecycle]
    borrowed_from: [mods/realatmospheres/features/nearby-body-transpiler, mods/unscience/features/kitchen-sink-g-load-protection, mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection]

  - slug: swap-one-call-inside-a-game-method-with-a-transpiler
    title: Swap one call inside a game method with a transpiler
    summary: "Make a big game method call your code instead of one helper without copying the method. Covers same-signature replacement (stack untouched), wider signature with an extra ldarg.0, replacements that run work then call the original, gate helpers that skip a call, and replacements that adapt an argument or result."
    game_types: [KSA.PhysicsStates, KSA.Vehicle, KSA.NavigationTarget, KSA.Program, KSA.KittenRenderable, KSA.TransferPlanner]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives (atmospheric ComputeDrag call)
      - current/decomp/KSA/NavigationTarget.cs Create and current/decomp/KSA/Vehicle.cs UpdateNavBallMarkers, UpdateNavballData
      - current/decomp/KSA/Program.cs RenderGame (BeginRenderPass call)
      - current/decomp/KSA/Vehicle.cs UpdateRenderData (IsLargeEnoughToRender), GetWorldMatrix (MeanRadius)
      - current/decomp/KSA/Vehicle.cs TeleportToLocation
    lifecycle: [startup:all-mods-loaded, startup:immediate-load, startup:starmap-before-main, physics:vehicle-solver, frame:render]
    approaches:
      - n: 1
        title: Same-signature static replacement, operand-only edit
        mod: ksaero
        features: [mods/ksaero/features/computedrag-call-site-transpiler, mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection]
        technique: harmony-transpiler
        note: "Replacement mirrors the parameter list and return type including by-ref modifiers, so only instruction.operand changes. AFC applies the same move to Burn.Create inside the plan window, moving labels and exception blocks to the new instruction. Emphasise the signature-equality rule and that the replacement may call the original through a delegate."
      - n: 2
        title: Wider signature with an extra ldarg.0 appended
        mod: compendium
        features: [mods/compendium/features/navball-target-marker-and-tgt-frame]
        technique: harmony-transpiler
        note: "The replacement takes the original arguments plus the instance, so the transpiler inserts ldarg.0 before the call and uses MoveLabelsFrom/MoveBlocksFrom so branches into the call site still land. Replacement forwards to the original when the mod has nothing to add."
      - n: 3
        title: Replacement that does mod work, then calls the original
        mod: shaderextensions
        features: [mods/shaderextensions/features/rendergame-render-pass-transpiler]
        technique: harmony-transpiler
        note: "BeginRenderPass is a generic static extension; the swap keeps ldloc.1, ldloca.s, ldloc.3 on the stack, the new method records mod passes then issues the original BeginRenderPass itself. Explains why this cannot be a prefix (no method boundary exists at that point)."
      - n: 4
        title: Gate helper that skips the call for the mod's own condition
        mod: unscience
        features: [mods/unscience/features/humble-arteest-kitten-visor-toggle, mods/unscience/features/godzilla-visual-scaling]
        technique: harmony-transpiler
        note: "Exactly-one rewrites of a Draw call (skip while a flag is set) and of IsLargeEnoughToRender and MeanRadius reads in Vehicle.UpdateRenderData and GetWorldMatrix. Show why a getter patch would be wrong (shared by other callers) and the guarded count check."
      - n: 5
        title: Adapter that fixes up arguments and converts the result back
        mod: unscience
        features: [mods/unscience/features/iron-man-surface-teleport-correction]
        technique: harmony-transpiler
        note: "One GetInitialKinematicStateForLocation call in Vehicle.TeleportToLocation becomes an adapter that substitutes head-up proxy bounds for active Iron Man kittens and converts attitude and rates back. Pattern for any call whose inputs or outputs need translation."
    related: [write-a-harmony-transpiler, identify-a-call-by-its-argument-il, insert-calls-into-a-game-method-at-an-il-anchor, patch-around-aggressive-inlining, replace-the-stock-aerodynamic-force-model, insert-a-custom-pass-into-render-game, synthesize-a-navigation-target-for-the-flight-computer, refuse-a-patch-and-roll-back-when-the-game-changes]
    borrowed_from: [mods/compendium/features/navball-target-marker-and-tgt-frame, mods/unscience/features/humble-arteest-kitten-visor-toggle, mods/unscience/features/godzilla-visual-scaling, mods/unscience/features/iron-man-surface-teleport-correction]

  - slug: identify-a-call-by-its-argument-il
    title: Identify the right call in a method that makes several similar calls
    summary: "When a method calls the same helper more than once (ocean versus air drag, one Burn.Create among many, one BeginRenderPass among several), pick the right instruction by what surrounds it: the loads that feed its arguments, a unique neighbouring call, or the instruction that consumes its result. Includes window sizes, stopping at the previous call boundary, and what to do when a later build adds a second match."
    game_types: [KSA.PhysicsStates, KSA.PhysicsEnvironment, KSA.Program, KSA.TransferPlanner, KSA.BurnContextMenu]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives (two ComputeDrag calls, AtmosphericDensity versus OceanDensity)
      - current/decomp/KSA/Program.cs RenderGame (RenderDrawData then the preceding BeginRenderPass)
      - current/decomp/KSA/TransferPlanner.cs DrawPlanWindow (PrimaryButton before Burn.Create)
    lifecycle: [startup:all-mods-loaded, startup:starmap-before-main]
    approaches:
      - n: 1
        title: Scan backwards through the argument loads to the previous call
        mod: ksaero
        features: [mods/ksaero/features/computedrag-call-site-transpiler]
        technique: harmony-transpiler
        note: "Walk back at most N instructions from the call, succeed on LoadsField of the discriminating field, fail on the first call or callvirt. Include the IL table of the two ComputeDrag calls in build 5554 and why matching a field load beats a fixed offset."
      - n: 2
        title: Anchor on a unique neighbouring call, then walk to the target
        mod: shaderextensions
        features: [mods/shaderextensions/features/rendergame-render-pass-transpiler, mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection]
        technique: harmony-transpiler
        note: "Find the single RenderDrawData call and walk back to the nearest BeginRenderPass; find the last EndRenderPass from the end; from Burn.Create walk back up to 160 instructions to the PrimaryButton call. Discuss the fragility of last-occurrence anchors and requiring each anchor exactly once."
      - n: 3
        title: Anchor on a UTF-8 label literal in the method
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/orbit-context-menu-shortcuts]
        technique: harmony-transpiler
        note: "Locate a menu or window section by the string literal the game draws, then insert before the final EndPopup. Useful when no distinctive call exists but the UI text does."
      - n: 4
        title: Match the instruction that consumes the result
        mod: compendium
        features: [mods/compendium/features/navball-target-marker-and-tgt-frame]
        technique: harmony-transpiler
        note: "A getter call is only the target when immediately followed by brtrue/brfalse or ldnull plus ceq/cgt.un; other uses of the same getter (passing it on) are left alone."
    related: [write-a-harmony-transpiler, swap-one-call-inside-a-game-method-with-a-transpiler, make-game-null-checks-see-mod-state, insert-calls-into-a-game-method-at-an-il-anchor, coexist-with-other-mods-patching-the-same-method]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/orbit-context-menu-shortcuts, mods/compendium/features/navball-target-marker-and-tgt-frame]

  - slug: insert-calls-into-a-game-method-at-an-il-anchor
    title: Insert a call into a game method at an IL anchor without breaking branches
    summary: "Add draw or filter calls inside a stock method by inserting instructions before or after an anchor. Covers moving labels and begin-exception markers so jumps still reach the inserted call and it stays in the same try region, the deliberate opposite (leave labels so a jump skips the addition), filtering a value left on the stack, and recording slots outside a render pass."
    game_types: [KSA.TransferPlanner, KSA.GameSettings, KSA.Program, KSA.ConsoleWidgets]
    engine_pointers:
      - current/decomp/KSA/TransferPlanner.cs DrawPlanWindow (DrawCorrectionTransfer, PopWidgetStyle, Burn.Create)
      - current/decomp/KSA/Program.cs DrawMenuBar, RenderGame
    lifecycle: [startup:all-mods-loaded, frame:draw-ui, frame:render]
    approaches:
      - n: 1
        title: Move labels and begin-exception markers onto the inserted instruction
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/plan-window-transpiler-injection]
        technique: harmony-transpiler
        note: "TranspilerInsertion.MoveEntryMarkers: labels and begin-try blocks go to the new first instruction, end markers stay. Also the click gate that filters the bool left by PrimaryButton, and the once-per-frame guard for a fallback anchor."
      - n: 2
        title: Leave labels on the anchor so a jump skips the addition
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/mods-settings-page-sections]
        technique: harmony-transpiler
        note: "Single call inserted before PopWidgetStyle on the Mods settings page; chosen so that when stock jumps over the page the added sections are skipped too. Contrast with approach 1 and say how to decide."
      - n: 3
        title: Snapshot state before a stock call, restore it in a paired prefix
        mod: unscience
        features: [mods/unscience/features/jplrepo-menu-bar-animation]
        technique: harmony-transpiler
        note: "Transpiler injects a cursor snapshot just before the version-string SetCursorPosY call; a prefix on DrawProgramMenusHook restores it and draws the animated words. A split between IL insertion and ordinary prefix."
      - n: 4
        title: Insert before the first and after the last instance of a pass boundary
        mod: shaderextensions
        features: [mods/shaderextensions/features/rendergame-render-pass-transpiler]
        technique: harmony-transpiler
        note: "Append ldloc.1, ldloc.0, ldc.i4.0, call after the last EndRenderPass; hard-coded local indices are only right while the compiler keeps the first two locals, so capture operands from matched instructions where possible."
    related: [write-a-harmony-transpiler, identify-a-call-by-its-argument-il, inject-ui-into-a-stock-window, inject-ui-into-the-transfer-planner-window, add-items-to-the-game-menu-bar, insert-a-custom-pass-into-render-game]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/mods-settings-page-sections, mods/unscience/features/jplrepo-menu-bar-animation]

  - slug: rewrite-a-comparison-or-value-read-with-a-transpiler
    title: Rewrite a comparison or a property read with a transpiler
    summary: "Change a decision the game makes inline rather than a call it makes: replace a compare-and-branch sequence by a call to a ranking helper that receives locals by reference, or intercept one getter read so a mod-owned value is returned for selected objects. Includes the IL shape checks and bail-out rules that keep this safe across builds."
    game_types: [KSA.CelestialSystem, KSA.Program, KSA.PhysicsBubble, KSA.StructuralLoad]
    engine_pointers:
      - current/decomp/KSA/CelestialSystem.cs GetNearbyAstronomical
      - current/decomp/KSA/PhysicsBubble.cs DetectStructuralFailure and current/decomp/KSA/StructuralLoad.cs GLoadFraction
    lifecycle: [startup:starmap-before-main, frame:celestials, physics:vehicle-solver]
    approaches:
      - n: 1
        title: Replace sub, ldloc, clt with a by-ref ranking call
        mod: realatmospheres
        features: [mods/realatmospheres/features/nearby-body-transpiler]
        technique: harmony-transpiler
        note: "Verify the exact IL sequence, read local slots from it, ldloca.s the best-so-far local, nop the now-redundant store, bail out returning original IL when labels or exception blocks fall inside the range. Records Patched so the log states the result."
      - n: 2
        title: Filter a single getter read for registered objects
        mod: unscience
        features: [mods/unscience/features/kitchen-sink-g-load-protection]
        technique: harmony-transpiler
        note: "Insert a filter after StructuralLoad.GLoadFraction so registered vessels read 0.0 while the structural-failure detector keeps its other checks; filter backed by a concurrent registry because DetectStructuralFailure runs on vehicle workers."
    related: [write-a-harmony-transpiler, make-game-null-checks-see-mod-state, choose-which-body-the-game-renders-in-detail, make-a-vehicle-indestructible, write-worker-thread-safe-solver-patches]
    borrowed_from: [mods/realatmospheres/features/nearby-body-transpiler, mods/unscience/features/kitchen-sink-g-load-protection]

  - slug: make-game-null-checks-see-mod-state
    title: Make the game's null checks see mod-supplied state
    summary: "A stock UI or flight-computer check such as Target == null hides buttons and panels for objects the game cannot represent. Rewrite the getter call that feeds each null test in several methods at once so it falls back to a mod side value, leaving other uses of the getter untouched."
    game_types: [KSA.Vehicle, KSA.GaugeCanvas, KSA.GaugeButtonNavBallMode, KSA.NavigationTarget]
    engine_pointers:
      - current/decomp/KSA/GaugeCanvas.cs IsContextVisible
      - current/decomp/KSA/GaugeButtonNavBallMode.cs IsDisabled and OnReleased
      - current/decomp/KSA/Vehicle.cs UpdateNavballData and IsDisabled(VehicleReferenceFrame)
    lifecycle: [startup:immediate-load, frame:draw-ui, frame:apply-solvers]
    approaches:
      - n: 1
        title: TargetMethods over four methods, rewrite get_Target followed by a null test
        mod: compendium
        features: [mods/compendium/features/navball-target-marker-and-tgt-frame]
        technique: harmony-transpiler
        note: "Match call get_Target followed by brtrue/brfalse or ldnull then ceq/cgt.un, replace with a static call that returns vehicle.Target ?? mod value, throw unless exactly one test per method. Pairs with a postfix on the private IsDisabled overload."
    related: [identify-a-call-by-its-argument-il, rewrite-a-comparison-or-value-read-with-a-transpiler, target-bodies-the-game-cannot-target, synthesize-a-navigation-target-for-the-flight-computer, patch-a-private-game-method-by-name]
    borrowed_from: [mods/compendium/features/navball-target-marker-and-tgt-frame]

  - slug: redirect-game-xml-loading
    title: Feed the game's XML loaders from memory instead of disk
    summary: "Make the game read patched or generated XML without editing files in Core. Either rewrite every XmlLoader.Load<T> call site in the Mod loader methods to a same-signature generic replacement that reads from a combined document, or prefix the loader methods to rewrite the Core mod's private asset path arrays to absolute shadow files. Covers generic-method matching, keeping OnDataLoad, and which loaders are deliberately left stock."
    game_types: [KSA.XmlLoader, KSA.Mod, KSA.ModLibrary, KSA.AssetBundle, KSA.SerializedCollection]
    engine_pointers:
      - current/decomp/KSA/XmlLoader.cs Load<T> (cached XmlSerializer without overrides)
      - current/decomp/KSA/Mod.cs LoadAssetBundles, LoadPlanetMeshes, LoadSystems, PrepareSystems, LoadEditorTagDefinitions, LoadPlanetRandomHeightmaps
      - current/decomp/KSA/SerializedCollection.cs Register (first duplicate id wins)
    lifecycle: [startup:starmap-before-main, startup:immediate-load, startup:asset-load]
    approaches:
      - n: 1
        title: Transpile every XmlLoader.Load<T> call to XmlPatcher.Load<T>
        mod: kittenextensions
        features: [mods/kittenextensions/features/xmlloader-call-site-redirect]
        technique: harmony-transpiler
        note: "HarmonyTargetMethods picks four callers by name; match constructed generic methods via GetGenericMethodDefinition, read T from GetGenericArguments, swap operand for MakeGenericMethod(T). The replacement reads the file's node from the patched document and still calls OnDataLoad. Why the helper itself is not patched, and why two callers are left stock."
      - n: 2
        title: Prefix the loader methods to point the Core mod at shadow files
        mod: realatmospheres
        features: [mods/realatmospheres/features/core-xml-entry-redirect]
        technique: harmony-prefix
        note: "Prefixes on Mod.PrepareSystems, LoadSystems, LoadAssetBundles, LoadEditorTagDefinitions rewrite the Core mod's private Assets and public SystemTemplates arrays to absolute paths (Path.Combine passes rooted paths through). No IL, no generic matching, but only helps when the mod owns the whole file."
    related: [write-a-harmony-transpiler, swap-one-call-inside-a-game-method-with-a-transpiler, change-stock-system-and-body-xml-without-editing-core, write-readonly-game-statics-with-unsafeaccessor, patch-a-lazily-loaded-game-assembly]
    borrowed_from: [mods/kittenextensions/features/xmlloader-call-site-redirect, mods/realatmospheres/features/core-xml-entry-redirect]

  # ------------------------------------------------------------------ inlining and callers
  - slug: patch-around-aggressive-inlining
    title: Change behaviour of a game method marked AggressiveInlining
    summary: "A Harmony detour only changes a method's own entry point, so callers that inlined the body never reach a prefix or postfix. Four ways out that mods use: rewrite the caller's call site, patch the non-inlined entry points that reach the target, patch the one outer method that always runs, or bracket the enclosing non-inlined methods. Includes how to find which of a method's callees are marked and how to detect a silent no-op."
    game_types: [KSA.PhysicsStates, KSA.FlightComputer, KSA.Vehicle, KSA.ConstraintSim, KSA.Universe, KSA.VehicleUpdateTask]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDrag (private static, AggressiveInlining)
      - current/decomp/KSA/FlightComputer.cs SetNullRot, SetInertialNullRot, LoadBurn, UpdateBurn, UnloadBurn
      - current/decomp/KSA/Vehicle.cs UpdateFromTaskResultsSynchronized
      - current/decomp/KSA/ConstraintSim.cs DetectCollisions, Simulate and the NarrowPhaseCallbacks struct
    lifecycle: [startup:all-mods-loaded, physics:vehicle-solver, frame:apply-solvers, physics:bepu]
    approaches:
      - n: 1
        title: Rewrite the one caller's call site instead of the callee
        mod: ksaero
        features: [mods/ksaero/features/computedrag-call-site-transpiler]
        technique: harmony-transpiler
        note: "ComputeDerivatives gets a transpiler that retargets the atmospheric ComputeDrag call; works whether or not the JIT inlined. Note that KSA.dll is debug-compiled in this build so inlining behaviour is not verified at run time and the rewrite is correct either way."
      - n: 2
        title: Patch the non-inlined entry points that reach the target too
        mod: ohmystars
        features: [mods/ohmystars/features/attitude-mode-handoff-patches]
        technique: harmony-prefix
        note: "TrackTarget, RateHold and SetNullRot are AggressiveInlining so prefixes may be bypassed; SetEnum, ToggleEnum, SetStabilization and HandleKittenAction are patched as well to cover the usual UI paths. List which paths remain exposed and how to confirm with a behavioural test."
      - n: 3
        title: Postfix the single non-inlined outer method instead of a per-vehicle callee
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick, mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: harmony-postfix
        note: "Universe.ApplyVehicleSolvers is static, runs once on the main thread after the pooled per-bubble work; Vehicle.UpdateFromTaskResultsSynchronized is AggressiveInlining so a callee detour could not be relied on. Also AFC's note that a private method later marked AggressiveInlining still resolves by reflection but its patch goes silent."
      - n: 4
        title: Bracket the non-inlined methods that enclose an inlined struct callback
        mod: unscience
        features: [mods/unscience/features/garrys-torch-scoped-collision-suppression, mods/unscience/features/sphinx-static-colliders]
        technique: harmony-finalizer
        note: "Bepu's NarrowPhaseCallbacks.AllowContactGeneration is AggressiveInlining on a value-type generic parameter; suppression is done by prefix and finalizer around ConstraintSim.DetectCollisions and Simulate. Sphinx keeps live acceptance open and relies on a one-call transpiler tripwire."
    related: [swap-one-call-inside-a-game-method-with-a-transpiler, replace-the-stock-aerodynamic-force-model, run-code-after-physics-results-land, run-cleanup-or-recover-from-exceptions-with-a-finalizer, suppress-collisions-for-one-vessel, test-patches-without-the-game, game-loop-and-lifecycle]
    borrowed_from: [mods/ohmystars/features/attitude-mode-handoff-patches, mods/unscience/features/garrys-torch-scoped-collision-suppression, mods/unscience/features/sphinx-static-colliders]

  # ------------------------------------------------------------------ safety
  - slug: refuse-a-patch-and-roll-back-when-the-game-changes
    title: Make a patch refuse and roll back when the game method has changed
    summary: "Treat a changed game method as a normal outcome: validate lookups, throw from the transpiler unless the shape is exactly what was expected, catch around Patch, remove only your own patches by Harmony id, log once, and publish the instance or feature flag only on success so dependent UI and code stay honest. Also covers dependent-feature gates and what a thrown anchor check does when it runs in StarMapBeforeMain."
    game_types: [KSA.PhysicsStates, KSA.TransferPlanner, KSA.Program, HarmonyLib.Harmony]
    engine_pointers:
      - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives
      - StarMap.Core/StarMapCore.cs DeInit (id-less UnpatchAll before StarMapUnload)
      - StarMap.Core/ModRepository/RuntimeMod.cs (StarMapBeforeMain invoked without try/catch)
    lifecycle: [startup:all-mods-loaded, startup:starmap-before-main, event:starmap-unload]
    approaches:
      - n: 1
        title: Throw on a bad match, UnpatchAll(own id), publish the instance on success
        mod: ksaero
        features: [mods/ksaero/features/patch-refusal-and-rollback, mods/ksaero/features/computedrag-call-site-transpiler]
        technique: harmony-transpiler
        note: "Layers: member lookup throws MissingMemberException, transpiler throws unless exactly one call matched, entry catches and unpatches by id, _harmony stays null so the readout window never shows. Warn that UnpatchAll() without an id removes every mod's patches."
      - n: 2
        title: One Harmony owner per feature with TryApply, validated handles and runtime flags
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/feature-gated-patch-sets]
        technique: harmony-prefix
        note: "FeaturePatchSet creates a Harmony per feature, rolls back by id on exception, dependent features gate on booleans, and the enable flags read by shared hooks come from the TryApply result so a still-installed shared hook never drives a failed feature."
      - n: 3
        title: Let an anchor failure stop the launch (and why that can be right)
        mod: shaderextensions
        features: [mods/shaderextensions/features/rendergame-render-pass-transpiler]
        technique: harmony-transpiler
        note: "ThrowIfInvalid inside PatchAll in StarMapBeforeMain aborts startup because StarMap does not catch; the mod chooses this over running half-patched since pre- and post-ImGui passes depend on the transpiler. Compare with approaches 1 and 2 and state that a shifted local index is not detected at all."
    related: [isolate-patch-failures-per-class-or-feature, make-patch-bodies-fault-proof, validate-game-reflection-targets-at-load, remove-your-patches-safely-at-runtime-and-at-exit, check-the-game-version, apply-harmony-patches-independently, game-loop-and-lifecycle]
