        note: "Per-axis drag replaces UpdateSelectedScale but reuses the game's private QuantizeScale and ForEachPartWithSymmetry through delegates; shows binding instance methods to delegates and the null-check on bind."
    related: [access-private-members-with-reflection, resolve-overloaded-and-byref-game-methods, replace-the-stock-aerodynamic-force-model, unclamp-editor-part-scaling]
