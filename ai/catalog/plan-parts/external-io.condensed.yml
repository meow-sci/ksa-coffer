    technique: native-interop
    note: 'Source-generated LibraryImport, natives cross-compiled with zig for three RIDs, a layout self-check that fails loudly at startup. README with the upstream commit, markers at every local change, and a self-check that fails when the native export list or struct layout drifts. Sub-step: vendoring and patching the upstream binding with divergence markers and a pin-bump check (formerly vendor-and-patch-a-third-party-binding) gets its own section.'
