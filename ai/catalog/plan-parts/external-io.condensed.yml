- slug: run-an-unattended-scenario-and-report-pass-or-fail
  title: 'Run scripted scenarios unattended: load a save, step exact sim time, report a verdict'
  summary: 'Turn the running game into an end-to-end test. A request file read and deleted at load selects a scenario, a state machine flies it, tagged log lines carry progress and the verdict, and a shell harness waits on the tag, takes screenshots on cue and exits non-zero on FAIL or TIMEOUT. Sub-steps: loading a save by name and waiting until a craft is flown (closing any popup that holds the throttle), and unpausing for an exact number of simulated seconds then pausing again.'
  game_types:
  - KSA.GameSaves
  - KSA.Popup
  - KSA.Program
  - KSA.Universe
  - KSA.SimSpeed
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  - current/decomp/KSA/Program.cs OnFrame
  - current/decomp/KSA/Popup.cs Popups (private static list), AnyOpen
  - current/decomp/KSA/Universe.cs GetLastSimStep, SetSimulationSpeed
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - frame:after-on-frame
  - startup:game-loaded
  approaches:
  - n: 1
    title: Request file, state machine, SCENARIO log lines and wall and sim budgets
    mod: ksarmory
    features:
    - mods/ksarmory/features/unattended-scenario-runner
    technique: state-machine
    note: 'Why a file rather than an environment variable (game launched across WSL), take-once semantics, snapshot-and-restore of config around a run, TIMEOUT with a description of where it was stuck. LoadingSave then WaitingForWorld states; each frame closes engine popups found through the private static Popup.Popups list because an open one holds the throttle. Sub-step: loading a save with GameSaves.LoadSaveGame, waiting for the world and closing the engine popup by reflection, gets its own section.'
  - n: 2
    title: Bridge commands for loading a save and stepping an exact number of simulated seconds
    mod: ksacars
    features:
    - mods/ksacars/features/file-drop-command-bridge
    - mods/ksagolf/features/file-command-bridge
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    technique: file-ipc
    note: 'load installs a closure that returns its reply only when Program.ControlledVehicle exists. Same closure in three bridges: dtSim is the last sim step in a flight scene and 0 while paused or in menus; the reply is withheld until the sum reaches the requested seconds. Mention SetSimulationSpeed with speeds below the UI''s floor. Two sub-steps for a section each: load-a-save polling until a vehicle is controlled, and a per-frame closure summing Universe.GetLastSimStep().DeltaTime to pause after exactly N simulated seconds.'
  related:
