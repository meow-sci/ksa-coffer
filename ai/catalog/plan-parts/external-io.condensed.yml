- slug: let-ai-agents-control-the-game-over-mcp
  title: Let AI agents drive the game through an MCP server
  summary: 'Expose the game to a coding agent as MCP tools, either with an in-process Streamable HTTP endpoint on the game''s own server or with a small stdlib Python MCP server that wraps a file bridge and returns screenshots inline. Also covers shaping tools and resources for a language-model client instead of a programmer: logical grouped reads, batch and scheduled actions, stable action keys and error results an agent can act on.'
  game_types: []
  engine_pointers:
  - current/decomp/KSA/Constants.cs LogsFolderPath (where the file bridge folders live)
  lifecycle:
  - startup:all-mods-loaded
  - thread:background
  - event:unload
  approaches:
  - n: 1
    title: Stateless Streamable HTTP MCP endpoint inside the game process
    mod: gatos
    features:
    - mods/gatos/features/mcp-server-for-agents
    technique: protocol-server
    note: 'ModelContextProtocol.Core behind a hand-rolled HTTP adapter, a stateless transport per request, Host and Origin validation against DNS rebinding, tools mapped to the command queue. How reads are grouped for few round trips, how batch and scheduled actions map to SubmitBatchAsync and the scheduler, and how errno names become tool errors. Sub-step: give agent-facing API design (McpRegistry logical resources, grouped reads, batch and scheduled actions, stable action keys, actionable errors) its own section.'
  - n: 2
    title: Stdlib Python stdio MCP server wrapping the file bridge, with image tools
    mod: ksacars
    features:
    - mods/ksacars/features/ksa-mcp-server
