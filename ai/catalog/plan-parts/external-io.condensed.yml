    technique: native-interop
    note: 'The game never forks (a large multithreaded process); SETSID, slave as stdin, signal reset; DllImport resolution through a per-assembly resolver. Sub-step: the variadic ioctl padding for Apple arm64 is covered in bind-and-vendor-native-c-libraries; link to it.'
