- slug: design-an-inter-mod-registry-contract
  title: Design and consume an inter-mod registry contract across assembly load contexts
  summary: Shape the surface another mod binds to so it survives refactors and needs no game references, and consume it from the other side. Covers small text-only members, results with faults instead of exceptions, validation probes, factory registries, a duck-typed attribute API bound by full name across every AssemblyLoadContext, optional versus required dependencies, registering from the right startup hook, staying inert when the host mod is absent, and a committed API-surface record that CI diffs.
  game_types:
  - KSA.Program
  - KSA.KeyHash
  engine_pointers:
  - StarMap.Core ModAssemblyLoadContext (type identity across mods; see share-types-between-mods)
