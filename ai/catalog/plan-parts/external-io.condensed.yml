    note: CreatePseudoConsole plus a process attribute list, STARTF_USESTDHANDLES with null handles, and a teardown that closes the pseudoconsole first and leaks handles still in use rather than closing them under a pump.
  - n: 3
    title: POSIX pty via posix_openpt and posix_spawnp with a poll reader and a waitpid thread
    mod: purrtty
    features:
