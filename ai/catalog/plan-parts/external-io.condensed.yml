  title: Connect a VM guest to the game with slirp TCP, a 9P filesystem and pinned SSH
  summary: 'The channels between a QEMU guest and the game process that work on Windows, Linux and macOS: TCP over slirp user networking with pre-allocated host ports and guest-side supervisors; a from-scratch 9P2000.L server exposing a virtual filesystem and confined host folders (including synthetic files that behave under cat, watch and tail -f); and SSH.NET sessions that refuse a host key whose SHA-256 does not match the guest manifest.'
