- slug: script-gameplay-through-a-command-bridge
  title: Drive a running game from outside through a file-drop command bridge
  summary: 'Let a script or an AI agent operate a game that stays running by dropping JSON command files into a per-mod folder and reading JSON replies back, polled from a frame hook that KSA always calls. Covers the atomic .part rename on both sides, one command at a time, multi-frame commands as per-frame closures, and the reply format. Includes keeping the bridge developer-only: a deploy script writes an empty marker file beside the DLL, the release package never contains it, and the mod checks it once at load.'
  game_types:
  - KSA.Program
  - KSA.Universe
  - KSA.GameSaves
  - KSA.Constants
  engine_pointers:
  - current/decomp/KSA/Program.cs OnFrame (StarMapAfterOnFrame postfix site; StarMapAfterGui sits inside the DrawUI block)
  - current/decomp/KSA/Constants.cs DocumentsFolderPath, LogsFolderPath
  - current/decomp/KSA/Universe.cs SetSimulationSpeed, GetLastSimStep
  - current/decomp/KSA/Constants.cs LogsFolderPath (where bridge folders live)
  lifecycle:
  - startup:all-mods-loaded
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Bridge with a KSA-free BridgeCommand parser and craft-level commands
    mod: ksacars
    features:
    - mods/ksacars/features/file-drop-command-bridge
    technique: file-ipc
    note: 'The reference implementation: in/ and out/ folders under the mod log folder, lexically first file every 0.1 s of player time, BridgeCommand.TryParse in a game-free Sim assembly, closures advanced once per frame for step, load and capture, plus spawn, drive, seat kittens and a telemetry report command. Sub-step: give the developer-only marker-file gate (Build.Developer from a file written by the deploy script) a section, since it applies to every bridge below.'
  - n: 2
    title: Generic get/set of config fields by reflection and composed-shot commands
    mod: ksagolf
    features:
    - mods/ksagolf/features/file-command-bridge
    technique: file-ipc
    note: Adds set/get over every public Config field by name, kitten pose and prop commands, camera holding and a swing array; shows how a bridge grows with a mod's panels.
  - n: 3
    title: Bridge with shader hot reload and an in-building scene for visual checks
    mod: ksastructures
    features:
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    technique: file-ipc
    note: Adds reload_shaders through the internal FileReference.DoLoad, lighting and view commands, and the closure model; useful as the lean variant of the same protocol.
  - n: 4
    title: Bridge that doubles as an effect lab and a camera claimant
    mod: ksarmory
    features:
