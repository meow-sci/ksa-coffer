- slug: record-telemetry-to-csv
  title: Sample telemetry history and record it to CSV without stalling the frame
  summary: Write flight telemetry to a file for later analysis, either as an on-demand export of a history buffer or as a continuous per-step recorder that buffers rows, flushes in batches, never throws and never waits on the disk. Includes the wall-clock player-time interval that feeds a fixed-length history array for a HUD graph.
  game_types:
  - KSA.Vehicle
  - KSA.Universe
  - KSA.Program
  - KSA.App
  engine_pointers:
