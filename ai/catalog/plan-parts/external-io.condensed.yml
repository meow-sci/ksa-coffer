  - current/decomp/KSA/Program.cs Main (the prefix target)
  lifecycle:
  - startup:starmap-before-main
  - startup:all-mods-loaded
  approaches:
  - n: 1
    title: Text-only registration members with fault results, required dependency and a CI-checked API surface
    mod: ksarmory
    features:
    - mods/ksarmory/features/armoury-pack-registration-api
    technique: inter-mod-api
    note: 'A pack needs only KSArmory.dll; Register(string, string) validates and returns faults; registration from the pack''s entry point precedes StarMapAllModsLoaded. Dependent mod orders after the host, registers during its own startup hook, and receives a fault result if it registers too late. tools/pack-api.py regenerates docs/PACK-API-SURFACE.md from source and checks it in CI; a Schema constant is bumped on a real break. Sub-step: the PACK-API-SURFACE record and CI diff (formerly record-and-check-the-api-other-mods-bind-to) gets its own section; also cover the consumer side, registering from the pack entry point.'
  - n: 2
    title: Factory registry with a validation probe, contract assembly import and optional dependency
    mod: purrtty, gatos
    features:
    - mods/purrtty/features/custom-shell-registry-and-lifecycle
    - mods/purrtty/features/custom-shell-contract-via-assembly-imports
    - mods/gatos/features/purrtty-custom-shell-contract
    technique: inter-mod-api
    note: 'ICustomShell contract free of game and UI types; RegisterShell constructs a probe instance to validate before accepting; the host presents in-process shells as PTY process managers. Optional = true with Private = true copies in deps.json; detection by assembly location so the vendored copy is never mistaken for the real host. Sub-step: the consumer side, declaring an optional dependency, vendored fallback copies and registering at StarMapAllModsLoaded while staying inert when the host mod is absent.'
  - n: 3
    title: Duck-typed attributes bound by FullName with MakeGenericMethod and CreateDelegate
    mod: shaderextensions
    features:
    - mods/shaderextensions/features/duck-typed-attribute-api
    technique: inter-mod-api
    note: 'Scan AssemblyLoadContext.All after StarMap loaded every mod; unmanaged constraints are not enforced through reflection; no hard dependency, no type identity problems. Sub-step: scanning every AssemblyLoadContext with GetCustomAttributesData in a Program.Main prefix is the answer to loading across load contexts; give it a section.'
