- slug: host-and-supervise-an-external-process-from-a-mod
  title: Host and supervise an external process or virtual machine from a KSA mod
  summary: Start a child process from the game without blocking the frame or leaking it, with pumps for its output, a queued writer, readiness probing, and bounded shutdown at unload. Three concrete shapes cover a long-lived VM, a Windows pseudoconsole shell and a Unix pty shell. The VM shape also covers per-OS QEMU accelerator ladders (WHPX, HVF, KVM, TCG fallback), CPU models, a pristine base image with per-profile qcow2 overlays and a pinned guest image fetched by the build. A further sub-step finds installed shells and WSL distributions on a background thread and builds correct launch command lines.
