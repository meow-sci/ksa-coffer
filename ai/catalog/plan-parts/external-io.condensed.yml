    - mods/gatos/features/qcow2-overlay-guest-disks
    - mods/gatos/features/alpine-guest-image
    technique: process-hosting
    note: 'Everything off the main thread; StarMapUnload runs a bounded stop so a hung child cannot hold the game exit. Direct kernel boot artifacts plus a manifest contract, a PID lock on the overlay, grow-only resize, a minimal busybox init with respawned supervisors. Sub-step: the QemuCommandBuilder accelerator ladder, qcow2 overlay disks and pinned Alpine guest image (formerly run-a-virtual-machine-alongside-the-game) get their own sections.'
