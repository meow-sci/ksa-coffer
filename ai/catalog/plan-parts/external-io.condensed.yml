    - mods/gatos/features/telemetry-sampler-snapshot
    technique: edge-detection
    note: Situation, SOI, engine, flameout, docking, decoupling, animation and battery events; the same event list feeds a blocking 9p file, SSE and MQTT.
  - n: 2
