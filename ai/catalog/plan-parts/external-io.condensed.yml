  summary: Call a C library from a KSA mod safely. Use blittable layout-exact structs verified against a C probe compiled from the same headers, source-generated or hand-written imports, a startup layout self-check, one thread per solver instance, and per-RID builds. Loading the library from the mod folder is covered in the getting-started topic. Also covers vendoring an upstream binding (pruned, local patches marked as divergences, pin-bump self-checks) and the Apple arm64 variadic-call pitfall for ioctl and friends.
