  # ------------------------------------------------------------------ driving the flight computer
  - slug: choose-a-moment-to-write-flight-computer-state
    title: Choose the safe moment to read and write flight computer state
    summary: The vehicle solver snapshots the flight computer each step and applies results afterward; writes at the wrong moment are erased, raced or seen a step late. Pick the window (PrepareWorker prefix, ExecuteNextVehicleSolvers prefix, ComputeControl on the worker, post-ApplyVehicleSolvers tick) for the job.
    game_types: [KSA.Vehicle, KSA.FlightComputer, KSA.Universe, KSA.VehicleUpdateState, KSA.VehicleUpdateData, KSA.PhysicsBubble]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs PrepareWorker
      - current/decomp/KSA/Universe.cs ExecuteNextVehicleSolvers, ApplyVehicleSolvers
      - current/decomp/KSA/FlightComputer.cs CopyFrom, ComputeControl
    lifecycle: [frame:dispatch-solvers, frame:apply-solvers, physics:vehicle-solver]
    approaches:
      - n: 1
        title: Vehicle.PrepareWorker prefix (previous step applied, worker not started)
        mod: ksarmory
        features: [mods/ksarmory/features/prepareworker-prefix-command-window]
        technique: harmony-prefix
        note: Queued writes performed just before KSA snapshots the vehicle; double-buffered across the frame.
      - n: 2
        title: ExecuteNextVehicleSolvers prefix at Priority.First
        mod: gatos
        features: [mods/gatos/features/solver-phase-command-drain]
        technique: harmony-prefix
        note: After apply, before PrepareWorker; why frame-phase writes are erased by CopyFrom.
      - n: 3
        title: Worker-thread postfix on FlightComputer.ComputeControl
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/flight-computer-command-sink]
        technique: harmony-postfix
        note: One sink runs every mod actuator writer on the vehicle worker with immutable commands.
      - n: 4
        title: Main-thread tick around Universe.ApplyVehicleSolvers
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick]
        technique: harmony-postfix
        note: Fresh physics results before input is drained and before stock reacts to burn flags.
      - n: 5
        title: ComputeControl prefix with a finalizer that restores edited input
        mod: compendium
        features: [mods/compendium/features/flight-computer-root-attitude-tracking]
        technique: harmony-finalizer
        note: Edit inputs by ref on the worker, restore after the original runs.
    related: [command-attitude-through-the-flight-computer, run-code-after-physics-results-land, run-an-autopilot-for-every-vehicle-each-step]
    borrowed_from: [mods/ksarmory/features/prepareworker-prefix-command-window, mods/gatos/features/solver-phase-command-drain, mods/ksa-advancedflightcomputer/features/flight-computer-command-sink, mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick]

