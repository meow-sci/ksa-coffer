category: flight-and-orbits
description: Reading a vehicle's flight state and orbit, working in KSA's coordinate frames and epochs, driving the flight computer and burns from a mod, extending the stock Transfer Planner and orbit menus, transfer and encounter math, targets, map-view overlays and guided flight (ascent, boostback, landing, ballistic and homing guidance).
topics:
  # ------------------------------------------------------------------ reading vehicle state
  - slug: read-vehicle-flight-state
    title: Read a vehicle's position, velocity, attitude and orbit
    summary: Pull a consistent kinematic snapshot (position, velocity, attitude, mass, orbit, navball, SOI encounters) out of KSA.Vehicle, knowing which frame and unit each member uses, and decide on which thread and at which point of the frame the read is valid.
    game_types: [KSA.Vehicle, KSA.Orbit, KSA.NavBallData, KSA.PatchedConic, KSA.Encounter, KSA.UniverseTime]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs (GetPositionCci, GetVelocityCci, GetBody2Cci, Orbit, NavBallData)
      - current/decomp/KSA/Program.cs OnFrame (what is settled after the solver apply)
      - current/decomp/KSA/Universe.cs ApplyVehicleSolvers
    lifecycle: [frame:viewports, frame:draw-ui, frame:after-on-frame]
    approaches:
      - n: 1
        title: Immutable snapshot built in a main-viewport OnFrame prefix
        mod: gatos
        features: [mods/gatos/features/vessel-flight-state-reads]
        technique: immutable-snapshot
        note: CCI/CCF/ECL members, NaN scrubbing, UniverseTime sentinels and SOI encounters copied into a record that other threads can read without touching the game.
      - n: 2
        title: Plain snapshot taken from StarMapAfterOnFrame, drawn next frame
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/live-flight-telemetry-sampling]
        technique: snapshot-copy
        note: One read per frame after the game finished the frame, one frame of latency, no locks; shows the apsides, thrust, T/W and downrange extras.
      - n: 3
        title: Postfix read of a settled vehicle for an instrument panel
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/flight-data-from-vehicle]
        technique: harmony-postfix
        note: Reading after the vehicle solver results are applied so values are not a frame stale; compare with approaches 1 and 2.
    related: [read-altitude-speed-and-g-load, understand-ksa-coordinate-frames, read-orbit-elements-and-timing, run-code-after-physics-results-land]
    borrowed_from: []

  - slug: read-altitude-speed-and-g-load
    title: Read altitude, speeds, g-load, dynamic pressure and Mach
    summary: Choose the right altitude (barometric versus radar versus near-surface radius), speed (orbital versus surface versus air-relative), g-load and dynamic pressure for the controlled vehicle, and derive Mach from the active atmosphere.
    game_types: [KSA.Vehicle, KSA.PhysicsEnvironment, KSA.PhysicalAtmosphereReference, KSA.ReadOnlyPhysicsStates, KSA.SituationEx]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs (GetBarometricAltitude, GetRadarAltitude, GetSurfaceSpeed, AccelerationBody)
      - current/decomp/KSA/PhysicsEnvironment.cs
      - current/decomp/KSA/PhysicalAtmosphereReference.cs
    lifecycle: [frame:viewports, frame:after-on-frame]
    approaches:
      - n: 1
        title: Flight instrument values from the vehicle (altitudes, vertical speed, g, Mach)
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/flight-data-from-vehicle]
        technique: custom-physics
        note: Barometric versus radar altitude, surface speed, AccelerationBody and Mach computed from PhysicalAtmosphereReference.
      - n: 2
        title: Telemetry readouts with q, thrust and T/W
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/live-flight-telemetry-sampling]
        technique: snapshot-copy
        note: Reads dynamic pressure from ReadOnlyPhysicsStates.Environment, sums active engine thrust, derives T/W and downrange.
      - n: 3
        title: Speed of sound from pressure and density
        mod: ksaero
        features: [mods/ksaero/features/mach-from-game-atmosphere]
        technique: flight-math
        note: sqrt(1.4 p / rho) from PhysicsEnvironment; constant per body because KSA atmospheres are isothermal.
    related: [read-vehicle-flight-state, compute-angle-of-attack-and-sideslip, compute-live-engine-thrust, compute-a-suicide-burn]
    borrowed_from: [mods/ksaero/features/mach-from-game-atmosphere]

  - slug: compute-attitude-in-the-local-horizon-frame
    title: Get roll, pitch and heading relative to the local horizon
    summary: Turn the vehicle's body-to-inertial attitude into aviation-style roll, pitch and heading by composing it with the local east-north-up frame, and convert quaternions without assuming a handedness or order.
    game_types: [KSA.Vehicle, KSA.VehicleReferenceFrameEx, KSA.QuaternionEx, Brutal.Numerics.doubleQuat]
    engine_pointers:
      - current/decomp/KSA/VehicleReferenceFrameEx.cs GetEnuBody2Cci
      - current/decomp/KSA/Vehicle.cs GetBody2Cci
    lifecycle: [frame:viewports, frame:dispatch-solvers]
    approaches:
      - n: 1
        title: Concatenate GetBody2Cci with the inverse of the ENU frame, then ToRollPitchYawRadians
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/flight-data-from-vehicle]
        technique: custom-physics
        note: The game-supplied ENU body frame does the horizon work; the article shows the composition order and the resulting angle conventions.
      - n: 2
        title: Transform basis vectors with the game's own quaternion type
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/vehicle-state-to-site-frame]
        technique: frame-conversion
        note: Never assume a quaternion convention (doubleQuat is scalar-last); rotate known basis vectors and rebuild the attitude from them. Body axes inferred from the measured thrust direction.
    related: [compute-angle-of-attack-and-sideslip, build-a-local-site-frame, understand-ksa-coordinate-frames]
    borrowed_from: []

  - slug: compute-angle-of-attack-and-sideslip
    title: Compute angle of attack and sideslip
    summary: Rotate the air-relative velocity into body axes to obtain alpha and beta for an HUD or an aero model, using surface (not orbital) velocity and the vehicle's own axis convention.
    game_types: [KSA.Vehicle, KSA.VehicleReferenceFrameEx, KSA.PhysicalAtmosphereReference]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs (GetBody2Cci, surface velocity)
      - current/decomp/KSA/VehicleReferenceFrameEx.cs
    lifecycle: [frame:viewports]
    approaches:
      - n: 1
        title: Surface velocity in body axes
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/flight-data-from-vehicle]
        technique: custom-physics
        note: Alpha and beta from the body-frame velocity components; why the wind-relative velocity is the right input.
    related: [compute-attitude-in-the-local-horizon-frame, measure-lift-and-drag-under-the-active-aero-model, steer-descent-with-angle-of-attack]
    borrowed_from: []

  - slug: compute-live-engine-thrust
    title: Compute the current thrust, Isp and throttle needed for a thrust demand
    summary: Evaluate the active engines with the game's own performance model at the live ambient pressure, mirror the flight computer's g-load throttle cap, and invert a thrust demand into a throttle (solid motors excluded).
    game_types: [KSA.EngineController, KSA.ActiveEnginePerformance, KSA.RocketControllerData, KSA.FlightComputer, KSA.SolidMotor]
    engine_pointers:
      - current/decomp/KSA/EngineController.cs ComputeActivePerformance
      - current/decomp/KSA/FlightComputer.cs SolveGLoadThrottleCap
    lifecycle: [frame:after-on-frame, frame:dispatch-solvers]
    approaches:
      - n: 1
        title: Sum ComputeActivePerformance ThrustMax per active controller
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/live-flight-telemetry-sampling]
        technique: snapshot-copy
        note: The simplest live thrust and T/W number for a readout.
      - n: 2
        title: Core-model evaluation at a throttle and pressure, with throttle inversion
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/engine-performance-and-throttle-inversion]
        technique: engine-model-reuse
        note: Thrust at ambient pressure, bracketed root find for a requested thrust, saturation reporting, solid-motor detection and the g-load cap.
    related: [compute-a-suicide-burn, fly-closed-loop-ascent-guidance, read-vehicle-staged-delta-v]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/engine-performance-and-throttle-inversion]

  - slug: compute-mission-elapsed-time-and-detect-liftoff
    title: Show mission elapsed time from actual liftoff
    summary: Stock MET counts from spawn, so a launch clock needs its own liftoff detection, handling of split stages sharing a launch, and recovery from quickload or revert.
    game_types: [KSA.Vehicle, KSA.UniverseTime, KSA.Universe, KSA.CelestialSystem, KSA.LookupCollection]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs LaunchGameTime, Split
      - current/decomp/KSA/Universe.cs GetElapsedSeconds
    lifecycle: [frame:after-on-frame, frame:draw-ui]
    approaches:
      - n: 1
        title: T-/T+ clock keyed on LaunchGameTime with contact-loss liftoff detection
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/mission-clock-and-liftoff-detection]
        technique: starmap-lifecycle
        note: Liftoff from contact loss, burning engine and climb rate; LaunchGameTime nanoseconds as the grouping key for stages; revert detection when elapsed time goes backwards; epochs persisted to config.
    related: [draw-a-mission-timeline-with-planned-burns, choose-a-clock-under-time-warp]
    borrowed_from: []

  # ------------------------------------------------------------------ frames and epochs
  - slug: understand-ksa-coordinate-frames
    title: Understand KSA coordinate frames (ECL, CCE, CCI, CCF, ego, body)
    summary: Which frame each Vehicle, Orbit and Camera API speaks, how to convert between them, what rotates and what only translates, and the units that trip modders (ecliptic-versus-equatorial inclination, CCE sharing ECL axes, ego being a translation of ECL).
    game_types: [KSA.Vehicle, KSA.IParentBody, KSA.Orbit, KSA.Camera, KSA.CelestialFrameMath]
    engine_pointers:
      - current/decomp/KSA/Celestial.cs (GetCce2Cci, GetCci2Ccf)
      - current/decomp/KSA/Orbit.cs (Inclination, CreateFromStateCci)
      - current/decomp/KSA/Camera.cs (EclToEgo, GetPositionEgo)
    lifecycle: [frame:draw-ui, frame:dispatch-solvers]
    approaches:
      - n: 1
        title: Vessel state in CCI/CCF/ECL
        mod: gatos
        features: [mods/gatos/features/vessel-flight-state-reads]
        technique: immutable-snapshot
        note: Attitude is stored as Body2Cce; the table of which member is in which frame.
      - n: 2
        title: Ecl as the mod's working frame, ego for anything drawn
        mod: ksarmory
        features: [mods/ksarmory/features/ecliptic-frames-and-epochs]
        technique: frame-invariant-signatures
        note: All state in Ecl at the sub-step instant; the 29.8 km/s carrier that makes mixing epochs fail.
      - n: 3
        title: Anchors stored in the owner's frame and resolved on use
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/live-body-relative-anchors]
        technique: frame-relative-anchors
        note: CCE offset, orbit-parent offset, body-fixed lat/lon and part-local asmb frames as resolve-to-ECL recipes.
      - n: 4
        title: Equatorial versus ecliptic reference planes
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/apse-and-inclination-quick-tools]
        technique: custom-physics
        note: Orbit.Inclination is measured against CCI +Z (the parent pole); the ecliptic normal is CCE +Z via GetCce2Cci (AFC labels the two the other way round).
    related: [sample-positions-at-a-consistent-epoch, build-a-local-site-frame, convert-position-to-latitude-longitude, anchor-a-point-to-a-rotating-body]
    borrowed_from: [mods/gatos/features/vessel-flight-state-reads, mods/ksarmory/features/ecliptic-frames-and-epochs]

  - slug: sample-positions-at-a-consistent-epoch
    title: Sample positions at one consistent epoch
    summary: Positions of a craft, a target and the camera belong to different instants within a frame; differencing or drawing them naively gives errors of hundreds of metres per frame. Pair each sample with its epoch, back-date, or measure offsets against the same-instant platform sample.
    game_types: [KSA.Universe, KSA.Camera, KSA.Vehicle, KSA.PhysicsBubble]
    engine_pointers:
      - current/decomp/KSA/Camera.cs GetPositionEgo, EclToEgo
      - current/decomp/KSA/Universe.cs GetElapsedTime, ApplyVehicleSolvers
    lifecycle: [frame:draw-ui, frame:celestials, frame:after-on-frame]
    approaches:
      - n: 1
        title: Everything in Ecl at GetElapsedTime, targets back-dated, overlays anchored to the rendered ego position
        mod: ksarmory
        features: [mods/ksarmory/features/ecliptic-frames-and-epochs, mods/ksarmory/features/cpa-threat-classification]
        technique: frame-invariant-signatures
        note: One parent-first walk in ApplyVehicleSolvers decides which instant each engine sample belongs to; relative motion taken from paired samples.
      - n: 2
        title: Pair the rendered Ego position with Ecl offsets from the same instant
        mod: ksagolf
        features: [mods/ksagolf/features/frame-epoch-draw-anchor]
        technique: frame-epoch
        note: Draw next to a craft by measuring offsets against a platform sample taken the same frame, avoiding the 500 m-per-frame ecliptic error.
    related: [understand-ksa-coordinate-frames, choose-a-clock-under-time-warp, find-closest-approach-along-the-flight-plan]
    borrowed_from: [mods/ksagolf/features/frame-epoch-draw-anchor, mods/ksarmory/features/cpa-threat-classification]

  - slug: build-a-local-site-frame
    title: Build a local east-north-up site frame and surface-relative velocity on a rotating body
    summary: Make a frame at a launch or landing site (origin at the site, up radial, horizontal axes from the spin axis or a fixed reference), express vehicle state in it, and subtract the body's rotation to get surface-relative velocity.
    game_types: [KSA.Vehicle, KSA.IParentBody, KSA.StateVectors, KSA.Double3Ex, KSA.FlightComputerNavigation]
    engine_pointers:
      - current/decomp/KSA/IParentBody.cs GetAngularVelocityCci
      - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf
      - current/decomp/KSA/VehicleReferenceFrameEx.cs
    lifecycle: [frame:dispatch-solvers, frame:draw-ui]
    approaches:
      - n: 1
        title: Site frame from CCI for guidance, with v minus omega cross r
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/vehicle-state-to-site-frame]
        technique: coordinate-bridge
        note: Converts vehicle state, gimbal limits and attitude into a site-fixed frame for solvers and back; surface-relative velocity.
      - n: 2
        title: North from the spin axis, terrain height queries in the same frame
        mod: ksagolf
        features: [mods/ksagolf/features/terrain-height-queries]
        technique: frame-conversion
        note: Why north must come from the body's spin axis, not the ecliptic; ties the frame to Celestial terrain-height queries.
      - n: 3
        title: Orbit-relative surface velocity readouts
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate]
        technique: flight-math
        note: Surface velocity = v - omega x r in the CCI frame, split into radial and tangential parts.
    related: [understand-ksa-coordinate-frames, compute-attitude-in-the-local-horizon-frame, convert-position-to-latitude-longitude, fuel-optimal-powered-landing]
    borrowed_from: [mods/ksagolf/features/terrain-height-queries]

  - slug: convert-position-to-latitude-longitude
    title: Convert a position to latitude, longitude and altitude
    summary: Take a CCI position through the body-fixed frame and into geodetic coordinates for readouts, landing sites and ground tracks.
    game_types: [KSA.Vehicle, KSA.IParentBody, KSA.Celestial]
    engine_pointers:
      - current/decomp/KSA/Celestial.cs GetCci2Ccf, GetLlaFromCcf
    lifecycle: [frame:draw-ui, frame:viewports]
    approaches:
      - n: 1
        title: PositionCci.Transform(Parent.GetCci2Ccf()) then GetLlaFromCcf
        mod: gatos
        features: [mods/gatos/features/vessel-flight-state-reads, mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate]
        technique: frame-conversion
        note: The two mods use the same two calls; the article also covers the reverse (lat/lon to a position) used in site and landing code.
    related: [anchor-a-point-to-a-rotating-body, build-a-local-site-frame, understand-ksa-coordinate-frames]
    borrowed_from: [mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate]

  - slug: anchor-a-point-to-a-rotating-body
    title: Keep a point attached to a rotating, orbiting body
    summary: A ground aimpoint, a measurement endpoint or a landing target must follow the planet's spin and orbit; store it in the body's own frame and re-resolve to ecliptic position and velocity every frame, including its ground velocity.
    game_types: [KSA.Celestial, KSA.Astronomical, KSA.IParentBody, KSA.CelestialSystem, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/Celestial.cs (GetCcf2Cce, GetTerrainHeightFromDirCcf)
      - current/decomp/KSA/Universe.cs DeserializeSave
    lifecycle: [frame:draw-ui, frame:input, event:save-load]
    approaches:
      - n: 1
        title: Body-fixed ground point re-read into ecliptic position and velocity each frame
        mod: ksarmory
        features: [mods/ksarmory/features/ground-target-designation-and-reach]
        technique: body-fixed-anchor
        note: Click on terrain via a cursor ray, store as a body-fixed anchor, re-resolve per frame with the ground's velocity.
      - n: 2
        title: Immutable anchors in CCE, orbit-parent or body-fixed frames, pruned and cleared on save load
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/live-body-relative-anchors]
        technique: frame-relative-anchors
        note: Identity-based pruning each frame, a DeserializeSave postfix to drop state the system-change check misses.
    related: [understand-ksa-coordinate-frames, pick-bodies-and-orbit-lines-under-the-cursor, convert-position-to-latitude-longitude]
    borrowed_from: []

  # ------------------------------------------------------------------ orbits, bodies and readouts
  - slug: read-orbit-elements-and-timing
    title: Read orbit elements, apsides and event countdowns
    summary: Derive period, apoapsis and periapsis, node and apsis countdowns, eccentricity vector and a vessel's state-vector orbit from KSA.Orbit, including the UniverseTime saturation sentinels and Orbit.Mu pitfalls.
    game_types: [KSA.Orbit, KSA.Vehicle, KSA.TrueAnomaly, KSA.UniverseTime, KSA.IParentBody]
    engine_pointers:
      - current/decomp/KSA/Orbit.cs (GetRemainingTimeTo, GetPhaseAngle, Mu)
      - current/decomp/KSA/UniverseTime.cs EndOfTime, IsSaturated
    lifecycle: [frame:draw-ui, frame:viewports]
    approaches:
      - n: 1
        title: Readouts from state vectors in the CCI frame
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate]
        technique: flight-math
        note: Apsides, period, time to node via GetRemainingTimeTo(TrueAnomaly), eccentricity vector.
      - n: 2
        title: Sentinel-safe orbit and encounter reads
        mod: gatos
        features: [mods/gatos/features/vessel-flight-state-reads]
        technique: immutable-snapshot
        note: EndOfTime converts to a finite number; test IsSaturated before using times from an escape or non-intersecting orbit.
    related: [read-celestial-orbit-and-body-data, classify-vessel-orbit-state, estimate-hohmann-transfer-delta-v]
    borrowed_from: []

  - slug: read-celestial-orbit-and-body-data
    title: Read a body's orbit elements, Mu and physical data safely
    summary: Enumerate bodies (the star is a StellarBody, not a Celestial), read radius, mass, gravity, SOI and orbit, and use the right Mu in multiple-star systems.
    game_types: [KSA.Celestial, KSA.Astronomical, KSA.IParentBody, KSA.IOrbiter, KSA.Orbit, KSA.CelestialSystem, KSA.AtmosphereReference]
    engine_pointers:
      - current/decomp/KSA/CelestialSystem.cs
      - current/decomp/KSA/Orbit.cs Mu
      - current/decomp/KSA/Astronomical.cs
    lifecycle: [frame:draw-ui, frame:viewports]
    approaches:
      - n: 1
        title: Orbit.Mu versus Parent.Mu and a per-system cache for transfer math
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/patched-conic-transfer-model]
        technique: per-system-cache
        note: Cache keyed by the Universe.CurrentSystem reference, not the Id, so a reload invalidates it.
      - n: 2
        title: Derived body properties (radius, mass, escape velocity, SOI, periods)
        mod: compendium
        features: [mods/compendium/features/derived-body-properties]
        technique: reflection
        note: Computed on the first UI frame from Celestial, Orbit and template data.
      - n: 3
        title: Catalog walk with session-constant data cached
        mod: gatos
        features: [mods/gatos/features/celestial-body-catalog-reads]
        technique: immutable-snapshot
        note: Walk CurrentSystem plus the separate star root, cache constants once, read only ECL state per sample.
    related: [classify-vessel-orbit-state, estimate-hohmann-transfer-delta-v, read-orbit-elements-and-timing]
    borrowed_from: [mods/compendium/features/derived-body-properties, mods/gatos/features/celestial-body-catalog-reads]

  - slug: classify-vessel-orbit-state
    title: Classify a vessel's orbit and derive reference orbits for each body
    summary: Decide whether a craft is landed, parked, orbiting or escaping, and build a surface, low-orbit, stationary and SOI-edge ladder per body (including atmosphere height, gas giants and rings) to anchor route and readout logic.
    game_types: [KSA.Vehicle, KSA.Orbit, KSA.IParentBody, KSA.AtmosphericBody, KSA.AstronomicalTemplate, KSA.PhysicalAtmosphereReference]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs HasMeaningfulOrbit
      - current/decomp/KSA/AtmosphericBody.cs
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Body-state ladder and snapped eccentricity classification
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/body-state-ladder-and-you-are-here]
        technique: vehicle-state-classification
        note: Vehicle.HasMeaningfulOrbit plus eccentricity snapping; low-orbit altitude from atmosphere height or GetNearSurfaceRadius plus clearance; a 1 AU parking orbit for stars and barycenters.
    related: [plan-multi-leg-delta-v-routes, read-celestial-orbit-and-body-data, estimate-hohmann-transfer-delta-v]
    borrowed_from: []

  # ------------------------------------------------------------------ transfer math and windows
  - slug: estimate-hohmann-transfer-delta-v
    title: Estimate transfer delta-v in closed form
    summary: Quick Hohmann-style delta-v estimates, from a coplanar transfer to a circular altitude to a patched-conic cost between sibling bodies with Oberth burns at each end.
    game_types: [KSA.Orbit, KSA.IParentBody, KSA.OrbitalTransfers, KSA.Astronomical]
    engine_pointers:
      - current/decomp/KSA/OrbitalTransfers.cs
      - current/decomp/KSA/Orbit.cs
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Coplanar Hohmann estimate to a circular altitude
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate]
        technique: flight-math
        note: Two-burn estimate from the current orbit, suitable for a one-line readout.
      - n: 2
        title: Hub legs wrapped in Oberth burns, cached per body pair
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/patched-conic-transfer-model]
        technique: patched-conic-math
        note: Comet, multiple-star, ascent, landing, plane-change and transfer-time terms; mirrors the game's own transfer model.
    related: [compute-transfer-windows, plan-multi-leg-delta-v-routes, solve-lambert-transfer]
    borrowed_from: []

  - slug: compute-transfer-windows
    title: Compute phase angles, synodic periods and the time to the next transfer window
    summary: Lead angle, live phase, countdown and ejection angle for interplanetary transfers, plus how to shift a window or schedule phasing orbits when the next window is too soon.
    game_types: [KSA.Orbit, KSA.OrbitalTransfers, KSA.MathEx, KSA.IOrbiter, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/OrbitalTransfers.cs AlignmentTime
      - current/decomp/KSA/Orbit.cs GetPhaseAngle
    lifecycle: [frame:draw-ui, frame:apply-solvers]
    approaches:
      - n: 1
        title: Mirror the branches of OrbitalTransfers.AlignmentTime with a phase clock
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/transfer-windows-and-phase-clock]
        technique: closed-form-orbital-math
        note: Closed-form ejection angle PI - acos(-1/e); live phase from Orbit.GetPhaseAngle; resizable list and polar clock with hover highlight on the map node.
      - n: 2
        title: Shift a same-parent window and re-solve Lambert
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/multi-pass-hohmann-schedule]
        technique: harmony-transpiler
