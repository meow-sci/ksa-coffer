  - current/decomp/KSA/VersionInfo.cs MASTER_URL
  - Master.VersionString
  lifecycle:
  - startup:immediate-load
  approaches:
  - n: 1
    title: ksa-assemblies.lock, check-assemblies.sh and AssemblyMetadata from the lock
    mod: ksarmory
    features:
    - mods/ksarmory/features/ksa-assemblies-lock
    - mods/ksagolf/features/api-surface-and-assembly-lock
    - mods/ksacars/features/api-surface-pinning-and-diff
    - mods/ksastructures/features/headless-tests-and-ci
    technique: msbuild
    note: 'The lock holds only names and digests, safe in a public repo; check-assemblies.sh derives the list from the csproj references and has --update and --game modes; Directory.Build.props resolves KsaDllDir first-match-wins with an explicit error; CI checks out the private mirror with a read-only deploy key and skips with a notice on forks. Merged from detect-a-new-ksa-build-automatically (check-ksa-version.sh in a daily ksa-version.yml workflow): The script asks the same master server the game does and compares with the lock; the failing run is the notification.'
