  - take-screenshots-from-code
  - hot-reload-mod-shaders
  - run-unattended-scenarios-and-report-a-verdict
  - spawn-a-vehicle-at-runtime
  - step-mod-simulation-on-sim-time
  - advance-mod-physics-on-simulated-time
  - set-simulation-speed-from-a-mod
  - swing-a-tool-with-the-mouse-as-a-kitten
  - package-a-mod-release-zip
  - mod-toml-reference
  - ksa-mod-folders-and-manifest
  - debug-xml-patches
