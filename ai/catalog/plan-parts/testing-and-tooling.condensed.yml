- slug: test-a-solver-or-controller-offline
  title: 'Test a solver or controller offline: closed loop, purity and replay'
  summary: Build a console harness that solves, integrates the dynamics with injected thrust and gimbal dispersions and re-solves, check determinism, input sensitivity and no cross-talk before threading a solve, and replay the exact problem the live game fed the solver from a versioned SI JSON dump with full tracing.
  game_types:
