    technique: json-config
    note: 'Folded from replay-a-live-game-problem-offline (sub-step: give it its own section (dump and replay a live problem)). AscentProblemFile in a game-free assembly; a nullable field reads back as not set in older files, with round-trip tests keeping old files readable.'
