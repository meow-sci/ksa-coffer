  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: RK4 plant with injected dispersions driven by console flags
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/closed-loop-mpc-harness
    technique: console-checks
    note: 'McpHarness in tests/AdvancedFlightComputer.Guidance.Tests, invoked from build/ci/test-guidance.ps1; metrics are plan jump, path ratio and solve cost. Merged from verify-a-solve-is-pure-before-threading (Determinism, input-sensitivity and no-cross-talk checks in the harness): Same input twice gives the same plan; changed input changes it; two solver instances run concurrently without affecting each other. These gated the worker-thread move.'
  - n: 2
    title: Problem file written before the solve, re-solved by a test-console flag
    mod: ksa-advancedflightcomputer
