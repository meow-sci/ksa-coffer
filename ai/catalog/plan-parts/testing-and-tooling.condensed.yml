- slug: expose-a-running-game-to-an-ai-agent-with-mcp
  title: Expose a running game to an AI agent through MCP
  summary: Give an agent tools to launch or reuse the game, pause, step, move the camera, screenshot and read replies, either by wrapping the file bridge in a stdlib Python MCP server or by hosting an MCP endpoint inside the game process.
  game_types:
  - KSA.Program
  - KSA.Universe
  engine_pointers:
  - ModelContextProtocol.Core C# SDK (in-process approach)
  - .mcp.json registration
  lifecycle:
  - startup:all-mods-loaded
  - frame:after-on-frame
  - thread:background
  approaches:
  - n: 1
    title: Stdlib Python JSON-RPC over stdio wrapping the file bridge
    mod: ksacars
    features:
    - mods/ksacars/features/ksa-mcp-server
    - mods/ksagolf/features/file-command-bridge
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/file-command-bridge-and-mcp
    technique: mcp-server
    note: server.py with initialize, tools/list and tools/call; doubles as a CLI; finds the user directory via a helper script; launches the game only if none runs and never closes one it did not launch; converts Windows paths to WSL; registered in .mcp.json as server ksa.
  - n: 2
    title: In-process stateless Streamable HTTP endpoint on the official C# SDK
    mod: gatos
    features:
    - mods/gatos/features/mcp-server-for-agents
    technique: mcp-server
    note: Borrowed from external-io. A TcpListener adapter with host and origin checks, 24 MiB cap and 3 minute timeout; resources and tools over simulation snapshots; no bearer token, so keep it on loopback.
  related:
