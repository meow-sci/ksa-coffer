- slug: run-mod-simulation-in-a-headless-rig
  title: Run the mod's whole simulation in a headless rig behind a sim boundary
  summary: Drive vehicles, rounds or balls through the mod's own step function in a plain test, using a rig that supplies mass, inertia and a terrain stand-in (sim-boundary headless tests), so handling, gunnery and putting are regression-tested without the game; vary the step size and skip frames to expose phase and epoch errors a constant dt hides.
  game_types:
  - Brutal.Numerics.double3
  - KSA.SimStep
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/Universe.cs GetLastSimStep (the real step the rig imitates)
  - current/decomp/KSA/Universe.cs GetLastSimStep
  - GetElapsedSeconds
  lifecycle:
  - frame:after-on-frame
  - frame:draw-ui
  approaches:
  - n: 1
    title: Rigid-body rig using the engine's mass and inertia
    mod: ksacars
    features:
    - mods/ksacars/features/headless-sim-tests
    technique: headless-tests
    note: BuggyDriveTests flies the car model on a rig whose mass and inertia match what the engine reports, then asserts speed, steering and suspension behaviour.
  - n: 2
    title: One driver seam shared by the game and the tests
    mod: ksarmory
    features:
    - mods/ksarmory/features/sim-boundary-headless-tests
    - mods/ksarmory/features/mod-simulated-rounds
    - mods/ksarmory/features/consume-applied-sim-step
    technique: sim-boundary
    note: 'Whole engagements flown headlessly; the same RoundDriver steps rounds in game and in tests, so a test failure is a game failure. Studies are also checked for documented numbers. Merged from test-frame-timing-and-epoch-logic (Offset-phase tests for epoch handling in an engagement): OffsetPhaseTests shows why constant-dt tests cannot expose a one-frame epoch offset; vary the step so a phase error changes the answer.'
  - n: 3
    title: Ball and contact physics with an epoch bookkeeping layer
    mod: ksagolf
    features:
    - mods/ksagolf/features/headless-sim-tests
    - mods/ksagolf/features/swept-hull-contact
    - mods/ksagolf/features/dual-hook-frame-stepping
    technique: headless-tests
    note: 'Differences-only contact maths so no large coordinates or game types are needed; SkippedFrameTests prove behaviour across missed frames. Merged from test-frame-timing-and-epoch-logic (Step-size invariance and missed-frame tests): Invariance tests across dt, skipped frames and the latch that consumes each step once. SkippedFrameTests is the model.'
  related:
  - unit-test-mod-logic-without-game
  - keep-physics-maths-free-of-game-types
  - simulate-projectiles-and-balls-outside-the-vehicle-system
  - step-mod-simulation-on-sim-time
  - advance-mod-physics-on-simulated-time
