- slug: track-the-game-api-your-mod-uses
  title: List exactly which game APIs your mod binds to, and pin Harmony targets at compile time
  summary: Read the TypeRef and MemberRef tables of your built DLL into a committed document that CI checks, and turn reflected Harmony targets into compile-time dependencies with never-called pin methods so a signature change is a compile error and appears in the API surface.
