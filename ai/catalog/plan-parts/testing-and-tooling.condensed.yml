# Condensed plan part for testing-and-tooling (47 -> 22 topics). Folded slugs are listed in merged_from.
category: testing-and-tooling
description: Testing and tooling for KSA mods - game-free unit tests, in-game HeadlessHarness suites, developer file bridges and MCP servers, screenshots and visual checks, offline shader and asset checks, API-surface tracking and upgrade workflows, perf scopes and diagnostics.
topics:
- slug: unit-test-mod-logic-without-game
  title: Unit-test mod logic without launching the game
  summary: 'Choose where the game boundary sits (a folder, an assembly, a shared source file or a compile-gated half) so the maths, models, parsers and state machines compile with no KSA assembly, then build a test project that runs on any machine and in CI: link the game-free sources, assert physical invariants and edge cases, make clocks and threads deterministic, gate slow or platform-specific tests behind an opt-in switch, and wire it to dotnet test or a console exit code.'
  game_types:
  - Brutal.Numerics.double3
  - KSA.Vehicle
  - KSA.Universe
  engine_pointers:
  - Brutal.Core.Numerics (the only game assembly most pure code needs)
  - current/decomp/KSA/Universe.cs GetLastSimStep (the typical adapter-side seam)
  - Brutal.Core.Numerics double3 (the only game assembly the pure side may need)
  - current/decomp/KSA/Universe.cs GetElapsedSeconds
  lifecycle:
  - thread:background
  - event:headless-test-run
  approaches:
  - n: 1
    title: xUnit project linking a game-free Sim folder wholesale
    mod: ksagolf
    features:
    - mods/ksagolf/features/headless-sim-tests
    - mods/ksacars/features/headless-sim-tests
    - mods/ksarmory/features/sim-boundary-headless-tests
    - mods/ksastructures/features/headless-tests-and-ci
    technique: msbuild
    note: 'The csproj uses Compile Include of ../src/Mod/Sim/**/*.cs and references no KSA assembly. About 290 tests in KSAGolf. tools/test.sh wraps it for the pre-push hook and CI. Merged from split-game-adapters-from-pure-logic (Sim/ and Ksa/ folders in one project, with the boundary enforced by the test project): All KSA-free logic lives under Sim/ and everything that names a KSA type under Ksa/. Even parsing of bridge commands is a Sim type. The test project links Sim/** and references only the numerics assemblies, so a stray KSA type is a compile error. Say what belongs on each side (frame bookkeeping, physics, parsing vs reflection, ImGui, patches).'
  - n: 2
    title: Console test executable with invariant checks and non-zero exit
    mod: ksaero
    features:
    - mods/ksaero/features/headless-model-tests
    - mods/ksa-deltavmap/features/offline-layout-and-math-tests
    technique: msbuild
    note: 'A plain Exe that source-links the model and asserts axisymmetry, force decomposition, monotonic drag, continuity and overlap invariants against synthetic trees and stock reference values. No test framework dependency; exit code is the verdict. Merged from split-game-adapters-from-pure-logic (Share individual pure files with Compile Include and Compile Remove): AeroModel.cs and DeltaVMap''s layout engine and math kernels are game-type-free by convention and compiled into both the mod and a test exe. The mod removes files from its own build when a harness test links them. Cheapest option for a small mod.'
  - n: 3
    title: Console checks against Python reference fixtures
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/game-free-guidance-checks
    - mods/ksa-advancedflightcomputer/features/solver-problem-json-replay
    technique: console-checks
    note: 'Solver outputs compared with JAX and CVXPY reference fixtures from a CI script, so numerics are checked against an independent implementation rather than against themselves. Merged from split-game-adapters-from-pure-logic (Separate game-free assemblies joined by ProjectReference, with the game-facing adapter beside them): Numerics and solver code in their own csprojs with no game references; single game-facing files are linked into small test executables; the serialized problem type lives on the game-free side so the mod and the offline console share it.'
  - n: 4
    title: NUnit suites with property tests and silent-on-success rules
    mod: purrtty
    features:
    - mods/purrtty/features/headless-test-suites
    technique: nunit
    note: 'Four NUnit projects, FsCheck properties, game types kept out of tested layers, reference assemblies used only where cheap, and a no-fixed-sleep and silent-on-success convention. Merged from make-time-gated-code-deterministic-in-tests (Sentinel flush and bounded polling instead of sleeps): A sentinel written through the pipe proves everything before it was processed; waits are bounded polls, never fixed sleeps. Merged from gate-slow-or-platform-specific-tests (OS-gated real-PTY tests next to portable ones): Real PTY tests run per operating system in the three-OS CI matrix; everything else is portable.'
  - n: 5
    title: Compile-gated Game/ half joined by partial methods
    mod: gatos
    features:
    - mods/gatos/features/compile-gated-game-seam
    - mods/gatos/features/build-deploy-and-ci
    technique: msbuild
    note: 'Folded from split-game-adapters-from-pure-logic (sub-step: give the boundary choice its own section). Borrowed from getting-started. The whole Game/ folder drops out of compilation when KSA.dll is absent, so CI builds and tests everything else with no game files. Merged from gate-slow-or-platform-specific-tests (Assert.Ignore unless an environment variable is set): TestEnv gates real-VM tests on GATOS_IT=1; CI turns it on under KVM.'
  related:
