- slug: drive-a-running-game-through-a-file-bridge
  title: Drive a running game from scripts through a developer command bridge
  summary: Poll a per-mod folder for JSON command files from the frame postfix, run one command at a time and answer atomically, so a shell script, a test runner or an agent can pause, step an exact number of simulated seconds, load a save and wait for a flown craft, spawn and script gameplay inputs; keep the bridge and other developer-only features out of player installs with a marker file, a manifest key or a build flag.
  game_types:
  - KSA.Universe
  - KSA.SimSpeed
  - KSA.GameSaves
  - KSA.Vehicle
  - KSA.Program
  - KSA.Constants
  - KSA.SimStep
  - KSA.KittenEva
  - KSA.ModManifest
  - KSA.ModEntry
  engine_pointers:
  - current/decomp/KSA/Universe.cs SetSimulationSpeed
  - GetLastSimStep
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  - current/decomp/KSA/Constants.cs DocumentsFolderPath
  - current/decomp/KSA/Universe.cs GetLastSimStep
  - SetSimulationSpeed
  - current/decomp/KSA/GameSaves.cs LoadSaveGame (line 283)
  - MakeUncompressedSave
  - current/decomp/KSA/Program.cs input processing (frame:input)
  - current/decomp/KSA/ModManifest.cs Save (rewrites only id and enabled)
  lifecycle:
  - startup:all-mods-loaded
  - frame:after-on-frame
  - startup:game-loaded
  - frame:input
  approaches:
  - n: 1
    title: in/ and out/ folders, .part rename, polled at 0.1 s from StarMapAfterOnFrame, closures for long commands
    mod: ksagolf
    features:
    - mods/ksagolf/features/file-command-bridge
    - mods/ksacars/features/file-drop-command-bridge
    - mods/ksarmory/features/file-command-bridge-and-mcp
    - mods/ksastructures/features/dev-file-bridge-and-mcp
    - mods/ksarmory/features/unattended-scenario-runner
    - mods/ksagolf/features/putting-session
    - mods/ksarmory/features/build-deploy-package-release
    - mods/ksarmory/features/own-log-file-and-developer-switch
    technique: starmap-lifecycle
    note: 'No port or firewall, works across WSL to Windows. A per-mod subfolder so sibling mods never answer each other; id and cmd keys; KSA-free BridgeCommand.TryParse unit-tested; immediate commands reply the same frame, long ones install a Func(dtPlayer, dtSim) returning a reply; a sequence of files is a script. Gate it with the developer marker. Merged from step-the-simulation-an-exact-number-of-seconds (Bridge step command that sums GetLastSimStep().DeltaTime): Pause is simulation speed 0 via SetSimulationSpeed(new SimSpeed(x)); there is no 0.1x floor in the engine, only in the UI. Merged from load-a-save-from-code (Load command with a wait-for-world closure): KSArmory''s scenario runner loads a named save three seconds after start; the bridges poll until a craft is flown before replying. Merged from script-gameplay-through-a-command-bridge (golf and course bridge commands drive the putting session): Borrowed from kittens. Commands drop, pickup, address and a swing array of mouse
      dx per frame with wait_s; the replies feed assertions. Merged from gate-developer-only-features (An empty developer file beside the DLL, written by the deploy script and never packaged): Build.Developer is true when the file exists; the package script refuses to include it, so a release can never enable the bridge.'
  - n: 2
    title: A custom key on the mod's manifest.toml entry
    mod: kittenextensions
    features:
    - mods/kittenextensions/features/patch-debug-stepper
    technique: toml-config
    note: 'Folded from gate-developer-only-features (sub-step of the bridge: give it its own section (keep the bridge out of player installs)). Read the extra key from the player''s manifest.toml; note that the game''s ModManifest.Save rewrites only id and enabled, so extra keys are dropped when the game saves.'
  - n: 3
    title: DEBUG compile flag plus a DebugConfig runtime switch
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/in-game-validation-dumps-and-perf
    technique: msbuild
    note: 'Folded from gate-developer-only-features (sub-step of the bridge: give it its own section (keep the bridge out of player installs)). Whole dump and perf code is'
  related:
