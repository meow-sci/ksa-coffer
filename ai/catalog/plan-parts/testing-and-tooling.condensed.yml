- slug: run-unattended-scenarios-and-report-a-verdict
  title: Fly scripted scenarios unattended, report PASS or FAIL and A/B test variants
  summary: A developer-only state machine reads a request file at launch, loads a save, spawns targets, flies an engagement or drop, and writes tagged lines that a shell harness turns into an exit code, with budgets and restored settings; the same runner can fly interleaved variant batches and judge noisy results with a rank test.
  game_types:
  - KSA.GameSaves
  - KSA.Popup
  - KSA.Program
  - KSA.Universe
  engine_pointers:
  - current/decomp/KSA/Popup.cs Popups (private static list)
  - current/decomp/KSA/GameSaves.cs LoadSaveGame
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Request file taken once, state machine, wall-clock and sim-time budgets, tagged SCENARIO lines
    mod: ksarmory
    features:
    - mods/ksarmory/features/unattended-scenario-runner
    technique: starmap-lifecycle
    note: A file rather than an environment variable because the game is a Windows process launched from WSL. Take-once delete; Config and log threshold snapshotted and restored; open KSA popups closed each frame via the private Popup.Popups list by reflection because an open popup holds the craft's throttle; TIMEOUT describes where it was stuck.
  - n: 2
    title: Overnight shot batch with seeded interleaving and Wilcoxon rank-sum verdicts
    mod: ksarmory
    features:
    - mods/ksarmory/features/shot-night-statistics
    technique: statistics
    note: 'Folded from ab-test-mod-behaviour-in-flight (sub-step: give it its own section (statistics on noisy in-game results)). shot-batch.sh builds each arm up front, interleaves, copies each shot''s log out, takes a lock, supports resume and plan-only; shot-report.py uses exact permutation null and Hodges-Lehmann effect on the mean miss on a log scale. Merged from ab-test-mod-behaviour-in-flight (Within-run variant split by craft or tube): Per-craft settings applied by field name through ShotArms, so both arms experience the same conditions in one flight.'
