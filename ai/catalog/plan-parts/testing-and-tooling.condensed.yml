- slug: pin-the-game-build-with-a-hashed-lock
  title: Pin the KSA build with a hashed assemblies lock and notice new builds
  summary: Commit SHA-256 digests of the referenced game DLLs plus the build number so local builds, a private CI mirror and the running game agree on one KSA build, stamp that build into the mod for a runtime comparison, and poll the version endpoint from a scheduled job to learn of a new build before players do.
  game_types:
  - KSA.Vehicle
  - KSA.VersionInfo
  engine_pointers:
