- slug: headless-test-harness-for-game-mods
  title: Test a mod against the real game with HeadlessHarness
  summary: Ship tests as a second StarMap mod that depends on HeadlessHarness and the mod under test, so the real simulation (universe, vehicles, part trees, planners) runs without a GPU; swap the clock for simulation time in the test base class, and use the game's own private routines by reflection as the oracle for stock formulas the mod re-implements.
  game_types:
  - KSA.Universe
  - KSA.Vehicle
  - KSA.CelestialSystem
  - KSA.FlightComputer
  - KSA.Program
  - KSA.TransferPlanner
  - KSA.SequencePerformanceList
  - KSA.PartTree
  engine_pointers:
  - current/decomp/KSA/Program.cs PrepareFrame (the order the harness SimDriver must imitate)
  - current/decomp/KSA/Universe.cs CurrentSystem
  - GetElapsedSeconds
  - HeadlessHarness is an external mod; its API is only described by the consumer mods
  - current/decomp/KSA/TransferPlanner.cs PlanInterstellarFuel
  - MassAboard
  - TankSpace
  - current/decomp/KSA/PartTree.cs
  - current/decomp/KSA/Universe.cs GetElapsedSeconds
  lifecycle:
  - event:headless-test-run
  - thread:background
  approaches:
  - n: 1
    title: Consumer mod with its own mod.toml, InternalsVisibleTo and a test base class
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/headless-harness-test-mod
    - mods/ksa-advancedflightcomputer/features/validated-reflection-handles
    technique: headless-harness
    note: '72 named tests. mod.toml depends on HeadlessHarness and the mod under test; empty [StarMapMod]; AfcTest.Run does not catch so MissingMemberException and TypeLoadException classify as API drift; fixtures spawn throwaway vehicles from saves and despawn in finally; KSA_HEADLESS_TESTS filters by exact Name. Merged from test-against-the-games-own-routines (A reflection-targets test that resolves every handle against the running build): ReflectionTargetsTest is the drift detector; README rule - the oracle is the game''s own propagation, never a re-derivation of the maths under test. Merged from make-time-gated-code-deterministic-in-tests (Swap the guidance clock for simulation time in the test base class): AfcTest.Run points GuidanceClock.Source at Universe.GetElapsedSeconds because the harness steps far faster than real time, and resets it in finally.'
  - n: 2
    title: Small suite of oracle tests plus a scene dump
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/headless-harness-tests
    technique: headless-harness
    note: 'Smaller worked example with HintPath to a sibling HeadlessHarness checkout, Private=false, linked SceneChecks.cs and a scripts/run-headless.ps1 launcher; IHarnessTest classes for multi-star graph, staged delta-v, interstellar fuel and stock planner keys. Merged from test-against-the-games-own-routines (Reflected stock planner calls compared with the mod''s re-implementation): InterstellarFuelTest, StagedDvTest and StockPlannerKeysTest call the private stock routines and the mod''s copies with the same inputs; the test fails the day either side drifts.'
  related:
