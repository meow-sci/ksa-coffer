- slug: dump-and-record-diagnostics-from-a-running-game
  title: Dump and record diagnostics from a running game without flooding the frame or the log
  summary: 'Get validation data out of the live game cheaply: a one-shot latched dump once the universe exists, SVG and text dumps of layouts and geometry built by pure code shared with offline tests, batched CSV telemetry, and log lines emitted only when a bucketed state signature changes.'
  game_types:
  - KSA.Universe
  - KSA.CelestialSystem
  - KSA.Celestial
  - Brutal.Logging.DefaultCategory
  - KSA.Vehicle
  - Brutal.Logging.LogCategory
  engine_pointers:
  - current/decomp/KSA/Universe.cs CurrentSystem
  - Brutal.Logging DefaultCategory
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  lifecycle:
  - frame:draw-ui
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Latched dumps from StarMapAfterGui behind a DebugConfig flag
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/in-game-validation-dumps-and-perf
    - mods/ksa-deltavmap/features/offline-layout-and-math-tests
    technique: starmap-lifecycle
    note: 'Return early unless the flag is set, the latch is clear and Universe.CurrentSystem is non-null; run inside try/catch that logs once so the render path never unwinds. Output capped per tree and written to a configurable directory with log-only fallback. Merged from dump-layouts-and-geometry-to-svg (Pure LayoutDumpFormat shared by offline tests, harness tests and the in-game dump): Synthetic 100+ node tree and a real system laid out and dumped with no text measurer, so the character-count estimate matches between environments; OverlapCheck gives pass-fail verdicts.'
  - n: 2
    title: Single-owner CSV sink with batched flush and rate-limited plan snapshots
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/guidance-flight-telemetry-csv
    technique: logging
    note: 'Folded from record-diagnostics-without-flooding-the-frame-or-the-log (sub-step: give it its own section (CSV and change-only logging)). Static, single-owner sink that never throws or waits on disk; per-step CSV, plan snapshot JSON, event log, one owner vehicle. Merged from record-diagnostics-without-flooding-the-frame-or-the-log (Vehicle-prefixed log lines keyed on a bucketed signature): Five percent buckets decide when a stage state is new enough to log, instead of logging every refresh.'
