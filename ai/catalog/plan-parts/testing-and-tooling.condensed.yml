- slug: measure-and-budget-mod-performance
  title: Time hot paths and GPU passes, and throttle expensive work
  summary: Wrap hot code in zero-cost-when-off scopes with periodic average, minimum and worst-frame reports, read the named GPU profiler regions of a mod pass with a pinned camera so runs are comparable, and throttle per-frame computations on wall-clock intervals, state versions and identity-keyed caches so cost does not scale with FPS or time warp.
