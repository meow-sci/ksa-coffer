  - slug: draw-ui-while-the-hud-is-hidden
    title: Keep a mod UI drawing when the player hides the HUD (F2)
    summary: StarMap's GUI hooks and most UI calls sit inside Program.DrawUI, so an overlay vanishes on F2 or screenshots; hook a call that still runs, or knowingly accept the disappearance.
    game_types: [KSA.Program]
    engine_pointers:
      - "current/decomp/KSA/Program.cs OnFrame (lines near 2255-2285): OnDrawUiFrame/OnDrawUiViewports/OnDrawUiThreadSafe inside if (DrawUI); DrawFps and OnDrawUiConsole run unconditionally; OnFrameEditor precedes the check"
    lifecycle: [frame:viewports, frame:draw-ui, frame:celestials]
    approaches:
      - n: 1
        title: Harmony postfix on Program.OnFrameEditor
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/fullscreen-drawlist-hud]
        technique: harmony-postfix
        note: Runs before the DrawUI guard, after NewFrame, so draw-list calls are legal.
      - n: 2
        title: Reflection-installed postfix on private Program.DrawFps
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/draw-while-ui-hidden-drawfps-postfix]
        technique: harmony-postfix
        note: Borrowed from patching. DrawFps is the one unconditional UI-phase call; patched through reflection with no compile-time Harmony reference and graceful degradation.
      - n: 3
        title: Replay StarMap Before/After GUI work from a prefix on OnDrawUiConsole
        mod: unscience
        features: [mods/unscience/features/lib-hidden-ui-frame-hook, mods/unscience/features/pebbles-workshop-editor]
        technique: harmony-prefix
        note: Borrowed from patching. Returns immediately while DrawUI is true, otherwise invokes registered host callbacks; Pebbles uses it to keep its editor window alive.
      - n: 4
        title: Frame-latched step claimed by whichever hook fires first
        mod: ksarmory
        features: [mods/ksarmory/features/dual-hook-simulation-step, mods/ksagolf/features/dual-hook-frame-stepping, mods/gatos/features/frame-hooks-and-f2-fallback, mods/ksarmory/features/cursor-ray-world-click-tools]
        technique: harmony-prefix
        note: Borrowed from patching and getting-started. For per-frame logic (not only drawing) use a latch with OnFrameCelestials prefix as the unguarded fallback; click tools keep working with the HUD hidden.
    related: [keep-updating-when-hud-hidden, keep-running-when-hud-hidden, draw-a-fullscreen-click-through-overlay, show-a-transient-on-screen-alert]
    borrowed_from: [mods/ksa-public-telemetry/features/draw-while-ui-hidden-drawfps-postfix, mods/unscience/features/lib-hidden-ui-frame-hook, mods/ksarmory/features/dual-hook-simulation-step, mods/ksagolf/features/dual-hook-frame-stepping, mods/gatos/features/frame-hooks-and-f2-fallback]

