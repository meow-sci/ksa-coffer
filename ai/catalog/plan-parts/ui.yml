category: ui
description: ImGui windows, menu bar and ModMenu entries, fonts, draw-list overlays and widgets, hotkeys and input focus, stock-window injection, HUD overlays and settings UIs for KSA mods.
topics:
  # ------------------------------------------------------------------ windows
  - slug: show-live-vehicle-data-in-a-window
    title: Show live data for the controlled vehicle in an ImGui window
    summary: Read the controlled vehicle's settled physics, orbit and engine state on the main thread and present it in a window or HUD, either from a StarMap GUI hook or from a Harmony postfix on the game's own per-vehicle UI call.
    game_types: [KSA.Program, KSA.Vehicle, KSA.PhysicsStates, KSA.PhysicsEnvironment, KSA.PartTree]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnFrame (ApplyVehicleSolvers precedes OnDrawUiViewports) and Program.ControlledVehicle, MainViewport
      - current/decomp/KSA/Vehicle.cs Vehicle.OnDrawUi(IGameViewport)
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Plain ImGui window from StarMapAfterGui with guarded Begin/End
        mod: ksaero
        features: [mods/ksaero/features/aero-readout-window]
        technique: imgui-window
        note: Smallest possible readout. Read ref-readonly physics state after the solvers were applied, re-run a pure model for derived numbers, and keep Begin/End balanced with try/finally and log-once guards so one exception cannot corrupt the ImGui stack.
      - n: 2
        title: Harmony postfix on Vehicle.OnDrawUi filtered to the main viewport
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/flight-hud-controlled-vehicle-postfix]
        technique: harmony-postfix
        note: Hooks the game's per-vehicle UI call instead of a StarMap attribute, so it must filter to Program.MainViewport and Program.ControlledVehicle itself. Shows building a per-frame data record (orbit, live nozzle thrust, ComputeActiveThrust, TWR) and reading engine thrust and mass flow.
    related: [add-a-panel-to-the-vehicle-editor, draw-ui-while-the-hud-is-hidden, show-threshold-alerts-in-a-hud]
    borrowed_from: []

  - slug: add-a-panel-to-the-vehicle-editor
    title: Add a panel to the vehicle editor
    summary: Draw an analysis window while the player is in the vehicle editor, reading the part tree being built (dry, propellant and wet mass, gravity and atmosphere of the home body).
    game_types: [KSA.VehicleEditor, KSA.VehicleEditingSpace, KSA.PartTree, KSA.CelestialSystem, KSA.PhysicalAtmosphereReference]
    engine_pointers:
      - current/decomp/KSA/VehicleEditor.cs OnDrawUi
      - current/decomp/KSA/Program.cs Editor, OnFrameEditor
    lifecycle: [editor:draw-ui, frame:draw-ui]
    approaches:
      - n: 1
        title: Harmony postfix on VehicleEditor.OnDrawUi
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/editor-panel-injection]
        technique: harmony-postfix
        note: The editor has no StarMap hook of its own; the postfix only runs while an editor exists. Covers reading EditingSpace.Parts and PartTree.ComputeInertMassPropertiesAsmb plus ComputePropellantMassPropertiesAsmb as the editor does.
    related: [show-live-vehicle-data-in-a-window]
    borrowed_from: []

  - slug: subclass-the-stock-imguiwindow
    title: Build a mod window on the game's ImGuiWindow base class
    summary: Derive from KSA.ImGuiWindow so the window gets stock chrome, title bar, close handling and menu integration, and draw it every frame from the right hook without leaking ImGui stack state.
    game_types: [KSA.ImGuiWindow, KSA.IStaticWindow, KSA.IViewport, KSA.IGameViewport, KSA.VersionInfo, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/ImGuiWindow.cs DrawContent (abstract), UseConsoleChrome, OnDrawUi, NoSavedSettings
      - current/decomp/KSA/IStaticWindow.cs
    lifecycle: [frame:draw-ui, event:starmap-unload]
    approaches:
      - n: 1
        title: Lazily created window drawn from StarMapAfterGui (menu-opened)
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/map-window-and-menu-entry]
        technique: imgui-window
        note: Construct the subclass lazily inside an ImGui frame (the base constructor needs a context), draw it from the after-GUI hook, balance stacks in finally, and warn when VersionInfo.Current.VersionString differs from the tested build. Window state is NoSavedSettings.
      - n: 2
        title: Guarded DrawContent with title-bar close detection
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/measure-menu-and-tool-window]
        technique: imgui-window
        note: Same base class with exception-guarded DrawContent, detecting the title-bar close button, and unloading cleanly on StarMapUnload.
      - n: 3
        title: IStaticWindow auto-registration with a mod-owned layout
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/panels-as-static-imgui-windows]
        technique: imgui-window
        note: Implementing IStaticWindow lets the game draw the panel itself; seed _initialPosition and _initialSize and persist them in the mod config because the base uses NoSavedSettings.
    related: [match-the-stock-console-ui-style, add-items-to-the-game-menu-bar, give-mod-windows-stable-ids-and-persisted-placement, draw-a-mod-window-every-frame]
    borrowed_from: []

  - slug: match-the-stock-console-ui-style
    title: Make mod UI look like the game's console windows
    summary: Use the game's public ConsoleStyle and ConsoleWidgets helpers (label rows, checkboxes, sliders, primary buttons, window skin) so mod panels match stock fonts, colors and columns, including logarithmic slider rows.
    game_types: [KSA.ConsoleStyle, KSA.ConsoleWidgets, KSA.ImGuiWindow, KSA.TransferPlanner, KSA.ImGuiDisabledScope]
    engine_pointers:
      - current/decomp/KSA/ConsoleStyle.cs PushWidgetStyle, BeginWindow, PopWidgetStyle
      - current/decomp/KSA/ConsoleWidgets.cs BeginRow, Checkbox, EndRow
      - current/decomp/KSA/TransferPlanner.cs (private DrawSliderFloatRow pattern the mods copy)
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: ConsoleWidgets rows inside an ImGuiWindow subclass (no chrome)
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/stock-console-widget-panels, mods/ksa-measuretools/features/measure-menu-and-tool-window]
        technique: imgui-window
        note: BeginRow/Checkbox/RowHovered/Tooltip/EndRow and a hidden-id logarithmic slider row copied from TransferPlanner; explain why UseConsoleChrome is off so ConsoleStyle.PushWidgetStyle is not applied. Measure Tools shows rows, tooltips and a hovered-row highlight.
      - n: 2
        title: Plain ImGui.Begin plus ConsoleStyle/ConsoleWidgets styling
        mod: ohmystars
        features: [mods/ohmystars/features/modmenu-entry-and-console-style-windows]
        technique: imgui-window
        note: Avoids ConsoleStyle.BeginWindow because it forces NoSavedSettings and pins to the main viewport; draws custom title-bar-coloured tab buttons and indented collapsible sections from StarMapBeforeGui.
      - n: 3
        title: ConsoleStyle window skin unpinned from the main viewport, wrapped helpers
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/guidance-panel-and-overlays, mods/ksa-advancedflightcomputer/features/stock-styled-console-ui]
        technique: imgui-window
        note: pinToMainViewport false so the panel can leave the main window, plus thin wrappers that reproduce the Transfer Planner's private row helpers so UI injected into stock windows matches.
    related: [subclass-the-stock-imguiwindow, build-a-settings-window, inject-ui-into-a-stock-window]
    borrowed_from: []

  - slug: build-a-tabbed-imgui-window
    title: Build a tabbed ImGui window
    summary: Organise a mod panel into tabs, whether with real ImGui tab bars (closeable, selectable) or hand-drawn tab buttons, and keep the selection valid when tabs come and go.
    game_types: [Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImGuiTabBarFlags]
    engine_pointers: [current/decomp/KSA/ConsoleStyle.cs (title bar colors used by custom tab buttons)]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Closeable ImGui tab bar with programmatic selection
        mod: purrtty
        features: [mods/purrtty/features/terminal-window-chrome-tabs-and-resize-snap]
        technique: imgui-window
        note: BeginTabBar with closeable tabs, SetSelected on request and a stale-selection guard after a tab is closed.
      - n: 2
        title: Per-craft tabbed window with pop-out panes
        mod: ksarmory
        features: [mods/ksarmory/features/operator-panel-imgui]
        technique: imgui-window
        note: One window per craft with tabs and a reopen button; shows the multi-window structure and where pop-outs hook in.
      - n: 3
        title: Title-bar-coloured custom tab buttons
        mod: ohmystars
        features: [mods/ohmystars/features/modmenu-entry-and-console-style-windows]
        technique: imgui-window
        note: Hand-rolled tab buttons that match the stock console palette instead of ImGui tab bars.
      - n: 4
        title: Button tabs driving a table of collapsing headers
        mod: mpfx
        features: [mods/mpfx/features/effect-settings-window]
        technique: imgui-window
        note: Tab buttons choose a page, each page is a three-column table of collapsing headers.
    related: [pop-out-panel-sections-into-windows, build-a-settings-window]
    borrowed_from: []

  - slug: build-a-two-pane-browser-window
    title: Build a two-pane browser window with a draggable splitter
    summary: A category list on the left, detail on the right, a splitter between them, cached collapsible lists, a searchable combo, a vessel picker and a "go to" button that moves the camera, built once the universe exists.
    game_types: [KSA.Universe, KSA.CelestialSystem, KSA.Celestial, KSA.Vehicle, KSA.Program, KSA.ConsoleStyle]
    engine_pointers:
      - current/decomp/KSA/Universe.cs MoveCameraTo, WorldSun (null until LoadSystem), CurrentSystem
      - current/decomp/KSA/Program.cs ControlledVehicle
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: Splitter from a thin Button plus MouseDelta between two BeginChild panes
        mod: compendium
        features: [mods/compendium/features/celestial-info-window]
        technique: imgui-window
        note: Covers the splitter, cached body lists, wait-for-universe guard in the UI hook (StarMapAllModsLoaded runs before any universe exists), Universe.MoveCameraTo with changeControl behaviour, and exception-safe cleanup.
    related: [add-search-to-imgui-combos-and-lists, subclass-the-stock-imguiwindow]
    borrowed_from: []

  - slug: build-a-chromeless-window-that-snaps-to-a-grid
    title: Build a chrome-less window that hides its title bar and snaps to a content grid
    summary: An ImGui window whose title bar and borders fade out unless hovered without shifting layout, and whose resize snaps to whole character cells.
    game_types: [Brutal.ImGuiApi.ImGuiWindowFlags, Brutal.ImGuiApi.ImGuiViewportPtr]
    engine_pointers: [current/decomp/KSA/ImGuiWindow.cs (stock chrome for comparison)]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Alpha-0 chrome, InvisibleButton drag guard, resize snap by size change
        mod: purrtty
        features: [mods/purrtty/features/terminal-window-chrome-tabs-and-resize-snap]
        technique: imgui-window
        note: Alpha 0 and transparent colours keep the layout stable; an InvisibleButton over the content stops drag-moves; resize is detected by size change while the left button is held and then snapped.
    related: [draw-a-fullscreen-click-through-overlay, draw-a-monospace-text-grid]
    borrowed_from: []

  - slug: give-mod-windows-stable-ids-and-persisted-placement
    title: Give mod windows stable ids and keep their position and size
    summary: Rename a window without losing its ImGui state (Label##stable-id), and persist position and size yourself when the base class or flags disable imgui.ini.
    game_types: [KSA.ImGuiWindow, Brutal.ImGuiApi.ImGui]
    engine_pointers: [current/decomp/KSA/ImGuiWindow.cs (NoSavedSettings, _initialPosition, _initialSize)]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Label##stable-id for renameable windows
        mod: purrtty
        features: [mods/purrtty/features/named-terminal-registry-and-theme-dialog]
        technique: imgui-window
        note: "User-renameable windows keep geometry because the id part after ## never changes."
      - n: 2
        title: Capture GetWindowPos/Size and debounce into mod config
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/panels-as-static-imgui-windows]
        technique: json-config
        note: Needed when the stock base class uses NoSavedSettings; debounced write from DrawContent.
      - n: 3
        title: Stable window id for a small settings window
        mod: ksastructures
        features: [mods/ksastructures/features/settings-menu]
        technique: imgui-window
        note: Plain window with a fixed id so imgui.ini restores it.
    related: [subclass-the-stock-imguiwindow, persist-imgui-window-state, persist-window-open-state]
    borrowed_from: []

  - slug: add-items-to-the-game-menu-bar
    title: Add a menu to the game's top menu bar
    summary: Put a top-level menu (and a window toggle) on KSA's main menu bar so players can open the mod's windows, working in both flight and the editor.
    game_types: [KSA.Program, KSA.IGameViewportLifecycle, KSA.GameViewport]
    engine_pointers:
      - current/decomp/KSA/Program.cs DrawMenuBar, DrawProgramMenusHook (empty public hook, called around line 4005), OnDrawUiThreadSafe
      - current/decomp/KSA/GameViewport.cs SetMenuBarInUse
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Harmony postfix on the empty Program.DrawProgramMenusHook
        mod: unscience
        features: [mods/unscience/features/unscience-menu-bar-entry, mods/ksa-deltavmap/features/map-window-and-menu-entry, mods/ksa-measuretools/features/measure-menu-and-tool-window, mods/purrtty/features/game-menu-with-modmenu-fallback]
        technique: harmony-postfix
        note: The hook exists only for mods and runs inside the real menu bar, so BeginMenu/MenuItem work directly. Toggling a window, lazily creating the window object inside the menu, and SetMenuBarInUse so the menu stays open.
      - n: 2
        title: BeginMainMenuBar from StarMapBeforeGui
        mod: ksagolf
        features: [mods/ksagolf/features/developer-panel-and-menu-bar, mods/ksastructures/features/settings-menu, mods/ksarmory/features/operator-panel-imgui]
        technique: starmap-lifecycle
        note: Older approach; in 2026.10.10 KSA's bar is a window named "Menu Bar", so a second BeginMainMenuBar before KSA fills it is fragile. Explain why approach 1 is preferred and when this still works.
      - n: 3
        title: Animated colored menu-bar words via transpiler plus prefix
        mod: unscience
        features: [mods/unscience/features/jplrepo-menu-bar-animation]
        technique: harmony-transpiler
        note: Restyle or decorate the bar itself. A transpiler on Program.DrawMenuBar snapshots the cursor before the version string, and a prefix on DrawProgramMenusHook restores it and draws sliding colored words.
    related: [list-a-mod-in-modmenu, add-a-menu-with-modmenu-fallback, subclass-the-stock-imguiwindow]
    borrowed_from: []

  - slug: list-a-mod-in-modmenu
    title: List a mod in ModMenu with the ModMenuEntry attribute
    summary: "Add a ModMenu entry (a static method that draws menu items or a settings page) and decide how to get the attribute type: reference the shipped DLL, vendor the DLL, or copy the attribute so no hard dependency exists."
    game_types: [Brutal.ImGuiApi.ImGui]
    engine_pointers: [current/decomp/KSA/ModLibrary.cs (mod discovery and load order)]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Reference ModMenu.Attributes (NuGet or local DLL) and ship it
        mod: compendium
        features: [mods/compendium/features/modmenu-window-toggle, mods/ohmystars/features/modmenu-entry-and-console-style-windows, mods/mpfx/features/effect-settings-window]
        technique: inter-mod-api
        note: ModMenuEntry(menuName) on a static method; ship ModMenu.Attributes.dll beside the mod. MPFX notes ModMenu discovery was not verified in this reference set.
      - n: 2
        title: Vendored ModMenu.Attributes.dll resolved by StarMap's per-mod resolver
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/modmenu-entry-vendored-attributes]
        technique: assembly-load-context
        note: DLL committed in the repo with a HintPath reference, copy-local next to the mod, resolved after default and game contexts; includes shipping any third-party DLL with a StarMap mod.
      - n: 3
        title: Copy the attribute source into the mod (matched by type name)
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/modmenu-entry-with-standalone-fallback, mods/ksacars/features/car-panel-and-modmenu, mods/ksagolf/features/developer-panel-and-menu-bar, mods/ksarmory/features/operator-panel-imgui, mods/ksastructures/features/settings-menu, mods/realatmospheres/features/modmenu-page-and-toml-settings]
        technique: inter-mod-api
        note: ModMenu matches by type name, so an inert copy of ModMenuEntryAttribute needs no dependency and no extra DLL. Compare how each mod names and declares it.
    related: [add-a-menu-with-modmenu-fallback, call-imgui-without-referencing-brutal]
    borrowed_from: []

  - slug: add-a-menu-with-modmenu-fallback
    title: Add a menu that uses ModMenu when present and the game menu bar otherwise
    summary: Present the same mod menu either through ModMenu or, when it is absent, through the game's menu bar or a standalone window, without showing it twice.
    game_types: [KSA.Program, KSA.ModLibrary, KSA.IGameViewportLifecycle, KSA.GameViewport]
    engine_pointers:
      - current/decomp/KSA/ModLibrary.cs Find
      - current/decomp/KSA/Program.cs DrawProgramMenusHook
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: Decide once with ModLibrary.Find("ModMenu")
        mod: purrtty
        features: [mods/purrtty/features/game-menu-with-modmenu-fallback, mods/gatos/features/modmenu-entry-with-fallback-menu]
        technique: harmony-postfix
        note: The postfix draws only when ModMenu is not loaded, avoiding a double menu; keeps the draw path allocation-free and reads slow probes from a background snapshot instead of computing in the menu.
      - n: 2
        title: ModMenuEntry attribute with an active-flag property name
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/modmenu-entry-with-standalone-fallback]
        technique: inter-mod-api
        note: The attribute is told which property says it is active; the fallback postfix on DrawProgramMenusHook uses SetMenuBarInUse.
      - n: 3
        title: One settings tree rendered as a menu or as a standalone window
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/modmenu-entry-with-standalone-fallback]
        technique: imgui-menu
        note: A Category() helper switches BeginMenu to CollapsingHeader by a flag, with a hotkey-toggled fallback window drawing the same content.
    related: [list-a-mod-in-modmenu, add-items-to-the-game-menu-bar, rebindable-hotkeys]
    borrowed_from: []

  - slug: call-imgui-without-referencing-brutal
    title: Call ImGui without referencing Brutal when arguments are ref structs
    summary: Draw menu items and tooltips from a ModMenu page without a compile-time reference to Brutal.ImGuiApi by emitting DynamicMethods that convert strings to ImString on the stack.
    game_types: [Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImString, KSA.Constants]
    engine_pointers: [current/decomp/Brutal.ImGuiApi (ImString is a ref struct)]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: DynamicMethod wrappers for ImGui.MenuItem and SetItemTooltip
        mod: realatmospheres
        features: [mods/realatmospheres/features/modmenu-page-and-toml-settings]
        technique: reflection
        note: Reflection cannot box a ref struct, so IL is emitted per call shape; also shows the hand-parsed settings.toml under KSA.Constants.DocumentsFolderPath.
    related: [list-a-mod-in-modmenu, persist-mod-settings-toml]
    borrowed_from: []

  - slug: build-a-settings-window
    title: Build a mod settings window with sliders, color pickers and tables
    summary: Lay out settings as tabs, tables and collapsing headers, with slider-plus-input rows, color pickers, reset buttons, form label gutters and wrapped tooltips.
    game_types: [Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImGuiTableFlags, KSA.Program]
    engine_pointers: [current/decomp/KSA/GameSettings.cs (stock settings pages for style comparison)]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Tabs, three-column table, collapsing headers and ColorPicker4
        mod: mpfx
        features: [mods/mpfx/features/effect-settings-window]
        technique: imgui-window
        note: Slider-plus-input row helper, ColorPicker4 bound to a float4, Reset buttons, pre/post rows.
      - n: 2
        title: Label-gutter form tables and full-width widgets
        mod: purrtty
        features: [mods/purrtty/features/imgui-filter-combo-and-form-widgets]
        technique: imgui-window
        note: Fixed label gutter, full-width inputs, destructive button styling.
      - n: 3
        title: Settings window with ColorButton popups and INI persistence
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/ini-settings-and-settings-window]
        technique: imgui-window
        note: ColorButton plus popup ColorPicker, settings written to a hand-parsed hud.ini. Borrowed from persistence.
      - n: 4
        title: Menu entry plus small settings window with wrapped tooltips
        mod: ksagolf
        features: [mods/ksagolf/features/developer-panel-and-menu-bar, mods/ksastructures/features/settings-menu, mods/ksacars/features/car-panel-and-modmenu]
        technique: imgui-window
        note: Wrapped tooltips, apply expensive settings on slider release, NoNav/NoFocusOnAppearing panel.
    related: [list-a-mod-in-modmenu, persist-mod-settings-toml, pick-colors-in-imgui, match-the-stock-console-ui-style]
    borrowed_from: [mods/ksa-aircrafthud/features/ini-settings-and-settings-window]

  - slug: add-search-to-imgui-combos-and-lists
