  - slug: load-a-custom-font-into-imgui
    title: Load a custom TTF font into KSA's ImGui atlas
    summary: Add a bundled font to the shared ImGui atlas at the right moment, draw it at any size with ImGui 1.92 PushFont(font, size), and stop KSA from auto-loading it as a game font.
    game_types: [Brutal.ImGuiApi.ImFontAtlasPtr, Brutal.ImGuiApi.ImFontConfig, Brutal.ImGuiApi.ImGui, KSA.FontManager, KSA.Mod, KSA.ImGuiBackendVulkanImpl]
    engine_pointers:
      - current/decomp/KSA/FontManager.cs Initialize (scans Content/**/*.ttf), RegenerateFonts
      - current/decomp/KSA/ImGuiBackendVulkanImpl.cs RendererHasTextures (dynamic atlas)
      - current/decomp/KSA/Program.cs constructor order (CreateContext, FontManager.Initialize)
    lifecycle: [startup:immediate-load, startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: AddFontFromFileTTF at StarMapImmediateLoad
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/custom-hud-font, mods/compendium/features/custom-fonts-in-imgui]
        technique: imgui-font
        note: Immediate load is after ImGui.CreateContext and FontManager.Initialize, so the atlas exists. Compendium adds every TTF/OTF in a Fonts folder and balances sized pushes with a counter; AircraftHUD uses one font at several sizes and notes mod.toml fonts only registers names.
      - n: 2
        title: Add lazily on the first UI frame using FontManager's config
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/montserrat-fonts-in-imgui-atlas]
        technique: imgui-font
        note: Same ImFontConfig fields as KSA.FontManager; tabular digits via widest-digit cell and drop shadows on draw lists.
      - n: 3
        title: Add at StarMapAllModsLoaded with a renamed extension
        mod: purrtty
        features: [mods/purrtty/features/nerd-font-loading-into-imgui-atlas]
        technique: imgui-font
        note: FontManager scans Content/**/*.ttf, so ship the file renamed (.iamttf) to avoid auto-load; size with PushFont(font, size) on the dynamic atlas.
    related: [survive-a-game-font-rebuild, draw-a-monospace-text-grid]
    borrowed_from: []

  - slug: survive-a-game-font-rebuild
    title: Keep mod fonts alive when the game rebuilds its font atlas
    summary: Changing interface font settings schedules FontManager.RegenerateFonts, which clears the whole ImGui atlas and invalidates every font pointer a mod cached; explain the hazard and a guard.
    game_types: [KSA.FontManager, KSA.GameSettings, KSA.Program, Brutal.ImGuiApi.ImFontAtlasPtr]
    engine_pointers:
      - current/decomp/KSA/Program.cs ScheduleFontRebuild; PrepareFrame consumes it (Program.cs near line 2228)
      - current/decomp/KSA/FontManager.cs RegenerateFonts (Fonts.Clear first)
      - current/decomp/KSA/GameSettings.cs (font setting change handlers)
    lifecycle: [frame:prepare, startup:immediate-load]
    approaches:
      - n: 1
        title: Detect the atlas clear and re-add fonts (hazard documented by four mods, none tested)
        mod: compendium
        features: [mods/compendium/features/custom-fonts-in-imgui, mods/purrtty/features/nerd-font-loading-into-imgui-atlas, mods/ksa-aircrafthud/features/custom-hud-font, mods/ksa-public-telemetry/features/montserrat-fonts-in-imgui-atlas]
        technique: reflection
        note: No reference mod implements the fix; every font feature page records the hazard and the AircraftHUD page suggests a postfix on FontManager.RegenerateFonts. The writer must label the guard as adapted and untested, and verify membership checks against the decomp.
    related: [load-a-custom-font-into-imgui]
    borrowed_from: []

