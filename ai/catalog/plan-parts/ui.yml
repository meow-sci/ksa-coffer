  - slug: build-a-filesystem-file-picker
    title: Build a filesystem file picker and a shared user-file library
    summary: Let players pick PNG, GLB or sound files from disk in an ImGui browser and copy them into a catalog shared by several features.
    game_types: [Brutal.ImGuiApi.ImGui]
    engine_pointers: [current/decomp/KSA/Constants.cs DocumentsFolderPath]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: LibraryFileBrowser copying chosen files into a flat catalog
        mod: unscience
        features: [mods/unscience/features/lib-shared-file-library]
        technique: imgui-window
