    approaches:
      - n: 1
        title: Cursor ray against every vehicle, plus the stock hover picker
        mod: ksa-measuretools
        features:
          - mods/ksa-measuretools/features/part-mesh-raycast-picking
          - mods/unscience/features/hot-pursuit-mesh-ray-placement
        technique: mesh-raycast
        note: GetMatrixAsmb2Ego plus RayCastEgo returns subpart, local hit point and vertex; reuse ViewportPartPicker.
      - n: 2
        title: Camera-less ray from a caller-chosen origin (hit test and swept contact)
        mod: ksarmory
        features:
          - mods/ksarmory/features/hull-triangle-hit-test
          - mods/ksagolf/features/swept-hull-contact
        technique: engine-raycast
        note: Sphere broad phase, then watertight per-triangle cast with the separation as ego origin.
      - n: 3
        title: Frame-budgeted sweeps of the craft's own geometry for actuator travel limits
        mod: ksarmory
        features:
          - mods/ksarmory/features/self-collision-travel-map
        technique: coarse-to-fine-sampling
        note: Coarse sweep refined only where the answer changes.
      - n: 4
        title: Screen-space projection with a size-based pick radius
        mod: ksagolf
        features:
          - mods/ksagolf/features/craft-mover
          - mods/ksacars/features/craft-mover-mouse-pick-place
        technique: screen-space-picking
        note: "[folded from pick-a-vehicle-under-the-cursor: give it its own section] Cheap, no mesh test; pair with the terrain height-field ray for placement."
    related:
      - get-part-points-in-vehicle-and-world-frames
