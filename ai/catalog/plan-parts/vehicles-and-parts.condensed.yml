  - slug: raycast-against-part-meshes
    title: Ray cast against part meshes and pick vehicles and parts under the cursor
    summary: "Cast a ray at a vehicle's real hull with Part.RayCastEgo, either from the mouse cursor (pick hull points, attach nodes, part centres) or from an arbitrary ego origin with no camera (shell hits, travel sweeps, swept contact), staying in a local metres frame. Also covers: Pick the vehicle under the mouse cursor."
    game_types:
      - KSA.Part
      - KSA.Vehicle
      - KSA.ViewportPartPicker
      - KSA.Cursor
      - KSA.Camera
    engine_pointers:
      - current/decomp/KSA/Part.cs RayCastEgo
