category: vehicles-and-parts
description: Defining parts and whole craft, spawning and controlling vehicles at runtime, reading and driving part modules (engines, tanks, staging, RCS, parachutes), scaling, welding, picking and ray casting parts, and loading part mods into a running game.
topics:
  - slug: define-a-part-with-game-data
    title: Define a part with its own game data and GLB model
    summary: Split a new part into an Assets bundle (GLB art with PBR materials, subparts) and a GameData bundle (mass shape, colliders, connectors, editor tags, optional real RCS thrusters, seats), list both in mod.toml, and know which XML elements the part templates accept. Includes how to add your own editor category and how to choose a mass template and colliders knowing terrain friction is fixed.
    game_types:
      - KSA.PartTemplate
      - KSA.PartGameDataReference
      - KSA.SubPartGameDataReference
      - KSA.EditorTagDefinition
      - KSA.ModLibrary
    engine_pointers:
      - current/decomp/KSA/PartTemplate.cs
      - current/decomp/KSA/EditorTagDefinition.cs
      - current/Content/Core/CoreCommandAGameData.xml and CoreEditorTagsGameData.xml (stock GameData examples)
      - current/decomp/KSA/ModLibrary.cs AttachGameData
    lifecycle:
      - startup:asset-load
    approaches:
      - n: 1
        title: One part per car with colliders, mass shape and a custom editor category
        mod: ksacars
        features:
          - mods/ksacars/features/car-part-gamedata
        technique: xml-asset
        note: Whole-craft part with box and wheel colliders, MassShape choice for inertia, EditorTagDef for a new category, and the fixed 0.95 terrain friction for non-kitten pairs.
      - n: 2
        title: Inert weapon parts split into Assets and GameData with real RCS thrusters on subparts
        mod: ksarmory
        features:
          - mods/ksarmory/features/weapon-part-definitions-xml
        technique: xml-asset
        note: Art and subparts in one bundle, mass, colliders, connectors, editor tags and subpart thrusters in another; no behaviour in XML because C# finds the part by Id.
      - n: 3
        title: Furniture parts as single-part craft with seat game data
        mod: ksastructures
        features:
          - mods/ksastructures/features/office-furniture-craft
        technique: xml-asset
        note: Minimal GameData for a static prop part that doubles as a craft; pairs with the single-part craft and seats topics.
    related:
      - ship-ready-made-craft
      - add-crew-seats-and-eva-doors
      - define-and-animate-subparts
      - evolve-a-shipped-part-without-breaking-saves
    borrowed_from:
      - mods/ksarmory/features/weapon-part-definitions-xml
      - mods/ksacars/features/car-part-assets-glb-pbr
    dedupe_with:
      - assets/add-a-part-model-with-glb-and-pbr-textures
  - slug: ship-ready-made-craft
    title: Ship whole-vehicle presets and single-part craft with a part mod
    summary: Provide whole-vehicle presets as VehicleSaveData files so players find your craft in the stock or user vehicle library, know where the user library lives, and make a single part launchable as a complete craft (root-part whitelist tag, a connector, a control module, no surface connectors).
    game_types:
      - KSA.VehicleSave
      - KSA.VehicleSaves
      - KSA.DefaultVehicleSaves
      - KSA.PartTemplate
      - KSA.VehicleEditor
      - KSA.EditorTagDefinition
    engine_pointers:
      - current/decomp/KSA/VehicleSaves.cs
      - current/decomp/KSA/DefaultVehicleSaves.cs
      - current/decomp/KSA/VehicleSave.cs
      - current/decomp/KSA/VehicleEditor.cs RootPartWhitelist handling
      - current/decomp/KSA/EditorTagDefinition.cs
    lifecycle:
      - startup:asset-load
    approaches:
      - n: 1
        title: VehicleSaveData preset files beside the mod
        mod: ksacars
        features:
          - mods/ksacars/features/vehicle-library-presets
        technique: xml-asset
        note: Format of the saved craft, where the stock and user libraries are scanned from, and keeping part Ids stable.
      - n: 2
        title: RootPartWhitelist tag on a car part
        mod: ksacars
        features:
          - mods/ksacars/features/car-part-gamedata
        technique: xml-asset
        note: "[folded from make-a-single-part-a-whole-craft: give it its own section] RootPartWhitelist tag, at least one connector, no surface connectors, a Control module."
      - n: 3
        title: Furniture part as a one-part craft
        mod: ksastructures
        features:
          - mods/ksastructures/features/office-furniture-craft
        technique: xml-asset
        note: "[folded from make-a-single-part-a-whole-craft: give it its own section] Same rule applied to props that are never meant to be built upon."
    related:
      - spawn-a-vehicle-at-runtime
      - define-a-part-with-game-data
    borrowed_from: []
    merged_from:
      - make-a-single-part-a-whole-craft
  - slug: add-crew-seats-and-eva-doors
    title: Add crew seats and EVA doors to a part
    summary: Declare IVASeat entries and EVADoor modules on mesh-less hidden subparts, pair them by SeatId, understand the eye offset and the 1 m boarding reach, and keep kittens in an open craft visible when another vehicle is the controlled one.
    game_types:
      - KSA.IVASeat
      - KSA.EVADoor
      - KSA.EVADoorTemplate
      - KSA.KittenEva
      - KSA.Vehicle
    engine_pointers:
      - current/decomp/KSA/IVASeat.cs
      - current/decomp/KSA/EVADoor.cs
      - current/decomp/KSA/Vehicle.cs UpdateSeatedCrewRenderData
    lifecycle:
      - startup:asset-load
      - frame:render
    approaches:
      - n: 1
        title: IVASeat in PartGameData plus EVADoor on a hidden subpart
        mod: ksacars
        features:
          - mods/ksacars/features/seats-and-eva-doors
        technique: xml-asset
        note: Position is the eye point (model drawn 0.63 m lower); door SeatId names the seat.
      - n: 2
        title: Seat and door for furniture
        mod: ksastructures
        features:
          - mods/ksastructures/features/office-furniture-craft
        technique: xml-asset
        note: Same schema on a chair part; shows the minimum viable seat and door.
      - n: 3
        title: Draw seated crew on craft that are not being flown
        mod: ksacars
        features:
          - mods/ksacars/features/seated-crew-of-unflown-craft
        technique: harmony-postfix
        note: Postfix Vehicle.UpdateSeatedCrewRenderData so open-cockpit crew stays visible when control moves to a kitten.
    related:
      - define-a-part-with-game-data
      - spawn-an-eva-kitten-from-code
      - take-control-of-another-vehicle
    borrowed_from:
      - mods/ksacars/features/seats-and-eva-doors
      - mods/ksacars/features/seated-crew-of-unflown-craft
    dedupe_with:
      - kittens/draw-seated-crew-on-unflown-craft
      - kittens/animate-a-seated-kitten-driver
  - slug: evolve-a-shipped-part-without-breaking-saves
    title: Change a shipped part without breaking saves
    summary: Subparts are paired by position when a save loads, so removing or reordering them crashes old saves. Follow append-only subpart lists and fixed part Ids, and repair saves at startup when a mistake already shipped.
    game_types:
      - KSA.PartTree
      - KSA.PartTemplate
      - KSA.VehicleSave
    engine_pointers:
      - current/decomp/KSA/PartTree.cs Deserialize (SubPartRefs paired by index)
    lifecycle:
      - startup:all-mods-loaded
      - startup:asset-load
    approaches:
      - n: 1
        title: Append-only subpart lists and fixed part Ids
        mod: ksarmory
        features:
          - mods/ksarmory/features/weapon-part-definitions-xml
        technique: xml-asset
        note: The authoring rule; derived from PartTree.Deserialize.
      - n: 2
        title: Rewrite saves and library craft at AllModsLoaded
        mod: ksarmory
        features:
          - mods/ksarmory/features/startup-save-repair
        technique: regex-xml-surgery
        note: Trim surplus SubPartRefs from saves before any load is possible; offline twin script.
    related:
      - define-a-part-with-game-data
      - define-and-animate-subparts
    borrowed_from:
      - mods/ksarmory/features/startup-save-repair
    dedupe_with:
      - persistence/repair-saves-and-craft-files-at-startup
  - slug: give-inert-parts-behaviour-by-part-id
    title: Give inert parts behaviour by recognising their part Id (weapons, dispensers, decoys)
    summary: "Keep XML free of behaviour and let code discover parts on any craft by Id, using a data-driven registry of profiles, so other mods can add parts as data and dispenser or weapon kinds are decided by which part is fitted. Also covers: Simulate flares and chaff as decoys."
    game_types:
      - KSA.Part
      - KSA.PartTemplate
      - KSA.Vehicle
    engine_pointers:
      - current/decomp/KSA/Part.cs template Id
      - current/decomp/KSA/Vehicle.cs
    lifecycle:
      - startup:all-mods-loaded
      - frame:draw-ui
      - startup:asset-load
      - frame:after-on-frame
    approaches:
      - n: 1
        title: Weapon registry keyed by part Id, with profiles in a game-free layer
        mod: ksarmory
        features:
          - mods/ksarmory/features/weapon-registry-and-profiles
        technique: data-driven-registry
        note: Profiles live in Sim/, the game adapter finds parts per craft; also how packs from other mods feed the registry.
      - n: 2
        title: Dispenser kind decided by which part is fitted
        mod: ksarmory
        features:
          - mods/ksarmory/features/countermeasure-dispensers
        technique: part-id-lookup
        note: Same pattern with a different consumer. (also simulate-decoys-flares-and-chaff) Dispenser kind decided by the fitted part Id.
      - n: 3
        title: Registry fed from a folder in every installed mod
        mod: ksarmory
        features:
          - mods/ksarmory/features/weapon-packs-from-mod-folders
        technique: convention-folder-scan
        note: Data-only add-on packs; strict reader and post-load audit.
    related:
      - track-and-classify-craft
      - define-a-part-with-game-data
      - target-and-gate-automated-weapons
    borrowed_from:
      - mods/ksarmory/features/weapon-packs-from-mod-folders
    merged_from:
      - simulate-decoys-flares-and-chaff
  - slug: track-and-classify-craft
    title: Track which craft carry your part, classify them, and detect staging and loss
    summary: Build a per-frame roster of craft keyed by Vehicle reference rather than name, so a mod knows its own craft, who is allied, and when a craft is disposed, loses the part, stages, separates or fails structurally.
    game_types:
      - KSA.Vehicle
      - KSA.Universe
      - KSA.CelestialSystem
      - KSA.StructuralLoad
      - KSA.PhysicsBubble
    engine_pointers:
      - current/decomp/KSA/Universe.cs CurrentSystem.All enumeration
      - current/decomp/KSA/StructuralLoad.cs
      - current/decomp/KSA/PhysicsBubble.cs
    lifecycle:
      - frame:draw-ui
      - frame:after-on-frame
    approaches:
      - n: 1
        title: Per-frame sync of craft that carry the mod's part into a Vehicle-keyed dictionary
        mod: ksacars
        features:
          - mods/ksacars/features/frame-step-latch-and-car-registry
        technique: starmap-lifecycle
        note: Enumerate every vehicle from any hook (Program.VehiclesInFrame is empty after PostRender); drop entries when disposed or the part leaves.
      - n: 2
        title: Teams, alliances and a reference-keyed roster declared each frame
        mod: ksarmory
        features:
          - mods/ksarmory/features/iff-teams-and-allegiance
        technique: reference-keyed-dictionary
        note: Never parse allegiance from craft names; rules per team, roster rebuilt each step.
      - n: 3
        title: State diffing for staging and max-q callouts
        mod: ksa-public-telemetry
        features:
          - mods/ksa-public-telemetry/features/flight-event-detection-and-callouts
        technique: state-diffing
        note: "[folded from detect-staging-and-vehicle-loss: give it its own section] Part-count drop or new vehicle sharing LaunchGameTime; radial decoupler connections tell booster separation."
      - n: 4
        title: IsDisposed, IsControllable and StructuralLoad fractions
        mod: ksa-public-telemetry
        features:
          - mods/ksa-public-telemetry/features/freeze-on-signal-loss
        technique: state-machine
        note: "[folded from detect-staging-and-vehicle-loss: give it its own section] GLoadFraction and DynamicPressureFraction; PhysicsBubble breaks at >= 1."
    related:
      - give-inert-parts-behaviour-by-part-id
      - draw-ui-while-the-hud-is-hidden
      - stage-a-vehicle-from-code
      - make-a-vehicle-indestructible
    borrowed_from:
      - mods/ksacars/features/frame-step-latch-and-car-registry
    merged_from:
      - detect-staging-and-vehicle-loss
  - slug: spawn-a-vehicle-at-runtime
    title: Spawn a vehicle from code (from the vehicle library, a hand-built part, or an EVA kitten)
    summary: "Create a Vehicle at runtime from a craft save, from a single hand-built part, or as an EVA kitten, register it with its celestial parent, and place it on the ground or in orbit. Also covers: Load a craft from the stock or player vehicle library."
    game_types:
      - KSA.Vehicle
      - KSA.Part
      - KSA.PartTree
      - KSA.VehicleSave
      - KSA.KittenEva
      - KSA.Orbit
      - KSA.CelestialSystem
      - KSA.VehicleSaves
      - KSA.DefaultVehicleSaves
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs CreateVehicle, TeleportToLocation
      - current/decomp/KSA/VehicleSave.cs Load
      - current/decomp/KSA/KittenEva.cs constructor
      - current/decomp/KSA/Orbit.cs CreateFromStateCci
      - current/decomp/KSA/VehicleSaves.cs Refresh, AsSpan
      - current/decomp/KSA/DefaultVehicleSaves.cs FindSave
    lifecycle:
      - frame:after-on-frame
      - frame:input
      - frame:draw-ui
    approaches:
      - n: 1
        title: Parked copy of a library craft at a latitude and longitude
        mod: ksacars
        features:
          - mods/ksacars/features/spawn-parked-craft
        technique: starmap-lifecycle
        note: VehicleSave.Load, CreateVehicle, parent.Children.Add, UpdatePerFrameData, then TeleportToLocation. (also load-a-craft-from-the-vehicle-library) Handles missing saves and library refresh timing.
      - n: 2
        title: Test drones into orbit from a state vector
        mod: ksarmory
        features:
          - mods/ksarmory/features/spawn-and-teleport-test-craft
        technique: vehicle-spawn
        note: Orbit.CreateFromStateCci after an Ecl-to-CCI rotation, KittenEva variant, ShapesRegistry lock.
      - n: 3
        title: A one-part vehicle built in code
        mod: ksastructures
        features:
          - mods/ksastructures/features/office-furniture-craft
        technique: xml-asset
        note: new Part, CreateOwnTree, Vehicle.CreateVehicle, TeleportToLocation; no craft file needed.
      - n: 4
        title: Spawn an EVA kitten as a vehicle beside another craft
        mod: unscience
        features:
          - mods/unscience/features/doh-kitten-spawning
        technique: reflection
        note: Replicates EVADoor.CreateKittenEva, backpack part with its own tree, orbit from the neighbour's state vectors.
    related:
      - change-vehicles-without-racing-the-solver
      - teleport-a-vehicle
      - keep-mod-vehicles-out-of-saves
      - ship-ready-made-craft
    borrowed_from:
      - mods/unscience/features/doh-kitten-spawning
    merged_from:
      - load-a-craft-from-the-vehicle-library
    dedupe_with:
      - kittens/spawn-an-eva-kitten-from-code
      - kittens/place-a-spawned-vessel-relative-to-another
  - slug: change-vehicles-without-racing-the-solver
    title: Create, destroy and mutate vehicles, part state and mass without racing the vehicle solver
    summary: The physics worker may be stepping while a mod builds, destroys or mutates a vehicle. Take the shape-registry lock or wait for the solver before changing shapes, parts or vehicles, queue PartFailureEvent entries instead of splitting directly, and write module state, mass, throttle or flight-computer fields only where the worker has not yet snapshotted the vehicle.
    game_types:
      - KSA.ConstraintSim
      - KSA.JobSystems
      - KSA.Vehicle
      - KSA.PhysicsBubble
      - KSA.InputEvents
      - KSA.PartFailureEvent
      - KSA.PartFailure
      - KSA.Universe
      - KSA.PartTree
      - KSA.MoleState
      - KSA.FlightComputer
      - KSA.Part
    engine_pointers:
      - current/decomp/KSA/ConstraintSim.cs UnlockShapes / UnlockShapesBlocking
      - current/decomp/KSA/JobSystems.cs VehicleSolver.Wait
      - current/decomp/KSA/InputEvents.cs EvaSpawn staging
      - current/decomp/KSA/PartFailureEvent.cs
      - current/decomp/KSA/PartFailure.cs
      - current/decomp/KSA/Universe.cs ExecuteNextVehicleSolvers
      - current/decomp/KSA/Vehicle.cs PrepareWorker, UpdateBulkStates
      - current/decomp/KSA/Part.cs mass fields
      - current/decomp/KSA/Vehicle.cs Props
    lifecycle:
      - frame:apply-solvers
      - frame:after-on-frame
      - frame:dispatch-solvers
      - physics:vehicle-solver
      - frame:draw-ui
    approaches:
      - n: 1
        title: UnlockShapesBlocking around the build
        mod: ksacars
        features:
          - mods/ksacars/features/spawn-parked-craft
          - mods/ksarmory/features/spawn-and-teleport-test-craft
        technique: shapes-registry-lock
        note: UnlockShapes throws during the step; UnlockShapesBlocking waits for EndVehicleUpdate.
      - n: 2
        title: Wait on JobSystems.VehicleSolver before mutating
        mod: unscience
        features:
          - mods/unscience/features/doh-kitten-spawning
          - mods/gatos/features/welds-vessel-anchoring
        technique: job-barrier
        note: Either wait for the solver or stage the operation like InputEvents.EvaSpawn; recover from constructors that throw after registration.
      - n: 3
        title: Safe destruction from a frame hook
        mod: ksarmory
        features:
          - mods/ksarmory/features/safe-vehicle-destruction-and-part-failure
        technique: job-barrier
        note: Wait for the solver, hold the shapes lock, then dispose; staged results must not land on a changed craft. (also destroy-vehicles-and-fail-parts-safely) Deferred application, split-id lineage, fragment guard.
      - n: 4
        title: Prefix Universe.ExecuteNextVehicleSolvers
        mod: unscience
        features:
          - mods/unscience/features/eternal-flame-resource-refill
        technique: harmony-prefix
        note: "[folded from write-state-where-the-vehicle-solver-sees-it: give it its own section] Run once per frame immediately before the snapshot."
      - n: 5
        title: Prefix Vehicle.PrepareWorker (double-buffered fields)
        mod: ksarmory
        features:
          - mods/ksarmory/features/per-part-store-mass
          - mods/ksarmory/features/prepareworker-prefix-command-window
        technique: prepareworker-window
        note: "[folded from write-state-where-the-vehicle-solver-sees-it: give it its own section] Per-vehicle window, known double-buffered state, Unsafe write of ref readonly Props."
      - n: 6
        title: Mole states are copy-on-write in the worker
        mod: ksarmory
        features:
          - mods/ksarmory/features/holed-tank-leaks
        technique: module-state-write
        note: "[folded from write-state-where-the-vehicle-solver-sees-it: give it its own section] Write tank state in the window where UpdateBulkStates will not overwrite it."
      - n: 7
        title: Write the mass in the PrepareWorker window, derived not subtracted
        mod: ksarmory
        features:
          - mods/ksarmory/features/per-part-store-mass
        technique: unsafe-ref-write
        note: "[folded from change-a-part-mass-at-runtime: give it its own section] Recompute from the roster every step so the mass is idempotent."
    related:
      - spawn-a-vehicle-at-runtime
      - make-a-vehicle-indestructible
      - refill-or-drain-resources
      - take-control-of-another-vehicle
    borrowed_from:
      - mods/ksarmory/features/safe-vehicle-destruction-and-part-failure
      - mods/ksarmory/features/prepareworker-prefix-command-window
    merged_from:
      - create-or-dispose-vehicles-without-racing-the-solver
      - destroy-vehicles-and-fail-parts-safely
      - write-state-where-the-vehicle-solver-sees-it
      - change-a-part-mass-at-runtime
    dedupe_with:
      - physics/mutate-vehicles-at-a-physics-safe-point
      - flight-and-orbits/queue-vehicle-changes-through-input-events
