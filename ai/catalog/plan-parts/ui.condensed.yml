category: ui
description: ImGui windows, menu bar and ModMenu entries, fonts, draw-list overlays and widgets, hotkeys
  and input focus, stock-window injection, HUD overlays and settings UIs for KSA mods.
topics:
- slug: subclass-the-stock-imguiwindow
  title: Build a mod window on the game's ImGuiWindow base class, with stable ids and saved placement
  summary: Derive from KSA.ImGuiWindow so the window gets stock chrome, title bar, close handling and
    menu integration, draw it every frame from the right hook without leaking ImGui stack state, and give
    it a stable id and persisted position and size (or take over the chrome entirely with a plain window).
  game_types: [KSA.ImGuiWindow, KSA.IStaticWindow, KSA.IViewport, KSA.IGameViewport, KSA.VersionInfo,
    KSA.Program, Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImGuiWindowFlags, Brutal.ImGuiApi.ImGuiViewportPtr]
  engine_pointers: ['current/decomp/KSA/ImGuiWindow.cs DrawContent (abstract), UseConsoleChrome, OnDrawUi,
      NoSavedSettings', current/decomp/KSA/IStaticWindow.cs, current/decomp/KSA/ImGuiWindow.cs (NoSavedSettings,
    _initialPosition, _initialSize), current/decomp/KSA/ImGuiWindow.cs (stock chrome for comparison)]
  lifecycle: ['frame:draw-ui', 'event:starmap-unload']
  approaches:
  - n: 1
    title: Lazily created window drawn from StarMapAfterGui (menu-opened)
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/map-window-and-menu-entry]
    technique: imgui-window
    note: Construct the subclass lazily inside an ImGui frame (the base constructor needs a context),
      draw it from the after-GUI hook, balance stacks in finally, and warn when VersionInfo.Current.VersionString
      differs from the tested build. Window state is NoSavedSettings.
  - n: 2
    title: Guarded DrawContent with title-bar close detection
    mod: ksa-measuretools
    features: [mods/ksa-measuretools/features/measure-menu-and-tool-window]
    technique: imgui-window
    note: Same base class with exception-guarded DrawContent, detecting the title-bar close button, and
      unloading cleanly on StarMapUnload.
  - n: 3
    title: IStaticWindow auto-registration with a mod-owned layout persisted to mod config
    mod: ksa-public-telemetry
    features: [mods/ksa-public-telemetry/features/panels-as-static-imgui-windows]
    technique: imgui-window
    note: 'Implementing IStaticWindow lets the game draw the panel itself; seed _initialPosition and _initialSize
      and persist them in the mod config because the base uses NoSavedSettings. Also folded: Capture GetWindowPos/Size
      and debounce into mod config (ksa-public-telemetry): Needed when the stock base class uses NoSavedSettings;
      debounced write from DrawContent. Sub-step to give its own section: capture GetWindowPos/Size from
      DrawContent and debounce the write into mod config, because the base class uses NoSavedSettings.'
  - n: 4
    title: 'Stable window ids: Label##stable-id for renameable windows and a fixed id so imgui.ini restores
      a plain window'
    mod: purrtty
    features: [mods/purrtty/features/named-terminal-registry-and-theme-dialog, mods/ksastructures/features/settings-menu]
    technique: imgui-window
    note: 'User-renameable windows keep geometry because the id part after ## never changes. Also folded:
      Stable window id for a small settings window (ksastructures): Plain window with a fixed id so imgui.ini
      restores it. Sub-step: renaming a window without losing its ImGui state.'
  - n: 5
    title: 'Chrome-less plain-ImGui variant: alpha-0 title bar, InvisibleButton drag guard, resize snapped
      to a character grid'
    mod: purrtty
    features: [mods/purrtty/features/terminal-window-chrome-tabs-and-resize-snap]
    technique: imgui-window
    note: 'Alpha 0 and transparent colours keep the layout stable; an InvisibleButton over the content
      stops drag-moves; resize is detected by size change while the left button is held and then snapped.
      Sub-step: this is a plain ImGui.Begin window rather than an ImGuiWindow subclass; show it as the
      way to take over chrome entirely.'
  related: [match-the-stock-console-ui-style, add-items-to-the-game-menu-bar, persist-imgui-window-state,
    draw-a-fullscreen-click-through-overlay, draw-a-monospace-text-grid]
  borrowed_from: []
  merged_from: [give-mod-windows-stable-ids-and-persisted-placement, build-a-chromeless-window-that-snaps-to-a-grid]
  dedupe_with: [persistence/persist-imgui-window-state, persistence/persist-imgui-window-layout]
- slug: match-the-stock-console-ui-style
  title: 'Make mod UI look like the game: console widgets, window skin and global theme'
  summary: Use the game's public ConsoleStyle and ConsoleWidgets helpers (label rows, checkboxes, sliders,
    primary buttons, window skin) so mod panels match stock fonts, colors and columns, or re-theme every
    window through the shared ImGuiStyle.
  game_types: [KSA.ConsoleStyle, KSA.ConsoleWidgets, KSA.ImGuiWindow, KSA.TransferPlanner, KSA.ImGuiDisabledScope,
    Brutal.ImGuiApi.ImGuiStyle, Brutal.ImGuiApi.ImGuiCol, KSA.FontManager, KSA.KSAColor]
  engine_pointers: ['current/decomp/KSA/ConsoleStyle.cs PushWidgetStyle, BeginWindow, PopWidgetStyle',
    'current/decomp/KSA/ConsoleWidgets.cs BeginRow, Checkbox, EndRow', current/decomp/KSA/TransferPlanner.cs
      (private DrawSliderFloatRow pattern the mods copy), current/decomp/KSA/ConsoleStyle.cs (per-widget
      PushStyleColor still overrides the global style)]
  lifecycle: ['frame:draw-ui', 'startup:all-mods-loaded', 'event:save', 'event:load', 'frame:prepare']
  approaches:
  - n: 1
    title: ConsoleWidgets rows inside an ImGuiWindow subclass (no chrome)
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/stock-console-widget-panels, mods/ksa-measuretools/features/measure-menu-and-tool-window]
    technique: imgui-window
    note: BeginRow/Checkbox/RowHovered/Tooltip/EndRow and a hidden-id logarithmic slider row copied from
      TransferPlanner; explain why UseConsoleChrome is off so ConsoleStyle.PushWidgetStyle is not applied.
      Measure Tools shows rows, tooltips and a hovered-row highlight.
  - n: 2
    title: Plain ImGui.Begin plus ConsoleStyle/ConsoleWidgets styling
    mod: ohmystars
    features: [mods/ohmystars/features/modmenu-entry-and-console-style-windows]
    technique: imgui-window
    note: Avoids ConsoleStyle.BeginWindow because it forces NoSavedSettings and pins to the main viewport;
      draws custom title-bar-coloured tab buttons and indented collapsible sections from StarMapBeforeGui.
  - n: 3
    title: ConsoleStyle window skin unpinned from the main viewport, wrapped helpers
    mod: ksa-advancedflightcomputer
    features: [mods/ksa-advancedflightcomputer/features/guidance-panel-and-overlays, mods/ksa-advancedflightcomputer/features/stock-styled-console-ui]
    technique: imgui-window
    note: pinToMainViewport false so the panel can leave the main window, plus thin wrappers that reproduce
      the Transfer Planner's private row helpers so UI injected into stock windows matches.
  - n: 4
    title: Re-theme every KSA and mod window through the global ImGuiStyle
    mod: unscience
    features: [mods/unscience/features/skittles-imgui-theme-manager]
    technique: toml-config
    note: 'Capture original style at AllModsLoaded, restore on unload; game code never calls StyleColors*,
      but widgets that push colors still win. Includes ImGui.ShowStyleEditor and Tomlyn presets. Also
      see theme-an-imgui-window (per-window colors) in the widget kit topic. Sub-step to give its own
      section: capture the original style at StarMapAllModsLoaded and restore it on unload; TOML presets
      and the embedded style editor.'
  related: [subclass-the-stock-imguiwindow, build-a-settings-window, inject-ui-into-a-stock-window, build-custom-drawn-imgui-widgets,
    persist-mod-settings-toml]
  borrowed_from: []
  merged_from: [theme-the-whole-game-ui]
  dedupe_with: [persistence/persist-named-color-palettes]
- slug: build-a-tabbed-imgui-window
  title: Build a tabbed ImGui window with pop-out panes
  summary: Organise a mod panel into tabs, whether with real ImGui tab bars (closeable, selectable) or
    hand-drawn tab buttons, keep the selection valid when tabs come and go, and let panes or sections
    pop out into separate windows.
  game_types: [Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImGuiTabBarFlags]
  engine_pointers: [current/decomp/KSA/ConsoleStyle.cs (title bar colors used by custom tab buttons),
    current/decomp/KSA/ImGuiWindow.cs]
  lifecycle: ['frame:draw-ui']
  approaches:
  - n: 1
    title: Closeable ImGui tab bar with programmatic selection
    mod: purrtty
    features: [mods/purrtty/features/terminal-window-chrome-tabs-and-resize-snap]
    technique: imgui-window
    note: BeginTabBar with closeable tabs, SetSelected on request and a stale-selection guard after a
      tab is closed.
  - n: 2
    title: Per-craft tabbed window with pop-out panes and a reopen button
    mod: ksarmory
    features: [mods/ksarmory/features/operator-panel-imgui]
    technique: imgui-window
    note: 'One window per craft with tabs and a reopen button; shows the multi-window structure and where
      pop-outs hook in. Also folded: Pop-out panes in a per-craft operator panel (ksarmory): Tabbed per-craft
      window whose panes can pop out, with a reopen button.'
  - n: 3
    title: Title-bar-coloured custom tab buttons
    mod: ohmystars
    features: [mods/ohmystars/features/modmenu-entry-and-console-style-windows]
    technique: imgui-window
    note: Hand-rolled tab buttons that match the stock console palette instead of ImGui tab bars.
  - n: 4
    title: Button tabs driving a table of collapsing headers
    mod: mpfx
    features: [mods/mpfx/features/effect-settings-window]
    technique: imgui-window
    note: Tab buttons choose a page, each page is a three-column table of collapsing headers.
  - n: 5
    title: Collapsible sections that pop out into their own windows
    mod: kitten-engineer-redux
    features: [mods/kitten-engineer-redux/features/draw-list-widget-kit]
    technique: imgui-window
    note: 'Section state keyed by id so content is drawn once either inline or popped out. Sub-step to
      give its own section: section state keyed by id so content is drawn once, inline or popped out.'
  related: [build-a-settings-window, build-custom-drawn-imgui-widgets]
  borrowed_from: []
  merged_from: [pop-out-panel-sections-into-windows]
- slug: show-live-vehicle-data-in-a-window
  title: Show live vehicle and editor data in an ImGui window or HUD
  summary: Read the controlled vehicle's settled physics, orbit and engine state (or the part tree being
    built in the editor) on the main thread and present it in a window or HUD, either from a StarMap GUI
    hook or from a Harmony postfix on the game's own UI call.
  game_types: [KSA.Program, KSA.Vehicle, KSA.PhysicsStates, KSA.PhysicsEnvironment, KSA.PartTree, KSA.VehicleEditor,
    KSA.VehicleEditingSpace, KSA.CelestialSystem, KSA.PhysicalAtmosphereReference]
  engine_pointers: ['current/decomp/KSA/Program.cs OnFrame (ApplyVehicleSolvers precedes OnDrawUiViewports)
      and Program.ControlledVehicle, MainViewport', current/decomp/KSA/Vehicle.cs Vehicle.OnDrawUi(IGameViewport),
    current/decomp/KSA/VehicleEditor.cs OnDrawUi, 'current/decomp/KSA/Program.cs Editor, OnFrameEditor']
  lifecycle: ['frame:draw-ui', 'editor:draw-ui']
  approaches:
  - n: 1
    title: Plain ImGui window from StarMapAfterGui with guarded Begin/End
    mod: ksaero
    features: [mods/ksaero/features/aero-readout-window]
    technique: imgui-window
    note: Smallest possible readout. Read ref-readonly physics state after the solvers were applied, re-run
      a pure model for derived numbers, and keep Begin/End balanced with try/finally and log-once guards
      so one exception cannot corrupt the ImGui stack.
  - n: 2
    title: Harmony postfix on Vehicle.OnDrawUi filtered to the main viewport
    mod: kitten-engineer-redux
    features: [mods/kitten-engineer-redux/features/flight-hud-controlled-vehicle-postfix]
    technique: harmony-postfix
    note: Hooks the game's per-vehicle UI call instead of a StarMap attribute, so it must filter to Program.MainViewport
      and Program.ControlledVehicle itself. Shows building a per-frame data record (orbit, live nozzle
      thrust, ComputeActiveThrust, TWR) and reading engine thrust and mass flow.
  - n: 3
    title: Harmony postfix on VehicleEditor.OnDrawUi
    mod: kitten-engineer-redux
    features: [mods/kitten-engineer-redux/features/editor-panel-injection]
    technique: harmony-postfix
    note: 'The editor has no StarMap hook of its own; the postfix only runs while an editor exists. Covers
      reading EditingSpace.Parts and PartTree.ComputeInertMassPropertiesAsmb plus ComputePropellantMassPropertiesAsmb
      as the editor does. Sub-step to give its own section: the vehicle editor has no StarMap hook, so
      this variant reads the part tree being built (dry, propellant and wet mass) instead of live flight
      state.'
  related: [draw-ui-while-the-hud-is-hidden, build-custom-drawn-imgui-widgets]
  borrowed_from: []
  merged_from: [add-a-panel-to-the-vehicle-editor]
  dedupe_with: [flight-and-orbits/read-vehicle-flight-state]
- slug: build-a-settings-window
