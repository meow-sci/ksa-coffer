    panel with a reopen button and slow-motion controls.
  game_types: [Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImGuiTableFlags, KSA.Program, KSA.KSAColor, Brutal.Numerics.Color,
    KSA.Universe, KSA.SimSpeed]
  engine_pointers: [current/decomp/KSA/GameSettings.cs (stock settings pages for style comparison), current/decomp/KSA/KSAColor.cs
      Xkcd (static Color.Preset properties), current/decomp/KSA/Universe.cs SetSimulationSpeed]
  lifecycle: ['frame:draw-ui']
  approaches:
  - n: 1
    title: Tabs, three-column table, collapsing headers and ColorPicker4 bound to a float4
    mod: mpfx
    features: [mods/mpfx/features/effect-settings-window]
    technique: imgui-window
    note: 'Slider-plus-input row helper, ColorPicker4 bound to a float4, Reset buttons, pre/post rows.
      Also folded: ColorPicker4 bound to a float4 setting (mpfx): Direct float4 editing with reset. Sub-step:
      color editing.'
  - n: 2
    title: Label-gutter form tables and full-width widgets
    mod: purrtty
    features: [mods/purrtty/features/imgui-filter-combo-and-form-widgets]
    technique: imgui-window
    note: Fixed label gutter, full-width inputs, destructive button styling.
  - n: 3
    title: Settings window with ColorButton popups and INI persistence
    mod: ksa-aircrafthud
    features: [mods/ksa-aircrafthud/features/ini-settings-and-settings-window]
    technique: imgui-window
    note: ColorButton plus popup ColorPicker, settings written to a hand-parsed hud.ini. Borrowed from
      persistence.
  - n: 4
    title: Menu entry plus small settings window with wrapped tooltips
    mod: ksagolf
    features: [mods/ksagolf/features/developer-panel-and-menu-bar, mods/ksastructures/features/settings-menu,
      mods/ksacars/features/car-panel-and-modmenu]
    technique: imgui-window
    note: Wrapped tooltips, apply expensive settings on slider release, NoNav/NoFocusOnAppearing panel.
  - n: 5
    title: Reflected XKCD catalog with a filterable picker
    mod: unscience
    features: [mods/unscience/features/lib-xkcd-color-catalog]
    technique: reflection
    note: 'Reflect over KSAColor.Xkcd once, cache sorted name/color pairs, serve to a filterable picker.
      Writer note: the same feature is approach 4 of build-searchable-lists-and-browsers; write the XKCD
      catalog once here and cross-link, or the other way round.'
  - n: 6
    title: Panel opened from menu, ModMenu or a floating button
    mod: ksagolf
    features: [mods/ksagolf/features/developer-panel-and-menu-bar]
    technique: imgui-window
    note: 'Universe.SetSimulationSpeed(new SimSpeed(x)); the engine has no floor. Wrapped tooltips helper.
      Sub-step to give its own section: a developer panel with a reopen affordance and simulation-speed
      buttons below the 0.1x floor via Universe.SetSimulationSpeed.'
  related: [list-a-mod-in-modmenu, persist-mod-settings-toml, match-the-stock-console-ui-style, build-searchable-lists-and-browsers,
    add-items-to-the-game-menu-bar]
  borrowed_from: [mods/ksa-aircrafthud/features/ini-settings-and-settings-window]
  merged_from: [pick-colors-in-imgui, build-a-developer-panel]
  dedupe_with: [persistence/persist-mod-settings-toml, persistence/persist-mod-settings-ini, persistence/persist-mod-settings-as-json,
    flight-and-orbits/set-simulation-speed-from-a-mod, testing-and-tooling/live-tweak-constants-in-game]
- slug: build-searchable-lists-and-browsers
  title: Build searchable lists, two-pane browsers and file pickers in ImGui
  summary: Filter combos and long lists as the player types (working around Brutal's ImInputString quirks),
    build a two-pane browser with a draggable splitter and a go-to button, and let players pick files
    from disk into a shared catalog.
  game_types: [Brutal.ImGuiApi.ImInputString, Brutal.ImGuiApi.ImGui, KSA.Universe, KSA.CelestialSystem,
    KSA.Celestial, KSA.Vehicle, KSA.Program, KSA.ConsoleStyle]
  engine_pointers: [current/decomp/Brutal.ImGuiApi (ImInputString, InputTextWithHint), 'current/decomp/KSA/Universe.cs
      MoveCameraTo, WorldSun (null until LoadSystem), CurrentSystem', current/decomp/KSA/Program.cs ControlledVehicle,
    current/decomp/KSA/Constants.cs DocumentsFolderPath]
  lifecycle: ['frame:draw-ui', 'startup:all-mods-loaded']
  approaches:
  - n: 1
    title: Live substring filter inside a combo, EvaluateLength every frame
    mod: purrtty
    features: [mods/purrtty/features/imgui-filter-combo-and-form-widgets]
    technique: imgui-window
    note: ImInputString only refreshes Length on a true InputText return, so the filter calls EvaluateLength
      each frame.
  - n: 2
    title: SetKeyboardFocusHere on IsWindowAppearing with SetItemDefaultFocus
    mod: compendium
    features: [mods/compendium/features/celestial-info-window]
    technique: imgui-window
    note: Searchable star-system combo with filter field focused on open.
  - n: 3
    title: InputTextWithHint with ranked results and reveal-on-pick
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/search-focus-isolate-and-aggregation]
    technique: imgui-window
    note: InputTextWithHint returns true only on edit; ranked matches over the whole universe that reveal
      and center a node.
  - n: 4
    title: Filterable color catalog list
    mod: unscience
    features: [mods/unscience/features/lib-xkcd-color-catalog]
    technique: reflection
    note: Cached name/float4 pairs sorted by name served to a filterable picker.
  - n: 5
    title: Splitter from a thin Button plus MouseDelta between two BeginChild panes
    mod: compendium
    features: [mods/compendium/features/celestial-info-window]
    technique: imgui-window
    note: 'Covers the splitter, cached body lists, wait-for-universe guard in the UI hook (StarMapAllModsLoaded
      runs before any universe exists), Universe.MoveCameraTo with changeControl behaviour, and exception-safe
      cleanup. Sub-step to give its own section: wait-for-universe guard in the UI hook (StarMapAllModsLoaded
      runs before any universe exists) and Universe.MoveCameraTo for the go-to button.'
  - n: 6
    title: LibraryFileBrowser copying chosen files into a flat catalog
    mod: unscience
    features: [mods/unscience/features/lib-shared-file-library]
    technique: imgui-window
    note: Always copy into a flat non-overwriting catalog before handing back a catalog name; browser
      windows drawn from the host's render hook.
  related: [build-a-settings-window, lay-out-a-tree-or-graph-diagram, subclass-the-stock-imguiwindow,
    persist-mod-settings-toml]
  borrowed_from: []
  merged_from: [build-a-two-pane-browser-window, build-a-filesystem-file-picker, add-search-to-imgui-combos-and-lists]
  dedupe_with: [persistence/import-user-files-into-a-mod-catalog]
- slug: add-items-to-the-game-menu-bar
  title: Add a menu to the game's top menu bar
  summary: Put a top-level menu (and a window toggle) on KSA's main menu bar so players can open the mod's
    windows, working in both flight and the editor.
  game_types: [KSA.Program, KSA.IGameViewportLifecycle, KSA.GameViewport]
  engine_pointers: ['current/decomp/KSA/Program.cs DrawMenuBar, DrawProgramMenusHook (empty public hook,
      called around line 4005), OnDrawUiThreadSafe', current/decomp/KSA/GameViewport.cs SetMenuBarInUse]
  lifecycle: ['frame:draw-ui']
  approaches:
  - n: 1
    title: Harmony postfix on the empty Program.DrawProgramMenusHook
    mod: unscience
    features: [mods/unscience/features/unscience-menu-bar-entry, mods/ksa-deltavmap/features/map-window-and-menu-entry,
      mods/ksa-measuretools/features/measure-menu-and-tool-window, mods/purrtty/features/game-menu-with-modmenu-fallback]
    technique: harmony-postfix
    note: The hook exists only for mods and runs inside the real menu bar, so BeginMenu/MenuItem work
      directly. Toggling a window, lazily creating the window object inside the menu, and SetMenuBarInUse
      so the menu stays open.
  - n: 2
    title: BeginMainMenuBar from StarMapBeforeGui
    mod: ksagolf
    features: [mods/ksagolf/features/developer-panel-and-menu-bar, mods/ksastructures/features/settings-menu,
      mods/ksarmory/features/operator-panel-imgui]
    technique: starmap-lifecycle
    note: Older approach; in 2026.10.10 KSA's bar is a window named "Menu Bar", so a second BeginMainMenuBar
      before KSA fills it is fragile. Explain why approach 1 is preferred and when this still works.
  - n: 3
    title: Animated colored menu-bar words via transpiler plus prefix
    mod: unscience
    features: [mods/unscience/features/jplrepo-menu-bar-animation]
    technique: harmony-transpiler
    note: Restyle or decorate the bar itself. A transpiler on Program.DrawMenuBar snapshots the cursor
      before the version string, and a prefix on DrawProgramMenusHook restores it and draws sliding colored
      words.
  related: [list-a-mod-in-modmenu, add-a-menu-with-modmenu-fallback, subclass-the-stock-imguiwindow]
  borrowed_from: []
- slug: list-a-mod-in-modmenu
  title: List a mod in ModMenu with the ModMenuEntry attribute
  summary: 'Add a ModMenu entry (a static method that draws menu items or a settings page) and decide
    how to get the attribute type: reference the shipped DLL, vendor the DLL, copy the attribute so no
    hard dependency exists, or avoid referencing Brutal at all.'
  game_types: [Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImString, KSA.Constants]
  engine_pointers: [current/decomp/KSA/ModLibrary.cs (mod discovery and load order), current/decomp/Brutal.ImGuiApi
      (ImString is a ref struct)]
  lifecycle: ['frame:draw-ui']
  approaches:
  - n: 1
    title: Reference ModMenu.Attributes (NuGet or local DLL) and ship it
    mod: compendium
    features: [mods/compendium/features/modmenu-window-toggle, mods/ohmystars/features/modmenu-entry-and-console-style-windows,
      mods/mpfx/features/effect-settings-window]
    technique: inter-mod-api
    note: ModMenuEntry(menuName) on a static method; ship ModMenu.Attributes.dll beside the mod. MPFX
      notes ModMenu discovery was not verified in this reference set.
  - n: 2
    title: Vendored ModMenu.Attributes.dll resolved by StarMap's per-mod resolver
    mod: ksa-aircrafthud
    features: [mods/ksa-aircrafthud/features/modmenu-entry-vendored-attributes]
    technique: assembly-load-context
    note: DLL committed in the repo with a HintPath reference, copy-local next to the mod, resolved after
      default and game contexts; includes shipping any third-party DLL with a StarMap mod.
  - n: 3
    title: Copy the attribute source into the mod (matched by type name)
    mod: ksa-public-telemetry
    features: [mods/ksa-public-telemetry/features/modmenu-entry-with-standalone-fallback, mods/ksacars/features/car-panel-and-modmenu,
      mods/ksagolf/features/developer-panel-and-menu-bar, mods/ksarmory/features/operator-panel-imgui,
      mods/ksastructures/features/settings-menu, mods/realatmospheres/features/modmenu-page-and-toml-settings]
    technique: inter-mod-api
    note: ModMenu matches by type name, so an inert copy of ModMenuEntryAttribute needs no dependency
      and no extra DLL. Compare how each mod names and declares it.
  - n: 4
    title: DynamicMethod wrappers for ImGui.MenuItem and SetItemTooltip
    mod: realatmospheres
    features: [mods/realatmospheres/features/modmenu-page-and-toml-settings]
    technique: reflection
    note: 'Reflection cannot box a ref struct, so IL is emitted per call shape; also shows the hand-parsed
      settings.toml under KSA.Constants.DocumentsFolderPath. Sub-step to give its own section: ImString
      is a ref struct that reflection cannot box, so a ModMenu page that avoids a compile-time Brutal
      reference emits per-shape DynamicMethods.'
  related: [add-a-menu-with-modmenu-fallback, persist-mod-settings-toml]
  borrowed_from: []
