- slug: cache-and-key-body-data-per-loaded-system
  title: Cache and key per-body data so it survives system reloads, repeated ids and extra star systems
  summary: Derived body data (mass, radius, orbit elements, templates) is constant for a loaded system, so recomputing it
    each frame is waste, but a cache must die when the system is reloaded or a body object is replaced; and mod data about
    bodies (descriptions, categories, overrides) needs a key that stays unique when ids repeat across systems and moons share
    names. Invalidation strategies (reference latch on CurrentSystem, ConditionalWeakTable, one-shot attach) are shown together
    with two key designs (dotted parent-path resolved by tree search, prefix-keyed JSON catalog discovered in every mod folder).
  game_types:
  - KSA.Universe
  - KSA.CelestialSystem
  - KSA.Celestial
  - KSA.IParentBody
  - KSA.Orbit
  - KSA.IIndependentRoot
  engine_pointers:
  - current/decomp/KSA/Universe.cs CurrentSystem, LoadSystem, DeserializeSave
  - current/decomp/KSA/CelestialSystem.cs
  - current/decomp/KSA/Celestial.cs Parent, Id
  - current/decomp/KSA/IIndependentRoot.cs RootOf
  lifecycle:
  - frame:draw-ui
  - frame:viewports
  - startup:game-loaded
  - startup:immediate-load
  approaches:
  - n: 1
    title: Latch on the Universe.CurrentSystem reference, not its Id
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/live-celestial-system-graph
    technique: per-system-cache
    note: Reloading the same system id builds new body objects, so rebuild the graph, the transfer cost cache and the palette
      only when !ReferenceEquals(graph.System, system); everything per-root resets with it.
  - n: 2
    title: ConditionalWeakTable of immutable statics per Celestial
    mod: gatos
    features:
    - mods/gatos/features/celestial-body-catalog-reads
    technique: conditional-weak-table-cache
    note: Everything except position and velocity is cached once per body; each sample reads only GetPositionEcl and GetVelocityEcl;
      unchanged lists are re-published by reference so consumers compare cheaply.
  - n: 3
    title: One-shot attach on the first UI frame with a universe
    mod: compendium
    features:
    - mods/compendium/features/derived-body-properties
    technique: starmap-lifecycle
    note: Data loaded at immediate-load, before any celestial exists, is matched to bodies the first frame WorldSun is set,
      guarded by a static flag; derived numbers are computed once and only orbital speed is read live.
  - n: 4
    title: Dotted path of Celestial ids from the top-level body down
    mod: compendium
    features:
    - mods/compendium/features/star-systems-and-body-tree
    technique: game-object-graph
    note: 'Key like Jupiter.Io built by walking Celestial.Parent and stopping at the star; FindCelestialByKey matches the
      last segment and the parent depth-first under a root; the data lookup further prefixes root or system id. Sub-step of
      the cache topic: how to key body data so it resolves back to the live object; give it its own section.'
  - n: 5
    title: Prefix-keyed JSON files discovered in every installed mod folder
    mod: compendium
    features:
    - mods/compendium/features/cross-mod-json-catalog
    - mods/compendium/features/derived-body-properties
    technique: json-config
    note: 'A file counts only if its root has the marker key; each other root key is a system or star-root prefix, with deterministic
      precedence so another mod can add bodies or override text. Entries are attached to live bodies on the first UI frame
      with a universe. Sub-step of the cache topic: how to key body data so it resolves back to the live object; give it its
      own section.'
  related:
  - enumerate-star-systems-and-bodies
  - throttle-expensive-ui-computation
  - detect-vessel-and-soi-changes-from-ui
