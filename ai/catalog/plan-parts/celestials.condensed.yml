  dedupe_with:
  - flight-and-orbits/read-orbit-elements-and-body-data
  - flight-and-orbits/understand-ksa-coordinate-frames-and-epochs
- slug: read-body-properties-and-orbit-elements
  title: Read a body's atmosphere, ocean, ring, rotation, tilt, tidal-lock and orbit-element data
  summary: Mass, radius, atmosphere height, sea-level pressure and density, scale height, ocean density and level, ring presence,
    spin rate, sidereal period, axial tilt, tidal-lock flags and orbit inclination are scattered over IParentBody, the body
    template and transforms. This topic shows where each number comes from without touching private state (atmosphere and
    ocean may be null), how to sample density and pressure by altitude, and the corrections moons need for rotation and inclination.
  game_types:
  - KSA.IParentBody
  - KSA.AtmosphereReference
  - KSA.PhysicalAtmosphereReference
  - KSA.Rendering.Water.Data.OceanReference
  - KSA.AstronomicalTemplate
  - KSA.PlanetaryRingsReference
  - KSA.Celestial
  - KSA.RotationTemplate
  - KSA.Orbit
  engine_pointers:
  - current/decomp/KSA/PhysicalAtmosphereReference.cs GetAtmosphericDensityAtAltitude / GetAtmosphericPressureAtAltitude
  - current/decomp/KSA/AtmosphereReference.cs Physical
  - current/decomp/KSA/AstronomicalTemplate.cs AtmosphereReference, RingsReference
  - current/decomp/KSA.Rendering.Water.Data/OceanReference.cs
  - current/decomp/KSA/RotationTemplate.cs
  - current/decomp/KSA/Celestial.cs Inclination, GetCci2Orb, GetAngularVelocity
  - current/decomp/KSA/IParentBody.cs GetAngularVelocity
  lifecycle:
  - frame:draw-ui
  approaches:
  - n: 1
    title: IParentBody.GetAtmosphereReference and GetOceanReference projected into a snapshot; Angular velocity as a rate
      for telemetry
    mod: gatos
    features:
    - mods/gatos/features/celestial-body-catalog-reads
    technique: immutable-snapshot
    note: Height, ScaleHeight, SeaLevelPressure and SeaLevelDensity from Physical; ocean Density; read through the interface
      so a body type rename surfaces in one place. Ocean presence means OceanReference non-null with Density > 0. GetAngularVelocity()
      reported in rad/s alongside orbit elements as altitudes over the parent.
  - n: 2
    title: Atmosphere height, density and ring templates feeding classification decisions; Angular velocity to a stationary
      orbit radius
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/body-state-ladder-and-you-are-here
    technique: system-graph
    note: Physical.Height and SeaLevelDensity drive low-orbit altitude, ascent loss and aerobrake markers; BodyTemplate.RingsReference
      marks ringed bodies; atmosphere plus a 15,000 km radius marks a gas giant (no solid surface); GetNearSurfaceRadius for
      clearance. T = 2 pi / abs(omega); r = cbrt(mu T^2 / 4 pi^2); rung only if inside the SOI and above the low orbit.
  - n: 3
    title: Sample the live density and pressure model by altitude
    mod: compendium
    features:
    - mods/compendium/features/atmosphere-profile-graph
    - mods/compendium/features/derived-body-properties
    technique: imgui-drawlist
    note: 101 samples from 0 to Physical.Height through the game atmosphere functions, so the numbers follow a mod that replaces
      the profile; atmosphere strings for the body page come from the same template.
  - n: 4
    title: Template and transform reads for tilt, periods and inclination
    mod: compendium
    features:
    - mods/compendium/features/derived-body-properties
    technique: reflection
    note: BodyTemplate.Rotation.Tilt for star orbiters, X angle of GetCci2Orb().Inverse() for moons, SiderealPeriod, IsTidallyLocked,
      IsRetrograde; inclination relative to parent equator and to the star plane; OrbitLineMode read by reflection inside
      a try.
  related:
  - read-celestial-orbit-and-body-data
  - replace-a-bodys-atmosphere-density-profile
  - define-atmospheres-and-cloud-layers-in-system-xml
  - draw-a-chart-with-imdrawlist
  - classify-vessel-orbit-state
  - understand-ksa-coordinate-frames
  - build-a-local-site-frame
