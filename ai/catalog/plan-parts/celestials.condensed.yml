- slug: exclude-or-replace-ground-clutter
  title: Keep grass, rocks and trees off a custom site, and replace or preserve a planet's ground clutter
  summary: KSA clears ground clutter only around the first four launch pads in a body's Locations list, so a mod-added pad
    needs its exclusion zones refilled by a postfix (the zones are baked at load). Separately, chosen clutter types on one
    body can be swapped for imported models with their own materials, scale and colliders by building private native clutter
    bundles at the solver-dispatch window, with originals kept for exact undo; and since KSA 5447, knocked-out or displaced
    instances must be remembered per grid spacing and replayed across swaps and saves.
  game_types:
  - KSA.GroundClutterPlacementData
