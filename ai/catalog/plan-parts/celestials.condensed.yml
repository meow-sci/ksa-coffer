  approaches:
  - n: 1
    title: Harmony postfix on the private PopulateLaunchPadExclusionZones with ____celestial injection
    mod: ksastructures
    features:
    - mods/ksastructures/features/ground-clutter-exclusion-zones
    technique: harmony-postfix
    note: AccessTools.Method by name for the private target; four nearest pads with positive FootprintRadius to the main camera
      (the lift landmark has footprint 0 so is never a candidate); engine's formula float4(ForwardCcf, (Footprint + 50 m)
      / MeanRadius); zones are evaluated once at renderer build.
  - n: 2
    title: Prefix on ExecuteNextClothSolvers builds private bundles; originals captured for exact restore
    mod: unscience
    features:
    - mods/unscience/features/pebbles-ground-clutter-replacement
    - mods/unscience/features/pebbles-private-clutter-materials
    technique: harmony-prefix
    note: 'Wait for the cloth and vehicle workers, swap placement data and bubble statics in one window; postfix RebuildFrameResources
      and prefix Dispose so a renderer recreation rebuilds or releases the override; HiddenUiFrameHook replays updates while
      the HUD is hidden. Collider authoring and GLB import are the physics and assets topics. Distinct problem within the
      topic: replacing clutter meshes, materials and colliders.'
  - n: 3
    title: Per-grid memory with AND-merge, public-API snapshot and replay, native plus sidecar saves
    mod: unscience
    features:
    - mods/unscience/features/pebbles-clutter-state-persistence
    technique: save-sidecar
    note: 'Memory keyed by ecotype and separation; removed instances are never resurrected; snapshot before BubbleClutterStatics.Clear
      so in-flight objects keep pose and velocity; replay skips slots that no longer exist; native saves cover stock grids,
      the sidecar covers override-only grids. Sub-step of the replacement approach: carrying knocked-out and displaced instances
      across swaps and saves; give it its own section.'
