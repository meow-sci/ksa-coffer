- slug: place-static-objects-on-a-planet-surface
  title: Place a static object on a planet surface at a latitude and longitude, and keep it anchored
  summary: Static objects declared in XML are stood on a planet by LandmarkReferences in the body template's Locations list;
    adding an IsLaunchPad landmark in code before the engine resolves static objects gets a multi-part building with render
    models and Bepu colliders kittens can walk on. The engine culls it from inside a dug pit (terrain sampled with accurate
    false), so a postfix can redraw it per viewport; and anything stood on the ground must be anchored in the body-fixed frame
    so it follows rotation, survives floating-origin shifts and restores from a save.
