category: celestials
description: 'Celestial data and surface placement: star systems and the body tree, atmosphere, cloud and ring data, star
  catalogs, terrain queries and modifiers, static objects on a planet surface and ground clutter.'
topics:
- slug: enumerate-star-systems-and-bodies
  title: Enumerate every star system, star, planet and moon of the loaded universe
  summary: One loaded universe can hold several star systems, each rooted at a FixedStar or a Barycenter, with stars, planets,
    moons, minor bodies and even vehicles all reachable from the same tree. This topic shows the three walks mods use (roots
    then Children, a flat CelestialSystem.All scan, and a UI-selected root) and the type traps in each (the star is a StellarBody
    and not a Celestial, Children also lists vehicles).
  game_types:
  - KSA.Universe
  - KSA.CelestialSystem
  - KSA.IIndependentRoot
  - KSA.IParentBody
  - KSA.IOrbiter
  - KSA.Astronomical
  - KSA.Celestial
  - KSA.StellarBody
  - KSA.FixedStar
  - KSA.OrbitingStar
  - KSA.Barycenter
  - KSA.MinorBody
  engine_pointers:
  - current/decomp/KSA/Universe.cs LoadSystem (caches Roots, Stars, WorldSun)
  - current/decomp/KSA/CelestialSystem.cs All, CreateTreeFromRoot, HomeBody
  - current/decomp/KSA/IIndependentRoot.cs RootOf
  - current/decomp/KSA/IParentBody.cs Children
  - current/decomp/KSA/Barycenter.cs IsStar
  - current/decomp/KSA/OrbitingStar.cs
  - current/decomp/KSA/FixedStar.cs
  - current/decomp/KSA/Universe.cs UpdateWorldSun / WorldSun
  - current/decomp/KSA/Program.cs Render (moves WorldSun to the star nearest the camera)
  lifecycle:
  - startup:game-loaded
  - frame:draw-ui
  - frame:viewports
  approaches:
  - n: 1
    title: Roots then IParentBody.Children into an immutable forest; Role rules in a game-type-free ForestRules class
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/live-celestial-system-graph
    technique: system-graph
    note: 'CelestialSystem.All.OfType<IIndependentRoot>() then recursive IParentBody.Children, keeping only children that
      are IParentBody and Astronomical so vehicles drop out; children sorted once (bound orbits by semi-major axis, open orbits
      after). StellarBody means star, a non-star IIndependentRoot means barycenter, hubs have no surface; MinorBody children
      of a barycenter with no major planet are treated as that system planets; IsMoon misfires under barycenters so test the
      parent type. Rules are kept free of game types so they unit-test offline. Sub-step of the enumeration topic: the role
      rules for barycenter roots, orbiting stars, minor-body exoplanets and the moving WorldSun; give it its own section.'
  - n: 2
    title: Universe.Roots, RootOf and a selected root, collecting only Celestial or only stars; Keep your own selected root
      because WorldSun is not stable
    mod: compendium
    features:
    - mods/compendium/features/star-systems-and-body-tree
    technique: game-object-graph
    note: 'Universe.Roots span, IIndependentRoot.RootOf(body) walks Parent upward, CollectAllCelestials recurses Children
      through stars and barycenters, CollectSystemStars finds the star-like children. Includes the Children-moved-to-IParentBody
      API note. GetSelectedRoot keeps the player choice while it is still in Universe.Roots and only falls back to the root
      of WorldSun, which Program.Render moves to the nearest star every frame. Also covers OrbitingStar facts, distance in
      light years from HomeBody root. Sub-step of the enumeration topic: the role rules for barycenter roots, orbiting stars,
      minor-body exoplanets and the moving WorldSun; give it its own section.'
  - n: 3
    title: Flat scan of CurrentSystem.All plus an explicit WorldSun
    mod: gatos
    features:
    - mods/gatos/features/celestial-body-catalog-reads
    technique: immutable-snapshot
    note: All.UnsafeAsList() holds every Astronomical; the root star is a StellarBody and not a Celestial so the reader adds
      Universe.WorldSun itself when the walk did not list it. Cheapest walk when parent/child structure is not needed (read
      Parent per body instead).
  related:
  - cache-and-key-body-data-per-loaded-system
  - read-celestial-orbit-and-body-data
  - move-or-reparent-a-celestial-body
  - detect-vessel-and-soi-changes-from-ui
  - plan-multi-leg-delta-v-routes
  - estimate-interstellar-trip
  borrowed_from: []
  merged_from:
