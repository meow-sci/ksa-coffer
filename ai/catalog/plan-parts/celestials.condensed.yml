  - frame:celestials
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Ccf versus Cce entry points, sea clamp, and a no-claim result type; Document what accurate changes and sample non-accurate
      only where drift is harmless; Closed-form band below the terrain ceiling, fixed interior sample count
    mod: ksagolf
    features:
    - mods/ksagolf/features/terrain-height-queries
    technique: custom-physics
    note: 'Cce direction from position minus centre in Ecl (Cce shares ecliptic axes), Ccf for body-fixed positions; passing
      one to the other rotates by the planet''s current phase; sea detected by OceanReference non-null with Density > 0, never
      IsValid; ITerrainHeights.TryHeight false means no claim, never zero. Bicubic vs bilinear, modifier loop gated, early
      returns when no heightmap or biome materials, single-precision direction pack giving a third of a metre staircase on
      Earth; physics samples accurate true with a 0.25 m arc reuse; TerrainImpactFinder samples false. Sub-step of the height-query
      topic: what accurate true/false changes and how to cache; give it its own section. LineOfSight (segment vs sphere strictly
      between endpoints, horizon range as the sum of tangent lengths) and TerrainMask.TryBandBelow solving the quadratic;
      no-claim samples treated as unknown, not zero. Ceiling bound: MaxTerrainRadius - MeanRadius + 8,000 m, not MaxTerrainHeightApprox.
      Sub-step: line of sight built on the height query; give it its own section.'
  - n: 2
    title: Answer as a body centre and surface radius, pick the body by depth below the mean sphere; Radar horizon mask over
      non-accurate height samples
    mod: ksarmory
    features:
    - mods/ksarmory/features/terrain-ground-impact-test
    technique: terrain-query
    note: 'IGroundTest.TryGround returns centreEcl and surfaceRadius so a round tests its height every sub-step by subtraction;
      nearest body by depth below MeanRadius with last-body caching; any exception or non-finite answers false. TerrainHeights(body)
      with accurate false via KsaWorld.IsHiddenByTerrain, tens of samples per contact per scan. Sub-step: line of sight built
      on the height query; give it its own section.'
  - n: 3
    title: Cache decorator that reuses a sample until near the ground or moved
    mod: ksarmory
    features:
