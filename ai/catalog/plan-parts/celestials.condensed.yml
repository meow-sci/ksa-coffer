- slug: move-or-reparent-a-celestial-body
  title: Move a planet or moon at runtime by swapping its orbit or changing its parent
  summary: 'Bodies are on rails: moving one means giving it a new Orbit when the orbit solver will pick it up, and Celestial.SetOrbit
    alone leaves the old and new parents'' Children lists, cached transforms, sphere of influence and rank stale (KSA re-parents
    only vessels automatically). This topic builds an orbit from the target''s state vectors, swaps it in a first-priority
    prefix on the solver dispatch, orders chained updates, performs the manual Children surgery with cycle guards, and restores
    the original orbit on unweld.'
  game_types:
  - KSA.Celestial
  - KSA.IParentBody
  - KSA.IOrbiter
  - KSA.Orbit
  - KSA.CelestialSystem
  - KSA.Vehicle
  - KSA.PatchedConic
  - KSA.FlightPlan
  - KSA.StateVectors
  - KSA.Universe
  - KSA.CelestialUpdateTask
  - KSA.UniverseTime
  - KSA.GameSave
  engine_pointers:
  - current/decomp/KSA/Celestial.cs SetOrbit, UpdatePerFrameData, SphereOfInfluence, Rank
  - current/decomp/KSA/IParentBody.cs Children, UpdatePerFrameDataTree
  - current/decomp/KSA/Vehicle.cs SetFlightPlan (ApplyPendingParentChildrenFix)
  - current/decomp/KSA/Celestial.cs SetOrbit
  - current/decomp/KSA/Orbit.cs CreateFromStateCci
  - current/decomp/KSA/Universe.cs ApplyOrbitSolvers, ExecuteNextVehicleSolvers, ExecuteNextOrbitSolvers, DeserializeSave
  - current/decomp/KSA/GameSave.cs Populate
  lifecycle:
  - frame:dispatch-solvers
  - event:load
  - frame:draw-ui
  - event:save
  approaches:
  - n: 1
    title: SetOrbit plus manual Children surgery and UpdatePerFrameDataTree, with cycle guards on replay
    mod: unscience
    features:
    - mods/unscience/features/kiwis-marbles-cross-parent-reparenting
    - mods/unscience/features/kiwis-marbles-celestial-welding
    technique: celestial-reparenting
    note: Record old parent, SetOrbit, remove from oldParent.Children and add to newParent.Children when the parent differs,
      refresh the moved subtree before anything samples it; saved welds are replayed with parent-graph checks. Documents which
      state SetOrbit does and does not update.
  - n: 2
    title: Priority.First prefix on ExecuteNextVehicleSolvers builds a fresh orbit from target state vectors
    mod: unscience
    features:
    - mods/unscience/features/kiwis-marbles-celestial-welding
    technique: harmony-prefix
    note: Offset in the target parent CCI frame, Orbit.CreateFromStateCci around the target parent, SetOrbit before the CelestialUpdateTask
      snapshot; UI-time swaps are overwritten by the orbit workers. Chained welds are updated in topological order; originals
      restored on unweld; welds captured and replayed through save hooks.
  related:
  - enumerate-star-systems-and-bodies
  - mutate-vehicles-at-a-physics-safe-point
  - teleport-a-vessel-to-an-orbit-or-site
  - teleport-a-vessel-by-building-a-new-orbit
  - save-mod-state-with-the-scene
