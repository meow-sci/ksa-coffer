  - physics/weld-one-vessel-to-another
- slug: choose-which-body-the-game-renders-in-detail
  title: Control which body the game picks as the camera's nearby celestial
  summary: The game draws one body per camera in full detail (terrain, volumetric clouds, full atmosphere) and every other
    body as a distant sphere, chosen by CelestialSystem.GetNearbyAstronomical. A small moon passing close to its planet can
    steal that slot and make the planet flicker, especially under time warp. This topic shows how to change the ranking in
    place with a guarded transpiler.
  game_types:
  - KSA.CelestialSystem
  - KSA.Astronomical
  - KSA.Program
  - KSA.Camera
  engine_pointers:
  - current/decomp/KSA/CelestialSystem.cs GetNearbyAstronomical
  - current/decomp/KSA/Program.cs OnFrameCelestials, UpdateShaderData, FindNearbyCelestial
  - current/decomp/KSA/Astronomical.cs MeanRadius
  lifecycle:
  - startup:starmap-before-main
  - frame:celestials
  - frame:render
  approaches:
  - n: 1
    title: Transpile the distance comparison into a ranking call that favours a body within 25 radii
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/nearby-body-transpiler
    technique: harmony-transpiler
    note: 'Shape-check the single get_MeanRadius, replace sub/clt with a static Take(...) that writes best by reference, bail
      out returning the original IL on any mismatch; runs once at patch time, one static call per body per frame. Callers:
      OnFrameCelestials, UpdateShaderData, FindNearbyCelestial.'
  related:
  - write-a-harmony-transpiler
  - branch-per-body-inside-shared-game-shaders
  - keep-vessels-rendered-at-any-distance
  borrowed_from:
  - mods/realatmospheres/features/nearby-body-transpiler
  dedupe_with:
  - rendering/keep-vessels-rendered-at-any-distance
- slug: change-stock-system-and-body-xml-without-editing-core
  title: Change the stock system and body XML without editing Core
  summary: Sol's bodies live in the Core body library (Astronomicals.xml) and the inline system templates (SolSystem*.xml);
    a mod that wants to change an atmosphere, cloud deck or surface cannot ship a second copy of a Core file. This topic shows
    how to write a patched copy and make the game load it instead, and how two mods can cooperate on the same files.
  game_types:
  - KSA.Mod
  - KSA.ModLibrary
  - KSA.SystemTemplate
  - KSA.AstronomicalTemplate
  - KSA.AtmosphericBodyTemplate
  - KSA.PlanetaryBodyTemplate
  engine_pointers:
  - current/decomp/KSA/Mod.cs Assets, SystemTemplates, LoadAssetBundles, LoadSystems, PrepareSystems
  - current/Content/Core/ (Astronomicals.xml, SolSystem.xml, SolSystemDense.xml, SolSystemInterstellar.xml)
  lifecycle:
  - startup:starmap-before-main
  - startup:asset-load
  approaches:
  - n: 1
    title: Write patched copies and swap the file names in Core mod lists for absolute paths
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/core-xml-entry-redirect
    - mods/realatmospheres/features/atmosphere-optics-in-system-xml
    technique: xml-patch
    note: Prefixes on Mod.LoadAssetBundles / LoadSystems / PrepareSystems replace the Astronomicals.xml and system template
      entries; Path.Combine returns a rooted second argument unchanged so no further patch is needed; idempotent, and PrepareSystems
      stores XmlName so both system methods are patched. Edits are anchor-verified text edits of the XML.
  - n: 2
    title: One shared patched copy built by two cooperating mods
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/cross-mod-shared-shadow
    technique: xml-patch
    note: A named mutex, a once-per-launch reset token (process start time), a callback of marker-guarded idempotent edits
      and source shared between projects, so the second mod patches on top of the first mod rather than clobbering it.
  related:
  - redirect-game-xml-loading
  - coordinate-file-edits-between-mods
  - patch-game-glsl-with-anchored-text-edits
  - define-atmospheres-and-cloud-layers-in-system-xml
  borrowed_from:
  - mods/realatmospheres/features/core-xml-entry-redirect
  - mods/realatmospheres/features/cross-mod-shared-shadow
  dedupe_with:
  - assets/redirect-game-xml-loading
  - patching/redirect-game-xml-loading
  - assets/coordinate-file-edits-between-mods
- slug: define-atmospheres-and-cloud-layers-in-system-xml
  title: Define atmospheres, scattering and cloud layers for a body in system XML
  summary: 'A body''s look is XML data: promoting an airless body to AtmosphericBody with a complete Atmosphere block (including
    the Ozone and StartHeight elements the validity check requires), tuning Rayleigh and Mie coefficients, asymmetry, absorption
    and the ozone tent per body, and adding a sibling Clouds block with coverage masks, detail tiles, a flowmap, colour map
    and cloud types per layer (templated decks for gas giants, thin laminae for cirrus and haze). The coverage and flowmap
    textures need specific channel layouts and BC compression, built by offline scripts.'
  game_types:
  - KSA.AtmosphericBodyTemplate
  - KSA.PlanetaryBodyTemplate
  - KSA.MinorBodyTemplate
  - KSA.VisualAtmosphereReference
  - KSA.PhysicalAtmosphereReference
  - KSA.SystemTemplate
  - KSA.CloudsReference
  - KSA.CloudLayerReference
  - KSA.VolumetricCloudReference
  - KSA.RaymarchingReference
  - KSA.TextureReference
  engine_pointers:
  - current/decomp/KSA/AtmosphericBodyTemplate.cs
  - current/decomp/KSA/VisualAtmosphereReference.cs IsValid
  - current/decomp/KSA/PhysicalAtmosphereReference.cs
  - current/decomp/KSA/AstronomicalTemplate.cs OnDataLoad
  - current/decomp/KSA/VisualAtmosphereReference.cs
  - current/Content/Core/Astronomicals.xml (stock Atmosphere blocks)
  - current/Content/Shaders (Atmosphere*.comp)
  - current/decomp/KSA/CloudsReference.cs
  - current/decomp/KSA/CloudLayerReference.cs
  - current/decomp/KSA/VolumetricCloudReference.cs
  - current/decomp/KSA/Mod.cs GetPath (rooted paths pass through)
  - current/Content/Core (stock mask, detail and flowmap textures)
  - current/Content/Shaders (GetCoverageAndCloudType)
  lifecycle:
  - startup:starmap-before-main
  - startup:asset-load
  approaches:
  - n: 1
    title: Rename the element to AtmosphericBody and splice an Atmosphere block into the XML copy; Generated optical values
      spliced into ten XML copies, with data-as-key conventions
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/atmosphere-optics-in-system-xml
    technique: xml-patch
    note: 'Include Ozone and StartHeight so IsValid passes; ties into the measured flight tables registered per template id;
      delivered through the Core XML redirect. Generated Rayleigh, Mie and ozone values per body; the ozone tent reused as
      a per-channel absorber; scale height and asymmetry values chosen so a patched shader can recognise the body (see the
      shader-side topics). Sub-step of the atmosphere-definition topic: scattering and absorption tuning after the Atmosphere
      block exists; give it its own section.'
  - n: 2
    title: Templated decks and laminae with absolute asset paths
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/cloud-layers-in-system-xml
    technique: xml-patch
    note: 'One deck template per giant with per-planet mask and flowmap; Jupiter and Venus rebuilt; Mars cirrus and Titan
      haze added; absolute (rooted) texture paths pass through Mod.GetPath so Core XML can point into a mod folder; light
      distance derived from layer geometry. Flow speed: velocity = peak flow x displacement / loop duration, per-planet jets
      from measurements, Venus superrotation computed. Sub-step: the sibling Clouds block; give it its own section.'
  - n: 3
    title: Python asset scripts with encodings matched to the shader that reads them
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/texture-and-phase-asset-scripts
    - mods/realatmospheres/features/cloud-layers-in-system-xml
    technique: xml-asset
    note: 'Channel layout follows GetCoverageAndCloudType; flowmap encoding follows stock Jupiter (BC5); zonal jets from band
      brightness; scripts checked in while large derived textures are not. Sub-step of the cloud-layer approach: the offline
      asset scripts that produce the coverage, detail and flowmap textures; give it its own section.'
