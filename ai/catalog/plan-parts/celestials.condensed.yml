  approaches:
  - n: 1
    title: Append IsLaunchPad LandmarkReferences to Earth's CelestialTemplate at StarMapAllModsLoaded; Postfix UpdateStaticObjectRenderData
      and call StaticObject.UpdateRenderData with your own matrix
    mod: ksastructures
    features:
    - mods/ksastructures/features/office-landmarks-static-objects
    technique: xml-asset
    note: 'StaticSubObject + StaticObject XML with GroundOffset, SurfaceHeight, FootprintRadius; Latitude and Longitude as
      RadianReferences and OnDataLoad(Mod.Empty) to compute ForwardCcf; AllModsLoaded precedes AttachGameData so ResolveAll
      picks the landmark up; asset frame +X up, +Y east, +Z north; the nearest launch pad within 300 m is a body''s only static
      collider (use it as a doorway). Runs inside Program.Render per visible viewport; same matrix the engine would have built
      (axes plus up * GroundOffset); only when the tangent-plane cull hid it. Sub-step of the landmark approach: redraw when
      the engine culls the object; give it its own section.'
  - n: 2
    title: GroundAnchor (Celestial, Ccf position, normal) composed each frame into a camera-relative matrix
    mod: unscience
    features:
    - mods/unscience/features/sphinx-glb-statics-placement
    - mods/unscience/features/sphinx-static-object-render-hooks
    technique: glb-model
    note: 'FrameCcf x Ccf2Cce x translation(camera.GetPositionEgo(body)); east from UnitZ x radial with a pole fallback; placed
      by terrain click or beside a vessel after waiting for solvers; drawn through postfixes on StaticObjectRenderer; restored
      from scene saves. PlacementMath.GroundedLocal (scale 0.01 to 1000 per axis, rotations X Y Z in degrees) grounds and
      centres from the import bounds; tested with 200 random cases. Distinct problem within the topic: anchoring mod-drawn
      models (not landmarks) in the body-fixed frame.'
