- slug: query-terrain-height-and-line-of-sight
  title: Query the terrain height field and test line of sight across terrain
  summary: 'KSA has no terrain raycast a mod can use; it has Celestial.GetTerrainHeightFromDirCcf/Cce/Cci(direction, accurate),
    returning metres above MeanRadius along a direction from the body centre. This topic covers picking the frame entry point,
    clamping to sea level, what the accurate flag drops (every procedural modifier, including levelling decals) and how to
    keep accurate queries affordable, and builds on it a line-of-sight test: sphere test first, then fixed-budget sampling
    of the band below the terrain ceiling, or a radar-horizon mask.'
  game_types:
