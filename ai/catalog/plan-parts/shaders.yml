category: shaders
description: The shader-authoring side of KSA modding - writing GLSL post-processing and compute shaders, declaring ShaderExtensions assets, feeding them parameters from C#, building common effects, and replacing or patching the game's own GLSL without editing game files, plus the tooling to include, validate and reload shaders.
topics:
  # ---------------------------------------------------------------- post-processing shader authoring (ShaderExtensions)
  - slug: write-a-post-processing-fragment-shader
    title: Write a fullscreen post-processing fragment shader for KSA
    summary: A ShaderExtensions pass is one fragment shader run over a fullscreen triangle. This covers the contract the shader is written against (previous image as sampler2D at set 1 binding 0, ShaderTime at binding 1, an optional parameter block and push constant after it, the game's global bindings at set 0) and how to port older shaders that assumed subpasses.
    game_types: [KSA.Program, KSA.GlobalShaderBindings, RenderCore.RenderTechnique, KSA.Rendering.RenderTarget]
    engine_pointers:
      - current/decomp/KSA/GlobalShaderBindings.cs
      - current/decomp/KSA/ScreenspaceRenderer.cs
      - current/decomp/KSA/Program.cs RenderGame
    lifecycle: [startup:asset-load, render:post-process]
    approaches:
      - n: 1
        title: Minimal identity-for-neutral pass (MPFX contract)
        mod: mpfx
        features:
          - mods/mpfx/features/effect-shader-contract
          - mods/shaderextensions/features/post-processing-pass-chain
        technique: glsl-shader
        note: ScreenspaceVert supplies Uv; binding 0 is the previous image, 1 is ShaderTime, 2 the parameter block, push constant optional. Write every pass so neutral parameters return the input unchanged, because a pass cannot be removed at runtime. Note the build-5554 dynamic-offset quirk in the pass chain.
      - n: 2
        title: Multi-binding pass with extra textures and a dynamic-rendering port
        mod: ksa-aircrafthud
        features:
          - mods/ksa-aircrafthud/features/glass-post-process-chain
          - mods/shaderextensions/features/shaderex-extra-bindings
        technique: glsl-shader
        note: Shared Functions.glsl include, extra samplers shifted past the time buffer at binding 1, and the port from the v0.4.0 subpass style (drop SubpassId and RequiresUniqueRenderpass). Shows why the pinned ShaderExtensions rejected the original.
    related: [declare-post-processing-shader-assets-in-xml, feed-uniform-buffers-to-a-shaderextensions-shader, send-push-constants-to-a-shaderextensions-shader, animate-shaders-with-game-time, insert-a-custom-pass-into-render-game]
    borrowed_from: []

  - slug: declare-post-processing-shader-assets-in-xml
    title: Declare ShaderEx, PostProcessingShader, GlobalPostShader and ImGuiShader assets
    summary: Register shader passes entirely in mod XML - which element type to use, how Id, RenderPassId, shader paths, uniform buffer and push constant children fit together, and how one XML file can ship a whole chain with no C# render code.
    game_types: [KSA.ShaderReference, KSA.SerializedId, KSA.ModLibrary, KSA.AssetBundle]
    engine_pointers:
      - current/decomp/KSA/ShaderReference.cs
      - current/decomp/KSA/AssetBundle.cs
    lifecycle: [startup:asset-load, render:post-process]
    approaches:
      - n: 1
        title: Paired pre- and post-ImGui assets sharing a RenderPassId and parameter buffer by Id
        mod: mpfx
        features: [mods/mpfx/features/effect-chain-assets]
        technique: xml-asset
        note: 32 assets for 16 effects, one XML element per pass, no render code in C#. Size creates a buffer and an Id alone references it.
      - n: 2
        title: A small asset file with a chain, input references and an ImGuiShader
        mod: ksa-aircrafthud
        features:
          - mods/ksa-aircrafthud/features/glass-post-process-chain
          - mods/ksa-aircrafthud/features/imgui-window-hud-shader
        technique: xml-asset
        note: Three PostProcessingShader passes plus one ImGuiShader in HudAssests.xml, per-pass push constants and texture children in binding order.
    related: [chain-post-processing-passes, choose-pre-or-post-imgui-post-processing, bind-extra-textures-and-buffers-to-a-shader, shade-one-imgui-window-with-a-custom-fragment-shader]
    borrowed_from: []

  - slug: choose-pre-or-post-imgui-post-processing
    title: Choose between pre-ImGui (HDR scene) and post-ImGui (final frame) post-processing
    summary: A PostProcessingShader runs on the linear HDR scene before the tonemap composite, a GlobalPostShader on the finished swapchain image including the UI. The choice decides colour range, whether the UI is affected, how CMAA2 interacts and what image layout the shader inherits.
    game_types: [KSA.Program, KSA.Rendering.RenderTarget, KSA.Rendering.PostProcessing.Cmaa2Renderer, KSA.ScreenshotCapture, Core.Renderer]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame (offscreen target, swapchain render pass, RenderFinalComposite)
      - current/decomp/KSA.Rendering.PostProcessing/Cmaa2Renderer.cs
      - current/decomp/KSA.Rendering/RenderTarget.cs
    lifecycle: [frame:render, render:post-process, render:aa, render:imgui]
    approaches:
      - n: 1
        title: Pre-ImGui chain on the RGBA16F offscreen scene, copied back before tonemap
        mod: shaderextensions
        features:
          - mods/shaderextensions/features/pre-imgui-post-processing
          - mods/mpfx/features/effect-chain-assets
        technique: post-processing
        note: HDR values above 1.0 survive, UI untouched. Invisible when CMAA2 is active and leaves the image in a transfer layout, by reading 5554. Colour grading, bloom-like and blur effects belong here.
      - n: 2
        title: Post-ImGui chain on the presented image via swapchain copies
        mod: shaderextensions
        features:
          - mods/shaderextensions/features/post-imgui-global-post-shaders
          - mods/shaderextensions/features/cross-pass-image-references
        technique: post-processing
        note: Scene plus UI in display-referred colour; the swapchain lacks TRANSFER_DST in 5554 so the mod copies to a tracked target and back in PresentSrcKHR. Use for film grain, CRT curvature and anything that must cover the UI; can sample the pre-UI image by reference.
    related: [write-a-post-processing-fragment-shader, insert-a-custom-pass-into-render-game, capture-rendered-frames, flash-and-shake-the-view-from-a-compute-pass]
    borrowed_from: []

  - slug: chain-post-processing-passes
    title: Chain several post-processing passes in a defined order
    summary: Order passes with RenderPassId, let a later pass read an earlier pass's input or output image, and combine images from more than one stage, for example a blur chain whose composite still sees the unblurred scene.
    game_types: [KSA.Rendering.RenderImage, KSA.Program, RenderCore.RenderTechnique]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame
      - current/decomp/KSA.Rendering/RenderImage.cs
    lifecycle: [startup:asset-load, render:post-process]
    approaches:
      - n: 1
        title: Consecutive RenderPassIds, each pass samples the previous target
        mod: mpfx
        features:
          - mods/mpfx/features/effect-chain-assets
          - mods/mpfx/features/separable-gaussian-blur
        technique: post-processing
        note: Relies on implicit previous-image binding; ids 128-143 leave room to insert effects.
      - n: 2
        title: PostProcessingInputReference to the pre-blur scene from a composite pass
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/glass-post-process-chain]
        technique: xml-asset
        note: H blur, V blur, then a composite that also needs the sharp scene; binding numbers follow XML document order.
      - n: 3
        title: Input and output references resolved while the chain is built
        mod: shaderextensions
        features:
          - mods/shaderextensions/features/cross-pass-image-references
          - mods/shaderextensions/features/post-processing-pass-chain
        technique: post-processing
        note: How references are resolved, stage selection (pre or post ImGui) and why a reference to a later pass is not allowed.
    related: [blur-the-screen-with-a-separable-gaussian, declare-post-processing-shader-assets-in-xml, toggle-a-post-processing-pass]
    borrowed_from: []

  - slug: toggle-a-post-processing-pass
    title: Turn an always-on post-processing pass on and off
    summary: ShaderExtensions passes run every frame and cannot be disabled, so a mod switches an effect off by making the shader the identity - neutral parameter values, or an enabled flag that branches to a pass-through.
    game_types: [KSA.Program]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame
    lifecycle: [frame:draw-ui, frame:viewports, render:post-process]
    approaches:
      - n: 1
        title: Substitute neutral parameter values for disabled effects
        mod: mpfx
        features:
          - mods/mpfx/features/per-frame-parameter-upload
          - mods/mpfx/features/effect-shader-contract
        technique: post-processing
        note: Neutral values written when an effect is unchecked; each shader reduces to a copy at neutral. Cost of the pass remains.
      - n: 2
        title: Enabled push constant with an early pass-through branch
        mod: ksa-aircrafthud
        features:
          - mods/ksa-aircrafthud/features/glass-post-process-chain
          - mods/ksa-aircrafthud/features/sx-push-constants-and-buffers
        technique: post-processing
        note: Per-pass push constant carries enabled and time; uniform branch returns the input colour.
    related: [update-shader-parameters-at-the-right-time, send-push-constants-to-a-shaderextensions-shader, write-a-post-processing-fragment-shader]
    borrowed_from: []

  - slug: bind-extra-textures-and-buffers-to-a-shader
    title: Bind extra textures and buffers to a ShaderEx shader
    summary: Give a post-processing or ShaderEx fragment shader a dirt mask, a noise texture, a lookup table or a shared buffer by listing child elements in the shader's XML. Covers binding numbering (0 and 1 are fixed), texture formats and the order rules.
    game_types: [KSA.ShaderReference, KSA.TextureReference, KSA.ModLibrary]
    engine_pointers:
      - current/decomp/KSA/TextureReference.cs
      - current/decomp/KSA/ModLibrary.cs Bind
    lifecycle: [startup:asset-load, render:post-process]
    approaches:
      - n: 1
        title: Texture and buffer children in XML document order
        mod: ksa-aircrafthud
        features:
          - mods/ksa-aircrafthud/features/glass-post-process-chain
          - mods/ksa-aircrafthud/features/blue-noise-dithering
          - mods/shaderextensions/features/shaderex-extra-bindings
        technique: xml-asset
        note: A packed normal/dirt mask and a 128x8192 stacked blue-noise PNG bound as extra samplers; binding numbers follow document order after fixed bindings 0 and 1.
    related: [implement-a-shader-asset-type-with-its-own-descriptor-set, refract-and-distort-the-scene, add-film-grain-and-blue-noise-dithering, declare-post-processing-shader-assets-in-xml]
    borrowed_from: []

  - slug: implement-a-shader-asset-type-with-its-own-descriptor-set
    title: Implement a shader asset type that builds its own descriptor set from XML
    summary: How ShaderExtensions turns an XML element with children into a Vulkan descriptor pool, set layout and writes, resolves texture and buffer references after load with an IBinder, and loads nested elements the game does not visit. For modders writing their own asset kind with custom bindings.
    game_types: [KSA.ShaderReference, KSA.FileReference, KSA.ModLibrary, KSA.IBinder, KSA.AssetBundle, Brutal.VulkanApi.Abstractions.DescriptorPoolEx, Brutal.VulkanApi.Abstractions.DescriptorSetLayoutEx]
    engine_pointers:
      - current/decomp/KSA/IBinder.cs
      - current/decomp/KSA/ModLibrary.cs Bind
      - current/decomp/KSA/AssetBundle.cs OnDataLoad
    lifecycle: [startup:asset-load, frame:render]
    approaches:
      - n: 1
        title: ShaderReference subclass with counted pool, one set and a Bind-time resolver
        mod: shaderextensions
        features: [mods/shaderextensions/features/shaderex-extra-bindings]
        technique: vulkan-pipeline
        note: Count per descriptor type, MaxSets 1, stackalloc writes. AssetBundle.OnDataLoad visits top-level entries only so nested ones are forwarded manually; Bind runs in parallel on the thread pool inside the Program constructor.
    related: [bind-extra-textures-and-buffers-to-a-shader, create-a-persistently-mapped-uniform-buffer, build-a-fullscreen-pass-with-rendertechnique]
    borrowed_from: []

  - slug: build-a-fullscreen-pass-with-rendertechnique
    title: Build a fullscreen shader pass with RenderTechnique and RenderTarget
    summary: How the pass chain turns a fragment shader into a dynamic-rendering pipeline (triangle strip, no vertex input) with one RenderTarget, descriptor set and barrier sequence per pass, and what must be rebuilt when the renderer is rebuilt.
    game_types: [RenderCore.RenderTechnique, KSA.Rendering.RenderTarget, KSA.Rendering.ImageBarrierInfo, KSA.GlobalShaderBindings, KSA.CommandBufferEx, KSA.RenderingPresets]
    engine_pointers:
      - current/decomp/RenderCore/RenderTechnique.cs
      - current/decomp/KSA.Rendering/RenderTarget.cs
      - current/decomp/KSA/GlobalShaderBindings.cs
    lifecycle: [frame:render, render:post-process]
    approaches:
      - n: 1
        title: One RenderTarget as IRenderPassInfo per shader, rebuilt after RebuildRenderer
        mod: shaderextensions
        features: [mods/shaderextensions/features/post-processing-pass-chain]
        technique: vulkan-pipeline
        note: A RenderTarget doubles as the pipeline's render-pass info; GlobalShaderBindings supplies set 0; dynamic offset count is one too many in 5554.
    related: [insert-a-custom-pass-into-render-game, build-a-vulkan-pipeline-for-the-scene-target, handle-renderer-rebuilds]
    borrowed_from: []

  - slug: shade-one-imgui-window-with-a-custom-fragment-shader
    title: Run a custom fragment shader over one ImGui window
    summary: Make a single HUD window curved, tinted or distorted by tagging its draw list with a marker callback and declaring an ImGuiShader asset, so the window is rendered offscreen, shaded over its bounding rectangle and drawn back as an image.
    game_types: [KSA.ImGuiBackendVulkanImpl, KSA.ShaderReference, Brutal.ImGuiApi.ImDrawListPtr, Brutal.ImGuiApi.ImDrawDataPtr, KSA.KeyHash]
    engine_pointers:
      - current/decomp/KSA/ImGuiBackendVulkanImpl.cs
      - current/decomp/KSA/Program.cs RenderGame (ImGui render and draw)
    lifecycle: [frame:draw-ui, frame:render, render:imgui]
    approaches:
      - n: 1
        title: ImGuiShader asset plus SxImGui.CustomShader marker callback
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/imgui-window-hud-shader]
        technique: imgui-drawlist
        note: AddCallback with copied user data and an empty callback, UvRect uniform, and a 1/255-alpha full-window rect that pins the quad bounds.
      - n: 2
        title: How the host replays the draw list offscreen and rewrites it to one image
        mod: shaderextensions
        features: [mods/shaderextensions/features/imgui-window-post-shader]
