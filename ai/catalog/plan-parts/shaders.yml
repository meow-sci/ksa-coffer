  - slug: refract-and-distort-the-scene
    title: Refract and distort the rendered scene
    summary: Fake glass, heat haze, lenses and shock rings by sampling the scene at an offset. A fragment pass can use a packed normal/dirt mask texture; a compute pass copies the HDR scene and writes pixels back displaced by an analytic lens.
    game_types: [KSA.Program, KSA.SunbloomRenderer, KSA.Rendering.ComputePipelineWrapper, KSA.Rendering.RenderImage, RenderCore.ReverseDepthBufferUtils]
