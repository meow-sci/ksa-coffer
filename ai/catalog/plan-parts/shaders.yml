    lifecycle: [frame:draw-ui, frame:celestials, render:bloom]
    approaches:
      - n: 1
        title: 128-byte push constant with octahedral vectors and flag sums
        mod: ksarmory
        features: [mods/ksarmory/features/raymarched-mushroom-cloud]
        technique: vulkan-pipeline
        note: Derive redundant values (width/height) in the shader; the sign of one field discriminates modes; constants mirrored in a text test.
      - n: 2
        title: One compute pipeline multiplexed by a kind tag, with a per-kind dispatch cap
        mod: ksarmory
        features: [mods/ksarmory/features/high-altitude-burst-sky]
        technique: vulkan-pipeline
        note: Negative bound plus a kind float; keep the newest N per kind so the choice is stable rather than flickering by brightness rank.
      - n: 3
        title: Host-visible storage buffer of screen-space segments
        mod: ksarmory
        features: [mods/ksarmory/features/compute-shell-tracers]
        technique: vulkan-buffer
        note: Allocator reached by reflection, per-frame ring buffer, filled when the pass records.
