  - slug: blur-the-screen-with-a-separable-gaussian
    title: Blur the screen with a two-pass separable Gaussian
    summary: A horizontal then vertical Gaussian as consecutive passes with weights computed on the CPU, including tap distribution tricks, radius limits and the glass-style variant that blurs the refracted scene.
    game_types: [KSA.Rendering.RenderImage, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame
    lifecycle: [frame:draw-ui, render:post-process]
    approaches:
