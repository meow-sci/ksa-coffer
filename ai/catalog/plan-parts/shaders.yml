        technique: glsl-shader
        note: Per-side clock, strength and size, applied pre or post ImGui. Experimental HSV and channel-isolation passes live in the same file set.
      - n: 2
        title: 128x128x64 STBN texture stacked in a 128x8192 PNG, slice picked from time
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/blue-noise-dithering]
        technique: glsl-shader
        note: Texel-centre UVs, integer pixel coordinates, per-frame slice from accumulated time or FrameNumber; multiplicative grain.
    related: [animate-shaders-with-game-time, bind-extra-textures-and-buffers-to-a-shader, blur-the-screen-with-a-separable-gaussian]
