  # ---------------------------------------------------------------- feeding shaders from C#
  - slug: feed-uniform-buffers-to-a-shaderextensions-shader
    title: Feed a ShaderExtensions shader from C# with uniform buffers
    summary: Define a C# struct matching a GLSL std140 uniform block, register it as an XML element, and write it from the mod each frame. Covers std140 padding (vec4 arrays, mat4 columns), Span, pointer and BufferEx lookups, and sharing one buffer across several shaders by Id.
    game_types: [KSA.KeyHash, KSA.LookupCollection, Brutal.VulkanApi.Abstractions.BufferEx, Brutal.VulkanApi.Abstractions.MappedMemory, Brutal.Numerics.float4x4]
    engine_pointers:
      - current/decomp/KSA/KeyHash.cs
      - current/decomp/Brutal.VulkanApi.Abstractions/BufferEx.cs
    lifecycle: [startup:starmap-before-main, startup:asset-load, frame:draw-ui, render:post-process]
    approaches:
      - n: 1
        title: Pack = 1 structs with manual std140 padding, one block per effect
        mod: mpfx
        features:
          - mods/mpfx/features/duck-typed-buffer-structs
          - mods/mpfx/features/separable-gaussian-blur
          - mods/mpfx/features/color-grading-math
        technique: vulkan-buffer
        note: float arrays packed into vec4, float4x4 rows become mat4 columns, blur weights computed on the CPU into an int plus vec4[6] block. KeyHash.Make(Id) lookups return the mapped span.
      - n: 2
        title: Share one buffer across passes (Size owns it, Id references it)
        mod: shaderextensions
        features:
          - mods/shaderextensions/features/custom-uniform-buffers
          - mods/mpfx/features/effect-chain-assets
        technique: vulkan-buffer
        note: Pre and post variants of an effect read one block so the UI writes once; how ownership and reference elements resolve at bind time.
      - n: 3
        title: Span/pointer/BufferEx lookups beside push constants in a HUD mod
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/sx-push-constants-and-buffers]
        technique: vulkan-buffer
        note: Lookup delegate fields injected into static members, std140 padding, and which lookup form to pick.
    related: [send-push-constants-to-a-shaderextensions-shader, update-shader-parameters-at-the-right-time, use-shaderextensions-without-referencing-its-assembly, create-a-persistently-mapped-uniform-buffer]
    borrowed_from: []

  - slug: send-push-constants-to-a-shaderextensions-shader
    title: Send small per-frame values to a shader with push constants
    summary: "Use a push-constant struct for values that change every frame (time, enabled flag, strength): how it becomes a VkPushConstantRange, the 128-byte and 4-byte alignment limits, stage-range rules, and why push constants are captured at record time so passes never tear across frames in flight."
    game_types: [KSA.LookupCollection, KSA.KeyHash, Brutal.VulkanApi.VkDeviceExtensions]
    engine_pointers:
      - current/decomp/KSA/KeyHash.cs
      - current/decomp/KSA/Program.cs RenderGame
    lifecycle: [startup:starmap-before-main, startup:asset-load, frame:draw-ui, frame:render, render:post-process]
    approaches:
      - n: 1
        title: One push-constant element per pass with a lookup delegate field
        mod: ksa-aircrafthud
        features:
          - mods/ksa-aircrafthud/features/sx-push-constants-and-buffers
          - mods/shaderextensions/features/push-constants
        technique: vulkan-pipeline
        note: SxPushConstant struct, KeyHash of the XML Id, enabled and time written every frame to three passes. Overlapping ranges with different stage flags need every stage in each push.
      - n: 2
        title: Per-side push-constant clock and strengths in a settings-driven mod
        mod: mpfx
        features:
          - mods/mpfx/features/film-grain-and-experimental-effects
          - mods/mpfx/features/duck-typed-buffer-structs
        technique: vulkan-pipeline
        note: Separate pre and post clocks, optionally scaled by time warp; push constants written every frame while uniform buffers are written on change.
    related: [feed-uniform-buffers-to-a-shaderextensions-shader, toggle-a-post-processing-pass, animate-shaders-with-game-time, pack-parameters-for-a-compute-effect]
    borrowed_from: []

  - slug: use-shaderextensions-without-referencing-its-assembly
    title: Integrate with ShaderExtensions by attribute name, with no assembly reference
    summary: Declare same-named internal attribute types and static lookup delegate fields in your own assembly so ShaderExtensions discovers your structs by FullName and injects the buffers, letting the mod load whether or not the host is installed and avoiding version lock.
    game_types: [KSA.KeyHash, KSA.SerializedId, Brutal.Numerics.float4x4]
    engine_pointers:
      - current/decomp/KSA/Program.cs Main (host patches it to run AssetEx.Init)
    lifecycle: [startup:starmap-before-main, startup:asset-load]
    approaches:
      - n: 1
        title: Private SxUniformBuffer/SxPushConstant attribute copies and delegate fields
        mod: mpfx
        features: [mods/mpfx/features/duck-typed-buffer-structs]
        technique: inter-mod-api
        note: Attributes declared in the provider's namespace, matched by name; registration happens before Program.Main so XML elements exist when assets load.
      - n: 2
        title: Same pattern with StarMapBeforeMain registration and marker callbacks
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/sx-push-constants-and-buffers]
        technique: inter-mod-api
        note: Also copies the ImGui marker types; uses no type from ShaderExtensions.dll.
    related: [feed-uniform-buffers-to-a-shaderextensions-shader, send-push-constants-to-a-shaderextensions-shader]
    borrowed_from: []

  - slug: update-shader-parameters-at-the-right-time
    title: Upload shader parameters at the right point in the frame, and only when they change
    summary: Write parameter blocks from a ui or viewport hook before RenderGame records the passes, rewrite large buffers only when a dirty flag is set, and keep per-frame values (time, enabled) in push constants so no cross-frame tearing occurs.
    game_types: [KSA.Program, KSA.Universe, Core.Renderer]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnFrame, RenderGame
    lifecycle: [frame:draw-ui, frame:viewports, frame:render]
    approaches:
      - n: 1
        title: StarMapAfterGui writes push constants every frame and buffers on a UI dirty flag
        mod: mpfx
        features: [mods/mpfx/features/per-frame-parameter-upload]
        technique: starmap-lifecycle
        note: Disabled effects get neutral values; settings are not persisted. The write happens in frame:draw-ui, the same frame RenderGame records.
      - n: 2
        title: Postfix OnFrameEditor writes enabled and time into push constants
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/sx-push-constants-and-buffers]
        technique: harmony-postfix
        note: Runs in frame:viewports so it also works when the HUD is hidden; compare with the draw-ui timing.
    related: [feed-uniform-buffers-to-a-shaderextensions-shader, send-push-constants-to-a-shaderextensions-shader, keep-overlays-updating-when-hud-hidden]
    borrowed_from: []

  - slug: create-a-persistently-mapped-uniform-buffer
    title: Create and update a persistently mapped uniform buffer
    summary: A HostVisible, HostCoherent buffer kept mapped for the life of the renderer is the simplest way to push per-frame data to shaders. Covers allocation, the one-copy versus per-frame-in-flight question and recreation on renderer rebuild.
    game_types: [Brutal.VulkanApi.Abstractions.BufferEx, Brutal.VulkanApi.Abstractions.MappedMemory, Core.Renderer, KSA.Program]
    engine_pointers:
      - current/decomp/Brutal.VulkanApi.Abstractions/BufferEx.cs
      - current/decomp/KSA/Program.cs RebuildRenderer
    lifecycle: [frame:render, frame:prepare]
    approaches:
      - n: 1
        title: One shared time buffer rewritten from a RenderGame prefix
        mod: shaderextensions
        features: [mods/shaderextensions/features/shared-time-uniform-buffer]
        technique: vulkan-buffer
        note: Rewritten each flight frame; single copy versus two frames in flight discussed; recreated after RebuildRenderer.
      - n: 2
        title: Consumer-declared buffer owned through an XML Size
        mod: shaderextensions
        features: [mods/shaderextensions/features/custom-uniform-buffers]
        technique: vulkan-buffer
        note: The host allocates and maps; mods only receive a Span or pointer.
    related: [feed-uniform-buffers-to-a-shaderextensions-shader, animate-shaders-with-game-time, free-vulkan-resources-safely]
    borrowed_from: []

  - slug: animate-shaders-with-game-time
    title: Animate a shader with frame, real or simulation time
    summary: Choose the clock a shader reads. ShaderTime carries frame number, delta, real and simulation time and warp rate; a mod can also keep its own clock in a push constant, or feed the simulation clock to a stock shader. Pause and time warp behave differently for each.
    game_types: [KSA.Program, KSA.Universe, Core.Renderer]
    engine_pointers:
      - current/decomp/KSA/Universe.cs GetElapsedTime, GetElapsedSeconds
      - current/decomp/KSA/Program.cs FrameNumber, RenderGame
    lifecycle: [frame:render, frame:draw-ui, render:post-process, render:atmosphere]
    approaches:
      - n: 1
        title: ShaderTime block at binding 1 of every ShaderEx set
        mod: shaderextensions
        features: [mods/shaderextensions/features/shared-time-uniform-buffer]
        technique: vulkan-buffer
        note: Frame number, RenderGame dt, Universe.GetElapsedSeconds and SimulationSpeed; which fields freeze on pause and which scale with warp.
      - n: 2
        title: Own accumulated clock in a push constant, optionally warp-scaled
        mod: mpfx
        features: [mods/mpfx/features/film-grain-and-experimental-effects]
        technique: glsl-shader
        note: Grain should keep moving on pause, so a wall-clock accumulator, with an option to scale by time warp.
      - n: 3
        title: Signed simulation seconds smuggled through a stock atmosphere field
        mod: realatmospheres
        features: [mods/realatmospheres/features/atmosphere-uniform-side-channel]
        technique: harmony-prefix
        note: Universe.GetElapsedTime is the last applied sim step; the sim clock freezes on pause and scales with warp, the wall clock does not.
    related: [send-push-constants-to-a-shaderextensions-shader, send-extra-data-to-stock-shaders-without-new-uniforms, add-film-grain-and-blue-noise-dithering]
    borrowed_from: []

  - slug: give-a-mod-shader-the-camera-pose-and-global-data
    title: Give a mod shader the camera pose and the game's global shader data
    summary: Custom passes need the camera to project, reconstruct positions or branch on altitude. Options are the game's global camera and lighting data at descriptor set 0, push constants computed on the CPU with double-precision camera-relative subtraction, and the correct camera object (the base camera, not the map camera, in map mode).
    game_types: [KSA.GlobalShaderBindings, KSA.Camera, KSA.ViewProjection, KSA.IGameViewport, KSA.ViewportRegistry]
    engine_pointers:
      - current/decomp/KSA/GlobalShaderBindings.cs
      - current/decomp/KSA/Camera.cs
      - current/decomp/KSA/ViewportRegistry.cs MainViewport
    lifecycle: [frame:draw-ui, frame:celestials, render:post-process, render:bloom]
    approaches:
      - n: 1
        title: GlobalShaderBindings at set 0 of a fullscreen pass
        mod: shaderextensions
        features: [mods/shaderextensions/features/post-processing-pass-chain]
        technique: vulkan-pipeline
        note: The pass chain binds the game's own descriptor set at slot 0, so a fragment shader can read camera and lighting data directly; no dynamic offsets are used in 5554.
      - n: 2
        title: Camera-relative positions subtracted in double, then narrowed into push constants
        mod: ksarmory
        features: [mods/ksarmory/features/shock-front-refraction]
        technique: vulkan-pipeline
        note: Subtract camera PositionEcl in double before narrowing to float; project with the camera's row-vector matrix convention.
      - n: 3
        title: MainViewport.BaseCamera instead of GetMainCamera
        mod: ksarmory
        features: [mods/ksarmory/features/burst-flash-and-view-shake]
        technique: reflection
        note: GetMainCamera returns the map camera in map mode, so effects that must follow the flight view read the viewport's base camera.
    related: [pack-parameters-for-a-compute-effect, reconstruct-scene-positions-from-depth-in-a-compute-shader, project-world-positions-to-screen, choose-ecl-or-ego-positions-for-rendering]
    borrowed_from: []

