    summary: Fit an effect's state into Vulkan's guaranteed 128 bytes of push constants (octahedral unit vectors, exact integer flag sums with a sign discriminator), run several effects through one pipeline with a kind tag, or spill many items into a host-visible storage buffer.
    game_types: [KSA.Rendering.ComputePipelineWrapper, Brutal.VulkanApi.Abstractions.BufferEx, Brutal.VulkanApi.Abstractions.MappedMemory, KSA.KsaVmaAllocator, Core.KSADeviceContextEx]
