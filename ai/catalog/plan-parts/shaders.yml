  - slug: add-per-pixel-detail-over-the-atmosphere-luts
    title: Add per-pixel detail on top of KSA's sky look-up tables
    summary: The stock sky comes from azimuth-free LUTs; to add haze bands or other structure, insert a per-pixel raymarch that mirrors the stock integrator and blend it over the LUT result only where it can be seen.
