  # ---------------------------------------------------------------- replacing and patching the game's GLSL
  - slug: redirect-game-shaders-to-a-patched-copy
    title: Replace stock shaders without editing game files by redirecting FromFile
    summary: Copy the game's Core shader tree into the mod folder at launch, patch the copies, and prefix ShaderModuleUtils.FromFile to rewrite every path so shaderc's requesting-file-relative includes also resolve to the patched files. Covers the early hook this needs because stock shaders compile during ModLibrary.LoadAll.
    game_types: [RenderCore.ShaderModuleUtils, KSA.ShaderReference, RenderCore.Shaders.ShaderCompilerResolve, KSA.AssetReloader.ShaderReloader, KSA.ModLibrary]
    engine_pointers:
      - current/decomp/RenderCore/ShaderModuleUtils.cs FromFile
      - current/decomp/KSA/ShaderReference.cs
      - current/decomp/KSA.AssetReloader/ShaderReloader.cs GetModPath
      - current/Content/Core/Shaders
    lifecycle: [startup:starmap-before-main, startup:asset-load]
    approaches:
      - n: 1
        title: Shadow tree under the mod folder plus a FromFile path-rewrite prefix
        mod: realatmospheres
        features:
          - mods/realatmospheres/features/shader-file-redirect
          - mods/realatmospheres/features/shadow-tree-anchor-patching
        technique: harmony-prefix
        note: StarMapBeforeMain is the only hook before shader loading; patches run on thread-pool threads because shaders compile in parallel; preload Planet.Render.Core.dll into the game's load context so the patched type is the one used; keep ShaderReloader.GetModPath bookkeeping valid.
    related: [patch-game-glsl-with-anchored-text-edits, patch-game-shaders-in-memory-at-compile-time, make-the-game-rebuild-shaders-and-luts-after-a-change]
    borrowed_from: [mods/realatmospheres/features/shader-file-redirect]

