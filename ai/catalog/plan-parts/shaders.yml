        note: Reflects the backend's private shader modules and pipeline layout, registers the result as an ImGui texture and rewrites the draw list before RenderDrawData. Useful for debugging a window that does not show.
    related: [bend-the-picture-with-crt-curvature-and-chromatic-aberration, render-imgui-into-a-texture, show-an-image-in-imgui]
