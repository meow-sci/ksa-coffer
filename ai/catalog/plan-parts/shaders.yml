        features: [mods/realatmospheres/features/haze-band-sky-march]
        technique: glsl-shader
        note: Bands baked into LUT density for thin hazes, a per-pixel march with horizontal 3D noise for sky pixels, work culled where invisible.
    related: [branch-per-body-inside-shared-game-shaders, patch-game-glsl-with-anchored-text-edits, raymarch-a-local-volume-into-the-hdr-scene]
