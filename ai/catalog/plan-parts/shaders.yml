  - slug: make-the-game-rebuild-shaders-and-luts-after-a-change
    title: Make the game recompile shaders or regenerate LUTs after a change
    summary: A patched shader or changed atmosphere input does nothing until something rebuilds the pipeline or lookup table. Set the renderer-rebuild flag after toggling a shader patch, and invalidate a body's atmosphere LUTs when a side-channel value changes.
    game_types: [KSA.Program, KSA.AtmosphereRenderer]
    engine_pointers:
