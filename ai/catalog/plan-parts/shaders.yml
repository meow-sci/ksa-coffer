  # ---------------------------------------------------------------- core library, runtime compile, tooling
  - slug: include-the-game-shader-library-in-mod-glsl
    title: Include KSA's own GLSL library from a mod shader
    summary: A mod shader can reuse the game's Global, atmosphere LUT and texture-set headers instead of copying them, by generating an include file with absolute paths at load time. The folder name Content matters for shader hot reload.
    game_types: [KSA.ShaderReference, KSA.AssetReloader.ShaderReloader, RenderCore.Shaders.ShaderCompilerResolve, Brutal.ShaderCApi.ShaderC, KSA.Mod, KSA.ModLibrary]
    engine_pointers:
