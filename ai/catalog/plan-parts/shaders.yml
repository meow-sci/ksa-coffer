  - slug: patch-game-shaders-in-memory-at-compile-time
    title: Patch and recompile a game shader in memory without touching files
    summary: Prefix ShaderModuleUtils.FromFile (and, for model shaders, KSA.Rendering.Utils.SetShaderFromMod) to compile transformed source instead of the file on disk. Covers choosing which shaders to match, the transform, and forcing the recompile.
