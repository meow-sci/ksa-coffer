  - slug: send-extra-data-to-stock-shaders-without-new-uniforms
    title: Send extra data to stock shaders without adding uniforms
    summary: Stock shaders have fixed inputs, so a patched shader borrows ones that are free or irrelevant for the case at hand - unused fields in a uniform struct, spare high bits in a per-instance flag word, or a marker on the material - and decodes them in the patched GLSL.
    game_types: [KSA.AtmosphereRenderer, KSA.Atmosphere.Rendering.ShaderStructs.AtmosphereData, KSA.PartTreeRenderData, KSA.MaterialData, KSA.DistanceReference]
    engine_pointers:
      - current/decomp/KSA/AtmosphereRenderer.cs FillPlanetAtmosphereData
      - current/decomp/KSA/PartTreeRenderData.cs WriteState
      - current/decomp/KSA/MaterialData.cs
    lifecycle: [frame:render, render:atmosphere, frame:draw-ui]
    approaches:
      - n: 1
        title: Temporary value swap in a prefix, or edit the boxed struct in a postfix
        mod: realatmospheres
        features: [mods/realatmospheres/features/atmosphere-uniform-side-channel]
        technique: harmony-postfix
        note: Ozone extent carries signed sim seconds for haze bodies; spin axis and angle ride unused ring slots; the value is restored after the fill call.
      - n: 2
        title: Spare high bits of PartTreeRenderData state flags
        mod: unscience
        features:
          - mods/unscience/features/humble-arteest-vehicle-paint-shader-patch
          - mods/gatos/features/vehicle-and-eva-paint
        technique: harmony-postfix
        note: Postfixes on the private state writers OR packed colours into the instance state word; the patched fragment shader decodes them. Private batch types are reached by reflection.
      - n: 3
        title: Marker in a material's ExtraData plus shader-side branch
        mod: unscience
        features: [mods/unscience/features/free-fallin-canopy-projection-shader]
        technique: glsl-shader
        note: The material carries a marker; the patched shader reads it and projects only on those materials.
    related: [patch-game-shaders-in-memory-at-compile-time, dispatch-shader-variants-with-sentinel-values, branch-per-body-inside-shared-game-shaders, paint-vessel-parts-with-custom-colours]
    borrowed_from: []

  - slug: dispatch-shader-variants-with-sentinel-values
    title: Dispatch shader behaviour with out-of-range XML values
