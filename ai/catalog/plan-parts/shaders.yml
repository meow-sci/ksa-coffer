        title: CPU-computed normalized weights up to radius 20 in a std140 block
        mod: mpfx
        features: [mods/mpfx/features/separable-gaussian-blur]
        technique: glsl-shader
        note: One shader file used by both chains; second pass samples the first pass's target; weights int plus vec4[6].
      - n: 2
        title: Non-linear tap distribution and a refracted horizontal pass
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/glass-post-process-chain]
        technique: glsl-shader
        note: H pass combines refraction offsets; V pass plus a composite using the pre-blur scene by input reference.
    related: [chain-post-processing-passes, refract-and-distort-the-scene, add-film-grain-and-blue-noise-dithering]
