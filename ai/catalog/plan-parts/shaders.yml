  - slug: branch-per-body-inside-shared-game-shaders
    title: Branch per body inside shared game shaders
    summary: One stock shader draws every body, so per-body behaviour has to be keyed on something the shader can already see. Two keys that work in practice are the body radius plus a value only the mod's XML writes, and per-point terrain height for relief-aware shading.
    game_types: [KSA.AtmosphereRenderer, KSA.Atmosphere.Rendering.ShaderStructs.AtmosphereData, KSA.PlanetRenderer]
    engine_pointers:
      - current/Content/Core/Shaders/Atmosphere/AtmosphereData.glsl
      - current/Content/Core/Shaders/Planet/Planet.frag
      - current/Content/Core/Shaders/Planet/GroundClutter/Solid.frag
    lifecycle: [startup:starmap-before-main, render:atmosphere, render:planet]
    approaches:
      - n: 1
        title: Measured ln-density tables recognised by radius and an exact scale height
        mod: realatmospheres
        features: [mods/realatmospheres/features/measured-density-tables-in-shaders]
        technique: glsl-shader
        note: One injected AtmosphereDensityFalloff replaces six exponential sites in four shaders so every LUT integrates the same function; adds a Mars dust layer and altitude-dependent Titan Rayleigh colour.
      - n: 2
        title: Relief-aware terminator closing over a sqrt(2 relief / R) band
        mod: realatmospheres
        features: [mods/realatmospheres/features/relief-softened-terminator]
        technique: glsl-shader
        note: Planet.frag and GroundClutter/Solid.frag replace the smooth-ball self-shadow with a horizon test from each point's height while keeping other bodies' eclipses.
    related: [dispatch-shader-variants-with-sentinel-values, send-extra-data-to-stock-shaders-without-new-uniforms, add-per-pixel-detail-over-the-atmosphere-luts, make-the-game-rebuild-shaders-and-luts-after-a-change]
