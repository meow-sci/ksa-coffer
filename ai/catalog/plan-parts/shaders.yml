  - slug: add-film-grain-and-blue-noise-dithering
    title: Add film grain and dither away banding
    summary: Two ways to add noise to the final image - procedural simplex-style grain blended soft-light with a time seed, and a spatiotemporal blue-noise texture indexed by integer pixel coordinates and a time-selected slice, which hides banding after heavy blur.
    game_types: [KSA.Program, KSA.Universe]
    engine_pointers:
