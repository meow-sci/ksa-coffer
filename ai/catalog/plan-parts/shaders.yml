    title: Bend the picture with CRT barrel curvature and chromatic aberration
    summary: Remap UVs for barrel distortion inside a rectangle and offset colour channels by a luminance-masked amount, applied either to a single HUD window or to a whole canopy-glass composite.
    game_types: [KSA.Program, KSA.ImGuiBackendVulkanImpl]
