  - slug: aim-a-secondary-viewport-camera
    title: Aim a secondary viewport's camera and rebuild its matrices
    summary: A secondary camera follows nothing unless told to, and its view matrices were built in the viewport pass before your hook ran. Write the pose where the matrices are still to be built, or call Camera.OnFrame and refresh the shader data yourself.
    game_types: [KSA.Camera, KSA.IGameViewport, KSA.FixedController, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/Camera.cs LookAt, OnFrame, SetFieldOfView
      - current/decomp/KSA/Program.cs UpdateShaderData, SetCameraUbo
    lifecycle: [frame:draw-ui, frame:viewports, frame:render]
    approaches:
      - n: 1
        title: LookAt from the GUI hook, then Camera.OnFrame, UpdateShaderData and SetCameraUbo
        mod: ksarmory
        features: [mods/ksarmory/features/director-camera-window]
        technique: direct-camera-write
        note: Unfollow(changeControl false) and Fixed first, anchor the eye on the platform as this window's camera draws it, clamp FOV 1 to 120, and rebuild the matrices and per-viewport shader data right away.
      - n: 2
        title: Pose written in a FixedController.OnFrame prefix before the stock Camera.OnFrame
        mod: unscience
        features: [mods/unscience/features/hot-pursuit-part-mounted-cameras]
        technique: harmony-prefix
        note: No extra rebuild needed because the write is in phase; the pose is composed in the main camera's ego space then converted once, to avoid subtracting huge ecliptic coordinates.
    related: [borrow-a-secondary-viewport, write-the-camera-pose-in-phase-with-the-frame, give-a-secondary-camera-its-nearby-body, mount-a-camera-on-a-part]
    borrowed_from: []

  - slug: give-a-secondary-camera-its-nearby-body
    title: Give a secondary camera its nearby celestial so the sky and ground draw right
    summary: Program.OnFrameCelestials computes the nearby body, distances, terrain height and altitude only for the frame camera, so a secondary view shows stars, a hard horizon or a grey disc. Fill the same fields for your camera, mirroring the engine's 80,000 km cut-off.
    game_types: [KSA.Camera, KSA.Program, KSA.Celestial, KSA.StaticCelestialDistanceRendering, KSA.StaticObjectRenderer]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnFrameCelestials, FindNearbyCelestial, RenderViewport
      - current/decomp/KSA/Camera.cs NearbyCelestial, DistanceToNearbyCelestialKm, NearbyCelestialTerrainHeight, GetEffectiveNearbyCelestial
      - references/KSArmory/docs/KSA-CAMERAS.md part 2 section A (why a secondary viewport shows stars and a grey ball)
    lifecycle: [frame:viewports, frame:celestials, frame:render]
    approaches:
      - n: 1
        title: HotPursuitCelestialState.Synchronize inside the pose prefix
        mod: unscience
        features: [mods/unscience/features/hot-pursuit-part-mounted-cameras]
        technique: harmony-prefix
        note: FindNearbyCelestial(camera) for the mounted camera, then the public fields; without it the nearby body was also drawn by the distant-sphere pass as a dark disc across the feed.
      - n: 2
        title: SetNearbyContext when aiming a window camera
        mod: ksarmory
        features: [mods/ksarmory/features/director-camera-window]
        technique: direct-camera-write
        note: Terrain level of detail and the sky read these fields, so they are set in the same step as the pose.
    related: [aim-a-secondary-viewport-camera, borrow-a-secondary-viewport]
    borrowed_from: []

  - slug: show-a-secondary-camera-in-your-own-window
    title: Show a secondary camera's picture in your own ImGui window
    summary: Hide KSA's window for a leased viewport and draw its colour image in a mod window with your own controls, or leave the stock window and just set its name, size and visibility.
    game_types: [KSA.ViewportBase, KSA.ViewportOptionFlags, KSA.IGameViewport, KSA.GameViewport, Brutal.ImGuiApi.ImGui]
    engine_pointers:
      - current/decomp/KSA/ViewportBase.cs OptionFlags (protected set), RequestResize
      - current/decomp/KSA/ViewportOptionFlags.cs HasUi, RenderOrbitLines
      - current/decomp/KSA/Program.cs OnDrawUiViewports
      - current/decomp/KSA/GameViewport.cs DrawImGui
    lifecycle: [frame:draw-ui, frame:render, render:imgui]
    approaches:
      - n: 1
        title: Clear HasUi and RenderOrbitLines through the reflected OptionFlags setter, draw the viewport texture
        mod: ksarmory
        features: [mods/ksarmory/features/director-camera-window]
        technique: reflection
        note: OnDrawUiViewports only calls DrawImGui for viewports with HasUi, and DrawImGui also hosts hover handling and the menu bar, so all of it goes with KSA's window. Use ### window ids so renames do not move the window.
      - n: 2
        title: Keep KSA's window; set name, resize once, visibility
        mod: unscience
        features: [mods/unscience/features/hot-pursuit-part-mounted-cameras]
        technique: viewport-lease
        note: SetName, RequestResize with resize allowed only around the call, SetVisible; closing the stock window releases the lease.
    related: [borrow-a-secondary-viewport, render-a-vulkan-scene-offscreen-into-imgui, put-a-live-screen-on-a-part, paint-overlays-on-secondary-and-detached-viewports, grade-a-camera-feed-into-a-tv-or-thermal-look]
    borrowed_from: []

  - slug: mount-a-camera-on-a-part
