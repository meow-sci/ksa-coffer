  - slug: override-the-camera-field-of-view
    title: Override the camera field of view and zoom past the stock clamp
    summary: Camera.SetFieldOfView takes degrees and does not clamp, GetFieldOfView answers radians, and the stock zoom keys clamp to 15 to 120 degrees. Drive the FOV from code, keep it from being overwritten by projection rebuilds, and avoid values that break the projection.
    game_types: [KSA.Camera, KSA.Program, KSA.GameSettings, KSA.ViewportRegistry]
    engine_pointers:
      - current/decomp/KSA/Camera.cs SetFieldOfView, GetFieldOfView, ChangeFieldOfView, UpdateProjection, _fovRadians
    lifecycle: [frame:draw-ui, frame:input, frame:viewports]
    approaches:
      - n: 1
        title: Prefixes on Camera.UpdateProjection (write _fovRadians) and ChangeFieldOfView (swallow stock keys), main camera only
        mod: unscience
        features: [mods/unscience/features/glass-fov-override]
        technique: harmony-prefix
        note: Lens presets driven from a static FovController; saved with the scene.
      - n: 2
        title: SetFieldOfView in degrees, GetFieldOfView in radians, zoom beyond the player clamp
        mod: ksarmory
        features:
          - mods/ksarmory/features/borrow-main-view-camera
          - mods/ksarmory/features/director-camera-window
        technique: direct-camera-write
        note: The director clamps to 1 to 120 degrees because the projection throws outside 0 to 180; windows put back to 50 degrees on release since the player zoom keys clamp at 15.
      - n: 3
        title: Treat FOV as one half of a borrowed view and return it first
        mod: ksagolf
        features: [mods/ksagolf/features/level-horizon-camera-controller]
        technique: state-record-and-restore
        note: SetFieldOfView does not clamp; always give the player's FOV back.
    related: [read-the-main-camera-pose-and-mode, borrow-the-main-camera-and-hand-it-back, aim-a-secondary-viewport-camera]
    borrowed_from: []

