  - slug: make-a-walking-kitten-follow-the-look
    title: Make a walking kitten face and move where the player looks
    summary: KSA moves a grounded kitten relative to the camera and turns it toward its motion. Patch KittenLocomotion.StepGrounded on the vehicle worker to replace the camera forward with the look heading, and set the facing so strafing side-steps instead of turning.
    game_types: [KSA.KittenLocomotion, KSA.CharacterControlInputs, KSA.LocomotionCommand, KSA.LocomotionState, KSA.KittenEva, KSA.PhysicsBubble]
    engine_pointers:
      - current/decomp/KSA/KittenLocomotion.cs StepGrounded, Advance
      - current/decomp/KSA/KittenEva.cs PrepareWorker (copies the main camera forward into the inputs)
      - current/decomp/KSA/PhysicsBubble.cs
    lifecycle: [physics:vehicle-solver, frame:draw-ui]
    approaches:
      - n: 1
        title: StepGrounded prefix swaps CameraForwardCce, postfix writes FacingDirPhys, heading via volatile float[]
        mod: ksastructures
        features: [mods/ksastructures/features/first-person-kitten-view]
        technique: worker-thread-patch
        note: Stock would flatten the camera forward, which degenerates looking straight down.
      - n: 2
        title: Same hook, plus drawing the turn on the skeleton for a standing kitten
        mod: ksagolf
        features: [mods/ksagolf/features/first-person-kitten-view]
        technique: worker-thread-patch
        note: A kitten standing still sleeps on the terrain and does not turn, so the turn to the look is drawn on the skeleton until it walks. Writes only worker-owned copies.
    related: [first-person-camera-for-a-kitten, look-around-with-the-mouse-in-a-character-view, write-worker-thread-safe-solver-patches, change-kitten-walking-behaviour]
    borrowed_from: [mods/ksastructures/features/first-person-kitten-view, mods/ksagolf/features/first-person-kitten-view]

  - slug: hide-a-kitten-from-its-own-first-person-view
    title: Hide a kitten's body or head in the first-person view only
    summary: The engine draws a kitten once per viewport. Know which viewport is being drawn, then hide the head (the engine's own IVA flag) or collapse the skeleton for that view only, so shadows and other cameras still see the whole kitten.
    game_types: [KSA.KittenEva, KSA.KittenRenderable, KSA.AnimatedRenderable, KSA.IAnimProcessor, KSA.IVASeat, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/KittenRenderable.cs HideHead
      - current/decomp/KSA/IVASeat.cs UpdateSeatedRenderable, IsCameraInThisSeat
      - current/decomp/KSA/AnimatedRenderable.cs UpdateAnimation, AnimProcessors
      - current/decomp/KSA/KittenEva.cs UpdateRenderData
    lifecycle: [frame:render, render:prepass, render:shadows]
    approaches:
      - n: 1
        title: KittenEva.UpdateRenderData prefix marks the main viewport, IAnimProcessor collapses the bones
        mod: ksastructures
        features: [mods/ksastructures/features/first-person-body-hiding-and-shadow]
        technique: anim-processor
        note: Borrowed from kittens. Every bone collapses to the head while the main view draws; the call order is secondary views first, main view last.
      - n: 2
        title: Collapse onto the wrist so the club paw stays as a viewmodel
        mod: ksagolf
        features: [mods/ksagolf/features/first-person-kitten-view]
        technique: anim-processor
        note: Folding onto the chest stretched skin into sheets across the view; folding the head also folds the fur and helmet.
      - n: 3
        title: Set KittenRenderable.HideHead per view
        mod: ksagolf
        features: [mods/ksagolf/features/first-person-kitten-view]
        technique: reflection
        note: The simple alternative KSA already uses for IVA (IVASeat sets HideHead = IsCameraInThisSeat). The golf page records it but the mod does not use it.
    related: [keep-the-shadow-of-a-hidden-body, first-person-camera-for-a-kitten, unlock-the-iva-camera, hide-parts-or-subparts-from-rendering]
    borrowed_from: [mods/ksastructures/features/first-person-body-hiding-and-shadow]

  - slug: keep-the-shadow-of-a-hidden-body
    title: Keep the full shadow of a body that is hidden from the camera
    summary: A hidden or collapsed first-person body also loses its shadow. Replace the shadow-pool entries for the main view with a second skinning of the saved full pose so the shadow still shows the whole kitten.
    game_types: [KSA.AnimatedRenderable, KSA.StaticMeshRenderable, KSA.SuperMeshRenderSystem, KSA.ShadowRenderable, KSA.InstanceData, RenderCore.Animation.Skeleton]
    engine_pointers:
      - current/decomp/KSA/AnimatedRenderable.cs Draw, AllocateSkinningMatrices
      - current/decomp/KSA/StaticMeshRenderable.cs Draw
      - current/decomp/KSA/SuperMeshRenderSystem.cs ShadowRenderablePool
    lifecycle: [frame:render, render:shadows]
    approaches:
      - n: 1
        title: Draw postfix removes what the draw added and appends skinned shadow entries for the saved pose
        mod: ksagolf
        features: [mods/ksagolf/features/first-person-kitten-view]
        technique: harmony-postfix
        note: BodyWorld copy, InverseBindPose[i] * BodyWorld[i] into a new block from AllocateSkinningMatrices, one ShadowRenderable per shadow-casting mesh with the block index in InstanceData.data.Y; helmet and visor shadow entries re-targeted too.
      - n: 2
        title: Second skinning of the saved full pose, with the bone offset in data.y
        mod: ksastructures
        features: [mods/ksastructures/features/first-person-body-hiding-and-shadow]
        technique: harmony-postfix
        note: Borrowed from kittens. Same idea in AnimatedRenderable.Draw and StaticMeshRenderable.Draw postfixes; reflection reads the protected MaterialIndices and ShadowIgnoreIndicies.
    related: [hide-a-kitten-from-its-own-first-person-view, give-mod-objects-a-private-material-buffer]
    borrowed_from: [mods/ksastructures/features/first-person-body-hiding-and-shadow]

  # ------------------------------------------------------------------ cursor, projection, camera-relative frames
  - slug: place-points-under-the-cursor-on-a-construction-plane
    title: Turn the cursor into a world point on a camera-facing or ecliptic plane
    summary: Unproject the cursor with Camera.ScreenToEgoRay, lift the ray origin to ecliptic space (not assumed to be the camera, for orthographic views), intersect it with a plane through a reference point and store the hit relative to a body so it keeps riding with it.
    game_types: [KSA.Camera, KSA.GameViewport, KSA.MathEx, KSA.Cursor, KSA.Astronomical, KSA.VehicleEditingSpace]
    engine_pointers:
      - current/decomp/KSA/Camera.cs ScreenToEgoRay, EgoToEcl, EclToScreen, EgoToScreen, GetForwardEcl
      - current/decomp/KSA/Cursor.cs GetPosition, GetEgoRay
      - current/decomp/KSA/MathEx.cs RayPlaneIntersection
    lifecycle: [frame:input, frame:draw-ui]
    approaches:
      - n: 1
        title: ScreenToEgoRay, ray origin lifted by EgoToEcl, MathEx.RayPlaneIntersection, stored as a CCE offset
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/cursor-unprojection-and-construction-plane]
        technique: screen-to-world-ray
        note: The ecliptic normal is ECL +Z, checked in game, not Camera.UpView; a plane through the previous point shares one depth for all points of a measurement; behind-camera hits (t <= 0) are rejected; the preview runs after the camera updates, the click in the OnMouseButton prefix.
    related: [cursor-to-world-ray, project-world-to-screen, raycast-terrain-from-the-cursor, swallow-game-input-while-a-tool-is-active, work-in-the-cameras-ego-frame]
    borrowed_from: []

  - slug: work-in-the-cameras-ego-frame
    title: Work in the camera's own ego frame, per viewport
    summary: Ego is ecliptic minus the camera position with the same axes, but every viewport has its own camera and its own draw positions, so a point is only consistent against the camera that sampled it. Covers EgoToEcl as a pure translation, camera-centred directions for sky drawing and view-space (camera-fixed) placement.
    game_types: [KSA.Camera, KSA.Vehicle, KSA.IGameViewport, KSA.Transform3D]
    engine_pointers:
      - current/decomp/KSA/Camera.cs GetPositionEgo, EgoToEcl, EclToEgo, Ego2View, GetFieldOfView
      - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
      - references/KSACars/docs/KSA-CAMERAS.md section 3 and the reference-frame discussion
    lifecycle: [frame:draw-ui, frame:viewports, frame:render]
    approaches:
      - n: 1
        title: Ego axes are ECL axes; lift the ray origin, keep directions
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/cursor-unprojection-and-construction-plane]
        technique: screen-to-world-ray
        note: EgoToEcl is posEgo + PositionEcl, so a ray direction can be used unchanged in ecliptic space.
      - n: 2
        title: Position as this window's camera draws it, not the analytic position
        mod: ksarmory
        features: [mods/ksarmory/features/director-camera-window]
        technique: direct-camera-write
        note: A camera following a craft draws its physics-bubble neighbours at their physics positions; one following nothing draws every craft at its analytic position (Camera.GetPositionEgo). They differ by metres, which is shake at high zoom.
      - n: 3
        title: Direction times a camera-centred sphere radius
        mod: ohmystars
        features: [mods/ohmystars/features/sky-overlay-lines-and-labels]
        technique: imgui-drawlist
        note: Borrowed from rendering. Sky directions are placed on a sphere around the camera (radius 19.5 for stars), so parallax does not matter.
      - n: 4
        title: View-space billboard pinned to the camera
        mod: purrtty
        features: [mods/purrtty/features/anchor-quad-to-part-or-camera]
        technique: vulkan-pipeline
        note: Borrowed from rendering. A view-space model matrix times the projection pins content to the screen; the other mode uses ego-space part transforms.
    related: [understand-ksa-coordinate-frames, choose-ecl-or-ego-positions-for-rendering, draw-lines-on-the-sky, project-world-to-screen, place-points-under-the-cursor-on-a-construction-plane, paint-overlays-on-secondary-and-detached-viewports]
    borrowed_from: [mods/ohmystars/features/sky-overlay-lines-and-labels, mods/purrtty/features/anchor-quad-to-part-or-camera]

  - slug: hold-a-composed-camera-shot-for-screenshots
    title: Hold a composed camera shot, then take the screenshot
    summary: For automated visual checks, hold the main view at a scripted pose (offset from a craft or body, aimed at a target, at a chosen FOV) through the camera-owner machinery, wait for the pose and warm-up frames to settle, then ask ScreenshotCapture for the frame and record where the subject sits on screen.
    game_types: [KSA.ScreenshotCapture, KSA.Program, KSA.Camera, KSA.FixedController]
    engine_pointers:
      - current/decomp/KSA/ScreenshotCapture.cs Request (scale, flags such as ui, hud, warm), DEFAULT_WARMUP_FRAMES
      - "current/decomp/KSA/Program.cs _screenshotCapture"
      - current/decomp/KSA/Camera.cs EgoToClipDouble
    lifecycle: [frame:after-on-frame, frame:viewports, frame:post-render]
    approaches:
      - n: 1
        title: SceneCamera composed shots, 24-frame countdown, manifest with the craft's projected screen position
        mod: ksagolf
        features: [mods/ksagolf/features/visual-testing-captures]
        technique: reflection
        note: Borrowed from testing-and-tooling. The manifest is written when the countdown ends so it describes the captured instant; craft_screen comes from camera.EgoToClipDouble.
      - n: 2
        title: SceneCamera shot relative to the craft or office, held by the dev bridge
        mod: ksastructures
        features: [mods/ksastructures/features/dev-file-bridge-and-mcp]
        technique: reflection
        note: Borrowed from testing-and-tooling. The bridge's camera command holds a composed shot driven each step through the same view-pose seam.
      - n: 3
        title: Bridge IViewPose holding the main view, optionally orbiting on player time
        mod: ksarmory
        features: [mods/ksarmory/features/file-command-bridge-and-mcp]
        technique: view-claim-ladder
        note: Borrowed from testing-and-tooling. DriveCamera runs in claim order beside the mod's other owners and hands the original view back afterwards.
    related: [capture-rendered-frames, take-screenshots-from-code, borrow-the-main-camera-and-hand-it-back, arbitrate-camera-ownership-between-features]
    borrowed_from: [mods/ksagolf/features/visual-testing-captures, mods/ksastructures/features/dev-file-bridge-and-mcp, mods/ksarmory/features/file-command-bridge-and-mcp]
