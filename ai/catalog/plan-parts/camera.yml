  - slug: blend-and-ease-camera-transitions
    title: Blend the camera in and out smoothly and ease it at a steady pace
    summary: Cut-free transitions between the player's pose and a scripted one, smoothstep the eye and lerp the look target, and drive cosmetic eases from a smoothed step so uneven frame pacing and pauses do not stutter the camera.
