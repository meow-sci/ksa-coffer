        technique: camera-arbitration
        note: ChaseView.Blend and SmoothedStep (exponential average of the sim step, a paused step returns 0) are headless-tested; at the pinned ref only the hand-back, StableUp and ChaseOrbit constants are wired in game.
      - n: 2
