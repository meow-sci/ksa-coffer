    summary: Pose a secondary (or the main) camera from a sub-part's transform so it rides a nose, mast or turret, including scaled and articulated parts, and keep the mount alive across staging.
    game_types: [KSA.Part, KSA.Vehicle, KSA.Camera, KSA.IGameViewport, KSA.FixedController]
