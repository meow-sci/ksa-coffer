  # ------------------------------------------------------------------ secondary viewports
  - slug: borrow-a-secondary-viewport
    title: Lease one of KSA's spare viewports for a mod camera
    summary: KSA builds its viewports once at boot and seals the registry; mods get the four secondary camera windows. Claim one, reconfigure it after every claim, track whether the player closed it and release it.
    game_types: [KSA.ViewportRegistry, KSA.IGameViewport, KSA.IViewportOwner, KSA.GameViewport, KSA.ViewportBase, KSA.ViewportPresets, KSA.ViewportType, KSA.DockingPort]
    engine_pointers:
      - current/decomp/KSA/ViewportRegistry.cs TryOpenSecondaryViewport, TryClaimSecondaryViewport, TryGetOwned, ReleaseSecondaryViewport, AvailableSecondaryCount, GameViews
      - current/decomp/KSA/GameViewport.cs ResetToDefaults, DrawImGui
      - current/decomp/KSA/DockingPort.cs (shares the same pool)
    lifecycle: [frame:draw-ui, frame:celestials, frame:viewports, event:save, event:load]
    approaches:
      - n: 1
        title: TryOpenSecondaryViewport, make visible, re-resolve the index by reference every frame
        mod: ksarmory
        features:
          - mods/ksarmory/features/director-camera-window
          - mods/ksastructures/features/computer-flies-nearest-craft
        technique: viewport-lease
        note: Disable the control when AvailableSecondaryCount is zero, hand back with ReleaseSecondaryViewport (which resets Orbit mode, offsets, flags and name), and put the FOV back to 50 because the player's zoom clamps at 15.
      - n: 2
        title: TryClaimSecondaryViewport with an IViewportOwner per camera, TryGetOwned every update
        mod: unscience
        features: [mods/unscience/features/hot-pursuit-part-mounted-cameras]
        technique: viewport-lease
        note: The registry keys ownership by reference and allows one viewport per owner, so each camera gets its own owner object; a claim runs ResetToDefaults, so everything is re-applied; closing the stock window releases the lease and the entry shows Reopen; restores reclaim slots on load.
    related: [aim-a-secondary-viewport-camera, give-a-secondary-camera-its-nearby-body, show-a-secondary-camera-in-your-own-window, mount-a-camera-on-a-part, paint-overlays-on-secondary-and-detached-viewports, put-a-live-screen-on-a-part, take-control-of-another-vehicle]
