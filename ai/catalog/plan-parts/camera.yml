category: camera
description: Camera modes and their controllers, replacing or borrowing the main view, secondary viewports and part-mounted cameras, first-person kitten views, cinematic camera animation, IVA, field of view, and the camera-side maths for cursor rays and camera-relative frames.
topics:
  # ------------------------------------------------------------------ engine background and reading the camera
  - slug: understand-camera-modes-and-controllers
    title: Understand KSA camera modes, controllers and the viewport frame order
    summary: Background for every camera mod. Each GameViewport owns an Orbit, Free, Map, IVA and Fixed controller; OnFrameViewports calls controller.OnFrame and then Camera.OnFrame for every viewport, so a write made anywhere else lands one frame late. Covers which mode changes are immediate, what Fixed requires, and which Camera members the engine reads back.
    game_types: [KSA.Program, KSA.GameViewport, KSA.ViewportBase, KSA.Controller, KSA.Camera, KSA.CameraMode, KSA.FixedController, KSA.OrbitController, KSA.FlyController, KSA.IVAController, KSA.MapController]
    engine_pointers:
      - current/decomp/KSA/Program.cs OnFrameViewports, OnFrameController, GetMainCamera, GetCameraMode, FrameViewport
      - current/decomp/KSA/GameViewport.cs OnFrame, GetActiveController, SetCameraMode, NextCameraMode
      - current/decomp/KSA/Camera.cs OnFrame, ClampCamera, SetFollow, ChangeFieldOfView
      - current/decomp/KSA/FixedController.cs OnFrame
      - "references/KSArmory/docs/KSA-CAMERAS.md, references/KSAGolf/docs/KSA-CAMERAS.md and references/KSACars/docs/KSA-CAMERAS.md (one analysis, three near-identical copies; its citations predate build 5400 so re-check every line against current/decomp)"
    lifecycle: [frame:viewports, frame:controller, frame:input]
    approaches:
      - n: 1
        title: The decompiled frame order, per-mode behaviour and crash inventory in the KSA-CAMERAS analysis
        mod: ksagolf
        features:
          - mods/ksagolf/features/level-horizon-camera-controller
          - mods/ksarmory/features/chase-camera-on-a-round
        technique: starmap-lifecycle
        note: Both feature pages show the rules in use. Cover the one-controller-per-mode layout, the order controller.OnFrame then Camera.OnFrame then the StarMap GUI hooks (a hook write is rendered a frame late), that SetCameraMode changes the field at once but the pose only moves on the next OnFrame, that the player's mode key cannot leave Fixed, and that a bogus Mode value throws every frame. Mark the doc's viewport sections as stale after 5400 (Viewport class replaced by IViewport, ViewportBase and ViewportRegistry).
    related: [replace-a-viewport-camera-controller, write-the-camera-pose-in-phase-with-the-frame, drive-the-main-camera-in-fixed-mode, read-the-main-camera-pose-and-mode, understand-ksa-coordinate-frames, borrow-a-secondary-viewport]
    borrowed_from: []

  - slug: read-the-main-camera-pose-and-mode
    title: Read the main camera and tell it from other viewports' cameras
    summary: Program.GetMainCamera returns the map camera while the main viewport is in Map mode, GetCameraMode answers for the frame viewport, and Harmony patches on Camera methods fire for every viewport's camera. Choose the right camera object and scope a patch to the main view only.
    game_types: [KSA.Program, KSA.Camera, KSA.ViewportRegistry, KSA.GameViewport, KSA.IGameViewport]
    engine_pointers:
      - current/decomp/KSA/Program.cs GetMainCamera, GetHoveredCamera, GetRenderCamera, GetCamera, GetCameraMode, MainViewport, FrameViewport
      - current/decomp/KSA/GameViewport.cs GetCamera (map camera in Map mode)
    lifecycle: [frame:viewports, frame:draw-ui, frame:render]
    approaches:
      - n: 1
        title: MainViewport.BaseCamera when the scene camera is wanted even in map mode
        mod: ksarmory
        features: [mods/ksarmory/features/burst-flash-and-view-shake]
        technique: reflection
        note: Borrowed from the shaders category. GetMainCamera() is MainViewport.GetCamera(), which is the map camera in Map mode, so a view effect that needs the scene camera reads BaseCamera.
      - n: 2
        title: Gate Camera patches on the camera being the main viewport's
        mod: unscience
        features: [mods/unscience/features/glass-fov-override]
        technique: harmony-prefix
        note: The FOV prefixes on Camera.ChangeFieldOfView and UpdateProjection run for every viewport's camera, so they test that the instance is the main one before writing.
      - n: 3
        title: Run per-frame work from a prefix on the main viewport's GameViewport.OnFrame only
        mod: gatos
        features: [mods/gatos/features/programmable-camera-director]
        technique: harmony-prefix
        note: The sampler, command drain and camera driver hang off a prefix filtered to the main viewport, and a postfix publishes the final clamped transform.
    related: [override-the-camera-field-of-view, give-a-mod-shader-the-camera-pose-and-global-data, understand-camera-modes-and-controllers, draw-a-fullscreen-click-through-overlay]
    borrowed_from: [mods/ksarmory/features/burst-flash-and-view-shake]

  # ------------------------------------------------------------------ taking over the camera
  - slug: replace-a-viewport-camera-controller
    title: Replace a viewport's camera controller with your own subclass
    summary: GameViewport.FixedController and IvaController are get-only for mods, so installing a FixedController or IVAController subclass needs reflection. Write the auto-property backing field, or call the protected setter once, verify it took, fall back safely and restore the stock controller on unload.
    game_types: [KSA.GameViewport, KSA.ViewportBase, KSA.FixedController, KSA.IVAController, KSA.Controller]
    engine_pointers:
      - "current/decomp/KSA/GameViewport.cs FlyController, OrbitController, MapController, IvaController, FixedController (all { get; protected set; })"
      - current/decomp/KSA/ViewportBase.cs Mode
    lifecycle: [frame:viewports, startup:all-mods-loaded]
    approaches:
      - n: 1
        title: Write the FixedController auto-property backing field, check, fall back, restore on unload
        mod: ksagolf
        features:
          - mods/ksagolf/features/level-horizon-camera-controller
          - mods/ksastructures/features/level-horizon-camera-controller
          - mods/ksarmory/features/chase-camera-on-a-round
        technique: reflection
        note: Three mods share the same pattern. The field is <FixedController>k__BackingField, read back after the write to confirm it, and the stock controller is put back from StarMapUnload.
      - n: 2
        title: Fetch the protected setters once with GetSetMethod(nonPublic true) and park the viewport in Fixed
        mod: gatos
        features: [mods/gatos/features/programmable-camera-director]
        technique: reflection
        note: ViewportSeam caches the FixedController and Mode setters, saves the stock controller and releases it afterwards. Also the general recipe for a protected-set property.
      - n: 3
        title: Typed open-instance delegate on the IvaController setter
        mod: unscience
        features: [mods/unscience/features/kitchen-sink-iva-camera-unlock]
        technique: reflection
        note: AccessTools.PropertySetter then CreateDelegate gives an Action<GameViewport, IVAController>; failed lookups unpatch everything and record the error.
    related: [write-the-camera-pose-in-phase-with-the-frame, unlock-the-iva-camera, take-input-through-a-camera-controller, access-private-members-with-reflection]
    borrowed_from: []

  - slug: write-the-camera-pose-in-phase-with-the-frame
    title: Write the camera pose inside the viewport pass so it has no frame of lag
    summary: StarMap's GUI hooks run after OnFrameViewports, so a pose set there is drawn a frame late and jitters against a moving target. Solve and write the pose where the engine's own controller writes it, immediately before Camera.OnFrame builds the matrices.
    game_types: [KSA.FixedController, KSA.GameViewport, KSA.Camera, KSA.IViewport]
    engine_pointers:
      - current/decomp/KSA/GameViewport.cs OnFrame (controller.OnFrame then Camera.OnFrame)
      - current/decomp/KSA/FixedController.cs OnFrame
      - current/decomp/KSA/Camera.cs OnFrame, ClampCamera
    lifecycle: [frame:viewports]
    approaches:
      - n: 1
        title: FixedController subclass that asks a pose source from inside OnFrame
        mod: ksagolf
        features:
          - mods/ksagolf/features/level-horizon-camera-controller
          - mods/ksastructures/features/level-horizon-camera-controller
          - mods/ksarmory/features/chase-camera-on-a-round
        technique: controller-subclass
        note: The mod calls its pose source (an IViewPose) from the overridden OnFrame, so the aim is computed with this frame's follow target and matrices. Hooks that only record intent run earlier from the GUI hook.
      - n: 2
        title: Offset against the followed object sampled in the same call, with sampler and publish on GameViewport.OnFrame
        mod: gatos
        features:
          - mods/gatos/features/programmable-camera-director
          - mods/gatos/features/synthetic-camera-follow-anchor
        technique: controller-subclass
        note: The controller reads following.GetPositionEcl() at that instant and writes PositionEcl and LocalRotation, the same two writes as stock; this removes the lag an earlier prefix-write design showed. Offsets from a followed object also keep precision at orbital speed.
      - n: 3
        title: Harmony prefix on FixedController.OnFrame scoped to the mod's own viewports
        mod: unscience
        features:
          - mods/unscience/features/hot-pursuit-part-mounted-cameras
          - mods/unscience/features/hot-pursuit-mesh-ray-placement
        technique: harmony-prefix
        note: No controller replacement; the prefix returns false only for viewports the mod leases and lets every other Fixed camera (docking, portraits) run stock. Also repeats ClampCamera so the next step sees the final position.
    related: [replace-a-viewport-camera-controller, pre-empt-a-stock-camera-controller-for-a-while, drive-the-main-camera-in-fixed-mode, mount-a-camera-on-a-part, understand-camera-modes-and-controllers, draw-ui-while-the-hud-is-hidden]
    borrowed_from: []

  - slug: pre-empt-a-stock-camera-controller-for-a-while
    title: Pre-empt the player's Orbit or Free controller while a script plays
    summary: Instead of swapping controllers, prefix OrbitController.OnFrame and FlyController.OnFrame, skip the stock math while an animation owns the camera and hand the live Camera to the animation player; when it finishes the stock controller continues from the pose left behind.
    game_types: [KSA.OrbitController, KSA.FlyController, KSA.Controller, KSA.Camera, KSA.Transform3D]
    engine_pointers:
      - current/decomp/KSA/OrbitController.cs OnFrame
      - current/decomp/KSA/FlyController.cs OnFrame
    lifecycle: [frame:viewports, frame:draw-ui]
    approaches:
      - n: 1
        title: Shared name-resolved prefix on both controllers' OnFrame
        mod: unscience
        features:
          - mods/unscience/features/camera-controller-override-camera-animations
        technique: harmony-prefix
        note: The patch is resolved by name so one patch class covers both controllers, only acts while a sequence plays, and returns false to replace that frame's stock camera math. Play, pause and stop come from an ImGui panel.
    related: [animate-the-player-camera-with-eased-moves, write-the-camera-pose-in-phase-with-the-frame, replace-a-viewport-camera-controller]
    borrowed_from: []

  - slug: drive-the-main-camera-in-fixed-mode
    title: Drive the main camera through Fixed mode without crashing it
    summary: Fixed mode is the mod camera mode, but it divides by zero on an unset or axis-aligned CameraRotation, needs a follow target (or none) to behave, has no player exit and an alert on entry. Set CameraRotation before the mode, keep it finite and park the viewport cleanly.
    game_types: [KSA.FixedController, KSA.GameViewport, KSA.ViewportBase, KSA.Camera, KSA.CameraMode]
    engine_pointers:
      - current/decomp/KSA/FixedController.cs OnFrame, OnSwitchOn, CameraOffset, CameraRotation
      - current/decomp/KSA/GameViewport.cs SetCameraMode, NextCameraMode
      - references/KSArmory/docs/KSA-CAMERAS.md section 4.5 and section 7 (crash inventory)
    lifecycle: [frame:viewports, frame:controller, frame:draw-ui]
    approaches:
      - n: 1
        title: Never enter Fixed with a zero or along-axis forward
        mod: ksagolf
        features: [mods/ksagolf/features/level-horizon-camera-controller]
        technique: reflection
        note: Set CameraRotation first, guard against a zero or along-up forward, and re-assert Fixed each step because the player's mode key cannot leave it.
      - n: 2
        title: Set CameraRotation before the mode, restore the previous mode explicitly
        mod: ksarmory
        features: [mods/ksarmory/features/borrow-main-view-camera]
        technique: state-record-and-restore
        note: Fixed has no player exit, so the borrower records the mode before the first write and is the only thing that can put it back.
      - n: 3
        title: Park through the Mode setter, suppress the entry alert, keep CameraRotation coherent
        mod: gatos
        features: [mods/gatos/features/programmable-camera-director]
        technique: controller-subclass
        note: The controller writes CameraOffset and CameraRotation after each pose so a fallback into base.OnFrame never sees a zero rotation; OnSwitchOn silences the Fixed Camera alert for its own park.
      - n: 4
        title: Unfollowed Fixed camera on a secondary viewport, where your LookAt is the pose
        mod: ksarmory
        features: [mods/ksarmory/features/director-camera-window]
        technique: direct-camera-write
        note: Unfollow(changeControl false) every frame, then Fixed; with nothing followed FixedController.OnFrame does nothing, so the camera pose the mod wrote stands.
    related: [replace-a-viewport-camera-controller, control-camera-roll-with-an-up-vector, borrow-the-main-camera-and-hand-it-back, understand-camera-modes-and-controllers]
    borrowed_from: []

  - slug: take-input-through-a-camera-controller
    title: Take mouse and keyboard input through a camera controller
    summary: A replacement controller receives KSA's camera input callbacks (OnKey, OnMouseButton, OnCursorPos, OnScroll, IsMouseDrag, GetCursorMode). Use them for right-drag look, orbit drag and wheel zoom that feel like stock without opening part windows or reacting to ImGui-owned clicks.
    game_types: [KSA.Controller, KSA.FixedController, KSA.IVAController, KSA.Program, Brutal.GlfwApi.GlfwCursorMode, Brutal.GlfwApi.GlfwMouseButton]
    engine_pointers:
      - current/decomp/KSA/Controller.cs IsMouseDrag, GetCursorMode, OnMouseButton, OnCursorPos, OnScroll
      - current/decomp/KSA/OrbitController.cs (drag rate, threshold and wheel step)
      - current/decomp/KSA/Program.cs OnMouseButton, OnFrameController
    lifecycle: [frame:input, frame:controller, frame:viewports]
    approaches:
      - n: 1
        title: Right-drag look with orbit-camera constants, IsMouseDrag to suppress part clicks
        mod: ksastructures
        features: [mods/ksastructures/features/level-horizon-camera-controller]
        technique: controller-subclass
        note: Override OnMouseButton, OnCursorPos, IsMouseDrag and GetCursorMode; the controller owns the right button while a look is active.
      - n: 2
        title: Orbit drag, swing and builder input, with ImGui-captured releases dropped
        mod: ksagolf
        features: [mods/ksagolf/features/level-horizon-camera-controller]
        technique: controller-subclass
        note: Releases that ImGui captured are discarded so a drag cannot stick, and the cursor mode is captured for the swing.
      - n: 3
        title: Match the orbit camera's drag feel (0.003 rad/px, 2 px threshold, x1.1 per wheel notch, ease back)
        mod: ksagolf
        features: [mods/ksagolf/features/borrowed-chase-camera]
        technique: camera-arbitration
        note: ChaseOrbit copies KSA's orbit-camera constants. At the pinned ref only the constants of this class are wired into the game, the rest is headless-tested; say so in the article.
      - n: 4
        title: Forward every callback to a private FlyController, blocking when another input owner is active
        mod: unscience
        features: [mods/unscience/features/kitchen-sink-iva-camera-unlock]
        technique: controller-subclass
        note: Movement is released when another viewport has input, a modal window or the console is open, or ImGui wants keyboard or text input.
    related: [block-game-hotkeys-while-typing, capture-mouse-for-gameplay, look-around-with-the-mouse-in-a-character-view, unlock-the-iva-camera]
    borrowed_from: []

  - slug: control-camera-roll-with-an-up-vector
    title: Keep the horizon level with an explicit camera up vector
    summary: The stock fixed controller derives up from the followed object and flips when that changes. Supply a carried, rate-limited up vector (or pass the local up to LookAt) so the camera never rolls unexpectedly while looking along the pole axis or following a body that tumbles.
    game_types: [KSA.FixedController, KSA.Camera, KSA.IFollowable, KSA.OrbitView]
    engine_pointers:
      - current/decomp/KSA/Camera.cs LookAt, LookAtRotation
      - current/decomp/KSA/FixedController.cs OnFrame
    lifecycle: [frame:viewports]
    approaches:
      - n: 1
        title: Carried, rate-limited StableUp with no switching threshold
        mod: ksagolf
        features:
          - mods/ksagolf/features/level-horizon-camera-controller
          - mods/ksastructures/features/level-horizon-camera-controller
          - mods/ksagolf/features/borrowed-chase-camera
        technique: controller-subclass
        note: The pure StableUp class (also in the chase view) carries the previous up forward and rotates it toward the new one at a bounded rate, so no hard switch happens near vertical.
      - n: 2
        title: Controller adds an up vector the stock FixedController does not have
        mod: ksarmory
        features: [mods/ksarmory/features/chase-camera-on-a-round]
        technique: controller-subclass
        note: Stock FixedController takes up from the followed object type, which is wrong for a mod-simulated body; the subclass solves up and aim together.
      - n: 3
        title: LookAt with the platform's local up on an unfollowed secondary camera
        mod: ksarmory
        features: [mods/ksarmory/features/director-camera-window]
        technique: direct-camera-write
        note: The head's boresight (local up at the platform) is the up argument, so the horizon sits level.
    related: [drive-the-main-camera-in-fixed-mode, chase-a-fast-body-with-the-main-camera, aim-a-secondary-viewport-camera]
    borrowed_from: []

  # ------------------------------------------------------------------ following, borrowing and arbitration
  - slug: follow-a-point-that-is-not-a-vehicle
    title: Make the camera follow a point or a mod-simulated object
    summary: Camera.Following takes any IFollowable. Implement it so it re-resolves its position on every call, answers a stable OrbitView and a non-zero MeanRadius, and the stock camera follows a vessel part, a held point or a mod-simulated body without registering anything.
    game_types: [KSA.IFollowable, KSA.Camera, KSA.OrbitView, KSA.WreckageMarker, KSA.OrbitController, KSA.FixedController, KSA.CameraReferenceFrame]
    engine_pointers:
      - current/decomp/KSA/IFollowable.cs
      - current/decomp/KSA/Camera.cs Following, PositionEcl, PositionCce, SetFollow
      - current/decomp/KSA/WreckageMarker.cs (engine's own non-vehicle IFollowable)
      - references/KSArmory/docs/KSA-CAMERAS.md section 6 (requirements on a mod's IFollowable; a mod follow target does not survive a save load)
    lifecycle: [frame:viewports, frame:celestials]
    approaches:
      - n: 1
        title: Anchor that re-resolves a vessel, part, body or held point on each call
        mod: gatos
        features: [mods/gatos/features/synthetic-camera-follow-anchor]
        technique: custom-followable
        note: GetBodyFixed2Ecl is identity so offsets do not roll with a vessel, MeanRadius is 1 m because the engine divides by it, a vanished anchor keeps its last sample.
      - n: 2
        title: RoundFollowable reporting the drawn position of a mod-simulated round
        mod: ksarmory
        features: [mods/ksarmory/features/chase-camera-on-a-round]
        technique: custom-followable
        note: Reports the position the round is drawn at this frame, so the camera and the picture agree. Stock controllers dereference OrbitView without a null check, so supply one.
    related: [change-the-camera-follow-target-without-a-jump, chase-a-fast-body-with-the-main-camera, play-cinematic-camera-tracks]
    borrowed_from: []

  - slug: change-the-camera-follow-target-without-a-jump
    title: Change what the camera follows without a jump, an alert or a control change
    summary: Camera.SetFollow teleports the camera to 2.5 mean radii, raises an alert, and with its default changeControl true swaps Program.ControlledVehicle. Pass the flags that suppress both and restore the pose when the view must stay where it is.
    game_types: [KSA.Camera, KSA.Program, KSA.Vehicle, KSA.IFollowable]
    engine_pointers:
      - current/decomp/KSA/Camera.cs SetFollow, Unfollow
      - current/decomp/KSA/Program.cs ControlledVehicle
    lifecycle: [frame:viewports, frame:draw-ui]
    approaches:
      - n: 1
        title: SetFollow with changeControl false and alert false, then write the captured position back
        mod: gatos
        features: [mods/gatos/features/programmable-camera-director]
        technique: direct-camera-write
        note: The director captures the baseline, follows its own anchor and restores the position because SetFollow teleports.
      - n: 2
        title: TryFollowOnMainViewport that follows without taking control
        mod: ksarmory
        features: [mods/ksarmory/features/borrow-main-view-camera]
        technique: state-record-and-restore
        note: Follow and mode are separate halves of a borrowed view; following a non-Vehicle with changeControl true would null the controlled vehicle.
      - n: 3
        title: Re-apply follow after every viewport claim on a secondary camera
        mod: unscience
        features: [mods/unscience/features/hot-pursuit-part-mounted-cameras]
        technique: viewport-lease
        note: A claim resets the viewport to defaults so SetFollow(vehicle, tidalLocking true, changeControl false, alert false) is repeated after each claim.
    related: [follow-a-point-that-is-not-a-vehicle, borrow-the-main-camera-and-hand-it-back, take-control-of-another-vehicle]
    borrowed_from: []

  - slug: borrow-the-main-camera-and-hand-it-back
    title: Borrow the player's main camera and hand it back without trampling them
    summary: Record the follow target, camera mode and field of view before the first write, drive the view, then restore each half only if the player did not change it meanwhile. Covers save loads, hidden-HUD frames and the order the halves go back in.
    game_types: [KSA.Program, KSA.Camera, KSA.CameraMode, KSA.GameViewport, KSA.IFollowable, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/Camera.cs SetFollow, Following, SetFieldOfView, DeserializeSave
      - current/decomp/KSA/GameViewport.cs SetCameraMode
      - current/decomp/KSA/Program.cs OnGameLoaded, OnFrameCelestials
    lifecycle: [frame:draw-ui, frame:celestials, frame:viewports, event:save]
    approaches:
      - n: 1
        title: Record mode, follow and FOV; stand down when the player changes either half; restore halves separately
        mod: ksarmory
        features: [mods/ksarmory/features/borrow-main-view-camera]
        technique: state-record-and-restore
        note: Record before SetCameraMode or SetFollow, because a recording taken after describes the borrowed state. Stepped from the GUI hook, a hidden-HUD OnFrameCelestials prefix and an AfterOnFrame fallback; a save load is consumed from an OnGameLoaded postfix.
      - n: 2
        title: Hand-back that always returns FOV first and the follow only if it is still the borrower's
        mod: ksagolf
        features: [mods/ksagolf/features/borrowed-chase-camera]
        technique: state-record-and-restore
        note: KSA-free rules in Sim with a thin KsaWorld adapter; the FOV is returned unconditionally since the mod always changed it.
      - n: 3
        title: Record the main view before the first write when flying another craft or a first-person kitten
        mod: ksastructures
        features:
          - mods/ksastructures/features/computer-flies-nearest-craft
          - mods/ksastructures/features/first-person-kitten-view
        technique: state-record-and-restore
        note: Mode, FOV and follow are restored by Leave; the first-person view re-asserts Fixed every step it holds the view.
      - n: 4
        title: Capture baseline pose, follow, mode and tidal locking; blend back on release
        mod: gatos
        features: [mods/gatos/features/programmable-camera-director]
        technique: controller-subclass
        note: Release blends over camera_release_blend_s and then restores everything captured.
    related: [arbitrate-camera-ownership-between-features, change-the-camera-follow-target-without-a-jump, drive-the-main-camera-in-fixed-mode, take-control-of-another-vehicle, draw-ui-while-the-hud-is-hidden]
    borrowed_from: [mods/ksastructures/features/computer-flies-nearest-craft]

  - slug: arbitrate-camera-ownership-between-features
    title: Arbitrate which feature or mod may drive the camera
    summary: Several of a mod's features (sight, chase, bridge shot) and other mods all want the one main view. Use a ranked claim ladder so the loser yields without restoring over the winner, and detect when another writer has taken the controller, mode or follow target so you stand down rather than fight.
    game_types: [KSA.Camera, KSA.GameViewport, KSA.FixedController, KSA.CameraMode]
    engine_pointers:
      - current/decomp/KSA/GameViewport.cs FixedController, Mode
      - current/decomp/KSA/Camera.cs Following
    lifecycle: [frame:draw-ui, frame:viewports]
    approaches:
      - n: 1
        title: Pure ViewClaim ladder in the mod core, drivers called in claim order
        mod: ksarmory
        features:
          - mods/ksarmory/features/borrow-main-view-camera
          - mods/ksarmory/features/file-command-bridge-and-mcp
        technique: view-claim-ladder
        note: A claim loser yields instead of restoring; the dev bridge's held camera pose is just another claimant written in claim order.
      - n: 2
        title: StandDown, Yield, Hold, GiveBack and Take decisions
        mod: ksagolf
        features: [mods/ksagolf/features/borrowed-chase-camera]
        technique: camera-arbitration
        note: A headless-tested ViewClaim with mode and follow halves that decides each frame what to do with the view.
      - n: 3
        title: Detect a second writer and stand down
        mod: gatos
        features: [mods/gatos/features/programmable-camera-director]
        technique: controller-subclass
        note: Each frame checks it still owns the camera; if the controller faulted, another mod replaced the fixed controller, the mode changed or the follow changed, the director releases instead of fighting.
    related: [borrow-the-main-camera-and-hand-it-back, replace-a-viewport-camera-controller]
    borrowed_from: [mods/ksarmory/features/file-command-bridge-and-mcp]

  # ------------------------------------------------------------------ cinematic and scripted cameras
  - slug: play-cinematic-camera-tracks
    title: Play scripted cinematic camera tracks
    summary: Compose each frame's pose from keyframed tracks, manual overrides and a captured baseline, placed in one of several vessel, part or body reference frames, with splines, easing and roll and FOV channels, driven through an in-phase controller.
