    related: [define-and-animate-subparts]
    borrowed_from: [mods/ksarmory/features/rounds-as-hidden-launcher-subparts]

  - slug: read-part-mesh-geometry
    title: Read a part's mesh geometry at runtime
    summary: Get triangle positions from a part's shared mesh, derive feature edges and fit rim circles, cache per shared mesh asset, and optionally clone an interleaved mesh into a standalone mesh for another renderer.
    game_types: [KSA.MeshReference, KSA.PartModel, KSA.MeshViewModule]
    engine_pointers:
      - current/decomp/KSA/MeshReference.cs
      - current/decomp/KSA/PartModel.cs
    lifecycle: [frame:input, frame:draw-ui, frame:prepare, render:scene-opaque]
    approaches:
      - n: 1
        title: MeshView positions, weld, dihedral edges, Kasa circle fit
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/mesh-feature-edges-and-circle-fitting, mods/ksa-measuretools/features/circle-and-face-angle-tools]
        technique: mesh-analysis
        note: Index-unrolled positions of primitive 0; MeshReference.Get returns one instance shared by all parts of a type, so cache per asset.
      - n: 2
        title: Clone an interleaved mesh into a Simple mesh
        mod: unscience
        features: [mods/unscience/features/rocky-mcrock-face-interleaved-mesh-clone]
        technique: vulkan-buffer
        note: SimpleVkMesh from HostPrimitives, for renderers that cannot draw interleaved meshes.
    related: [raycast-against-part-meshes, get-part-points-in-vehicle-and-world-frames]
    borrowed_from: [mods/unscience/features/rocky-mcrock-face-interleaved-mesh-clone]

  - slug: raycast-against-part-meshes
    title: Ray cast against a craft's part meshes
    summary: Cast a ray at a vehicle's real hull with Part.RayCastEgo, either from the mouse cursor (pick hull points, attach nodes, part centres) or from an arbitrary ego origin with no camera (shell hits, travel sweeps, swept contact), staying in a local metres frame.
    game_types: [KSA.Part, KSA.Vehicle, KSA.ViewportPartPicker, KSA.Cursor]
    engine_pointers:
      - current/decomp/KSA/Part.cs RayCastEgo
      - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
      - current/decomp/KSA/Universe.cs OnDrawUi ViewportPartPicker
    lifecycle: [frame:input, frame:draw-ui, frame:celestials, frame:after-on-frame]
    approaches:
      - n: 1
        title: Cursor ray against every vehicle, plus the stock hover picker
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/part-mesh-raycast-picking, mods/unscience/features/hot-pursuit-mesh-ray-placement]
        technique: mesh-raycast
        note: GetMatrixAsmb2Ego plus RayCastEgo returns subpart, local hit point and vertex; reuse ViewportPartPicker.
      - n: 2
        title: Camera-less ray from a caller-chosen origin (hit test and swept contact)
        mod: ksarmory
        features: [mods/ksarmory/features/hull-triangle-hit-test, mods/ksagolf/features/swept-hull-contact]
        technique: engine-raycast
        note: Sphere broad phase, then watertight per-triangle cast with the separation as ego origin.
      - n: 3
        title: Frame-budgeted sweeps of the craft's own geometry for actuator travel limits
        mod: ksarmory
        features: [mods/ksarmory/features/self-collision-travel-map]
        technique: coarse-to-fine-sampling
        note: Coarse sweep refined only where the answer changes.
    related: [pick-a-vehicle-under-the-cursor, read-part-mesh-geometry, define-and-animate-subparts]
    borrowed_from: [mods/ksarmory/features/hull-triangle-hit-test, mods/ksagolf/features/swept-hull-contact, mods/unscience/features/hot-pursuit-mesh-ray-placement]

  - slug: get-part-points-in-vehicle-and-world-frames
    title: Get attach nodes, nozzles and part-local points in vehicle, world and screen space
    summary: Convert part-local points to vehicle assembly, ECL/ego and screen coordinates without the render camera, locate connectors and engine nozzles, and split vectors along the vehicle's stack axis.
    game_types: [KSA.Part, KSA.PartConnectorInstance, KSA.Vehicle, KSA.EngineController]
    engine_pointers:
      - current/decomp/KSA/Part.cs MatrixAsmb2VehicleAsmb, Connector
      - current/decomp/KSA/Vehicle.cs Asmb2Ego, CenterOfMassAsmb, GetPositionEcl
    lifecycle: [frame:draw-ui, frame:input, frame:after-on-frame]
    approaches:
      - n: 1
        title: Connector.PositionEgo and PositionVehicleAsmb
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/part-mesh-raycast-picking]
        technique: screen-space-picking
        note: No part scale included.
      - n: 2
        title: Part-local to world through centre of mass and Asmb2Ego
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/part-anchor-rehoming]
        technique: frame-relative-anchors
        note: (posVehicleAsmb - CenterOfMassAsmb) rotated by Asmb2Ego about GetPositionEcl.
      - n: 3
        title: Nozzle LocationAsmb into vehicle space
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/engine-diagram-from-nozzle-positions]
        technique: part-tree-modules
        note: nozzle.LocationAsmb.Transform(float4x4.Pack(part.MatrixAsmb2VehicleAsmb)).
      - n: 4
        title: Stack axis from connectors and axial/radial components
        mod: ksa-measuretools
        features: [mods/ksa-measuretools/features/cad-style-snap-tiers]
        technique: screen-space-picking
        note: Stack connectors face part +X; asmb X is up; skip surface connectors.
    related: [read-part-mesh-geometry, raycast-against-part-meshes, anchor-to-parts-across-vehicle-changes]
    borrowed_from: []

  - slug: anchor-to-parts-across-vehicle-changes
    title: Keep an anchor on a part through staging, docking, editor changes and saves
    summary: Part objects move between vehicles on Split, MergeFrom and editor Dispose. Re-find the part by identity, by InstanceId plus vehicle id, or by a saved path plus topology hash.
    game_types: [KSA.Part, KSA.PartTree, KSA.Vehicle]
