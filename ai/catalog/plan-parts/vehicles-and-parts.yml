  # ---------------------------------------------------------------- subparts and geometry
  - slug: define-and-animate-subparts
    title: Define movable subparts and animate them from code
    summary: Export one SubPart per moving body recentred on its pivot, then write the parent-relative transform every frame (and reset cached matrices) for wheels, arms, turrets, mounts and gimbals. Covers chains XML cannot nest, rate limits and roll-nod pointing.
    game_types: [KSA.Part, KSA.SubPartTemplate, KSA.PartTree]
    engine_pointers:
      - current/decomp/KSA/Part.cs PositionParentAsmb, Asmb2ParentAsmb, ResetCachedPosMatrixValues
      - current/decomp/KSA/SubPartTemplate.cs
    lifecycle: [startup:asset-load, frame:draw-ui, frame:after-on-frame, frame:celestials, frame:viewports]
    approaches:
      - n: 1
        title: Pose wheels, arms and blades from StarMapAfterGui with a hidden-UI fallback
        mod: ksacars
        features: [mods/ksacars/features/pose-subparts-at-runtime, mods/ksacars/features/car-part-assets-glb-pbr]
        technique: starmap-lifecycle
        note: Author the subparts in the GLB/XML, then FrameLatch plus StarMapAfterOnFrame fallback; hiding a subpart.
      - n: 2
        title: Articulated turret mounts, rate-limited, with sibling chains
        mod: ksarmory
        features: [mods/ksarmory/features/articulated-mount-subparts]
        technique: subpart-transform-write
        note: Pods and arrays are siblings composed by the mod; latch on refusal.
      - n: 3
        title: Optical director heads with roll-nod gimbals
        mod: ksarmory
        features: [mods/ksarmory/features/optical-director-heads]
        technique: gimbal-geometry
        note: Roll about the centreline, nod within it, keyhole kept out of the command.
    related: [hide-show-and-fly-subparts-as-projectiles, raycast-against-part-meshes, evolve-a-shipped-part-without-breaking-saves]
    borrowed_from: [mods/ksacars/features/pose-subparts-at-runtime, mods/ksacars/features/car-part-assets-glb-pbr]

  - slug: hide-show-and-fly-subparts-as-projectiles
    title: Hide subparts and fly them as projectiles of their launcher
    summary: Pre-declare each store as a subpart, shrink it to nothing while unfired, then place it every frame at a mod-simulated position, using the right ecliptic/ego frames.
    game_types: [KSA.Part, KSA.PartTree]
    engine_pointers:
      - current/decomp/KSA/Part.cs Scale, PositionParentAsmb
    lifecycle: [startup:asset-load, frame:draw-ui, frame:celestials]
    approaches:
      - n: 1
        title: Scale-to-hide and parent-frame transform writes
        mod: ksarmory
        features: [mods/ksarmory/features/rounds-as-hidden-launcher-subparts]
