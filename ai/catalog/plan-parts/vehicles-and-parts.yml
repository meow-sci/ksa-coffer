category: vehicles-and-parts
description: Defining parts and whole craft, spawning and controlling vehicles at runtime, reading and driving part modules (engines, tanks, staging, RCS, parachutes), scaling, welding, picking and ray casting parts, and loading part mods into a running game.
topics:
  # ---------------------------------------------------------------- defining parts and craft
  - slug: define-a-part-with-game-data
    title: Define a part's game data (mass, colliders, connectors, editor tags, thrusters)
    summary: Split a new part into an Assets bundle (art, subparts) and a GameData bundle (mass shape, colliders, connectors, editor tags, optional real RCS thrusters, seats), list both in mod.toml, and know which XML elements the part templates accept. Includes how to add your own editor category and how to choose a mass template and colliders knowing terrain friction is fixed.
    game_types: [KSA.PartTemplate, KSA.PartGameDataReference, KSA.SubPartGameDataReference, KSA.EditorTagDefinition, KSA.ModLibrary]
    engine_pointers:
      - current/decomp/KSA/PartTemplate.cs
      - current/decomp/KSA/EditorTagDefinition.cs
      - current/Content/Core/CoreCommandAGameData.xml and CoreEditorTagsGameData.xml (stock GameData examples)
      - current/decomp/KSA/ModLibrary.cs AttachGameData
    lifecycle: [startup:asset-load]
    approaches:
      - n: 1
        title: One part per car with colliders, mass shape and a custom editor category
        mod: ksacars
        features: [mods/ksacars/features/car-part-gamedata]
        technique: xml-asset
        note: Whole-craft part with box and wheel colliders, MassShape choice for inertia, EditorTagDef for a new category, and the fixed 0.95 terrain friction for non-kitten pairs.
      - n: 2
        title: Inert weapon parts split into Assets and GameData with real RCS thrusters on subparts
        mod: ksarmory
        features: [mods/ksarmory/features/weapon-part-definitions-xml]
        technique: xml-asset
        note: Art and subparts in one bundle, mass, colliders, connectors, editor tags and subpart thrusters in another; no behaviour in XML because C# finds the part by Id.
      - n: 3
        title: Furniture parts as single-part craft with seat game data
        mod: ksastructures
        features: [mods/ksastructures/features/office-furniture-craft]
        technique: xml-asset
        note: Minimal GameData for a static prop part that doubles as a craft; pairs with the single-part craft and seats topics.
    related: [make-a-single-part-a-whole-craft, add-crew-seats-and-eva-doors, define-and-animate-subparts, evolve-a-shipped-part-without-breaking-saves]
    borrowed_from: [mods/ksarmory/features/weapon-part-definitions-xml, mods/ksacars/features/car-part-assets-glb-pbr]

  - slug: make-a-single-part-a-whole-craft
    title: Let a single part start and be a whole craft
    summary: Make a part launchable and placeable as a complete craft by putting it on the root-part whitelist, giving it a connector and a control module, and avoiding surface connectors, then ship it as a preset.
    game_types: [KSA.PartTemplate, KSA.VehicleEditor, KSA.EditorTagDefinition]
    engine_pointers:
      - current/decomp/KSA/VehicleEditor.cs RootPartWhitelist handling
      - current/decomp/KSA/EditorTagDefinition.cs
    lifecycle: [startup:asset-load]
    approaches:
      - n: 1
        title: RootPartWhitelist tag on a car part
        mod: ksacars
        features: [mods/ksacars/features/car-part-gamedata]
        technique: xml-asset
        note: RootPartWhitelist tag, at least one connector, no surface connectors, a Control module.
      - n: 2
        title: Furniture part as a one-part craft
        mod: ksastructures
        features: [mods/ksastructures/features/office-furniture-craft]
        technique: xml-asset
        note: Same rule applied to props that are never meant to be built upon.
    related: [define-a-part-with-game-data, ship-ready-made-craft, spawn-a-vehicle-at-runtime]
    borrowed_from: []

  - slug: add-crew-seats-and-eva-doors
    title: Add crew seats and EVA doors to a part
    summary: Declare IVASeat entries and EVADoor modules on mesh-less hidden subparts, pair them by SeatId, understand the eye offset and the 1 m boarding reach, and keep kittens in an open craft visible when another vehicle is the controlled one.
    game_types: [KSA.IVASeat, KSA.EVADoor, KSA.EVADoorTemplate, KSA.KittenEva, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/IVASeat.cs
      - current/decomp/KSA/EVADoor.cs
      - current/decomp/KSA/Vehicle.cs UpdateSeatedCrewRenderData
    lifecycle: [startup:asset-load, frame:render]
    approaches:
      - n: 1
        title: IVASeat in PartGameData plus EVADoor on a hidden subpart
        mod: ksacars
        features: [mods/ksacars/features/seats-and-eva-doors]
        technique: xml-asset
        note: Position is the eye point (model drawn 0.63 m lower); door SeatId names the seat.
      - n: 2
        title: Seat and door for furniture
        mod: ksastructures
        features: [mods/ksastructures/features/office-furniture-craft]
        technique: xml-asset
        note: Same schema on a chair part; shows the minimum viable seat and door.
      - n: 3
        title: Draw seated crew on craft that are not being flown
        mod: ksacars
        features: [mods/ksacars/features/seated-crew-of-unflown-craft]
        technique: harmony-postfix
        note: Postfix Vehicle.UpdateSeatedCrewRenderData so open-cockpit crew stays visible when control moves to a kitten.
    related: [define-a-part-with-game-data, spawn-an-eva-kitten-from-code, take-control-of-another-vehicle]
    borrowed_from: [mods/ksacars/features/seats-and-eva-doors, mods/ksacars/features/seated-crew-of-unflown-craft]

  - slug: ship-ready-made-craft
    title: Ship ready-made craft with a part mod (vehicle library presets)
    summary: Provide whole-vehicle presets as VehicleSaveData files so players find your craft in the stock or user vehicle library, and know where the user library lives.
    game_types: [KSA.VehicleSave, KSA.VehicleSaves, KSA.DefaultVehicleSaves]
    engine_pointers:
      - current/decomp/KSA/VehicleSaves.cs
      - current/decomp/KSA/DefaultVehicleSaves.cs
      - current/decomp/KSA/VehicleSave.cs
    lifecycle: [startup:asset-load]
    approaches:
      - n: 1
        title: VehicleSaveData preset files beside the mod
        mod: ksacars
        features: [mods/ksacars/features/vehicle-library-presets]
        technique: xml-asset
        note: Format of the saved craft, where the stock and user libraries are scanned from, and keeping part Ids stable.
    related: [load-a-craft-from-the-vehicle-library, make-a-single-part-a-whole-craft]
    borrowed_from: []

  - slug: evolve-a-shipped-part-without-breaking-saves
    title: Change a shipped part without breaking saves
    summary: Subparts are paired by position when a save loads, so removing or reordering them crashes old saves. Follow append-only subpart lists and fixed part Ids, and repair saves at startup when a mistake already shipped.
    game_types: [KSA.PartTree, KSA.PartTemplate, KSA.VehicleSave]
    engine_pointers:
      - current/decomp/KSA/PartTree.cs Deserialize (SubPartRefs paired by index)
    lifecycle: [startup:all-mods-loaded, startup:asset-load]
    approaches:
      - n: 1
        title: Append-only subpart lists and fixed part Ids
        mod: ksarmory
        features: [mods/ksarmory/features/weapon-part-definitions-xml]
        technique: xml-asset
        note: The authoring rule; derived from PartTree.Deserialize.
      - n: 2
        title: Rewrite saves and library craft at AllModsLoaded
        mod: ksarmory
        features: [mods/ksarmory/features/startup-save-repair]
        technique: regex-xml-surgery
        note: Trim surplus SubPartRefs from saves before any load is possible; offline twin script.
    related: [define-a-part-with-game-data, define-and-animate-subparts]
    borrowed_from: [mods/ksarmory/features/startup-save-repair]

  - slug: give-inert-parts-behaviour-by-part-id
    title: Give inert parts behaviour by recognising their part Id
    summary: Keep XML free of behaviour and let code discover parts on any craft by Id, using a data-driven registry of profiles, so other mods can add parts as data and dispenser or weapon kinds are decided by which part is fitted.
    game_types: [KSA.Part, KSA.PartTemplate, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/Part.cs template Id
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: Weapon registry keyed by part Id, with profiles in a game-free layer
        mod: ksarmory
        features: [mods/ksarmory/features/weapon-registry-and-profiles]
        technique: data-driven-registry
        note: Profiles live in Sim/, the game adapter finds parts per craft; also how packs from other mods feed the registry.
      - n: 2
        title: Dispenser kind decided by which part is fitted
        mod: ksarmory
        features: [mods/ksarmory/features/countermeasure-dispensers]
        technique: part-id-lookup
        note: Same pattern with a different consumer.
      - n: 3
        title: Registry fed from a folder in every installed mod
        mod: ksarmory
        features: [mods/ksarmory/features/weapon-packs-from-mod-folders]
        technique: convention-folder-scan
        note: Data-only add-on packs; strict reader and post-load audit.
    related: [track-and-classify-craft, define-a-part-with-game-data]
    borrowed_from: [mods/ksarmory/features/weapon-packs-from-mod-folders]

  - slug: track-and-classify-craft
    title: Track which craft carry your part and classify them (rosters, teams, IFF)
    summary: Build a per-frame roster of craft keyed by Vehicle reference rather than name, so a mod knows its own craft, who is allied, and when a craft is disposed or loses the part.
    game_types: [KSA.Vehicle, KSA.Universe, KSA.CelestialSystem]
    engine_pointers:
      - current/decomp/KSA/Universe.cs CurrentSystem.All enumeration
    lifecycle: [frame:draw-ui, frame:after-on-frame]
    approaches:
      - n: 1
        title: Per-frame sync of craft that carry the mod's part into a Vehicle-keyed dictionary
        mod: ksacars
        features: [mods/ksacars/features/frame-step-latch-and-car-registry]
        technique: starmap-lifecycle
        note: Enumerate every vehicle from any hook (Program.VehiclesInFrame is empty after PostRender); drop entries when disposed or the part leaves.
      - n: 2
        title: Teams, alliances and a reference-keyed roster declared each frame
        mod: ksarmory
        features: [mods/ksarmory/features/iff-teams-and-allegiance]
        technique: reference-keyed-dictionary
        note: Never parse allegiance from craft names; rules per team, roster rebuilt each step.
    related: [give-inert-parts-behaviour-by-part-id, keep-per-frame-work-running-with-hidden-ui]
    borrowed_from: [mods/ksacars/features/frame-step-latch-and-car-registry]

  # ---------------------------------------------------------------- spawning, teleporting, picking
  - slug: spawn-a-vehicle-at-runtime
    title: Spawn a vehicle from code
    summary: Create a Vehicle at runtime from a craft save, from a single hand-built part, or as an EVA kitten, register it with its celestial parent, and place it on the ground or in orbit.
    game_types: [KSA.Vehicle, KSA.Part, KSA.PartTree, KSA.VehicleSave, KSA.KittenEva, KSA.Orbit, KSA.CelestialSystem]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs CreateVehicle, TeleportToLocation
      - current/decomp/KSA/VehicleSave.cs Load
      - current/decomp/KSA/KittenEva.cs constructor
      - current/decomp/KSA/Orbit.cs CreateFromStateCci
    lifecycle: [frame:after-on-frame, frame:input, frame:draw-ui]
    approaches:
      - n: 1
        title: Parked copy of a library craft at a latitude and longitude
        mod: ksacars
        features: [mods/ksacars/features/spawn-parked-craft]
        technique: starmap-lifecycle
        note: VehicleSave.Load, CreateVehicle, parent.Children.Add, UpdatePerFrameData, then TeleportToLocation.
      - n: 2
        title: Test drones into orbit from a state vector
        mod: ksarmory
        features: [mods/ksarmory/features/spawn-and-teleport-test-craft]
        technique: vehicle-spawn
        note: Orbit.CreateFromStateCci after an Ecl-to-CCI rotation, KittenEva variant, ShapesRegistry lock.
      - n: 3
        title: A one-part vehicle built in code
        mod: ksastructures
        features: [mods/ksastructures/features/office-furniture-craft]
        technique: xml-asset
        note: new Part, CreateOwnTree, Vehicle.CreateVehicle, TeleportToLocation; no craft file needed.
      - n: 4
        title: Spawn an EVA kitten as a vehicle beside another craft
        mod: unscience
        features: [mods/unscience/features/doh-kitten-spawning]
        technique: reflection
        note: Replicates EVADoor.CreateKittenEva, backpack part with its own tree, orbit from the neighbour's state vectors.
    related: [create-or-dispose-vehicles-without-racing-the-solver, teleport-a-vehicle, load-a-craft-from-the-vehicle-library, keep-mod-vehicles-out-of-saves]
    borrowed_from: [mods/unscience/features/doh-kitten-spawning]

  - slug: load-a-craft-from-the-vehicle-library
    title: Load a craft from the stock or player vehicle library
    summary: Find a saved craft by name in the default or user library, refresh the library, and turn the VehicleSave into a live Vehicle.
    game_types: [KSA.VehicleSave, KSA.VehicleSaves, KSA.DefaultVehicleSaves]
    engine_pointers:
      - current/decomp/KSA/VehicleSaves.cs Refresh, AsSpan
      - current/decomp/KSA/DefaultVehicleSaves.cs FindSave
    lifecycle: [frame:after-on-frame]
    approaches:
      - n: 1
        title: DefaultVehicleSaves.FindSave then VehicleSave.Load
        mod: ksacars
        features: [mods/ksacars/features/spawn-parked-craft]
        technique: starmap-lifecycle
        note: Handles missing saves and library refresh timing.
    related: [spawn-a-vehicle-at-runtime, ship-ready-made-craft]
    borrowed_from: []

  - slug: create-or-dispose-vehicles-without-racing-the-solver
    title: Create, destroy and mutate vehicles without racing the vehicle solver
    summary: The physics worker may be stepping while a mod builds or destroys a vehicle. Take the shape-registry lock, or wait for the solver, before changing shapes, parts or vehicles, and clean up partially built vehicles.
    game_types: [KSA.ConstraintSim, KSA.JobSystems, KSA.Vehicle, KSA.PhysicsBubble, KSA.InputEvents]
    engine_pointers:
      - current/decomp/KSA/ConstraintSim.cs UnlockShapes / UnlockShapesBlocking
      - current/decomp/KSA/JobSystems.cs VehicleSolver.Wait
      - current/decomp/KSA/InputEvents.cs EvaSpawn staging
    lifecycle: [frame:apply-solvers, frame:after-on-frame, frame:dispatch-solvers, physics:vehicle-solver]
    approaches:
      - n: 1
        title: UnlockShapesBlocking around the build
        mod: ksacars
        features: [mods/ksacars/features/spawn-parked-craft, mods/ksarmory/features/spawn-and-teleport-test-craft]
        technique: shapes-registry-lock
        note: UnlockShapes throws during the step; UnlockShapesBlocking waits for EndVehicleUpdate.
      - n: 2
        title: Wait on JobSystems.VehicleSolver before mutating
        mod: unscience
        features: [mods/unscience/features/doh-kitten-spawning, mods/gatos/features/welds-vessel-anchoring]
        technique: job-barrier
        note: Either wait for the solver or stage the operation like InputEvents.EvaSpawn; recover from constructors that throw after registration.
      - n: 3
        title: Safe destruction from a frame hook
        mod: ksarmory
        features: [mods/ksarmory/features/safe-vehicle-destruction-and-part-failure]
        technique: job-barrier
        note: Wait for the solver, hold the shapes lock, then dispose; staged results must not land on a changed craft.
    related: [spawn-a-vehicle-at-runtime, destroy-vehicles-and-fail-parts-safely, write-state-where-the-vehicle-solver-sees-it]
    borrowed_from: [mods/ksarmory/features/safe-vehicle-destruction-and-part-failure]

  - slug: teleport-a-vehicle
    title: Teleport a vehicle to a surface point or into a new orbit
    summary: Move a craft to a latitude and longitude on a body, or hand it a new orbit and velocity, using the engine's queued teleport and orbit constructors from the correct window.
    game_types: [KSA.Vehicle, KSA.InputEvents, KSA.Orbit]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs TeleportToLocation, Teleport
      - current/decomp/KSA/InputEvents.cs TeleportInputData
      - current/decomp/KSA/Orbit.cs CreateFromStateCci
    lifecycle: [frame:prepare, frame:dispatch-solvers, frame:draw-ui]
    approaches:
      - n: 1
        title: Vehicle.TeleportToLocation (queues a teleport input event)
        mod: ksagolf
        features: [mods/ksagolf/features/craft-mover, mods/ksarmory/features/spawn-and-teleport-test-craft]
        technique: teleport-input-buffer
        note: Surface placement at a lat/lon; one action at a time.
      - n: 2
        title: Teleport with a freshly built orbit at the PrepareFrame handoff
        mod: unscience
        features: [mods/unscience/features/dent-wizard-vessel-launcher]
        technique: custom-physics
        note: Build the orbit from a state vector, Vehicle.Teleport at the physics handoff; target-relative velocity and camera-origin launch.
    related: [spawn-a-vehicle-at-runtime, pick-a-vehicle-under-the-cursor, weld-vehicles-together]
    borrowed_from: [mods/unscience/features/dent-wizard-vessel-launcher, mods/gatos/features/debug-cheats-teleport-refuel-warp]

  - slug: pick-a-vehicle-under-the-cursor
    title: Pick the vehicle under the mouse cursor
    summary: Project every craft to screen space and choose the nearest within a radius derived from apparent size, then place or move it where the cursor hits the ground.
    game_types: [KSA.Vehicle, KSA.Camera, KSA.Cursor]
    engine_pointers:
      - current/decomp/KSA/Camera.cs world to screen projection
    lifecycle: [frame:draw-ui, frame:input]
    approaches:
      - n: 1
        title: Screen-space projection with a size-based pick radius
        mod: ksagolf
        features: [mods/ksagolf/features/craft-mover, mods/ksacars/features/craft-mover-mouse-pick-place]
        technique: screen-space-picking
        note: Cheap, no mesh test; pair with the terrain height-field ray for placement.
    related: [raycast-against-part-meshes, teleport-a-vehicle]
    borrowed_from: [mods/ksacars/features/craft-mover-mouse-pick-place]

  - slug: keep-mod-vehicles-out-of-saves
    title: Keep mod-only vehicles out of save files
    summary: Filter your own craft out of the serialised universe so a save made with the mod loaded still opens without it.
    game_types: [KSA.Universe, KSA.CelestialSystemData]
    engine_pointers:
      - current/decomp/KSA/Universe.cs SerializeSystems
    lifecycle: [event:save]
    approaches:
      - n: 1
        title: Postfix Universe.SerializeSystems and filter CelestialSystemData.Vehicles
        mod: ksastructures
        features: [mods/ksastructures/features/office-furniture-craft]
        technique: save-filter
        note: Identify your craft by part Id, drop them from the serialised list only.
    related: [track-and-classify-craft, spawn-a-vehicle-at-runtime]
    borrowed_from: []

  # ---------------------------------------------------------------- controlling vehicles
  - slug: take-control-of-another-vehicle
    title: Fly one vehicle while the camera stays on another
    summary: Switch Program.ControlledVehicle, route keys to it, open a spare viewport for its view, and hand control back from a seated or EVA kitten.
    game_types: [KSA.Program, KSA.Vehicle, KSA.ViewportRegistry, KSA.KittenEva]
    engine_pointers:
      - current/decomp/KSA/Program.cs ControlledVehicle
      - current/decomp/KSA/ViewportRegistry.cs TryOpenSecondaryViewport
    lifecycle: [frame:draw-ui, frame:viewports, event:key]
    approaches:
      - n: 1
        title: Set ControlledVehicle and restore the main view afterwards
        mod: ksastructures
        features: [mods/ksastructures/features/computer-flies-nearest-craft]
        technique: viewport-borrow
        note: Record the main view before the first write; restore mode, FOV and follow when done.
    related: [autopilot-a-vehicle-from-a-mod, add-crew-seats-and-eva-doors]
    borrowed_from: []

  - slug: autopilot-a-vehicle-from-a-mod
    title: Autopilot any vehicle from a mod through its flight computer
    summary: Point a vehicle at an inertial direction, command throttle and pulse mode, and feed input actions while the player flies something else, keeping throttle alive while ImGui has the keyboard.
    game_types: [KSA.Vehicle, KSA.FlightComputer, KSA.ManualControlInputs]
    engine_pointers:
      - current/decomp/KSA/FlightComputer.cs
      - current/decomp/KSA/Vehicle.cs PrepareWorker
    lifecycle: [frame:dispatch-solvers, frame:draw-ui]
    approaches:
      - n: 1
        title: Custom attitude target and ProcessInput from a PrepareWorker prefix
        mod: ksarmory
        features: [mods/ksarmory/features/fly-another-vehicle, mods/ksarmory/features/prepareworker-prefix-command-window]
        technique: double-buffer-aware-writes
        note: EclBody frame with carried roll reference; queue from StarMap hooks, apply in the prefix.
    related: [write-state-where-the-vehicle-solver-sees-it, command-engines-throttle-and-rcs-from-code, take-control-of-another-vehicle]
    borrowed_from: [mods/ksarmory/features/prepareworker-prefix-command-window]

  - slug: write-state-where-the-vehicle-solver-sees-it
    title: Write vehicle and part state where the physics worker will read it
    summary: Mutate module state, mass, throttle or flight-computer fields at a point where the worker has not yet snapshotted the vehicle, or its result will overwrite or ignore your write.
    game_types: [KSA.Vehicle, KSA.Universe, KSA.PartTree, KSA.MoleState, KSA.FlightComputer]
    engine_pointers:
      - current/decomp/KSA/Universe.cs ExecuteNextVehicleSolvers
      - current/decomp/KSA/Vehicle.cs PrepareWorker, UpdateBulkStates
    lifecycle: [frame:dispatch-solvers, frame:apply-solvers]
    approaches:
      - n: 1
        title: Prefix Universe.ExecuteNextVehicleSolvers
        mod: unscience
        features: [mods/unscience/features/eternal-flame-resource-refill]
        technique: harmony-prefix
        note: Run once per frame immediately before the snapshot.
      - n: 2
        title: Prefix Vehicle.PrepareWorker (double-buffered fields)
        mod: ksarmory
        features: [mods/ksarmory/features/per-part-store-mass, mods/ksarmory/features/prepareworker-prefix-command-window]
        technique: prepareworker-window
        note: Per-vehicle window, known double-buffered state, Unsafe write of ref readonly Props.
      - n: 3
        title: Mole states are copy-on-write in the worker
        mod: ksarmory
        features: [mods/ksarmory/features/holed-tank-leaks]
        technique: module-state-write
        note: Write tank state in the window where UpdateBulkStates will not overwrite it.
    related: [refill-or-drain-resources, change-a-part-mass-at-runtime, autopilot-a-vehicle-from-a-mod]
    borrowed_from: [mods/ksarmory/features/prepareworker-prefix-command-window]

  # ---------------------------------------------------------------- resources and mass
  - slug: refill-or-drain-resources
    title: Refill, drain or top up a vehicle's propellant and batteries
    summary: Add or remove tank contents and battery charge from a mod, and keep mass properties and the flight computer coherent afterwards.
    game_types: [KSA.Vehicle, KSA.Tank, KSA.Mole, KSA.MoleState, KSA.Battery]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs RefillConsumables
      - current/decomp/KSA/Battery.cs Refill
      - current/decomp/KSA/Mole.cs ConsumeStored
    lifecycle: [frame:dispatch-solvers, frame:viewports]
    approaches:
      - n: 1
        title: Vehicle.RefillConsumables and Battery.Refill before the solver snapshot
        mod: unscience
        features: [mods/unscience/features/eternal-flame-resource-refill]
        technique: harmony-prefix
        note: Infinite fuel and charge on every vehicle.
      - n: 2
        title: One-shot refuel cheat in the solver window
        mod: gatos
        features: [mods/gatos/features/debug-cheats-teleport-refuel-warp]
        technique: command-queue
        note: Same calls triggered from a menu.
      - n: 3
        title: Drain a tank through its mole states and recompute mass
        mod: ksarmory
        features: [mods/ksarmory/features/holed-tank-leaks]
        technique: module-state-write
        note: Mole.ConsumeStored, the bookkeeping DepleteConsumables does, then Vehicle.Props and FlightComputer.ReadUpdatedVehicleConf.
    related: [write-state-where-the-vehicle-solver-sees-it, read-propellant-remaining]
    borrowed_from: [mods/gatos/features/debug-cheats-teleport-refuel-warp]

  - slug: change-a-part-mass-at-runtime
    title: Change a part's mass at runtime
    summary: Lighten or add to a single part (for example as stores leave a launcher) by writing the engine's per-part mass slot, derived from what is aboard, and refreshing the vehicle's mass properties.
    game_types: [KSA.Part, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/Part.cs mass fields
      - current/decomp/KSA/Vehicle.cs Props
    lifecycle: [frame:dispatch-solvers]
    approaches:
      - n: 1
        title: Write the mass in the PrepareWorker window, derived not subtracted
        mod: ksarmory
