category: kittens
description: "Characters and EVA kittens - reaching the avatar and skeleton, spawning and tracking kittens, per-kitten materials, animation clips and processors, posing, held props, seated crew, first-person views, locomotion facts and turning a kitten into a flyable vessel."
topics:
  # ------------------------------------------------------------------ foundations
  - slug: reach-a-kittens-avatar-and-skeleton
    title: Reach a kitten's avatar, skeleton and bones
    summary: "Get from a KittenEva to its CharacterAvatar, the animated character model, its Skeleton and named bones, and to the private renderable fields other kitten mods need, without breaking silently when a game update renames something."
    game_types: [KSA.KittenEva, KSA.KittenRenderable, KSA.CharacterAvatar, KSA.AnimatedRenderable, RenderCore.Animation.Skeleton]
    engine_pointers:
      - current/decomp/KSA/KittenEva.cs Renderable
      - current/decomp/KSA/KittenRenderable.cs _characterAvatar
      - current/decomp/KSA/CharacterAvatar.cs Core Attachments Animations Expressions Fur
      - current/decomp/KSA/AnimatedRenderable.cs Skeleton AnimProcessors
    lifecycle: [frame:draw-ui, frame:after-on-frame, frame:render]
    approaches:
      - n: 1
        title: One reflection hop to the private avatar field, bones resolved by name
        mod: ksagolf
        features: [mods/ksagolf/features/kitten-pose-processor, mods/ksastructures/features/first-person-body-hiding-and-shadow]
        technique: reflection
        note: "KittenEva.Renderable is public but KittenRenderable._characterAvatar is private. Keep a single AvatarOf helper so every feature breaks together; Skeleton.BoneNames.IndexOf gives the pose-span index, unknown names are reported and not thrown."
      - n: 2
        title: Cached FieldInfo reads of the private clip and processor fields with a visible unresolved list
        mod: unscience
        features: [mods/unscience/features/kitten-animations-clip-catalog]
        technique: reflection
        note: "Thirteen private clip fields, four blend samplers and four anim processors are read by name; any name that no longer resolves is recorded and shown in the UI so a game update degrades visibly instead of doing nothing."
      - n: 3
        title: Walk renderable struct fields down to the live MaterialIndices arrays
        mod: unscience
        features: [mods/unscience/features/doh-runtime-gpu-materials]
        technique: reflection
        note: "Core, Fur, Attachments, Helmet and Mmu are structs so each reflected read boxes a copy, but the final int[] is a reference to the live renderable array."
    related: [pose-kitten-bones-with-an-anim-processor, enumerate-kitten-animation-clips-and-processors, tint-kitten-materials, understand-how-kittens-are-rendered, contain-exceptions-in-starmap-hooks]
    borrowed_from: []

  - slug: understand-how-kittens-are-rendered
    title: Understand where and when kittens are animated and drawn
    summary: "Explains the per-viewport kitten render path: kittens are skipped by the vehicle part-instance upload and drawn from KittenEva.UpdateRenderData inside RenderGame and RenderViewport, the animation pipeline runs processors in list order, UpdateLocalPose once per frame and UpdateSkeleton once per view, and seated crew are drawn only for the controlled vehicle."
    game_types: [KSA.Program, KSA.KittenEva, KSA.KittenRenderable, KSA.AnimatedRenderable, KSA.IAnimProcessor, KSA.IVASeat, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame RenderViewport UpdateRenderingResources
      - current/decomp/KSA/KittenEva.cs UpdateRenderData
      - current/decomp/KSA/KittenRenderable.cs UpdateRenderData UpdateAnimationLod
      - current/decomp/KSA/AnimatedRenderable.cs UpdateAnimation Draw
      - current/decomp/KSA/Vehicle.cs UpdateSeatedCrewRenderData
    lifecycle: [frame:render, render:prepass, render:shadows]
    approaches:
      - n: 1
        title: Per-viewport kitten draw, animation order and what a patch can rely on
        mod: ksastructures
        features:
          - mods/ksastructures/features/first-person-body-hiding-and-shadow
          - mods/unscience/features/humble-arteest-kitten-visor-toggle
          - mods/ksacars/features/seated-crew-of-unflown-craft
          - mods/unscience/features/kitten-animations-forced-clip-playback
        technique: starmap-lifecycle
        note: "Engine explainer assembled from the lifecycle tables of four features: secondary viewports record before the main one, dt is zeroed after the first call in a frame, processors see ShouldUpdate and Priority, and the shadow pool is filled by Draw."
    related: [pose-kitten-bones-with-an-anim-processor, hide-a-kitten-body-from-one-viewport, draw-seated-crew-on-unflown-craft, keep-custom-kitten-animation-running-at-distance, render-kitten-equipment-in-the-right-order]
    borrowed_from: []

  - slug: kitten-locomotion-and-servo-reference
    title: Kitten locomotion, modes and the servo, from the decompiled game
    summary: "Reference for how a walking, floating or swimming kitten is simulated: the IsKitten flag on the worker snapshot, LocomotionMode and LocomotionState, KittenLocomotion.Advance and its per-mode steppers, the KittenServoPrecomp traction and upright gains that PoseIntegratorCallbacks applies, wake rules and the tuning struct copied to the worker."
    game_types: [KSA.KittenLocomotion, KSA.KittenServoPrecomp, KSA.LocomotionMode, KSA.LocomotionState, KSA.LocomotionFacts, KSA.LocomotionCommand, KSA.KittenLocomotionTuning, KSA.PhysicsBubble, KSA.VehicleUpdateState, KSA.PoseIntegratorCallbacks, KSA.KittenEva]
    engine_pointers:
      - current/decomp/KSA/LocomotionMode.cs (Mmu Grounded Airborne Tumbling Rightening Ladder Swimming)
      - current/decomp/KSA/KittenLocomotion.cs DeriveMode Advance StepGrounded StepMmu StepSwimming StepLadder
      - current/decomp/KSA/KittenServoPrecomp.cs Compute ComputeLadderFollow
      - current/decomp/KSA/PhysicsBubble.cs AdvanceKittenLocomotion KittenWantsWake
      - current/decomp/KSA/PoseIntegratorCallbacks.cs ServoOwnsAngularRate
      - current/decomp/KSA/VehicleUpdateState.cs IsKitten PrepareFromVehicle
      - current/decomp/KSA/KittenEva.cs PrepareWorker
    lifecycle: [frame:dispatch-solvers, physics:vehicle-solver, physics:bepu]
    approaches:
      - n: 1
        title: Where the kitten branches live and which of them mods have patched
        mod: unscience
        features:
          - mods/unscience/features/iron-man-kitten-rocket-flight
          - mods/unscience/features/kitten-animations-locomotion-tuning
          - mods/ksastructures/features/first-person-kitten-view
        technique: custom-physics
        note: "Worker code branches on VehicleUpdateState.IsKitten, not the CLR type (Iron Man flips it); KittenLocomotionTuning.Current is read on the main thread by PrepareWorker and by KittenRenderable; StepGrounded is the seam the first-person mods patch."
    related: [steer-a-walking-kitten, tune-kitten-locomotion-and-animation-parameters, treat-an-eva-kitten-as-a-rocket, let-kittens-stand-on-mod-geometry, write-worker-thread-safe-solver-patches]
    borrowed_from: []

  - slug: define-a-kitten-character-in-asset-xml
    title: Read and extend the character asset XML (characters, fur, expressions, attachments)
    summary: "Explains CharacterAssets.xml: a Character composes CharacterCore, CharacterTextures, CharacterFur, CharacterExpressions, ground and MMU animation sets, animation masks and helmet, visor, MMU and cosmetic attachments, and how the game lists, selects and renders the result. Engine-only; no reference mod declares a new Character."
    game_types: [KSA.CharacterReference, KSA.CharacterCoreReference, KSA.CharacterAttachmentReference, KSA.CharacterTexturesReference, KSA.CharacterFurReference, KSA.CharacterExpressionsReference, KSA.CharacterGroundAnimationsReference, KSA.ModLibrary, KSA.CharacterAvatar, KSA.KittenRosterData]
    engine_pointers:
      - current/Content/Core/CharacterAssets.xml
      - current/decomp/KSA/CharacterReference.cs (CosmeticAttachments element, OnDataLoad registration)
      - current/decomp/KSA/CharacterAvatar.cs CharacterAvatar(CharacterReference)
      - current/decomp/KSA/ModLibrary.cs AllCharacters
      - current/decomp/KSA/KittenRosterData.cs
    lifecycle: [startup:asset-load]
    approaches:
      - n: 1
        title: Compose a Character from the shared asset blocks
        mod: unscience
        features:
          - mods/unscience/features/doh-kitten-spawning
          - mods/unscience/features/kitten-animations-clip-catalog
          - mods/ksagolf/features/kitten-held-props
        technique: xml-asset
        note: "Evidence is engine XML plus three features that read the loaded result back: doh lists ModLibrary.AllCharacters by reflection, the clip catalog reads the ground animation set, KSAGolf deliberately avoids declaring a Character and uses a runtime CosmeticAttachment instead. The writer must ground every element in CharacterAssets.xml and CharacterReference; state clearly that a modded Character is untested by any reference mod."
    related: [spawn-an-eva-kitten-from-code, attach-a-prop-to-a-kitten-bone, make-a-kitten-pull-a-facial-expression, enumerate-kitten-animation-clips-and-processors, declare-post-processing-shader-assets-in-xml]
    borrowed_from: []

  # ------------------------------------------------------------------ spawning
  - slug: spawn-an-eva-kitten-from-code
    title: Spawn an EVA kitten from code
    summary: "Create a real KittenEva with a backpack part, a chosen or random character, an orbit and registration with its parent body, by replicating the private EVADoor.CreateKittenEva with the public eight-argument KittenEva constructor, and do it without racing the vehicle solver."
    game_types: [KSA.KittenEva, KSA.EVADoor, KSA.Part, KSA.PartTree, KSA.Tank, KSA.CharacterReference, KSA.ModLibrary, KSA.Orbit, KSA.CelestialSystem, KSA.JobSystems, KSA.InputEvents]
    engine_pointers:
      - current/decomp/KSA/EVADoor.cs CreateKittenEva
      - current/decomp/KSA/KittenEva.cs KittenEva(CelestialSystem, string, doubleQuat, double3, IParentBody, string, Part, Orbit)
      - current/decomp/KSA/InputEvents.cs EvaSpawnBuffer EvaSpawnData
      - current/decomp/KSA/ModLibrary.cs AllParts AllCharacters
    lifecycle: [frame:draw-ui, frame:input]
    approaches:
      - n: 1
        title: Replicate EVADoor.CreateKittenEva with the public KittenEva constructor
        mod: unscience
        features: [mods/unscience/features/doh-kitten-spawning]
        technique: reflection
        note: "Backpack Part looked up by reflection on ModLibrary.AllParts, CreateOwnTree because the Part ctor no longer creates a tree, tanks refilled, JobSystems.VehicleSolver.Wait before construction, Teleport, parent.Children.Add and UpdatePerFrameData. Include the try/catch cleanup of a vehicle whose constructor throws after registration and the character pick via reflected ModLibrary.AllCharacters."
      - n: 2
        title: Build a KittenEva from a saved craft that names a Character
        mod: ksarmory
        features: [mods/ksarmory/features/spawn-and-teleport-test-craft]
        technique: vehicle-spawn
        note: "A VehicleSave with a Character is created as KittenEva instead of Vehicle.CreateVehicle, matching VehicleTemplate; shows the ShapesRegistry lock handling around construction."
    related: [place-a-spawned-vessel-relative-to-another, track-select-and-despawn-spawned-kittens, create-or-dispose-vehicles-without-racing-the-solver, spawn-a-vehicle-at-runtime, define-a-kitten-character-in-asset-xml, add-crew-seats-and-eva-doors]
    borrowed_from: [mods/ksarmory/features/spawn-and-teleport-test-craft]

  - slug: place-a-spawned-vessel-relative-to-another
    title: Place a new vessel at a body-frame offset from another vessel
    summary: "Build the new vessel's orbit from one consistent StateVectors snapshot of a reference vessel (time, position and velocity read together), offset the position in the reference's body frame, copy attitude and rates, and chain several spawns by multiples of the offset; also the absolute alternative around a named parent body."
    game_types: [KSA.Vehicle, KSA.Orbit, KSA.StateVectors, KSA.IParentBody, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/Orbit.cs CreateFromStateCci StateVectors
      - current/decomp/KSA/Vehicle.cs GetAsmb2Cci Teleport
      - current/decomp/KSA/EVADoor.cs CreateKittenEva (uses stateVectors.StateTime)
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Offset in the neighbour's assembly frame from a single state-vector read
        mod: unscience
        features: [mods/unscience/features/doh-kitten-spawning]
        technique: vehicle-spawn
        note: "Pairing a position with a separately read clock shifts the spawn by velocity times the time difference; EVADoor itself uses stateVectors.StateTime. NaN body rates become zero. Absolute mode builds a temporary orbit at Universe.GetElapsedTime."
      - n: 2
        title: Test targets placed from an ecliptic state converted to CCI
        mod: ksarmory
        features: [mods/ksarmory/features/spawn-and-teleport-test-craft]
        technique: vehicle-spawn
        note: "Orbit.CreateFromStateCci after rotating an Ecl state into the parent's CCI frame."
    related: [spawn-an-eva-kitten-from-code, teleport-a-vessel-by-building-a-new-orbit, understand-ksa-coordinate-frames, sample-positions-at-a-consistent-epoch]
    borrowed_from: [mods/ksarmory/features/spawn-and-teleport-test-craft]

  - slug: track-select-and-despawn-spawned-kittens
    title: Track, select and despawn spawned kittens safely
    summary: "Keep a registry of the kittens a mod created (by object, with the id as a rename-proof key), prune the ones the game destroyed itself, despawn with Deregister and Dispose after the solver is idle, and hold picker selections as objects because LookupCollection.Deregister swap-removes."
    game_types: [KSA.KittenEva, KSA.CelestialSystem, KSA.LookupCollection, KSA.VehicleProvider, KSA.Vehicle, KSA.JobSystems]
    engine_pointers:
      - current/decomp/KSA/CelestialSystem.cs Deregister
      - current/decomp/KSA/LookupCollection.cs Deregister
      - current/decomp/KSA/Vehicle.cs Dispose IsDisposed
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Registry keyed by id that stores the Vehicle object, pruned every frame
        mod: unscience
        features: [mods/unscience/features/doh-kitten-spawning]
        technique: reflection
        note: "GetDisposed allocates only when something was disposed because it is polled each frame; despawn prefers the stored object over an id lookup; a vanished selection is cleared, never replaced by whatever now sits at that index; spawned-but-untinted problems are warnings."
    related: [spawn-an-eva-kitten-from-code, create-or-dispose-vehicles-without-racing-the-solver, track-and-classify-craft, persist-vessel-references-across-save-and-load]
    borrowed_from: []

  - slug: fire-an-eva-kitten-from-the-camera
