  - slug: hide-a-kitten-body-from-one-viewport
    title: Hide a kitten's body from the main view only
    summary: "Mark which viewport is being drawn in a KittenEva.UpdateRenderData prefix and collapse every bone to a point in an anim processor's UpdateSkeleton for that view alone; camera windows and crew portraits still show the whole kitten; the engine also has KittenRenderable.HideHead for the head."
    game_types: [KSA.KittenEva, KSA.KittenRenderable, KSA.AnimatedRenderable, KSA.IAnimProcessor, KSA.Program, RenderCore.Animation.Skeleton]
    engine_pointers:
      - current/decomp/KSA/KittenEva.cs UpdateRenderData
      - current/decomp/KSA/KittenRenderable.cs HideHead
      - current/decomp/KSA/AnimatedRenderable.cs HideMaskedMeshes UpdateAnimation
    lifecycle: [startup:all-mods-loaded, frame:render, render:prepass]
    approaches:
      - n: 1
        title: Fold all bones onto the head with zero-scale matrices
        mod: ksastructures
        features: [mods/ksastructures/features/first-person-body-hiding-and-shadow]
        technique: anim-processor
        note: "Copy WorldTransforms to BodyWorld before overwriting; the helmet and visor collapse because their matrix comes from GetBoneTransform; a try/catch in every hook leaves an unposed kitten, never a thrown frame."
      - n: 2
        title: Fold onto the wrist and keep the club-holding paw
        mod: ksagolf
        features: [mods/ksagolf/features/first-person-kitten-view]
        technique: anim-processor
        note: "Collapsing onto the chest stretched skin into sheets across the view; the wrist keeps the skin between the kept paw and the folded arm short; only the main view, only while carrying."
    related: [draw-a-different-skinned-pose-into-the-shadow-pass, look-through-a-kittens-eyes, pose-kitten-bones-with-an-anim-processor, understand-how-kittens-are-rendered]
    borrowed_from: [mods/ksagolf/features/first-person-kitten-view]

  - slug: draw-a-different-skinned-pose-into-the-shadow-pass
    title: Give the shadow pass a different skinned pose than the colour pass
    summary: "AnimatedRenderable.Draw appends ShadowRenderable entries using the current skin; after a view-specific edit, remove what Draw appended and add new entries skinned from a saved full pose with AllocateSkinningMatrices and the bone offset in InstanceData.data.y, then move the helmet and visor shadow matrices to the full-body head."
    game_types: [KSA.AnimatedRenderable, KSA.SuperMeshRenderSystem, KSA.ShadowRenderable, KSA.InstanceData, KSA.StaticMeshRenderable, KSA.MeshRenderTechnique]
    engine_pointers:
      - current/decomp/KSA/AnimatedRenderable.cs Draw ShadowIgnoreIndicies
      - current/decomp/KSA/SuperMeshRenderSystem.cs ShadowRenderablePool AllocateSkinningMatrices
      - current/decomp/KSA/ShadowRenderable.cs
    lifecycle: [render:shadows, render:prepass, frame:render]
    approaches:
      - n: 1
        title: Prefix remembers the pool length, postfix swaps the entries for a full-body skin
        mod: ksastructures
        features: [mods/ksastructures/features/first-person-body-hiding-and-shadow, mods/ksagolf/features/first-person-kitten-view]
        technique: harmony-postfix
        note: "Read InverseBindPose and ShadowIgnoreIndicies by reflection (NativeList type is in an unreferenced assembly); write inverseBind[i] times BodyWorld[i]; camera windows record first so the entries the main view leaves are what the shadow cascades read."
    related: [hide-a-kitten-body-from-one-viewport, add-invisible-shadow-casters, understand-how-kittens-are-rendered]
    borrowed_from: []

  # ------------------------------------------------------------------ mouse gameplay
  - slug: swing-a-tool-with-the-mouse-as-a-kitten
    title: Drive a kitten action with the mouse - capture, swing and strike
    summary: "Capture the cursor for a gameplay mode (disabled cursor, swallowed clicks, released on Alt or when a KSA window is open), accumulate raw mouse deltas during input polling, apply them in the step, smooth the rate over a short window, detect a strike geometrically, and use player time for the hand but simulated time for what it launches."
    game_types: [KSA.KittenEva, KSA.FixedController, KSA.Program, Brutal.ImGuiApi.ImGui, Brutal.GlfwApi.GlfwWindowAttribute]
    engine_pointers:
      - current/decomp/KSA/FixedController.cs OnCursorPos OnMouseButton
      - current/decomp/KSA/Program.cs PrepareFrame IsWindowOpen
    lifecycle: [frame:input, frame:viewports, frame:draw-ui, frame:render, frame:after-on-frame]
    approaches:
      - n: 1
        title: Cursor position handed from a replacement fixed controller to the session
        mod: ksagolf
        features: [mods/ksagolf/features/putting-session, mods/ksagolf/features/level-horizon-camera-controller]
        technique: mouse-capture
        note: "G and V read with ImGui.IsKeyPressed from the GUI pass; ignore the first jump after capture (over 400 px); pixels to angle 0.0035 rad with a clamp; strike needs forward motion, leading face crossing the ball and sole below its centre; the code means to release the mouse for open windows but the window test has no effect where asked (pitfall); scripted swings fed one entry per frame."
    related: [draw-a-kitten-displaced-without-moving-its-body, attach-a-prop-to-a-kitten-bone, swallow-game-input-while-a-tool-is-active, rebindable-hotkeys, choose-a-clock-under-time-warp, script-gameplay-through-a-command-bridge]
