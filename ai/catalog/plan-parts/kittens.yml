  - slug: show-an-eva-kitten-in-the-vehicle-editor
    title: Draw the kitten and frame the editor camera upright while editing it
    summary: "The editor draws only part geometry and assumes rocket-up framing; submit the kitten's KittenRenderable from a ClearBuckets postfix with dt zero and the editor's assembly-to-ego matrix, and change only the camera basis and the scroll handler so a feet-at-origin, -Z-up body appears upright."
    game_types: [KSA.VehicleEditor, KSA.VehicleEditingSpace, KSA.KittenRenderable, KSA.SuperMeshRenderSystem, KSA.OrbitController, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderEditor UpdateRenderingResources
      - current/decomp/KSA/SuperMeshRenderSystem.cs ClearBuckets
      - current/decomp/KSA/OrbitController.cs GetFrame2Ecl EditorOnScroll
      - current/decomp/KSA/KittenRenderable.cs HideHead
    lifecycle: [editor:render, editor:on-frame]
    approaches:
      - n: 1
        title: Draw the avatar from a postfix on ClearBuckets
        mod: unscience
        features: [mods/unscience/features/iron-man-kitten-vehicle-editing]
        technique: harmony-postfix
        note: "RenderEditor clears buckets then records the prepass, so the avatar must be submitted right after the clear; pass EditingSpace.GetMatrixAsmb2Ego unmodified because KittenEva.UpdateRenderData subtracts the centre of mass itself; force HideHead off for the call."
      - n: 2
        title: Re-base the orbit controller frame and rewrite the scroll pan axis
        mod: unscience
        features: [mods/unscience/features/iron-man-kitten-vehicle-editing]
        technique: harmony-transpiler
        note: "Postfix GetFrame2Ecl with AngleAxis(UnitX, pi) for the configured space; transpile EditorOnScroll so the two UnitX calls become -UnitZ and the CameraOffset.X pairs go through PanCoordinate; throw unless exactly two of each."
    related: [open-the-vehicle-editor-on-a-live-eva-kitten, understand-how-kittens-are-rendered, add-a-panel-to-the-vehicle-editor]
