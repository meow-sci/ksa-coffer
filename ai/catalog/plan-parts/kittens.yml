        mod: ksagolf
        features: [mods/ksagolf/features/putting-address-pose]
        technique: anim-processor
        note: "Multiply every bone with ParentIndex below zero by the stance; refuse a step beyond 90 cm reach; abort when the real body drifts 15 cm; posture is written by the step on the main thread and only read in the render so nothing needs locking. Explain why teleport fails."
