    title: Draw a kitten stepped, turned or leaning without moving its physics body
    summary: "Apply a stance matrix to the skeleton's root bones in a pose processor so the kitten is drawn offset and turned while the physics body stays put, because Vehicle.Teleport on a landed kitten rebuilds it from an orbit and throws it about."
