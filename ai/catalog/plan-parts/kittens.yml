  - slug: play-a-specific-kitten-animation-clip
    title: Force a kitten to play a chosen animation clip, freeze it or change its speed
    summary: "Keep any loaded clip playing whatever the kitten is doing by re-asserting it from a prefix on AnimatedRenderable.UpdateAnimation, which runs after the game's clip choice and before sampling; add freeze, restart, cross-fade time and a playback-rate multiplier."
