  - slug: aim-a-kitten-limb-at-a-target
    title: Aim a kitten's arm at a point
    summary: "Point a kitten's hand at a target from a pose processor: a cheap one-bone shoulder rotation that carries the shoulder-to-wrist vector onto shoulder-to-target, or a two-bone solve with the law of cosines that places the elbow and rotates both segments."
    game_types: [KSA.IAnimProcessor, RenderCore.Animation.Skeleton, KSA.CharacterAvatar]
    engine_pointers:
      - current/decomp/KSA/IAnimProcessor.cs UpdateSkeleton
      - current/decomp/KSA/CatPostAnim.cs MixPoseLocal
    lifecycle: [frame:render]
    approaches:
      - n: 1
        title: One-bone shoulder aim
        mod: ksagolf
        features: [mods/ksagolf/features/putting-address-pose, mods/ksagolf/features/kitten-pose-processor]
        technique: anim-processor
        note: "GolfPose.Reach turns each shoulder; there is no elbow solve and the repo notes call two-bone IK recorded but not implemented. Good enough when the target is near the reach."
      - n: 2
        title: Two-bone IK with a clamped reach and an outward-and-down elbow
        mod: ksacars
        features: [mods/ksacars/features/driver-hands-steering-ik]
        technique: two-bone-ik
        note: "Shoulder, elbow and wrist read from Skeleton.WorldTransforms, wrist aimed 4.5 cm short of the grip, elbow by law of cosines, shoulder then elbow rotated and written with SetWorldTransform; the pure maths lives in a KSA-free class with tests."
    related: [pose-kitten-bones-with-an-anim-processor, convert-between-kitten-model-space-and-the-world, animate-a-seated-kitten-driver, attach-a-prop-to-a-kitten-bone]
