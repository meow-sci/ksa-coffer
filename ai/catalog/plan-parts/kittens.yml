  - slug: route-vessel-input-and-flight-hud-to-an-eva-kitten
    title: Give an EVA kitten vessel keyboard input and the flight-computer HUD
    summary: "KittenEva overrides OnKey and ProcessInput and the gauge canvas decides contexts by isinst KittenEva; call the base Vehicle handlers through reverse patches, transpile the two context checks and the button policy so a flagged kitten counts as an ordinary vessel, and keep every other predicate stock."
    game_types: [KSA.KittenEva, KSA.Vehicle, KSA.GaugeCanvas, KSA.GaugeButtonFlightComputer, KSA.InputEvents]
    engine_pointers:
      - current/decomp/KSA/KittenEva.cs OnKey ProcessInput IsFlightComputerDisabled
      - current/decomp/KSA/GaugeCanvas.cs IsContextVisible
      - current/decomp/KSA/GaugeButtonFlightComputer.cs IsDisabled PackData
      - current/Content/Core/Gauges.xml
    lifecycle: [frame:input, frame:draw-ui]
    approaches:
      - n: 1
        title: Prefixes calling reverse-patched base bodies plus isinst-to-adapter transpilers
        mod: unscience
        features: [mods/unscience/features/iron-man-kitten-rocket-flight]
        technique: harmony-transpiler
        note: "OnKey from the GLFW callback during PollEvents; ProcessInput from InputEvents.VehicleInputData.Apply; the AsOrdinaryEva adapter returns null for an enabled kitten; generic IsFlightComputerDisabled<Enum> reaches the base through a DynamicMethod emitting call, not callvirt."
    related: [treat-an-eva-kitten-as-a-rocket, call-a-base-class-method-bypassing-an-override, make-a-vehicle-respond-to-a-key, show-stock-gauges-for-a-custom-craft, queue-vehicle-changes-through-input-events]
    borrowed_from: []

  - slug: call-a-base-class-method-bypassing-an-override
    title: Call a base implementation that a derived override and patches would intercept
    summary: "Calling ((Vehicle)kitten).OnKey dispatches virtually back into the patched override. Two ways out: a Harmony reverse patch onto a stub (a copy of the base body, bypassing other mods' patches) or a DynamicMethod that emits a non-virtual call into Harmony's patched replacement so other mods' prefixes still run."
    game_types: [KSA.Vehicle, KSA.KittenEva, KSA.PartModelRenderer]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs OnKey ProcessInput UpdateRenderData IsFlightComputerDisabled
      - current/decomp/KSA/KittenEva.cs OnKey ProcessInput UpdateRenderData
    lifecycle: [frame:input, frame:render]
    approaches:
      - n: 1
        title: Harmony reverse patch onto a static stub
        mod: unscience
        features: [mods/unscience/features/iron-man-kitten-rocket-flight]
        technique: harmony-reverse-patch
        note: "Stubs get a copy of the base body and are called statically; fine when no other mod patches the base."
      - n: 2
        title: DynamicMethod with ldarg and a non-virtual call
        mod: unscience
        features: [mods/unscience/features/iron-man-equipment-render-ordering, mods/unscience/features/iron-man-kitten-rocket-flight]
        technique: dynamic-method
        note: "A reverse patch would bypass I Feel Seen's replacement of Vehicle.UpdateRenderData; an IL call enters Harmony's patched replacement so every other prefix and transpiler still runs; a managed test asserts a second skip-style prefix runs exactly once in both orders."
    related: [render-kitten-equipment-in-the-right-order, route-vessel-input-and-flight-hud-to-an-eva-kitten, apply-harmony-patches-independently]
    borrowed_from: [mods/unscience/features/iron-man-equipment-render-ordering]

