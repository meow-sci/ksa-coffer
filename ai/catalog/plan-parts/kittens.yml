    summary: "Pick any live EVA kitten as the projectile, click a vessel, another kitten or terrain, and at the PrepareFrame handoff teleport the kitten to the camera with a velocity relative to the target; kittens have no part mesh so they are picked with a bounding-sphere proxy, and the kitten keeps its own attitude and spin."
    game_types: [KSA.KittenEva, KSA.Vehicle, KSA.Orbit, KSA.Cursor, KSA.Camera, KSA.Part, KSA.Ray]
    engine_pointers:
      - current/decomp/KSA/Orbit.cs CreateFromStateCci
      - current/decomp/KSA/Vehicle.cs Teleport SetFlightPlan
      - current/decomp/KSA/Cursor.cs GetEgoRay
    lifecycle: [frame:draw-ui, frame:prepare]
    approaches:
      - n: 1
        title: Click snapshot in target-relative axes, launched from the BeforePhysics hook
        mod: unscience
        features: [mods/unscience/features/dent-wizard-vessel-launcher]
        technique: custom-physics
        note: "Overlaps teleport-a-vessel-by-building-a-new-orbit; this article is the kitten-flavoured recipe: sphere-proxy picking for KittenEva, null attitude and rates so EVA conventions survive, FlightPlan identity check to detect a rejected trajectory."
    related: [teleport-a-vessel-by-building-a-new-orbit, pick-a-world-point-with-the-cursor, cursor-to-world-ray, run-code-after-physics-results-land, spawn-an-eva-kitten-from-code]
