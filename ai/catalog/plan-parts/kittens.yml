  - slug: beat-the-games-per-frame-writes
    title: Hold a value the game rewrites every frame
    summary: "Three patterns for overriding state the game recomputes each frame: patch the consumer instead of the producer, add a processor that runs after the game's, or re-apply after the game's write and cap when it cannot be held; with the restore rules that keep a rebound target unmodified."
    game_types: [KSA.AnimatedRenderable, KSA.CatEyeAnim, KSA.CatEarAnim, KSA.CatExpressionAnim, KSA.KittenRenderable]
    engine_pointers:
      - current/decomp/KSA/AnimatedRenderable.cs UpdateAnimation
      - current/decomp/KSA/KittenRenderable.cs UpdateRenderData
    lifecycle: [frame:render]
    approaches:
      - n: 1
        title: Prefix on the consuming call (UpdateAnimation) so nothing runs between your write and its use
        mod: unscience
        features: [mods/unscience/features/kitten-animations-forced-clip-playback]
        technique: harmony-prefix
        note: "Keep the hot-path check a reference compare against the bound instance; reset the driver on any exception."
      - n: 2
        title: A later-running processor instead of the game's producer
        mod: unscience
        features: [mods/unscience/features/kitten-animations-facial-expressions]
        technique: anim-processor
        note: "List order is execution order; blending over the game's pose is unaffected by what the game writes to its own processor."
      - n: 3
        title: Re-apply each frame, cap with Math.Min, restore the bind-time value on unbind
        mod: unscience
        features: [mods/unscience/features/kitten-animations-facial-expressions]
        technique: harmony-prefix
        note: "Eye pitch offset is re-applied every frame; reactive face cap is min(current, cap) after the game's write; BindTarget records originals and UnbindTarget restores them."
    related: [play-a-specific-kitten-animation-clip, make-a-kitten-pull-a-facial-expression, apply-harmony-patches-independently]
    borrowed_from: []

