    lifecycle: [frame:after-on-frame, frame:draw-ui, frame:render]
    approaches:
      - n: 1
        title: Static offset from a probe - Scale, RotX, RotY, RotZ, Translation
        mod: ksagolf
        features: [mods/ksagolf/features/kitten-held-props]
        technique: reflection
        note: "Resolve the socket bone by name, build the mesh once per avatar, add or update the CosmeticAttachment (struct in a List, so read, change, write back); the engine does not check Enabled or HasAttachment for cosmetic entries; one frame stale against a moving bone."
