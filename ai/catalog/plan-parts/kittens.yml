  # ------------------------------------------------------------------ materials and appearance
  - slug: tint-kitten-materials
    title: Tint kitten fur, body, eyes and helmet
    summary: "Recolour kittens by changing the AlbedoColor of their character materials: write a float4 into the shared GPU material buffer to recolour everything at once, clone the materials per kitten and swap the handles in place, or bind mod-owned material clones; includes why glass and eyes barely respond."
    game_types: [KSA.GpuMaterialSystem, KSA.GpuObjectSystem, KSA.MaterialData, KSA.CharacterRenderResources, KSA.CharacterAvatar, KSA.AnimatedRenderable, KSA.CatFurRenderable, KSA.KittenRenderable]
    engine_pointers:
      - current/decomp/KSA/MaterialData.cs AlbedoColor
      - current/decomp/KSA/GpuMaterialSystem.cs BigBuffer
      - current/decomp/KSA/CharacterRenderResources.cs CreateFurMaterial GlassRenderer
      - current/Content/Core/Shaders/Mesh/ModelPbr.frag
      - current/Content/Core/Shaders/Mesh/ModelTranslucent.frag
    lifecycle: [frame:draw-ui, event:load]
    approaches:
      - n: 1
        title: Staged one-float4 write into the shared material buffer
        mod: unscience
        features: [mods/unscience/features/humble-arteest-kitten-color]
        technique: vulkan-buffer
        note: "Offset is handle times sizeof(MaterialData) plus the AlbedoColor offset (16); recolours every kitten using that material; alpha under 0.1 discards in ModelPbr.frag; remember original colours and restore only handles whose AssetMap entry is still the same asset object."
      - n: 2
        title: Clone the materials per kitten and swap the MaterialIndices handles
        mod: unscience
        features: [mods/unscience/features/doh-runtime-gpu-materials]
        technique: reflection
        note: "Same textures, new AlbedoColor via the private GpuObjectSystem.CreateObject; fur needs the fur shader ExtraData rebuilt from CharacterRenderSystem resources; a batch can share one set or use unique sets; per-material colour tables."
      - n: 3
        title: Mod-owned material clones bound to the EVA renderables
        mod: gatos
        features: [mods/gatos/features/vehicle-and-eva-paint]
        technique: reflection
        note: "gatOS recolours the EVA suit, fur and visor by binding its own material clones through KittenEva._renderable and KittenRenderable._characterAvatar, opt-in and reversible; vehicle-part paint in the same feature is covered by paint-vessel-parts-with-custom-colours."
    related: [create-and-budget-runtime-gpu-materials, restore-kitten-customizations-after-a-load, hide-kitten-helmet-and-visor, paint-vessel-parts-with-custom-colours, give-mod-objects-a-private-material-buffer]
    borrowed_from: [mods/gatos/features/vehicle-and-eva-paint]

  - slug: create-and-budget-runtime-gpu-materials
    title: Create runtime GPU materials and stay inside the fixed material pool
    summary: "Allocate new MaterialData records at runtime through the private GpuObjectSystem.CreateObject, reuse names safely, free them in the right order and keep a reserve, because the material pool has a fixed 512 slots that never grows and CreateObject allocates before checking the name."
    game_types: [KSA.GpuObjectSystem, KSA.GpuMaterialSystem, KSA.AssetManager, KSA.GpuObjectAssetRef, KSA.LoadedAssetRef, KSA.MaterialData, KSA.PbrMaterialReference, Brutal.Collections.FreeListIndexPool]
    engine_pointers:
      - current/decomp/KSA/GpuObjectSystem.cs CreateObject Free
      - current/decomp/KSA/GpuMaterialSystem.cs BigBuffer
      - current/decomp/KSA/AssetManager.cs AssetMap GetOrLoad
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Reflection bridge, clone factory, 64-slot reserve and release by name
        mod: unscience
        features: [mods/unscience/features/doh-runtime-gpu-materials]
        technique: reflection
        note: "Capacity from BigBufferAllocator, used slots from distinct valid AssetMap handles, preflight of sets times an estimated slots per set, remove the name from AssetMap before disposing the asset ref, skip set prefixes still present from an earlier mod instance."
    related: [tint-kitten-materials, grow-game-gpu-buffers-for-runtime-content, give-mod-objects-a-private-material-buffer, restore-kitten-customizations-after-a-load]
    borrowed_from: []

  - slug: restore-kitten-customizations-after-a-load
    title: Restore kitten colours, clips and tuning after a save load
    summary: "Native KSA saves own the kittens, so a mod's per-kitten state (cloned material sets, colours, a forced clip with its playback phase, expression latches, tuning) is captured against native vehicle ids and rebound to the restored KittenEva objects after the world is rebuilt, never by spawning replacements or trusting GPU handles."
    game_types: [KSA.KittenEva, KSA.GpuObjectAssetRef, KSA.KittenLocomotionTuning, KSA.BoneAnimRuntime, KSA.VehicleSave]
    engine_pointers:
      - current/decomp/KSA/KittenLocomotionTuning.cs Current Default
      - current/decomp/KSA/BoneAnimRuntime.cs TimeSinceTransition SampleCurrentAnimation
    lifecycle: [event:save, event:load, frame:prepare]
    approaches:
      - n: 1
        title: Rebind cloned material sets to restored kittens by vehicle id
        mod: unscience
        features: [mods/unscience/features/doh-runtime-gpu-materials]
        technique: save-sidecar
        note: "Reset keeps live sets in a cache and never despawns, restore claims a set per kitten, unclaimed sets are released, validation rejects duplicate ids before the world is reset; handles and doh_NNNN names are never identities."
      - n: 2
        title: Identity-checked colour restore by material name
        mod: unscience
        features: [mods/unscience/features/humble-arteest-kitten-color]
        technique: save-sidecar
        note: "Record original colour and the exact asset object before the first write; restore only if the AssetMap entry is still that object because slots are reused when renderer-owned materials are disposed."
      - n: 3
        title: Scene-save record with clip label, source and phase
        mod: unscience
        features: [mods/unscience/features/kitten-animations-locomotion-tuning, mods/unscience/features/kitten-animations-forced-clip-playback]
        technique: save-sidecar
        note: "Twenty tuning fields, forced clip matched by exact source and label, playback clock restored with SampleCurrentAnimation, latched expression re-triggered, ambiguous matches become warnings and targets are never redirected."
    related: [save-mod-state-with-the-game-save, persist-vessel-references-across-save-and-load, tint-kitten-materials, play-a-specific-kitten-animation-clip, tune-kitten-locomotion-and-animation-parameters]
    borrowed_from: []

  - slug: hide-kitten-helmet-and-visor
    title: Hide kitten helmet visors, helmets and the MMU
    summary: "Remove the helmet visor from every kitten (it uses a translucent shader that ignores material alpha, so tinting cannot hide it) with a transpiler that gates one Draw call, or switch whole attachments off with the CharacterAvatar attachment Enabled flags."
    game_types: [KSA.KittenRenderable, KSA.CharacterAvatar, KSA.StaticMeshRenderable, RenderCore.Systems.ViewHandle, KSA.KittenEva, KSA.IVASeat]
    engine_pointers:
      - current/decomp/KSA/KittenRenderable.cs UpdateRenderData (Helmet.HasAttachment, VisorMesh.Draw)
      - current/decomp/KSA/CharacterAvatar.cs Helmet Mmu Enabled HasAttachment
      - current/Content/Core/Shaders/Mesh/ModelTranslucent.frag
    lifecycle: [startup:all-mods-loaded, frame:draw-ui, frame:render]
    approaches:
      - n: 1
        title: Transpile the single VisorMesh.Draw call into a gated forwarder
        mod: unscience
        features: [mods/unscience/features/humble-arteest-kitten-visor-toggle]
        technique: harmony-transpiler
        note: "Match ldfld VisorMesh, ldloc view, call Draw so the adjacent helmet draw stays stock; throw unless exactly one match so a game change disables the feature; visor, helmet and eyes stay untouched, seated crew are covered too."
      - n: 2
        title: Toggle CharacterAvatar.Attachments Helmet.Enabled and Mmu.Enabled
        mod: ksagolf
        features: [mods/ksagolf/features/putting-session, mods/ksagolf/features/kitten-pose-processor]
        technique: reflection
        note: "Hides helmet and visor together (and the MMU) per avatar with no patch; restore on let-go. The engine itself sets both false for seated renderables."
    related: [tint-kitten-materials, hide-a-kitten-body-from-one-viewport, understand-how-kittens-are-rendered]
    borrowed_from: []

  # ------------------------------------------------------------------ animation
  - slug: pose-kitten-bones-with-an-anim-processor
    title: Pose a kitten's bones with an IAnimProcessor
    summary: "Add your own IAnimProcessor to the kitten's character model to edit the sampled local pose or the world transforms before skinning, with procedural swing, bounce and spin shapes on a simulated-time clock that stops while paused, and safe attach and detach timing."
    game_types: [KSA.IAnimProcessor, KSA.AnimatedRenderable, KSA.CharacterAvatar, KSA.KittenRenderable, RenderCore.Animation.Skeleton, RenderCore.TransformTRS]
    engine_pointers:
      - current/decomp/KSA/IAnimProcessor.cs Priority ShouldUpdate CanCacheAnimation UpdateLocalPose UpdateSkeleton
      - current/decomp/KSA/AnimatedRenderable.cs UpdateAnimation AnimProcessors
      - current/decomp/KSA/KittenRenderable.cs UpdateRenderData
    lifecycle: [frame:after-on-frame, frame:draw-ui, frame:render]
    approaches:
      - n: 1
        title: Edit the local TRS pose in UpdateLocalPose
        mod: ksagolf
        features: [mods/ksagolf/features/kitten-pose-processor]
        technique: anim-processor
        note: "Once per frame on the pose after the clip was copied into the span: pre-multiply a rotation, add to translation, scale a bone; rest-pose replacement through Skeleton.SetDefaultPose; Swing, Bounce and Spin shapes with fades and loops; dt is simulated time so a paused game freezes the pose; mutate AnimProcessors outside the render (after-on-frame)."
      - n: 2
        title: Overwrite world transforms in UpdateSkeleton once per view
        mod: ksacars
        features: [mods/ksacars/features/driver-hands-steering-ik, mods/ksastructures/features/first-person-body-hiding-and-shadow]
        technique: anim-processor
        note: "Runs after the clip, processors and world transforms and before skinning matrices InverseBindPose times WorldTransform; edits go straight into the skin; called per viewport so a view-dependent edit is possible; exceptions switch the processor off once."
