  # ------------------------------------------------------------------ iron man (EVA kitten as a vessel)
  - slug: treat-an-eva-kitten-as-a-rocket
    title: Fly an EVA kitten as an ordinary rocket vessel
    summary: "Make one chosen kitten use the vessel branches of the game: flip VehicleUpdateState.IsKitten off in a PrepareFromVehicle postfix, publish membership as a volatile snapshot for worker threads, queue every mode switch to the PrepareFrame handoff, rotate the control frame so the head is the nose, and swap the backpack's authored RCS map for a geometric one."
    game_types: [KSA.KittenEva, KSA.Vehicle, KSA.VehicleUpdateState, KSA.PhysicsBubble, KSA.FlightComputer, KSA.ThrusterController, KSA.Rocket, KSA.EngineController]
    engine_pointers:
      - current/decomp/KSA/VehicleUpdateState.cs IsKitten PrepareFromVehicle
      - current/decomp/KSA/PhysicsBubble.cs AdvanceKittenLocomotion KittenWantsWake
      - current/decomp/KSA/Vehicle.cs Ctrl2Body
      - current/decomp/KSA/ThrusterController.cs RecomputeDynamicData ManualControlMap
    lifecycle: [frame:draw-ui, frame:prepare, frame:dispatch-solvers, physics:vehicle-solver]
    approaches:
      - n: 1
        title: IsKitten postfix, Ctrl2Body postfix and queued enable and disable
        mod: unscience
        features: [mods/unscience/features/iron-man-kitten-rocket-flight]
        technique: harmony-postfix
        note: "Membership keyed by the KittenEva object, never by id; snapshot EVA settings before stopping engines; refuse on a ladder or in the editor; workers read an array published with Volatile.Write; teardown waits on the solvers; scene saves restore the mode disarmed."
    related: [route-vessel-input-and-flight-hud-to-an-eva-kitten, kitten-locomotion-and-servo-reference, mutate-vehicles-at-a-physics-safe-point, write-worker-thread-safe-solver-patches, open-the-vehicle-editor-on-a-live-eva-kitten, render-kitten-equipment-in-the-right-order]
