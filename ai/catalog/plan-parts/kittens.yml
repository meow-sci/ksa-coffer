  - slug: attach-a-prop-to-a-kitten-bone
    title: Attach a prop to a kitten's hand or another bone at runtime
    summary: "Hang a mesh on a bone with a CharacterAvatar CosmeticAttachment: the engine overwrites the mesh transform every frame, so you write the attachment Transform; edit the struct in the engine list by read, change, write back; solve the transform per view when the prop must sit exactly on the drawn hand."
