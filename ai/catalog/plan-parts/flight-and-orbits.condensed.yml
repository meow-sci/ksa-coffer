- slug: read-vehicle-flight-state
  title: Read a vehicle's position, velocity, attitude, orbit and flight instruments
  summary: Pull a consistent kinematic snapshot (position, velocity, attitude, mass, orbit, navball, SOI encounters) out of KSA.Vehicle, knowing which frame and unit each member uses and which thread and frame point the read is valid on; then derive the instrument values (barometric versus radar altitude, orbital versus surface speed, g-load, dynamic pressure, Mach).
  game_types:
  - KSA.Vehicle
  - KSA.Orbit
  - KSA.NavBallData
  - KSA.PatchedConic
  - KSA.Encounter
  - KSA.UniverseTime
  - KSA.PhysicsEnvironment
  - KSA.PhysicalAtmosphereReference
  - KSA.ReadOnlyPhysicsStates
  - KSA.SituationEx
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs (GetPositionCci, GetVelocityCci, GetBody2Cci, Orbit, NavBallData)
  - current/decomp/KSA/Program.cs OnFrame (what is settled after the solver apply)
  - current/decomp/KSA/Universe.cs ApplyVehicleSolvers
  - current/decomp/KSA/Vehicle.cs (GetBarometricAltitude, GetRadarAltitude, GetSurfaceSpeed, AccelerationBody)
  - current/decomp/KSA/PhysicsEnvironment.cs
  - current/decomp/KSA/PhysicalAtmosphereReference.cs
  lifecycle:
  - frame:viewports
  - frame:draw-ui
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Immutable snapshot built in a main-viewport OnFrame prefix
    mod: gatos
    features:
    - mods/gatos/features/vessel-flight-state-reads
    technique: immutable-snapshot
    note: CCI/CCF/ECL members, NaN scrubbing, UniverseTime sentinels and SOI encounters copied into a record that other threads can read without touching the game.
  - n: 2
    title: Plain snapshot taken from StarMapAfterOnFrame, drawn next frame
    mod: ksa-public-telemetry
    features:
    - mods/ksa-public-telemetry/features/live-flight-telemetry-sampling
    technique: snapshot-copy
    note: 'One read per frame after the game finished the frame, one frame of latency, no locks; shows the apsides, thrust, T/W and downrange extras. Also (read-altitude-speed-and-g-load): Sub-step folded from read-altitude-speed-and-g-load (give it its own section): Reads dynamic pressure from ReadOnlyPhysicsStates.Environment, sums active engine thrust, derives T/W and downrange.'
  - n: 3
    title: Postfix read of a settled vehicle for an instrument panel
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/flight-data-from-vehicle
    technique: harmony-postfix
    note: 'Reading after the vehicle solver results are applied so values are not a frame stale; compare with approaches 1 and 2. Also (read-altitude-speed-and-g-load): Sub-step folded from read-altitude-speed-and-g-load (give it its own section): Barometric versus radar altitude, surface speed, AccelerationBody and Mach computed from PhysicalAtmosphereReference.'
  - n: 4
    title: Speed of sound from pressure and density
    mod: ksaero
    features:
    - mods/ksaero/features/mach-from-game-atmosphere
    technique: flight-math
    note: 'Sub-step folded from read-altitude-speed-and-g-load (give it its own section): sqrt(1.4 p / rho) from PhysicsEnvironment; constant per body because KSA atmospheres are isothermal.'
  related:
  - understand-ksa-coordinate-frames-and-epochs
  - read-orbit-elements-and-body-data
  - drive-the-flight-computer-and-attitude-modes-from-a-mod
  - read-flight-state-in-a-local-horizon-frame
  - compute-a-suicide-burn
  borrowed_from:
  - mods/ksaero/features/mach-from-game-atmosphere
  merged_from:
  - read-altitude-speed-and-g-load
  dedupe_with:
  - external-io/export-game-state-to-other-threads
  - external-io/detect-flight-events-from-snapshots
- slug: read-flight-state-in-a-local-horizon-frame
  title: Read roll, pitch, heading, angle of attack and sideslip in the local horizon frame
  summary: 'Express a vehicle''s attitude and velocity relative to the local horizon (east-north-up or north-east-down) of the body it is over: roll, pitch, heading, flight-path angle, angle of attack and sideslip, and the surface-relative velocity on a rotating body.'
  game_types:
  - KSA.Vehicle
  - KSA.VehicleReferenceFrameEx
  - KSA.QuaternionEx
  - Brutal.Numerics.doubleQuat
  - KSA.PhysicalAtmosphereReference
  engine_pointers:
  - current/decomp/KSA/VehicleReferenceFrameEx.cs GetEnuBody2Cci
  - current/decomp/KSA/Vehicle.cs GetBody2Cci
  - current/decomp/KSA/Vehicle.cs (GetBody2Cci, surface velocity)
  - current/decomp/KSA/VehicleReferenceFrameEx.cs
  lifecycle:
  - frame:viewports
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Concatenate GetBody2Cci with the inverse of the ENU frame, then ToRollPitchYawRadians
    mod: ksa-aircrafthud
    features:
    - mods/ksa-aircrafthud/features/flight-data-from-vehicle
    technique: custom-physics
    note: 'The game-supplied ENU body frame does the horizon work; the article shows the composition order and the resulting angle conventions. Also (compute-angle-of-attack-and-sideslip): Sub-step folded from compute-angle-of-attack-and-sideslip (give it its own section): Alpha and beta from the body-frame velocity components; why the wind-relative velocity is the right input.'
  - n: 2
    title: Transform basis vectors with the game's own quaternion type
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/vehicle-state-to-site-frame
    technique: frame-conversion
    note: Never assume a quaternion convention (doubleQuat is scalar-last); rotate known basis vectors and rebuild the attitude from them. Body axes inferred from the measured thrust direction.
  related:
  - build-a-site-frame-and-compute-a-launch-window
  - understand-ksa-coordinate-frames-and-epochs
  - predict-impact-point-and-build-a-ballistic-computer
  - fly-a-boostback-and-glide-to-a-landing-site
