category: flight-and-orbits
description: Reading a vehicle's flight state and orbit, working in KSA's coordinate frames and epochs, driving the flight computer and burns from a mod, extending the stock Transfer Planner and orbit menus, transfer and encounter math, targets, map-view overlays and guided flight (ascent, boostback, landing, ballistic and homing guidance).
topics:
- slug: understand-ksa-coordinate-frames-and-epochs
  title: Understand KSA coordinate frames and epochs (ECL, CCE, CCI, CCF, ego, body)
  summary: Reference for which frame and epoch each Vehicle, Orbit and body member lives in, how to sample two positions at one consistent epoch, how to convert a position to latitude, longitude and altitude, and what the usual conversion pitfalls are.
  kind: reference
  game_types:
  - KSA.Vehicle
  - KSA.IParentBody
  - KSA.Orbit
  - KSA.Camera
  - KSA.CelestialFrameMath
  - KSA.Universe
  - KSA.PhysicsBubble
  - KSA.Celestial
  engine_pointers:
  - current/decomp/KSA/Celestial.cs (GetCce2Cci, GetCci2Ccf)
  - current/decomp/KSA/Orbit.cs (Inclination, CreateFromStateCci)
  - current/decomp/KSA/Camera.cs (EclToEgo, GetPositionEgo)
  - current/decomp/KSA/Camera.cs GetPositionEgo, EclToEgo
  - current/decomp/KSA/Universe.cs GetElapsedTime, ApplyVehicleSolvers
  - current/decomp/KSA/Celestial.cs GetCci2Ccf, GetLlaFromCcf
  lifecycle:
  - frame:draw-ui
  - frame:dispatch-solvers
  - frame:celestials
  - frame:after-on-frame
  - frame:viewports
  approaches:
  - n: 1
    title: Vessel state in CCI/CCF/ECL
    mod: gatos
    features:
    - mods/gatos/features/vessel-flight-state-reads
    - mods/kitten-engineer-redux/features/orbit-readouts-and-hohmann-estimate
    technique: immutable-snapshot
    note: 'Attitude is stored as Body2Cce; the table of which member is in which frame. Also (convert-position-to-latitude-longitude): Sub-step folded from convert-position-to-latitude-longitude (give it its own section): The two mods use the same two calls; the article also covers the reverse (lat/lon to a position) used in site and landing code.'
  - n: 2
    title: Ecl as the mod's working frame, ego for anything drawn
    mod: ksarmory
    features:
    - mods/ksarmory/features/ecliptic-frames-and-epochs
    - mods/ksarmory/features/cpa-threat-classification
    technique: frame-invariant-signatures
    note: 'All state in Ecl at the sub-step instant; the 29.8 km/s carrier that makes mixing epochs fail. Also (sample-positions-at-a-consistent-epoch): Sub-step folded from sample-positions-at-a-consistent-epoch (give it its own section): One parent-first walk in ApplyVehicleSolvers decides which instant each engine sample belongs to; relative motion taken from paired samples.'
  - n: 3
    title: Anchors stored in the owner's frame and resolved on use
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/live-body-relative-anchors
    technique: frame-relative-anchors
    note: CCE offset, orbit-parent offset, body-fixed lat/lon and part-local asmb frames as resolve-to-ECL recipes.
  - n: 4
    title: Equatorial versus ecliptic reference planes
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/apse-and-inclination-quick-tools
    technique: custom-physics
    note: Orbit.Inclination is measured against CCI +Z (the parent pole); the ecliptic normal is CCE +Z via GetCce2Cci (AFC labels the two the other way round).
  - n: 5
    title: Pair the rendered Ego position with Ecl offsets from the same instant
    mod: ksagolf
    features:
    - mods/ksagolf/features/frame-epoch-draw-anchor
    technique: frame-epoch
    note: 'Sub-step folded from sample-positions-at-a-consistent-epoch (give it its own section): Draw next to a craft by measuring offsets against a platform sample taken the same frame, avoiding the 500 m-per-frame ecliptic error.'
  related:
  - build-a-site-frame-and-compute-a-launch-window
  - anchor-and-pick-points-on-bodies
  - compute-mission-elapsed-time-and-detect-liftoff
  - find-closest-approach-along-the-flight-plan
