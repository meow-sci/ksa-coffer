    technique: per-system-cache
    note: 'Sub-step folded from read-celestial-orbit-and-body-data (give it its own section): Cache keyed by the Universe.CurrentSystem reference, not the Id, so a reload invalidates it.'
  - n: 4
    title: Derived body properties (radius, mass, escape velocity, SOI, periods)
