      - n: 1
        title: "Request file, state machine, SCENARIO log lines and wall and sim budgets"
        mod: ksarmory
        features: [mods/ksarmory/features/unattended-scenario-runner]
        technique: state-machine
        note: "Why a file rather than an environment variable (game launched across WSL), take-once semantics, snapshot-and-restore of config around a run, TIMEOUT with a description of where it was stuck."
    related: [script-gameplay-through-a-command-bridge, load-a-save-from-code, take-screenshots-from-code, gate-developer-only-features-behind-a-marker-file]
    borrowed_from: [mods/ksarmory/features/unattended-scenario-runner]

  # ------------------------------------------------------------------ servers inside the game
  - slug: serve-a-telemetry-and-control-api-over-http
    title: "Serve a telemetry and control API over HTTP from inside the game"
    summary: "Host a small HTTP/1.1 server in the game process that serves JSON snapshots, Server-Sent Events, long-poll and an OpenAPI document, and accepts POSTed control commands that go through the game-thread queue with errno mapped to HTTP status. Covers the accept loop, threading, and why handlers read snapshots and never game objects."
    game_types: []
    engine_pointers:
      - "current/decomp/KSA/Program.cs OnFrame (the only place game objects may be touched)"
    lifecycle: [startup:all-mods-loaded, thread:background, event:unload]
    approaches:
      - n: 1
        title: "Raw TcpListener server with SSE, long-poll, OpenAPI and a generic command endpoint"
        mod: gatos
        features: [mods/gatos/features/http-v1-api-server]
        technique: protocol-server
        note: "No HttpListener or ASP.NET dependency: a hand-rolled request-line parser keeps the mod loadable in the game's runtime; reads come from the snapshot store, writes enqueue SimCommands; loopback binding and the per-leaf /sim mirror."
    related: [export-game-state-to-other-threads, marshal-commands-to-the-game-thread, publish-telemetry-and-accept-commands-over-mqtt, let-ai-agents-control-the-game-over-mcp, build-a-typed-client-over-files-and-http, clean-up-on-game-exit]
