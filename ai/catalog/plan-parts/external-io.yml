category: external-io
description: "Everything that connects a KSA mod to the world outside the frame: sampling and exporting telemetry, command queues and bridges drained on the game thread, in-process HTTP/MQTT/MCP/9p/serial servers, hosted child processes and terminals, native libraries, inter-mod contracts, HTTP clients and external SDKs."
topics:
  # ------------------------------------------------------------------ telemetry out
  - slug: export-game-state-to-other-threads
    title: "Export live game state to background threads with immutable snapshots"
    summary: "Keep every transport thread away from KSA objects by building one immutable snapshot on the game thread and publishing it with a single volatile reference swap. Readers get lock-free access, async waiters wake on publish, and per-snapshot memoization keeps N readers at the cost of one format."
    game_types: [KSA.Universe, KSA.Program, KSA.Vehicle, KSA.CelestialSystem]
    engine_pointers:
      - "current/decomp/KSA/Universe.cs ApplyVehicleSolvers (state settled before the sampler runs)"
      - "current/decomp/KSA/Program.cs ControlledVehicle, OnFrame"
      - "current/decomp/KSA/Universe.cs GetElapsedSeconds, CurrentSystem.All"
    lifecycle: [frame:viewports, frame:draw-ui, frame:after-on-frame, thread:background]
    approaches:
      - n: 1
        title: "Sampler builds an immutable snapshot, volatile swap, TaskCompletionSource wake"
        mod: gatos
        features: [mods/gatos/features/telemetry-sampler-snapshot]
        technique: immutable-snapshot
        note: "Per-vehicle try/catch so one craft mid-teardown cannot kill the sample, per-stream gates that skip KSA reads when nobody listens, a ConditionalWeakTable memo of projections per snapshot, and a GC.GetAllocatedBytesForCurrentThread delta as an allocation tripwire. The canonical pattern; every gatOS transport reads only the store."
      - n: 2
        title: "Plain-struct snapshot sampled after the frame, drawn next frame (single thread, no locks)"
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/live-flight-telemetry-sampling]
        technique: snapshot-copy
        note: "The lightest version for a UI-only consumer: copy kinematics into a plain snapshot from StarMapAfterOnFrame and let the next frame's draw read it, accepting one frame of latency. Contrast with approach 1 to show when you need the volatile swap."
    related: [sample-telemetry-at-a-fixed-interval, serve-a-telemetry-and-control-api-over-http, publish-telemetry-and-accept-commands-over-mqtt, marshal-commands-to-the-game-thread, read-vehicle-flight-state, profile-mod-frame-cost]
    borrowed_from: [mods/ksa-public-telemetry/features/live-flight-telemetry-sampling]

  - slug: sample-telemetry-at-a-fixed-interval
    title: "Sample flight telemetry at a fixed interval"
    summary: "Run sampling a few times per second instead of every frame, and choose the clock deliberately. Covers a drift-free accumulator that keeps phase but drops backlog after a hitch, and a wall-clock timer for a HUD history graph, with the difference between player time, simulation time and clamped dt spelled out."
    game_types: [KSA.Program, KSA.Universe, KSA.App]
    engine_pointers:
      - "current/decomp/KSA/Program.cs GetPlayerTime (wall-clock Stopwatch based)"
      - "current/decomp/KSA/Universe.cs GetElapsedSeconds, GetLastSimStep"
      - "current/decomp/KSA/App.cs (dtPlayer clamped to 1 / MinTargetFrameRate)"
    lifecycle: [frame:viewports, frame:draw-ui]
    approaches:
      - n: 1
        title: "SampleClock accumulator with drift-free phase and dropped backlog"
        mod: gatos
        features: [mods/gatos/features/telemetry-sampler-snapshot]
        technique: starmap-lifecycle
        note: "Default 10 Hz, 1-120 configurable, clock reset and sampling idle while no transport client is connected. Unit-testable because the clock is game-free."
      - n: 2
        title: "Wall-clock player-time interval feeding a fixed-length history array"
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/telemetry-history-and-csv-export]
        technique: telemetry-sampling
        note: "0.25 s of Program.GetPlayerTime from the HUD draw into 720-entry shifted arrays, reset on vehicle change. Simple, but it keeps ticking while paused and ignores time warp; explain the trade-off."
    related: [export-game-state-to-other-threads, record-telemetry-to-csv, choose-a-clock-under-time-warp, schedule-timed-commands]
    borrowed_from: []

  - slug: record-telemetry-to-csv
    title: "Record telemetry to CSV without stalling the frame"
    summary: "Write flight telemetry to a file for later analysis, either as an on-demand export of a history buffer or as a continuous per-step recorder that buffers rows, flushes in batches, never throws and never waits on the disk."
    game_types: [KSA.Vehicle, KSA.Universe, KSA.Program]
    engine_pointers:
      - "current/decomp/KSA/Constants.cs DocumentsFolderPath"
      - "current/decomp/KSA/Vehicle.cs PrepareWorker (per-step hook used by the recorder)"
    lifecycle: [frame:draw-ui, frame:dispatch-solvers]
    approaches:
      - n: 1
        title: "Export a sampled history array to CSV in Documents on a button press"
        mod: kitten-engineer-redux
        features: [mods/kitten-engineer-redux/features/telemetry-history-and-csv-export]
        technique: csv-export
        note: "Six metrics, one row per sample, written to the KSA documents folder when the player clicks Export."
      - n: 2
        title: "Static single-owner buffered sink with per-step CSV, plan snapshots and event log"
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/guidance-flight-telemetry-csv]
        technique: buffered-file-sink
        note: "Rows buffered in memory and flushed every N, a sink that swallows I/O errors, one owner vehicle per run, rate-limited whole-plan snapshots, and log lines keyed on a bucketed change signature so repeated states are not re-logged."
    related: [sample-telemetry-at-a-fixed-interval, write-a-per-mod-log-file, log-each-problem-once]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/guidance-flight-telemetry-csv]

  - slug: detect-flight-events-from-snapshots
    title: "Detect flight events when the game has no event bus"
    summary: "Derive liftoff, staging, flameout, SOI change, docking and similar events by diffing consecutive samples, with edge detection that stays allocation-free in the common no-change case, and deliver them to consumers as an ordered event stream."
    game_types: [KSA.Vehicle, KSA.Universe]
    engine_pointers:
      - "current/decomp/KSA/Vehicle.cs (state read each sample: situation, parent body, engines, part count)"
    lifecycle: [frame:viewports, frame:draw-ui, thread:background]
    approaches:
      - n: 1
        title: "EventDiffer over consecutive immutable SimSnapshots"
        mod: gatos
        features: [mods/gatos/features/snapshot-diff-flight-events, mods/gatos/features/telemetry-sampler-snapshot]
        technique: edge-detection
        note: "Situation, SOI, engine, flameout, docking, decoupling, animation and battery events; the same event list feeds a blocking 9p file, SSE and MQTT."
      - n: 2
        title: "Debounced heuristics on burning-engine and part counts for webcast callouts"
        mod: ksa-public-telemetry
        features: [mods/ksa-public-telemetry/features/flight-event-detection-and-callouts]
        technique: edge-detection
        note: "LIFTOFF, MAX Q, MECO/SECO, STAGE and landing callouts from engine and part count transitions, with debounce so a flickering count does not repeat a callout."
    related: [export-game-state-to-other-threads, design-synthetic-files-for-live-data, detect-staging-and-vehicle-loss, compute-mission-elapsed-time-and-detect-liftoff]
    borrowed_from: [mods/ksa-public-telemetry/features/flight-event-detection-and-callouts]

  # ------------------------------------------------------------------ commands in
  - slug: marshal-commands-to-the-game-thread
    title: "Marshal commands from background threads to the game thread"
    summary: "Let transport threads submit immutable commands and await a result while all KSA mutation happens at one fixed point in the frame. Covers two-phase queues (frame versus solver window), timeouts that abandon a pending entry, atomic batches drained as a unit, and a shared outcome-to-errno mapping every transport reuses."
    game_types: [KSA.Program, KSA.Universe, KSA.Vehicle, KSA.GameViewport]
    engine_pointers:
      - "current/decomp/KSA/Program.cs OnFrame, PrepareFrame"
      - "current/decomp/KSA/Universe.cs ApplyVehicleSolvers, ExecuteNextVehicleSolvers"
      - "current/decomp/KSA/Vehicle.cs PrepareWorker (copies manual inputs and flight computer into the worker state)"
      - "current/decomp/KSA/GameViewport.cs OnFrame"
    lifecycle: [frame:viewports, frame:draw-ui, frame:after-on-frame, frame:dispatch-solvers, thread:background]
    approaches:
      - n: 1
        title: "Two ConcurrentQueues (Frame and Solver phase) with TaskCompletionSource, timeout and abandon"
        mod: gatos
        features: [mods/gatos/features/game-thread-command-queue]
        technique: command-queue
        note: "SimCommand carries a stable action key and the phase is derived from it. SubmitAsync awaits with a timeout (ETIMEDOUT while paused or loading), SubmitBatchAsync keeps up to 64 commands in one Pending so they execute in one drain, RunContinuationsAsynchronously keeps awaiting code off the game thread, and KsaCatalog applies authority gates, ENOENT and latches a degraded accessor on exceptions. Includes the CommandOutcome to errno/HTTP name mapping."
      - n: 2
        title: "Solver-window drain in a Priority.First prefix on ExecuteNextVehicleSolvers"
        mod: gatos
        features: [mods/gatos/features/solver-phase-command-drain, mods/gatos/features/game-thread-command-queue]
        technique: harmony-prefix
        note: "Writes that the vehicle step would otherwise restore (flight computer setpoints, refills, teleports) must land after ApplyVehicleSolvers and before PrepareVehicleWorkers. Shows why Frame-phase writes are one frame late for those fields."
    related: [schedule-timed-commands, serve-a-telemetry-and-control-api-over-http, publish-telemetry-and-accept-commands-over-mqtt, let-ai-agents-control-the-game-over-mcp, write-state-where-the-vehicle-solver-sees-it, hand-background-thread-output-to-the-game-frame, game-loop-and-lifecycle]
    borrowed_from: [mods/gatos/features/solver-phase-command-drain]

  - slug: schedule-timed-commands
    title: "Schedule timed command sequences on render, wall or sim time"
    summary: "Play back a script of commands at millisecond offsets against a chosen clock, ticked on the game thread just before the command drain. Covers absolute offsets so rounding never accumulates, all-or-nothing validation, catch-up after a hitch that never skips a trigger, and live players that can pause, scrub or loop."
    game_types: [KSA.Universe, KSA.App, KSA.Program]
    engine_pointers:
      - "current/decomp/KSA/App.cs (dtPlayer clamp to MinTargetFrameRate)"
      - "current/decomp/KSA/Universe.cs GetElapsedSeconds"
    lifecycle: [frame:viewports, frame:draw-ui, thread:background]
    approaches:
      - n: 1
        title: "Scheduler posting SimCommands before the drain, with render, wall and ut clocks"
        mod: gatos
        features: [mods/gatos/features/timed-command-scheduler]
        technique: command-queue
        note: "Grammar of offset, path and value lines plus @id/@clock/@rate/@loop/@group directives; wall clock parked while idle so time is never banked; coalescing catch-up posts every trigger but only the last non-trigger value per path; failures recorded per schedule."
    related: [marshal-commands-to-the-game-thread, choose-a-clock-under-time-warp, play-cinematic-camera-tracks, sample-telemetry-at-a-fixed-interval]
    borrowed_from: []

  - slug: script-gameplay-through-a-command-bridge
    title: "Drive a running game from outside through a file command bridge"
    summary: "Let a script or an AI agent operate a game that stays running by dropping JSON command files into a per-mod folder and reading JSON replies back, polled from a frame hook that KSA always calls. Covers the atomic .part rename on both sides, one command at a time, multi-frame commands as per-frame closures, and the reply format."
    game_types: [KSA.Program, KSA.Universe, KSA.GameSaves, KSA.Constants]
    engine_pointers:
      - "current/decomp/KSA/Program.cs OnFrame (StarMapAfterOnFrame postfix site; StarMapAfterGui sits inside the DrawUI block)"
      - "current/decomp/KSA/Constants.cs DocumentsFolderPath, LogsFolderPath"
      - "current/decomp/KSA/Universe.cs SetSimulationSpeed, GetLastSimStep"
    lifecycle: [startup:all-mods-loaded, frame:after-on-frame]
    approaches:
      - n: 1
        title: "Bridge with a KSA-free BridgeCommand parser and craft-level commands"
        mod: ksacars
        features: [mods/ksacars/features/file-drop-command-bridge]
        technique: file-ipc
        note: "The reference implementation: in/ and out/ folders under the mod log folder, lexically first file every 0.1 s of player time, BridgeCommand.TryParse in a game-free Sim assembly, closures advanced once per frame for step, load and capture, plus spawn, drive, seat kittens and a telemetry report command."
      - n: 2
        title: "Generic get/set of config fields by reflection and composed-shot commands"
        mod: ksagolf
        features: [mods/ksagolf/features/file-command-bridge]
        technique: file-ipc
        note: "Adds set/get over every public Config field by name, kitten pose and prop commands, camera holding and a swing array; shows how a bridge grows with a mod's panels."
      - n: 3
        title: "Bridge with shader hot reload and an in-building scene for visual checks"
        mod: ksastructures
        features: [mods/ksastructures/features/dev-file-bridge-and-mcp]
        technique: file-ipc
        note: "Adds reload_shaders through the internal FileReference.DoLoad, lighting and view commands, and the closure model; useful as the lean variant of the same protocol."
      - n: 4
        title: "Bridge that doubles as an effect lab and a camera claimant"
        mod: ksarmory
        features: [mods/ksarmory/features/file-command-bridge-and-mcp]
        technique: file-ipc
        note: "Commands for bursts, spawn, fly and fire; the bridge holds the main view as one claimant of the camera arbiter; a UI button only sets a flag so a capture never starts inside the UI pass."
    related: [gate-developer-only-features-behind-a-marker-file, take-screenshots-from-code, step-the-simulation-an-exact-number-of-seconds, load-a-save-from-code, let-ai-agents-control-the-game-over-mcp, run-an-unattended-scenario-and-report-pass-or-fail, marshal-commands-to-the-game-thread, keep-overlays-updating-when-hud-hidden]
    borrowed_from: [mods/ksacars/features/file-drop-command-bridge, mods/ksagolf/features/file-command-bridge, mods/ksastructures/features/dev-file-bridge-and-mcp, mods/ksarmory/features/file-command-bridge-and-mcp]

  - slug: gate-developer-only-features-behind-a-marker-file
    title: "Gate developer-only features behind a marker file"
    summary: "Ship a bridge or debug tool that exists only on a developer install. A deploy script writes an empty file beside the DLL, the release package never contains it, and the mod checks it once at load. Pairs with per-mod folders so sibling mods never answer each other's commands, and a CI check that proves a player build opens no sockets."
    game_types: []
    engine_pointers:
      - "current/decomp/KSA/Constants.cs LogsFolderPath (where bridge folders live)"
    lifecycle: [startup:all-mods-loaded]
    approaches:
      - n: 1
        title: "Build.Developer from a developer file written by deploy.sh"
        mod: ksagolf
        features: [mods/ksagolf/features/file-command-bridge, mods/ksacars/features/file-drop-command-bridge, mods/ksarmory/features/file-command-bridge-and-mcp]
        technique: marker-file
        note: "The same gate appears in four repos; KSArmory adds check-network.sh enforcing that the only network egress is the player's Send button."
    related: [script-gameplay-through-a-command-bridge, add-an-in-game-bug-report-form, find-your-mod-folder-at-runtime]
    borrowed_from: []

  - slug: take-screenshots-from-code
    title: "Take clean screenshots from mod code"
    summary: "Ask KSA's own screenshot system for a capture without the HUD by reaching the private Program screenshot object once by reflection and calling its public Request(scale, flags) with warm-up frames, then collect the file from the exports folder and write a manifest of what the picture shows."
    game_types: [KSA.ScreenshotCapture, KSA.Program, KSA.Camera, KSA.Constants]
    engine_pointers:
      - "current/decomp/KSA/ScreenshotCapture.cs Request (scale, flags), DEFAULT_WARMUP_FRAMES, OnPrepareFrame (sets Program.DrawUI false)"
      - "current/decomp/KSA/Program.cs _screenshotCapture, Screenshot terminal action, DrawUI"
      - "current/decomp/KSA/Constants.cs DocumentsFolderPath (exports/screenshots)"
      - "current/decomp/Core/Renderer.cs ExtentOverride (high-resolution captures)"
    lifecycle: [frame:after-on-frame, frame:prepare, frame:post-render, thread:background]
    approaches:
      - n: 1
        title: "Request with warm=24, wait for the new ksa_*.png, move it and write a manifest"
        mod: ksacars
        features: [mods/ksacars/features/file-drop-command-bridge]
        technique: reflection
        note: "Smallest working version: one reflected field, flags string, poll the screenshots folder, move the image beside a JSON manifest (time, pause, speed, FOV, craft screen position)."
      - n: 2
        title: "Series spaced in simulated seconds, same-instant variant diffs and temporal noise maps"
        mod: ksagolf
        features: [mods/ksagolf/features/visual-testing-captures]
        technique: reflection
        note: "Per-image manifests with the craft's projected screen position, series stepping a paused world, variant captures at the same instant and a noise map for shimmer; the Python tools crop around the craft using the manifest."
      - n: 3
        title: "Capture button that only sets a flag, and capture bundles with GPU split"
        mod: ksarmory
        features: [mods/ksarmory/features/file-command-bridge-and-mcp]
        technique: reflection
        note: "A capture must not start inside the UI pass, so the panel sets a static flag that the next frame hook consumes; also why the capture hook must be StarMapAfterOnFrame, since ScreenshotCapture hides the HUD and the GUI hooks stop."
    related: [capture-rendered-frames, script-gameplay-through-a-command-bridge, hold-a-composed-camera-shot-for-screenshots, handle-renderer-rebuilds, project-world-positions-to-screen]
    borrowed_from: [mods/ksacars/features/file-drop-command-bridge, mods/ksagolf/features/visual-testing-captures, mods/ksarmory/features/file-command-bridge-and-mcp]

  - slug: step-the-simulation-an-exact-number-of-seconds
    title: "Run the world for an exact number of simulated seconds, then pause"
    summary: "Unpause, accumulate the applied simulation step each frame, and pause again once the target is reached, so a script or test can advance the world deterministically regardless of frame rate or time warp."
    game_types: [KSA.Universe, KSA.SimSpeed, KSA.SimStep]
    engine_pointers:
      - "current/decomp/KSA/Universe.cs GetLastSimStep, SetSimulationSpeed"
    lifecycle: [frame:after-on-frame]
    approaches:
      - n: 1
        title: "Per-frame closure summing Universe.GetLastSimStep().DeltaTime"
        mod: ksacars
        features: [mods/ksacars/features/file-drop-command-bridge, mods/ksagolf/features/file-command-bridge, mods/ksastructures/features/dev-file-bridge-and-mcp]
        technique: file-ipc
        note: "Same closure in three bridges: dtSim is the last sim step in a flight scene and 0 while paused or in menus; the reply is withheld until the sum reaches the requested seconds. Mention SetSimulationSpeed with speeds below the UI's floor."
    related: [script-gameplay-through-a-command-bridge, set-simulation-speed-from-a-mod, choose-a-clock-under-time-warp]
    borrowed_from: []

