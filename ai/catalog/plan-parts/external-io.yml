  - slug: run-an-unattended-scenario-and-report-pass-or-fail
    title: "Run a scripted scenario unattended and report a pass or fail verdict"
    summary: "Turn the running game into an end-to-end test. A request file read and deleted at load selects a scenario, a state machine flies it, tagged log lines carry progress and the verdict, and a shell harness waits on the tag, takes screenshots on cue and exits non-zero on FAIL or TIMEOUT."
