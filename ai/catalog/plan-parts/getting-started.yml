    approaches:
      - n: 1
        title: Importer lists the contract assembly in ImportedAssemblies
        mod: purrtty
        features: [mods/purrtty/features/custom-shell-contract-via-assembly-imports, mods/starmap/features/shared-contract-assemblies, mods/gatos/features/purrtty-custom-shell-contract, mods/ksarmory/features/armoury-pack-registration-api]
        technique: inter-mod-api
        note: The importer resolves the name from the dependency's load context so both share one Assembly and static registry. Key finding - ExportedAssemblies is parsed but never filled at StarMap 4dc60f8, so only the importer's ImportedAssemblies is effective, and shipping your own copy of the contract produces a second identity.
      - n: 2
        title: Duck-typed attributes copied into the consumer
        mod: shaderextensions
        features: [mods/shaderextensions/features/duck-typed-attribute-api, mods/mpfx/features/duck-typed-buffer-structs, mods/ksa-aircrafthud/features/sx-push-constants-and-buffers]
