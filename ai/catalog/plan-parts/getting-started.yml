category: getting-started
description: Build, deploy and understand a StarMap code mod end to end - project and mod.toml setup, how KSA and StarMap discover and load mods, startup hook choice, dependencies and shared assemblies, logging, version guards, fault containment and release packaging.
topics:
  # ------------------------------------------------------------------ first mod
  - slug: create-a-minimal-starmap-mod
    title: Create a minimal StarMap mod
    summary: Stand up the smallest mod StarMap will load - a mod.toml, one [StarMapMod] entry class with lifecycle methods, a csproj that references the game DLLs without copying them, and a Harmony instance - then see it log from the game.
    game_types: [KSA.Mod, KSA.ModLibrary, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/Mod.cs (TomlField members, DirectoryPath)
      - current/decomp/KSA/ModLibrary.cs PrepareManifest / PrepareAll / LoadAll
    lifecycle: [startup:starmap-before-main, startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: Hand-built project from the discovery rules
        mod: starmap
        features: [mods/starmap/features/manifest-mod-discovery, mods/starmap/features/attribute-hook-discovery, mods/kitten-engineer-redux/features/dist-zip-and-post-build-deploy]
        technique: starmap-lifecycle
        note: Walk the minimum - mod.toml with only name (EntryAssembly defaults to the folder/manifest id so no [StarMap] table is needed), public class with [StarMapMod], StarMap.API and Harmony from NuGet, game DLLs with Private=false. Shows what StarMap checks and what it silently ignores.
      - n: 2
        title: Copy and rename the repo template with mkmod.ts
        mod: unscience
        features: [mods/unscience/features/fixme-mod-name-standalone-mod-template]
        technique: starmap-lifecycle
        note: The fixme-mod-name project pair is a ready scaffold (entry class with four lifecycle attributes, Harmony patcher with hotkey guard, F11 ImGui window, sibling library project) cloned by a TypeScript script. Good starting point for a mod that grows into a library plus entry layout.
    related: [mod-toml-reference, reference-game-assemblies-from-a-mod-project, deploy-a-mod-on-every-build, choose-a-starmap-startup-hook, game-loop-and-lifecycle]
    borrowed_from: []

  - slug: mod-toml-reference
    title: Write mod.toml - KSA keys and the [StarMap] table
    summary: What each mod.toml key means to KSA (name, assets, patches and other TomlFields) and to StarMap (EntryAssembly, ExportedAssemblies, ModDependencies), including the defaults, the smallest valid file and the keys that are parsed but never acted on.
    game_types: [KSA.Mod, KSA.ModEntry, KSA.ModManifest]
    engine_pointers:
      - current/decomp/KSA/Mod.cs every [TomlField] member and LoadFromFile
      - StarMap manifest reader (StarMap.Core) for the [StarMap] table
    lifecycle: [startup:starmap-before-main, startup:asset-load]
    approaches:
      - n: 1
        title: Reference table with smallest-file examples
        mod: starmap
        features: [mods/starmap/features/manifest-mod-discovery, mods/starmap/features/mod-dependency-graph, mods/kitten-engineer-redux/features/dist-zip-and-post-build-deploy, mods/ohmystars/features/mod-root-and-packaging]
        technique: toml-config
        note: Document every KSA.Mod TomlField, EntryAssembly default (folder/manifest id), ModDependencies shape, and contrast the no-[StarMap] files (kitten-engineer-redux, ohmystars) with the explicit ones. Flag ExportedAssemblies as parsed but not effective at the pinned StarMap commit.
    related: [ksa-mod-folders-and-manifest, declare-a-mod-dependency, ship-content-and-code-in-one-mod, generate-mod-toml-from-msbuild]
    borrowed_from: []

  - slug: ksa-mod-folders-and-manifest
    title: Understand how KSA finds, enables and orders mods
    summary: KSA's own mod system under a StarMap mod - the Content/manifest.toml and Documents "My Games/Kitten Space Agency/mods" folders, the local manifest.toml copy, mod ids equal to folder names, new mods starting disabled behind the MOD FOUND popup, and manifest order as load order.
    game_types: [KSA.ModLibrary, KSA.ModManifest, KSA.ModEntry, KSA.Mod, KSA.Constants]
    engine_pointers:
      - current/decomp/KSA/ModLibrary.cs CONTENT_MANIFEST, LocalManifestPath, PrepareManifest
      - current/decomp/KSA/Constants.cs DocumentsFolderPath
    lifecycle: [startup:asset-load]
    approaches:
      - n: 1
        title: Folder and manifest rules as StarMap consumes them
        mod: starmap
        features: [mods/starmap/features/manifest-mod-discovery, mods/starmap/features/new-mods-restart-flow, mods/ksagolf/features/content-and-code-mod-layout]
        technique: toml-config
        note: Explains Content vs Documents mod roots, where a hand-copied mod must be registered, why a mod can seem to be ignored (disabled or New in the manifest), and how enabling a New mod in the popup leads to StarMap's restart. KSAGolf shows a mod that is both a KSA content mod and a code mod.
    related: [mod-toml-reference, relaunch-the-game-from-a-mod, how-starmap-launches-ksa, separate-game-instances]
    borrowed_from: [mods/starmap/features/instance-path-override]

  - slug: how-starmap-launches-ksa
    title: How StarMap launches KSA and loads your mod
    summary: End-to-end walkthrough of StarMap.exe - StarMapConfig.json, the custom game AssemblyLoadContext and base-directory trick, instance path handling, manifest discovery, per-mod load contexts, dependency ordering and attribute binding - so a modder can predict what is loaded, in which context and when.
    game_types: [KSA.Program, KSA.App, KSA.ModLibrary]
    engine_pointers:
      - StarMap/Program.cs, StarMap.Core/StarMapCore.cs (outside the decomp; see mods/starmap pages)
      - current/decomp/KSA/Program.cs Main and CliArgs
    lifecycle: [startup:starmap-before-main, startup:immediate-load, startup:all-mods-loaded]
    approaches:
      - n: 1
        title: Host process, contexts and hook binding walkthrough
        mod: starmap
        features: [mods/starmap/features/host-process-launch, mods/starmap/features/manifest-mod-discovery, mods/starmap/features/per-mod-assembly-load-context, mods/starmap/features/mod-dependency-graph, mods/starmap/features/attribute-hook-discovery]
        technique: assembly-load-context
        note: A reference narrative with a numbered boot sequence and a context-resolution diagram. Covers why Harmony lives in the default context, what resolves where, why the game ignores extra CLI args, and the places a mod can observe all this (Assembly.Location, AssemblyLoadContext.GetLoadContext). Absorbs the "host a .NET game inside your own launcher" suggestion.
    related: [ksa-mod-folders-and-manifest, declare-a-mod-dependency, find-your-mod-folder-at-runtime, run-and-debug-a-starmap-mod-from-an-ide]
    borrowed_from: []

  - slug: run-and-debug-a-starmap-mod-from-an-ide
    title: Run and debug a StarMap mod from Rider or Visual Studio
    summary: Launch StarMap.exe under the debugger with the right working directory so breakpoints in your mod hit, using a generated launch profile that points at the StarMap folder and deploys on every build.
    game_types: []
    engine_pointers: [StarMap/Program.cs working directory and StarMapConfig.json handling]
    lifecycle: [startup:starmap-before-main]
    approaches:
      - n: 1
        title: Generated launchSettings profile from ModDeploy.targets
        mod: ksaero
        features: [mods/ksaero/features/mod-deploy-targets, mods/ksa-deltavmap/features/mod-deploy-targets-and-release, mods/starmap/features/host-process-launch]
        technique: msbuild
        note: The same ModDeploy.targets in KSAero, DeltaVMap and MeasureTools writes a launch profile for fresh worktrees; the working directory must be the StarMap folder, and a deploy stamp records which checkout last deployed.
    related: [deploy-a-mod-on-every-build, how-starmap-launches-ksa, separate-game-instances]
    borrowed_from: []

  # ------------------------------------------------------------------ hooks
  - slug: choose-a-starmap-startup-hook
    title: Choose the right StarMap hook for initialization
    summary: Pick between StarMapBeforeMain, StarMapImmediateLoad and StarMapAllModsLoaded by what must already exist - startup patches, data that asset XML must see, or a fully loaded asset set - with a map of what game state is available at each.
    game_types: [KSA.Program, KSA.ModLibrary, KSA.Mod, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/Program.cs constructor / startup sequence
      - current/decomp/KSA/ModLibrary.cs PrepareAll, LoadAll, AttachGameData
      - current/decomp/KSA/Mod.cs PrepareSystems
    lifecycle: [startup:starmap-before-main, startup:immediate-load, startup:asset-load, startup:all-mods-loaded, startup:game-loaded]
    approaches:
      - n: 1
        title: StarMapBeforeMain - patch code that runs during startup
        mod: realatmospheres
        features: [mods/starmap/features/startup-lifecycle-hooks, mods/realatmospheres/features/reflection-only-mod-build, mods/shaderextensions/features/duck-typed-attribute-api]
        technique: starmap-lifecycle
        note: Only loader-level work is legal; no game state exists. Install Harmony patches on code that runs before AllModsLoaded (Program.Main prefix scans, shader path redirects).
      - n: 2
        title: StarMapImmediateLoad - register data before assets deserialize
        mod: ksa-advancedflightcomputer
        features: [mods/starmap/features/startup-lifecycle-hooks, mods/ksa-advancedflightcomputer/features/superseded-mod-detection-and-settings-import, mods/compendium/features/cross-mod-json-catalog]
        technique: starmap-lifecycle
        note: Per-mod prefix on Mod.PrepareSystems inside PrepareAll, before asset bundles load. Use it to register enum values, markers or data that XML deserialization must already see; mind the signature trap (see diagnose topic).
      - n: 3
        title: StarMapAllModsLoaded - work that needs the full mod set
        mod: ksarmory
        features: [mods/starmap/features/startup-lifecycle-hooks, mods/ksarmory/features/starmap-entry-and-fault-containment, mods/gatos/features/compile-gated-game-seam, mods/ksaero/features/game-version-check]
        technique: starmap-lifecycle
        note: Postfix on ModLibrary.LoadAll, before GPU upload, AttachGameData and universe load. Typical for installing the bulk of Harmony patches, version checks, logging setup and background warm-ups.
    related: [diagnose-a-starmap-hook-that-never-fires, game-loop-and-lifecycle, warm-up-hot-code-at-load, contain-exceptions-in-starmap-hooks, patch-a-lazily-loaded-game-assembly]
    borrowed_from: [mods/compendium/features/cross-mod-json-catalog]

  - slug: diagnose-a-starmap-hook-that-never-fires
    title: Diagnose a StarMap hook that never fires
    summary: Why a lifecycle method is silently skipped - non-public method, wrong parameter list (the zero-argument StarMapImmediateLoad trap), a second [StarMapMod] class, attribute type mismatch - and how to verify what StarMap bound.
    game_types: []
    engine_pointers: [StarMap.Core attribute discovery and signature validation (see mods/starmap pages)]
    lifecycle: [startup:starmap-before-main, startup:immediate-load]
    approaches:
      - n: 1
        title: Signature checklist against StarMap's binding rules
        mod: starmap
        features: [mods/starmap/features/attribute-hook-discovery, mods/ksarmory/features/starmap-entry-and-fault-containment]
        technique: starmap-lifecycle
        note: StarMap matches attribute types by name, takes the first [StarMapMod] class, requires public methods with exact parameter lists and dispatches by MethodInfo.Invoke with no handler. Includes a firing-point table (ksarmory) verified against the 5554 decomp and logging probes to prove a hook ran.
    related: [choose-a-starmap-startup-hook, contain-exceptions-in-starmap-hooks, discover-plugins-by-attribute-name, game-loop-and-lifecycle]
    borrowed_from: []

  - slug: discover-plugins-by-attribute-name
    title: Discover plugins by attribute name across load contexts
    summary: Build your own plugin or hook scan that survives version skew and separate AssemblyLoadContexts by matching attributes by full type name instead of type identity.
    game_types: []
    engine_pointers: [System.Reflection.CustomAttributeData, System.Runtime.Loader.AssemblyLoadContext.All]
    lifecycle: [startup:starmap-before-main]
    approaches:
      - n: 1
        title: StarMap's name-based attribute binding
        mod: starmap
        features: [mods/starmap/features/attribute-hook-discovery]
        technique: reflection
        note: Compare attribute type names, then validate signatures with the host's own attribute instances. Shows the host side of the contract.
      - n: 2
        title: Scan every AssemblyLoadContext with GetCustomAttributesData
        mod: shaderextensions
        features: [mods/shaderextensions/features/duck-typed-attribute-api]
        technique: reflection
        note: A Program.Main prefix enumerates all contexts, matches look-alike attributes copied into consumer assemblies, closes a generic registration method over the consumer type and fills static delegate fields. No assembly reference between mods.
    related: [share-types-between-mods, diagnose-a-starmap-hook-that-never-fires]
    borrowed_from: [mods/shaderextensions/features/duck-typed-attribute-api]

  - slug: clean-up-on-game-exit
    title: Clean up threads, processes and files when the game exits
    summary: Release what the mod owns at shutdown with StarMapUnload, know when it does not run (Environment.Exit paths), and reset static state so a reload or second init starts clean.
    game_types: [KSA.Program]
    engine_pointers: [current/decomp/KSA/Program.cs Main, Dispose]
    lifecycle: [event:shutdown, thread:background]
    approaches:
      - n: 1
        title: StarMapUnload plus ProcessExit for exit paths that skip it
        mod: starmap
        features: [mods/starmap/features/unload-and-shutdown, mods/ksa-measuretools/features/resilient-patching-and-diagnostics]
        technique: starmap-lifecycle
        note: StarMapUnload runs after Main returns, Program.Dispose and StarMap's global UnpatchAll, so GPU, window and audio state is already gone. Pair with AppDomain.ProcessExit for Environment.Exit. MeasureTools resets every static on unload.
    related: [relaunch-the-game-from-a-mod, contain-exceptions-in-starmap-hooks]
    borrowed_from: []

  - slug: relaunch-the-game-from-a-mod
    title: Relaunch the game process from inside a mod
    summary: Restart KSA after a change that only applies at startup (newly enabled mods, config) by starting the current executable again with the correct working directory and arguments, then exiting cleanly.
    game_types: [KSA.ModLibrary, KSA.ModEntry, KSA.Popup]
    engine_pointers: [current/decomp/KSA/ModLibrary.cs PrepareAll, current/decomp/KSA/ConfirmMods.cs]
    lifecycle: [startup:asset-load]
    approaches:
      - n: 1
        title: Harmony prefix on ModLibrary.PrepareAll plus Process.Start --restarted
        mod: starmap
        features: [mods/starmap/features/new-mods-restart-flow, mods/starmap/features/startup-modal-popup]
        technique: harmony-prefix
        note: Detects New manifest entries the player just enabled, shows a restart popup, relaunches StarMap.exe with --restarted and exits. Shows the cleanest relaunch inputs (MainModule path, working directory, forwarded args).
    related: [ksa-mod-folders-and-manifest, clean-up-on-game-exit]
    borrowed_from: [mods/starmap/features/startup-modal-popup]

  - slug: separate-game-instances
    title: Run separate KSA instances with different user-data folders
    summary: Redirect the KSA documents folder (settings, saves, logs, manifest, local mods) per instance with -InstancePath or STARMAP_INSTANCE_PATH so test and play profiles do not mix.
    game_types: [KSA.Constants]
    engine_pointers: [current/decomp/KSA/Constants.cs DocumentsFolderPath, LogsFolderPath]
    lifecycle: [startup:starmap-before-main]
    approaches:
      - n: 1
        title: Manual Harmony prefix on Constants.DocumentsFolderPath
        mod: starmap
        features: [mods/starmap/features/instance-path-override]
        technique: harmony-prefix
        note: Borrowed from persistence. Explains what moves with the folder, why a mod must use Constants paths rather than hard-coded Documents locations, and the argument/env precedence.
    related: [write-a-per-mod-log-file, ksa-mod-folders-and-manifest, run-and-debug-a-starmap-mod-from-an-ide]
    borrowed_from: [mods/starmap/features/instance-path-override]

  # ------------------------------------------------------------------ build and deploy
  - slug: reference-game-assemblies-from-a-mod-project
    title: Reference the game's assemblies from a mod project without shipping them
    summary: Point a csproj at the installed KSA DLLs (KSA.dll, Brutal.*, Planet*, Tomlet and friends) with Private=false so builds compile against the real API but never copy or redistribute game files.
    game_types: []
    engine_pointers: [KSA install folder managed DLLs (KSA.dll, Brutal.*.dll, Planet.*.dll, RenderCore.dll)]
    lifecycle: []
    approaches:
      - n: 1
        title: KsaDir property with wildcard Reference items and HintPath
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/props-based-build, mods/ksaero/features/mod-deploy-targets]
        technique: msbuild
        note: A shared .props holds KSADir, NuGet StarMap.API and Harmony, and an item transform that turns a DLL glob into References with Private=False.
      - n: 2
        title: Tiered KsaDllDir resolution in Directory.Build.props
        mod: ksagolf
        features: [mods/ksagolf/features/content-and-code-mod-layout]
        technique: msbuild
        note: Environment variable, local override and well-known install locations are tried in order so contributors and CI use the same project file.
      - n: 3
        title: Shared KSADLLs.props glob for several mods
        mod: kittenextensions
        features: [mods/kittenextensions/features/msbuild-mod-toml-generation]
        technique: msbuild
        note: One props file shared across KittenExtensions, ShaderExtensions and MPFX globbing Brutal*.dll, KSA.dll, Planet*.dll and Tomlet.dll; the same file is what CI points at a private DLL checkout.
    related: [deploy-a-mod-on-every-build, build-a-mod-without-game-references, build-in-ci-without-the-game-installed]
    borrowed_from: []

  - slug: deploy-a-mod-on-every-build
    title: Deploy a mod into the game's mods folder on every build
    summary: Make F5 or dotnet build leave a runnable mod in the KSA mods folder, with a clear message when the game is running and holding the DLL, and a consistent payload list.
    game_types: [KSA.Constants]
    engine_pointers: [current/decomp/KSA/Constants.cs DocumentsFolderPath (Documents/My Games/Kitten Space Agency/mods)]
    lifecycle: []
    approaches:
      - n: 1
        title: Imported ModDeploy.targets with locked-DLL diagnosis
        mod: ksaero
        features: [mods/ksaero/features/mod-deploy-targets, mods/ksa-deltavmap/features/mod-deploy-targets-and-release, mods/ksa-measuretools/features/mod-deploy-targets-and-release]
        technique: msbuild
        note: AfterTargets=Build copies DLL and mod.toml with a single-attempt copy that names the running game when the file is locked, plus launch profile and deploy stamp. The same file is used by three repos.
      - n: 2
        title: OutputPath straight into the mods folder
        mod: ksa-aircrafthud
        features: [mods/ksa-aircrafthud/features/props-based-build]
        technique: msbuild
        note: Simplest possible - set OutputPath to the user mods folder and mark content CopyToOutputDirectory. No target needed, no cleanup of stale files.
      - n: 3
        title: Explicit payload list shared by deploy and packaging
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/mod-deploy-msbuild-targets, mods/ksarmory/features/build-deploy-package-release]
        technique: msbuild
        note: One payload item list drives both the deploy copy and the release zip, with a running-game check; includes per-RID native payloads.
      - n: 4
        title: Post-build copy with an overridable game directory
        mod: ohmystars
        features: [mods/ohmystars/features/mod-root-and-packaging, mods/kitten-engineer-redux/features/dist-zip-and-post-build-deploy, mods/gatos/features/build-deploy-and-ci]
        technique: msbuild
        note: A plain PostBuild target with a KSAGameDir override; kitten-engineer-redux also copies ModMenu.Attributes.dll. Lowest ceremony, no running-game diagnosis.
    related: [reference-game-assemblies-from-a-mod-project, package-a-mod-release-zip, run-and-debug-a-starmap-mod-from-an-ide, ship-third-party-dlls-with-a-mod]
    borrowed_from: [mods/ksarmory/features/build-deploy-package-release, mods/gatos/features/build-deploy-and-ci]

  - slug: generate-mod-toml-from-msbuild
    title: Generate mod.toml and StarMap dependencies from the project file
    summary: Keep version, id, asset list and [[StarMap.ModDependencies]] in csproj properties and items so mod.toml is written on every build and cannot drift from the code.
    game_types: [KSA.Mod]
    engine_pointers: [current/decomp/KSA/Mod.cs TomlField members that mod.toml must satisfy]
    lifecycle: []
    approaches:
      - n: 1
        title: Shared CopyOutput.targets writing mod.toml
        mod: kittenextensions
        features: [mods/kittenextensions/features/msbuild-mod-toml-generation, mods/shaderextensions/features/generated-mod-toml, mods/mpfx/features/ci-release-pipeline]
        technique: msbuild
        note: ModManifestArray-tagged None items and StarMapModDependency items (with ImportedAssemblies) become TOML; the target also replaces Release/<ModName> and the installed folder each build. Used verbatim by three mods.
    related: [mod-toml-reference, declare-a-mod-dependency, publish-a-release-from-ci]
    borrowed_from: [mods/mpfx/features/ci-release-pipeline]

  - slug: package-a-mod-release-zip
    title: Package a mod release zip
    summary: Produce the exact folder users unzip into their mods directory - mod.toml, DLLs, content, licences - and verify the payload so nothing is missing or stray.
    game_types: []
    engine_pointers: []
    lifecycle: []
    approaches:
      - n: 1
        title: Release target that zips the deployed folder
        mod: ksaero
        features: [mods/ksaero/features/mod-deploy-targets, mods/ksa-deltavmap/features/mod-deploy-targets-and-release, mods/realatmospheres/features/release-packaging-and-deploy]
        technique: msbuild
        note: A Release MSBuild target zips the same files deploy copies; the version comes from the project.
      - n: 2
        title: Payload list verified file by file
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/mod-deploy-msbuild-targets, mods/ksacars/features/package-deploy-release, mods/ksagolf/features/packaging-and-release]
        technique: msbuild
        note: Check the zip against the declared payload and fail on drift; the same list covers native libraries and data files.
      - n: 3
        title: Ship data files and third-party licences with the mod
        mod: ohmystars
        features: [mods/ohmystars/features/mod-root-and-packaging]
        technique: msbuild
        note: Content items with TargetPath, plus a NOTICE for GPL/CC BY-SA data. Also the pitfall of a hand-committed dist zip going stale (kitten-engineer-redux).
    related: [publish-a-release-from-ci, ship-third-party-dlls-with-a-mod, ship-native-libraries-with-a-mod]
    borrowed_from: [mods/ksacars/features/package-deploy-release, mods/ksagolf/features/packaging-and-release, mods/realatmospheres/features/release-packaging-and-deploy]

  - slug: build-in-ci-without-the-game-installed
    title: Build a mod in CI when the game DLLs are private
    summary: Compile mods on GitHub Actions without redistributing KSA - fetch a private DLL repository with a GitHub App token, use stripped reference assemblies keyed by game build, or compile a game-free subset - and keep the tested game version in one place.
    game_types: []
    engine_pointers: [KSA install managed DLLs, version constant read by both CI and the mod]
    lifecycle: []
    approaches:
      - n: 1
        title: Private DLL repository fetched with a GitHub App token
        mod: kittenextensions
        features: [mods/kittenextensions/features/msbuild-mod-toml-generation, mods/mpfx/features/ci-release-pipeline, mods/shaderextensions/features/ci-build-and-release]
        technique: github-actions
        note: The KSADLLs.props glob is pointed at a checked-out private repo; release triggers on VersionPrefix change and publishes to GitHub and SpaceDock.
      - n: 2
        title: Refasmer reference assemblies stored per game build
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/ci-reference-assemblies]
        technique: github-actions
        note: Strip installed DLLs to API-only references, keep them in a private bucket keyed by build, fetch by the TestedGameVersion constant; nightlies are promoted to releases without rebuilding.
      - n: 3
        title: Compile-gated game seam
        mod: gatos
        features: [mods/gatos/features/compile-gated-game-seam, mods/gatos/features/build-deploy-and-ci]
        technique: msbuild
        note: Game-facing code lives in a folder removed from compilation when KSA.dll is absent, with partial methods bridging; CI builds and unit-tests the rest with no game at all.
    related: [build-a-mod-without-game-references, publish-a-release-from-ci, reference-game-assemblies-from-a-mod-project]
    borrowed_from: [mods/mpfx/features/ci-release-pipeline, mods/shaderextensions/features/ci-build-and-release, mods/ksa-advancedflightcomputer/features/ci-reference-assemblies, mods/gatos/features/build-deploy-and-ci]

  - slug: publish-a-release-from-ci
    title: Publish a mod release to GitHub and SpaceDock from CI
    summary: Automate release - read the tested game version and version number from the source, package the zip, tag, upload to SpaceDock and GitHub - and ship tools with an installer when the mod is more than a folder.
    game_types: []
    engine_pointers: []
    lifecycle: []
    approaches:
      - n: 1
        title: Workflow reading the tested game version from Mod.cs
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/mod-deploy-targets-and-release, mods/ksa-measuretools/features/mod-deploy-targets-and-release]
        technique: github-actions
