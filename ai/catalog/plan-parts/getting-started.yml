  - slug: contain-exceptions-in-starmap-hooks
    title: Keep mod exceptions out of KSA's frame loop
    summary: StarMap invokes hooks without a handler, so an exception in a per-frame hook can take down the frame; wrap every hook, count consecutive faults, log the first of a streak, then disable the mod and undo its side effects.
    game_types: [KSA.Program]
    engine_pointers: [current/decomp/KSA/Program.cs OnFrame, OnDrawUiViewports (no catch)]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui, frame:after-on-frame, event:shutdown]
    approaches:
