  - flight-and-orbits/draw-a-predicted-trajectory
  - flight-and-orbits/set-orbit-line-visibility-and-color
- slug: upload-an-image-as-a-vulkan-texture
  title: Upload an image or procedural pixels as a GPU texture
  summary: Load PNG or KTX bytes, or generate pixels in code, into a SimpleVkTexture with mip levels and a sampler, and expose
    it to shaders through a bindless slot.
  game_types:
  - RenderCore.SimpleVkTexture
  - Brutal.TextureApi.TextureLoader
  - KSA.BindlessTextures
