  - mods/ksa-measuretools/features/live-body-relative-anchors
  - mods/ksa-measuretools/features/part-anchor-rehoming
  - mods/ksa-measuretools/features/part-mesh-raycast-picking
  - mods/ksagolf/features/cursor-picking-and-terrain-ray
  - mods/ksarmory/features/cursor-ray-world-click-tools
  merged_from:
  - choose-ecl-or-ego-positions-for-rendering
  - keep-effects-fixed-to-a-rotating-body
  - anchor-rendered-objects-to-parts-and-terrain
  - pick-a-surface-point-under-the-cursor
  dedupe_with:
  - flight-and-orbits/understand-ksa-coordinate-frames
  - flight-and-orbits/anchor-a-point-to-a-rotating-body
  - flight-and-orbits/sample-positions-at-a-consistent-epoch
