category: rendering
description: Drawing things the game does not draw by itself - ImGui overlays on the sky and world, custom Vulkan passes,
  textures, meshes, lights, particles, plumes and decals - plus the Vulkan resource discipline that keeps those additions
  alive across frames, resizes and shutdown.
topics:
- slug: project-world-positions-to-screen
  title: Project world and sky positions to screen pixels
  summary: Turn a position in the game's frames into an ImGui screen coordinate, including the cases the engine call does
    not handle for you - behind the camera, off the edge, inside the viewport's pixel offset and far-away directions that
    are not real points. Also covers hiding overlay points behind planets and vessels with a CPU ray-sphere occlusion test,
    since ImGui has no depth buffer.
  game_types:
  - KSA.Camera
  - KSA.IViewport
  - KSA.Program
  - KSA.GalacticPlane
  - KSA.IOrbiter
  - KSA.IParentBody
  - KSA.StellarBody
  - KSA.Vehicle
  engine_pointers:
  - current/decomp/KSA/Camera.cs EgoToScreen, EclToScreen, EgoToClip, IsPointWithinFov, GetPositionEgo
  - current/decomp/KSA/Universe.cs DrawGalacticGrid (stock reference for skipping NaN and clipping)
  - current/decomp/KSA/Camera.cs GetPositionEgo
  - current/decomp/KSA/IOrbiter.cs Parent
  lifecycle:
  - frame:draw-ui
  approaches:
  - n: 1
    title: Ego-space direction times a sphere radius, then Camera.EgoToScreen plus viewport origin
    mod: ohmystars
    features:
    - mods/ohmystars/features/sky-overlay-lines-and-labels
    technique: sky-projection
    note: Sky directions have no distance, so they are placed on the same 19.5-unit camera-centred sphere the star sprites
      use; NaN results (behind the camera) are skipped and the ImGui main viewport origin is added. Straight screen segments
      between projected endpoints are exact great circles under perspective.
  - n: 2
    title: Body-fixed or orbit-relative anchors lifted to ecliptic, then Camera.EclToScreen
    mod: ksarmory
    features:
    - mods/ksarmory/features/world-anchored-screen-markers
    - mods/ksa-deltavmap/features/map-mode-transfer-overlay
    technique: imgui-drawlist
    note: Real points are projected through the viewport's own camera; constant-pixel-size brackets, a crossed variant when
      the target is behind a planet and an edge arrow when it is off-screen. Map mode computes parent CCE positions from Orbit
      and lifts them with GetPositionEclFromCce.
  - n: 3
    title: Clip-space edge clamp for off-screen and behind-camera targets
    mod: compendium
    features:
    - mods/compendium/features/body-pointer-overlay
    - mods/ohmystars/features/star-pointer
    technique: imgui-drawlist
    note: IsPointWithinFov first, otherwise EgoToClip divided by w with the sign flipped for w<0 and scaled to the viewport
      rectangle. This is the reusable core of a pointer to anything not currently visible.
  - n: 4
    title: Per-frame ego-space sphere list and ray test per overlay point
    mod: ohmystars
    features:
    - mods/ohmystars/features/overlay-occlusion-by-bodies
    technique: cpu-occlusion
    note: '[Folded from occlude-overlays-behind-bodies: visibility sub-step (own section): CPU ray-sphere test so overlays
      hide behind planets.] Bodies by MeanRadius and vehicles by bounding sphere, walked from the camera-followed object up
      to the root via IOrbiter.Parent and down via IParentBody.Children. Covers the cost trade-offs and the spheres to skip.'
  related:
  - choose-a-draw-list-for-world-overlays
  - draw-lines-on-the-sky
  - choose-a-render-frame-and-anchor-effects
  borrowed_from:
  - mods/ksarmory/features/world-anchored-screen-markers
  - mods/ksa-deltavmap/features/map-mode-transfer-overlay
  - mods/compendium/features/body-pointer-overlay
  - mods/ohmystars/features/star-pointer
  merged_from:
  - occlude-overlays-behind-bodies
  dedupe_with:
  - ui/project-world-to-screen
  - camera/work-in-the-cameras-ego-frame
  - ui/cull-overlapping-labels
- slug: choose-a-render-frame-and-anchor-effects
  title: Choose a render frame and anchor effects to bodies, parts and terrain
  summary: Ecl positions keep the 29.8 km/s orbital carrier and move hundreds of metres per frame; ego positions are camera-relative
    translations of Ecl. Pick the right frame and sample instant or an overlay will lag, jitter or drift from the craft it
    should hug. Also covers keeping effects fixed to a rotating planet, anchoring quads, stickers and decals to parts, cloth
    or terrain so they follow every frame, and picking the anchor point under the cursor.
  game_types:
  - KSA.Camera
  - KSA.Vehicle
  - KSA.GizmosRenderer
  - KSA.PartModel
  - KSA.Celestial
  - KSA.ExplosionSystem
  - KSA.ParticleEmitter
  - KSA.StaticMeshRenderable
  - KSA.Part
  - KSA.PartTree
  - KSA.Cursor
  engine_pointers:
  - current/decomp/KSA/Camera.cs GetPositionEgo, EclToEgo
  - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
  - current/decomp/KSA/GizmosRenderer.cs
  - current/decomp/KSA/ExplosionSystem.cs SpawnPreset (BubbleOrigin)
  - current/decomp/KSA/Celestial.cs (body-fixed frame helpers)
  - current/decomp/KSA/Part.cs
  - current/decomp/KSA/Cursor.cs GetEgoRay
  - current/decomp/KSA/Part.cs RayCastEgo
  lifecycle:
  - frame:draw-ui
  - frame:apply-solvers
  - frame:render
  - frame:celestials
  - frame:pre-render
  - frame:input
  approaches:
  - n: 1
    title: Two-instant draw anchor against GetPositionEgo
    mod: ksagolf
    features:
    - mods/ksagolf/features/frame-epoch-draw-anchor
    technique: reference-frames
    note: Pair the craft's rendered Ego position sampled this frame with Ecl offsets measured against the same-instant platform
      sample, so overlays do not slide 500 m per frame.
  - n: 2
    title: Anchor to the engine's own render position and add travel since launch
    mod: ksarmory
    features:
    - mods/ksarmory/features/gizmo-world-overlays
    - mods/ksarmory/features/rounds-as-hidden-launcher-subparts
    technique: ego-anchor
    note: Gizmos and projectile subparts placed relative to where the engine draws the launcher, with Ego a pure translation
      of Ecl; shows when to use Ecl at GetElapsedTime versus the rendered sample.
  - n: 3
    title: Explosion presets with a BubbleOrigin fixed in the body frame
    mod: ksarmory
    features:
    - mods/ksarmory/features/ksa-explosions-from-a-point
    technique: body-fixed-anchor
    note: '[Folded from keep-effects-fixed-to-a-rotating-body: body-fixed anchoring sub-step (own section): effects, emitters
      and meshes stay on a rotating planet.] Anchored to the ground the burst happened over rather than the target craft;
      ambient pressure fed to the pressure-gated stages.'
  - n: 4
    title: Pooled emitters re-anchored to the celestial's rotating frame every frame
    mod: ksarmory
    features:
    - mods/ksarmory/features/pooled-particle-emitters
    technique: emitter-reanchoring
    note: '[Folded from keep-effects-fixed-to-a-rotating-body: body-fixed anchoring sub-step (own section): effects, emitters
      and meshes stay on a rotating planet.] Re-point following emitters each frame so smoke stays on the rotating body.'
  - n: 5
    title: Body-fixed mesh with Ccf-to-Cce rotation and body position at draw time
    mod: ksagolf
    features:
    - mods/ksagolf/features/mod-mesh-draw-hook
    technique: runtime-mesh-draw
    note: '[Folded from keep-effects-fixed-to-a-rotating-body: body-fixed anchoring sub-step (own section): effects, emitters
      and meshes stay on a rotating planet.] Course pieces and ball are stored body-fixed and turned into per-viewport ego
      transforms in the draw hook.'
  - n: 6
    title: Part-local, cloth-barycentric or geodetic anchors with double-precision composition
    mod: unscience
    features:
    - mods/unscience/features/graffiti-decal-anchoring
    technique: double-precision-transforms
    note: '[Folded from anchor-rendered-objects-to-parts-and-terrain: part/cloth/terrain anchoring sub-step (own section):
      anchors that survive staging, docking and floating-origin shifts.] Stable ids re-resolved each frame and a decal-to-ego
      box recomposed in double precision; follows staging, parachute inflation and planet rotation.'
  - n: 7
    title: Part transform times user offset in ego space, or a view-space billboard
    mod: purrtty
    features:
    - mods/purrtty/features/anchor-quad-to-part-or-camera
    technique: vulkan-pipeline
    note: '[Folded from anchor-rendered-objects-to-parts-and-terrain: part/cloth/terrain anchoring sub-step (own section):
      anchors that survive staging, docking and floating-origin shifts.] Follows the same Part object by reference identity
      through decoupling and docking; camera-fixed billboard variant for HUD-like quads.'
  - n: 8
    title: Attach a quad via the part's ego matrix
    mod: gatos
    features:
    - mods/gatos/features/thug-life-world-space-quad
    technique: harmony-postfix
    note: '[Folded from anchor-rendered-objects-to-parts-and-terrain: part/cloth/terrain anchoring sub-step (own section):
      anchors that survive staging, docking and floating-origin shifts.] Ego-space model matrix from GetMatrixAsmb2Ego computed
      in the render hook.'
  - n: 9
    title: Armed placement mode casting against cloth triangles, view meshes, kitten sphere and a CPU terrain march
    mod: unscience
    features:
    - mods/unscience/features/graffiti-decal-placement-picking
    technique: raycast-picking
    note: '[Folded from pick-a-surface-point-under-the-cursor: cursor-picking sub-step (own section): turn a click ray into
      a surface anchor, as an armed one-shot placement mode.] Cursor.GetEgoRay, Part.RayCastEgo, then terrain stepping; a
      one-shot ImGui click mode.'
  - n: 10
    title: Ray.RaycastWatertight plus terrain march and bisection
    mod: gatos
    features:
    - mods/gatos/features/sticker-projected-decals
    technique: raycast-picking
    note: '[Folded from pick-a-surface-point-under-the-cursor: cursor-picking sub-step (own section): turn a click ray into
      a surface anchor, as an armed one-shot placement mode.] Same goal with the engine''s watertight ray cast against parts
      and a bisected terrain hit.'
  related:
  - draw-world-space-lines-and-gizmos
  - spawn-particle-effects
  - draw-mod-meshes-with-the-engine-renderers
  - project-decals-onto-scene-geometry
  - draw-a-textured-quad-in-the-world
