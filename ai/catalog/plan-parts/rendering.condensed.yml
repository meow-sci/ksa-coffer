- slug: choose-a-draw-list-for-world-overlays
  title: Choose the ImGui draw list for sky and world overlays
  summary: Every 2D overlay on the 3D view (constellation lines, brackets, measurement lines, map markers, gunner sights)
    is an ImGui draw list written after the game has computed the camera. The choice of window versus background, foreground
    or per-viewport list decides whether the overlay sits under panels, receives clicks, follows a torn-off monitor and survives
    the HUD being hidden. Also covers keeping per-frame render work (overlays, subpart poses, light submissions) running when
    the HUD is hidden.
  game_types:
  - KSA.ImGuiHelper
  - KSA.Program
  - KSA.IViewport
  - KSA.ViewportRegistry
  engine_pointers:
  - current/decomp/KSA/ImGuiHelper.cs GetOverlayDrawList
  - current/decomp/KSA/Program.cs OnDrawUiViewports (StarMapAfterGui postfix point)
  - current/decomp/KSA/ViewportRegistry.cs GameViews and MainViewport
  - current/decomp/KSA/Program.cs OnDrawUiViewports, OnFrame
  lifecycle:
  - frame:draw-ui
  - frame:after-on-frame
  approaches:
  - n: 1
    title: Transparent NoInputs full-viewport window and its window draw list
    mod: ohmystars
    features:
    - mods/ohmystars/features/sky-overlay-lines-and-labels
    - mods/ksarmory/features/world-anchored-screen-markers
    - mods/compendium/features/body-pointer-overlay
    technique: imgui-drawlist
    note: A window sized to the main viewport with zero background alpha and NoDecoration/NoInputs/NoNav flags, drawn from
      StarMapAfterGui. Clicks fall through to the game; the overlay is z-ordered like a window, so it can land over or under
      panels. Compare the three mods' flag sets.
  - n: 2
    title: ImGuiHelper.GetOverlayDrawList (main-viewport background list)
    mod: ksa-measuretools
    features:
    - mods/ksa-deltavmap/features/map-mode-transfer-overlay
    technique: imgui-drawlist
    note: The stock helper returns the background draw list for the main viewport, the same list the stock body labels and
      Transfer Planner markers use, so content sits under every window. Only meaningful for the main viewport; other viewports
      return the window list. Includes the try/catch-once-per-type guard that keeps a projection bug from breaking the frame.
  - n: 3
    title: Pick the draw list per view (background, clipped window, platform-viewport foreground)
    mod: ksarmory
    features:
    - mods/ksarmory/features/gunner-sight-overlay
    technique: imgui-drawlist
    note: When a camera feed can be the main view, a mod-drawn camera window or a torn-off window on another monitor, resolve
      per frame which list reaches that picture and which camera projects into it.
  - n: 4
    title: FrameLatch with AfterGui and AfterOnFrame fallback
    mod: ksacars
    features:
    - mods/ksacars/features/pose-subparts-at-runtime
    technique: starmap-lifecycle
    note: '[Folded from keep-overlays-updating-when-hud-hidden: HUD-hidden sub-step (own section): StarMapAfterGui is skipped
      when DrawUI is false, so latch per-frame render work with a StarMapAfterOnFrame fallback.] Run once per frame from whichever
      hook fires first.'
  related:
  - project-world-positions-to-screen
  - draw-markers-and-annotations-on-world-objects
  - animate-subparts-from-code
  borrowed_from:
  - mods/ksa-deltavmap/features/map-mode-transfer-overlay
  - mods/ksarmory/features/world-anchored-screen-markers
  - mods/ksarmory/features/gunner-sight-overlay
  - mods/compendium/features/body-pointer-overlay
  merged_from:
  - keep-overlays-updating-when-hud-hidden
  dedupe_with:
  - ui/draw-a-fullscreen-click-through-overlay
  - ui/paint-overlays-on-secondary-and-detached-viewports
  - ui/draw-ui-while-the-hud-is-hidden
  - ui/hide-the-stock-flight-hud
- slug: draw-lines-on-the-sky
  title: Draw lines and labels on the sky
  summary: Draw constellation lines, boundary polylines and star names on KSA's sky from catalog data, sitting under panels
    and tracking the camera, including great-circle lines and small circles that stay correct under perspective. Also covers
    labelled RA/Dec or galactic coordinate grids and converting catalog RA/Dec and galactic coordinates to the ecliptic frame
    the game draws in.
  game_types:
  - KSA.Camera
  - KSA.Universe
  - KSA.GalacticPlane
  - KSA.InstancedStarTechnique
  - Brutal.ImGuiApi.ImGui
  engine_pointers:
  - current/decomp/KSA/Universe.cs DrawGalacticGrid
  - current/decomp/KSA/GalacticPlane.cs EquatorialToEcliptic
  - current/decomp/KSA/InstancedStarTechnique.cs
  - current/decomp/KSA/Universe.cs DrawGalacticGrid (stock grid command to compare with)
  lifecycle:
  - startup:all-mods-loaded
  - frame:draw-ui
  approaches:
  - n: 1
    title: ImGui window draw list from StarMapAfterGui with ego-space sky directions
    mod: ohmystars
    features:
    - mods/ohmystars/features/sky-overlay-lines-and-labels
    technique: imgui-drawlist
    note: 'Catalog RA/Dec to ecliptic, times 19.5, projected per segment, drawn into a NoInputs full-screen window. Cover
      gnomonic projection (straight lines are great circles), subdividing small circles, per-segment culling and label placement.
      Also: [Folded from convert-sky-coordinates-to-the-game-frame: frame-conversion sub-step (own section): J2000 obliquity
      rotation from RA/Dec and galactic to ecliptic.] Matches GalacticPlane.EquatorialToEcliptic; the same direction feeds
      both overlay drawing and orient-to-star targets, so one conversion path is shared.'
  - n: 2
    title: One-degree arcs, clip-space frustum cull and CalcTextSize label rectangles
    mod: ohmystars
    features:
    - mods/ohmystars/features/ra-dec-grid
    technique: imgui-drawlist
    note: '[Folded from draw-a-sky-coordinate-grid: coordinate-grid sub-step (own section): lazy arcs, frustum culling and
      label overlap rejection.] Lazy arc build, 15 percent inflated clip-space test, per-segment occlusion, centred chart
      labels and a per-frame list of drawn rectangles for declutter. Reusable for any labelled screen overlay.'
  related:
  - project-world-positions-to-screen
  - choose-a-draw-list-for-world-overlays
  borrowed_from:
  - mods/ohmystars/features/stellarium-sky-cultures
  merged_from:
  - draw-a-sky-coordinate-grid
  - convert-sky-coordinates-to-the-game-frame
  dedupe_with:
  - ui/point-at-off-screen-targets
- slug: draw-markers-and-annotations-on-world-objects
  title: Draw markers, brackets and measurement annotations on world objects
  summary: Put a bracket on a craft, a lock cue on a contact, a measurement line with a plated label on a hull or a transfer-window
    gizmo in the map view, using projected points on an ImGui draw list rather than Vulkan. Also covers a pointer line from
    a mod window to a selected body or star, clamped at the screen edge when the target is off screen.
  game_types:
  - KSA.Camera
  - KSA.IViewport
  - KSA.ImGuiHelper
  - KSA.Vehicle
  - KSA.Program
  engine_pointers:
  - current/decomp/KSA/TransferPlanner.cs (stock parent/target alignment marker)
  - current/decomp/KSA/ImGuiHelper.cs GetOverlayDrawList
  - current/decomp/KSA/Camera.cs IsPointWithinFov, EgoToClip, EgoToScreen
  lifecycle:
  - frame:draw-ui
  approaches:
  - n: 1
    title: Constant-pixel-size brackets, cues and bars projected from craft and contact positions
    mod: ksarmory
    features:
    - mods/ksarmory/features/world-anchored-screen-markers
    technique: imgui-drawlist
    note: Four overlays (system markers, lock cue, chase HUD, part health bars) sharing one projection pattern, edge arrows
      for off-screen targets, crossed marks for occluded targets, clickable hover labels.
  - n: 2
    title: Lines, curves, rings and plated labels for measurements
    mod: ksa-measuretools
    features:
    - mods/ksa-measuretools/features/overlay-drawlist-rendering
    - mods/ksa-measuretools/features/circle-and-face-angle-tools
    technique: imgui-drawlist
    note: Background list, 3D construction plane and ring overlays drawn as projected polylines; one-shot try/catch-per-exception-type;
      gate on view mode.
  - n: 3
    title: Map-mode markers and gizmos for future positions
    mod: ksa-deltavmap
    features:
    - mods/ksa-deltavmap/features/map-mode-transfer-overlay
    - mods/ksa-advancedflightcomputer/features/multi-pass-preview-rendering
    technique: imgui-drawlist
    note: Markers on the destination's real orbit at window open, phase angle and ejection arms, apsis/node/SOI markers on
      the viewport overlay list. Only valid while the viewport is in Map mode.
  - n: 4
    title: Previous-frame window rectangle plus edge-clamped projection (body target)
    mod: compendium
    features:
    - mods/compendium/features/body-pointer-overlay
    technique: imgui-drawlist
    note: '[Folded from point-at-an-offscreen-target: pointer-line sub-step (own section): line from a window corner to a
      target, clamped to the screen edge when off screen or behind the camera.] Captures the window rectangle during the window
      draw and consumes it next frame; one or two lines from the nearest corners; rainbow colour mode.'
  - n: 5
    title: Same technique for a catalog star on the sky sphere
    mod: ohmystars
    features:
    - mods/ohmystars/features/star-pointer
    technique: imgui-drawlist
    note: '[Folded from point-at-an-offscreen-target: pointer-line sub-step (own section): line from a window corner to a
      target, clamped to the screen edge when off screen or behind the camera.] Target is ApplyAlignment(direction) times
      19.5 or the central star''s ego position; shows the camera-behind w<0 handling.'
  related:
  - choose-a-draw-list-for-world-overlays
  - project-world-positions-to-screen
  - draw-world-space-lines-and-gizmos
  borrowed_from:
  - mods/ksarmory/features/world-anchored-screen-markers
  - mods/ksa-measuretools/features/overlay-drawlist-rendering
  - mods/ksa-measuretools/features/circle-and-face-angle-tools
  - mods/ksa-deltavmap/features/map-mode-transfer-overlay
  - mods/compendium/features/body-pointer-overlay
  - mods/ohmystars/features/star-pointer
  merged_from:
  - point-at-an-offscreen-target
  dedupe_with:
  - ui/point-at-off-screen-targets
  - ui/add-a-navball-marker
  - ui/draw-gizmos-and-meshes-in-the-world
  - flight-and-orbits/draw-markers-and-lines-in-the-map-view
- slug: draw-world-space-lines-and-gizmos
  title: Draw world-space lines and gizmos with the game's own renderers
  summary: Use the game's own gizmo renderer for debug-style world overlays (radar cones, track markers, trails, placement
    markers) that are depth-tested, scale with the scene and need no Vulkan code. Also covers previewing extra predicted orbits
    through the game's own line instances so they look and clip like stock orbits.
  game_types:
  - KSA.GizmosRenderer
  - KSA.Program
  - KSA.FlightPlan
  - KSA.OrbitalTransfers
  engine_pointers:
  - current/decomp/KSA/GizmosRenderer.cs ResetInstances and instance adders
  - current/decomp/KSA/Program.cs (gizmo pass order in Render)
  - current/decomp/KSA/FlightPlan.cs AddLineInstances
  - current/decomp/KSA/TransferPlanner.cs
  lifecycle:
  - frame:draw-ui
  - render:scene-opaque
  - render:gizmos
  - frame:pre-render
  - render:orbit-lines
  approaches:
  - n: 1
    title: Submit spheres and lines from the StarMap GUI postfix between reset and render
    mod: ksarmory
    features:
    - mods/ksarmory/features/gizmo-world-overlays
    technique: gizmo-draw
    note: Radar cones, track markers, trails, shell streaks, placement markers anchored to the engine's render position of
      the platform.
  - n: 2
    title: Gizmos next to a moving craft using a frame-epoch anchor
    mod: ksagolf
    features:
    - mods/ksagolf/features/frame-epoch-draw-anchor
    technique: gizmo-drawing
    note: Submitted between GizmosRenderer.ResetInstances and the render; anchored with the craft's rendered Ego position
      this frame.
  - n: 3
    title: FlightPlan.AddLineInstances per plan with dimmed colours, postfix hook and quantized cache keys
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/multi-pass-preview-rendering
    technique: harmony-postfix
    note: '[Folded from draw-extra-orbit-lines-with-the-game-line-renderer: orbit-line sub-step (own section): the game''s
      line instances for extra predicted orbits in the 3D and map views.] One FlightPlan per planned pass, dimmed colours,
      apsis/node/SOI markers on the viewport overlay list; previews cached behind quantized input keys.'
  related:
  - choose-a-render-frame-and-anchor-effects
  - draw-markers-and-annotations-on-world-objects
  borrowed_from:
  - mods/ksa-advancedflightcomputer/features/planner-preview-trajectories
  merged_from:
  - draw-world-space-gizmos
  - draw-extra-orbit-lines-with-the-game-line-renderer
  dedupe_with:
