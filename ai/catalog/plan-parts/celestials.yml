- slug: check-line-of-sight-across-terrain
  title: Test whether a ridge hides one point from another
  summary: 'A sensor, a radio link or a camera needs to know whether the planet''s terrain blocks the line between
    two points. Test the segment against the mean sphere first, then sample the real height field only inside the
    band below the terrain ceiling, with a fixed sample budget. It also covers the terrain ceiling those band tests
    need: Celestial.MaxTerrainHeightApprox is a 16,384-direction sample taken in the constructor and underestimates
    peaks, so use Astronomical.MaxTerrainRadius minus MeanRadius plus about 8,000 m of headroom for procedural modifiers.'
  game_types: [KSA.Celestial, KSA.Astronomical]
  engine_pointers: [current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCce, current/decomp/KSA/Celestial.cs
      MaxTerrainHeightApprox (_maxTerrainHeightApprox), current/decomp/KSA/Astronomical.cs MaxTerrainRadius]
