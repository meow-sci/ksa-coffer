category: celestials
description: 'Celestial data and surface placement: star systems and the body tree, atmosphere, cloud and ring data,
  star catalogs, terrain queries and modifiers, static objects on a planet surface and ground clutter.'
topics:
- slug: enumerate-star-systems-and-bodies
  title: Enumerate every star system, star, planet and moon of the loaded universe
  summary: One loaded universe can hold several star systems, each rooted at a FixedStar or a Barycenter, with stars,
    planets, moons, minor bodies and even vehicles all reachable from the same tree. This topic shows the three
    walks mods use (roots then Children, a flat CelestialSystem.All scan, and a UI-selected root) and the type traps
    in each (the star is a StellarBody and not a Celestial, Children also lists vehicles).
  game_types: [KSA.Universe, KSA.CelestialSystem, KSA.IIndependentRoot, KSA.IParentBody, KSA.IOrbiter, KSA.Astronomical,
    KSA.Celestial, KSA.StellarBody, KSA.FixedStar, KSA.OrbitingStar, KSA.Barycenter]
  engine_pointers: ['current/decomp/KSA/Universe.cs LoadSystem (caches Roots, Stars, WorldSun)', 'current/decomp/KSA/CelestialSystem.cs
      All, CreateTreeFromRoot, HomeBody', current/decomp/KSA/IIndependentRoot.cs RootOf, current/decomp/KSA/IParentBody.cs
      Children]
  lifecycle: ['startup:game-loaded', 'frame:draw-ui', 'frame:viewports']
  approaches:
  - n: 1
    title: Roots then IParentBody.Children into an immutable forest
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/live-celestial-system-graph]
    technique: system-graph
    note: CelestialSystem.All.OfType<IIndependentRoot>() then recursive IParentBody.Children, keeping only children
      that are IParentBody and Astronomical so vehicles drop out; children sorted once (bound orbits by semi-major
      axis, open orbits after).
  - n: 2
    title: Universe.Roots, RootOf and a selected root, collecting only Celestial or only stars
    mod: compendium
    features: [mods/compendium/features/star-systems-and-body-tree]
    technique: game-object-graph
    note: Universe.Roots span, IIndependentRoot.RootOf(body) walks Parent upward, CollectAllCelestials recurses
      Children through stars and barycenters, CollectSystemStars finds the star-like children. Includes the Children-moved-to-IParentBody
      API note.
  - n: 3
    title: Flat scan of CurrentSystem.All plus an explicit WorldSun
    mod: gatos
    features: [mods/gatos/features/celestial-body-catalog-reads]
    technique: immutable-snapshot
    note: All.UnsafeAsList() holds every Astronomical; the root star is a StellarBody and not a Celestial so the
      reader adds Universe.WorldSun itself when the walk did not list it. Cheapest walk when parent/child structure
      is not needed (read Parent per body instead).
  related: [handle-multi-star-systems-and-barycenters, cache-derived-data-per-loaded-celestial-system, read-celestial-orbit-and-body-data,
    attach-extra-data-to-bodies-by-stable-key, reparent-a-celestial-body, detect-vessel-and-soi-changes-from-ui]
  borrowed_from: []
- slug: handle-multi-star-systems-and-barycenters
  title: Handle multiple star systems, barycenters and moving world suns correctly
  summary: 'Interstellar content means a root is not always a star: Barycenter.IsStar() is false, OrbitingStar is
    an IOrbiter under a barycenter, exoplanets may be authored as MinorBody, and Universe.WorldSun follows the camera
    each frame. This topic collects the rules that keep a body list, a map or a selector correct for any loaded
    universe.'
  game_types: [KSA.Barycenter, KSA.FixedStar, KSA.OrbitingStar, KSA.StellarBody, KSA.MinorBody, KSA.IIndependentRoot,
    KSA.Universe, KSA.Celestial]
  engine_pointers: [current/decomp/KSA/Barycenter.cs IsStar, current/decomp/KSA/OrbitingStar.cs, current/decomp/KSA/FixedStar.cs,
    current/decomp/KSA/Universe.cs UpdateWorldSun / WorldSun, current/decomp/KSA/Program.cs Render (moves WorldSun
      to the star nearest the camera)]
  lifecycle: ['startup:game-loaded', 'frame:draw-ui']
  approaches:
  - n: 1
    title: Role rules in a game-type-free ForestRules class
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/live-celestial-system-graph]
    technique: system-graph
    note: StellarBody means star, a non-star IIndependentRoot means barycenter, hubs have no surface; MinorBody
      children of a barycenter with no major planet are treated as that system planets; IsMoon misfires under barycenters
      so test the parent type. Rules are kept free of game types so they unit-test offline.
  - n: 2
    title: Keep your own selected root because WorldSun is not stable
    mod: compendium
    features: [mods/compendium/features/star-systems-and-body-tree]
    technique: game-object-graph
    note: GetSelectedRoot keeps the player choice while it is still in Universe.Roots and only falls back to the
      root of WorldSun, which Program.Render moves to the nearest star every frame. Also covers OrbitingStar facts,
      distance in light years from HomeBody root.
  related: [enumerate-star-systems-and-bodies, read-celestial-orbit-and-body-data, plan-multi-leg-delta-v-routes,
    estimate-interstellar-trip]
  borrowed_from: []
- slug: attach-extra-data-to-bodies-by-stable-key
  title: Key per-body data so it survives repeated ids and extra star systems
  summary: 'Body ids repeat across systems and moons share names, so mod data about bodies (descriptions, categories,
    overrides) needs a key that is unique and resolvable back to the live object. Two designs are shown: a dotted
    parent-path key resolved by tree search, and a prefix-keyed JSON catalog that other mods can extend without
    referencing your assembly.'
  game_types: [KSA.Celestial, KSA.IIndependentRoot, KSA.CelestialSystem]
  engine_pointers: ['current/decomp/KSA/Celestial.cs Parent, Id', current/decomp/KSA/IIndependentRoot.cs RootOf]
  lifecycle: ['startup:immediate-load', 'startup:game-loaded', 'frame:draw-ui']
  approaches:
  - n: 1
    title: Dotted path of Celestial ids from the top-level body down
    mod: compendium
    features: [mods/compendium/features/star-systems-and-body-tree]
    technique: game-object-graph
    note: Key like Jupiter.Io built by walking Celestial.Parent and stopping at the star; FindCelestialByKey matches
      the last segment and the parent depth-first under a root; the data lookup further prefixes root or system
      id.
  - n: 2
    title: Prefix-keyed JSON files discovered in every installed mod folder
    mod: compendium
    features: [mods/compendium/features/cross-mod-json-catalog, mods/compendium/features/derived-body-properties]
    technique: json-config
    note: A file counts only if its root has the marker key; each other root key is a system or star-root prefix,
      with deterministic precedence so another mod can add bodies or override text. Entries are attached to live
      bodies on the first UI frame with a universe.
  related: [enumerate-star-systems-and-bodies, cache-derived-data-per-loaded-celestial-system, find-own-mod-folder]
  borrowed_from: [mods/compendium/features/cross-mod-json-catalog]
- slug: cache-derived-data-per-loaded-celestial-system
  title: Cache derived body data per loaded system without going stale
  summary: 'Body mass, radius, orbit elements and templates are constant for a loaded system, so recomputing them
    each frame is waste, but the cache must die when the system is reloaded or a body object is replaced. Three
    invalidation strategies are shown: a reference latch on CurrentSystem, a ConditionalWeakTable keyed by body,
    and a once-only attach on the first UI frame that has a universe.'
  game_types: [KSA.Universe, KSA.CelestialSystem, KSA.Celestial, KSA.IParentBody, KSA.Orbit]
  engine_pointers: ['current/decomp/KSA/Universe.cs CurrentSystem, LoadSystem, DeserializeSave', current/decomp/KSA/CelestialSystem.cs]
  lifecycle: ['frame:draw-ui', 'frame:viewports', 'startup:game-loaded']
  approaches:
  - n: 1
    title: Latch on the Universe.CurrentSystem reference, not its Id
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/live-celestial-system-graph]
    technique: per-system-cache
    note: Reloading the same system id builds new body objects, so rebuild the graph, the transfer cost cache and
      the palette only when !ReferenceEquals(graph.System, system); everything per-root resets with it.
  - n: 2
    title: ConditionalWeakTable of immutable statics per Celestial
    mod: gatos
    features: [mods/gatos/features/celestial-body-catalog-reads]
    technique: conditional-weak-table-cache
    note: Everything except position and velocity is cached once per body; each sample reads only GetPositionEcl
      and GetVelocityEcl; unchanged lists are re-published by reference so consumers compare cheaply.
  - n: 3
    title: One-shot attach on the first UI frame with a universe
    mod: compendium
    features: [mods/compendium/features/derived-body-properties]
    technique: starmap-lifecycle
    note: Data loaded at immediate-load, before any celestial exists, is matched to bodies the first frame WorldSun
      is set, guarded by a static flag; derived numbers are computed once and only orbital speed is read live.
  related: [enumerate-star-systems-and-bodies, throttle-expensive-ui-computation, detect-vessel-and-soi-changes-from-ui,
    detect-save-load]
  borrowed_from: []
- slug: read-atmosphere-and-ocean-parameters-of-a-body
  title: Read a body's atmosphere, ocean and ring data
  summary: Atmosphere height, sea-level pressure and density, scale height, ocean density and level, and ring presence
    are all reachable from IParentBody and the body template without touching private state. This topic shows how
    to read them safely (either may be null), sample density and pressure by altitude, and turn them into decisions
    such as a low-orbit altitude or a gas-giant test.
  game_types: [KSA.IParentBody, KSA.AtmosphereReference, KSA.PhysicalAtmosphereReference, KSA.Rendering.Water.Data.OceanReference,
    KSA.AstronomicalTemplate, KSA.PlanetaryRingsReference]
  engine_pointers: [current/decomp/KSA/PhysicalAtmosphereReference.cs GetAtmosphericDensityAtAltitude / GetAtmosphericPressureAtAltitude,
    current/decomp/KSA/AtmosphereReference.cs Physical, 'current/decomp/KSA/AstronomicalTemplate.cs AtmosphereReference,
      RingsReference', current/decomp/KSA.Rendering.Water.Data/OceanReference.cs]
  lifecycle: ['frame:draw-ui']
  approaches:
  - n: 1
    title: IParentBody.GetAtmosphereReference and GetOceanReference projected into a snapshot
    mod: gatos
    features: [mods/gatos/features/celestial-body-catalog-reads]
    technique: immutable-snapshot
    note: Height, ScaleHeight, SeaLevelPressure and SeaLevelDensity from Physical; ocean Density; read through the
      interface so a body type rename surfaces in one place. Ocean presence means OceanReference non-null with Density
      > 0.
  - n: 2
    title: Atmosphere height, density and ring templates feeding classification decisions
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/body-state-ladder-and-you-are-here]
    technique: system-graph
    note: Physical.Height and SeaLevelDensity drive low-orbit altitude, ascent loss and aerobrake markers; BodyTemplate.RingsReference
      marks ringed bodies; atmosphere plus a 15,000 km radius marks a gas giant (no solid surface); GetNearSurfaceRadius
      for clearance.
  - n: 3
    title: Sample the live density and pressure model by altitude
    mod: compendium
    features: [mods/compendium/features/atmosphere-profile-graph, mods/compendium/features/derived-body-properties]
    technique: imgui-drawlist
    note: 101 samples from 0 to Physical.Height through the game atmosphere functions, so the numbers follow a mod
      that replaces the profile; atmosphere strings for the body page come from the same template.
  related: [read-celestial-orbit-and-body-data, replace-a-bodys-atmosphere-density-profile, tune-atmosphere-scattering-in-system-xml,
    draw-a-chart-with-imdrawlist, classify-vessel-orbit-state]
  borrowed_from: [mods/compendium/features/atmosphere-profile-graph, mods/ksa-deltavmap/features/body-state-ladder-and-you-are-here]
- slug: read-rotation-tilt-and-tidal-lock-of-a-body
  title: Read a body's rotation, axial tilt, tidal lock and inclination
  summary: Spin rate, sidereal period, axial tilt, retrograde and tidal-lock flags, and the inclination of an orbit
    relative to the parent equator or the star plane live in templates and transforms rather than one property.
    This topic shows where each number comes from and the corrections moons need.
  game_types: [KSA.Celestial, KSA.RotationTemplate, KSA.AstronomicalTemplate, KSA.Orbit, KSA.IParentBody]
  engine_pointers: [current/decomp/KSA/RotationTemplate.cs, 'current/decomp/KSA/Celestial.cs Inclination, GetCci2Orb,
      GetAngularVelocity', current/decomp/KSA/IParentBody.cs GetAngularVelocity]
  lifecycle: ['frame:draw-ui']
  approaches:
  - n: 1
    title: Template and transform reads for tilt, periods and inclination
    mod: compendium
    features: [mods/compendium/features/derived-body-properties]
    technique: reflection
    note: BodyTemplate.Rotation.Tilt for star orbiters, X angle of GetCci2Orb().Inverse() for moons, SiderealPeriod,
      IsTidallyLocked, IsRetrograde; inclination relative to parent equator and to the star plane; OrbitLineMode
      read by reflection inside a try.
  - n: 2
    title: Angular velocity as a rate for telemetry
    mod: gatos
    features: [mods/gatos/features/celestial-body-catalog-reads]
    technique: immutable-snapshot
    note: GetAngularVelocity() reported in rad/s alongside orbit elements as altitudes over the parent.
  - n: 3
    title: Angular velocity to a stationary orbit radius
    mod: ksa-deltavmap
    features: [mods/ksa-deltavmap/features/body-state-ladder-and-you-are-here]
    technique: system-graph
    note: T = 2 pi / abs(omega); r = cbrt(mu T^2 / 4 pi^2); rung only if inside the SOI and above the low orbit.
  related: [understand-ksa-coordinate-frames, build-a-local-site-frame, read-celestial-orbit-and-body-data, read-orbit-elements-and-timing]
  borrowed_from: [mods/ksa-deltavmap/features/body-state-ladder-and-you-are-here]
- slug: reposition-a-celestial-body-at-runtime
  title: Reposition a planet or moon at runtime by swapping its orbit
  summary: Bodies are on rails, so moving one means giving it a new Orbit at a moment when the orbit solver will
    pick it up. This topic builds the orbit from the target's state vectors, swaps it in a first-priority prefix
    on the solver dispatch, orders chained updates, and restores the original orbit on unweld and across saves.
  game_types: [KSA.Celestial, KSA.Orbit, KSA.StateVectors, KSA.Universe, KSA.CelestialUpdateTask, KSA.UniverseTime,
    KSA.GameSave]
  engine_pointers: [current/decomp/KSA/Celestial.cs SetOrbit, current/decomp/KSA/Orbit.cs CreateFromStateCci, 'current/decomp/KSA/Universe.cs
      ApplyOrbitSolvers, ExecuteNextVehicleSolvers, ExecuteNextOrbitSolvers, DeserializeSave', current/decomp/KSA/GameSave.cs
      Populate]
  lifecycle: ['frame:dispatch-solvers', 'frame:draw-ui', 'event:save', 'event:load']
  approaches:
  - n: 1
    title: Priority.First prefix on ExecuteNextVehicleSolvers builds a fresh orbit from target state vectors
    mod: unscience
    features: [mods/unscience/features/kiwis-marbles-celestial-welding]
    technique: harmony-prefix
    note: Offset in the target parent CCI frame, Orbit.CreateFromStateCci around the target parent, SetOrbit before
      the CelestialUpdateTask snapshot; UI-time swaps are overwritten by the orbit workers. Chained welds are updated
      in topological order; originals restored on unweld; welds captured and replayed through save hooks.
  related: [reparent-a-celestial-body, mutate-vehicles-at-a-physics-safe-point, teleport-a-vessel-to-an-orbit-or-site,
    teleport-a-vessel-by-building-a-new-orbit, save-sidecar-state-per-scene]
  borrowed_from: []
- slug: reparent-a-celestial-body
  title: Change a celestial body's parent safely
  summary: Celestial.SetOrbit changes only the Orbit field. The Children lists of the old and new parents, cached
    transforms, sphere of influence and rank are not updated, and KSA re-parents only vessels automatically. This
    topic explains how the parent/child tree drives per-frame refresh, encounter search and UI lists, and how to
    move a body between parents without leaving it listed twice or in a cycle.
  game_types: [KSA.Celestial, KSA.IParentBody, KSA.IOrbiter, KSA.Orbit, KSA.CelestialSystem, KSA.Vehicle, KSA.PatchedConic,
    KSA.FlightPlan]
  engine_pointers: ['current/decomp/KSA/Celestial.cs SetOrbit, UpdatePerFrameData, SphereOfInfluence, Rank', 'current/decomp/KSA/IParentBody.cs
      Children, UpdatePerFrameDataTree', current/decomp/KSA/Vehicle.cs SetFlightPlan (ApplyPendingParentChildrenFix)]
  lifecycle: ['frame:dispatch-solvers', 'event:load']
  approaches:
  - n: 1
    title: SetOrbit plus manual Children surgery and UpdatePerFrameDataTree, with cycle guards on replay
    mod: unscience
    features: [mods/unscience/features/kiwis-marbles-cross-parent-reparenting, mods/unscience/features/kiwis-marbles-celestial-welding]
    technique: celestial-reparenting
    note: Record old parent, SetOrbit, remove from oldParent.Children and add to newParent.Children when the parent
      differs, refresh the moved subtree before anything samples it; saved welds are replayed with parent-graph
      checks. Documents which state SetOrbit does and does not update.
  related: [reposition-a-celestial-body-at-runtime, enumerate-star-systems-and-bodies]
  borrowed_from: []
- slug: choose-which-body-the-game-renders-in-detail
  title: Control which body the game picks as the camera's nearby celestial
  summary: The game draws one body per camera in full detail (terrain, volumetric clouds, full atmosphere) and every
    other body as a distant sphere, chosen by CelestialSystem.GetNearbyAstronomical. A small moon passing close
    to its planet can steal that slot and make the planet flicker, especially under time warp. This topic shows
    how to change the ranking in place with a guarded transpiler.
  game_types: [KSA.CelestialSystem, KSA.Astronomical, KSA.Program, KSA.Camera]
  engine_pointers: [current/decomp/KSA/CelestialSystem.cs GetNearbyAstronomical, 'current/decomp/KSA/Program.cs
      OnFrameCelestials, UpdateShaderData, FindNearbyCelestial', current/decomp/KSA/Astronomical.cs MeanRadius]
  lifecycle: ['startup:starmap-before-main', 'frame:celestials', 'frame:render']
  approaches:
  - n: 1
    title: Transpile the distance comparison into a ranking call that favours a body within 25 radii
    mod: realatmospheres
    features: [mods/realatmospheres/features/nearby-body-transpiler]
    technique: harmony-transpiler
    note: 'Shape-check the single get_MeanRadius, replace sub/clt with a static Take(...) that writes best by reference,
      bail out returning the original IL on any mismatch; runs once at patch time, one static call per body per
      frame. Callers: OnFrameCelestials, UpdateShaderData, FindNearbyCelestial.'
  related: [write-a-harmony-transpiler, branch-per-body-inside-shared-game-shaders, keep-vessels-rendered-at-any-distance]
  borrowed_from: [mods/realatmospheres/features/nearby-body-transpiler]
- slug: change-stock-system-and-body-xml-without-editing-core
  title: Change the stock system and body XML without editing Core
  summary: Sol's bodies live in the Core body library (Astronomicals.xml) and the inline system templates (SolSystem*.xml);
    a mod that wants to change an atmosphere, cloud deck or surface cannot ship a second copy of a Core file. This
    topic shows how to write a patched copy and make the game load it instead, and how two mods can cooperate on
    the same files.
  game_types: [KSA.Mod, KSA.ModLibrary, KSA.SystemTemplate, KSA.AstronomicalTemplate, KSA.AtmosphericBodyTemplate,
    KSA.PlanetaryBodyTemplate]
  engine_pointers: ['current/decomp/KSA/Mod.cs Assets, SystemTemplates, LoadAssetBundles, LoadSystems, PrepareSystems',
    'current/Content/Core/ (Astronomicals.xml, SolSystem.xml, SolSystemDense.xml, SolSystemInterstellar.xml)']
  lifecycle: ['startup:starmap-before-main', 'startup:asset-load']
  approaches:
  - n: 1
    title: Write patched copies and swap the file names in Core mod lists for absolute paths
    mod: realatmospheres
    features: [mods/realatmospheres/features/core-xml-entry-redirect, mods/realatmospheres/features/atmosphere-optics-in-system-xml]
    technique: xml-patch
    note: Prefixes on Mod.LoadAssetBundles / LoadSystems / PrepareSystems replace the Astronomicals.xml and system
      template entries; Path.Combine returns a rooted second argument unchanged so no further patch is needed; idempotent,
      and PrepareSystems stores XmlName so both system methods are patched. Edits are anchor-verified text edits
      of the XML.
  - n: 2
    title: One shared patched copy built by two cooperating mods
    mod: realatmospheres
    features: [mods/realatmospheres/features/cross-mod-shared-shadow]
    technique: xml-patch
    note: A named mutex, a once-per-launch reset token (process start time), a callback of marker-guarded idempotent
      edits and source shared between projects, so the second mod patches on top of the first mod rather than clobbering
      it.
  related: [redirect-game-xml-loading, coordinate-file-edits-between-mods, patch-game-glsl-with-anchored-text-edits,
    add-an-atmosphere-to-an-airless-body]
  borrowed_from: [mods/realatmospheres/features/core-xml-entry-redirect, mods/realatmospheres/features/cross-mod-shared-shadow]
- slug: add-an-atmosphere-to-an-airless-body
  title: Give an airless body an atmosphere in system XML
  summary: A body authored as a plain planetary or minor body has no atmosphere renderer or flight atmosphere. Promoting
    it means renaming the template element to AtmosphericBody and appending a complete Atmosphere block, including
    the Ozone and StartHeight elements the validity check requires. Pluto and Triton are promoted this way.
  game_types: [KSA.AtmosphericBodyTemplate, KSA.PlanetaryBodyTemplate, KSA.MinorBodyTemplate, KSA.VisualAtmosphereReference,
    KSA.PhysicalAtmosphereReference, KSA.SystemTemplate]
  engine_pointers: [current/decomp/KSA/AtmosphericBodyTemplate.cs, current/decomp/KSA/VisualAtmosphereReference.cs
      IsValid, current/decomp/KSA/PhysicalAtmosphereReference.cs, current/decomp/KSA/AstronomicalTemplate.cs OnDataLoad]
  lifecycle: ['startup:starmap-before-main', 'startup:asset-load']
  approaches:
  - n: 1
    title: Rename the element to AtmosphericBody and splice an Atmosphere block into the XML copy
    mod: realatmospheres
    features: [mods/realatmospheres/features/atmosphere-optics-in-system-xml]
    technique: xml-patch
    note: Include Ozone and StartHeight so IsValid passes; ties into the measured flight tables registered per template
      id; delivered through the Core XML redirect.
  related: [change-stock-system-and-body-xml-without-editing-core, tune-atmosphere-scattering-in-system-xml, replace-a-bodys-atmosphere-density-profile,
    add-a-volumetric-cloud-layer-to-a-body]
  borrowed_from: []
- slug: tune-atmosphere-scattering-in-system-xml
  title: Tune a body's atmosphere scattering and absorption in XML
  summary: Rayleigh and Mie coefficients, asymmetry, the absorption multiplier and the ozone tent are all XML data
    on VisualAtmosphereReference. This topic shows how to derive per-body values, use the ozone tent as a general
    per-channel absorber, and treat scale heights and asymmetry sentinels as keys the patched shaders recognise.
  game_types: [KSA.VisualAtmosphereReference, KSA.AtmosphericBodyTemplate, KSA.PlanetaryBodyTemplate, KSA.MinorBodyTemplate,
    KSA.SystemTemplate]
  engine_pointers: [current/decomp/KSA/VisualAtmosphereReference.cs, current/Content/Core/Astronomicals.xml (stock
      Atmosphere blocks), current/Content/Shaders (Atmosphere*.comp)]
  lifecycle: ['startup:starmap-before-main', 'startup:asset-load']
  approaches:
  - n: 1
    title: Generated optical values spliced into ten XML copies, with data-as-key conventions
    mod: realatmospheres
    features: [mods/realatmospheres/features/atmosphere-optics-in-system-xml]
    technique: xml-patch
    note: Generated Rayleigh, Mie and ozone values per body; the ozone tent reused as a per-channel absorber; scale
      height and asymmetry values chosen so a patched shader can recognise the body (see the shader-side topics).
  related: [add-an-atmosphere-to-an-airless-body, branch-per-body-inside-shared-game-shaders, dispatch-shader-variants-with-sentinel-values,
    read-atmosphere-and-ocean-parameters-of-a-body, generate-measured-atmosphere-tables-offline]
  borrowed_from: []
- slug: add-a-volumetric-cloud-layer-to-a-body
  title: Add a volumetric cloud layer to a body in system XML
  summary: Clouds is a sibling of Atmosphere in the body XML, with coverage masks, detail tiles, a flowmap, a colour
    map and cloud types per layer. This topic shows templated decks for gas giants, thin laminae for Mars cirrus
    and Titan haze, how each layer's light distance follows from its geometry, and how a layer references textures
    that live in your mod folder from a Core-resident XML file. It also covers calibrating a layer flow speed to
    a real wind speed (velocity = peak flow x displacement / loop duration, used for measured giant-planet jets
    and Venus superrotation).
  game_types: [KSA.CloudsReference, KSA.CloudLayerReference, KSA.VolumetricCloudReference, KSA.RaymarchingReference]
  engine_pointers: [current/decomp/KSA/CloudsReference.cs, current/decomp/KSA/CloudLayerReference.cs, current/decomp/KSA/VolumetricCloudReference.cs,
    current/decomp/KSA/Mod.cs GetPath (rooted paths pass through)]
  lifecycle: ['startup:starmap-before-main', 'startup:asset-load']
  approaches:
  - n: 1
    title: Templated decks and laminae with absolute asset paths
    mod: realatmospheres
    features: [mods/realatmospheres/features/cloud-layers-in-system-xml]
    technique: xml-patch
