  summary: Ray-test the cursor against each body's mean-radius sphere, lift the hit to Ecl, convert through Cce
    and the body-fixed frame to latitude and longitude, store the pin as lat/lon so it turns with the planet, and
    compute great-circle distance, chord and initial bearing.
