- slug: draw-a-great-circle-arc-over-a-planet
  title: Draw a great-circle arc over a planet without drawing through it
  summary: Sample a great circle between two surface points with Rodrigues' rotation, interpolate the radius between
    the pins, and draw each segment only while its outward normal faces the camera so the line breaks at the limb
    instead of cutting across the disc.
  game_types: [KSA.Celestial, KSA.Camera]
  engine_pointers: [current/decomp/KSA/Camera.cs (world to screen), current/decomp/KSA/Celestial.cs GetPositionEclFromLatLon]
