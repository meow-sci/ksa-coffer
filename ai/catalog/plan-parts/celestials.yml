  approaches:
  - n: 1
    title: Closed-form band below the terrain ceiling, fixed interior sample count
    mod: ksagolf
    features: [mods/ksagolf/features/terrain-height-queries]
    technique: closed-form-geometry
    note: 'LineOfSight (segment vs sphere strictly between endpoints, horizon range as the sum of tangent lengths)
      and TerrainMask.TryBandBelow solving the quadratic; no-claim samples treated as unknown, not zero. Ceiling
      bound: MaxTerrainRadius - MeanRadius + 8,000 m, not MaxTerrainHeightApprox.'
  - n: 2
    title: Radar horizon mask over non-accurate height samples
    mod: ksarmory
    features: [mods/ksarmory/features/terrain-ground-impact-test]
    technique: terrain-query
    note: TerrainHeights(body) with accurate false via KsaWorld.IsHiddenByTerrain, tens of samples per contact per
