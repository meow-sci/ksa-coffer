- slug: flatten-or-dig-terrain-for-a-site
  title: Flatten or dig the terrain under a custom site
  summary: A building, garage or pad needs level ground or a hole in it. Combine an absolute-level decal (Additive
    false) with an additive height-map decal, copy the stock launch-pad flattening so the new ground meets the pad
    without a step, and give structures that must look like the terrain the terrain shader.
  game_types: [KSA.DecalModifierReference, KSA.TerrainReference, KSA.StaticObjectModel, KSA.PartModelModule, KSA.GroundClutterRenderer]
  engine_pointers: ['current/decomp/KSA/DecalModifierReference.cs (Location, Radius, AltitudeOffset, SmoothFactor,
