    features: [mods/ksagolf/features/terrain-height-queries]
    technique: custom-physics
    note: Cce direction from position minus centre in Ecl (Cce shares ecliptic axes), Ccf for body-fixed positions;
      passing one to the other rotates by the planet's current phase; sea detected by OceanReference non-null with
      Density > 0, never IsValid; ITerrainHeights.TryHeight false means no claim, never zero.
