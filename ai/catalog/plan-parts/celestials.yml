- slug: query-the-terrain-height-field
  title: Query the engine's terrain height field
  summary: 'KSA has no terrain raycast a mod can use; it has one function, Celestial.GetTerrainHeightFromDirCcf/Cce/Cci(direction,
    accurate), returning metres above MeanRadius along a direction from the body centre. Everything a mod needs
    from the ground is built on it: picking the right frame entry point, clamping to sea level over oceans, choosing
    the body under a point, and answering as a centre and radius for cheap repeated tests.'
  game_types: [KSA.Celestial, KSA.Astronomical, KSA.CelestialSystem, KSA.Universe, KSA.Rendering.Water.Data.OceanReference,
    KSA.TerrainRadiusCache, KSA.PhysicsEnvironment]
