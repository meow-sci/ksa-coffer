  approaches:
  - n: 1
    title: 48 Rodrigues samples with a back-face test and midpoint label
    mod: ksa-measuretools
    features: [mods/ksa-measuretools/features/surface-great-circle-tool]
    technique: imgui-drawlist
    note: Axis = normalized cross product, angle = acos of the radial unit vectors; skip samples where dot(dir,
      cameraPos - point) <= 0; coincident or antipodal pins have no unique circle.
