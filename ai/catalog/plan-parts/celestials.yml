- slug: anchor-a-placed-model-to-the-ground
  title: Anchor a placed model or structure to a planet's surface
  summary: 'Something stood on the ground must follow the planet''s rotation, stay put across floating-origin shifts
    and be restorable from a save. Store the placement in the body-fixed frame (body, Ccf position, surface normal
    or latitude, longitude and heading) and rebuild the camera-relative matrix every frame. It also covers grounding
    and centering a scaled, rotated model: transform the eight corners of the original import bounds, then translate
    so it is centred horizontally with its lowest point at Y = 0, always starting from the import bounds so edits
    never accumulate.'
  game_types: [KSA.Celestial, KSA.Camera, KSA.Cursor, KSA.Program, KSA.Vehicle, KSA.IViewport, KSA.JobSystems, KSA.Universe]
  engine_pointers: ['current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf, GetCcf2Cce', current/decomp/KSA/Camera.cs
      GetPositionEgo, current/decomp/KSA/StaticObjectRenderer.cs UpdateRenderData, current/decomp/KSA/JobSystems.cs
      VehicleSolver]
  lifecycle: ['frame:draw-ui', 'frame:render', 'event:save', 'event:load']
  approaches:
  - n: 1
    title: GroundAnchor (Celestial, Ccf position, normal) composed each frame into a camera-relative matrix
    mod: unscience
    features: [mods/unscience/features/sphinx-glb-statics-placement, mods/unscience/features/sphinx-static-object-render-hooks]
    technique: glb-model
    note: FrameCcf x Ccf2Cce x translation(camera.GetPositionEgo(body)); east from UnitZ x radial with a pole fallback;
      placed by terrain click or beside a vessel after waiting for solvers; drawn through postfixes on StaticObjectRenderer;
      restored from scene saves. PlacementMath.GroundedLocal (scale 0.01 to 1000 per axis, rotations X Y Z in degrees)
      grounds and centres from the import bounds; tested with 200 random cases.
  - n: 2
    title: Course frame anchored at the kitten and saved as latitude, longitude, heading and floor height
    mod: ksagolf
    features: [mods/ksagolf/features/course-grid-and-save-file, mods/ksagolf/features/minigolf-course-builder, mods/ksagolf/features/mod-mesh-draw-hook]
    technique: custom-physics
    note: Body-fixed frame with up from the feet direction, +J from the facing projected to horizontal, floor at
      terrain plus 2 cm and releveled to the highest corner; saved as lat/lon/heading/floor height above ground
      rather than an absolute radius; meshes drawn per viewport after ClearBuckets with Ccf2Cce plus ego translation.
