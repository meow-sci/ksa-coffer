  - slug: reuse-the-stock-engine-sound-for-custom-thrust
    title: Reuse KSA's stock engine sound for thrust that is not a real engine
    summary: Play Core's DefaultEngineSoundBehavior for mod-simulated rockets, cars or missiles by feeding it the Throttle, Distance, Pressure and Iva parameters a real nozzle would, started paused so the first sample is already correct.
    game_types: [KSA.GameAudio, KSA.SoundEvent, KSA.CompoundSound, KSA.CompoundChannelWrapper, KSA.ClusterSound, KSA.KeyHash, KSA.Vehicle, KSA.ViewportRegistry]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs UpdateAudio L6127-L6189 and sound hashes L6961-L6966
      - current/decomp/KSA/GameAudio.cs PlaySound(SoundEvent ...) (cluster sound attached to parent IAudio)
      - current/Content/Core/Sounds.xml DefaultEngine Param curves, DefaultEngineSoundBehavior
    lifecycle: [frame:draw-ui, frame:after-on-frame, frame:post-render]
    approaches:
      - n: 1
        title: GameAudio.PlaySound(SoundEvent) with the craft as IAudio parent
        mod: ksacars
        features: [mods/ksacars/features/rocket-sound-without-engine]
        technique: fmod-audio
        note: "Mirrors the per-nozzle branch of Vehicle.UpdateAudio: start paused, SetSpatialAudio, SetParameter Throttle/Distance/Pressure/Iva via prebuilt KeyHash, unpause on the first frame. Author states it has not been listened to in game, so treat the mix as unverified. One channel per car at its centre; silent above 10x."
      - n: 2
        title: ModLibrary.Get<SoundBehavior>("DefaultEngineSoundBehavior").Play with Throttle pinned open
        mod: ksarmory
        features: [mods/ksarmory/features/spatial-gun-and-motor-sounds]
        technique: fmod-audio
        note: "One channel per burning mod-simulated round; Core's loop maps Throttle 0 to 0.1x volume and 0.5x pitch so the mod sets Throttle=1 on start; the same lookup resolves mod and Core ids, so a custom sample can later replace the borrowed one without code changes."
    related: [drive-sound-parameters-from-code, draw-exhaust-plumes-without-an-engine, play-a-spin-up-loop-tail-sound, hold-and-move-a-spatial-channel-every-frame, add-lift-hover-boost-and-downforce-to-a-craft]
