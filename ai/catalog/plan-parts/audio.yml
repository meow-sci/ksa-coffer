  - slug: load-fmod-streams-without-blocking-the-game-thread
    title: Load FMOD streams without blocking the game thread
    summary: Open a long audio file with the NonBlocking mode and poll its open state once per frame, with an error message for undecodable files and a timeout, instead of spinning on TryGetOpenState like the stock loader does at start-up.
    game_types: [Brutal.FmodApi.FmodSystem, Brutal.FmodApi.Sound, Brutal.FmodApi.Mode, Brutal.FmodApi.OpenState, Brutal.FmodApi.Result, KSA.GameAudio]
    engine_pointers:
      - current/decomp/KSA/GameAudio.cs CreateFmodSound (Thread.Sleep(1) loop on TryGetOpenState for streamed sounds)
      - current/decomp/Brutal.FmodApi/OpenState.cs
    lifecycle: [frame:draw-ui, frame:post-render]
    approaches:
      - n: 1
        title: Mode.NonBlocking stream polled each frame with a 15 s timeout
        mod: unscience
        features: [mods/unscience/features/byo-music-vessel-3d-audio]
        technique: fmod-audio
        note: "TryCreateStream(Mode._3d | NonBlocking | LoopOff); each Update checks TryGetOpenState: Error aborts with a 'use PCM WAV, MP3 or Ogg Vorbis' message, anything but Ready waits a frame, 15 s without readiness is a timeout. The extension is not a codec check, so a mislabelled file ends as a per-entry error rather than a stuck Loading."
    related: [play-sound-files-through-the-games-fmod-system, attach-an-imported-sound-to-a-vessel-in-3d, run-an-expensive-solve-without-stalling-the-frame]
    borrowed_from: []

  - slug: attach-an-imported-sound-to-a-vessel-in-3d
    title: Attach a player-imported sound file to a vessel in 3D
    summary: Let the player pick an OGG, WAV or MP3 and a vessel and hear it from that vessel, with min/max distance, point-source spread, stable pitch, loops or a real-time gap between repeats, several sounds at once, and persistence across scene saves.
    game_types: [KSA.GameAudio, KSA.SpatialAudio, KSA.ChannelGroupReference, KSA.Vehicle, KSA.Program, Brutal.FmodApi.Channel, Brutal.FmodApi.Mode]
    engine_pointers:
      - current/decomp/KSA/SpatialAudio.cs PositionView, VelocityView (camera view space; KSA never sets FMOD listener attributes)
      - current/decomp/KSA/ChannelWrapper.cs SetSpatialAudio (convention being matched)
      - current/decomp/KSA/Program.cs L2263 (OnFrameViewports before GUI), L2267 (OnDrawUiFrame), L2362 (PostRender)
    lifecycle: [frame:draw-ui, frame:post-render, event:save, event:load, frame:prepare]
    approaches:
