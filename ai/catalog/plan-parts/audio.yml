category: audio
description: Playing sound in KSA from a mod through the game's FMOD system - shipping sound XML assets, placing and moving spatial channels, reusing Core sounds and their parameters, timing sounds against the world, and bringing your own files or music.
topics:
  - slug: ship-custom-sounds-as-xml-assets
    title: Ship custom sounds with a mod as XML sound assets
    summary: Declare your own wav files in a mod asset XML (listed in mod.toml assets) so KSA registers them as SoundBehaviors you can look up by id, with the right channel group, 3D range, loop flag, priority and simulation-speed rule.
    game_types: [KSA.SoundReference, KSA.SoundFileReference, KSA.SpatialSoundData, KSA.SoundBehavior, KSA.AssetBundle, KSA.ModLibrary, KSA.ChannelGroupReference]
    engine_pointers:
      - current/decomp/KSA/AssetBundle.cs (XmlElement table for Sound, SpatialSoundData, CompoundSound, MultiSound, MusicPlaylist, ChannelGroup)
      - current/decomp/KSA/SoundReference.cs (ChannelId, Priority default 128, SimSpeed, SelectionRule, Pitch, Volume, Param)
      - current/decomp/KSA/SpatialSoundData.cs (VolumeRange, TwoDRange)
      - current/decomp/KSA/ModLibrary.cs PopulateSounds
      - current/Content/Core/Sounds.xml (ExternalChannel group under Sfx, reference shapes)
    lifecycle: [startup:asset-load, startup:all-mods-loaded]
    approaches:
      - n: 1
        title: One-shot sounds with random variants and a simulation-speed rule
        mod: ksagolf
        features: [mods/ksagolf/features/world-positioned-sounds]
        technique: xml-asset
        note: "Four <Sound> assets on ExternalChannel, two <SoundFile> children each (SelectionRule defaults to Random), SimSpeed=OnlyLower, <SpatialSoundData><VolumeRange Min Max> plus TwoDRange 0/0 for fully positional playback. Shows what each attribute means in the decomp and that ModLibrary.Get<SoundBehavior> throws on an unknown id."
      - n: 2
        title: Looping layers sharing one SpatialSoundData asset
        mod: ksacars
        features: [mods/ksacars/features/engine-sound-crossfade]
        technique: xml-asset
        note: "A named <SpatialSoundData Id> declared once and referenced from four <Sound> elements per car; <Loop /> inside <SoundFile> turns on FMOD loop mode; Volume clamped 0..2; mono files because the engine spatialises the source; missing asset file in mod.toml means a silent id that the mod warns about once."
      - n: 3
        title: Per-weapon-class spatial data, priority and pitch variation
        mod: ksarmory
        features: [mods/ksarmory/features/spatial-gun-and-motor-sounds]
        technique: xml-asset
        note: "SpatialSoundData per weapon class (a 5-inch gun carries further than a 20 mm), Priority=110 so gun channels beat Core's explosion (123/124) and engine (125) sounds under FMOD's voice limit, a <Pitch Min Max> range so a repeated gunshot is not one sample, and the Python cut scripts' provenance habit."
    related: [play-a-sound-at-a-world-position, play-a-spin-up-loop-tail-sound, keep-mod-sounds-sensible-under-time-warp, cut-looping-sounds-from-recordings, understand-the-games-sound-and-music-xml-types, ship-content-and-code-in-one-mod]
    borrowed_from: []

  - slug: understand-the-games-sound-and-music-xml-types
    title: Understand KSA's sound, channel group and music playlist XML types
    summary: A map of the sound types a mod can declare or look up - SoundBehavior and its Sound, CompoundSound, MultiSound and ClusterSound subclasses, SpatialSoundData, SoundGroup, ChannelGroup with DSP chains, and MusicPlaylist - plus how they register, populate and play.
    game_types: [KSA.SoundBehavior, KSA.SoundReference, KSA.CompoundSound, KSA.MultiSound, KSA.ClusterSound, KSA.SpatialSoundData, KSA.ChannelGroupReference, KSA.MusicPlayList, KSA.LocationMusicPlayer, KSA.ModLibrary]
    engine_pointers:
      - current/decomp/KSA/ModLibrary.cs (AllSoundBehaviours, AllMusicPlaylists, AllChannelGroups, PopulateSounds)
      - current/decomp/KSA/SoundBehavior.cs (Play, Get, ClusterSound)
      - current/decomp/KSA/ChannelGroupReference.cs (ParentId, Volume, DspChain, OnDataLoad creates the FMOD group, Populate parents it)
      - current/decomp/KSA/MusicPlayList.cs and LocationMusicPlayer.cs
      - current/decomp/KSA/GameAudio.cs OnApplicationStart (Master, Sfx, Ui, Music groups)
      - current/decomp/KSA/Program.cs L985-L990 (PopulateSounds after AttachGameData)
      - current/Content/Core/Sounds.xml (ChannelGroup, CompoundSound, MusicPlaylist examples)
    lifecycle: [startup:asset-load, startup:all-mods-loaded, startup:game-loaded]
    approaches:
      - n: 1
        title: Read the type map through the features that use each type
        mod: ksacars
        features:
          - mods/ksacars/features/engine-sound-crossfade
          - mods/ksacars/features/rocket-sound-without-engine
          - mods/ksarmory/features/spatial-gun-and-motor-sounds
          - mods/ksarmory/features/burst-sound-at-blast-arrival
          - mods/unscience/features/byo-music-vessel-3d-audio
        technique: xml-asset
        note: "Reference article: Sound/CompoundSound/MultiSound/ClusterSound.Play return different IChannel wrappers; a SoundReference with files registers itself while an empty one is a reference resolved by Get(); ChannelId resolves in Populate (after StarMapAllModsLoaded and AttachGameData); Core declares ExternalChannel, InternalChannel, EnginesChannel, AmbienceChannel, ExtReverb under Sfx; SimSpeedRule values; Param types Volume/Pitch/Lpf/Hpf. Note the mod notes that claim a <SoundBehavior> top-level element are wrong in this build."
    related: [ship-custom-sounds-as-xml-assets, add-a-music-playlist-for-a-location, play-a-spin-up-loop-tail-sound, drive-sound-parameters-from-code, play-sound-files-through-the-games-fmod-system]
    borrowed_from: []

  - slug: play-a-sound-at-a-world-position
    title: Play a sound at a world position
    summary: Start a declared sound so it pans, attenuates, Doppler-shifts and is muffled by air pressure as if it came from a point in the world, using SpatialAudio built either from a nearby object plus an offset or from camera-relative Ego vectors.
    game_types: [KSA.GameAudio, KSA.SpatialAudio, KSA.SoundBehavior, KSA.IChannel, KSA.Camera, KSA.PhysicalAtmosphereReference, KSA.ModLibrary]
    engine_pointers:
      - current/decomp/KSA/SpatialAudio.cs (constructors from Astronomical + offset and from Ego position/velocity/pressure)
      - current/decomp/KSA/GameAudio.cs GetAudioCamera, PlaySound overloads
      - current/decomp/KSA/ChannelWrapper.cs SetSpatialAudio (pressure to low-pass cutoff)
      - current/decomp/KSA/Camera.cs GetPositionEgo, GetVelocityEgo
    lifecycle: [frame:draw-ui, frame:celestials, frame:after-on-frame, frame:post-render]
    approaches:
      - n: 1
        title: GameAudio.PlaySound with SpatialAudio(Astronomical, offset)
        mod: ksagolf
        features: [mods/ksagolf/features/world-positioned-sounds]
        technique: fmod-audio
        note: "Anchor on a live vehicle near the sound and add the Ecl difference as the offset (Ego is a pure translation of Ecl); Doppler and pressure then come from the anchor. Includes ModLibrary.Get<SoundBehavior> lookup and the speed-band choice of sound id and volume."
      - n: 2
        title: SoundBehavior.Play with a hand-built Ego SpatialAudio
        mod: ksarmory
        features:
          - mods/ksarmory/features/spatial-gun-and-motor-sounds
          - mods/ksacars/features/engine-sound-crossfade
        technique: fmod-audio
        note: "Listener is GameAudio.GetAudioCamera(); position and velocity from camera.GetPositionEgo/GetVelocityEgo, pressure from PhysicalAtmosphereReference.GetAtmosphericPressure(listener). Use when the source is a mod-simulated object (platform ego plus the round's own offset keeps it epoch-clean at orbital speed). Bypasses GameAudio.PlaySound's 10x gate."
    related: [hold-and-move-a-spatial-channel-every-frame, work-in-the-cameras-ego-frame, understand-ksa-coordinate-frames, keep-mod-sounds-sensible-under-time-warp, compute-mach-number-from-the-game-atmosphere, simulate-projectiles-and-balls-outside-the-vehicle-system]
    borrowed_from: []

  - slug: hold-and-move-a-spatial-channel-every-frame
    title: Hold a playing channel and move it with its source every frame
    summary: Keep the IChannel returned by Play for a moving object, re-place it each frame with SetSpatialAudio, restart it when the engine has reclaimed it, and sweep channels against the live roster so nothing keeps playing after its owner is gone.
    game_types: [KSA.IChannel, KSA.ChannelWrapper, KSA.CompoundChannelWrapper, KSA.GameAudio, KSA.SpatialAudio]
    engine_pointers:
      - current/decomp/KSA/GameAudio.cs UpdateAudio (drops channels that are neither playing nor virtual)
      - current/decomp/KSA/IChannel.cs
      - current/decomp/KSA/ChannelWrapper.cs UpdateVolume, UpdatePitch (multipliers persist until reset)
    lifecycle: [frame:draw-ui, frame:after-on-frame, frame:post-render]
    approaches:
      - n: 1
        title: One looping channel per craft with a guarded move and cut
        mod: ksacars
        features: [mods/ksacars/features/engine-sound-crossfade, mods/ksacars/features/rocket-sound-without-engine]
        technique: fmod-audio
        note: "SoundChannels.TryMove/Cut wrap every call in try because the engine drops a finished channel; a dead channel is replaced next frame; per-craft dictionary; Update runs from the dual-hook StepOnce on the main thread, before GameAudio.UpdateAudio in PostRender applies the values."
      - n: 2
        title: One channel per firing system and per burning round
        mod: ksarmory
        features: [mods/ksarmory/features/spatial-gun-and-motor-sounds]
        technique: held-channel
        note: "Channel unit chosen by what the ear hears (a 75 round per second gun is one pitched loop, not 75 one-shots); position is platform ego plus the round's offset; dictionaries swept each frame against the live roster; update runs after the rounds are stepped so a motor is heard where its round is now; do not restart a loop from code, let <Loop /> loop it."
    related: [play-a-sound-at-a-world-position, play-a-spin-up-loop-tail-sound, release-sound-channels-at-scene-change-and-exit, keep-overlays-updating-when-hud-hidden, contain-exceptions-in-starmap-hooks]
    borrowed_from: []

  - slug: crossfade-layered-engine-loops-by-rpm
    title: Crossfade layered engine loops by RPM and load
    summary: Make a simulated engine sound alive by playing an idle loop and a load loop together, crossfading their volumes by throttle and RPM and pitching each against the RPM it was recorded at, with start and stop clips on entering and leaving the vehicle.
    game_types: [KSA.IChannel, KSA.SoundBehavior, KSA.SpatialAudio, KSA.GameAudio]
    engine_pointers:
      - current/decomp/KSA/ChannelWrapper.cs UpdateVolume, UpdatePitch (VolumeMultiplier and PitchMultiplier persist)
      - current/decomp/KSA/GameAudio.cs UpdateAudio
      - current/decomp/KSA/Program.cs PostRender L2362
    lifecycle: [startup:asset-load, frame:draw-ui, frame:after-on-frame, frame:post-render]
    approaches:
      - n: 1
        title: Two mono loops, volume and pitch multipliers set per frame
        mod: ksacars
        features: [mods/ksacars/features/engine-sound-crossfade]
        technique: fmod-audio
        note: "rev from RPM between idle and redline, loaded = clamp(1.4 rev + 0.35 load); idle volume 1 - 0.85 loaded, pitch Rpm / IdleRecordedRpm; load volume scaled by loaded and Load, pitch Rpm / LoadRecordedRpm; clamps 0.5..2.5 pitch and 0..2 volume; 2 s wait for the starter clip; loops cut above 4x warp; only the car the player flies is heard."
    related: [hold-and-move-a-spatial-channel-every-frame, cut-looping-sounds-from-recordings, ship-custom-sounds-as-xml-assets, keep-mod-sounds-sensible-under-time-warp, simulate-wheels-and-suspension-without-a-wheel-module]
    borrowed_from: []

  - slug: play-a-spin-up-loop-tail-sound
    title: Play a spin-up, loop and tail sound for a held trigger
    summary: Declare a CompoundSound whose StartSound, looping Sound and StopSound make a weapon or machine ramp up, hold and wind down without the mod scheduling any of it; stopping the compound channel unpauses the tail.
    game_types: [KSA.CompoundSound, KSA.CompoundChannelWrapper, KSA.SoundReference, KSA.IChannel, KSA.SoundBehavior]
    engine_pointers:
      - current/decomp/KSA/CompoundSound.cs Play (stop sound starts paused)
      - current/decomp/KSA/CompoundChannelWrapper.cs Stop, SetParameter, SetSpatialAudio, SetPaused
      - current/Content/Core/Sounds.xml DefaultEngineSoundBehavior (same shape)
    lifecycle: [startup:asset-load, frame:draw-ui]
    approaches:
      - n: 1
        title: CompoundSound spin, loop and tail cut from one recording, held while firing
        mod: ksarmory
        features: [mods/ksarmory/features/spatial-gun-and-motor-sounds]
        technique: compound-sound
        note: "Three <Sound> cuts (spin, <Loop /> loop, tail) plus <CompoundSound> with StartSound/Sound/StopSound; one channel per firing system held while guns fire; loop re-pitched toward the gun's rate within 0.8..1.25 and ApplyParameters; a loop-plus-tail compound without a spin-up when the recording has none; cut points measured off the envelope."
    related: [hold-and-move-a-spatial-channel-every-frame, ship-custom-sounds-as-xml-assets, cut-looping-sounds-from-recordings, reuse-the-stock-engine-sound-for-custom-thrust]
