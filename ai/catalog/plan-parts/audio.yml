  - slug: play-a-stock-explosion-sound-on-your-own-schedule
    title: Strip an explosion preset's sound and play it yourself
    summary: Copy a Core Explosion preset without its SoundEvent so the engine stays silent at the instant of the blast, then play the same Core sound later, pitched and sized to the event, exactly as ExplosionSoundSystem would.
    game_types: [KSA.ExplosionSoundSystem, KSA.ExplosionSystem, KSA.Rendering.Particles.ExplosionReference, KSA.MultiSound, KSA.MultiChannelWrapper, KSA.SoundEvent, KSA.SoundBehavior, KSA.SpatialAudio, KSA.AssetBundle]
    engine_pointers:
      - current/decomp/KSA/ExplosionSystem.cs SpawnPresetInternal L253-L257
      - current/decomp/KSA/ExplosionSoundSystem.cs Spawn, UpdateAudio, StopAll
      - current/decomp/KSA/Rendering/Particles/ExplosionReference.cs (Sound field)
      - current/Content/Core/ExplosionAssets.xml Explosion_Conflagration L99-L116, ExplosionBig L219-L249
      - current/decomp/KSA/Universe.cs DeserializeSave (ExplosionSoundSystem.StopAll)
    lifecycle: [startup:asset-load, frame:draw-ui, frame:celestials, frame:after-on-frame]
    approaches:
      - n: 1
        title: Preset without SoundEvent plus a hand-played ExplosionBig
        mod: ksarmory
        features: [mods/ksarmory/features/burst-sound-at-blast-arrival]
        technique: xml-asset
        note: "KSArmoryNuclearBurst keeps Core's flash and drops SoundEvent (and VolumeRef, for an unrelated cloud reason); BurstSound plays ExplosionBig with SoundBehavior.Play(startPaused: true), PitchMultiplier = cbrt(0.3 kt / kt) clamped 0.35..1, Distance/Pressure/Intensity parameters, unpause, then re-places the channel each frame while IsStillActive. Calling SoundBehavior.Play directly skips the 10x and 50 km gates that GameAudio.PlaySound applies."
    related: [delay-a-sound-until-the-blast-front-arrives, drive-sound-parameters-from-code, spawn-particle-effects, play-a-sound-at-a-world-position, keep-mod-sounds-sensible-under-time-warp]
