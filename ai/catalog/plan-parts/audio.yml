  - slug: delay-a-sound-until-the-blast-front-arrives
    title: Delay a world sound by the time sound takes to reach the listener
    summary: Make a distant event heard after it is seen by following its expanding front against the live audio camera instead of using a fixed delay, so flying toward it brings the sound sooner, with gates for vacuum, inaudible pressure and a ground-reflected second report.
    game_types: [KSA.GameAudio, KSA.PhysicalAtmosphereReference, KSA.AtmosphereReference, KSA.Camera, KSA.Celestial, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/PhysicalAtmosphereReference.cs (pressure, density at altitude, speed of sound inputs)
      - current/decomp/KSA/GameAudio.cs GetAudioCamera
      - current/decomp/KSA/Celestial.cs GetBodyFixed2Ecl (anchor an event in the body-fixed frame)
    lifecycle: [frame:draw-ui, frame:celestials, frame:after-on-frame]
    approaches:
      - n: 1
        title: Per-burst front aged on the simulated step and compared with the camera every frame
        mod: ksarmory
        features: [mods/ksarmory/features/burst-sound-at-blast-arrival]
        technique: live-front-arrival
        note: "Speed of sound sqrt(gamma P0 / rho0) from the body's atmosphere; Sedov-Taylor then sonic front radius, bisected for arrival; ground-anchored in the body frame so a minutes-long wait does not leave the burst behind the planet's orbital speed; vacuum gate; 50 Pa audibility gate and loudness min(1, sqrt(p/1000)); an air-burst second report from the ground mirror path; stepped by _lastSimStep so it waits through pause and hurries under warp."
    related: [play-a-stock-explosion-sound-on-your-own-schedule, merge-coincident-events-into-one-effect, sample-world-state-at-a-consistent-epoch, simulate-in-the-planet-fixed-frame, read-atmosphere-and-ocean-parameters-of-a-body]
    borrowed_from: []

  - slug: merge-coincident-events-into-one-effect
    title: Merge coincident game events into one effect
    summary: Fold events that happen at nearly the same time and place into a single louder effect instead of stacking copies, so a salvo of warheads is one deeper bang and not six overlapping voices.
    game_types: [KSA.Celestial]
    engine_pointers:
      - current/decomp/KSA/GameAudio.cs (voice and channel limits, System.Init(1024 ...))
    lifecycle: [frame:draw-ui, frame:after-on-frame]
    approaches:
      - n: 1
        title: Merge into a queued front on the same body within 0.5 s and 1 km
        mod: ksarmory
        features: [mods/ksarmory/features/burst-sound-at-blast-arrival]
        technique: event-deduplication
        note: "A new burst on the same body, no more than 0.5 s after a queued front and anchored within 1 km, adds its charge to that front (ChargeKg +=) instead of queuing a new one; called from both the new-cloud and merge paths of the cloud code so a bomb dropped on a standing fireball is still heard."
    related: [delay-a-sound-until-the-blast-front-arrives, play-a-stock-explosion-sound-on-your-own-schedule]
    borrowed_from: []

  - slug: keep-mod-sounds-sensible-under-time-warp
    title: Keep mod-played sounds sensible under time warp and the player's volume
    summary: Know what the engine does to a sound at high simulation speed (pitch rule, stop above 10x, PlaySound refusing) and the player's Master and Sfx sliders, and choose per sound whether to follow it, override it or bypass it.
    game_types: [KSA.GameAudio, KSA.ChannelWrapper, KSA.SimSpeedRule, KSA.SoundReference, KSA.ChannelGroupType, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/GameAudio.cs PlaySound L383-L423 (Universe.SimulationSpeed > 10 early-out, alwaysPlay), UpdateAudio, ApplySettings, MapVolumeSetting
      - current/decomp/KSA/ChannelWrapper.cs HandleSimSpeedPitch, StopForSimSpeed L497-L503
      - current/decomp/KSA/SimSpeedRule.cs (None, Ignore, All, OnlyLower, OnlyHigher)
    lifecycle: [startup:asset-load, frame:draw-ui, frame:post-render]
    approaches:
      - n: 1
        title: Declare a SimSpeed rule and let the engine handle it
        mod: ksagolf
        features: [mods/ksagolf/features/world-positioned-sounds]
        technique: fmod-audio
        note: "SimSpeed=OnlyLower follows pitch below 1x (floored at 0.25) and never raises it; GameAudio.PlaySound silently returns no channel above 10x unless alwaysPlay, which the caller must handle; channels are stopped above 10x unless SimSpeed=Ignore."
      - n: 2
        title: Cut your own loops below the engine's threshold
        mod: ksacars
        features: [mods/ksacars/features/engine-sound-crossfade]
        technique: fmod-audio
        note: "Calling SoundBehavior.Play directly skips the PlaySound 10x early-out; the mod cuts its loops above 4x without a key-off because RPM swings under warp are only noise, which sits below StopForSimSpeed and HandleSimSpeedPitch."
      - n: 3
        title: Channels the game never registers
        mod: unscience
        features: [mods/unscience/features/byo-music-vessel-3d-audio]
        technique: fmod-audio
        note: "FMOD channels made directly on GameAudio.System and the game's Sfx group are not in ActiveChannels, so HandleSimSpeedPitch and StopForSimSpeed never touch them: stable pitch, plays in space and in warp, still follows the player's SFX and master sliders; Doppler level 0 keeps pitch steady."
    related: [play-sound-files-through-the-games-fmod-system, set-simulation-speed-from-a-mod, choose-a-clock-under-time-warp, keep-custom-forces-stable-under-time-warp, step-mod-simulation-on-sim-time]
    borrowed_from: []

  - slug: play-sound-files-through-the-games-fmod-system
    title: Play your own sound files through KSA's FMOD system and channel groups
    summary: Create FMOD sounds from bytes or a file path on GameAudio.System and play them on the game's Sfx, Music or Ui channel group so they mix with game audio and obey the player's volume sliders, without ever owning or pumping the FMOD system.
    game_types: [KSA.GameAudio, Brutal.FmodApi.FmodSystem, Brutal.FmodApi.Sound, Brutal.FmodApi.Channel, Brutal.FmodApi.Mode, KSA.ChannelGroupType, KSA.ChannelGroupReference, KSA.ModLibrary]
    engine_pointers:
      - current/decomp/KSA/GameAudio.cs System, OnApplicationStart (Init 1024, 3D right-handed, file callbacks, Master/Sfx/Ui/Music groups), GetChannelGroup L660-L680, CreateFmodSound L270-L280, UpdateAudio
      - current/decomp/KSA/ChannelGroupReference.cs
      - current/decomp/KSA/Program.cs PostRender L2362 (GameAudio.UpdateAudio pumps FMOD)
      - current/decomp/Brutal.FmodApi/Fmod.cs TryCreateSound, TryCreateStream, TryPlaySound
