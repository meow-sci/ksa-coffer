        technique: fmod-audio
        note: "TrySet3dAttributes(spatial.PositionView(), VelocityView()) every frame after Mode._3d | _3dLinearRolloff, min/max (min(10, range*0.1), range), spread 0 for stereo files, Doppler 0; native LoopNormal for zero gap, otherwise RepeatPlayback.Advance counts real seconds from observed completion and keeps elapsed silence when the gap is edited; stop on vessel loss; scene-save participant restores paused sounds. Possible finish-path issue noted by static reading (strict TrySetPaused before tolerant TryIsPlaying), unverified in game."
