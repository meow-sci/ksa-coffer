  - slug: release-sound-channels-at-scene-change-and-exit
    title: Stop and release sound channels at scene change and game exit
    summary: Stop held channels when the owner, the scene or a save load goes away, and know that by StarMapUnload the game has already closed FMOD (Program.Dispose calls GameAudio.Release before StarMap invokes unload hooks), so unload-time audio cleanup is moot and calls must be guarded.
    game_types: [KSA.Program, KSA.GameAudio, KSA.ExplosionSoundSystem, KSA.IChannel, Brutal.FmodApi.FmodSystem, KSA.Universe]
    engine_pointers:
      - current/decomp/KSA/Program.cs Dispose L1362-L1488 (GameAudio.Release at L1485, after Glfw.Terminate)
      - current/decomp/KSA/GameAudio.cs Release (System.Close then System.Release), OnApplicationStart
      - current/decomp/KSA/Universe.cs DeserializeSave (ExplosionSoundSystem.StopAll for the engine's own)
      - content/mods/starmap/features/unload-and-shutdown.md (StarMapUnload runs after Main returns and Dispose)
    lifecycle: [event:shutdown, event:starmap-unload, event:load]
    approaches:
      - n: 1
        title: StopAll at StarMapUnload, plus Stop(stopImmediate) on world reload
        mod: ksarmory
        features: [mods/ksarmory/features/spatial-gun-and-motor-sounds, mods/ksarmory/features/burst-sound-at-blast-arrival]
        technique: starmap-lifecycle
        note: "[StarMapUnload] calls StopAll on the gun and motor players because pooled channels belong to the game; the same classes are reset from the world-reload hook (BurstSound.Clear stops channels with stopImmediate as Universe.DeserializeSave does for the engine's own). Cross-check the timing claim against the ksacars note before presenting StopAll at unload as effective."
      - n: 2
        title: Stop on scene exit and tolerate a dead audio system
        mod: ksacars
        features: [mods/ksacars/features/engine-sound-crossfade, mods/ksacars/features/rocket-sound-without-engine]
        technique: starmap-lifecycle
        note: "StopAll runs when the craft leaves a flight scene, when the fault limiter disables the mod, and in [StarMapUnload]; the last is documented as moot because Program.Dispose already closed FMOD, so every channel call is wrapped in try and fails quietly."
      - n: 3
        title: Dispose all streams on save reset before vehicles are replaced
        mod: unscience
        features: [mods/unscience/features/byo-music-vessel-3d-audio]
        technique: save-sidecar
        note: "The scene-save participant's Reset is Dispose: every stream is stopped and released before KSA replaces the vehicles; target loss (vehicle disposed or no longer the same object) stops the entry; Restore re-creates sounds paused."
      - n: 4
        title: Release sounds only after no channel plays them
        mod: gatos
        features: [mods/gatos/features/fmod-audio-playback]
        technique: fmod-audio
        note: "Tick prunes stopped channels, then releases cached Sounds whose clip version was evicted and that no channel still plays; teardown frees only what the mod created and never calls System.Close or Release because the game owns the system."
    related: [clean-up-on-game-exit, hold-and-move-a-spatial-channel-every-frame, persist-vessel-references-across-save-and-load, contain-exceptions-in-starmap-hooks, play-sound-files-through-the-games-fmod-system]
    borrowed_from: []

