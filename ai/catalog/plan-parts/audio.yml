  - slug: drive-sound-parameters-from-code
    title: Drive a sound's Param curves from code
    summary: Set the named parameters a sound's <Param> curves listen to (Throttle, Distance, Pressure, Intensity, Iva) with SetParameter and a KeyHash, knowing the engine stores the value and applies it in GameAudio.UpdateAudio, and that played by hand a sound's parameters read zero.
    game_types: [KSA.IChannel, KSA.ChannelWrapper, KSA.CompoundChannelWrapper, KSA.MultiChannelWrapper, KSA.SoundParameterData, KSA.KeyHash, KSA.GameAudio]
    engine_pointers:
      - current/decomp/KSA/SoundParameterData.cs (Type Volume/Pitch/Lpf/Hpf, InMin/InMax/OutMin/OutMax, Reverse mode, Rule)
      - current/decomp/KSA/ChannelWrapper.cs SetParameter, ApplyParameters L212-L246
      - current/decomp/KSA/GameAudio.cs UpdateAudio (ApplyParameters per active channel)
      - current/decomp/KSA/ExplosionSoundSystem.cs (reference for Distance, Pressure, Intensity)
    lifecycle: [frame:draw-ui, frame:post-render]
    approaches:
      - n: 1
        title: Engine parameters mirrored from Vehicle.UpdateAudio
        mod: ksacars
        features: [mods/ksacars/features/rocket-sound-without-engine]
        technique: fmod-audio
        note: "Prebuilt KeyHash.Make hashes; parameters set in StarMapAfterGui are consumed in the same frame's PostRender apply pass; CompoundChannelWrapper fans SetParameter to start, loop, stop and the subscribed cluster channel; parameter multipliers reset after each apply so they must be set every frame."
      - n: 2
        title: Explosion parameters set by hand on a MultiSound
        mod: ksarmory
        features: [mods/ksarmory/features/burst-sound-at-blast-arrival]
        technique: fmod-audio
        note: "ExplosionBig's three layers mix on Distance (100-1000 m crack versus far report), Pressure (echo layer) and Intensity; the engine's ExplosionSoundSystem sets them, but a sound played by hand needs them set explicitly or the layers mix wrong; MultiChannelWrapper forwards pitch and parameters to all layers."
    related: [reuse-the-stock-engine-sound-for-custom-thrust, play-a-stock-explosion-sound-on-your-own-schedule, understand-the-games-sound-and-music-xml-types, hold-and-move-a-spatial-channel-every-frame]
