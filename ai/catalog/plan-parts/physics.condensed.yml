    title: Impact prediction in a co-rotating atmosphere
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/boostback-impact-prediction
    technique: custom-physics
    note: Integrate gravity and drag on air-relative velocity with the atmosphere rotating with the body.
