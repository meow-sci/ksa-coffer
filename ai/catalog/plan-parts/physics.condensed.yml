- slug: place-a-vessel-on-a-surface-at-latitude-and-longitude
  title: Place a vessel on a surface at a latitude and longitude or on a structure
  summary: Use Vehicle.TeleportToLocation, which queues an input event applied at the next PrepareFrame, correct
    its bounds-based clearance when the vessel is not nose-up, and set a craft down on a roof by lending the structure's
    surface height for the start-state computation.
  game_types:
  - KSA.Vehicle
  - KSA.InputEvents
  - KSA.Celestial
  - KSA.LocationReference
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs TeleportToLocation, GetInitialKinematicStateForLocation
  - current/decomp/KSA/InputEvents.cs
  - current/decomp/KSA/Vehicle.cs TeleportToLocation, CreateVehicle
  lifecycle:
  - frame:draw-ui
  - frame:input
  - frame:prepare
  - event:teleport
  approaches:
  - n: 1
    title: Queue TeleportToLocation once per action
    mod: ksagolf
    features:
    - mods/ksagolf/features/craft-mover
    - mods/ksacars/features/craft-mover-mouse-pick-place
    technique: starmap-lifecycle
    note: Pick, then set down; the placement is deferred to the next PrepareFrame.
  - n: 2
    title: Transpile the GetInitialKinematicStateForLocation call for head-up bounds
    mod: unscience
    features:
    - mods/unscience/features/iron-man-surface-teleport-correction
    technique: harmony-transpiler
    note: GetInitialKinematicStateForLocation assumes body +X is up and measures clearance below the min-X face.
  - n: 3
    title: Lend the pad template's SurfaceHeight around TeleportToLocation
    mod: ksastructures
    features:
    - mods/ksastructures/features/terrain-height-roof-override
    technique: harmony-prefix
    note: 'Sub-step (give it a section on setting a craft on a structure): Lend the pad template''s SurfaceHeight
      around TeleportToLocation. Set, call and restore so the start state is computed above the roof.'
  - n: 4
    title: Build one-part craft in code and set them on the ground
    mod: ksastructures
    features:
    - mods/ksastructures/features/office-furniture-craft
    technique: harmony-prefix
    note: 'Sub-step (give it a section on setting a craft on a structure): Build one-part craft in code and set
      them on the ground. ModLibrary.Get<PartTemplate>, Vehicle.CreateVehicle, then TeleportToLocation with the
      floor height lent.'
