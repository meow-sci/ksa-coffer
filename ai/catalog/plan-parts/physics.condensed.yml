    title: Density ratio to one reference air, ocean density below the waterline
    mod: ksagolf
    features:
    - mods/ksagolf/features/golf-ball-physics
    technique: custom-physics
    note: 'GetAtmosphericDensityAtAltitude and OceanReference.Density; never gate on IsValid; 0 for airless, 1 for
      unreadable. Sub-step (give it a section on gravity): Body-fixed surface gravity from IParentBody.Mu. Mu is
      a default interface member so it needs a cast; the integrator works in the rotating body-fixed frame.'
  - n: 2
    title: Shell and missile drag with the same density read
    mod: ksarmory
    features:
    - mods/ksarmory/features/point-gravity-and-atmosphere-model
    - mods/ksarmory/features/unguided-ballistic-lead
    technique: quadratic-drag
    note: 'Drag against a fixed reference air for every body; the ballistic-lead solver flies simulated shells through
      the identical model. Sub-step (give it a section on gravity): Point gravity at the back-dated sub-step plus
      the body''s own fall. mu / r^2 toward the parent evaluated at the sub-step epoch and the parent''s acceleration
      toward its primary. Sub-step (give it a section on leading a target): Fixed-point iteration plus shooting
      method with Broyden updates. Iterate time of flight to a tolerance, then fly rounds with the mod''s drag and
      gravity and correct from the turns already flown.'
