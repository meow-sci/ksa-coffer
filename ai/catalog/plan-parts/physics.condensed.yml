category: physics
description: Forces, drag and aero, wheels and suspension, colliders, Bepu, custom motion, terrain contact and physics-safe
  mutation of simulated state, including patches inside the worker-thread vehicle solver.
topics:
- slug: mutate-vehicles-at-a-physics-safe-point
  title: Mutate vehicles at a physics-safe point
  summary: Vehicle state written from an ordinary StarMap hook or ImGui button is overwritten by the physics step
    already in flight. This topic shows the four windows where a write survives and which kind of change belongs
    in each.
  game_types:
  - KSA.Vehicle
  - KSA.Universe
  - KSA.Program
  - KSA.JobSystems
  - KSA.VehicleUpdateTask
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  - current/decomp/KSA/Universe.cs PrepareVehicleWorkers, ExecuteNextVehicleSolvers, ApplyVehicleSolvers
  - current/decomp/KSA/Program.cs PrepareFrame
  - current/decomp/KSA/JobSystems.cs VehicleSolver
  lifecycle:
  - frame:prepare
  - frame:apply-solvers
  - frame:dispatch-solvers
  - frame:draw-ui
  approaches:
  - n: 1
    title: Write inside a Vehicle.PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/prepareworker-impulse-injection
    - mods/ksarmory/features/prepareworker-prefix-command-window
    - mods/ksastructures/features/lift-moving-landmark
    technique: harmony-prefix
    note: The window just before KSA snapshots a vehicle for the worker; queue from any hook, perform here. Explain
      why writes from StarMap hooks are lost (ApplyVehicleSolvers overwrites the kinematic states, the worker snapshot
      is taken before the next Apply) and how GetPhysicsStatesMutable is used. KSArmory demonstrates queuing attitude,
      throttle, staging, mass writes; KSACars velocity writes; KSAStructures position writes after taking a body
      off rails.
  - n: 2
    title: Drain a command queue in a Priority.First prefix on Universe.ExecuteNextVehicleSolvers
    mod: gatos
    features:
    - mods/gatos/features/solver-phase-command-drain
    - mods/ksagolf/features/launch-site-surface-raycast
    - mods/unscience/features/kiwis-marbles-celestial-welding
    technique: harmony-prefix
    note: 'Runs after Apply*Solvers and before the step is queued, so orbit swaps, refills, teleports and shape-registry
      reads are safe. Compare with the PrepareWorker window: earlier, once per frame rather than once per vehicle,
      and where the shapes registry is guaranteed idle.'
  - n: 3
    title: Run a callback at the PrepareFrame handoff with a GetJobSimStep transpiler
    mod: unscience
    features:
    - mods/unscience/features/lib-physics-frame-hook
    - mods/unscience/features/garrys-torch-vehicle-welding
    - mods/unscience/features/dent-wizard-vessel-launcher
    - mods/unscience/features/godzilla-vessel-scaling
    technique: harmony-transpiler
    note: A shared hook (Enqueue one-shots, BeforePhysics per-frame event, world-change deferral) that rewrites
      the single GetJobSimStep call. Emphasise the exactly-once call-order validation that makes the hook disable
      itself when the game changes, and the stateTime value passed to callbacks.
  - n: 4
    title: Join JobSystems.VehicleSolver before mutating from a frame hook
    mod: ksarmory
    features:
    - mods/gatos/features/welds-vessel-anchoring
    - mods/ksarmory/features/safe-vehicle-destruction-and-part-failure
    technique: reflection
    note: When the edit cannot wait for a dispatch window, Wait() on the vehicle solver first, mutate, and accept
      that results staged for the craft must not land on a changed craft. Covers batching kills behind one barrier
      and queuing PartFailureEvent rather than splitting directly.
  related:
  - write-worker-thread-safe-solver-patches
  - inject-forces-and-impulses-at-the-physics-safe-point
  - weld-one-vessel-to-another
  - teleport-a-vessel-by-building-a-new-orbit
  borrowed_from:
  - mods/ksa-advancedflightcomputer/features/post-solver-vehicle-tick
  dedupe_with:
  - patching/pass-data-to-patches-on-the-flight-computer-worker-copy
  - flight-and-orbits/run-code-after-physics-results-land
- slug: write-worker-thread-safe-solver-patches
  title: Write worker-thread-safe patches inside the vehicle solver
  summary: Patches on ComputeDerivatives, the atmosphere functions, the flight computer or the constraint sim run
    on vehicle worker threads, per substep, possibly several at once. This topic collects the patterns the mods
    use to share data with them without locks, allocation or exceptions.
  game_types:
  - KSA.PhysicsStates
  - KSA.PhysicsBubble
  - KSA.VehicleUpdateTask
  - KSA.PhysicsEnvironment
  - KSA.ConstraintSim
  - KSA.KittenLocomotion
  - KSA.FlightComputer
  engine_pointers:
  - current/decomp/KSA/VehicleUpdateTask.cs
  - current/decomp/KSA/PhysicsBubble.cs
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives
  lifecycle:
  - physics:vehicle-solver
  - physics:bepu
  - frame:dispatch-solvers
  approaches:
  - n: 1
    title: Pure, allocation-free, never-throwing code over the in arguments
    mod: ksaero
    features:
    - mods/ksaero/features/body-of-revolution-aerodynamics
    - mods/ksaero/features/stock-drag-delegate-fallback
    technique: harmony-transpiler
    note: Explain the call chain PrepareFrame -> ExecuteNextVehicleSolvers -> VehicleUpdateTask on JobSystems.VehicleSolver
      -> ComputeDerivatives, what MarkFailed does when the step throws (the bubble step is not applied that frame),
      and why KSAero uses only its arguments and falls back to stock on degenerate geometry.
  - n: 2
    title: Read-only tables filled on the main thread before physics starts
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/measured-flight-atmospheres
    - mods/ksastructures/features/dry-volume-below-sea-level
    technique: reflection
    note: ConditionalWeakTable keyed on the game's reference object, populated in a load-time postfix, read by allocation-free
      prefixes on the worker. Also volatile array swaps for data that changes at runtime.
  - n: 3
    title: Concurrent registries keyed by reference
    mod: unscience
    features:
    - mods/unscience/features/kitchen-sink-g-load-protection
    - mods/unscience/features/the-tick-vessel-indestructibility
    technique: reflection
    note: ConcurrentDictionary with ReferenceEqualityComparer written by the UI and read by workers, an IsDisposed
      check on read and a per-frame prune on the main thread.
  - n: 4
    title: Volatile snapshot handoff from worker patches to the main thread
    mod: ksagolf
    features:
    - mods/ksagolf/features/course-colliders-as-clutter
    - mods/ksastructures/features/first-person-kitten-view
    technique: worker-thread-patch
    note: Worker prefixes on ConstraintSim passes and KittenLocomotion.StepGrounded read an immutable snapshot published
      by the main thread and write results through volatile fields; one sim per prefix call, no shared mutable state.
  - n: 5
    title: Identify the vehicle a callback runs for with a ThreadStatic set in a prefix and cleared in a finalizer
    mod: ksastructures
    features:
    - mods/ksastructures/features/terrain-height-roof-override
    technique: harmony-finalizer
    note: Functions like GetTerrainHeightFromDirCce do not receive the vehicle. A Priority.First prefix on Vehicle.PrepareWorker
      sets a thread-static and a Priority.Last finalizer clears it, so later patches can tell vehicle-driven calls
      from camera and UI calls.
  - n: 6
    title: Immutable commands published before the solver job is queued
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
    technique: harmony-postfix
    note: A single postfix on FlightComputer.ComputeControl runs every mod actuator writer on the worker, each consuming
      an immutable command handed over at PrepareWorker time, with wake and off-rails requests merged into the stock
      output.
  related:
  - mutate-vehicles-at-a-physics-safe-point
  - replace-the-stock-aerodynamic-force-model
  - mutate-the-shared-bepu-shape-registry
  borrowed_from:
  - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
  - mods/ksastructures/features/dry-volume-below-sea-level
  - mods/ksastructures/features/first-person-kitten-view
  dedupe_with:
  - patching/patch-methods-that-run-on-background-threads
  - patching/pass-data-to-patches-on-the-flight-computer-worker-copy
  - testing-and-tooling/verify-a-solve-is-pure-before-threading
  - external-io/export-game-state-to-other-threads
- slug: inject-forces-and-impulses-at-the-physics-safe-point
  title: Inject forces, impulses and velocity changes at the physics safe point
  summary: Push a craft from a mod (driven car, blast, boost, hover, lift, a flip or lift-in-place) by writing velocity,
    spin or pose deltas in the PrepareWorker prefix or the solver-dispatch window, and keep those forces bounded
    at any time warp with exponential shares, per-step caps and saturation.
  game_types:
  - KSA.Vehicle
  - KSA.PhysicsStates
  - KSA.Kinematic
  - KSA.Universe
  - KSA.Celestial
  - KSA.FlightComputer
  - KSA.SimStep
  engine_pointers:
  - current/decomp/KSA/Vehicle.cs PrepareWorker, GetPhysicsStatesMutable
  - current/decomp/KSA/PhysicsStates.cs
  - current/decomp/KSA/Vehicle.cs PrepareWorker
  - current/decomp/KSA/Celestial.cs GetTerrainHeightFromDirCcf
  - current/decomp/KSA/SimStep.cs
  lifecycle:
  - frame:dispatch-solvers
  - frame:draw-ui
  approaches:
  - n: 1
    title: Add velocity deltas in the PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/prepareworker-impulse-injection
    technique: harmony-prefix
    note: 'Write VelocityPhys and AngularVelocityPhys in the window before the worker snapshot; the generic recipe
      and its limits (railed craft ignore writes, see keep-a-pushed-craft-off-rails). Sub-step (give it a section):
      rotate or lift in place by writing PositionPhys and Body2Phys and zeroing both velocities in the same window.
      Write PositionPhys, Body2Phys and zero velocities in the PrepareWorker prefix. The unflip action; explain
      why position, attitude and both velocities must change together.'
  - n: 2
    title: Summed per-part drag-style shove with torque from a blast front
    mod: ksarmory
    features:
    - mods/ksarmory/features/blast-shove-impulse
    technique: impulse-write
    note: 'Each part the front reaches adds a push and a torque about the centre of mass, saturated so nothing outruns
      the wind, written as one impulse; covers Kinney-Graham overpressure and the post-front wind, off-rails handling
      and the orbit rebuild. Sub-step (give it a section on warp-stable forces): Saturate a pushed velocity so nothing
      outruns the driving flow. Clamp the induced velocity to the local wind speed rather than integrating an unbounded
      drag.'
  - n: 3
    title: Impulsive kick from the solver-dispatch window
    mod: gatos
    features:
    - mods/gatos/features/debug-cheats-teleport-refuel-warp
    technique: harmony-prefix
    note: Debug cheat that applies an instantaneous velocity change in the ExecuteNextVehicleSolvers prefix; shows
      the simpler no-per-part variant.
  - n: 4
    title: Velocity and spin deltas gated by hatches in the PrepareWorker prefix
    mod: ksacars
    features:
    - mods/ksacars/features/rocket-lift-hover-boost-downforce
    technique: harmony-prefix
    note: 'Sub-step (give it a section): lift, hover, boost and downforce. Velocity and spin deltas gated by hatches
      in the PrepareWorker prefix. Lift with airborne attitude hold, hover cancelling gravity, boost and downforce
      all expressed as per-step deltas; covers the 0.1 s hatch gating. Sub-step (give it a section on warp-stable
      forces): Fractional (1 - exp(-k dt)) shares and per-step caps. Replace force-based damping with velocity shares
      that approach a target; derive the cap from the step length.'
  - n: 5
    title: Hover and touchdown under real engine power with a PID
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/terminal-hover-touchdown
    technique: harmony-prefix
    note: 'Sub-step (give it a section): lift, hover, boost and downforce. Hover and touchdown under real engine
      power with a PID. Quadratic sink profile, per-axis PID with gravity feedforward and terrain height from the
      body-fixed frame; contrasts commanding engines with injecting forces.'
  related:
  - keep-a-pushed-craft-off-rails
  - mutate-vehicles-at-a-physics-safe-point
  - place-a-vessel-on-a-surface-at-latitude-and-longitude
  - query-terrain-height-under-a-point
  borrowed_from:
  - mods/gatos/features/debug-cheats-teleport-refuel-warp
  - mods/ksa-advancedflightcomputer/features/terminal-hover-touchdown
  merged_from:
  - apply-impulses-and-velocity-changes-to-a-vehicle
  - reposition-or-rotate-a-vehicle-in-place
  - add-lift-hover-boost-and-downforce-to-a-craft
  - keep-custom-forces-stable-under-time-warp
- slug: keep-a-pushed-craft-off-rails
  title: Keep a craft under full physics while your mod pushes it
  summary: A railed (analytic orbit) craft ignores velocity writes. Make the game keep the craft in the physics
    bubble, and wake it correctly when it is already on rails.
  game_types:
  - KSA.PhysicsBubble
  - KSA.Vehicle
  - KSA.FlightComputer
  engine_pointers:
  - current/decomp/KSA/PhysicsBubble.cs KittenWantsWake
  - current/decomp/KSA/Vehicle.cs TakeOffRails, UpdateFromAnalytic
  lifecycle:
  - startup:all-mods-loaded
  - frame:dispatch-solvers
  - physics:vehicle-solver
  approaches:
  - n: 1
    title: Postfix PhysicsBubble.KittenWantsWake from a concurrent set
    mod: ksacars
    features:
    - mods/ksacars/features/keep-thrusting-craft-off-rails
    technique: harmony-postfix
    note: Both rails decisions ask the per-craft wake check on the worker; answer true for marked craft. Wake a
      landed craft with TakeOffRails and a coasting one by UpdateFromAnalytic with Maneuvering.
  - n: 2
    title: Request wake or off-rails from the flight computer command sink
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
    technique: harmony-postfix
    note: Mod actuator writers merge wake and off-rails requests into the stock ComputeControl output instead of
      patching the bubble.
  related:
  - inject-forces-and-impulses-at-the-physics-safe-point
  - write-worker-thread-safe-solver-patches
  borrowed_from:
  - mods/ksacars/features/keep-thrusting-craft-off-rails
  - mods/ksa-advancedflightcomputer/features/flight-computer-command-sink
- slug: replace-the-stock-aerodynamic-force-model
  title: Replace the stock aerodynamic force model
  summary: Swap KSA's box drag for your own lift and drag model that applies a body-axis force through the centre
    of mass on every vehicle inside the solver, including how to compute Mach number and the speed of sound from
    the game atmosphere on the worker thread and on the main thread.
  game_types:
  - KSA.PhysicsStates
  - KSA.PhysicsEnvironment
  - KSA.VehicleProperties
  - KSA.BoundingBoxCdA
  - KSA.PhysicalAtmosphereReference
  engine_pointers:
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives, ComputeDrag
  - current/decomp/KSA/VehicleProperties.cs RecomputeAerodynamicProperties
  - current/decomp/KSA/PhysicsEnvironment.cs
  - current/decomp/KSA/PhysicalAtmosphereReference.cs
  lifecycle:
  - physics:vehicle-solver
  - startup:all-mods-loaded
  - frame:draw-ui
  approaches:
  - n: 1
    title: Call-site transpiler on ComputeDerivatives writing the Disturbances accumulator
    mod: ksaero
    features:
    - mods/ksaero/features/body-of-revolution-aerodynamics
    - mods/ksaero/features/computedrag-call-site-transpiler
    - mods/ksaero/features/stock-drag-delegate-fallback
    - mods/ksaero/features/mach-from-game-atmosphere
    technique: harmony-transpiler
    note: 'Swap the operand of the one ComputeDrag call whose arguments load AtmosphericDensity for a same-signature
      method that adds a force to Disturbances; explains why patching the callee fails (AggressiveInlining), the
      byref-parameter resolution and the stock-delegate fallback. Sub-step (give it a section on Mach and speed
      of sound): sqrt(1.4 p / rho) from PhysicsEnvironment inside the solver. Use the environment already filled
      for the vehicle; constant per body (about 340 m/s on Earth).'
  - n: 2
    title: Speed of sound from the atmosphere reference for a measurement tool
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/drag-table-measurement
    technique: custom-physics
    note: 'Sub-step (give it a section on Mach and speed of sound): Speed of sound from the atmosphere reference
      for a measurement tool. Main-thread variant used to bin drag samples by Mach.'
  related:
  - write-worker-thread-safe-solver-patches
  - measure-drag-and-lift-of-the-active-aero-model
  - swap-one-call-inside-a-game-method-with-a-transpiler
  - apply-drag-and-gravity-to-a-mod-simulated-body
  borrowed_from:
  - mods/ksaero/features/computedrag-call-site-transpiler
  - mods/ksaero/features/stock-drag-delegate-fallback
  merged_from:
  - compute-mach-number-from-the-game-atmosphere
- slug: measure-drag-and-lift-of-the-active-aero-model
  title: Measure drag and lift coefficients of the active aero model
  summary: Read what the game (or an aero mod) actually does to a vehicle by calling the force model on a copy of
    its state at chosen airspeeds, then fit Cd and CL over Mach and angle of attack.
  game_types:
  - KSA.PhysicsStates
  - KSA.ReadOnlyPhysicsStates
  - KSA.PhysicsEnvironment
  - KSA.Vehicle
  engine_pointers:
  - current/decomp/KSA/PhysicsStates.cs ComputeDerivatives (static, ten parameters)
  lifecycle:
  - frame:dispatch-solvers
  - frame:draw-ui
  approaches:
  - n: 1
    title: Static ComputeDerivatives on copied state with dt 0 and no thrusters
    mod: ksa-advancedflightcomputer
    features:
    - mods/ksa-advancedflightcomputer/features/drag-table-measurement
    - mods/ksa-advancedflightcomputer/features/aerodynamic-glide-impact-steering
    technique: custom-physics
    note: Copy the physics structs, set the airspeed per sample, read the returned force; automatically includes
      any transpiled model such as KSAero. Feeds glide steering through the measured lift curve.
  related:
  - replace-the-stock-aerodynamic-force-model
  borrowed_from:
  - mods/ksa-advancedflightcomputer/features/aerodynamic-glide-impact-steering
  dedupe_with:
  - flight-and-orbits/measure-lift-and-drag-under-the-active-aero-model
- slug: override-atmosphere-and-ocean-in-the-physics-environment
  title: Override a body's atmosphere profile or ocean in the physics environment
  summary: Make a planet's air follow a measured or generated density and pressure profile for drag and engines,
    or zero the ocean in a region so a basement or dry dock can sit below the waterline, by redirecting the atmosphere
    functions and PhysicsEnvironment values the solver reads.
  game_types:
  - KSA.PhysicalAtmosphereReference
  - KSA.AstronomicalTemplate
  - KSA.PhysicsEnvironment
  - KSA.Rendering.Water.Rendering.OceanRenderer
  engine_pointers:
  - current/decomp/KSA/PhysicalAtmosphereReference.cs GetAtmosphericDensityAtAltitude
  - current/decomp/KSA/PhysicsEnvironment.cs RecomputePositionalValues
  lifecycle:
  - startup:asset-load
  - physics:vehicle-solver
  - startup:all-mods-loaded
  - render:ocean
  approaches:
  - n: 1
    title: Prefix the density and pressure functions and move the private boundary height
    mod: realatmospheres
    features:
    - mods/realatmospheres/features/measured-flight-atmospheres
    technique: harmony-prefix
    note: Generate a table per reference in an OnDataLoad postfix, store it in a ConditionalWeakTable, set the private
      _height and serve allocation-free lookups to worker threads.
  - n: 2
    title: Postfix PhysicsEnvironment.RecomputePositionalValues on the worker
    mod: ksastructures
    features:
    - mods/ksastructures/features/dry-volume-below-sea-level
    technique: harmony-postfix
    note: 'Sub-step (give it a section on removing the ocean): Postfix PhysicsEnvironment.RecomputePositionalValues
      on the worker. Zero OceanRadius, Volume and SurfaceArea inside a radial column, except for craft that already
      float; volatile data swap for the region.'
  related:
