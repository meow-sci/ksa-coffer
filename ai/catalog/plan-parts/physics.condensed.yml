- slug: make-a-vessel-indestructible
  title: Make a vessel indestructible or immune to g-load
  summary: 'Veto force-based destruction for chosen vessels without editing shared part templates: patch the crash-tolerance
    getter, the structural-failure detector or the g-load read, and persist the per-vessel setting across saves
    by stable identity.'
