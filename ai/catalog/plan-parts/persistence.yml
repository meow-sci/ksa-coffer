    title: Import user files into a mod-owned catalog folder and reference them by name
    summary: Instead of saving arbitrary paths that break when a file moves, copy each imported PNG, GLB or sound once into a catalog folder, never overwrite, validate bare file names, and have saved scenes refer to the catalog name so a scene save can reproduce them.
