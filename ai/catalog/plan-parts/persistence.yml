  - slug: keep-big-user-data-in-copy-on-write-overlays
    title: Keep large per-profile data in copy-on-write overlays over an immutable base
    summary: A mod that ships a disk image should never write into its install folder. Copy a versioned base once into the data folder, create a qcow2 overlay per profile with qemu-img and a relative backing path, pin the boot to the overlay's guest version, grow but never shrink, and guard with a PID lock.
    game_types: []
    engine_pointers: []
    lifecycle: [thread:background]
    approaches:
      - n: 1
        title: qemu-img overlay per profile, version-pinned boots, grow-only resize, lock file
        mod: gatos
        features: [mods/gatos/features/qcow2-overlay-guest-disks]
        technique: background-thread
        note: "EnsureBaseInstalled copies base-v<N>.qcow2 once, never overwriting; CreateOverlay runs in the disks folder so the backing reference stays a bare relative name; qemu-img commit is never used; orphaned overlays are moved aside; DiskLock reclaims stale locks."
    related: [choose-where-a-mod-stores-its-files, ship-default-config-and-keep-user-edits]
    borrowed_from: []
