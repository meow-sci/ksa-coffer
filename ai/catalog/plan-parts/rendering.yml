category: rendering
description: Drawing things the game does not draw by itself - ImGui overlays on the sky and world, custom Vulkan passes, textures, meshes, lights, particles, plumes and decals - plus the Vulkan resource discipline that keeps those additions alive across frames, resizes and shutdown.
topics:
  # ---------------------------------------------------------------- overlays on the sky and world (ImGui)
  - slug: choose-a-draw-list-for-world-overlays
    title: Choose the ImGui draw list for sky and world overlays
    summary: Every 2D overlay on the 3D view (constellation lines, brackets, measurement lines, map markers, gunner sights) is an ImGui draw list written after the game has computed the camera. The choice of window versus background, foreground or per-viewport list decides whether the overlay sits under panels, receives clicks, follows a torn-off monitor and survives the HUD being hidden.
    game_types: [KSA.ImGuiHelper, KSA.Program, KSA.IViewport, KSA.ViewportRegistry]
    engine_pointers:
      - current/decomp/KSA/ImGuiHelper.cs GetOverlayDrawList
      - current/decomp/KSA/Program.cs OnDrawUiViewports (StarMapAfterGui postfix point)
      - current/decomp/KSA/ViewportRegistry.cs GameViews and MainViewport
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Transparent NoInputs full-viewport window and its window draw list
        mod: ohmystars
        features:
          - mods/ohmystars/features/sky-overlay-lines-and-labels
          - mods/ksarmory/features/world-anchored-screen-markers
          - mods/compendium/features/body-pointer-overlay
        technique: imgui-drawlist
        note: A window sized to the main viewport with zero background alpha and NoDecoration/NoInputs/NoNav flags, drawn from StarMapAfterGui. Clicks fall through to the game; the overlay is z-ordered like a window, so it can land over or under panels. Compare the three mods' flag sets.
      - n: 2
        title: ImGuiHelper.GetOverlayDrawList (main-viewport background list)
        mod: ksa-measuretools
        features:
          - mods/ksa-deltavmap/features/map-mode-transfer-overlay
        technique: imgui-drawlist
        note: The stock helper returns the background draw list for the main viewport, the same list the stock body labels and Transfer Planner markers use, so content sits under every window. Only meaningful for the main viewport; other viewports return the window list. Includes the try/catch-once-per-type guard that keeps a projection bug from breaking the frame.
      - n: 3
        title: Pick the draw list per view (background, clipped window, platform-viewport foreground)
        mod: ksarmory
        features: [mods/ksarmory/features/gunner-sight-overlay]
        technique: imgui-drawlist
        note: When a camera feed can be the main view, a mod-drawn camera window or a torn-off window on another monitor, resolve per frame which list reaches that picture and which camera projects into it.
    related: [project-world-positions-to-screen, keep-overlays-updating-when-hud-hidden, draw-markers-and-annotations-on-world-objects]
    borrowed_from:
      - mods/ksa-deltavmap/features/map-mode-transfer-overlay
      - mods/ksarmory/features/world-anchored-screen-markers
      - mods/ksarmory/features/gunner-sight-overlay
      - mods/compendium/features/body-pointer-overlay

  - slug: project-world-positions-to-screen
    title: Project world and sky positions to screen pixels
    summary: Turn a position in the game's frames into an ImGui screen coordinate, including the cases the engine call does not handle for you - behind the camera, off the edge, inside the viewport's pixel offset and far-away directions that are not real points.
    game_types: [KSA.Camera, KSA.IViewport, KSA.Program, KSA.GalacticPlane]
    engine_pointers:
      - current/decomp/KSA/Camera.cs EgoToScreen, EclToScreen, EgoToClip, IsPointWithinFov, GetPositionEgo
      - current/decomp/KSA/Universe.cs DrawGalacticGrid (stock reference for skipping NaN and clipping)
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Ego-space direction times a sphere radius, then Camera.EgoToScreen plus viewport origin
        mod: ohmystars
        features: [mods/ohmystars/features/sky-overlay-lines-and-labels]
        technique: sky-projection
        note: Sky directions have no distance, so they are placed on the same 19.5-unit camera-centred sphere the star sprites use; NaN results (behind the camera) are skipped and the ImGui main viewport origin is added. Straight screen segments between projected endpoints are exact great circles under perspective.
      - n: 2
        title: Body-fixed or orbit-relative anchors lifted to ecliptic, then Camera.EclToScreen
        mod: ksarmory
        features:
          - mods/ksarmory/features/world-anchored-screen-markers
          - mods/ksa-deltavmap/features/map-mode-transfer-overlay
        technique: imgui-drawlist
        note: Real points are projected through the viewport's own camera; constant-pixel-size brackets, a crossed variant when the target is behind a planet and an edge arrow when it is off-screen. Map mode computes parent CCE positions from Orbit and lifts them with GetPositionEclFromCce.
      - n: 3
        title: Clip-space edge clamp for off-screen and behind-camera targets
        mod: compendium
        features:
          - mods/compendium/features/body-pointer-overlay
          - mods/ohmystars/features/star-pointer
        technique: imgui-drawlist
        note: IsPointWithinFov first, otherwise EgoToClip divided by w with the sign flipped for w<0 and scaled to the viewport rectangle. This is the reusable core of a pointer to anything not currently visible.
    related: [choose-a-draw-list-for-world-overlays, draw-lines-on-the-sky, occlude-overlays-behind-bodies, choose-ecl-or-ego-positions-for-rendering]
    borrowed_from:
      - mods/ksarmory/features/world-anchored-screen-markers
      - mods/ksa-deltavmap/features/map-mode-transfer-overlay
      - mods/compendium/features/body-pointer-overlay
      - mods/ohmystars/features/star-pointer

  - slug: draw-lines-on-the-sky
    title: Draw lines and labels on the sky
    summary: Draw constellation lines, boundary polylines and star names on KSA's sky from catalog data, sitting under panels and tracking the camera, including great-circle lines and small circles that stay correct under perspective.
    game_types: [KSA.Camera, KSA.Universe, KSA.GalacticPlane, KSA.InstancedStarTechnique, Brutal.ImGuiApi.ImGui]
    engine_pointers:
      - current/decomp/KSA/Universe.cs DrawGalacticGrid
      - current/decomp/KSA/GalacticPlane.cs EquatorialToEcliptic
      - current/decomp/KSA/InstancedStarTechnique.cs
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: ImGui window draw list from StarMapAfterGui with ego-space sky directions
        mod: ohmystars
        features: [mods/ohmystars/features/sky-overlay-lines-and-labels]
        technique: imgui-drawlist
        note: Catalog RA/Dec to ecliptic, times 19.5, projected per segment, drawn into a NoInputs full-screen window. Cover gnomonic projection (straight lines are great circles), subdividing small circles, per-segment culling and label placement.
    related: [project-world-positions-to-screen, draw-a-sky-coordinate-grid, convert-sky-coordinates-to-the-game-frame, occlude-overlays-behind-bodies, choose-a-draw-list-for-world-overlays]
    borrowed_from: []

  - slug: draw-a-sky-coordinate-grid
    title: Draw a celestial or galactic coordinate grid on the sky
    summary: Draw a labelled RA/Dec grid without cluttering the screen, built lazily as short arcs, frustum-culled, occluded by bodies and with first-come label overlap rejection.
    game_types: [KSA.Universe, KSA.Camera]
    engine_pointers:
      - current/decomp/KSA/Universe.cs DrawGalacticGrid (stock grid command to compare with)
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: One-degree arcs, clip-space frustum cull and CalcTextSize label rectangles
        mod: ohmystars
        features: [mods/ohmystars/features/ra-dec-grid]
        technique: imgui-drawlist
        note: Lazy arc build, 15 percent inflated clip-space test, per-segment occlusion, centred chart labels and a per-frame list of drawn rectangles for declutter. Reusable for any labelled screen overlay.
    related: [draw-lines-on-the-sky, occlude-overlays-behind-bodies]
    borrowed_from: []

  - slug: convert-sky-coordinates-to-the-game-frame
    title: Convert RA/Dec and galactic coordinates to KSA's ecliptic frame
    summary: Catalog data is in equatorial or galactic coordinates but the game draws and aims in ecliptic axes; apply the same J2000 obliquity rotation the engine uses and align it to the sky sphere.
    game_types: [KSA.GalacticPlane, KSA.Camera]
    engine_pointers:
      - current/decomp/KSA/GalacticPlane.cs EquatorialToEcliptic
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: J2000 obliquity rotation about X, then the 19.5 star sphere
        mod: ohmystars
        features: [mods/ohmystars/features/sky-overlay-lines-and-labels]
        technique: sky-projection
        note: Matches GalacticPlane.EquatorialToEcliptic; the same direction feeds both overlay drawing and orient-to-star targets, so one conversion path is shared.
    related: [draw-lines-on-the-sky, project-world-positions-to-screen]
    borrowed_from: [mods/ohmystars/features/stellarium-sky-cultures]

  - slug: occlude-overlays-behind-bodies
    title: Hide ImGui overlays behind planets and vessels
    summary: ImGui overlays have no depth buffer, so a constellation line or marker would show through a planet. A CPU ray-sphere test against the bodies between the camera and each overlay point restores the occlusion.
    game_types: [KSA.Camera, KSA.IOrbiter, KSA.IParentBody, KSA.StellarBody, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/Camera.cs GetPositionEgo
      - current/decomp/KSA/IOrbiter.cs Parent
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Per-frame ego-space sphere list and ray test per overlay point
        mod: ohmystars
        features: [mods/ohmystars/features/overlay-occlusion-by-bodies]
        technique: cpu-occlusion
        note: Bodies by MeanRadius and vehicles by bounding sphere, walked from the camera-followed object up to the root via IOrbiter.Parent and down via IParentBody.Children. Covers the cost trade-offs and the spheres to skip.
    related: [draw-a-sky-coordinate-grid, project-world-positions-to-screen]
    borrowed_from: []

  - slug: draw-markers-and-annotations-on-world-objects
    title: Draw markers, brackets and measurement annotations on world objects
    summary: Put a bracket on a craft, a lock cue on a contact, a measurement line with a plated label on a hull or a transfer-window gizmo in the map view, using projected points on an ImGui draw list rather than Vulkan.
    game_types: [KSA.Camera, KSA.IViewport, KSA.ImGuiHelper, KSA.Vehicle]
    engine_pointers:
      - current/decomp/KSA/TransferPlanner.cs (stock parent/target alignment marker)
      - current/decomp/KSA/ImGuiHelper.cs GetOverlayDrawList
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Constant-pixel-size brackets, cues and bars projected from craft and contact positions
        mod: ksarmory
        features: [mods/ksarmory/features/world-anchored-screen-markers]
        technique: imgui-drawlist
        note: Four overlays (system markers, lock cue, chase HUD, part health bars) sharing one projection pattern, edge arrows for off-screen targets, crossed marks for occluded targets, clickable hover labels.
      - n: 2
        title: Lines, curves, rings and plated labels for measurements
        mod: ksa-measuretools
        features:
          - mods/ksa-measuretools/features/overlay-drawlist-rendering
          - mods/ksa-measuretools/features/circle-and-face-angle-tools
        technique: imgui-drawlist
        note: Background list, 3D construction plane and ring overlays drawn as projected polylines; one-shot try/catch-per-exception-type; gate on view mode.
      - n: 3
        title: Map-mode markers and gizmos for future positions
        mod: ksa-deltavmap
        features:
          - mods/ksa-deltavmap/features/map-mode-transfer-overlay
          - mods/ksa-advancedflightcomputer/features/multi-pass-preview-rendering
        technique: imgui-drawlist
        note: Markers on the destination's real orbit at window open, phase angle and ejection arms, apsis/node/SOI markers on the viewport overlay list. Only valid while the viewport is in Map mode.
    related: [choose-a-draw-list-for-world-overlays, project-world-positions-to-screen, draw-extra-orbit-lines-with-the-game-line-renderer]
    borrowed_from:
      - mods/ksarmory/features/world-anchored-screen-markers
      - mods/ksa-measuretools/features/overlay-drawlist-rendering
      - mods/ksa-measuretools/features/circle-and-face-angle-tools
      - mods/ksa-deltavmap/features/map-mode-transfer-overlay

  - slug: point-at-an-offscreen-target
    title: Draw a pointer line from a window to a body or star, even off screen
    summary: Help the player find a selected body or star by drawing a line from the nearest corner of the mod window to the target, clamped to the screen edge when the target is outside the field of view or behind the camera.
    game_types: [KSA.Camera, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/Camera.cs IsPointWithinFov, EgoToClip, EgoToScreen
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Previous-frame window rectangle plus edge-clamped projection (body target)
        mod: compendium
        features: [mods/compendium/features/body-pointer-overlay]
        technique: imgui-drawlist
        note: Captures the window rectangle during the window draw and consumes it next frame; one or two lines from the nearest corners; rainbow colour mode.
      - n: 2
        title: Same technique for a catalog star on the sky sphere
        mod: ohmystars
        features: [mods/ohmystars/features/star-pointer]
        technique: imgui-drawlist
        note: Target is ApplyAlignment(direction) times 19.5 or the central star's ego position; shows the camera-behind w<0 handling.
    related: [project-world-positions-to-screen, choose-a-draw-list-for-world-overlays]
    borrowed_from: [mods/compendium/features/body-pointer-overlay, mods/ohmystars/features/star-pointer]

  - slug: draw-extra-orbit-lines-with-the-game-line-renderer
    title: Draw extra predicted orbits with the game's orbit-line renderer
    summary: Preview several candidate trajectories at once in the 3D and map views using the game's own line instances so they look and clip like stock orbits, with dimmed per-pass colours and a cache for expensive previews.
    game_types: [KSA.FlightPlan, KSA.OrbitalTransfers]
    engine_pointers:
      - current/decomp/KSA/FlightPlan.cs AddLineInstances
      - current/decomp/KSA/TransferPlanner.cs
    lifecycle: [frame:draw-ui, frame:pre-render, render:orbit-lines]
    approaches:
      - n: 1
        title: FlightPlan.AddLineInstances per plan with dimmed colours, postfix hook and quantized cache keys
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/multi-pass-preview-rendering]
        technique: harmony-postfix
        note: One FlightPlan per planned pass, dimmed colours, apsis/node/SOI markers on the viewport overlay list; previews cached behind quantized input keys.
    related: [draw-markers-and-annotations-on-world-objects]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/planner-preview-trajectories]

  # ---------------------------------------------------------------- reference frames and anchoring
  - slug: choose-ecl-or-ego-positions-for-rendering
    title: Choose ecliptic or camera-relative (ego) positions and epochs for rendering
    summary: Ecl positions keep the 29.8 km/s orbital carrier and move hundreds of metres per frame; ego positions are camera-relative translations of Ecl. Pick the right frame and sample instant or an overlay will lag, jitter or drift from the craft it should hug.
    game_types: [KSA.Camera, KSA.Vehicle, KSA.GizmosRenderer, KSA.PartModel]
    engine_pointers:
      - current/decomp/KSA/Camera.cs GetPositionEgo, EclToEgo
      - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
      - current/decomp/KSA/GizmosRenderer.cs
    lifecycle: [frame:draw-ui, frame:apply-solvers, frame:render]
    approaches:
      - n: 1
        title: Two-instant draw anchor against GetPositionEgo
        mod: ksagolf
        features: [mods/ksagolf/features/frame-epoch-draw-anchor]
        technique: reference-frames
        note: Pair the craft's rendered Ego position sampled this frame with Ecl offsets measured against the same-instant platform sample, so overlays do not slide 500 m per frame.
      - n: 2
        title: Anchor to the engine's own render position and add travel since launch
        mod: ksarmory
        features:
          - mods/ksarmory/features/gizmo-world-overlays
          - mods/ksarmory/features/rounds-as-hidden-launcher-subparts
        technique: ego-anchor
        note: Gizmos and projectile subparts placed relative to where the engine draws the launcher, with Ego a pure translation of Ecl; shows when to use Ecl at GetElapsedTime versus the rendered sample.
    related: [draw-world-space-gizmos, keep-effects-fixed-to-a-rotating-body, anchor-rendered-objects-to-parts-and-terrain]
    borrowed_from: [mods/ksarmory/features/ecliptic-frames-and-epochs]

  - slug: keep-effects-fixed-to-a-rotating-body
    title: Keep an effect or mesh fixed to a rotating planet
    summary: A point in space above the ground drifts away from the ground as the planet turns; anchor effects, meshes and emitters in the body-fixed frame and convert to the render frame at draw time.
    game_types: [KSA.Celestial, KSA.ExplosionSystem, KSA.ParticleEmitter, KSA.StaticMeshRenderable]
    engine_pointers:
      - current/decomp/KSA/ExplosionSystem.cs SpawnPreset (BubbleOrigin)
      - current/decomp/KSA/Celestial.cs (body-fixed frame helpers)
    lifecycle: [frame:draw-ui, frame:celestials, frame:pre-render, frame:render]
    approaches:
      - n: 1
        title: Explosion presets with a BubbleOrigin fixed in the body frame
        mod: ksarmory
        features: [mods/ksarmory/features/ksa-explosions-from-a-point]
        technique: body-fixed-anchor
        note: Anchored to the ground the burst happened over rather than the target craft; ambient pressure fed to the pressure-gated stages.
      - n: 2
        title: Pooled emitters re-anchored to the celestial's rotating frame every frame
        mod: ksarmory
        features: [mods/ksarmory/features/pooled-particle-emitters]
        technique: emitter-reanchoring
        note: Re-point following emitters each frame so smoke stays on the rotating body.
      - n: 3
        title: Body-fixed mesh with Ccf-to-Cce rotation and body position at draw time
        mod: ksagolf
        features: [mods/ksagolf/features/mod-mesh-draw-hook]
        technique: runtime-mesh-draw
        note: Course pieces and ball are stored body-fixed and turned into per-viewport ego transforms in the draw hook.
    related: [choose-ecl-or-ego-positions-for-rendering, spawn-particle-effects, draw-mod-meshes-with-the-engine-renderers]
    borrowed_from: []

  - slug: draw-world-space-gizmos
    title: Draw world-space lines and spheres with GizmosRenderer
    summary: Use the game's own gizmo renderer for debug-style world overlays (radar cones, track markers, trails, placement markers) that are depth-tested, scale with the scene and need no Vulkan code.
    game_types: [KSA.GizmosRenderer, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/GizmosRenderer.cs ResetInstances and instance adders
      - current/decomp/KSA/Program.cs (gizmo pass order in Render)
    lifecycle: [frame:draw-ui, render:scene-opaque, render:gizmos]
    approaches:
      - n: 1
        title: Submit spheres and lines from the StarMap GUI postfix between reset and render
        mod: ksarmory
        features: [mods/ksarmory/features/gizmo-world-overlays]
        technique: gizmo-draw
        note: Radar cones, track markers, trails, shell streaks, placement markers anchored to the engine's render position of the platform.
      - n: 2
        title: Gizmos next to a moving craft using a frame-epoch anchor
        mod: ksagolf
        features: [mods/ksagolf/features/frame-epoch-draw-anchor]
        technique: gizmo-drawing
        note: Submitted between GizmosRenderer.ResetInstances and the render; anchored with the craft's rendered Ego position this frame.
    related: [choose-ecl-or-ego-positions-for-rendering, draw-markers-and-annotations-on-world-objects]
    borrowed_from: []

  - slug: anchor-rendered-objects-to-parts-and-terrain
    title: Anchor rendered objects to parts, cloth or terrain and follow them every frame
    summary: A sticker, quad or billboard that must stay on a moving craft needs an anchor that survives staging, docking, inflation, planet rotation and floating-origin shifts, re-resolved every frame rather than cached as a world position.
    game_types: [KSA.Part, KSA.Vehicle, KSA.PartTree, KSA.Camera]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
      - current/decomp/KSA/Part.cs
    lifecycle: [frame:draw-ui, frame:render]
    approaches:
      - n: 1
        title: Part-local, cloth-barycentric or geodetic anchors with double-precision composition
        mod: unscience
        features: [mods/unscience/features/graffiti-decal-anchoring]
        technique: double-precision-transforms
        note: Stable ids re-resolved each frame and a decal-to-ego box recomposed in double precision; follows staging, parachute inflation and planet rotation.
      - n: 2
        title: Part transform times user offset in ego space, or a view-space billboard
        mod: purrtty
        features: [mods/purrtty/features/anchor-quad-to-part-or-camera]
        technique: vulkan-pipeline
        note: Follows the same Part object by reference identity through decoupling and docking; camera-fixed billboard variant for HUD-like quads.
      - n: 3
        title: Attach a quad via the part's ego matrix
        mod: gatos
        features: [mods/gatos/features/thug-life-world-space-quad]
        technique: harmony-postfix
        note: Ego-space model matrix from GetMatrixAsmb2Ego computed in the render hook.
    related: [choose-ecl-or-ego-positions-for-rendering, project-decals-onto-scene-geometry, draw-a-textured-quad-in-the-world]
    borrowed_from: [mods/ksa-measuretools/features/live-body-relative-anchors, mods/ksa-measuretools/features/part-anchor-rehoming]

  # ---------------------------------------------------------------- custom Vulkan passes and pipelines
  - slug: insert-a-custom-pass-into-render-game
    title: Insert a custom Vulkan pass into KSA's frame
    summary: KSA records one frame as a sequence of scene, resolve, bloom and composite stages. A mod can hook a stage boundary with a Harmony postfix or prefix, or rewrite RenderGame, to record its own draws or dispatches where depth, colour and light are in the state it needs.
    game_types: [KSA.Program, KSA.SuperMeshRenderSystem, KSA.Rendering.RenderTarget, KSA.SunbloomRenderer]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame
      - current/decomp/KSA/SuperMeshRenderSystem.cs RenderMainPass, RenderTranslucencyPass
      - current/decomp/KSA.Rendering/RenderTarget.cs ResolveAttachments
      - current/decomp/KSA/SunbloomRenderer.cs Render
      - current/decomp/KSA/CommandBufferEx.cs
    lifecycle: [frame:render, render:scene-opaque, render:translucency, render:grid, render:bloom, render:post-process]
    approaches:
      - n: 1
        title: Postfix RenderTarget.ResolveAttachments (post-resolve window)
        mod: unscience
        features:
          - mods/unscience/features/graffiti-projected-decal-pass
          - mods/gatos/features/sticker-projected-decals
        technique: harmony-postfix
        note: The window KSA's GridPass uses after the main view resolves; depth is sampleable. Filter to the main viewport.
      - n: 2
        title: Postfix SuperMeshRenderSystem.RenderMainPass (inside the offscreen opaque pass)
        mod: unscience
        features:
          - mods/unscience/features/thug-life-textured-quad-render-pass
          - mods/gatos/features/thug-life-world-space-quad
        technique: harmony-postfix
        note: Draws land in the already-open MSAA scene pass, depth-tested; pipeline must match the scene target formats and sample count.
      - n: 3
        title: Postfix SuperMeshRenderSystem.RenderTranslucencyPass with tracked barriers
        mod: purrtty
        features: [mods/purrtty/features/draw-after-translucency-pass-postfix]
        technique: harmony-postfix
        note: Reopens a dynamic-rendering scope over the scene attachments after atmosphere, clouds and plumes so translucent mod content composites last.
      - n: 4
        title: Prefix SunbloomRenderer.Render to dispatch compute on the HDR scene
        mod: ksarmory
        features:
          - mods/ksarmory/features/compute-pass-before-bloom
          - mods/ksastructures/features/underground-dark-compute-pass
        technique: harmony-prefix
        note: A public method handing over the command buffer with scene colour in General layout and depth sampled, before bloom and tonemap, so results bloom and grade with the scene. See the dedicated compute-pass topic for the shader side.
      - n: 5
        title: Transpile Program.RenderGame around the swapchain render pass
        mod: shaderextensions
        features:
          - mods/shaderextensions/features/rendergame-render-pass-transpiler
          - mods/shaderextensions/features/pre-imgui-post-processing
          - mods/shaderextensions/features/post-imgui-global-post-shaders
        technique: harmony-transpiler
        note: Dynamic-rendering passes are illegal inside the legacy swapchain render pass, so the mod rewrites the BeginRenderPass/End call sites in RenderGame to record before and after it.
    related: [draw-a-textured-quad-in-the-world, project-decals-onto-scene-geometry, modify-the-hdr-scene-with-a-compute-pass, build-a-vulkan-pipeline-for-the-scene-target, capture-rendered-frames]
    borrowed_from:
      - mods/ksarmory/features/compute-pass-before-bloom
      - mods/ksastructures/features/underground-dark-compute-pass
      - mods/shaderextensions/features/rendergame-render-pass-transpiler
      - mods/shaderextensions/features/pre-imgui-post-processing
      - mods/shaderextensions/features/post-imgui-global-post-shaders

  - slug: build-a-vulkan-pipeline-for-the-scene-target
    title: Build a Vulkan pipeline compatible with KSA's scene render target
    summary: A pipeline recorded inside KSA's scene pass must match its colour and depth formats, sample count and dynamic-rendering setup, and for offscreen work of the mod's own needs a render-pass-less pipeline. Several routes exist, from the game's own pipeline helper to a hand-built one.
    game_types: [KSA.Program, RenderCore.ShaderModuleUtils, RenderCore.SimpleVkMesh]
    engine_pointers:
      - current/decomp/KSA/Program.cs OffscreenTarget SetupGraphicsPipeline
      - current/decomp/KSA/CommandBufferEx.cs PipelineBarrier2
    lifecycle: [frame:render, render:scene-opaque, render:translucency]
    approaches:
      - n: 1
        title: Program.OffscreenTarget.SetupGraphicsPipeline, created lazily
        mod: unscience
        features:
          - mods/unscience/features/thug-life-textured-quad-render-pass
          - mods/gatos/features/thug-life-world-space-quad
        technique: vulkan-pipeline
        note: The helper stamps dynamic-rendering formats and sample count; create lazily once render targets exist and rebuild after renderer rebuilds.
      - n: 2
        title: Hand-built dynamic-rendering pipeline reusing UnlitMeshVert with premultiplied alpha
        mod: purrtty
        features: [mods/purrtty/features/world-space-quad-pipeline-custom-shader]
        technique: vulkan-pipeline
        note: Custom premultiplied-alpha fragment shader, depth test against the scene, translucency-pass compatible.
      - n: 3
        title: Private colour/depth targets with a standalone dynamic-rendering pipeline
        mod: unscience
        features: [mods/unscience/features/pebbles-workshop-offscreen-preview]
        technique: vulkan-pipeline
        note: Not drawing into the scene at all, so the pipeline is free-standing; contrasts with approaches 1 and 2.
    related: [insert-a-custom-pass-into-render-game, compile-glsl-at-runtime, draw-a-textured-quad-in-the-world, handle-renderer-rebuilds]
    borrowed_from: []

  - slug: compile-glsl-at-runtime
    title: Compile GLSL at runtime with the game's includes
    summary: Mods that draw with their own shaders can compile GLSL from embedded strings or generated files at runtime using the game's shader utilities, including its Global and Core shader libraries, without shipping SPIR-V.
    game_types: [RenderCore.ShaderModuleUtils, KSA.ShaderReference]
    engine_pointers:
      - current/decomp/RenderCore/ShaderModuleUtils.cs FromString, FromFile
    lifecycle: [startup:all-mods-loaded, frame:render]
    approaches:
      - n: 1
        title: ShaderModuleUtils.FromString with a NUL-terminated debug path and game includes
        mod: gatos
        features: [mods/gatos/features/sticker-projected-decals]
        technique: glsl-shader
        note: Includes the game's shader library; debug path must be NUL-terminated or the compiler misreads it.
      - n: 2
        title: Embedded fragment/vertex source for a quad or preview pipeline
        mod: purrtty
        features:
          - mods/purrtty/features/world-space-quad-pipeline-custom-shader
          - mods/unscience/features/pebbles-workshop-offscreen-preview
        technique: glsl-shader
        note: Small self-contained shaders compiled when the pipeline is first built; includes tangent-free derivative normal mapping in the preview shader.
      - n: 3
        title: Generate an include file at immediate load and let KSA compile .comp assets
        mod: ksarmory
        features:
          - mods/ksarmory/features/core-shader-library-include
          - mods/ksastructures/features/core-shader-library-include
        technique: glsl-shader
        note: The mod writes Shaders/Content/*.glsl with absolute includes of the install's Global library at StarMapImmediateLoad so ordinary shader assets can include it.
    related: [build-a-vulkan-pipeline-for-the-scene-target, modify-the-hdr-scene-with-a-compute-pass]
    borrowed_from:
      - mods/ksarmory/features/core-shader-library-include
      - mods/ksastructures/features/core-shader-library-include

  - slug: modify-the-hdr-scene-with-a-compute-pass
    title: Paint into or rescale the HDR scene image with a compute pass
    summary: From the pre-bloom hook a mod can read the scene colour and depth and write straight back into it, drawing depth-aware rings, holes and tracers, relighting or darkening areas, all without a graphics pipeline.
    game_types: [KSA.SunbloomRenderer, KSA.Rendering.ComputePipelineWrapper, KSA.ShaderReference]
    engine_pointers:
      - current/decomp/KSA/SunbloomRenderer.cs Render
      - current/decomp/KSA.Rendering/ComputePipelineWrapper.cs
    lifecycle: [frame:render, render:bloom]
    approaches:
      - n: 1
        title: Depth-reading compute dispatches for rings, holes, tracers and relighting
        mod: ksarmory
        features:
          - mods/ksarmory/features/compute-pass-before-bloom
          - mods/ksarmory/features/depth-painted-ground-rings
          - mods/ksarmory/features/compute-shell-tracers
          - mods/ksarmory/features/fireball-light-injection
        technique: vulkan-pipeline
        note: KSA compiles the mod's .comp files as Shader assets and ComputePipelineWrapper builds the pipelines; one prefix on the public method is the only patch. Rings lie on terrain by measuring from the depth buffer.
      - n: 2
        title: In-place rescale using KSA's light pre-pass images
        mod: ksastructures
        features: [mods/ksastructures/features/underground-dark-compute-pass]
        technique: vulkan-pipeline
        note: Priority.First prefix builds a compute wrapper over colour, depth and light pre-pass images and rescales each pixel by the share of light that did not come from ambient.
    related: [insert-a-custom-pass-into-render-game, compile-glsl-at-runtime, project-decals-onto-scene-geometry]
    borrowed_from:
      - mods/ksarmory/features/compute-pass-before-bloom
      - mods/ksarmory/features/depth-painted-ground-rings
      - mods/ksarmory/features/compute-shell-tracers
      - mods/ksarmory/features/fireball-light-injection
      - mods/ksastructures/features/underground-dark-compute-pass

  - slug: draw-a-textured-quad-in-the-world
    title: Draw a textured quad attached to a part or the camera
    summary: Put an image, sticker, screen or pixel sprite into the 3D scene as a world-space quad with depth testing, tied to a part transform or a view-space billboard.
    game_types: [KSA.SuperMeshRenderSystem, KSA.Program, KSA.Part, RenderCore.SimpleVkTexture]
    engine_pointers:
      - current/decomp/KSA/SuperMeshRenderSystem.cs RenderMainPass, RenderTranslucencyPass
      - current/decomp/KSA/Vehicle.cs GetMatrixAsmb2Ego
    lifecycle: [frame:render, render:scene-opaque, render:translucency, frame:draw-ui]
    approaches:
      - n: 1
        title: Opaque pixel quads with stock UnlitMesh shaders inside the offscreen scene pass
        mod: unscience
        features:
          - mods/unscience/features/thug-life-textured-quad-render-pass
          - mods/unscience/features/thug-life-procedural-texture
        technique: vulkan-pipeline
        note: The stock unlit shader always writes alpha, so the sprite is emitted as one small quad per opaque texel; ego matrix computed per frame; pipeline built lazily.
      - n: 2
        title: A single textured quad via the same hook with its own pipeline setup
        mod: gatos
        features: [mods/gatos/features/thug-life-world-space-quad]
        technique: vulkan-pipeline
        note: Same RenderMainPass postfix, different buffer and texture plumbing; attached via part ego matrix; patches installed on demand.
      - n: 3
        title: Premultiplied-alpha translucent quad after the translucency pass
        mod: purrtty
        features:
          - mods/purrtty/features/world-space-quad-pipeline-custom-shader
          - mods/purrtty/features/draw-after-translucency-pass-postfix
          - mods/purrtty/features/anchor-quad-to-part-or-camera
        technique: vulkan-pipeline
        note: Custom shader, correct blend state, part or camera anchor; plus click focus via ray picking against world quads.
    related: [insert-a-custom-pass-into-render-game, build-a-vulkan-pipeline-for-the-scene-target, anchor-rendered-objects-to-parts-and-terrain, upload-an-image-as-a-vulkan-texture, put-a-live-screen-on-a-part]
    borrowed_from: [mods/purrtty/features/ray-pick-focus-for-world-quads]

  - slug: draw-mod-meshes-with-the-engine-renderers
    title: Draw your own meshes through the engine's mesh renderers
    summary: Instead of a bespoke pipeline, hand the game your meshes as StaticMeshRenderables, extra part-model instances or private buffers inside the static-object pipeline so lighting, shadows and culling come for free.
    game_types: [KSA.StaticMeshRenderable, KSA.SuperMeshRenderSystem, KSA.PartModel, KSA.StaticObjectRenderer, KSA.PartModelRenderer]
    engine_pointers:
      - current/decomp/KSA/SuperMeshRenderSystem.cs ClearBuckets
      - current/decomp/KSA/StaticMeshRenderable.cs
      - current/decomp/KSA/StaticObjectRenderer.cs UpdateRenderData
      - current/decomp/KSA/PartModelRenderer.cs UpdateRenderData
      - current/decomp/KSA/PartModel.cs AddInstance
    lifecycle: [startup:all-mods-loaded, frame:render, render:scene-opaque, render:shadows, render:prepass]
    approaches:
      - n: 1
        title: Submit StaticMeshRenderables after ClearBuckets for every viewport
        mod: ksagolf
        features: [mods/ksagolf/features/mod-mesh-draw-hook]
        technique: runtime-mesh-draw
        note: Postfix SuperMeshRenderSystem.ClearBuckets(IViewport); earlier draws are discarded; per-viewport ego transforms; secondary views first and only the main view casts cascade shadows.
      - n: 2
        title: Own vertex/index/material buffers drawn by the static-object pipeline
        mod: unscience
        features: [mods/unscience/features/sphinx-static-object-render-hooks]
        technique: vulkan-buffer
        note: Postfixes on StaticObjectRenderer.UpdateRenderData and the private WriteCommandsColor/WriteCommandsPrePass; per-viewport, per-frame matrix slices.
      - n: 3
        title: Extra part-model instances at any matrix, per viewport
        mod: ksarmory
        features: [mods/ksarmory/features/round-body-draw-hooks]
        technique: part-model-instancing
        note: Prefix on PartModelRenderer.UpdateRenderData adds shells and rounds as extra instances of the engine's own part meshes; also covers drawing a launcher past the pixel cull.
      - n: 4
        title: Clone interleaved part meshes into private SimpleVkMeshes
        mod: unscience
        features: [mods/unscience/features/rocky-mcrock-face-interleaved-mesh-clone]
        technique: vulkan-buffer
        note: Reuse part geometry in another renderer (ring pipeline) by sharing HostPrimitives and uploading a standalone mesh.
    related: [add-invisible-shadow-casters, grow-game-gpu-buffers-for-runtime-content, choose-ecl-or-ego-positions-for-rendering, render-planetary-rings-with-custom-textures]
    borrowed_from: []

  - slug: add-invisible-shadow-casters
    title: Make static objects cast sun and lamp shadows with invisible casters
    summary: Static objects never enter a shadow pass; add depth-only caster meshes to the SuperMesh shadow pool so a building, roof or pillar blocks sunlight and lamp light without drawing a second mesh.
    game_types: [KSA.SuperMeshRenderSystem, KSA.StaticMeshRenderable, KSA.ShadowRenderable, KSA.SuperMeshShadowCasterProvider]
    engine_pointers:
      - current/decomp/KSA/SuperMeshShadowCasterProvider.cs
      - current/decomp/KSA/StaticMeshRenderable.cs ShadowRenderablePool
      - current/decomp/KSA/ShadowRenderable.cs
    lifecycle: [startup:all-mods-loaded, frame:render, render:shadows]
    approaches:
      - n: 1
        title: Append ShadowRenderables from a prefix on PrepareShadowCasters or AddShadowRenderables
        mod: ksastructures
        features: [mods/ksastructures/features/invisible-shadow-casters]
        technique: harmony-prefix
        note: Casters come from a GLB loaded as GltfFile, built as StaticMeshRenderables that are never drawn; must run before the first shadow consumer each frame; includes lamp atlas versus sun cascades.
    related: [add-dynamic-lights-to-the-world, draw-mod-meshes-with-the-engine-renderers]
    borrowed_from: []

  - slug: capture-rendered-frames
    title: Capture rendered frames from KSA
    summary: Grab the finished scene for screenshots, streaming or automated visual testing without stalling the GPU, by recording a copy in the frame command buffer and reading it back when the staging slot is reused, or by driving KSA's own screenshot system.
    game_types: [KSA.Program, KSA.ScreenshotCapture, Core.Renderer]
    engine_pointers:
      - current/decomp/KSA/Program.cs RenderGame (final End)
      - current/decomp/KSA/ScreenshotCapture.cs
      - current/decomp/Core/Renderer.cs ExtentOverride
    lifecycle: [frame:render, frame:post-render, thread:background]
    approaches:
      - n: 1
        title: Transpiler before the final End(), blit into per-slot staging buffers, readback on slot reuse
        mod: gatos
        features: [mods/gatos/features/screen-stream-frame-capture]
        technique: harmony-transpiler
        note: No stall; encoder runs on a background thread with the Kitty graphics protocol and a fixed image id.
      - n: 2
