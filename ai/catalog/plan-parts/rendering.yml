        mod: unscience
        features: [mods/unscience/features/iron-man-equipment-render-ordering]
        technique: harmony-prefix
        note: Priority.First prefix skips the duplicate call; dynamic method for the nonvirtual call.
    related: [hide-parts-or-subparts-from-rendering]
    borrowed_from: []

  - slug: keep-vessels-rendered-at-any-distance
    title: Keep a vessel or kitten rendered at any distance
    summary: KSA culls vehicles that project below one pixel or past a render radius. Override the cull so a distant ship, a projectile launcher or a scaled-up vessel still draws.
    game_types: [KSA.Vehicle, KSA.PartModelRenderer, KSA.PartTreeRenderData]
    engine_pointers:
      - current/decomp/KSA/Vehicle.cs GetWorldMatrix, UpdateRenderData, IsLargeEnoughToRender
    lifecycle: [frame:render, frame:draw-ui, frame:pre-render]
    approaches:
      - n: 1
        title: Skip-original prefixes on GetWorldMatrix and UpdateRenderData
        mod: unscience
        features: [mods/unscience/features/i-feel-seen-render-distance-override]
        technique: harmony-prefix
        note: Rebuilds the native result without the distance gate, resolved by name for resilience.
      - n: 2
        title: Replace the sub-pixel cull with a prefix that reproduces the body
        mod: gatos
        features: [mods/gatos/features/scale-and-force-render-cheats]
        technique: harmony-prefix
        note: Installed lazily so the cost is only paid while enabled.
      - n: 3
        title: Postfix UpdateRenderData asks the pixel test again for a launcher
        mod: ksarmory
        features: [mods/ksarmory/features/round-body-draw-hooks]
        technique: harmony-postfix
        note: Draw only what is needed while rounds fly.
      - n: 4
        title: Call-site transpilers enlarge the cull radius
        mod: unscience
        features: [mods/unscience/features/godzilla-visual-scaling]
        technique: harmony-transpiler
        note: Guarded rewrites of the IsLargeEnoughToRender call so a scaled vessel is still culled sanely.
    related: [visually-scale-a-vessel, show-iva-interiors-from-outside]
    borrowed_from: []

  - slug: visually-scale-a-vessel
    title: Scale how a vessel or kitten is drawn without changing physics
    summary: Resize the drawn parts of a vessel or EVA kitten around its live centre of mass, either with draw-matrix patches or by recursively setting Part.Scale, while leaving colliders and mass alone.
    game_types: [KSA.Part, KSA.Vehicle, KSA.PartTreeRenderData]
    engine_pointers:
      - current/decomp/KSA/Part.cs Scale
      - current/decomp/KSA/Vehicle.cs GetWorldMatrix
    lifecycle: [frame:render, frame:prepare, frame:viewports]
    approaches:
      - n: 1
        title: Part-tree draw-matrix patches and a GetWorldMatrix postfix about the centre of mass
        mod: unscience
        features:
          - mods/unscience/features/godzilla-visual-scaling
          - mods/unscience/features/godzilla-vessel-scaling
        technique: harmony-transpiler
        note: Visual channel separate from the collider channel; also enlarges the render cull radius.
      - n: 2
        title: Recursive Part.Scale and avatar Core.Scale cheats
        mod: gatos
        features: [mods/gatos/features/scale-and-force-render-cheats]
        technique: harmony-prefix
        note: Simple route that also affects what the game believes about the part.
    related: [keep-vessels-rendered-at-any-distance]
    borrowed_from: [mods/unscience/features/godzilla-vessel-scaling]

