  # ---------------------------------------------------------------- Vulkan resource discipline
  - slug: submit-your-own-vulkan-commands
    title: Record and submit your own Vulkan work outside the game's frame command buffer
    summary: One-shot uploads, offscreen renders and ImGui-to-texture need command buffers the game does not own; pick the pool, fence and queue lock so they neither stall nor auto-submit half-recorded work.
    game_types: [RenderCore.StagingPool, Brutal.VulkanApi, KSA.Program]
    engine_pointers:
      - current/decomp/Brutal.VulkanApi.Abstractions/StagingPool.cs
      - current/decomp/KSA/Program.cs (Render and OnPreRender order)
    lifecycle: [frame:draw-ui, frame:dispatch-solvers, frame:pre-render]
    approaches:
      - n: 1
        title: Private one-shot command buffer and fence; StagingPool only for memory
        mod: unscience
        features: [mods/unscience/features/pebbles-asset-upload-submission]
        technique: vulkan-buffer
        note: A StagingPool submits half-recorded work on dispose, so use it only for memory; publish after the fence and free after DeviceWaitIdle.
      - n: 2
        title: Mod command pool, fence ring and locked queue submit
        mod: purrtty
        features: [mods/purrtty/features/offscreen-imgui-context-render-to-texture]
        technique: vulkan-pipeline
        note: Per-frame ring of fences; submit under the engine's queue lock.
      - n: 3
        title: Private transient pool for readback and thumbnails
        mod: unscience
        features: [mods/unscience/features/parts-now-thumbnail-generation]
        technique: offscreen-viewport
        note: Fence wait and readback at a safe point before OnPreRender.
    related: [free-vulkan-resources-safely, render-part-thumbnails-at-runtime, render-imgui-into-a-texture]
    borrowed_from: []

  - slug: free-vulkan-resources-safely
    title: Free mod-owned Vulkan resources without device loss
    summary: The GPU may still read an image or buffer for several frames after the mod stops referencing it; stop recording first, free after frames in flight or WaitIdle, and never touch the destroyed device at game exit.
    game_types: [RenderCore.SimpleVkTexture, KSA.ImGuiBackendVulkanImpl, KSA.Program]
    engine_pointers:
      - current/decomp/KSA/ImGuiBackendVulkanImpl.cs RemoveTexture
      - current/decomp/KSA/Program.cs (MaxFramesInFlight and shutdown order)
    lifecycle: [frame:draw-ui, frame:render, frame:prepare]
    approaches:
      - n: 1
        title: Stop recording now, free two frames later after WaitIdle; nullable images; no device work in unload
        mod: purrtty
        features:
          - mods/purrtty/features/vulkan-resource-teardown-discipline
          - mods/purrtty/features/kitty-graphics-as-imgui-vulkan-textures
        technique: vulkan-texture
        note: Rebuilds targets in place on live resize and treats StarMapUnload as no-device territory.
      - n: 2
        title: Retire by MaxFramesInFlight + 1 frames
        mod: gatos
        features: [mods/gatos/features/clutter-texture-override]
        technique: deferred-destruction
        note: Counter-based retirement of replaced textures with no explicit idle.
      - n: 3
        title: Publish new GPU resources after a fence, retire old ones after WaitIdle
        mod: unscience
        features:
          - mods/unscience/features/pebbles-asset-upload-submission
          - mods/unscience/features/sphinx-uv-texture-overrides
          - mods/unscience/features/pebbles-workshop-offscreen-preview
        technique: vulkan-buffer
        note: Buffer and image swaps while frames are in flight; ImGui-referenced images handled in BeforeGui.
    related: [handle-renderer-rebuilds, show-an-image-in-imgui, submit-your-own-vulkan-commands]
    borrowed_from: []

  - slug: handle-renderer-rebuilds
    title: Recreate mod render targets when KSA rebuilds its renderer
    summary: KSA recreates swapchain-sized targets on resize, MSAA changes and high-resolution screenshots; mod pipelines and images tied to those extents must be rebuilt at the same point or they render into stale targets.
    game_types: [KSA.Program, Core.Renderer, KSA.Rendering.RenderTarget]
    engine_pointers:
      - current/decomp/KSA/Program.cs RebuildRenderer
      - current/decomp/Core/Renderer.cs ExtentOverride
    lifecycle: [frame:prepare, frame:render, frame:post-render]
    approaches:
      - n: 1
        title: Postfix Program.RebuildRenderer plus a first-frame schedule and per-frame extent check
        mod: shaderextensions
        features: [mods/shaderextensions/features/renderer-rebuild-hook]
        technique: harmony-postfix
        note: Rebuild is called from PrepareFrame, Render, PostRender and ScreenshotCapture; ExtentOverride must be honoured.
      - n: 2
        title: Rebuild targets in place on a live size change
        mod: purrtty
        features: [mods/purrtty/features/vulkan-resource-teardown-discipline]
        technique: vulkan-texture
        note: Stops recording, rebuilds when the size changes, frees the old after frames in flight.
      - n: 3
        title: Re-create the private material pipeline on the renderer-rebuild event
        mod: unscience
        features: [mods/unscience/features/pebbles-private-clutter-materials]
        technique: vulkan-pipeline
        note: Private buffers and pipeline variants re-created after rebuild.
    related: [free-vulkan-resources-safely, build-a-vulkan-pipeline-for-the-scene-target, capture-rendered-frames]
    borrowed_from: []

  - slug: grow-game-gpu-buffers-for-runtime-content
    title: Reserve or grow game GPU buffers for content added at runtime
    summary: The game sizes its shared mesh buffer and star instance buffer at load. Runtime meshes or more stars need headroom reserved before the buffer is created, or reflective re-creation while frames are in flight.
    game_types: [KSA.DeviceMeshInterleaved, KSA.ModLibrary, KSA.InstancedStarTechnique]
    engine_pointers:
      - current/decomp/KSA/DeviceMeshInterleaved.cs Shared
      - current/decomp/KSA/InstancedStarTechnique.cs CreateInstanceBuffer
    lifecycle: [startup:starmap-before-main, startup:all-mods-loaded, frame:draw-ui]
    approaches:
      - n: 1
        title: Inflate DeviceMeshInterleaved.Shared before ModLibrary.Bind sizes the buffer
        mod: unscience
        features: [mods/unscience/features/parts-now-mesh-headroom-reservation]
        technique: vulkan-buffer
        note: Size counters inflated at AllModsLoaded and the bump cursor rewound on the first frame so runtime meshes get valid ranges; includes runtime mesh loading constraints.
      - n: 2
        title: Reflective re-creation of an instance buffer with a constructor argument prefix
        mod: ohmystars
        features: [mods/ohmystars/features/star-instance-restyle-patch]
        technique: harmony-prefix
        note: ref int __4 on a manually patched constructor grows capacity; readonly fields and protected CreateInstanceBuffer reached by reflection, mindful of frames in flight.
    related: [restyle-background-stars, draw-mod-meshes-with-the-engine-renderers, free-vulkan-resources-safely]
    borrowed_from: []

