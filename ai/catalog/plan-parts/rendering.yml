  - slug: render-kitten-equipment-in-the-right-order
    title: Render parts attached to an EVA kitten in the right order
    summary: Equipment parts that belong to a kitten's backpack tree need to run through the vehicle render path before the shared instance lists are uploaded, or they vanish or flicker.
    game_types: [KSA.PartModelRenderer, KSA.Vehicle, KSA.KittenRenderable]
