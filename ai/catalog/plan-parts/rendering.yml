  # ---------------------------------------------------------------- decals and painting
  - slug: project-decals-onto-scene-geometry
    title: Project decals onto vessels, terrain and clutter
    summary: Draw an image, a sticker or a damage mark onto arbitrary surfaces by reconstructing the scene position from the depth buffer and drawing a box or fullscreen pass in the post-resolve window, or by using the terrain's own decal modifiers.
    game_types: [KSA.Rendering.RenderTarget, KSA.DecalModifierReference, KSA.TerrainReference]
    engine_pointers:
      - current/decomp/KSA.Rendering/RenderTarget.cs ResolveAttachments
      - current/decomp/KSA/DecalModifierReference.cs
    lifecycle: [frame:render, render:grid, render:bloom]
    approaches:
      - n: 1
        title: Unit-cube decal volumes with reverse-Z depth reconstruction
        mod: unscience
        features:
          - mods/unscience/features/graffiti-projected-decal-pass
          - mods/unscience/features/graffiti-bindless-decal-textures
        technique: vulkan-pipeline
        note: One cube per decal; fragment shader rebuilds scene position and projects the texture; texture index through the bindless table.
      - n: 2
