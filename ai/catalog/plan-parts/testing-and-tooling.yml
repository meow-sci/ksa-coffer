  - slug: verify-a-solve-is-pure-before-threading
    title: Prove a computation is a pure function before moving it to a thread
    summary: Before an optimizer runs on a worker thread, test for replay determinism, that the inputs matter and that parallel instances do not interact, so threading cannot introduce nondeterminism.
    game_types: []
    engine_pointers: []
    lifecycle: ['thread:background']
    approaches:
      - n: 1
        title: Determinism, input-sensitivity and no-cross-talk checks in the harness
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/closed-loop-mpc-harness]
        technique: console-checks
        note: Same input twice gives the same plan; changed input changes it; two solver instances run concurrently without affecting each other. These gated the worker-thread move.
    related: [closed-loop-simulator-for-guidance, run-an-expensive-solve-without-stalling-the-frame, unit-test-mod-logic-without-game]
    borrowed_from: []

