  - slug: upgrade-a-mod-to-a-new-ksa-build
    title: Upgrade a mod to a new KSA build
    summary: A repeatable procedure - refresh the pinned binaries and decompiled corpus, diff only what the mod touches, classify each coupling by how it fails, fix, record the new build everywhere and fly it.
    game_types: [KSA.Program, KSA.GameSettings, KSA.ImGuiBackendVulkanImpl]
    engine_pointers: [current/version.json (changelog commits can have gaps; the decomp diff is the full record), current/decomp, current/dll]
    lifecycle: ['event:game-update']
    approaches:
      - n: 1
        title: Lock, decompile both builds, diff narrowed to the API surface, then update the lock
        mod: ksarmory
        features: [mods/ksarmory/features/ksa-assemblies-lock, mods/ksarmory/features/api-surface-tracking, mods/ksacars/features/api-surface-pinning-and-diff, mods/ksagolf/features/api-surface-and-assembly-lock]
        technique: decompiling
        note: Four commands - sync-import.sh, sync-assemblies.sh, check-assemblies.sh --update, commit; packaged as an upgrade-ksa agent skill that also diffs Core XML and pushes the private mirror first.
      - n: 2
        title: Coupling-catalog review skill that classifies how each coupling fails
        mod: purrtty
        features: [mods/purrtty/features/ksa-upgrade-coupling-review-skill]
        technique: agent-skill
        note: Direct member reference fails at compile, Harmony targets at load, reflection silently, behaviour silently wrong; asset ids at runtime; severity per touchpoint; the baseline is the last validated build, not the previous folder.
      - n: 3
        title: KsaAnchor-annotated bindings, scope catalog and changelog scan
        mod: gatos
        features: [mods/gatos/features/ksa-anchor-churn-tracking]
        technique: annotation
        note: Every KSA binding carries member, source file, verified date, game version and risk, so a compile break lands on an annotated site and grep finds every reflection target; the playbook is also an agent skill.
    related: [track-the-game-api-your-mod-uses, decompile-the-game-for-reference, pin-the-game-build-with-a-hashed-lock, detect-a-new-ksa-build-automatically, degrade-one-feature-on-api-drift, test-harmony-patches-without-the-game, test-against-the-games-own-routines]
    borrowed_from: []

  - slug: degrade-one-feature-on-api-drift
    title: Degrade one feature instead of crashing when the game API drifts
    summary: Resolve game members once at load, tag each handle with the features that need it, and latch an accessor as degraded after its first failure, so a game update disables one feature with a clear status instead of spamming exceptions.
    game_types: [KSA.Vehicle]
    engine_pointers: []
    lifecycle: ['startup:all-mods-loaded', 'frame:viewports', 'frame:draw-ui']
    approaches:
      - n: 1
        title: Per-accessor health latches published in the snapshot
        mod: gatos
        features: [mods/gatos/features/ksa-anchor-churn-tracking]
        technique: reflection
        note: KsaHealth.Fault logs once and marks the accessor degraded; later commands return EOPNOTSUPP; a later success clears it; the list is published as /sim/status/accessors.
      - n: 2
        title: A validated reflection-handle class that lets each feature refuse to load
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: reflection
        note: Borrowed from patching. One class resolves every private member, tagged by feature; a missing handle disables only the features that need it.
    related: [apply-harmony-patches-independently, contain-exceptions-in-starmap-hooks, check-the-game-version, upgrade-a-mod-to-a-new-ksa-build, test-against-the-games-own-routines]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/validated-reflection-handles]

