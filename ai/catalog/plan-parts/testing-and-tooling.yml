# Plan part for testing-and-tooling. Release packaging, CI, deploy-on-build, mod.toml generation,
# logging basics, per-mod log files, warn-once logging, fault containment/self-disable, JIT warm-up and the
# runtime game-version check are owned by getting-started (deploy-a-mod-on-every-build,
# package-a-mod-release-zip, build-in-ci-without-the-game-installed, publish-a-release-from-ci,
# generate-mod-toml-from-msbuild, log-each-problem-once, profile-mod-frame-cost, check-the-game-version,
# contain-exceptions-in-starmap-hooks, warm-up-hot-code-at-load). This part owns the testing and tooling side.
#
# Orchestrator notes on likely duplicates in other parts:
#  - hot-reload-mod-shaders here == shaders: reload-a-mod-shader-in-a-running-game (merge, keep this slug or that one)
#  - compile-mod-shaders-offline here == shaders: check-mod-shaders-offline-with-glslang
#  - lightweight-perf-scopes here overlaps getting-started: profile-mod-frame-cost (this one is the implementation how-to)
#  - take-screenshots-from-code here overlaps rendering: capture-rendered-frames approach 2 and camera: hold-a-composed-camera-shot-for-screenshots
#  - validate-asset-xml-offline / check-glb-meshes-for-z-fighting-offline overlap vehicles-and-parts: validate-part-xml-before-loading (that one is the runtime serializer path)
#  - generate-mod-data-as-csharp overlaps celestials: generate-measured-atmosphere-tables-offline (that one is atmosphere-specific)
#  - script-gameplay-through-a-command-bridge is the slug kittens guessed; external-io may add file-bridge / MCP topics
category: testing-and-tooling
description: Testing and tooling for KSA mods - game-free unit tests, in-game HeadlessHarness suites, developer file bridges and MCP servers, screenshots and visual checks, offline shader and asset checks, API-surface tracking and upgrade workflows, perf scopes and diagnostics.
topics:

  # ====================================================================== unit and headless testing
  - slug: split-game-adapters-from-pure-logic
    title: Split game adapters from pure logic so most of a mod is testable
    summary: Decide where the game boundary sits - a folder, an assembly, a shared source file or a compile-gated half - so the maths, models, parsers and state machines compile and run with no KSA assembly, and only a thin adapter touches Vehicle, Universe and ImGui.
    game_types: [Brutal.Numerics.double3, KSA.Vehicle, KSA.Universe]
    engine_pointers: [current/decomp/KSA/Universe.cs GetLastSimStep (the typical adapter-side seam), Brutal.Core.Numerics double3 (the only game assembly the pure side may need)]
    lifecycle: []
    approaches:
      - n: 1
        title: Sim/ and Ksa/ folders in one project, with the boundary enforced by the test project
        mod: ksagolf
        features: [mods/ksagolf/features/headless-sim-tests, mods/ksacars/features/headless-sim-tests, mods/ksarmory/features/sim-boundary-headless-tests, mods/ksastructures/features/headless-tests-and-ci]
        technique: msbuild
        note: All KSA-free logic lives under Sim/ and everything that names a KSA type under Ksa/. Even parsing of bridge commands is a Sim type. The test project links Sim/** and references only the numerics assemblies, so a stray KSA type is a compile error. Say what belongs on each side (frame bookkeeping, physics, parsing vs reflection, ImGui, patches).
      - n: 2
        title: Separate game-free assemblies joined by ProjectReference, with the game-facing adapter beside them
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/game-free-guidance-checks, mods/ksa-advancedflightcomputer/features/solver-problem-json-replay]
        technique: msbuild
        note: Numerics and solver code in their own csprojs with no game references; single game-facing files are linked into small test executables; the serialized problem type lives on the game-free side so the mod and the offline console share it.
      - n: 3
        title: Share individual pure files with Compile Include and Compile Remove
        mod: ksaero
        features: [mods/ksaero/features/headless-model-tests, mods/ksa-deltavmap/features/offline-layout-and-math-tests]
        technique: msbuild
        note: AeroModel.cs and DeltaVMap's layout engine and math kernels are game-type-free by convention and compiled into both the mod and a test exe. The mod removes files from its own build when a harness test links them. Cheapest option for a small mod.
      - n: 4
        title: Compile-gated Game/ half joined by partial methods
        mod: gatos
        features: [mods/gatos/features/compile-gated-game-seam, mods/gatos/features/build-deploy-and-ci]
        technique: msbuild
        note: Borrowed from getting-started. The whole Game/ folder drops out of compilation when KSA.dll is absent, so CI builds and tests everything else with no game files.
    related: [unit-test-mod-logic-without-game, enforce-code-rules-with-textual-guards, isolate-game-api-access-behind-providers, build-a-mod-without-game-references, keep-physics-maths-free-of-game-types]
    borrowed_from: [mods/gatos/features/compile-gated-game-seam]

  - slug: unit-test-mod-logic-without-game
    title: Unit-test mod logic without launching the game
    summary: Build a test project that runs on any machine and in CI with no KSA install - link the mod's game-free sources, assert physical invariants and edge cases, wire it to dotnet test or a console exit code.
    game_types: [Brutal.Numerics.double3]
    engine_pointers: [Brutal.Core.Numerics (the only game assembly most pure code needs)]
    lifecycle: []
    approaches:
      - n: 1
        title: xUnit project linking a game-free Sim folder wholesale
        mod: ksagolf
        features: [mods/ksagolf/features/headless-sim-tests, mods/ksacars/features/headless-sim-tests, mods/ksarmory/features/sim-boundary-headless-tests, mods/ksastructures/features/headless-tests-and-ci]
        technique: msbuild
        note: The csproj uses Compile Include of ../src/Mod/Sim/**/*.cs and references no KSA assembly. About 290 tests in KSAGolf. tools/test.sh wraps it for the pre-push hook and CI.
      - n: 2
        title: Console test executable with invariant checks and non-zero exit
        mod: ksaero
        features: [mods/ksaero/features/headless-model-tests, mods/ksa-deltavmap/features/offline-layout-and-math-tests]
        technique: msbuild
        note: A plain Exe that source-links the model and asserts axisymmetry, force decomposition, monotonic drag, continuity and overlap invariants against synthetic trees and stock reference values. No test framework dependency; exit code is the verdict.
      - n: 3
        title: Console checks against Python reference fixtures
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/game-free-guidance-checks]
        technique: console-checks
        note: Solver outputs compared with JAX and CVXPY reference fixtures from a CI script, so numerics are checked against an independent implementation rather than against themselves.
      - n: 4
        title: NUnit suites with property tests and silent-on-success rules
        mod: purrtty
        features: [mods/purrtty/features/headless-test-suites]
        technique: nunit
        note: Four NUnit projects, FsCheck properties, game types kept out of tested layers, reference assemblies used only where cheap, and a no-fixed-sleep and silent-on-success convention.
    related: [split-game-adapters-from-pure-logic, run-mod-simulation-in-a-headless-rig, test-frame-timing-and-epoch-logic, make-time-gated-code-deterministic-in-tests, gate-slow-or-platform-specific-tests, run-repo-checks-from-a-pre-push-hook-and-ci, headless-test-harness-for-game-mods]
    borrowed_from: []

  - slug: run-mod-simulation-in-a-headless-rig
    title: Run the mod's whole simulation in a headless rig
    summary: Drive vehicles, rounds or balls through the mod's own step function in a plain test, using a rig that supplies mass, inertia and a terrain stand-in, so gameplay behaviour such as handling, gunnery and putting is regression-tested without the engine.
    game_types: [Brutal.Numerics.double3]
    engine_pointers: [current/decomp/KSA/Universe.cs GetLastSimStep (the real step the rig imitates)]
    lifecycle: []
    approaches:
      - n: 1
        title: Rigid-body rig using the engine's mass and inertia
        mod: ksacars
        features: [mods/ksacars/features/headless-sim-tests]
        technique: headless-tests
        note: BuggyDriveTests flies the car model on a rig whose mass and inertia match what the engine reports, then asserts speed, steering and suspension behaviour.
      - n: 2
        title: One driver seam shared by the game and the tests
        mod: ksarmory
        features: [mods/ksarmory/features/sim-boundary-headless-tests, mods/ksarmory/features/mod-simulated-rounds]
        technique: sim-boundary
        note: Whole engagements flown headlessly; the same RoundDriver steps rounds in game and in tests, so a test failure is a game failure. Studies are also checked for documented numbers.
      - n: 3
        title: Ball and contact physics with an epoch bookkeeping layer
        mod: ksagolf
        features: [mods/ksagolf/features/headless-sim-tests, mods/ksagolf/features/swept-hull-contact]
        technique: headless-tests
        note: Differences-only contact maths so no large coordinates or game types are needed; SkippedFrameTests prove behaviour across missed frames.
    related: [unit-test-mod-logic-without-game, test-frame-timing-and-epoch-logic, keep-physics-maths-free-of-game-types, simulate-projectiles-and-balls-outside-the-vehicle-system]
    borrowed_from: [mods/ksarmory/features/mod-simulated-rounds]

  - slug: test-frame-timing-and-epoch-logic
    title: Test frame-timing and epoch logic by varying the step
    summary: A test that always uses a constant dt cannot see phase and epoch errors. Run the same scenario at several step sizes and with skipped frames and assert the result does not depend on how time was sliced.
    game_types: [KSA.SimStep, KSA.Universe]
    engine_pointers: [current/decomp/KSA/Universe.cs GetLastSimStep, GetElapsedSeconds]
    lifecycle: [frame:after-on-frame, frame:draw-ui]
    approaches:
      - n: 1
        title: Step-size invariance and missed-frame tests
        mod: ksagolf
        features: [mods/ksagolf/features/headless-sim-tests, mods/ksagolf/features/dual-hook-frame-stepping]
        technique: headless-tests
        note: Invariance tests across dt, skipped frames and the latch that consumes each step once. SkippedFrameTests is the model.
      - n: 2
        title: Offset-phase tests for epoch handling in an engagement
        mod: ksarmory
        features: [mods/ksarmory/features/sim-boundary-headless-tests, mods/ksarmory/features/consume-applied-sim-step]
        technique: headless-tests
        note: OffsetPhaseTests shows why constant-dt tests cannot expose a one-frame epoch offset; vary the step so a phase error changes the answer.
    related: [unit-test-mod-logic-without-game, step-mod-simulation-on-sim-time, advance-mod-physics-on-simulated-time, sample-world-state-at-a-consistent-epoch]
    borrowed_from: [mods/ksarmory/features/consume-applied-sim-step, mods/ksagolf/features/dual-hook-frame-stepping]

  - slug: make-time-gated-code-deterministic-in-tests
    title: Make wall-clock-gated and asynchronous code deterministic in tests
    summary: Replace sleeps and real clocks with an injectable time source driven by simulation time or sentinel messages, so tests that cover throttles, cool-downs and background threads neither flake nor run slowly.
    game_types: [KSA.Universe]
    engine_pointers: [current/decomp/KSA/Universe.cs GetElapsedSeconds]
    lifecycle: [thread:background, event:headless-test-run]
    approaches:
      - n: 1
        title: Swap the guidance clock for simulation time in the test base class
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/headless-harness-test-mod]
        technique: headless-harness
        note: AfcTest.Run points GuidanceClock.Source at Universe.GetElapsedSeconds because the harness steps far faster than real time, and resets it in finally.
      - n: 2
        title: Sentinel flush and bounded polling instead of sleeps
        mod: purrtty
        features: [mods/purrtty/features/headless-test-suites]
        technique: nunit
        note: A sentinel written through the pipe proves everything before it was processed; waits are bounded polls, never fixed sleeps.
    related: [headless-test-harness-for-game-mods, unit-test-mod-logic-without-game, choose-a-clock-under-time-warp, test-frame-timing-and-epoch-logic]
    borrowed_from: []

  - slug: gate-slow-or-platform-specific-tests
    title: Gate slow or platform-specific tests behind an opt-in switch
    summary: Keep the default dotnet test fast and green on every machine, while heavy tests (a real VM, a real pseudo-terminal) run only when an environment variable or operating system says they can.
    game_types: []
    engine_pointers: []
    lifecycle: []
    approaches:
      - n: 1
        title: Assert.Ignore unless an environment variable is set
        mod: gatos
        features: [mods/gatos/features/build-deploy-and-ci]
        technique: nunit
        note: TestEnv gates real-VM tests on GATOS_IT=1; CI turns it on under KVM.
      - n: 2
        title: OS-gated real-PTY tests next to portable ones
        mod: purrtty
        features: [mods/purrtty/features/headless-test-suites]
        technique: nunit
        note: Real PTY tests run per operating system in the three-OS CI matrix; everything else is portable.
    related: [unit-test-mod-logic-without-game, ship-a-linux-guest-image-with-a-mod, build-in-ci-without-the-game-installed]
    borrowed_from: []

  - slug: headless-test-harness-for-game-mods
    title: Test a mod against the real game with HeadlessHarness
    summary: Ship tests as a second StarMap mod that depends on HeadlessHarness and the mod under test, so the real simulation (universe, vehicles, part trees, planners) runs without a GPU and the tests are discovered by interface and filtered by name.
    game_types: [KSA.Universe, KSA.Vehicle, KSA.CelestialSystem, KSA.FlightComputer, KSA.Program]
    engine_pointers: [current/decomp/KSA/Program.cs PrepareFrame (the order the harness SimDriver must imitate), current/decomp/KSA/Universe.cs CurrentSystem, GetElapsedSeconds, "HeadlessHarness is an external mod; its API is only described by the consumer mods"]
    lifecycle: ['event:headless-test-run']
    approaches:
      - n: 1
        title: Consumer mod with its own mod.toml, InternalsVisibleTo and a test base class
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/headless-harness-test-mod]
        technique: headless-harness
        note: 72 named tests. mod.toml depends on HeadlessHarness and the mod under test; empty [StarMapMod]; AfcTest.Run does not catch so MissingMemberException and TypeLoadException classify as API drift; fixtures spawn throwaway vehicles from saves and despawn in finally; KSA_HEADLESS_TESTS filters by exact Name.
      - n: 2
        title: Small suite of oracle tests plus a scene dump
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/headless-harness-tests]
        technique: headless-harness
        note: Smaller worked example with HintPath to a sibling HeadlessHarness checkout, Private=false, linked SceneChecks.cs and a scripts/run-headless.ps1 launcher; IHarnessTest classes for multi-star graph, staged delta-v, interstellar fuel and stock planner keys.
    related: [test-against-the-games-own-routines, test-harmony-patches-without-the-game, make-time-gated-code-deterministic-in-tests, unit-test-mod-logic-without-game, run-unattended-scenarios-and-report-a-verdict, declare-a-mod-dependency, spawn-a-vehicle-at-runtime]
    borrowed_from: []

  - slug: test-against-the-games-own-routines
    title: Use the game's own private routines as the test oracle
    summary: When a mod re-implements a stock formula (fuel needed, mass aboard, tank space, propagation), call the stock private method by reflection with identical inputs inside a headless run and demand equality, and fail loudly when a reflected handle goes missing.
    game_types: [KSA.TransferPlanner, KSA.SequencePerformanceList, KSA.PartTree, KSA.Universe]
    engine_pointers: [current/decomp/KSA/TransferPlanner.cs PlanInterstellarFuel, MassAboard, TankSpace, current/decomp/KSA/PartTree.cs]
    lifecycle: ['event:headless-test-run']
    approaches:
      - n: 1
        title: Reflected stock planner calls compared with the mod's re-implementation
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/headless-harness-tests]
        technique: reflection
        note: InterstellarFuelTest, StagedDvTest and StockPlannerKeysTest call the private stock routines and the mod's copies with the same inputs; the test fails the day either side drifts.
      - n: 2
        title: A reflection-targets test that resolves every handle against the running build
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/headless-harness-test-mod, mods/ksa-advancedflightcomputer/features/validated-reflection-handles]
        technique: reflection
        note: ReflectionTargetsTest is the drift detector; README rule - the oracle is the game's own propagation, never a re-derivation of the maths under test.
    related: [headless-test-harness-for-game-mods, degrade-one-feature-on-api-drift, upgrade-a-mod-to-a-new-ksa-build, estimate-stage-delta-v-yourself]
    borrowed_from: [mods/ksa-advancedflightcomputer/features/validated-reflection-handles]

  - slug: test-harmony-patches-without-the-game
    title: Test Harmony patches without running the game
    summary: Apply the real production patch code to stand-in KSA types in a console test, run a patch-apply check over a new game build offline, or install a test-scoped Harmony owner inside a headless run.
    game_types: [KSA.Program, KSA.Part, KSA.Universe, KSA.SimStep, KSA.UncompressedSave]
    engine_pointers: [current/decomp/KSA/Program.cs PrepareFrame, HarmonyLib.PatchProcessor.GetOriginalInstructions, HarmonyLib.Harmony.CreateClassProcessor]
    lifecycle: ['frame:prepare', 'event:save', 'event:load', 'event:headless-test-run']
    approaches:
      - n: 1
        title: Stand-in KSA types in the test, production patches linked in
        mod: unscience
        features: [mods/unscience/features/unscience-managed-test-harnesses]
        technique: harmony-prefix
        note: Eighteen console projects declare namespace KSA stand-ins that mirror member names, mark patched methods NoInlining, and apply the real transpilers and prefixes to a copy of PrepareFrame. Checks timing, save and patch logic with no game start.
      - n: 2
        title: Throwaway console app that runs CreateClassProcessor on every patch class
        mod: purrtty
        features: [mods/purrtty/features/ksa-upgrade-coupling-review-skill]
        technique: harmony-prefix
        note: Loads the built mod DLL and the new game DLLs offline; register an AssemblyLoadContext Resolving probe before JIT-compiling methods that mention game types; patch the PE machine field in a scratch KSA.dll copy for arm64 hosts.
      - n: 3
        title: IL-level transpiler tests and test-scoped Harmony owners inside a headless run
        mod: ksa-advancedflightcomputer
        features: [mods/ksa-advancedflightcomputer/features/headless-harness-test-mod]
        technique: harmony-transpiler
        note: ManeuverTranspilerTest runs transpilers over PatchProcessor.GetOriginalInstructions of the current game method; tests that need a feature's hooks apply them under an IDisposable scope with its own Harmony id and remove them afterwards.
    related: [headless-test-harness-for-game-mods, apply-harmony-patches-independently, upgrade-a-mod-to-a-new-ksa-build, pin-harmony-targets-at-compile-time]
    borrowed_from: []

