  # ====================================================================== API surface, builds and upgrades
  - slug: decompile-the-game-for-reference
    title: Keep a searchable decompiled copy of the game next to your mod
    summary: Decompile the game's assemblies with ilspycmd into a gitignored folder stamped with the game version, so you, your tools and your AI assistant can grep real engine code, and diff two builds when the game updates.
    game_types: []
    engine_pointers: [current/decomp (the ksa-game-assemblies mirror layout), version.json]
    lifecycle: []
    approaches:
      - n: 1
        title: Refresh-Decompiled.ps1 with a VERSION stamp and assistant instructions
        mod: compendium
        features: [mods/compendium/features/decompiled-source-refresh]
        technique: decompiling
        note: ilspycmd -p per selected assembly into a gitignored folder; VERSION.txt stamp; .github/copilot-instructions.md tells assistants to search it.
      - n: 2
        title: Pinned ilspycmd decompile-assemblies.sh for diffing builds
        mod: ksarmory
        features: [mods/ksarmory/features/api-surface-tracking, mods/ksacars/features/api-surface-pinning-and-diff, mods/ksagolf/features/api-surface-and-assembly-lock]
        technique: decompiling
        note: A pinned ilspycmd version so both builds decompile identically, then ksa-api-diff.sh restricts the diff to the files and members the mod's surface touches.
    related: [track-the-game-api-your-mod-uses, upgrade-a-mod-to-a-new-ksa-build, detect-a-new-ksa-build-automatically]
    borrowed_from: []

  - slug: track-the-game-api-your-mod-uses
    title: List exactly which game APIs your mod binds to
    summary: Read the TypeRef and MemberRef tables of your built DLL with System.Reflection.Metadata into a committed document that CI checks, so an upgrade review starts from the real dependency list rather than from memory.
    game_types: []
    engine_pointers: [System.Reflection.Metadata PEReader, MetadataReader, ISignatureTypeProvider]
    lifecycle: []
    approaches:
      - n: 1
        title: tools/apisurface extractor and docs/KSA-API-SURFACE.md checked in CI
        mod: ksarmory
        features: [mods/ksarmory/features/api-surface-tracking, mods/ksacars/features/api-surface-pinning-and-diff, mods/ksagolf/features/api-surface-and-assembly-lock]
        technique: metadata-analysis
        note: Only assemblies named KSA, Brutal, Bepu or StarMap are kept; always rebuild first so a stale DLL cannot report a false match; --check mode in CI. nameof and reflection by string are invisible to it - see pin-harmony-targets-at-compile-time.
    related: [pin-harmony-targets-at-compile-time, decompile-the-game-for-reference, upgrade-a-mod-to-a-new-ksa-build, pin-the-game-build-with-a-hashed-lock]
    borrowed_from: []

  - slug: pin-harmony-targets-at-compile-time
    title: Turn a reflected Harmony target into a compile-time dependency
    summary: A patch target found by name leaves no member reference. Add a never-called method that calls the target directly, so a signature change in the game becomes a compile error and appears in the API surface.
    game_types: [KSA.Vehicle, KSA.Program, KSA.SunbloomRenderer, KSA.PartModelRenderer]
    engine_pointers: [current/decomp/KSA/Vehicle.cs PrepareWorker, current/decomp/KSA/Program.cs OnGameLoaded]
    lifecycle: ['startup:all-mods-loaded']
    approaches:
      - n: 1
        title: Private PinTheSignature method per hook class
        mod: ksarmory
        features: [mods/ksarmory/features/api-surface-tracking, mods/ksacars/features/api-surface-pinning-and-diff]
        technique: harmony-prefix
        note: Works only for accessible members; a patch on a private method such as Program.OnFrameCelestials cannot be pinned and is resolved by name with a logged fallback.
    related: [track-the-game-api-your-mod-uses, test-harmony-patches-without-the-game, apply-harmony-patches-independently, degrade-one-feature-on-api-drift]
    borrowed_from: []

