  - slug: record-diagnostics-without-flooding-the-frame-or-the-log
    title: Record flight telemetry to CSV and log state only when it changes
    summary: Buffer per-step rows in memory and flush in batches, never throw into the sim, limit whole-plan snapshots by rate, and log a state only when a bucketed signature changes, so a long guidance run leaves a readable record and no frame hitches.
    game_types: [KSA.Vehicle, KSA.Universe, Brutal.Logging.LogCategory]
    engine_pointers: [current/decomp/KSA/Vehicle.cs PrepareWorker, Brutal.Logging DefaultCategory]
    lifecycle: [frame:dispatch-solvers, frame:draw-ui]
    approaches:
