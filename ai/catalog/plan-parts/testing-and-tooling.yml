        technique: msbuild
        note: The lock holds only names and digests, safe in a public repo; check-assemblies.sh derives the list from the csproj references and has --update and --game modes; Directory.Build.props resolves KsaDllDir first-match-wins with an explicit error; CI checks out the private mirror with a read-only deploy key and skips with a notice on forks.
