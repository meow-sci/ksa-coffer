  # ====================================================================== in-game diagnostics
  - slug: dump-state-from-a-running-game-once
    title: Dump validation data from the running game exactly once
    summary: In debug builds, run a one-shot dump from a frame hook once the universe exists - delta-v ladders, visual trees, layouts - so the numbers can be compared with stock and the same formatting code is shared with offline tests.
    game_types: [KSA.Universe, KSA.CelestialSystem, KSA.Celestial, Brutal.Logging.DefaultCategory]
    engine_pointers: [current/decomp/KSA/Universe.cs CurrentSystem, Brutal.Logging DefaultCategory]
    lifecycle: [frame:draw-ui]
    approaches:
      - n: 1
        title: Latched dumps from StarMapAfterGui behind a DebugConfig flag
        mod: ksa-deltavmap
        features: [mods/ksa-deltavmap/features/in-game-validation-dumps-and-perf]
        technique: starmap-lifecycle
        note: Return early unless the flag is set, the latch is clear and Universe.CurrentSystem is non-null; run inside try/catch that logs once so the render path never unwinds. Output capped per tree and written to a configurable directory with log-only fallback.
    related: [dump-layouts-and-geometry-to-svg, gate-developer-only-features, lightweight-perf-scopes, log-each-problem-once]
    borrowed_from: []

