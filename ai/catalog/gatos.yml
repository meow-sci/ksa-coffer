mod: gatos
repo: gatOS
ref: b88c28588e013841cfec58a1b3a09fcbd2cbc47e
summary: gatOS boots a real Alpine Linux guest in a QEMU microVM as a child process of KSA and lets players open
  shell sessions into it through the purrTTY terminal mod. Live vessel telemetry and controls are exposed in the
  guest as a 9P2000.L /sim filesystem served from inside the game process, and the same snapshot/command model is
  projected over HTTP (with SSE and OpenAPI), an embedded MQTT broker, an MCP server for AI agents and an optional
  virtio-serial port speaking NDJSON, NMEA, CCSDS and SCPI. On top it adds a programmable camera, a timed command
  scheduler, vehicle and EVA paint, projected sticker decals, ground-clutter texture overrides, a Kitty-graphics
  screen stream, FMOD audio playback, IVA cabin physics in its own Bepu world, FX-editor access, particle bursts
  and several cheats, with a strict game-thread/solver-phase write discipline and per-binding churn tracking across
  KSA builds.
