mod: blasto
repo: blasto
ref: 21f7657c42534774001acabcf93289e9412c5242
summary: StarMap mod that accumulates persistent body-fixed exhaust marks, blends them into private
  terrain material pipelines, emits owned native dust and saves validated sidecar state; includes
  live tuning and portable validation.
