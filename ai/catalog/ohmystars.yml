mod: ohmystars
repo: OhMyStars
ref: 4bb602e3bfe36bcd3670b71b88bf644fe95fa407
summary: >-
  Oh My Stars (nanonestor; a continuation of DavidK0's StellariumCatalog) is a StarMap mod that draws
  constellations on KSA's sky: asterism lines and names from 53 legacy Stellarium sky cultures, IAU
  boundaries from Pierre Barbier's boundary data, star names and an RA/Dec grid. Catalog RA/Dec is
  rotated by the J2000 obliquity into the game's ecliptic axes, placed on the same 19.5-unit
  camera-centred sphere the game uses for star sprites, projected with Camera.EgoToScreen and drawn in
  a transparent input-less full-screen ImGui window from StarMapAfterGui, with a CPU ray-sphere
  occlusion test against bodies and vehicles. It adds an AT-HYG star browser, a window-to-star
  pointer, a custom navball marker that mirrors the stock marker shader, an orient-to-star mode that
  writes a Custom EclBody flight-computer target from a Vehicle.PrepareWorker prefix (with prefixes on
  every stock attitude path to hand control back), and a Star Editor that prefixes
  InstancedStarTechnique.AddInstance to restyle stars and swaps star binaries at runtime via
  reflection. Settings persist in settings.ini beside the DLL; ModMenu provides the menu entry.
features:
  - id: mods/ohmystars/features/sky-overlay-lines-and-labels
    title: Constellation lines and labels on the sky
    category: rendering
    submod: null
    summary: >-
      RA/Dec to J2000 equatorial to ecliptic (same rotation as GalacticPlane.EquatorialToEcliptic),
      times 19.5 on the camera-centred star sphere, Camera.EgoToScreen plus the ImGui main viewport
      origin, drawn into a NoInputs full-screen window's draw list; straight screen lines are exact
      great circles under the perspective (gnomonic) projection.
    novelty: high
    techniques: [imgui-drawlist, starmap-lifecycle, sky-projection, gnomonic-projection]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    hooks: ["starmap StarMapAllModsLoaded", "starmap StarMapAfterGui"]
    game_types: [KSA.Camera, KSA.Program, KSA.GalacticPlane, KSA.InstancedStarTechnique, KSA.Universe, Brutal.ImGuiApi.ImGui, Brutal.ImGuiApi.ImDrawListExtensions]
    key_paths: [src/Math.cs, src/StellariumRenderer.cs, src/SkyCulturesRenderer.cs, src/IAUConstellationsRenderer.cs]
    howto_topics:
      - slug: draw-lines-on-the-sky
        title: Draw lines and labels on the sky with ImGui
        note: ego-space directions on the 19.5 star sphere, EgoToScreen, viewport offset, skip NaN like Universe.DrawGalacticGrid
      - slug: celestial-coordinates-to-game-frame
        title: Convert RA/Dec and galactic coordinates to KSA's ecliptic frame
        note: J2000 obliquity rotation about X matches GalacticPlane.EquatorialToEcliptic
      - slug: world-to-screen-projection
        title: Project world and sky positions to screen pixels
        note: Camera.EgoToScreen returns NaN behind the camera; add the viewport position
      - slug: fullscreen-overlay-window
        title: Draw a full-screen HUD overlay that does not steal input
        note: NoInputs/NoBackground window vs background or foreground draw lists
      - slug: great-circles-on-screen
        title: Draw great-circle arcs and small circles on the sky
        note: gnomonic projection keeps great circles straight; subdivide small circles
  - id: mods/ohmystars/features/overlay-occlusion-by-bodies
    title: Occlusion by bodies
    category: rendering
    submod: null
    summary: >-
      Walks from the camera-followed object up to the system root, then rebuilds a per-frame list of
      ego-space spheres for every body (MeanRadius) and every vehicle orbiting a body
      (BoundingSphereRadiusBody) in that system, and hides any overlay point whose view ray hits one,
      skipping spheres that contain the camera.
    novelty: medium
    techniques: [imgui-drawlist, cpu-occlusion]
    lifecycle: [frame:draw-ui]
    hooks: ["starmap StarMapAfterGui"]
    game_types: [KSA.Camera, KSA.IParentBody, KSA.IOrbiter, KSA.IRadius, KSA.Vehicle, KSA.StellarBody]
    key_paths: [src/StellariumRenderer.cs]
    howto_topics:
      - slug: occlude-imgui-overlays-behind-planets
        title: Hide ImGui overlays behind planets and vessels
        note: ray-sphere test in ego space via Camera.GetPositionEgo
      - slug: walk-the-celestial-hierarchy
        title: Walk the celestial body and vehicle hierarchy
        note: IOrbiter.Parent up to the root StellarBody, IParentBody.Children down
  - id: mods/ohmystars/features/ra-dec-grid
    title: RA/Dec grid
    category: rendering
    submod: null
    summary: >-
      Celestial grid built lazily as 1-degree arcs, culled with a clip-space frustum test inflated by
      15%, occluded per segment, with centred chart labels and first-come overlap rejection.
    novelty: medium
    techniques: [imgui-drawlist, sky-projection, label-collision-avoidance]
    lifecycle: [frame:draw-ui]
    hooks: ["starmap StarMapAfterGui"]
    game_types: [KSA.Camera, Brutal.ImGuiApi.ImGui]
    key_paths: [src/SkyMarkingsRenderer.cs]
    howto_topics:
      - slug: draw-a-celestial-coordinate-grid
        title: Draw a celestial or galactic coordinate grid on the sky
        note: compare with the stock skygrid command (Universe.DrawGalacticGrid)
      - slug: screen-label-declutter
        title: Avoid overlapping screen labels in ImGui overlays
        note: CalcTextSize rectangles and a per-frame drawn list
  - id: mods/ohmystars/features/stellarium-sky-cultures
    title: Stellarium sky cultures
    category: celestials
    submod: null
    summary: >-
      Parses legacy Stellarium constellationship.fab and constellation_names files from 53 culture
      folders, resolves segments and centroid labels on switch, and filters segments to stars whose
      float direction bits match the stock Core star binary.
    novelty: medium
    techniques: [data-file-parsing, starmap-lifecycle]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    hooks: ["starmap StarMapAllModsLoaded", "starmap StarMapBeforeGui"]
    game_types: [KSA.ModLibrary, KSA.Mod]
    key_paths: [src/SkyCulturesRenderer.cs, skycultures/modern/constellationship.fab]
    howto_topics:
      - slug: load-stellarium-sky-cultures
        title: Load Stellarium constellation data into a mod
        note: .fab line and names formats; HIP-keyed joins
      - slug: read-stock-star-binaries
        title: Read KSA's star binary files
        note: int32 count then 16-byte records (3 floats + scale + RGB), as Mod.LoadStarBinaries
  - id: mods/ohmystars/features/hyg-star-catalog
