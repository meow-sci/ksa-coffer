    novelty: medium
    techniques: [imgui-window, game-popup-subclass]
    lifecycle: [frame:draw-ui]
    hooks: ["starmap StarMapBeforeGui"]
    game_types: [KSA.Popup, KSA.PopupButton, KSA.PopupButtonKind, KSA.ConfirmActionPopup, KSA.TimedAlert, KSA.Alert, KSA.ConsoleStyle, KSA.Program]
    key_paths: [src/StarsEditWindow.cs]
    howto_topics:
      - slug: game-styled-confirmation-popup
        title: Show a game-styled confirmation popup
        note: subclass KSA.Popup or call ConfirmActionPopup.Create; drawn by Popup.DrawAll in OnDrawUiFrame
      - slug: in-game-toast-notifications
        title: Show short in-game toast notifications
        note: TimedAlert.Create and CreateWarning, drawn by Alert.DrawAll; durations in player time
  - id: mods/ohmystars/features/mod-root-and-packaging
