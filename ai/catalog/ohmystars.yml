    novelty: medium
    techniques: [data-file-parsing, imgui-window, starmap-lifecycle]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    hooks: ["starmap StarMapAllModsLoaded", "starmap StarMapBeforeGui", "starmap StarMapAfterGui"]
    game_types: [KSA.Program, KSA.Camera, KSA.Vehicle, Brutal.ImGuiApi.ImGui]
    key_paths: [src/SkyCulturesRenderer.cs, src/OhMyStarsWindow.cs, src/athyg_32_reduced_m10.csv]
    howto_topics:
      - slug: bundle-a-star-catalog
        title: Bundle and query a real star catalog
        note: HIP keys, J2000 to ecliptic, parsecs to light years
      - slug: searchable-imgui-combo
        title: Build a searchable ImGui combo box
        note: InputText inside BeginCombo with ImInputString buffers
  - id: mods/ohmystars/features/star-pointer
