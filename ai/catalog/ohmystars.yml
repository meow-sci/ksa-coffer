  - id: mods/ohmystars/features/orient-to-star
    title: Orient a vessel to a star
    category: flight-and-orbits
    submod: null
    summary: >-
      Writes AttitudeMode Auto, AttitudeFrame EclBody, AttitudeTrackTarget Custom and Euler angles
      solved from the star direction (kitten-specific up axis), re-applied in a Vehicle.PrepareWorker
      prefix right before the worker copies the flight computer; toggling off restores the previous
      mode and rate command on the next dispatch.
    novelty: high
    techniques: [harmony-prefix, flight-computer-target]
    lifecycle: [frame:draw-ui, frame:dispatch-solvers, physics:vehicle-solver]
    hooks: ["starmap StarMapBeforeGui", "harmony-prefix KSA.Vehicle.PrepareWorker"]
    game_types: [KSA.Vehicle, KSA.FlightComputer, KSA.VehicleReferenceFrameEx, KSA.KittenEva, KSA.VehicleUpdateState, KSA.VehicleUpdateData, KSA.Universe]
    key_paths: [src/OhMyStarsWindow.cs, src/StarOrientationObserver.cs]
    howto_topics:
      - slug: point-a-vessel-in-a-direction
        title: Point a vessel at an arbitrary direction with the stock flight computer
        note: Custom track target in EclBody; BODY2UPFRAME axis convention
      - slug: drive-the-flight-computer-each-tick
        title: Feed the flight computer every physics step from the main thread
        note: prefix Vehicle.PrepareWorker before PrepareFromVehicle copies the flight computer
  - id: mods/ohmystars/features/attitude-mode-handoff-patches
    title: Attitude-mode hand-off patches
    category: patching
    submod: null
    summary: >-
      Prefixes on FlightComputer.TrackTarget/RateHold/SetNullRot, Vehicle.SetEnum/ToggleEnum/
      SetStabilization, KittenEva.HandleKittenAction and PhysicsBubble MMU methods (via TargetMethods)
      release the mod's custom target and restore CustomAttitudeTarget before rate hold reads it. Input
      paths run at frame:input; SetNullRot (on the worker's flight computer copy) and the MMU methods
      also run on vehicle-solver workers, where the prefixes touch the mod's unsynchronized collections.
    novelty: medium
    techniques: [harmony-prefix, reflection, harmony-target-methods]
    lifecycle: [startup:all-mods-loaded, frame:input, frame:dispatch-solvers, physics:vehicle-solver]
    hooks:
      - "harmony-prefix KSA.Vehicle.PrepareWorker"
      - "harmony-prefix KSA.FlightComputer.TrackTarget"
      - "harmony-prefix KSA.FlightComputer.RateHold"
      - "harmony-prefix KSA.FlightComputer.SetNullRot"
      - "harmony-prefix KSA.Vehicle.SetStabilization"
      - "harmony-prefix KSA.Vehicle.SetEnum"
      - "harmony-prefix KSA.Vehicle.ToggleEnum"
      - "harmony-prefix KSA.KittenEva.HandleKittenAction"
      - "harmony-prefix KSA.PhysicsBubble.ApplyMmuAttitudeTarget"
      - "harmony-prefix KSA.PhysicsBubble.ResetMmuAttitudeTarget"
    game_types: [KSA.FlightComputer, KSA.Vehicle, KSA.KittenEva, KSA.PhysicsBubble, KSA.VehicleUpdateState, KSA.VehicleUpdateData, KSA.InputEvents, KSA.GaugeButtonFlightComputer]
    key_paths: [src/StarOrientationObserver.cs, src/OhMyStarsWindow.cs]
    howto_topics:
      - slug: detect-attitude-mode-changes
        title: Detect when the player changes attitude mode
        note: SetEnum/ToggleEnum catch-all plus direct AttitudeMode writers
      - slug: harmony-and-aggressive-inlining
        title: Patch methods marked AggressiveInlining
        note: prefixes on inlinable FlightComputer methods may be bypassed; patch the callers too; KSA.dll is built with DisableOptimizations
      - slug: harmony-prefixes-on-worker-threads
        title: Know which thread a Harmony prefix runs on
        note: the same method can be called on the main thread and on vehicle-solver workers (SetNullRot); guard shared state
      - slug: harmony-target-methods-private
        title: Patch private or protected game methods by name
        note: TargetMethods with AccessTools.Method and __args
  - id: mods/ohmystars/features/star-instance-restyle-patch
    title: Star instance restyle patch
    category: rendering
    submod: null
    summary: >-
      StarMapBeforeMain prefix on InstancedStarTechnique.AddInstance rewrites each star's size and
      colour bytes and skips adds when full; a constructor prefix (ref int __4, dormant in this build)
      and reflective buffer re-creation resize the instance capacity at runtime, disposing the old GPU
      buffer immediately rather than through RetiredResourceQueue.
    novelty: high
    techniques: [harmony-prefix, reflection, vulkan-buffer]
    lifecycle: [startup:starmap-before-main, startup:all-mods-loaded, frame:draw-ui]
    hooks:
      - "starmap StarMapBeforeMain"
      - "harmony-prefix KSA.InstancedStarTechnique.AddInstance"
      - "harmony-prefix KSA.InstancedStarTechnique..ctor"
      - "reflection KSA.InstancedRenderTechnique._maxInstances"
      - "reflection KSA.InstancedStarTechnique.CreateInstanceBuffer"
    game_types: [KSA.InstancedStarTechnique, KSA.InstancedRenderTechnique, KSA.ModLibrary, KSA.Mod, KSA.Program, KSA.Rendering.RetiredResourceQueue]
    key_paths: [src/StarsEditPatcher.cs, src/StarsEditWindow.cs]
    howto_topics:
      - slug: restyle-background-stars
        title: Change the size and colour of the background stars
        note: prefix AddInstance before Program builds and populates the star technique
      - slug: harmony-constructor-argument-rewrite
        title: Change a constructor argument with a Harmony prefix
        note: positional __N injection on a manually patched ConstructorInfo
      - slug: resize-game-instance-buffers
        title: Resize a game instanced-render buffer at runtime
        note: reflection on readonly fields and protected CreateInstanceBuffer; frames in flight
      - slug: safe-gpu-resource-replacement
        title: Replace a game GPU buffer without breaking frames in flight
        note: retire the old buffer with KSA.Rendering.RetiredResourceQueue instead of disposing it
  - id: mods/ohmystars/features/star-binary-switcher
    title: Star binary switcher
    category: celestials
    submod: null
    summary: >-
      Lists *.bin files in the mod and Core folders, rewrites Mod.StarBinaries by reflection, resets
      and reloads the star technique with proportional quotas and stride sampling, and keeps named
      presets in starsedit_settings.ini with game Popup confirmations. Only preset save/use/delete
      writes the file, and a saved binary selection is never re-applied at start-up.
    novelty: high
    techniques: [reflection, imgui-window, ini-config]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    hooks:
      - "starmap StarMapAllModsLoaded"
      - "starmap StarMapBeforeGui"
      - "reflection KSA.ModLibrary.Lookup"
      - "reflection KSA.Mod.StarBinaries"
      - "reflection KSA.Program._starStarTechnique"
    game_types: [KSA.ModLibrary, KSA.Mod, KSA.Program, KSA.InstancedStarTechnique, KSA.ViewportRegistry, KSA.Popup, KSA.TimedAlert]
    key_paths: [src/StarsEditWindow.cs]
    howto_topics:
      - slug: reload-the-star-field-at-runtime
        title: Reload or replace the star field at runtime
        note: ResetInstances, AddInstance per record, UpdateInstanceBuffer per viewport
      - slug: enumerate-loaded-mods
        title: Enumerate loaded mods and their manifest data
        note: ModLibrary.Lookup is internal; reflection on GetList
      - slug: game-styled-confirmation-popup
        title: Show a game-styled confirmation popup
        note: subclass KSA.Popup; the constructor self-registers with Popup.DrawAll
  - id: mods/ohmystars/features/ini-settings-persistence
    title: settings.ini persistence
    category: persistence
    submod: null
    summary: >-
      Flat key=value settings.ini beside the DLL, loaded at all-mods-loaded and rewritten on each
      change (and when window open state changes), while plain ImGui.Begin keeps window geometry in
      imgui.ini; the build overwrites the installed copy with shipped defaults.
    novelty: low
    techniques: [ini-config, imgui-window]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui]
    hooks: ["starmap StarMapAllModsLoaded", "starmap StarMapBeforeGui"]
    game_types: [KSA.ConsoleStyle, Brutal.ImGuiApi.ImGui]
    key_paths: [src/OhMyStarsWindow.cs, src/settings.ini, src/OhMyStars.csproj]
    howto_topics:
      - slug: persist-mod-settings
        title: Persist mod settings to a file
        note: debounce writes; temp file and move for atomicity
      - slug: persist-imgui-window-state
        title: Persist ImGui window position, size and visibility
        note: imgui.ini keeps geometry unless NoSavedSettings; visibility needs your own file
  - id: mods/ohmystars/features/save-scoped-settings-sidecar
    title: Save-scoped settings sidecar
    category: persistence
    submod: null
    summary: >-
      Postfixes on UncompressedSave.Load and Make (which UncompressedSave.Overwrite also calls) track
      the save id and write an atomic per-save TOML-like file into the save folder through a generic
      store; the settings type is empty in this version.
    novelty: low
    techniques: [harmony-postfix, save-sidecar]
    lifecycle: [startup:all-mods-loaded, event:save, event:load]
    hooks:
      - "harmony-postfix KSA.UncompressedSave.Load"
      - "harmony-postfix KSA.UncompressedSave.Make"
    game_types: [KSA.UncompressedSave, KSA.GameSave, KSA.GameSaves, KSA.Constants]
    key_paths: [src/SaveLoadObserver.cs, src/SaveScopedSettingsStore.cs, src/Settings.cs]
    howto_topics:
      - slug: save-sidecar-files
        title: Store mod data next to a KSA save
        note: a Make postfix also covers overwrites (Overwrite calls Make); patch Load; use GameSaves.SaveFolderPath
  - id: mods/ohmystars/features/modmenu-entry-and-console-style-windows
    title: ModMenu entry and game-styled windows
    category: ui
    submod: null
    summary: >-
      A [ModMenuEntry] static method toggles two windows drawn from StarMapBeforeGui with plain
      ImGui.Begin plus ConsoleStyle/ConsoleWidgets styling (avoiding ConsoleStyle.BeginWindow's
      NoSavedSettings), custom title-bar-coloured tab buttons and indented collapsible sections.
    novelty: medium
    techniques: [imgui-window, imgui-menu, starmap-lifecycle]
    lifecycle: [frame:draw-ui]
    hooks: ["starmap StarMapBeforeGui", "modmenu ModMenuEntry"]
    game_types: [KSA.ConsoleStyle, KSA.ConsoleWidgets, KSA.ImGuiDisabledScope, KSA.Program, Brutal.ImGuiApi.ImGui]
    key_paths: [src/OhMyStarsEntryPoint.cs, src/OhMyStarsWindow.cs, src/ModMenu.Attributes.dll]
    howto_topics:
      - slug: register-with-modmenu
        title: Add a menu entry through ModMenu
        note: ModMenuEntry attribute from a locally referenced ModMenu.Attributes.dll
      - slug: game-styled-imgui-windows
        title: Make ImGui windows look like KSA's console UI
        note: ConsoleStyle.PushWidgetStyle and ConsoleWidgets rows without BeginWindow
  - id: mods/ohmystars/features/game-styled-popups-and-toasts
    title: Game-styled popups and toasts
    category: ui
    submod: null
    summary: >-
      ChoicePopup subclasses KSA.Popup and draws with the protected console-modal helpers the stock
      ConfirmActionPopup uses (BeginConsoleModal, CenteredWrappedText, DrawConsoleButtonRow); the
