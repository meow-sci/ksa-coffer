  - id: mods/ksagolf/features/terrain-height-queries
    title: Terrain height queries off the engine's height field
    category: celestials
    submod: null
    summary: >-
      Everything built on Celestial.GetTerrainHeightFromDirCcf/Cce: a centre-plus-radius ground test
      with a sea clamp, a height-field seam, a closed-form-band ridge mask, a gradient slope
      reading, a local east/north frame and a real terrain ceiling, plus what accurate true vs false
      actually changes.
    novelty: medium
    techniques: [custom-physics, closed-form-geometry, decorator-cache, headless-tests]
    lifecycle: [frame:draw-ui]
    hooks: ["starmap StarMapAfterGui"]
    game_types: [KSA.Celestial, KSA.Astronomical, KSA.CelestialSystem, KSA.Universe, KSA.Rendering.Water.Data.OceanReference, KSA.TerrainRadiusCache, KSA.PhysicsEnvironment, KSA.TerrainImpactFinder, KSA.TerrainPatch]
    key_paths: [src/KSAGolf/Ksa/GroundTest.cs, src/KSAGolf/Ksa/TerrainHeights.cs, src/KSAGolf/Sim/IGroundTest.cs, src/KSAGolf/Sim/CoarseGroundTest.cs, src/KSAGolf/Sim/ITerrainHeights.cs, src/KSAGolf/Sim/TerrainMask.cs, src/KSAGolf/Sim/LineOfSight.cs, src/KSAGolf/Sim/GroundSlope.cs, src/KSAGolf/Sim/TerrainMap.cs, docs/KSA-TERRAIN.md]
    howto_topics:
