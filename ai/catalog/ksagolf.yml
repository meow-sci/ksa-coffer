  - id: mods/ksagolf/features/degrading-harmony-patches
    title: Degrading Harmony patches with per-feature ids and signature pins
    category: patching
    submod: null
    summary: >-
      Six static patch classes, each under its own Harmony id, look their targets up defensively,
      log once and stand down instead of throwing, are pinned into the API record by never-called
      calls, and are removed by a ten-fault limit; StarMapUnload unpatching is a no-op because
      StarMap's id-less UnpatchAll has already run.
    novelty: medium
    techniques: [harmony-prefix, harmony-postfix, reflection, starmap-lifecycle]
    lifecycle: [startup:all-mods-loaded, frame:draw-ui, frame:after-on-frame]
    hooks: ["starmap StarMapAllModsLoaded", "starmap StarMapAfterGui", "starmap StarMapAfterOnFrame", "starmap StarMapUnload"]
    game_types: [KSA.Program, KSA.Universe, KSA.SuperMeshRenderSystem, KSA.ConstraintSim, KSA.KittenEva, KSA.KittenLocomotion]
    key_paths: [src/KSAGolf/Ksa/WorldReloadHook.cs, src/KSAGolf/Ksa/PreRenderHook.cs, src/KSAGolf/Ksa/ViewDrawHook.cs, src/KSAGolf/Ksa/FirstPersonHook.cs, src/KSAGolf/Ksa/PadSurface.cs, src/KSAGolf/Ksa/CourseCollider.cs, src/KSAGolf/Ksa/KSAGolfMod.cs]
    howto_topics:
      - slug: optional-harmony-patches-that-degrade
        title: Make every Harmony patch optional and self-reporting
        note: own Harmony id per feature, AccessTools lookup with logged degrade, never-throwing bodies that null their delegate
      - slug: remove-harmony-patches-at-runtime
        title: Remove a mod's Harmony patches during play
        note: UnpatchAll(ownId) from a main-thread hook; StarMapUnload runs only at exit after StarMap's id-less UnpatchAll
      - slug: pin-patched-members-for-api-checks
        title: Make a game signature change a build error for a patched method
        note: a never-called method that really calls the target emits a MemberRef; nameof does not
