mod: ksagolf
repo: KSAGolf
ref: f3e6ab72b5b963f615cb4ed41f7765a7bce42688
summary: >-
  KSAGolf (LaurensDeV) is a golf mod foundation for Kitten Space Agency built on StarMap and
  Harmony. Despite the README's 'nothing to play yet', the code implements putting (the flown kitten
  carries a putter, drops a ball, steps up with G and swings with the mouse, optionally in first
  person) and a top-down minigolf course builder whose pieces the ball banks off and a kitten stands
  on. Around that it carries reusable foundation: one-step-per-frame stepping on KSA's applied sim
  step from three hooks, a two-instant draw anchor against the 29.8 km/s ecliptic carrier, a
  FixedController subclass swapped into the main viewport, kitten posing through IAnimProcessor and
  props on cosmetic attachments, mesh draws in a ClearBuckets postfix, Bepu clutter statics and
  launch-site collider copies, terrain queries, a file command bridge with an MCP server and
  screenshot manifests, and a full KSA-update, test, package and release toolchain. Built against
  KSA 2026.9.22.5482; much of the gameplay is unit-tested but unverified in game per the repo.
